<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>どっちがお得</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お得">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --main:#0f766e; --ink:#1f2328; --sub:#5b6470; --line:#d5dbe1; --bg:#f4f6f7; --win:#e6f6f0; --cur:#fff3d6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans","BIZ UDPGothic",sans-serif; overscroll-behavior:none; user-select:none; -webkit-user-select:none; padding-top:env(safe-area-inset-top); }
  button { font:inherit; color:inherit; border:0; background:none; touch-action:manipulation; }
  header { display:flex; align-items:center; gap:6px; padding:8px 10px; background:#fff; border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:6px; flex:1; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:18px; background:#fff; color:var(--sub); font-size:14px; white-space:nowrap; }
  .tab.on { background:var(--main); border-color:var(--main); color:#fff; font-weight:700; }
  .new { flex:none; min-height:36px; padding:0 12px; border-radius:18px; background:#e7f3f1; color:var(--main); font-size:14px; font-weight:700; }
  main { flex:1; min-height:0; overflow-y:auto; padding:8px 10px; }
  .row { display:grid; grid-template-columns:30px 1fr 1fr 1.05fr; gap:6px; align-items:stretch; margin-bottom:6px; padding:6px; border:2px solid transparent; border-radius:12px; background:#fff; }
  .row.best { border-color:var(--main); background:var(--win); }
  .name { display:flex; align-items:center; justify-content:center; width:30px; font-weight:700; color:var(--sub); }
  .row.best .name { color:var(--main); }
  .cell { display:flex; flex-direction:column; justify-content:center; min-height:54px; padding:2px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; text-align:right; }
  .cell small { font-size:11px; color:var(--sub); text-align:left; }
  .cell b { font-size:23px; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; min-height:26px; }
  .cell.cur { border:2px solid #e8930c; background:var(--cur); }
  .cell.cur b::after { content:""; display:inline-block; width:2px; height:20px; margin-left:2px; vertical-align:-3px; background:#e8930c; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .res { display:flex; flex-direction:column; justify-content:center; align-items:flex-end; min-width:0; padding-right:2px; }
  .res b { font-size:17px; font-variant-numeric:tabular-nums; }
  .res small { font-size:11px; color:var(--sub); }
  .row.best .res b { color:var(--main); }
  .crown { font-size:11px; font-weight:700; color:#fff; background:var(--main); border-radius:4px; padding:0 5px; margin-bottom:1px; }
  .rm { display:none; }
  .answer { margin:8px 0; padding:10px 12px; border-radius:12px; background:var(--main); color:#fff; font-size:17px; font-weight:700; text-align:center; }
  .answer small { display:block; font-size:13px; font-weight:400; opacity:.92; }
  .answer.wait { background:#e9edef; color:var(--sub); font-weight:400; font-size:15px; }
  .count { display:flex; align-items:center; gap:6px; margin:6px 0 2px; font-size:13px; color:var(--sub); }
  .count button { min-width:44px; min-height:36px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:15px; color:var(--ink); }
  .count button.on { background:var(--main); border-color:var(--main); color:#fff; font-weight:700; }
  .unit { margin-left:auto; }
  .unit button { min-width:0; padding:0 10px; font-size:13px; }
  footer { flex:none; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .key { min-height:54px; border-radius:10px; background:#eef1f3; font-size:25px; font-weight:600; }
  .key:active { background:#d3dade; }
  .key.back { background:#fff0d9; color:#a35a00; font-size:15px; font-weight:700; }
  .key.next { background:var(--main); color:#fff; font-size:17px; font-weight:700; }
  .key.del { font-size:17px; }
  .key.clr { font-size:15px; color:#b33030; background:#fdeeee; }
  @media (max-height:640px) { .key { min-height:46px; } .cell { min-height:46px; } .cell b { font-size:20px; } }
  @media (min-width:700px) { main, footer > .keys { max-width:560px; margin-left:auto; margin-right:auto; width:100%; } }
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs"></div>
  <button class="new" id="new">＋別の品</button>
</header>
<main id="main"></main>
<footer><div class="keys" id="keys"></div></footer>
<script>
// どの品も「量・値段」を順に入れる。数字が止まったら自動で次の欄へ（次へ を押せばすぐ進む）
const KEY = 'otoku.v1', WAIT = 1000;
const blank = n => ({ title: '', unit: 'g', items: Array.from({ length: n }, () => ({ q: '', p: '' })) });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.lists || !S.lists.length) S = { lists: [blank(2)], cur: 0 };
let at = { i: 0, f: 'q' }, timer = null;
const L = () => S.lists[S.cur];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);
const names = 'ABCDEF';
const order = () => L().items.flatMap((_, i) => [{ i, f: 'q' }, { i, f: 'p' }]);
const idx = () => order().findIndex(c => c.i === at.i && c.f === at.f);
const yen = v => v >= 100 ? v.toFixed(1) : v.toFixed(2);
function firstEmpty() { return order().find(c => L().items[c.i][c.f] === '') || null; }
function unitPrice(it) { const q = parseFloat(it.q), p = parseFloat(it.p); return q > 0 && p >= 0 && it.p !== '' ? p / q : null; }
function perLabel() { const u = L().unit; return u === '個' ? '1個' : '100' + u; }
function per(v) { return L().unit === '個' ? v : v * 100; }

function draw() {
  const l = L(), prices = l.items.map(unitPrice), ok = prices.filter(v => v !== null);
  const min = ok.length >= 2 ? Math.min(...ok) : null;
  const allDone = ok.length === l.items.length && ok.length >= 2;
  $('tabs').innerHTML = S.lists.map((x, i) => `<button class="tab${i === S.cur ? ' on' : ''}" data-t="${i}">比較 ${i + 1}</button>`).join('');
  let h = '';
  l.items.forEach((it, i) => {
    const v = prices[i], best = min !== null && v !== null && Math.abs(v - min) < 1e-12;
    const cell = (f, lab) => `<button class="cell${at.i === i && at.f === f ? ' cur' : ''}" data-c="${i}${f}"><small>${lab}</small><b>${it[f]}</b></button>`;
    const diff = v !== null && min !== null && !best ? `<small>+${Math.round((v / min - 1) * 100)}%</small>` : `<small>${perLabel()}</small>`;
    h += `<div class="row${best ? ' best' : ''}"><span class="name">${names[i]}</span>${cell('q', l.unit)}${cell('p', '円')}
      <div class="res">${best ? '<span class="crown">お得</span>' : ''}${v === null ? '<small>—</small>' : `<b>${yen(per(v))}円</b>${diff}`}</div></div>`;
  });
  // 結果のひとこと
  let msg = `<div class="answer wait">${l.unit === '個' ? '個数' : '量'}と値段を、順に入れてください</div>`;
  if (min !== null) {
    const bestI = prices.findIndex(v => v !== null && Math.abs(v - min) < 1e-12), tie = ok.filter(v => Math.abs(v - min) < 1e-12).length > 1;
    const others = ok.filter(v => Math.abs(v - min) > 1e-12), next = others.length ? Math.min(...others) : null;
    msg = tie && !others.length ? '<div class="answer">同じお得さです</div>'
      : `<div class="answer">${names[bestI]} がいちばんお得${next ? `<small>${perLabel()}あたり ${yen(per(next) - per(min))}円 安い（${Math.round((1 - min / next) * 100)}% お得）</small>` : ''}</div>`;
    if (!allDone) msg = msg.replace('class="answer"', 'class="answer" style="opacity:.75"');
  }
  h += msg;
  h += `<div class="count">比べる数${[2, 3, 4].map(n => `<button data-n="${n}" class="${l.items.length === n ? 'on' : ''}">${n}</button>`).join('')}
    <span class="count unit">単位${['g', 'ml', '個'].map(u => `<button data-u="${u}" class="${l.unit === u ? 'on' : ''}">${u}</button>`).join('')}</span></div>`;
  $('main').innerHTML = h;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const s = b.dataset.c; stopTimer(); at = { i: +s[0], f: s[1] }; draw(); });
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { stopTimer(); S.cur = +b.dataset.t; at = firstEmpty() || { i: 0, f: 'q' }; save(); draw(); });
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => setCount(+b.dataset.n));
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { L().unit = b.dataset.u; save(); draw(); });
  save();
}
// 数をかえても、入れた品はそのまま残す（へらすときは後ろから）
function setCount(n) {
  stopTimer();
  const it = L().items;
  while (it.length < n) it.push({ q: '', p: '' });
  while (it.length > n) it.pop();
  at = firstEmpty() || { i: Math.min(at.i, n - 1), f: at.f };
  draw();
}
function stopTimer() { clearTimeout(timer); timer = null; }
function advance() {
  stopTimer();
  const o = order(), k = idx();
  at = k < o.length - 1 ? o[k + 1] : { i: -1, f: '' };
  draw();
}
function back() {
  stopTimer();
  const o = order();
  let k = at.i < 0 ? o.length : idx();
  at = o[Math.max(0, k - 1)];
  L().items[at.i][at.f] = '';   // 1つもどった欄は、すぐ打ち直せるように空にする
  draw();
}
function press(d) {
  if (at.i < 0) { at = firstEmpty() || { i: 0, f: 'q' }; if (!firstEmpty()) return; }
  const it = L().items[at.i];
  if (d === '.' && (it[at.f].includes('.') || it[at.f] === '')) return;
  if (it[at.f].replace('.', '').length >= 6) return;
  it[at.f] += d;
  draw();
  stopTimer();
  timer = setTimeout(advance, WAIT);
}
function del() {
  stopTimer();
  if (at.i < 0) return back();
  const it = L().items[at.i];
  if (it[at.f] === '') return back();
  it[at.f] = it[at.f].slice(0, -1);
  draw();
}
function clearAll() {
  stopTimer();
  const n = L().items.length, u = L().unit;
  S.lists[S.cur] = blank(n); L().unit = u; at = { i: 0, f: 'q' }; draw();
}
$('new').onclick = () => { stopTimer(); S.lists.push(blank(2)); if (S.lists.length > 8) S.lists.shift(); S.cur = S.lists.length - 1; at = { i: 0, f: 'q' }; draw(); setTimeout(() => { const t = $('tabs'); t.scrollLeft = t.scrollWidth; }, 0); };
// テンキー（スマホのキーボードを使わないので、画面の下にずっと出ている）
const KEYS = [['1', '2', '3', 'back'], ['4', '5', '6', 'del'], ['7', '8', '9', 'clr'], ['.', '0', '00', 'next']];
const LABEL = { back: '↩ 1つ<br>もどる', del: '⌫', clr: 'ぜんぶ<br>消す', next: '次へ →' };
$('keys').innerHTML = KEYS.flat().map(k => `<button class="key ${LABEL[k] ? k : ''}" data-k="${k}">${LABEL[k] || k}</button>`).join('');
$('keys').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'back') back(); else if (k === 'del') del(); else if (k === 'clr') clearAll(); else if (k === 'next') advance();
  else if (k === '00') { press('0'); press('0'); } else press(k);
});
// PC のキーボードでも使える
addEventListener('keydown', e => {
  if (/^[0-9.]$/.test(e.key)) press(e.key);
  else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); advance(); }
  else if (e.key === 'Backspace') del();
});
at = firstEmpty() || { i: -1, f: '' };
draw();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
