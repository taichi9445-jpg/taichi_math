<script>
// ======================================================================
// 【ブラッシュアップ】問題の作り方・誤答・判定・解説を作り直した（画面の流れは元のまま）
//   ・Lv.2 の後半は指数が「2・3・2 乗」で固定だった（12 通りしかなく、(x²)² は「指数をたす」
//     まちがいでも正解になった）。指数・何乗かを乱数にし、m＝n＝2 のような見分けられない組は出さない。
//   ・Lv.3（マイナスをふくむ）を追加：(−3a²b)³、3a²b×(−2ab³)、2x×(−3x²)² など。
//   ・誤答は「指数をたす／かけるの取りちがえ」「係数の累乗忘れ」「符号」などのよくあるまちがいから作る。
//   ・まちがえたら 1 回目はヒント（使う法則）、2 回目と正解のあとは途中式つきの解説を出す。
//   ・文字は斜体・数字は立体、マイナスは「−」。文字はアルファベット順（a と b、x と y の組）。
//   ・同じ回の中で同じ問題を出さない。
// ======================================================================
let st = { lv:1, mode:'', cur:0, prob:{}, solved:false, miss:0, missTotal:0, seen:[], choices:[] };
let uIn = [];
const $ = id => document.getElementById(id);
const MODE_NAME = { choice: '4択', build: '組み立てる' };

function goHome() {
    $('scrDone').classList.remove('active');
    $('scrQuiz').classList.remove('active');
    $('scrHome').classList.add('active');
}

function start(l, m) {
    st.lv = l; st.mode = m; st.cur = 0; st.missTotal = 0; st.seen = [];
    $('scrDone').classList.remove('active');
    $('scrHome').classList.remove('active');
    $('scrQuiz').classList.add('active');
    nextQ();
}

function nextQ() {
    if (st.cur >= 5) {
        $('scrQuiz').classList.remove('active');
        $('scrDone').classList.add('active');
        $('doneMsg').textContent = `Lv.${st.lv}（${MODE_NAME[st.mode]}）をクリアしたよ！` +
            (st.missTotal === 0 ? ' ノーミス！すばらしい！' : `（まちがい ${st.missTotal} 回）`);
        $('btnNextLv').style.display = st.lv < 3 ? '' : 'none';
        return;
    }
    st.cur++; st.solved = false; st.miss = 0; uIn = [];
    let p, guard = 0;
    do { p = getProb(st.lv, st.cur); } while (st.seen.includes(p.q) && guard++ < 50);
    st.seen.push(p.q);
    st.prob = p;

    $('qInfo').innerText = `第 ${st.cur} / 5 問`;
    $('qTxt').innerHTML = p.q;
    $('qTxt').classList.toggle('long', $('qTxt').textContent.length > 11);
    $('fb').innerText = '';
    showExpl('');
    $('btnNext').style.display = 'none';

    if (st.mode === 'choice') {
        $('modeChoice').style.display = 'grid';
        $('modeBuild').style.display = 'none';
        renderChoices();
    } else {
        $('modeChoice').style.display = 'none';
        $('modeBuild').style.display = 'block';
        $('uAns').innerHTML = '';
        $('btnJudge').style.display = 'block';
        renderPalette();
    }
}

// ---------- 単項式のあつかい ----------
//   単項式 m = { c: 係数, p: { 文字: 指数 } }、問題の因数 f = { c, p, k }（(c・文字^指数)^k。k＝1 はかっこなし）
const PAIRS = [['a', 'b'], ['x', 'y']];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const F = (c, p, k) => ({ c, p, k: k || 1 });
const lettersOf = p => Object.keys(p).sort();
const neg = n => '−' + n;   // マイナスは「−」（U+2212）

function coefHtml(c) { return c === 1 ? '' : c === -1 ? '−' : c < 0 ? neg(-c) : String(c); }
function lettersHtml(p) { return lettersOf(p).map(v => `<i>${v}</i>` + (p[v] > 1 ? `<sup>${p[v]}</sup>` : '')).join(''); }
function monoHtml(m) { return coefHtml(m.c) + lettersHtml(m.p); }
function monoKey(m) { return m.c + '|' + lettersOf(m.p).map(v => v + m.p[v]).join(','); }
function factorHtml(f, i) {
    const core = coefHtml(f.c) + lettersHtml(f.p);
    if (f.k > 1) return `(${core})<sup>${f.k}</sup>`;
    return (f.c < 0 && i > 0) ? `(${core})` : core;
}
const TIMES = '&nbsp;×&nbsp;';
function probHtml(fs) { return fs.map(factorHtml).join(TIMES); }

// 計算のきまり。誤答は、このうち 1 つを「よくあるまちがい」に入れかえて作る
const RULE = {
    powExp: (e, k) => e * k,                          // (a^m)^n = a^(mn)
    powCoef: (c, k) => c ** k,                        // 係数も累乗する
    mulExp: es => es.reduce((s, e) => s + e, 0),      // a^m × a^n = a^(m+n)
    mulCoef: cs => cs.reduce((s, c) => s * c, 1),
    flip: false
};
function calc(fs, over) {
    const R = Object.assign({}, RULE, over || {});
    const coefs = [], exps = {};
    fs.forEach(f => {
        coefs.push(f.k > 1 ? R.powCoef(f.c, f.k) : f.c);
        lettersOf(f.p).forEach(v => (exps[v] = exps[v] || []).push(f.k > 1 ? R.powExp(f.p[v], f.k) : f.p[v]));
    });
    const p = {};
    Object.keys(exps).forEach(v => { p[v] = exps[v].length > 1 ? R.mulExp(exps[v]) : exps[v][0]; });
    let c = coefs.length > 1 ? R.mulCoef(coefs) : coefs[0];
    if (R.flip) c = -c;
    return { c, p };
}
function sharedLetter(fs) {
    const cnt = {};
    fs.forEach(f => lettersOf(f.p).forEach(v => { cnt[v] = (cnt[v] || 0) + 1; }));
    return Object.values(cnt).some(n => n > 1);
}
function makeTraps(fs) {
    const out = [];
    if (fs.some(f => f.k > 1)) out.push({ powExp: (e, k) => e + k });                        // 累乗なのに指数をたした
    if (sharedLetter(fs)) out.push({ mulExp: es => es.reduce((s, e) => s * e, 1) });         // かけ算なのに指数をかけた
    if (fs.some(f => f.k > 1 && Math.abs(f.c) > 1)) {
        out.push({ powCoef: c => c });                                                      // 係数を累乗し忘れた
        out.push({ powCoef: (c, k) => c * k });                                             // 係数に指数をかけた
    }
    if (fs.filter(f => Math.abs(f.c) > 1).length >= 2) out.push({ mulCoef: cs => cs.reduce((s, c) => s + c, 0) }); // 係数をたした
    if (fs.some(f => f.c < 0)) out.push({ flip: true });                                     // 符号のまちがい
    if (fs.some(f => f.c < 0 && f.k > 1 && f.k % 2 === 0)) {                                 // 偶数乗：符号は合っていて係数がちがう
        out.push({ powCoef: (c, k) => Math.abs(c) * k });
        if (fs.some(f => f.c < -1)) out.push({ powCoef: c => Math.abs(c) });
    }
    return out.map(o => calc(fs, o)).filter(m => m.c !== 0);
}
// となりの数（指数±1・係数±1）。指数 1 や係数 1 は作らない
function neighbors(m) {
    const out = [];
    lettersOf(m.p).forEach(v => [1, -1, 2].forEach(d => {
        const e = m.p[v] + d;
        if (e >= 2) { const p = Object.assign({}, m.p); p[v] = e; out.push({ c: m.c, p }); }
    }));
    if (Math.abs(m.c) > 1) [1, -1].forEach(d => { const c = m.c + Math.sign(m.c) * d; if (Math.abs(c) >= 2) out.push({ c, p: m.p }); });
    return out;
}

// ---------- 問題 ----------
function getProb(lv, step) {
    const [v, w] = pick(PAIRS);
    const ok22 = (a, b) => !(a === 2 && b === 2);   // 2 と 2 は「たす」でも「かける」でも 4 になり、見分けられない
    let fs, m, n, k, p, q;
    if (lv === 1) {
        if (step === 1) {                                   // a^m × a^n
            do { m = ri(2, 5); n = ri(2, 5); } while (!ok22(m, n));
            fs = [F(1, { [v]: m }), F(1, { [v]: n })];
        } else if (step === 2) {                            // a × a^n、a^m × a^n × a（指数 1 が見えない形）
            if (Math.random() < 0.5) { fs = shuffle([F(1, { [v]: 1 }), F(1, { [v]: ri(2, 6) })]); }
            else {
                do { m = ri(2, 4); n = ri(2, 4); } while (m * n === m + n + 1);   // a²×a³×a は「かける」でも 6 になるので出さない
                fs = [F(1, { [v]: m }), F(1, { [v]: n }), F(1, { [v]: 1 })];
            }
        } else if (step === 3) {                            // (a^m)^n
            do { m = ri(2, 5); n = ri(2, 4); } while (!ok22(m, n));
            fs = [F(1, { [v]: m }, n)];
        } else if (step === 4) {                            // (a^m b)^n
            do { m = ri(2, 4); n = ri(2, 4); } while (!ok22(m, n));
            fs = [F(1, Math.random() < 0.5 ? { [v]: m, [w]: 1 } : { [v]: 1, [w]: m }, n)];
        } else {                                            // a^m × (a^n)^k
            do { m = ri(2, 4); n = ri(2, 4); k = ri(2, 3); } while (!ok22(n, k));
            fs = [F(1, { [v]: m }), F(1, { [v]: n }, k)];
        }
    } else if (lv === 2) {
        if (step === 1) {                                   // 3x² × 4x³
            let c1, c2;
            do { m = ri(1, 5); n = ri(2, 5); c1 = ri(2, 5); c2 = ri(2, 5); } while (!ok22(m, n) || !ok22(c1, c2));
            fs = [F(c1, { [v]: m }), F(c2, { [v]: n })];
        } else if (step === 2) {                            // 2a²b × 3ab³
            fs = [F(ri(2, 5), { [v]: ri(2, 4), [w]: 1 }), F(ri(2, 5), { [v]: 1, [w]: ri(2, 4) })];
        } else if (step === 3) {                            // (3x²)³
            k = ri(2, 3);
            do { p = ri(1, 4); } while (!ok22(p, k));
            fs = [F(k === 2 ? ri(2, 5) : ri(2, 3), { [v]: p }, k)];
        } else if (step === 4) {                            // (2a³b²)³
            k = ri(2, 3);
            do { p = ri(1, 4); q = ri(1, 4); } while (p === q || !ok22(p, k) || !ok22(q, k));
            fs = [F(k === 2 ? ri(2, 5) : ri(2, 3), { [v]: p, [w]: q }, k)];
        } else {                                            // 2x × (3x³)²
            fs = [F(ri(2, 4), { [v]: ri(1, 3) }), F(ri(2, 3), { [v]: pick([1, 3, 4]) }, 2)];
        }
    } else {
        if (step === 1) {                                   // (−a)²、(−2x³)³ など
            k = ri(2, 3);
            do { p = ri(1, 3); } while (!ok22(p, k));
            fs = [F(-ri(1, 3), { [v]: p }, k)];
        } else if (step === 2) {                            // 3a²b × (−2ab³)
            fs = [F(ri(2, 4), { [v]: ri(2, 3), [w]: 1 }), F(-ri(2, 4), { [v]: 1, [w]: ri(2, 3) })];
        } else if (step === 3) {                            // (−3a²b)³
            do { p = ri(1, 3); q = ri(1, 3); } while (p === q);
            fs = [F(-ri(2, 3), { [v]: p, [w]: q }, 3)];
        } else if (step === 4) {                            // 2x × (−3x²)²、(−2x)³ × 3x²
            fs = Math.random() < 0.5
                ? [F(ri(2, 4), { [v]: 1 }), F(-ri(2, 3), { [v]: pick([1, 3]) }, 2)]
                : [F(-2, { [v]: 1 }, 3), F(ri(2, 4), { [v]: ri(2, 3) })];
        } else {                                            // (−xy²)³ × (2x²y)²
            fs = [F(-1, { [v]: 1, [w]: ri(2, 3) }, 3), F(ri(2, 3), { [v]: ri(2, 3), [w]: 1 }, 2)];
        }
    }
    const ans = calc(fs);
    const traps = makeTraps(fs).filter(t => monoKey(t) !== monoKey(ans));
    return { fs, q: probHtml(fs), ans, traps, letters: [v, w] };
}

// ---------- ヒントと解説 ----------
function rulesHtml(fs) {
    const rs = [];
    if (fs.some(f => f.k > 1 && (lettersOf(f.p).length > 1 || f.c !== 1)))
        rs.push('積の累乗は、<b>係数も文字も全部</b>累乗する　(<i>ab</i>)<sup><i>n</i></sup> = <i>a</i><sup><i>n</i></sup><i>b</i><sup><i>n</i></sup>');
    if (fs.some(f => f.k > 1 && lettersOf(f.p).some(v => f.p[v] > 1)))
        rs.push('累乗の累乗は、指数を<b>かける</b>　(<i>a</i><sup><i>m</i></sup>)<sup><i>n</i></sup> = <i>a</i><sup><i>mn</i></sup>');
    if (sharedLetter(fs))
        rs.push('同じ文字のかけ算は、指数を<b>たす</b>　<i>a</i><sup><i>m</i></sup> × <i>a</i><sup><i>n</i></sup> = <i>a</i><sup><i>m</i>+<i>n</i></sup>');
    if (fs.some(f => f.c < 0 && f.k > 1)) rs.push('マイナスの累乗は、<b>偶数乗なら＋、奇数乗なら−</b>');
    if (fs.some(f => f.c < 0 && f.k === 1)) rs.push('符号は、マイナスが<b>奇数個なら−、偶数個なら＋</b>');
    if (sharedLetter(fs) && fs.some(f => lettersOf(f.p).some(v => f.p[v] === 1))) rs.push('<i>a</i> は <i>a</i><sup>1</sup>（指数の 1 は書かない）');
    return rs.map(r => `<div>・${r}</div>`).join('');
}
function coefPow(c, k) { return c === 1 ? '' : c < 0 ? `(${neg(-c)})<sup>${k}</sup>` : `${c}<sup>${k}</sup>`; }
function explHtml(fs) {
    const ans = calc(fs);
    const steps = [probHtml(fs)];
    const powered = fs.map(f => (f.k > 1 ? calc([f]) : { c: f.c, p: f.p }));
    if (fs.some(f => f.k > 1)) {
        // ① かっこの累乗をはずす（係数も文字も累乗）
        steps.push(fs.map((f, i) => f.k === 1 ? factorHtml(f, i)
            : coefPow(f.c, f.k) + lettersOf(f.p).map(v => `<i>${v}</i><sup>${f.p[v]}×${f.k}</sup>`).join('')).join(TIMES));
        if (fs.length > 1) steps.push(powered.map((m, i) => (m.c < 0 && i > 0) ? `(${monoHtml(m)})` : monoHtml(m)).join(TIMES));
    }
    if (fs.length > 1) {
        // ② 係数どうし・同じ文字どうしをまとめる（指数はたす）
        //   係数の −1 は「−」として前に出す（(−1)×4 ではなく −4 と書く）
        const all = powered.map(m => m.c);
        const cs = all.filter(c => Math.abs(c) !== 1);
        const sign = all.filter(c => c === -1).length % 2 ? '−' : '';
        const cStr = cs.length >= 2 ? sign + '(' + cs.map(c => c < 0 ? `(${neg(-c)})` : c).join(' × ') + ')'
            : cs.length === 1 ? sign + coefHtml(cs[0]) : sign;
        steps.push(cStr + lettersOf(ans.p).map(v => {
            const es = powered.filter(m => m.p[v]).map(m => m.p[v]);
            return `<i>${v}</i>` + (es.length > 1 ? `<sup>${es.join('+')}</sup>` : es[0] > 1 ? `<sup>${es[0]}</sup>` : '');
        }).join(''));
    }
    steps.push(monoHtml(ans));
    const uniq = steps.filter((s, i) => i === 0 || s !== steps[i - 1]);
    return `<div class="xp-rule">${rulesHtml(fs)}</div><div class="xp-steps">${uniq.map((s, i) => (i ? '= ' : '') + s).join('<br>')}</div>`;
}
function showExpl(html, kind) {
    const e = $('expl');
    e.className = 'xp' + (kind ? ' xp-' + kind : '');
    e.innerHTML = html;
    if (html) requestAnimationFrame(() => e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));   // 画面の外に出ないように
}
function showHint() { showExpl('<b>💡 ヒント</b>' + rulesHtml(st.prob.fs), 'hint'); }

function onCorrect(note) {
    st.solved = true;
    $('fb').innerHTML = '<span style="color:var(--u-ok);">⭕ 正解！</span>';
    showExpl((note ? `<div class="xp-note">${note}</div>` : '') + '<b>解説</b>' + explHtml(st.prob.fs), 'full');
    $('btnJudge').style.display = 'none';
    $('btnNext').style.display = 'block';
}
function onWrong(msg) {
    st.miss++; st.missTotal++;
    $('fb').innerHTML = `<span style="color:var(--u-ng);">❌ ${msg || 'おしい！'}</span>`;
    if (st.miss >= 2) showExpl('<b>解説</b>' + explHtml(st.prob.fs), 'full');
    else showHint();
}

// ---------- 4択 ----------
function renderChoices() {
    const p = st.prob;
    const cs = [p.ans], keys = new Set([monoKey(p.ans)]);
    const addC = m => { const k = monoKey(m); if (cs.length < 4 && !keys.has(k)) { keys.add(k); cs.push(m); } };
    // よくあるまちがいを先に。符号だけで答えが分からないよう、答えと同じ符号の誤答を 1 つ入れる
    const tr = shuffle([...p.traps]);
    const same = tr.findIndex(t => Math.sign(t.c) === Math.sign(p.ans.c));
    if (same > 0) tr.unshift(tr.splice(same, 1)[0]);
    tr.forEach(addC);
    shuffle(neighbors(p.ans)).forEach(addC);      // 足りないときは、となりの数
    st.choices = shuffle(cs);
    $('modeChoice').innerHTML = st.choices.map((m, i) =>
        `<button class="btn-choice math" onclick="judgeChoice(${i}, this)">${monoHtml(m)}</button>`).join('');
}
function judgeChoice(i, btn) {
    if (st.solved) return;
    if (monoKey(st.choices[i]) === monoKey(st.prob.ans)) {
        btn.classList.add('is-correct');
        onCorrect();
    } else {
        btn.disabled = true;   // まちがえたボタンは押せないまま
        onWrong();
    }
}

// ---------- 組み立てる（元の「つなげる」） ----------
function renderPalette() {
    const p = st.prob;
    const monos = [p.ans, ...p.traps];
    const coefs = new Set(), exps = new Set();
    monos.forEach(m => {
        if (Math.abs(m.c) > 1) coefs.add(Math.abs(m.c));
        lettersOf(m.p).forEach(v => { if (m.p[v] > 1) exps.add(m.p[v]); });
    });
    // 指数の候補は 5 つ以上に（少ないと当てずっぽうで作れてしまう）
    const base = [...exps];
    for (let d = 1; exps.size < 5 && d < 6; d++) base.forEach(e => {
        if (exps.size < 5 && e + d >= 2) exps.add(e + d);
        if (exps.size < 5 && e - d >= 2) exps.add(e - d);
    });
    if (st.lv >= 2) {
        const a = Math.abs(p.ans.c);
        for (let d = 1; coefs.size < 4 && d < 6; d++) { coefs.add(a + d); if (a - d >= 2) coefs.add(a - d); }
    }
    const btn = (v, t, label, cls) => `<button class="btn-p math${cls || ''}" onclick="add('${v}','${t}')">${label}</button>`;
    const nums = [...coefs].sort((a, b) => a - b), sups = [...exps].sort((a, b) => a - b);
    let html = '';
    if (st.lv >= 2) html += '<div class="p-row"><span class="p-lab">係数</span>' + (st.lv === 3 ? btn('-', 'b', '−') : '') + nums.map(n => btn(n, 'b', n)).join('') + '</div>';
    html += '<div class="p-row"><span class="p-lab">文字</span>' + p.letters.map(v => btn(v, 'b', `<i>${v}</i>`)).join('') + '</div>';
    html += '<div class="p-row"><span class="p-lab">指数</span>' + sups.map(n => btn(n, 's', `<sup>${n}</sup>`, ' sup')).join('') + '</div>';
    $('palette').innerHTML = html;
}

function add(v, t) { if (!st.solved) { uIn.push({ v: String(v), t }); update(); } }
function pop() { if (!st.solved) { uIn.pop(); update(); } }
function tokenHtml(i) {
    if (i.t === 's') return `<sup>${i.v}</sup>`;
    if (/[a-z]/.test(i.v)) return `<i>${i.v}</i>`;
    return i.v === '-' ? '−' : i.v;
}
function update() {
    $('uAns').innerHTML = uIn.map(tokenHtml).join('');
    $('fb').innerText = '';
}

// 組み立てた式を読む。かける順番は問わない（係数と、文字ごとの指数で比べる）
function parseBuilt(s) {
    const m = s.match(/^(-?)(\d*)((?:[a-z](?:\^\d+)?)+)$/);
    if (!m) return { err: '係数 → 文字 → 指数の順に組み立てよう' };
    if (m[2] === '1') return { err: '係数の 1 は書かないよ' };
    const p = {}, order = [];
    for (const t of m[3].matchAll(/([a-z])(?:\^(\d+))?/g)) {
        if (p[t[1]] !== undefined) return { err: `同じ文字（${t[1]}）は 1 つにまとめよう` };
        p[t[1]] = Number(t[2] || 1);
        order.push(t[1]);
    }
    return { m: { c: (m[1] ? -1 : 1) * Number(m[2] || 1), p }, order };
}
function judgeBuild() {
    if (st.solved) return;
    if (!uIn.length) { $('fb').innerHTML = '<span style="color:#999;">パーツを選んで式を作ろう</span>'; return; }
    const r = parseBuilt(uIn.map(i => (i.t === 's' ? '^' + i.v : i.v)).join(''));
    if (r.m && monoKey(r.m) === monoKey(st.prob.ans)) {
        const sorted = r.order.join('') === [...r.order].sort().join('');
        onCorrect(sorted ? '' : 'ふつうは文字をアルファベット順に書くよ（' + monoHtml(st.prob.ans) + '）');
    } else {
        onWrong(r.err || 'おしい！パーツを確認してね');
    }
}
