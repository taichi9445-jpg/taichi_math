        const LEVEL_Q = {
            0: '次の式を因数分解しなさい',
            1: '次の二次関数のグラフと x 軸の共有点の x 座標を求めなさい',
            2: '次の二次関数のグラフと x 軸の共有点の x 座標を求めなさい',
            3: '判別式を使って、共有点の個数を求めなさい',
            4: '共有点の x 座標を求めなさい（x 軸に接するとき・共有点がないときもあるよ）'
        };

        function setLevel(level) {
            currentLevel = level;
            currentProblemIndex = 0;
            correctCount = 0; totalCount = 0;
            document.getElementById('correct').textContent = 0;
            document.getElementById('total').textContent = 0;
            levelProblems = [...problems[currentLevel]];
            document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i === level));
            const quizArea = document.querySelector('.quiz-area');
            quizArea.innerHTML = `
                <div class="question-text" id="questionText"></div>
                <div class="problem" id="problem"></div>
                <div style="text-align: center;">
                    <button class="hint-btn" onclick="showHint()" id="hintBtn">💡 ヒントを見る</button>
                </div>
                <div class="hint-section" id="hintSection">
                    <div class="hint-title">${level === 0 ? '💡 因数分解のヒント' : '💡 計算のヒント'}</div>
                    <div class="factorization" id="factorization"></div>
                </div>
                <div class="choices" id="choices"></div>
                <div id="result" class="result" style="display: none;"></div>
                <div id="explanation" class="explanation" style="display: none;"></div>
                <div id="graphBox" class="graph-box" style="display: none;"></div>
                <div style="text-align: center; margin-top: 16px;">
                    <button class="next-btn" onclick="nextProblem()" id="nextBtn" style="display: none;">次の問題</button>
                </div>
            `;
            nextProblem();
        }

        function showHint() {
            const hintSection = document.getElementById('hintSection');
            const hintBtn = document.getElementById('hintBtn');
            const factorization = document.getElementById('factorization');
            hintStep++;
            if (hintStep === 1 || !currentProblem.hint2) {
                factorization.innerHTML = currentProblem.hint1;
                hintSection.style.display = 'block';
                if (currentProblem.hint2) hintBtn.textContent = '💡 ヒント2'; else hintBtn.style.display = 'none';
            } else {
                factorization.innerHTML = currentProblem.hint2;
                hintBtn.style.display = 'none';
            }
        }

        function nextProblem() {
            if (currentProblemIndex >= PER_LEVEL) { showLevelComplete(); return; }
            if (levelProblems.length === 0) levelProblems = [...problems[currentLevel]];
            firstTry = true;
            hintStep = 0;
            const randomIndex = Math.floor(Math.random() * levelProblems.length);
            currentProblem = levelProblems[randomIndex];
            levelProblems.splice(randomIndex, 1);

            document.getElementById('questionText').textContent = currentProblem.question || LEVEL_Q[currentLevel];
            document.getElementById('problem').textContent = currentProblem.equation;
            document.getElementById('hintSection').style.display = 'none';
            const hb = document.getElementById('hintBtn');
            hb.style.display = 'inline-block';
            hb.textContent = currentProblem.hint2 ? '💡 ヒント1' : '💡 ヒントを見る';

            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            const idx = currentProblem.choices.map((c, i) => i);
            for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
            choicesDiv.className = 'choices' + (currentProblem.choices.length === 3 || currentProblem.choices.some(c => c.length > 14) ? ' wide' : '');
            idx.forEach(i => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = currentProblem.choices[i];
                button.onclick = () => selectAnswer(i, button);
                choicesDiv.appendChild(button);
            });

            document.getElementById('result').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('graphBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function showLevelComplete() {
            const quizArea = document.querySelector('.quiz-area');
            quizArea.innerHTML = `
                <div class="level-complete">
                    <h2>🎉 レベル${currentLevel}完了！</h2>
                    <p>おめでとうございます！すべての問題をクリアしました。</p>
                    <p>一発正解: ${correctCount} / ${PER_LEVEL}問</p>
                    <div class="done-nav">
                        ${currentLevel < 4 ? '<button class="next" onclick="setLevel(currentLevel + 1)">次のレベルへ ▶</button>' : ''}
                        <button class="again" onclick="setLevel(currentLevel)">同じレベルでもう一度</button>
                        ${currentLevel === 4 ? '<button class="back" onclick="setLevel(0)">レベル0から始める</button>' : ''}
                        <a href="../remake.html">ほかの教材をえらぶ</a>
                    </div>
                </div>
            `;
        }

        function selectAnswer(i, buttonElement) {
            const resultDiv = document.getElementById('result');
            const explanationDiv = document.getElementById('explanation');
            resultDiv.style.display = 'block';
            explanationDiv.style.display = 'block';
            if (currentProblem.choices[i] === currentProblem.correct) {
                buttonElement.classList.add('correct');
                document.querySelectorAll('.choice-btn').forEach(btn => { btn.classList.add('disabled'); btn.onclick = null; });
                if (firstTry) correctCount++;
                totalCount++;
                currentProblemIndex++;
                document.getElementById('correct').textContent = correctCount;
                document.getElementById('total').textContent = totalCount;
                resultDiv.innerHTML = '🎉 正解です！';
                resultDiv.className = 'result correct';
                explanationDiv.innerHTML = '<strong>解説：</strong><br>' + currentProblem.correctExplanation;
                drawGraph();
                const nb = document.getElementById('nextBtn');
                nb.textContent = currentProblemIndex >= PER_LEVEL ? '結果を見る ▶' : '次の問題 ▶';
                nb.style.display = 'inline-block';
            } else {
                // まちがえた選択肢だけ使えなくして、理由とアドバイスを出す（そのまま選び直せる）
                firstTry = false;
                buttonElement.classList.add('selected', 'disabled');
                buttonElement.onclick = null;
                resultDiv.innerHTML = '✖ ' + (currentProblem.whys[i] || 'もう一度考えてみよう');
                resultDiv.className = 'result incorrect';
                explanationDiv.innerHTML = '<strong>アドバイス：</strong><br>' + currentProblem.wrongAdvice;
            }
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 答えたあとのグラフ（graph.js）：共有点に印と x 座標
        function drawGraph() {
            const g = currentProblem.graph, box = document.getElementById('graphBox');
            if (!g || !window.Graph) { box.style.display = 'none'; return; }
            const v = -g.b / (2 * g.a);
            const xs = g.pts.map(p => p[0]).concat([v]);
            const xmin = Math.floor(Math.min(...xs)) - 2, xmax = Math.ceil(Math.max(...xs)) + 2;
            const svg = Graph.parabola({ a: g.a, b: g.b, c: g.c, xmin, xmax, points: g.pts.map(p => ({ x: p[0], y: 0, label: p[1] ? '(' + p[1] + ', 0)' : '' })) });
            box.innerHTML = svg + '<div class="graph-note">' + (g.pts.length === 0 ? 'x 軸と共有点がない（放物線が x 軸より上）' : g.pts.length === 1 ? '緑の点で x 軸に接している' : '緑の点が x 軸との共有点') + '</div>';
            const s = box.querySelector('svg');
            if (s) { s.removeAttribute('width'); s.style.width = '100%'; s.style.maxWidth = '420px'; s.style.height = 'auto'; }
            box.style.display = 'block';
        }

        // 初期化
        setLevel(0);

        // 【ブラッシュアップ】式の書き方を教科書にそろえる：文字（x, y, a, p, q, f, D, k など）は斜体、
        //   数字・記号はまっすぐ。どちらも数式の書体（var(--u-math-font)）で、日本語は普通の書体のまま。
        //   式のひとかたまり（「0 ≦ x ≦ 2」など）は途中で改行しない（長い式は「=」の前で分ける）。
        //   画面の文字はマイナスを「−」にする以外は変えないので、答え合わせには影響しない。
        //   画面が書きかわるたびに、指定した場所に当て直す。
        const MATH_RUN = /[A-Za-z0-9²³±√≦≧<>=+\-−·×÷\/.,()|' ]*[A-Za-z0-9][A-Za-z0-9²³±√≦≧<>=+\-−·×÷\/.,()|' ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .math, i, script, style, svg, input, textarea, mjx-container, .MathJax')) continue;
                if (/\\|\$\$/.test(n.nodeValue)) continue;   // MathJax がまだ組んでいない式（\( … \) など）にはさわらない
                if (/[A-Za-z0-9]/.test(n.nodeValue)) nodes.push(n);
                else if (/-/.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/-/g, '−');   // 「-(」など記号だけの部分もマイナスは「−」
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    // 長い式は「 = 」の前で区切り、区切りのところだけで改行できるようにする
                    const pieces = text.length > 22 ? text.split(/(?= = )/) : [text];
                    pieces.forEach((piece, k) => {
                        if (k) frag.appendChild(document.createTextNode(' '));
                        const span = document.createElement('span');
                        span.className = 'm';
                        piece.trim().split(/([A-Za-z]+)/).forEach((part, j) => {
                            if (!part) return;
                            if (j % 2) { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                            else span.appendChild(document.createTextNode(part.replace(/-/g, '−')));
                        });
                        frag.appendChild(span);
                    });
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        watchMath(['#problem', '#questionText', '#choices', '#result', '#explanation', '#factorization', '.graph-note', '.level-complete']);
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    "h1": "u-title",
    ".level-btn:not(.active)": "u-btn u-btn-plain",
    ".level-btn.active": "u-btn",
    ".hint-btn": "u-btn",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.selected": "u-ng",
    ".next-btn": "u-btn u-btn-blue",
    ".done-nav .again": "u-btn",
    ".done-nav .next": "u-btn u-btn-blue",
    ".done-nav .back": "u-btn u-btn-plain"
  });
</script>
</body>
