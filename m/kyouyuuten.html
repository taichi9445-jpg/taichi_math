<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2次関数とx軸の共有点</title>
<link rel="stylesheet" href="../assets/base.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="../assets/mathcore.js"></script>
<script src="../assets/quiz.js"></script>
<script src="../assets/algebra.js"></script>
<script src="../assets/graph.js"></script>
<script>
/* ---------------------------------------------------------------------------
   22. 2次関数と共有点の座標の計算練習
     レベル0 … 共有点の個数を判別式で判定
     レベル1 … 因数分解して共有点を求める
     レベル2 … 解の公式が必要な場合
     レベル3 … 総合

   元教材から直した点：
     ・選択肢に「x = 1, 6」のように、正解と数の組が同じで順番だけ
       違うものが混ざっていて、どちらを選んでも同じはずなのに片方が
       不正解になっていた。
       → 解の組として比べるので、順番のちがいで不正解にならない。
       　 また、同じ組の選択肢は作らない。
     ・共有点が 1 個（重解）のとき、答えを 2 つ選ばせる形になっていた。
       → 重解は 1 つの共有点として扱う。
--------------------------------------------------------------------------- */
(function () {
  'use strict';

  var A = Algebra, F = Quiz.fmt;

  function sameSet(p, q) {
    if (p.length !== q.length) return false;
    var a = p.slice().sort(function (x, y) { return x - y; });
    var b = q.slice().sort(function (x, y) { return x - y; });
    for (var i = 0; i < a.length; i++) if (Math.abs(a[i] - b[i]) > 1e-9) return false;
    return true;
  }

  function fmtRoots(rs) {
    return 'x = ' + rs.map(function (r) {
      return Number.isInteger(r) ? r : Math.round(r * 100) / 100;
    }).join(', ');
  }

  /* ---------- レベル0：共有点の個数 ---------- */
  function level0() {
    var a = Quiz.pick([1, 1, 2, -1]);
    var b = A.randInt(-8, 8);
    var c = A.randInt(-8, 8);
    var D = b * b - 4 * a * c;
    var n = D > 0 ? 2 : D === 0 ? 1 : 0;
    var labels = ['0個（共有点なし）', '1個（接する）', '2個'];

    return {
      tag: 'レベル0',
      text: 'この2次関数のグラフと x 軸の<b>共有点の個数</b>を答えなさい。',
      math: 'y = ' + F.poly([[a, F.pow('x', 2)], [b, 'x'], [c, '']]),
      figure: Graph.parabola({ a: a, b: b, c: c }),
      type: 'choice',
      choices: [labels[n], labels[(n + 1) % 3], labels[(n + 2) % 3]],
      correct: 0,
      noShuffle: false,
      hint: '判別式 D = b² − 4ac の符号で決まります。D > 0 なら2個、D = 0 なら1個、D < 0 なら0個。',
      explain: 'D = ' + b + '² − 4×' + a + '×' + c + ' = ' + D +
        ' なので、共有点は ' + labels[n] + ' です。'
    };
  }

  /* ---------- レベル1：因数分解で求める ---------- */
  function level1() {
    var it = A.quadraticFromRoots({ lo: -7, hi: 7, allowSame: false });
    var roots = [-it.a, -it.b].sort(function (x, y) { return x - y; });
    return makeRootQuestion('レベル1', 'y = ' + it.expanded, 1, it.sum, it.prod, roots,
      'かけて ' + it.prod + '、たして ' + it.sum + ' になる 2 数をさがして因数分解します。',
      '因数分解すると ' + it.factored + ' = 0。よって共有点の x 座標は ' + roots.join('、') + ' です。');
  }

  /* ---------- レベル2：解の公式が必要 ---------- */
  function level2() {
    var guard = 0;
    while (guard++ < 200) {
      var a = Quiz.pick([1, 1, 2]);
      var b = A.randInt(-9, 9);
      var c = A.randInt(-9, 9);
      var D = b * b - 4 * a * c;
      if (D <= 0) continue;
      var sq = Math.sqrt(D);
      if (Number.isInteger(sq)) continue;         // 因数分解で解けるものはレベル1にまわす
      var r1 = (-b - sq) / (2 * a), r2 = (-b + sq) / (2 * a);
      return makeRootQuestion('レベル2',
        'y = ' + F.poly([[a, F.pow('x', 2)], [b, 'x'], [c, '']]), a, b, c, [r1, r2],
        '因数分解できないので解の公式を使います。 x = ( −b ± √(b²−4ac) ) ÷ 2a',
        'D = ' + D + ' なので x = ( ' + (-b) + ' ± √' + D + ' ) ÷ ' + (2 * a) + '。' +
        '小数で表すと ' + fmtRoots([r1, r2]) + ' です。');
    }
    return level1();
  }

  function makeRootQuestion(tag, show, a, b, c, roots, hint, explain) {
    var correct = fmtRoots(roots);
    var used = [roots];
    var choices = [correct];
    var guard = 0;
    while (choices.length < 4 && guard++ < 100) {
      var cand;
      var r = Math.random();
      if (r < 0.4) cand = roots.map(function (x) { return -x; });                    // 符号ミス
      else if (r < 0.7) cand = roots.map(function (x) { return x + Quiz.pick([1, -1, 2]); });
      else cand = [A.nz(-8, 8), A.nz(-8, 8)];
      // すでに使った組と同じものは作らない（順番ちがいの重複を防ぐ）
      if (used.some(function (u) { return sameSet(u, cand); })) continue;
      used.push(cand);
      choices.push(fmtRoots(cand.sort(function (x, y) { return x - y; })));
    }

    return {
      tag: tag,
      text: '次の2次関数のグラフと x 軸との共有点の x 座標を求めなさい。',
      math: show,
      figure: Graph.parabola({
        a: a, b: b, c: c,
        points: roots.map(function (x) { return { x: x, y: 0 }; })
      }),
      type: 'choice',
      choices: choices,
      correct: 0,
      hint: hint,
      explain: explain
    };
  }

  /* ---------- 記述で答える ---------- */
  function inputQuestion() {
    var it = A.quadraticFromRoots({ lo: -7, hi: 7, allowSame: false });
    var roots = [-it.a, -it.b].sort(function (x, y) { return x - y; });
    return {
      tag: '記述',
      text: '次の2次関数のグラフと x 軸との共有点の x 座標を、すべて求めなさい。',
      math: 'y = ' + it.expanded,
      type: 'input',
      answer: roots,                       // 配列を渡すと解の組として判定される
      answerLabel: fmtRoots(roots),
      placeholder: '例： -2, 3',
      note: 'カンマで区切って入力します。順番は自由です。',
      hint: 'y = 0 とおいて、因数分解して解きます。',
      explain: '因数分解すると ' + it.factored + ' = 0。答えは ' + fmtRoots(roots) + ' です。'
    };
  }

  Quiz.start({
    title: '2次関数とx軸の共有点',
    subtitle: '共有点の個数から、座標を求めるところまで。',
    modes: [
      { id: '0', name: 'レベル0：共有点の個数', desc: '判別式で判定（10問）' },
      { id: '1', name: 'レベル1：因数分解', desc: '共有点の座標を求める（10問）' },
      { id: '2', name: 'レベル2：解の公式', desc: '因数分解できない場合（8問）' },
      { id: '3', name: 'レベル3：総合', desc: 'レベル0〜2をまぜて（12問）' },
      { id: 'i', name: '記述で答える', desc: '自分で書く（8問）' }
    ],
    build: function (id) {
      var out = [], i;
      if (id === '0') { for (i = 0; i < 10; i++) out.push(level0()); }
      else if (id === '1') { for (i = 0; i < 10; i++) out.push(level1()); }
      else if (id === '2') { for (i = 0; i < 8; i++) out.push(level2()); }
      else if (id === 'i') { for (i = 0; i < 8; i++) out.push(inputQuestion()); }
      else {
        for (i = 0; i < 4; i++) { out.push(level0()); out.push(level1()); out.push(level2()); }
        out = Quiz.shuffle(out);
      }
      return out;
    }
  });
})();
</script>
</body>
</html>
