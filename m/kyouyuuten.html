        function setLevel(level) {
            currentLevel = level;
            currentProblemIndex = 0;
            // 【ブラッシュアップ】元は前のレベルの正解数・問題数が残り、レベル完了の正解率に混ざっていた
            correctCount = 0; totalCount = 0; firstTry = true; cleanCount = 0;
            document.getElementById('correct').textContent = 0;
            document.getElementById('total').textContent = 0;
            levelProblems = [...problems[currentLevel]];
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));

            // レベルボタンのアクティブ状態を更新
            const levelButtons = document.querySelectorAll('.level-btn');
            levelButtons[level].classList.add('active');

            // クイズエリアを元に戻す
            const quizArea = document.querySelector('.quiz-area');
            const questionText = level === 0 ?
                "次の式を因数分解しなさい" :
                "次の二次関数とx軸との共有点のx座標を求めなさい";
            const hintTitle = level === 0 ? "💡 因数分解のヒント" : "💡 計算のヒント";

            quizArea.innerHTML = `
                <div class="question-text" id="questionText">
                    ${questionText}
                </div>
                <div class="problem" id="problem"></div>

                <div style="text-align: center;">
                    <button class="hint-btn" onclick="showHint()" id="hintBtn">💡 ヒントを見る</button>
                </div>

                <div class="hint-section" id="hintSection">
                    <div class="hint-title">${hintTitle}</div>
                    <div class="factorization" id="factorization"></div>
                </div>

                <div class="choices" id="choices">
                    <!-- 選択肢がここに表示されます -->
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <button class="next-btn" onclick="nextProblem()" id="nextBtn" style="display: none;">次の問題</button>
                </div>

                <div id="result" class="result" style="display: none;"></div>
                <div id="explanation" class="explanation" style="display: none;"></div>
            `;

            nextProblem();
        }

        let hintStep = 0;
        let firstTry = true, cleanCount = 0;   // 【ブラッシュアップ】一発で正解できた問題の数

        function showHint() {
            const hintSection = document.getElementById('hintSection');
            const hintBtn = document.getElementById('hintBtn');
            const factorization = document.getElementById('factorization');

            if (currentLevel === 0 || currentLevel === 1 || currentLevel === 2) {
                // レベル0-2は2段階ヒント
                hintStep++;
                if (hintStep === 1) {
                    factorization.innerHTML = currentProblem.hint1;
                    hintSection.style.display = 'block';
                    hintBtn.textContent = '💡 ヒント2';
                } else {
                    factorization.innerHTML = currentProblem.hint2;
                    hintBtn.style.display = 'none';
                }
            } else {
                // レベル3は1段階ヒント
                factorization.innerHTML = currentProblem.hint1;
                hintSection.style.display = 'block';
                hintBtn.style.display = 'none';
            }
        }

        function nextProblem() {
            if (currentProblemIndex >= 5) {
                showLevelComplete();
                return;
            }

            if (levelProblems.length === 0) {
                levelProblems = [...problems[currentLevel]];
            }

            firstTry = true;   // 【ブラッシュアップ】
            const randomIndex = Math.floor(Math.random() * levelProblems.length);
            currentProblem = levelProblems[randomIndex];
            levelProblems.splice(randomIndex, 1);

            document.getElementById('problem').innerHTML = currentProblem.equation;

            // ヒントステップをリセット
            hintStep = 0;

            // ヒントを隠す
            document.getElementById('hintSection').style.display = 'none';
            document.getElementById('hintBtn').style.display = 'inline-block';
            document.getElementById('hintBtn').textContent = (currentLevel === 0 || currentLevel === 1 || currentLevel === 2) ? '💡 ヒント1' : '💡 ヒントを見る';

            // 選択肢をシャッフルして表示
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';

            // 選択肢をシャッフル
            const shuffledChoices = [...currentProblem.choices];
            for (let i = shuffledChoices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledChoices[i], shuffledChoices[j]] = [shuffledChoices[j], shuffledChoices[i]];
            }

            // 現在の選択肢の順番を保存
            currentChoicesOrder = [...shuffledChoices];

            shuffledChoices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => selectAnswer(choice, button);
                choicesDiv.appendChild(button);
            });

            document.getElementById('result').style.display = 'none';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function showLevelComplete() {
            const quizArea = document.querySelector('.quiz-area');
            quizArea.innerHTML = `
                <div class="level-complete">
                    <h2>🎉 レベル${currentLevel}完了！</h2>
                    <p>おめでとうございます！すべての問題をクリアしました。</p>
                    <p>一発正解: ${cleanCount} / 5問（正解率 ${Math.round((correctCount / totalCount) * 100)}%）</p>
                    <!-- 【ブラッシュアップ】同じレベル・次のレベル・ほかの教材 を選べるようにした（元はレベル3のあと、レベル0をとばしてレベル1に戻っていた） -->
                    <div class="done-nav">
                        ${currentLevel < 3 ? '<button class="next" onclick="goToNextLevel()">次のレベルへ ▶</button>' : ''}
                        <button class="again" onclick="setLevel(currentLevel)">同じレベルでもう一度</button>
                        ${currentLevel === 3 ? '<button class="back" onclick="setLevel(0)">レベル0から始める</button>' : ''}
                        <a href="../remake.html">ほかの教材をえらぶ</a>
                    </div>
                </div>
            `;
        }

        function goToNextLevel() {
            if (currentLevel < 3) {
                setLevel(currentLevel + 1);
            } else {
                setLevel(1);
            }
        }

        function selectAnswer(selectedChoice, buttonElement) {
            const resultDiv = document.getElementById('result');
            const explanationDiv = document.getElementById('explanation');
            const allButtons = document.querySelectorAll('.choice-btn');

            // すべてのボタンを無効化
            allButtons.forEach(btn => {
                btn.classList.add('disabled');
                btn.onclick = null;
            });

            if (selectedChoice === currentProblem.correct) {
                // 正解の場合
                buttonElement.classList.add('correct');   // 【ブラッシュアップ】
                if (firstTry) cleanCount++;
                correctCount++;
                totalCount++;
                currentProblemIndex++;
                document.getElementById('correct').textContent = correctCount;
                document.getElementById('total').textContent = totalCount;

                resultDiv.innerHTML = '🎉 正解です！';
                resultDiv.className = 'result correct';
                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                // 不正解の場合
                firstTry = false;   // 【ブラッシュアップ】
                totalCount++;
                document.getElementById('total').textContent = totalCount;

                buttonElement.classList.add('selected');

                const encouragingMessages = [
                    '❌ 惜しい！でも大丈夫、きっとできるよ！',
                    '❌ あと少し！君ならできる！',
                    '❌ 間違いは成長のチャンス！',
                    '❌ 全然大丈夫！みんな最初は間違えるものだよ。',
                    '❌ いい調子！間違いを恐れずに挑戦する姿勢が素晴らしい！'
                ];
                const randomMessage = encouragingMessages[Math.floor(Math.random() * encouragingMessages.length)];
                resultDiv.innerHTML = randomMessage;
                resultDiv.className = 'result incorrect';

                // もう一度挑戦ボタンを表示
                setTimeout(() => {
                    const tryAgainBtn = document.createElement('button');
                    tryAgainBtn.className = 'next-btn try-again-btn';
                    tryAgainBtn.textContent = 'もう一度挑戦';
                    tryAgainBtn.onclick = tryAgain;
                    tryAgainBtn.style.marginTop = '10px';
                    resultDiv.appendChild(tryAgainBtn);
                }, 1000);
            }

            resultDiv.style.display = 'block';

            // 正解時は正解の解説、不正解時はアドバイスを表示
            if (selectedChoice === currentProblem.correct) {
                explanationDiv.innerHTML = '<strong>解説：</strong><br>' + currentProblem.correctExplanation;
            } else {
                explanationDiv.innerHTML = '<strong>アドバイス：</strong><br>' + currentProblem.wrongAdvice;
            }
            explanationDiv.style.display = 'block';
        }

        function tryAgain() {
            // 選択肢を保存された順番で表示（シャッフルしない）
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';

            // 保存された順番で選択肢を表示
            currentChoicesOrder.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => selectAnswer(choice, button);
                choicesDiv.appendChild(button);
            });

            // 結果のメッセージのみ非表示（解説は残す）
            document.getElementById('result').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        // 初期化
        setLevel(0);
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    "h1": "u-title",
    ".level-btn:not(.active)": "u-btn u-btn-plain",
    ".level-btn.active": "u-btn",
    ".hint-btn": "u-btn",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.selected": "u-ng",
    ".next-btn:not(.try-again-btn)": "u-btn u-btn-blue",
    ".try-again-btn": "u-btn",
    ".done-nav .again": "u-btn",
    ".done-nav .next": "u-btn u-btn-blue",
    ".done-nav .back": "u-btn u-btn-plain"
  });
</script>
