        function loadProblem() {
            const P = list()[currentProblem];

        function M(n) { n = Math.round(n * 1000) / 1000; return n < 0 ? '−' + Math.abs(n) : String(n); }

        function showStep() {
            const st = list()[currentProblem].steps[stepIndex];
            document.getElementById('questionText').textContent = st.question;
            order = st.choices.map((c, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            const box = document.getElementById('choicesContainer');
            box.innerHTML = '';
            box.className = 'choices' + (st.choices.some(c => c.length > 22) ? ' wide' : '');
            order.forEach((k, pos) => {
                const b = document.createElement('button');

                st.choices[k].split('|').forEach((line, li) => {

                    s.className = li === 0 ? 'c-main' : 'c-sub';

        function checkAnswer(k, button) {
            const P = list()[currentProblem], st = P.steps[stepIndex];
            const result = document.getElementById('result');

                button.classList.add('correct');
                document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

        // --- 答えたあとのグラフ：graph.js で描き、頂点・両端の座標と軸を書きこむ ---
        function drawGraph(P) {
            const box = document.getElementById('graphBox');
            if (P.summary || !window.Graph) { box.style.display = 'none'; return; }
            const p = -P.b / (2 * P.a), q = P.a * p * p + P.b * p + P.c, D = P.domain;
            const inside = !D || (p >= D[0] && p <= D[1]);
            const xmin = D ? Math.min(D[0], p) - 1 : p - 3, xmax = D ? Math.max(D[1], p) + 1 : p + 3;
            const pts = [];
            if (D) D.forEach(x => pts.push({ x, y: P.a * x * x + P.b * x + P.c, label: '(' + M(x) + ', ' + M(P.a * x * x + P.b * x + P.c) + ')' }));
            if (inside) pts.push({ x: p, y: q, label: '頂点 (' + M(p) + ', ' + M(q) + ')' });
            let svg = Graph.parabola({ a: P.a, b: P.b, c: P.c, xmin, xmax, domain: D || undefined, markVertex: !inside, points: pts });
            svg = addAxisLine(svg, p, inside);
            box.innerHTML = svg + '<div class="graph-note">' + (D ? '赤い太線が定義域の部分。● は両端' + (inside ? '' : '（オレンジの点は定義域の外の頂点）') : '緑の点が頂点') + '</div>';
            const s = box.querySelector('svg');
            if (s) { s.removeAttribute('width'); s.style.width = '100%'; s.style.maxWidth = '440px'; s.style.height = 'auto'; }
            box.style.display = 'block';
        }
        // 軸 x = p の点線（graph.js の図から座標の変換を読みとって足す）
        function addAxisLine(svg, p) {
            const xt = [...svg.matchAll(/<text x="([\d.]+)" y="[\d.]+" font-size="10" fill="#8896aa" text-anchor="middle">(-?\d+)<\/text>/g)].map(r => [+r[2], +r[1]]);
            if (xt.length < 2) return svg;
            const X = xt[0][1] + (p - xt[0][0]) * (xt[1][1] - xt[0][1]) / (xt[1][0] - xt[0][0]);
            const add = '<line x1="' + X.toFixed(1) + '" y1="26" x2="' + X.toFixed(1) + '" y2="274" stroke="#e79b16" stroke-width="1.2" stroke-dasharray="3,4"/>' +
                '<text x="' + (X + 4).toFixed(1) + '" y="290" font-size="11" fill="#b45309" stroke="#fff" stroke-width="3" paint-order="stroke">軸 x = ' + M(p) + '</text>';
            const i = svg.indexOf('<path');
            return svg.slice(0, i) + add + svg.slice(i);
        }

        function nextProblem() {
            currentProblem++;
            if (currentProblem >= list().length) {
                if (currentStage === 1) { currentStage = 2; currentProblem = 0; loadProblem(); window.scrollTo(0, 0); return; }
                showCompletion();
                return;
            }
            loadProblem();
            document.getElementById('stageInfo').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showCompletion() {
            document.getElementById('problemSection').style.display = 'none';
            document.getElementById('progressBar').style.width = '100%';
            const box = document.getElementById('doneBox');
            const title = { 1: '🎊 レベル1クリア！', 2: '🏆 レベル2クリア！', 3: '🏆 レベル3クリア！' }[currentLevel];
            const msg = { 1: '平方完成から最大値・最小値を求められたね。', 2: '定義域の問題もマスター！ 軸の位置と両端の値をくらべるのがコツ。', 3: '軸の位置で場合分けできたね。数学Ⅰの最大・最小の完成！' }[currentLevel];
            box.innerHTML = '<h2>' + title + '</h2><p>' + msg + '</p><div class="done-score">一発正解 ' + cleanCount + ' / ' + solvedCount + ' 問</div>' +
                '<div class="done-nav">' + (currentLevel < 3 ? '<button class="next" onclick="startLevel(' + (currentLevel + 1) + ')">🚀 レベル' + (currentLevel + 1) + 'に挑戦</button>' : '') +
                '<button class="again" onclick="startLevel(' + currentLevel + ')">レベル' + currentLevel + 'をもう一度</button>' +
                '<button class="back" onclick="backToMenu()">レベル選択に戻る</button><a href="../remake.html">ほかの教材をえらぶ</a></div>';
            box.style.display = 'block';
            window.scrollTo(0, 0);
        }

        function backToMenu() {
            document.getElementById('levelSelection').style.display = 'block';
            document.getElementById('problemSection').style.display = 'none';
            document.getElementById('stageInfo').style.display = 'none';
            document.getElementById('progressWrap').style.display = 'none';
            document.getElementById('doneBox').style.display = 'none';
        }
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    "h1": "u-title",
    ".level-btn": "u-choice",
    ".progress": "u-progress",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.incorrect": "u-ng",
    "#nextBtn": "u-btn u-btn-blue",
    "#hintBtn": "u-btn",
    ".next-btn.menu-btn": "u-btn u-btn-plain",
    ".done-nav .again": "u-btn",
    ".done-nav .next": "u-btn u-btn-blue",
    ".done-nav .back": "u-btn u-btn-plain"
  });
</script>
