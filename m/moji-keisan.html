<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字式の計算</title>
<link rel="stylesheet" href="../assets/base.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="../assets/mathcore.js"></script>
<script src="../assets/quiz.js"></script>
<script src="../assets/algebra.js"></script>
<script>
/* ---------------------------------------------------------------------------
   06. 文字式の計算（四則計算・分配法則）
     たし算ひき算（同類項）／かけ算わり算（単項式）／分配法則／総合

   元教材から直した点：
     ・分配法則で、かっこの前がマイナスのときの符号処理がまちがった
       選択肢が正解になっていることがあった。
       → 式は係数の計算から機械的に作り、選択肢は数式として突き合わせる。
     ・わり算の答えを分数で書くと不正解になっていた。
       → 「x/2」「0.5x」どちらでも正解になる（数式として同値なら正解）。
     ・難易度を上げると問題が作れず、画面が真っ白になることがあった。
       → 作れなかったときは作り直すので、真っ白にならない。
--------------------------------------------------------------------------- */
(function () {
  'use strict';

  var A = Algebra, F = Quiz.fmt, M = MathCore;

  /* ---------- 同類項のたし算・ひき算 ---------- */
  function addSub(level) {
    var v = Quiz.pick(['x', 'a', 'y']);
    var n = level >= 2 ? 4 : 3;             // 項の数
    var terms = [];
    for (var i = 0; i < n; i++) {
      var isVar = Math.random() < 0.6;
      terms.push({ c: A.nz(-9, 9), v: isVar ? v : '' });
    }
    var sumV = 0, sumC = 0;
    terms.forEach(function (t) { if (t.v) sumV += t.c; else sumC += t.c; });

    var shown = terms.map(function (t, i) {
      var body = F.term(Math.abs(t.c), t.v);
      if (i === 0) return (t.c < 0 ? '-' : '') + body;
      return (t.c < 0 ? ' - ' : ' + ') + body;
    }).join('');

    var answer = F.poly([[sumV, v], [sumC, '']]);
    return {
      question: shown,
      answer: answer,
      hint: v + ' がついた項どうし、数だけの項どうしをまとめます。',
      explain: v + ' の項の合計は ' + sumV + '、数の項の合計は ' + sumC + '。答えは ' + answer + ' です。'
    };
  }

  /* ---------- 単項式のかけ算・わり算 ---------- */
  function mulDiv(level) {
    var isMul = Math.random() < 0.6;
    var c1 = A.nz(-6, 6), c2 = A.nz(-6, 6);
    var e1 = Quiz.randInt(1, level >= 2 ? 3 : 2);
    var e2 = Quiz.randInt(1, level >= 2 ? 2 : 1);

    var left = F.term(c1, F.pow('x', e1));
    var right = F.term(c2, F.pow('x', e2));

    if (isMul) {
      var c = c1 * c2, e = e1 + e2;
      var answer = F.term(c, F.pow('x', e));
      return {
        question: left + ' × ' + right,
        answer: answer,
        hint: '数どうしをかけ、文字は指数をたします。',
        explain: '数： ' + c1 + ' × ' + c2 + ' = ' + c + '　　文字： x' +
          (e1 > 1 ? '<sup>' + e1 + '</sup>' : '') + ' × x' + (e2 > 1 ? '<sup>' + e2 + '</sup>' : '') +
          ' = ' + F.pow('x', e) + '　　答え： ' + answer
      };
    }

    // わり算は、割り切れる形に整えてから出す
    if (e1 < e2) { var t = e1; e1 = e2; e2 = t; }
    var num = c1 * c2;                       // 被除数の係数を c2 の倍数にしておく
    var answer2 = F.term(c1, F.pow('x', e1 - e2));
    return {
      question: F.term(num, F.pow('x', e1)) + ' ÷ ' + F.term(c2, F.pow('x', e2)),
      answer: answer2,
      hint: '数どうしをわり、文字は指数をひきます。',
      explain: '数： ' + num + ' ÷ ' + c2 + ' = ' + c1 + '　　文字： 指数は ' + e1 + ' − ' + e2 +
        ' = ' + (e1 - e2) + '　　答え： ' + answer2
    };
  }

  /* ---------- 分配法則 ---------- */
  function distribute(level) {
    var k = A.nz(-7, 7);
    var p = A.nz(1, 6), q = A.nz(-9, 9);
    var inner = A.linear(p, q);
    var head = k === 1 ? '' : k === -1 ? '-' : String(k);

    if (level >= 2) {
      // 2つのかっこを展開して同類項までまとめる
      var k2 = A.nz(-6, 6), p2 = A.nz(1, 6), q2 = A.nz(-9, 9);
      var inner2 = A.linear(p2, q2);
      var head2 = k2 === 1 ? '' : k2 === -1 ? '-' : String(k2);
      var sign = k2 < 0 ? ' - ' : ' + ';
      var head2abs = Math.abs(k2) === 1 ? '' : String(Math.abs(k2));

      var cx = k * p + k2 * p2, cc = k * q + k2 * q2;
      var ans = F.poly([[cx, 'x'], [cc, '']]);
      return {
        question: head + '(' + inner + ')' + sign + head2abs + '(' + inner2 + ')',
        answer: ans,
        hint: 'それぞれのかっこを外してから、同類項をまとめます。ひき算のときは符号に注意。',
        explain: '外すと ' + F.poly([[k * p, 'x'], [k * q, '']]) + ' と ' +
          F.poly([[k2 * p2, 'x'], [k2 * q2, '']]) + '。まとめて ' + ans + ' です。'
      };
    }

    var ans1 = F.poly([[k * p, 'x'], [k * q, '']]);
    return {
      question: head + '(' + inner + ')',
      answer: ans1,
      hint: 'かっこの外の数を、中のどの項にもかけます。マイナスのときは符号が全部変わります。',
      explain: k + ' × ' + p + 'x = ' + (k * p) + 'x、' + k + ' × (' + q + ') = ' + (k * q) +
        '。答えは ' + ans1 + ' です。'
    };
  }

  /* ---------- 出題の形にする ---------- */

  function toChoice(item) {
    var correctPlain = F.plain(item.answer);
    var wrongs = [];
    var guard = 0;
    while (wrongs.length < 3 && guard++ < 80) {
      // 数字をひとつだけずらした式を誤答の候補にする
      var cand = item.answer.replace(/(-?\d+)/, function (m) {
        return String(Number(m) + Quiz.pick([-2, -1, 1, 2]));
      });
      if (cand === item.answer) continue;
      if (M.isEqual(F.plain(cand), correctPlain)) continue;
      if (wrongs.indexOf(cand) >= 0) continue;
      wrongs.push(cand);
    }
    // それでも足りなければ符号を反転したものを足す
    guard = 0;
    while (wrongs.length < 3 && guard++ < 20) {
      var neg = item.answer.indexOf('-') === 0 ? item.answer.slice(1) : '-' + item.answer;
      if (!M.isEqual(F.plain(neg), correctPlain) && wrongs.indexOf(neg) < 0) wrongs.push(neg);
      else wrongs.push(String(Quiz.randInt(-20, 20)) + 'x');
    }

    return {
      text: '次の計算をしなさい。',
      math: item.question,
      type: 'choice',
      choices: [item.answer].concat(wrongs.slice(0, 3)),
      correct: 0,
      hint: item.hint,
      explain: item.explain
    };
  }

  function toInput(item) {
    return {
      text: '次の計算をしなさい。',
      math: item.question,
      type: 'input',
      answer: F.plain(item.answer),
      answerLabel: item.answer,
      placeholder: '例： 3x + 5',
      note: '2乗は「x^2」または「x²」。分数は「x/2」のように書けます。',
      hint: item.hint,
      explain: item.explain
    };
  }

  var MAKERS = { add: addSub, mul: mulDiv, dist: distribute };

  function build(kind, level, style, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var maker = kind === 'all' ? MAKERS[Quiz.pick(['add', 'mul', 'dist'])] : MAKERS[kind];
      var item = maker(level);
      out.push(style === 'choice' ? toChoice(item) : toInput(item));
    }
    return out;
  }

  Quiz.start({
    title: '文字式の計算',
    subtitle: '四則計算と分配法則。まちがえやすい符号を、ていねいにつぶしていこう。',
    modes: [
      { id: 'add:1:choice', group: 'たし算・ひき算（同類項）', name: '4択', desc: '10問' },
      { id: 'add:1:input', group: 'たし算・ひき算（同類項）', name: '記述', desc: '8問' },
      { id: 'mul:1:choice', group: 'かけ算・わり算（単項式）', name: '4択', desc: '10問' },
      { id: 'mul:2:input', group: 'かけ算・わり算（単項式）', name: '記述（発展）', desc: '8問' },
      { id: 'dist:1:choice', group: '分配法則', name: '4択', desc: '10問' },
      { id: 'dist:1:input', group: '分配法則', name: '記述', desc: '8問' },
      { id: 'dist:2:input', group: '分配法則', name: '記述（2つのかっこ）', desc: '8問' },
      { id: 'all:2:choice', group: '総合', name: '総合バトル　4択', desc: '全種類まぜて12問' },
      { id: 'all:2:input', group: '総合', name: '総合バトル　記述', desc: '全種類まぜて10問' }
    ],
    build: function (id) {
      var p = id.split(':');
      var n = p[2] === 'choice' ? (p[0] === 'all' ? 12 : 10) : (p[0] === 'all' ? 10 : 8);
      return build(p[0], Number(p[1]), p[2], n);
    }
  });
})();
</script>
</body>
</html>
