    <script>
        // 【ブラッシュアップ】問題データと、図・判定の部分を作り直した本体。元の「4 レベル・ヒント・選択式」の流れはそのまま。
        //   ・図：直角三角形を辺の比・角度どおりにかく（元はどの問題も同じ形で、「底辺 3・高さ 4」なのに底辺のほうが長かった）。
        //         直角の印・角の印をつけ、文字は回転させずに三角形の外側におく（はみ出し・線との重なりをなくした）
        //   ・レベル1：選択肢は「正しい図」「辺の長さが入れかわった図」「ちがう角が左下の図」など、図形として意味のある 4 つに
        //   ・レベル2：90° − θ の問題（sin C = cos A）を追加。ヒントでは答えの数を出さない
        //   ・レベル3：有名角の値（元の名前は「応用問題」だった）。出す順をまぜる
        //   ・レベル4：元は「レベル3のシャッフル」だった。辺の長さを求める・90° − θ・三角比の表などの応用問題に
        //   ・正解したら理由を一言、まちがえたら「えらんだものが何なのか」を一言。まちがえた選択肢は押せなくなり、そのままえらび直せる
        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;
        let missedThis = false;   // この問題でまちがえたか（一発正解だけを点にする）
        let order = [0, 1, 2, 3];
        let levelQuestions = {};

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ---------- 数式の表示（分数は縦、√ は上に線） ----------
        function rtHTML(s) { return String(s).replace(/√(\d+)/g, '<span class="rt">√<span class="rt-in">$1</span></span>'); }
        function mathHTML(s) {   // "√3/2" → 縦の分数。"−" はそのまま前に
            s = String(s);
            let sign = '';
            if (s[0] === '−') { sign = '−'; s = s.slice(1); }
            if (s.includes('/')) { const [n, d] = s.split('/'); return sign + '<span class="fr"><span class="fr-n">' + rtHTML(n) + '</span><span class="fr-d">' + rtHTML(d) + '</span></span>'; }
            return sign + rtHTML(s);
        }
        function gcd(a, b) { return b ? gcd(b, a % b) : a; }
        function ratio(n, d) { const g = gcd(n, d); return (n / g) + '/' + (d / g); }

        // ---------- 直角三角形の図 ----------
        // 頂点 V（左下にしたい角）・R（直角）・T。VR = p、RT = q（数学の座標で V = (0, 0)、R = (p, 0)、T = (p, q)）。
        // o.rot：画面で時計回りに回す角度、o.fx / o.fy：左右・上下の反転（回す前に）、o.names：{V, R, T} の文字、
        // o.sides：{VR, RT, VT} に書く文字、o.mark：角の印をつける頂点（'V' / 'T'）、o.markText：印の横の文字、
        // o.red / o.w / o.h / o.pad は呼び出しの互換性のため残す。o.fs > 1 は選択肢用。
        function triSVG(o) {
            const compact = (o.fs || 1) > 1;
            const w = compact ? 220 : 360, h = compact ? 220 : 280;
            const pad = compact ? 46 : 48, fs = compact ? 24 / 18 : 1;   // pad：辺の長さの文字が入るすきま、fs：文字の大きさの倍率
            const th = -(o.rot || 0) * Math.PI / 180;
            let P = { V: [0, 0], R: [o.p, 0], T: [o.p, o.q] };
            Object.keys(P).forEach(k => {
                let [x, y] = P[k];
                if (o.fx) x = -x;
                if (o.fy) y = -y;
                P[k] = [x * Math.cos(th) - y * Math.sin(th), x * Math.sin(th) + y * Math.cos(th)];
            });
            const xs = Object.values(P).map(v => v[0]), ys = Object.values(P).map(v => v[1]);
            const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
            const s = Math.min((w - 2 * pad) / (maxx - minx || 1), (h - 2 * pad) / (maxy - miny || 1));
            const ox = (w - (maxx - minx) * s) / 2, oy = (h - (maxy - miny) * s) / 2;
            const S = {};   // 画面の座標（y は下向き）
            Object.keys(P).forEach(k => { S[k] = [ox + (P[k][0] - minx) * s, oy + (maxy - P[k][1]) * s]; });
            const G = [(S.V[0] + S.R[0] + S.T[0]) / 3, (S.V[1] + S.R[1] + S.T[1]) / 3];
            const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [dx / L, dy / L]; };
            const f = v => v.toFixed(1);
            let out = '<svg class="tri" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="直角三角形">';
            out += '<polygon points="' + ['V', 'R', 'T'].map(k => f(S[k][0]) + ',' + f(S[k][1])).join(' ') + '" fill="#f1f6fc" stroke="#1f2328" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
            // 直角の印
            const u1 = unit(S.R, S.V), u2 = unit(S.R, S.T), m = 12;
            out += '<path d="M ' + f(S.R[0] + u1[0] * m) + ' ' + f(S.R[1] + u1[1] * m) + ' L ' + f(S.R[0] + (u1[0] + u2[0]) * m) + ' ' + f(S.R[1] + (u1[1] + u2[1]) * m) + ' L ' + f(S.R[0] + u2[0] * m) + ' ' + f(S.R[1] + u2[1] * m) + '" fill="none" stroke="#1f2328" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
            // 角の印
            if (o.mark) {
                const M = S[o.mark], A = S.R, B = S[o.mark === 'V' ? 'T' : 'V'];
                const a1 = unit(M, A), a2 = unit(M, B), r = 22;
                const cross = a1[0] * a2[1] - a1[1] * a2[0];
                out += '<path d="M ' + f(M[0] + a1[0] * r) + ' ' + f(M[1] + a1[1] * r) + ' A ' + r + ' ' + r + ' 0 0 ' + (cross > 0 ? 1 : 0) + ' ' + f(M[0] + a2[0] * r) + ' ' + f(M[1] + a2[1] * r) + '" fill="none" stroke="#d9480f" stroke-width="2" vector-effect="non-scaling-stroke"/>';
                if (o.markText) {
                    const bis = unit([0, 0], [a1[0] + a2[0], a1[1] + a2[1]]);
                    const half = Math.acos(Math.max(-1, Math.min(1, a1[0] * a2[0] + a1[1] * a2[1]))) / 2;
                    const dd = Math.max(56, Math.min(100, 18 / Math.tan(half)));   // 小さい角でも文字が角の内側に入るように
                    out += '<text x="' + f(M[0] + bis[0] * dd) + '" y="' + f(M[1] + bis[1] * dd) + '" font-size="18" font-weight="700" font-family="BIZ UDPGothic, sans-serif" fill="#d9480f" text-anchor="middle" dominant-baseline="central">' + o.markText + '</text>';
                }
            }
            // 頂点の文字（重心から外向き）
            ['V', 'R', 'T'].forEach(k => {
                const d = unit(G, S[k]);
                const name = o.names[k];
                out += '<text x="' + f(S[k][0] + d[0] * 17 * fs) + '" y="' + f(S[k][1] + d[1] * 17 * fs) + '" font-size="' + 18 * fs + '" font-weight="400" font-style="italic" font-family="STIX Two Text, serif" text-anchor="middle" dominant-baseline="central" fill="' + '#1f2328' + '">' + name + '</text>';
            });
            // 辺の長さ（辺の中点から外向き）
            [['VR', 'V', 'R', 'T'], ['RT', 'R', 'T', 'V'], ['VT', 'V', 'T', 'R']].forEach(([key, a, b, c]) => {
                const t = o.sides && o.sides[key];
                if (!t) return;
                const mx = (S[a][0] + S[b][0]) / 2, my = (S[a][1] + S[b][1]) / 2;
                let n = unit(S[a], S[b]); n = [-n[1], n[0]];
                if ((S[c][0] - mx) * n[0] + (S[c][1] - my) * n[1] > 0) n = [-n[0], -n[1]];
                const tw = 11 * fs * String(t).replace(/<[^>]+>/g, '').length;   // 文字のはば（およそ）
                const dist = 12 + Math.abs(n[0]) * tw / 2 + Math.abs(n[1]) * 10 * fs;
                const color = { '斜辺': '#1f4e8c', '対辺': '#c92a2a', '隣辺': '#2b8a3e' }[t];
                if (color) out += '<line x1="' + f(S[a][0]) + '" y1="' + f(S[a][1]) + '" x2="' + f(S[b][0]) + '" y2="' + f(S[b][1]) + '" stroke="' + color + '" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>';
                const root = String(t).match(/√(\d+)$/);
                out += '<text x="' + f(mx + n[0] * dist) + '" y="' + f(my + n[1] * dist) + '" font-size="' + 18 * fs + '" font-weight="700" font-family="BIZ UDPGothic, sans-serif" fill="' + (color || (t === '?' ? '#1f4e8c' : '#1f2328')) + '" text-anchor="middle" dominant-baseline="central">' + svgRoot(t) + '</text>';
                // 上線は SVG の text-decoration に頼らず、数字の上に明示して描く。
                if (root) {
                    const x = mx + n[0] * dist, y = my + n[1] * dist;
                    out += '<line x1="' + f(x + tw / 2 - root[1].length * 11 * fs) + '" y1="' + f(y - 11 * fs) + '" x2="' + f(x + tw / 2) + '" y2="' + f(y - 11 * fs) + '" stroke="#1f2328" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
                }
            });
            return out + '</svg>';
        }
        function jpText(t) { return /[ぁ-んァ-ヶ一-龥]/.test(String(t)); }   // 日本語をふくむか（図の文字の書体を分ける）
        function svgRoot(t) { return String(t); }

        // ---------- レベル1：三角形の向きをそろえる ----------
        // V：左下にしたい角、R：直角、T：もう 1 つの角。a = VR、b = RT、c = VT。tf：元の図の向き
        const OTHER = { A: ['B', 'C'], B: ['A', 'C'], C: ['A', 'B'] };
        const L1 = [
            { V: 'A', a: 3, b: 4, c: 5, tf: { rot: 45 }, text: '回転させて' },
            { V: 'B', a: 5, b: 12, c: 13, tf: { rot: 120 }, text: '回転させて' },
            { V: 'C', a: 8, b: 15, c: 17, tf: { fx: true }, text: '左右反転させて' },
            { V: 'A', a: 7, b: 24, c: 25, tf: { fy: true }, text: '上下反転させて' },
            { V: 'B', a: 9, b: 12, c: 15, tf: { fx: true, fy: true }, text: '左右反転と上下反転の両方を行って' },
            { V: 'C', a: 20, b: 21, c: 29, tf: { rot: 30 }, text: '回転させて' },
            { V: 'A', a: 12, b: 16, c: 20, tf: { fx: true, rot: -45 }, text: '裏返したり回したりして' },
            { V: 'B', a: 15, b: 20, c: 25, tf: { fx: true, rot: 150 }, text: '裏返したり回したりして' }
        ];
        function level1Question(d) {
            const [R, T] = OTHER[d.V];
            const names = { V: d.V, R, T };
            const original = triSVG({ p: d.a, q: d.b, ...d.tf, names, sides: { VR: d.a, RT: d.b, VT: d.c }, red: d.V, mark: 'V', w: 260, h: 220 });
            // 選択肢：左下の角・底辺・高さ（どれも直角は右下）
            const opts = [
                { left: d.V, top: T, p: d.a, q: d.b, kind: 'ok' },
                { left: d.V, top: T, p: d.b, q: d.a, kind: 'swap' },
                { left: T, top: d.V, p: d.b, q: d.a, kind: 'other' },
                { left: T, top: d.V, p: d.a, q: d.b, kind: 'other' }
            ];
            return {
                question: '下の直角三角形を' + d.text + '、直角が右下、<span class="angle-name">角' + d.V + '</span>が左下になるようにした図はどれですか？',
                figure: '<div><h4>元の三角形：</h4>' + original + '</div>',
                options: opts.map(o => triSVG({ p: o.p, q: o.q, names: { V: o.left, R, T: o.top }, sides: { VR: o.p, RT: o.q, VT: d.c }, red: d.V, mark: 'V', w: 220, h: 190, pad: 46, fs: 1.3 })),
                correct: 0,
                hint: 'まず直角（□の印）を右下におき、次に角' + d.V + 'が左下にくるように回したり裏返したりしよう。' +
                    '角' + d.V + 'と直角をむすぶ辺（斜辺ではない方）が底辺になるよ。辺の長さは向きを変えても変わらない。',
                exp: '直角' + R + 'を右下、角' + d.V + 'を左下にすると、底辺は ' + d.V + R + ' = ' + d.a + '、高さは ' + R + T + ' = ' + d.b + '、斜辺は ' + d.V + T + ' = ' + d.c + '。',
                why: opts.map(o => o.kind === 'ok' ? '' : o.kind === 'swap' ?
                    '左下は角' + d.V + 'で合っているけど、辺の長さがちがうよ。角' + d.V + 'と直角' + R + 'をむすぶ辺 ' + d.V + R + ' は ' + d.a + ' だよ。' :
                    'この図は左下が角' + T + 'になっているよ。問題は角' + d.V + 'を左下にした図だよ。')
            };
        }

        // ---------- レベル2：三角比の計算 ----------
        // 図：A が左下、B が直角（右下）、C が上。AB = a、BC = b、AC = c
        const L2 = [
            [3, 4, 5, 'sin', 'A'], [3, 4, 5, 'cos', 'A'], [3, 4, 5, 'tan', 'A'], [5, 12, 13, 'cos', 'A'], [6, 8, 10, 'tan', 'A'],
            [7, 24, 25, 'sin', 'A'], [9, 12, 15, 'cos', 'A'], [20, 21, 29, 'tan', 'A'], [12, 16, 20, 'sin', 'A'], [15, 20, 25, 'cos', 'A'],
            [3, 4, 5, 'sin', 'C'], [5, 12, 13, 'tan', 'C']   // 【ブラッシュアップ】もう 1 つの角 C（= 90° − A）
        ];
        const NAME = { sin: ['対辺', '斜辺'], cos: ['隣辺', '斜辺'], tan: ['対辺', '隣辺'] };
        function level2Question([a, b, c, fn, ang]) {
            // 角ごとの 対辺・隣辺（斜辺はどちらも AC = c）
            const side = ang === 'A' ? { opp: ['BC', b], adj: ['AB', a] } : { opp: ['AB', a], adj: ['BC', b] };
            const hyp = ['AC', c];
            const pick = { sin: [side.opp, hyp], cos: [side.adj, hyp], tan: [side.opp, side.adj] }[fn];
            const vals = [[a, c], [b, c], [a, b], [b, a]];   // 選択肢にする 4 つの比
            const opts = vals.map(([n, d]) => ratio(n, d));
            const ans = ratio(pick[0][1], pick[1][1]);
            // それぞれの比が「角 ang から見て何か」
            const meaning = ([n, d]) => {
                const nm = x => x === side.opp[1] ? '対辺' : x === side.adj[1] ? '隣辺' : '斜辺';
                const key = nm(n) + '/' + nm(d);
                const fnOf = { '対辺/斜辺': 'sin', '隣辺/斜辺': 'cos', '対辺/隣辺': 'tan' }[key];
                return fnOf ? fnOf + ' ' + ang + '（' + key + '）の値' : key + '（tan ' + ang + ' の逆数）';
            };
            return {
                question: '図の直角三角形で、<span class="angle-name">' + fn + ' ' + ang + '</span> の値はいくつですか？',
                figure: triSVG({ p: a, q: b, names: { V: 'A', R: 'B', T: 'C' }, sides: { VR: a, RT: b, VT: c }, red: ang, mark: ang === 'A' ? 'V' : 'T', w: 260, h: 210 }),
                options: opts.map(mathHTML),
                correct: opts.indexOf(ans),
                hint: fn + ' ' + ang + ' = ' + mathHTML(NAME[fn][0] + '/' + NAME[fn][1]) + '。角' + ang + 'から見て、向かい合う辺が「対辺」、角' + ang + 'ととなり合う斜辺でない辺が「隣辺」だよ。どの辺がどれかな？' +
                    '<br>' + triSVG({ p: a, q: b, names: { V: 'A', R: 'B', T: 'C' }, sides: ang === 'A' ? { VR: '隣辺', RT: '対辺', VT: '斜辺' } : { VR: '対辺', RT: '隣辺', VT: '斜辺' }, red: ang, mark: ang === 'A' ? 'V' : 'T', w: 240, h: 190 }),
                exp: fn + ' ' + ang + ' = ' + NAME[fn][0] + '/' + NAME[fn][1] + ' = ' + pick[0][0] + '/' + pick[1][0] + ' = ' + mathHTML(pick[0][1] + '/' + pick[1][1]) +
                    (ans !== pick[0][1] + '/' + pick[1][1] ? ' = ' + mathHTML(ans) + '（約分）' : '') +
                    (ang === 'C' ? '<br>C = 90° − A なので、' + fn + ' C = ' + { sin: 'cos', cos: 'sin', tan: '1/tan' }[fn] + ' A になっているね。' : ''),
                why: vals.map(v => ratio(v[0], v[1]) === ans ? '' : 'それは ' + meaning(v) + 'だよ。')
            };
        }

        // ---------- レベル3：有名角の値 ----------
        const VAL = { sin: { 30: '1/2', 45: '1/√2', 60: '√3/2' }, cos: { 30: '√3/2', 45: '1/√2', 60: '1/2' }, tan: { 30: '1/√3', 45: '1', 60: '√3' } };
        const L3 = [
            ['sin', 30, ['1/2', '1/√2', '√3/2', '1']], ['cos', 30, ['1/2', '1/√2', '√3/2', '1']], ['tan', 30, ['1/√3', '1/√2', '√3/2', '√3']],
            ['sin', 45, ['1/2', '1/√2', '√3/2', '1']], ['cos', 45, ['1/2', '1/√2', '√3/2', '1']], ['tan', 45, ['1/√3', '1', '1/√2', '√3']],
            ['sin', 60, ['1/2', '1/√2', '√3/2', '1']], ['cos', 60, ['1/2', '1/√2', '√3/2', '1']], ['tan', 60, ['1/√3', '1/√2', '√3/2', '√3']]
        ];
        // 有名角の三角形：左下の角が deg°。[底辺, 高さ, 斜辺]
        const SPECIAL = { 30: [Math.sqrt(3), 1, ['√3', '1', '2']], 45: [1, 1, ['1', '1', '√2']], 60: [1, Math.sqrt(3), ['1', '√3', '2']] };
        function specialSVG(deg, w, h) {
            const [p, q, t] = SPECIAL[deg];
            return triSVG({ p, q, names: { V: '', R: '', T: '' }, sides: { VR: t[0], RT: t[1], VT: t[2] }, mark: 'V', markText: deg + '°', w: w || 250, h: h || 190 });
        }
        function level3Question([fn, deg, opts]) {
            const ans = VAL[fn][deg];
            const whoHas = v => { const r = []; ['sin', 'cos', 'tan'].forEach(g => [30, 45, 60].forEach(x => { if (VAL[g][x] === v) r.push(g + ' ' + x + '°'); })); return r; };
            const [, , t] = SPECIAL[deg];
            const part = { sin: [t[1], t[2], '対辺', '斜辺'], cos: [t[0], t[2], '隣辺', '斜辺'], tan: [t[1], t[0], '対辺', '隣辺'] }[fn];
            return {
                question: '<span class="angle-name">' + fn + ' ' + deg + '°</span> の値はいくつですか？',
                figure: '',
                options: opts.map(mathHTML),
                correct: opts.indexOf(ans),
                hint: fn + ' = ' + mathHTML(NAME[fn][0] + '/' + NAME[fn][1]) + '。' + deg + '° の直角三角形の辺の比を思い出そう。<br>' + specialSVG(deg),
                exp: deg + '° の直角三角形（辺の比 ' + t[0] + ' : ' + t[1] + ' : ' + t[2] + '）で、' + fn + ' ' + deg + '° = ' + part[2] + '/' + part[3] + ' = ' + mathHTML(part[0] + '/' + part[1]) + (part[1] === '1' ? ' = ' + mathHTML(part[0]) : '') + '。',
                why: opts.map(v => v === ans ? '' : (whoHas(v).length ? mathHTML(v) + ' は ' + whoHas(v).join('・') + ' の値だよ。' : mathHTML(v) + ' は 30°・45°・60° のどの三角比の値でもないよ。'))
            };
        }

        // ---------- レベル4：応用問題 ----------
        // fig：三角形 { deg（左下の角）, sides：{VR, RT, VT} } を triSVG でかく。names は A（左下）・C（直角）・B（上）
        const L4 = [
            { q: '∠C = 90°、∠A = 30°、AB = 10 の直角三角形 ABC で、BC の長さは？', fig: { deg: 30, sides: { VT: '10', RT: '?' } },
              options: ['5', '5√3', '10√3', '20'], correct: 0, exp: 'BC は ∠A の対辺。BC = AB sin 30° = 10 × ' + mathHTML('1/2') + ' = 5',
              why: ['', '5√3 は AC（隣辺）の長さだよ（AC = 10 cos 30°）。', 'sin 30° をかけるところを割ったり、√3 をかけたりしていないかな？', '斜辺 AB がいちばん長い辺。BC は AB より短いよ。'] },
            { q: '∠C = 90°、∠A = 30°、AB = 10 の直角三角形 ABC で、AC の長さは？', fig: { deg: 30, sides: { VT: '10', VR: '?' } },
              options: ['5√3', '5', '10√3', '5√2'], correct: 0, exp: 'AC は ∠A の隣辺。AC = AB cos 30° = 10 × ' + mathHTML('√3/2') + ' = ' + mathHTML('5√3'),
              why: ['', '5 は BC（対辺）の長さだよ。', '10√3 は斜辺の 10 より長い。直角三角形では斜辺がいちばん長いよ。', '5√2 は 45° の三角形のときの値だよ。'] },
            { q: '∠C = 90°、∠A = 45°、AC = 6 の直角三角形 ABC で、斜辺 AB の長さは？', fig: { deg: 45, sides: { VR: '6', VT: '?' } },
              options: ['6√2', '6', '3√2', '12'], correct: 0, exp: '直角二等辺三角形で、辺の比は 1 : 1 : ' + mathHTML('√2') + '。AB = 6 × ' + mathHTML('√2') + ' = ' + mathHTML('6√2'),
              why: ['', '6 は BC の長さ（AC と同じ）だよ。斜辺はもっと長い。', '3√2 は 6 ÷ √2。斜辺は AC の √2 倍だよ。', '12 は 30° の三角形の斜辺（2 倍）と取りちがえているよ。'] },
            { q: '∠C = 90°、∠A = 60°、AC = 4 の直角三角形 ABC で、BC の長さは？', fig: { deg: 60, sides: { VR: '4', RT: '?' } },
              options: ['4√3', '8', '2√3', '4/√3'], correct: 0, exp: 'tan 60° = ' + mathHTML('BC/AC') + ' なので、BC = AC tan 60° = 4 × ' + mathHTML('√3') + ' = ' + mathHTML('4√3'),
              why: ['', '8 は斜辺 AB の長さ（AC の 2 倍）だよ。', '2√3 は 4 × √3/2（sin 60°）。BC/AC は tan 60° だよ。', '4/√3 は 4 ÷ √3。BC = AC × tan 60° だから、かけ算だよ。'] },
            { q: 'cos 70° を、45° 以下の角の三角比で表すと？', fig: null,
              options: ['sin 20°', 'cos 20°', 'sin 70°', 'tan 20°'], correct: 0, exp: 'cos(90° − θ) = sin θ。cos 70° = cos(90° − 20°) = sin 20°',
              why: ['', 'cos 20° は sin 70° と等しい値。cos(90° − θ) は sin θ になるよ。', '45° 以下の角で表そう。70° は 90° − 20° だよ。', 'tan(90° − θ) = 1/tan θ。cos は sin にかわるよ。'] },
            { q: 'sin 58° を、45° 以下の角の三角比で表すと？', fig: null,
              options: ['cos 32°', 'sin 32°', 'cos 58°', 'tan 32°'], correct: 0, exp: 'sin(90° − θ) = cos θ。sin 58° = sin(90° − 32°) = cos 32°',
              why: ['', 'sin 32° = cos 58°。sin(90° − θ) は cos θ になるよ。', '45° 以下の角で表そう。58° = 90° − 32° だよ。', 'sin(90° − θ) は cos θ。tan にはならないよ。'] },
            { q: 'tan 80° を、45° 以下の角の三角比で表すと？', fig: null,
              options: ['1/tan 10°', 'tan 10°', 'sin 10°', '1/sin 10°'], correct: 0, exp: 'tan(90° − θ) = ' + mathHTML('1/tan θ') + '。tan 80° = tan(90° − 10°) = ' + mathHTML('1/tan 10°'),
              why: ['', 'tan 10° は小さい値、tan 80° は大きい値。tan(90° − θ) = 1/tan θ だよ。', 'tan は sin にはかわらないよ。tan(90° − θ) = 1/tan θ。', 'tan(90° − θ) = 1/tan θ。sin ではなく tan の逆数だよ。'] },
            { q: 'sin A = ' + mathHTML('3/5') + '（A は鋭角）のとき、cos A の値は？（直角三角形をかいて考えよう）', fig: { sides3: [4, 3, 5] },
              options: ['4/5', '3/4', '5/4', '2/5'], correct: 0, exp: '斜辺 5、対辺 3 の直角三角形をかくと、隣辺は ' + mathHTML('√16') + ' = 4（5² − 3² = 16）。cos A = ' + mathHTML('4/5'),
              why: ['', '3/4 は tan A（対辺/隣辺）だよ。', '5/4 は 1 より大きい。cos A は 1 より小さいよ。', '1 − 3/5 = 2/5 としていないかな？ 辺の長さは三平方の定理で求めよう。'] },
            { q: '木から 100 m はなれた地点で木のてっぺんを見上げた角が 20° だった。木の高さはおよそ何 m？（目の高さは考えない）<br>sin 20° = 0.3420、cos 20° = 0.9397、tan 20° = 0.3640', fig: { deg: 20, sides: { VR: '100 m', RT: '?' } },
              options: ['36.4 m', '34.2 m', '94.0 m', '274.7 m'], correct: 0, exp: mathHTML('高さ/100') + ' = tan 20° なので、高さ = 100 × 0.3640 = 36.4（m）',
              why: ['', '100 × sin 20°。sin は 高さ/斜辺。100 m は斜辺ではなく底辺だよ。', '100 × cos 20° を計算しているよ。高さ/底辺 は tan だよ。', '100 ÷ tan 20° を計算しているよ。高さ = 100 × tan 20°。'] }
        ];
        function level4Question(d) {
            let fig = '';
            if (d.fig && d.fig.deg) {
                const t = d.fig.deg * Math.PI / 180;
                fig = triSVG({ p: Math.cos(t), q: Math.sin(t), names: { V: 'A', R: 'C', T: 'B' }, sides: d.fig.sides, mark: 'V', markText: d.fig.deg + '°', w: 280, h: 200 });
            } else if (d.fig && d.fig.sides3) {
                const [p, q, c] = d.fig.sides3;
                fig = triSVG({ p, q, names: { V: 'A', R: 'C', T: 'B' }, sides: { RT: q, VT: c, VR: '?' }, mark: 'V', w: 260, h: 200 });
            }
            return { question: d.q, figure: fig, options: d.options.map(mathHTML), correct: d.correct, hint: '', exp: d.exp, why: d.why };
        }

        function buildLevel(level) {
            if (level === 1) return L1.map(level1Question);
            if (level === 2) return L2.map(level2Question);
            if (level === 3) return shuffleArray(L3).map(level3Question);
            return L4.map(level4Question);
        }
        const HINT4 = [
            'BC は ∠A の対辺、AB は斜辺。sin 30° = BC/AB だよ。', 'AC は ∠A の隣辺、AB は斜辺。cos 30° = AC/AB だよ。',
            '45° の直角三角形は、辺の比が 1 : 1 : √2。', 'BC は ∠A の対辺、AC は隣辺。tan 60° = BC/AC だよ。',
            'cos(90° − θ) = sin θ を使おう。', 'sin(90° − θ) = cos θ を使おう。', 'tan(90° − θ) = 1/tan θ を使おう。',
            'sin A = 対辺/斜辺 = 3/5 なので、斜辺 5・対辺 3 の直角三角形をかこう。のこりの辺は三平方の定理で。', '高さ/（はなれた距離）は、20° の何の値かな？'
        ];

        // ---------- 画面の流れ ----------
        function selectLevel(level) { goLevel(level); }
        function goLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i === level - 1));
            document.querySelectorAll('.quiz-container').forEach(c => c.classList.remove('active'));
            document.getElementById('level' + level).classList.add('active');
            restartLevel(level);
        }
        function restartLevel(level) {
            currentQuestion = 0;
            score = 0;
            levelQuestions[level] = buildLevel(level);
            document.getElementById('results' + level).style.display = 'none';
            document.querySelector('#level' + level + ' .question-card').style.display = 'block';
            loadQuestion(level);
        }
        function loadQuestion(level) {
            const questions = levelQuestions[level];
            const question = questions[currentQuestion];
            document.getElementById('progress' + level).style.width = (currentQuestion / questions.length * 100) + '%';
            document.getElementById('questionNum' + level).innerHTML = '<span class="question-badge">問' + (currentQuestion + 1) + '</span><span>' + (currentQuestion + 1) + ' / ' + questions.length + '</span>';
            document.getElementById('questionText' + level).innerHTML = question.question;
            document.getElementById('triangleContainer' + level).innerHTML = question.figure || '';
            const box = document.getElementById('options' + level);
            box.innerHTML = '';
            box.classList.toggle('fig-options', level === 1);
            order = question.options.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            missedThis = false;
            isAnswered = false;
            order.forEach((orig, index) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'option';
                b.innerHTML = question.options[orig];
                b.onclick = () => selectOption(level, index);
                box.appendChild(b);
            });
            const hint = question.hint || (level === 4 ? HINT4[currentQuestion] : '');
            document.getElementById('hintText' + level).innerHTML = hint;
            document.getElementById('nextBtn' + level).style.display = 'none';
            document.getElementById('retryBtn' + level).style.display = 'none';
            document.getElementById('feedback' + level).style.display = 'none';
            document.getElementById('hint' + level).style.display = 'none';
        }
        function selectOption(level, index) {
            if (isAnswered) return;
            const question = levelQuestions[level][currentQuestion];
            const buttons = document.querySelectorAll('#options' + level + ' .option');
            const fb = document.getElementById('feedback' + level);
            const orig = order[index];
            if (orig === question.correct) {
                isAnswered = true;
                buttons[index].classList.add('correct');
                if (!missedThis) score++;
                fb.className = 'feedback correct';
                fb.innerHTML = '正解です！<div class="why"><span class="explanation-title">解説</span>' + question.exp + '</div>';
                document.getElementById('nextBtn' + level).style.display = 'inline-block';
            } else {
                missedThis = true;
                buttons[index].classList.add('incorrect');
                buttons[index].disabled = true;
                fb.className = 'feedback incorrect';
                fb.innerHTML = 'ちがいます。のこりの選択肢からえらび直そう！<div class="why"><span class="explanation-title">解説</span>' + question.why[orig] + '</div>';
            }
            fb.style.display = 'block';
            fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        function retryQuestion(level) { }   // 使わなくなった（まちがえたあとも、そのままえらび直せる）
        function nextQuestion(level) {
            currentQuestion++;
            if (currentQuestion < levelQuestions[level].length) {
                loadQuestion(level);
                document.getElementById('level' + level).scrollIntoView({ block: 'start' });
            } else showResults(level);
        }
        function showHint(level) {
            const h = document.getElementById('hint' + level);
            h.style.display = h.style.display === 'none' ? 'block' : 'none';
        }
        function showResults(level) {
            const n = levelQuestions[level].length;
            document.querySelector('#level' + level + ' .question-card').style.display = 'none';
            document.getElementById('results' + level).style.display = 'block';
            document.getElementById('score' + level).textContent = '一発正解 ' + score + '/' + n + '問 (' + Math.round(score / n * 100) + '%)';
        }

        // 【ブラッシュアップ】式の表記を教科書にそろえる：文字（x・a・A・θ など）は斜体、数字・記号・sin／cos／tan は立体、書体は数式用。
        //   画面の文字（textContent）は変えずに、英数字のまとまりを <span class="m"> で包み、文字だけを <i> にする（日本語はふつうの書体のまま）。
        //   画面が書きかわるたびに、指定した場所の式を整え直す
        const MATH_RUN = /[A-Za-z0-9θ()=+\-−·×÷\/.,<>≦≧≠°√²³ ]*[A-Za-z0-9θ][A-Za-z0-9θ()=+\-−·×÷\/.,<>≦≧≠°√²³ ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .no-math, svg, canvas, script, style, textarea, input')) continue;
                if (/[A-Za-z0-9θ]/.test(n.nodeValue)) nodes.push(n);
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    if (!text) return run;
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    const span = document.createElement('span');
                    span.className = 'm';
                    const parts = text.split(/(sin|cos|tan|[A-Za-zθ])/);
                    parts.forEach((part, k) => {
                        if (!part) return;
                        const upright = k % 2 === 0 || /^(sin|cos|tan)$/.test(part) ||
                            (part === 'm' && /\d\s*$/.test(parts[k - 1] || '') && !/^[A-Za-z]/.test(parts[k + 1] || ''));   // 36.4 m の単位
                        if (upright) span.appendChild(document.createTextNode(part));
                        else { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                    });
                    frag.appendChild(span);
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function () {
            restartLevel(1);
            watchMath(['.question-text', '.options', '.feedback', '.hint-container']);
        });

    </script>
</body>
</html>
