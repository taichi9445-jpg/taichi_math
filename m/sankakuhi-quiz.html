    <script>
        // 【ブラッシュアップ】問題データと、図・判定の部分を作り直した本体。元の「4 レベル・ヒント・選択式」の流れはそのまま。
        //   ・図：直角三角形を辺の比・角度どおりにかく（元はどの問題も同じ形で、「底辺 3・高さ 4」なのに底辺のほうが長かった）。
        //         直角の印・角の印をつけ、文字は回転させずに三角形の外側におく（はみ出し・線との重なりをなくした）
        //   ・レベル1：選択肢は「正しい図」「辺の長さが入れかわった図」「ちがう角が左下の図」など、図形として意味のある 4 つに
        //   ・レベル2：90° − θ の問題（sin C = cos A）を追加。ヒントでは答えの数を出さない
        //   ・レベル3：有名角の辺の比（2026-10-27 追加）。前半は正しい図をえらぶ、後半はカードを辺にドラッグして入れる
        //   ・レベル4：有名角の値（元の名前は「応用問題」だった）。出す順をまぜる
        //   ・レベル5：元は「レベル3のシャッフル」だった。辺の長さを求める・90° − θ・三角比の表などの応用問題に
        //   ・正解したら理由を一言、まちがえたら「えらんだものが何なのか」を一言。まちがえた選択肢は押せなくなり、そのままえらび直せる
        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let isAnswered = false;
        let missedThis = false;   // この問題でまちがえたか（一発正解だけを点にする）
        let order = [0, 1, 2, 3];
        let levelQuestions = {};

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ---------- 数式の表示（分数は縦、√ は上に線） ----------
        // 根号と上線は一筆の SVG パス。本文と図で同じ座標・描画を使う。
        function radicalSVG(digits, o = {}) {
            const size = o.size || 20, scale = size / 20, width = 16 + String(digits).length * 15;
            const dimensions = o.diagram
                ? 'x="' + o.x + '" y="' + o.y + '" width="' + width * scale + '" height="' + 30 * scale + '"'
                : 'width="' + width / 20 + 'em" height="1.5em"';

                hint: fn + ' ' + ang + ' = ' + mathHTML(NAME[fn][0] + '/' + NAME[fn][1]) + '。角' + ang + 'から見て、向かい合う辺が「対辺」、角' + ang + 'ととなり合う斜辺でない辺が「隣辺」だよ。どの辺がどれかな？' +
                    '<br>' + triSVG({ p: a, q: b, names: { V: 'A', R: 'B', T: 'C' }, sides: ang === 'A' ? { VR: '隣辺', RT: '対辺', VT: '斜辺' } : { VR: '対辺', RT: '隣辺', VT: '斜辺' }, red: ang, mark: ang === 'A' ? 'V' : 'T', w: 240, h: 190 }) +
                    // 角 C のときは、向きを変えて角 C を左下にした図もそえる（C が左下・直角 B が右下・A が上）
                    (ang === 'C' ? '<br>向きを変えて、角Cを左下、直角を右下にすると、こうなるよ。<br>' +
                        triSVG({ p: b, q: a, names: { V: 'C', R: 'B', T: 'A' }, sides: { VR: '隣辺', RT: '対辺', VT: '斜辺' }, mark: 'V', w: 240, h: 190 }) : ''),
                exp: fn + ' ' + ang + ' = ' + NAME[fn][0] + '/' + NAME[fn][1] + ' = ' + pick[0][0] + '/' + pick[1][0] + ' = ' + mathHTML(pick[0][1] + '/' + pick[1][1]) +
                    (ans !== pick[0][1] + '/' + pick[1][1] ? ' = ' + mathHTML(ans) + '（約分）' : '') +
                    (ang === 'C' ? '<br>C = 90° − A なので、' + fn + ' C = ' + { sin: 'cos', cos: 'sin', tan: '1/tan' }[fn] + ' A になっているね。' : ''),

        }

        // ---------- レベル3：有名角の辺の比 ----------
        // 前半は「辺の比が正しい図はどれ？」（4つの図は同じ形・同じ角で、書いてある長さだけがちがう）、
        // 後半はカードを辺の □ にドラッグして入れる。d.at：角の印をつける頂点（'V' は直角のとなりの下の角、'T' は上の角）、d.tf：回転・反転
        const RATIO = { 30: ['1', '√3', '2'], 45: ['1', '1', '√2'], 60: ['√3', '1', '2'] };   // 印の角から見た [対辺, 隣辺, 斜辺]
        function ratioSides(at, [opp, adj, hyp]) { return at === 'V' ? { VR: adj, RT: opp, VT: hyp } : { VR: opp, RT: adj, VT: hyp }; }
        function ratioTri(d, sides, compact) {
            const a = (d.at === 'V' ? d.deg : 90 - d.deg) * Math.PI / 180;   // 頂点 V の角
            return triSVG({ p: Math.cos(a), q: Math.sin(a), ...d.tf, names: { V: '', R: '', T: '' }, sides, mark: d.at, markText: d.deg + '°', ...(compact ? { fs: 1.3, crop: true } : {}) });
        }
        const RW = {
            swap30: '30° と 60° の比が入れかわっているよ。いちばん短い辺（1）は、30° の角と向かい合う辺だよ。',
            swap60: '30° と 60° の比が入れかわっているよ。60° の角と向かい合う辺は √3、いちばん短い辺（1）は 60° のとなりの辺だよ。',
            hyp: '斜辺（直角と向かい合う辺）がいちばん長い辺だよ。<span class="nobr">1 : √3 : 2</span> の 2 が斜辺。',
            hyp45: '斜辺（直角と向かい合う辺）がいちばん長い辺だよ。<span class="nobr">1 : 1 : √2</span> の √2 が斜辺。',
            is45: '<span class="nobr">1 : 1 : √2</span> は、45° の直角三角形（直角二等辺三角形）の辺の比だよ。',
            two: '斜辺は 2 ではなく √2 だよ。45° の直角三角形の辺の比は <span class="nobr">1 : 1 : √2</span>。',
            is3060: '<span class="nobr">1 : √3 : 2</span> は、30°・60° の直角三角形の辺の比だよ。',
            iso: '45° の直角三角形は直角二等辺三角形。直角をはさむ2辺は同じ長さになるよ。',
            legs45: '直角をはさむ2辺はどちらも 1、斜辺が √2 だよ。',
            use2: '2 は斜辺（いちばん長い辺）の長さ。直角をはさむ2辺は 1 と √3 だよ。',
            diff: '30°・60° の直角三角形は、3つの辺の長さがすべてちがうよ。辺の比は <span class="nobr">1 : √3 : 2</span>。',
            no2: '√2 は、45° の直角三角形で使う値だよ。30°・60° の直角三角形の辺の比は <span class="nobr">1 : √3 : 2</span>。',
            no3: '45° の直角三角形では、√3 や 2 は使わないよ。辺の比は <span class="nobr">1 : 1 : √2</span>。'
        };
        const RATIO_WRONG = {   // まちがいの図：[対辺, 隣辺, 斜辺] と、そのわけ
            30: [[['√3', '1', '2'], 'swap30'], [['1', '2', '√3'], 'hyp'], [['1', '1', '√2'], 'is45']],
            60: [[['1', '√3', '2'], 'swap60'], [['2', '1', '√3'], 'hyp'], [['1', '1', '√2'], 'is45']],
            45: [[['1', '1', '2'], 'two'], [['1', '√3', '2'], 'is3060'], [['1', '√2', '√3'], 'iso']]
        };
        const HINT_3060 = '30°・60°・90° の直角三角形の辺の比は <span class="nobr">1 : √3 : 2</span>。<br>いちばん短い 1 は、30° の角と向かい合う辺。<br>いちばん長い 2 は、斜辺（直角と向かい合う辺）。';
        const RATIO_HINT = { 30: HINT_3060, 60: HINT_3060, 45: '45°・45°・90° の直角三角形（直角二等辺三角形）の辺の比は <span class="nobr">1 : 1 : √2</span>。<br>いちばん長い √2 は、斜辺（直角と向かい合う辺）。' };
        const RATIO_EXP = {
            30: '30° の角と向かい合う辺が、いちばん短い 1。<br>斜辺は 1 の2倍の 2。<br>のこりの辺が √3。<br>辺の比は <span class="nobr">1 : √3 : 2</span>。',
            60: '60° の角と向かい合う辺が √3。<br>斜辺が 2。<br>60° のとなりの辺が、いちばん短い 1。<br>辺の比は <span class="nobr">1 : √3 : 2</span>。',
            45: '直角をはさむ2辺が、どちらも 1。<br>斜辺が √2。<br>辺の比は <span class="nobr">1 : 1 : √2</span>。'
        };
        const L3A = [{ deg: 30, at: 'V' }, { deg: 60, at: 'V' }, { deg: 45, at: 'V' }, { deg: 30, at: 'T' }, { deg: 60, at: 'T' }, { deg: 30, at: 'V', tf: { fx: true } }];
        const L3B = [{ deg: 30, at: 'V' }, { deg: 45, at: 'V' }, { deg: 60, at: 'V' }, { deg: 60, at: 'T' }, { deg: 30, at: 'V', tf: { fx: true } }, { deg: 30, at: 'T', tf: { fx: true } }];
        const CHIPS = ['1', '√2', '√3', '2'];
        function ratioChoice(d) {
            const opts = [[RATIO[d.deg], '']].concat(RATIO_WRONG[d.deg]);
            return {
                figOpts: true,
                question: '<span class="angle-name">' + d.deg + '°</span> の角をもつ直角三角形です。<br>辺の長さの比が正しい図はどれですか？',
                figure: '',
                options: opts.map(([r]) => ratioTri(d, ratioSides(d.at, r), true)),
                correct: 0,
                hint: RATIO_HINT[d.deg], exp: RATIO_EXP[d.deg],
                why: opts.map(([, k]) => k ? RW[k] : '')

        }
        function ratioDrag(d) {
            return {
                type: 'drag', deg: d.deg, at: d.at,
                question: '<span class="angle-name">' + d.deg + '°</span> の角をもつ直角三角形です。<br>それぞれの辺の □ に、辺の比をあてはめよう。',
                figure: '<div class="drag-fig">' + ratioTri(d, {}) + ['VR', 'RT', 'VT'].map(k => '<button type="button" class="slot" data-side="' + k + '" aria-label="辺の長さを入れる場所"></button>').join('') + '</div>',

        // 入れた長さ g = {VR, RT, VT} のどこがおかしいかを一言で
        function ratioReason(q, g) {
            const r = q.at === 'V' ? { opp: g.RT, adj: g.VR, hyp: g.VT } : { opp: g.VR, adj: g.RT, hyp: g.VT };
            const vals = [r.opp, r.adj, r.hyp];
            if (q.deg === 45) {
                if (vals.some(v => v === '√3' || v === '2')) return RW.no3;
                if (r.hyp !== '√2') return RW.hyp45;
                return r.opp === r.adj ? RW.legs45 : RW.iso;
            }
            if (vals.includes('√2')) return RW.no2;
            if (r.hyp !== '2') return RW.hyp;
            if (r.opp === r.adj) return RW.diff;
            if (r.opp === '2' || r.adj === '2') return RW.use2;
            return q.deg === 30 ? RW.swap30 : RW.swap60;
        }
        function valHTML(v) { return v.includes('√') ? rtHTML(v) : '<span class="m">' + v + '</span>'; }
        // □ の位置：辺のまん中から外向きに、□ が線にかからないだけはなす（図の大きさが変わるたびに置き直す）
        function placeSlots(fig) {
            const svg = fig.querySelector('svg'), poly = svg && svg.querySelector('polygon');
            if (!poly || !fig.offsetWidth) return;
            const pts = poly.getAttribute('points').trim().split(/\s+/).map(p => p.split(',').map(Number));
            const P = { V: pts[0], R: pts[1], T: pts[2] };
            const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect(), fr = fig.getBoundingClientRect(), k = r.width / vb.width;
            const px = ([x, y]) => [r.left - fr.left + (x - vb.x) * k, r.top - fr.top + (y - vb.y) * k];
            fig.querySelectorAll('.slot').forEach(s => {
                const [a, b] = s.dataset.side.split(''), c = 'VRT'.replace(a, '').replace(b, '');
                const A = px(P[a]), B = px(P[b]), C = px(P[c]);
                const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
                let n = [-(B[1] - A[1]) / L, (B[0] - A[0]) / L];
                if ((C[0] - mx) * n[0] + (C[1] - my) * n[1] > 0) n = [-n[0], -n[1]];
                const w = s.offsetWidth, h = s.offsetHeight, dist = Math.abs(n[0]) * w / 2 + Math.abs(n[1]) * h / 2 + 7;
                s.style.left = (mx + n[0] * dist - w / 2) + 'px';
                s.style.top = (my + n[1] * dist - h / 2) + 'px';
            });
        }
        // カードはドラッグでも、「カードを押す → □ を押す」でも入れられる。入っている □ を押すと空にもどる
        let chipPicked = null;
        function setupDrag(level, q) {
            const fig = document.querySelector('#triangleContainer' + level + ' .drag-fig');
            const box = document.getElementById('options' + level);
            const slots = [...fig.querySelectorAll('.slot')], chips = [...box.querySelectorAll('.chip')];
            const check = box.querySelector('.drag-actions .btn');
            chipPicked = null;
            const pick = v => { chipPicked = chipPicked === v ? null : v; chips.forEach(c => c.classList.toggle('selected', c.dataset.v === chipPicked)); };
            const put = (s, v) => {
                if (isAnswered) return;
                s.dataset.v = v || '';
                s.innerHTML = v ? valHTML(v) : '';
                s.classList.toggle('filled', !!v);
                s.classList.remove('ok', 'ng');
                check.disabled = !slots.every(x => x.dataset.v);
            };
            slots.forEach(s => s.onclick = () => {
                if (isAnswered) return;
                if (chipPicked) { put(s, chipPicked); pick(null); } else if (s.dataset.v) put(s, '');
            });
            chips.forEach(c => {
                c.onclick = e => { if (e.detail === 0 && !isAnswered) pick(c.dataset.v); };   // キーボードで押したとき
                c.addEventListener('pointerdown', e => {
                    if (isAnswered || e.button > 0) return;
                    e.preventDefault();
                    const sx = e.clientX, sy = e.clientY;
                    let ghost = null, over = null;
                    const move = ev => {
                        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
                        if (!ghost) { ghost = c.cloneNode(true); ghost.classList.remove('selected'); ghost.classList.add('chip-ghost'); document.body.appendChild(ghost); }
                        ghost.style.left = (ev.clientX - ghost.offsetWidth / 2) + 'px';
                        ghost.style.top = (ev.clientY - ghost.offsetHeight / 2) + 'px';
                        const el = document.elementFromPoint(ev.clientX, ev.clientY), s = el && el.closest('.slot');
                        const next = s && fig.contains(s) ? s : null;
                        if (over && over !== next) over.classList.remove('drop-over');
                        over = next;
                        if (over) over.classList.add('drop-over');
                    };
                    const up = () => {
                        window.removeEventListener('pointermove', move);
                        window.removeEventListener('pointerup', up);
                        window.removeEventListener('pointercancel', up);

                        ghost.remove();
                        if (over) { over.classList.remove('drop-over'); put(over, c.dataset.v); pick(null); }
                    };
                    window.addEventListener('pointermove', move);
                    window.addEventListener('pointerup', up);
                    window.addEventListener('pointercancel', up);
                });

            if (slots.every(s => s.classList.contains('ok'))) {
                isAnswered = true;
                if (!missedThis) score++;
                chips.forEach(c => { c.disabled = true; c.classList.remove('selected'); });

                fb.className = 'feedback correct';
                fb.innerHTML = '正解です！<div class="why"><span class="explanation-title">解説</span>' + displayContent(q.exp, level, true) + '</div>';

            } else {
                missedThis = true;
                fb.className = 'feedback incorrect';
                fb.innerHTML = 'ちがいます。<br>赤い枠の辺を<span class="keep-word">直してみよう！</span><div class="why"><span class="explanation-title">解説</span>' + displayContent(ratioReason(q, g), level, true) + '</div>';

        // ---------- レベル4：有名角の値（データの名前は L3 のまま） ----------
        const VAL = { sin: { 30: '1/2', 45: '1/√2', 60: '√3/2' }, cos: { 30: '√3/2', 45: '1/√2', 60: '1/2' }, tan: { 30: '1/√3', 45: '1', 60: '√3' } };
        const L3 = [
            ['sin', 30, ['1/2', '1/√2', '√3/2', '1']], ['cos', 30, ['1/2', '1/√2', '√3/2', '1']], ['tan', 30, ['1/√3', '1/√2', '√3/2', '√3']],
            ['sin', 45, ['1/2', '1/√2', '√3/2', '1']], ['cos', 45, ['1/2', '1/√2', '√3/2', '1']], ['tan', 45, ['1/√3', '1', '1/√2', '√3']],
            ['sin', 60, ['1/2', '1/√2', '√3/2', '1']], ['cos', 60, ['1/2', '1/√2', '√3/2', '1']], ['tan', 60, ['1/√3', '1/√2', '√3/2', '√3']]

        // 有名角の三角形：左下の角が deg°。[底辺, 高さ, 斜辺]
        const SPECIAL = { 30: [Math.sqrt(3), 1, ['√3', '1', '2']], 45: [1, 1, ['1', '1', '√2']], 60: [1, Math.sqrt(3), ['1', '√3', '2']] };

            const [p, q, t] = SPECIAL[deg];

        }
        function level3Question([fn, deg, opts]) {
            const ans = VAL[fn][deg];
            const whoHas = v => { const r = []; ['sin', 'cos', 'tan'].forEach(g => [30, 45, 60].forEach(x => { if (VAL[g][x] === v) r.push(g + ' ' + x + '°'); })); return r; };
            const [, , t] = SPECIAL[deg];
            const part = { sin: [t[1], t[2], '対辺', '斜辺'], cos: [t[0], t[2], '隣辺', '斜辺'], tan: [t[1], t[0], '対辺', '隣辺'] }[fn];
            return {
                question: '<span class="angle-name">' + fn + ' ' + deg + '°</span> の値はいくつですか？',
                figure: '',
                options: opts.map(mathHTML),
                correct: opts.indexOf(ans),
                hint: fn + ' = ' + mathHTML(NAME[fn][0] + '/' + NAME[fn][1]) + '。' + deg + '° の直角三角形の辺の比を思い出そう。<br>' + specialSVG(deg),
                exp: deg + '° の直角三角形（辺の比 ' + t[0] + ' : ' + t[1] + ' : ' + t[2] + '）で、' + fn + ' ' + deg + '° = ' + part[2] + '/' + part[3] + ' = ' + mathHTML(part[0] + '/' + part[1]) + (part[1] === '1' ? ' = ' + mathHTML(part[0]) : '') + '。',
                why: opts.map(v => v === ans ? '' : (whoHas(v).length ? mathHTML(v) + ' は ' + whoHas(v).join('・') + ' の値だよ。' : mathHTML(v) + ' は 30°・45°・60° のどの三角比の値でもないよ。'))
            };
        }

        // ---------- レベル5：応用問題（データの名前は L4 のまま） ----------
        // fig：三角形 { deg（左下の角）, sides：{VR, RT, VT} } を triSVG でかく。names は A（左下）・C（直角）・B（上）
        const L4 = [
            { q: '∠C = 90°、∠A = 30°、AB = 10 の直角三角形 ABC で、BC の長さは？', fig: { deg: 30, sides: { VT: '10', RT: '?' } },
              options: ['5', '5√3', '10√3', '20'], correct: 0, exp: 'BC は ∠A の対辺。BC = AB sin 30° = 10 × ' + mathHTML('1/2') + ' = 5',

            { q: '∠C = 90°、∠A = 30°、AB = 10 の直角三角形 ABC で、AC の長さは？', fig: { deg: 30, sides: { VT: '10', VR: '?' } },
              options: ['5√3', '5', '10√3', '5√2'], correct: 0, exp: 'AC は ∠A の隣辺。AC = AB cos 30° = 10 × ' + mathHTML('√3/2') + ' = ' + mathHTML('5√3'),

              why: ['', 'cos 20° は sin 70° と等しい値。cos(90° − θ) は sin θ になるよ。', '45° 以下の角で表そう。70° は 90° − 20° だよ。', 'tan(90° − θ) = 1/tan θ。cos は sin にかわるよ。'] },
            { q: 'sin 58° を、45° 以下の角の三角比で表すと？', fig: null,
              options: ['cos 32°', 'sin 32°', 'cos 58°', 'tan 32°'], correct: 0, exp: 'sin(90° − θ) = cos θ。sin 58° = sin(90° − 32°) = cos 32°',
              why: ['', 'sin 32° = cos 58°。sin(90° − θ) は cos θ になるよ。', '45° 以下の角で表そう。58° = 90° − 32° だよ。', 'sin(90° − θ) は cos θ。tan にはならないよ。'] },
            { q: 'tan 80° を、45° 以下の角の三角比で表すと？', fig: null,
              options: ['1/tan 10°', 'tan 10°', 'sin 10°', '1/sin 10°'], correct: 0, exp: 'tan(90° − θ) = ' + mathHTML('1/tan θ') + '。tan 80° = tan(90° − 10°) = ' + mathHTML('1/tan 10°'),
              why: ['', 'tan 10° は小さい値、tan 80° は大きい値。tan(90° − θ) = 1/tan θ だよ。', 'tan は sin にはかわらないよ。tan(90° − θ) = 1/tan θ。', 'tan(90° − θ) = 1/tan θ。sin ではなく tan の逆数だよ。'] },
            { q: 'sin A = ' + mathHTML('3/5') + '（A は鋭角）のとき、cos A の値は？（直角三角形をかいて考えよう）', fig: { sides3: [4, 3, 5] },
              options: ['4/5', '3/4', '5/4', '2/5'], correct: 0, exp: '斜辺 5、対辺 3 の直角三角形をかくと、隣辺は ' + mathHTML('√16') + ' = 4（5² − 3² = 16）。cos A = ' + mathHTML('4/5'),
              why: ['', '3/4 は tan A（対辺/隣辺）だよ。', '5/4 は 1 より大きい。cos A は 1 より小さいよ。', '1 − 3/5 = 2/5 としていないかな？ 辺の長さは三平方の定理で求めよう。'] },
            { q: '木から 100 m はなれた地点で木のてっぺんを見上げた角が 20° だった。木の高さはおよそ何 m？（目の高さは考えない）<br>sin 20° = 0.3420、cos 20° = 0.9397、tan 20° = 0.3640', fig: { deg: 20, sides: { VR: '100 m', RT: '?' } },
              options: ['36.4 m', '34.2 m', '94.0 m', '274.7 m'], correct: 0, exp: mathHTML('高さ/100') + ' = tan 20° なので、高さ = 100 × 0.3640 = 36.4（m）',
              why: ['', '100 × sin 20°。sin は 高さ/斜辺。100 m は斜辺ではなく底辺だよ。', '100 × cos 20° を計算しているよ。高さ/底辺 は tan だよ。', '100 ÷ tan 20° を計算しているよ。高さ = 100 × tan 20°。'] }
        ];
        function level4Question(d) {
            let fig = '';
            if (d.fig && d.fig.deg) {
                const t = d.fig.deg * Math.PI / 180;
                fig = triSVG({ p: Math.cos(t), q: Math.sin(t), names: { V: 'A', R: 'C', T: 'B' }, sides: d.fig.sides, mark: 'V', markText: d.fig.deg + '°', w: 280, h: 200 });
            } else if (d.fig && d.fig.sides3) {
                const [p, q, c] = d.fig.sides3;
                fig = triSVG({ p, q, names: { V: 'A', R: 'C', T: 'B' }, sides: { RT: q, VT: c, VR: '?' }, mark: 'V', w: 260, h: 200 });
            }
            return { question: d.q, figure: fig, options: d.options.map(mathHTML), correct: d.correct, hint: '', exp: d.exp, why: d.why };
        }

        function buildLevel(level) {
            if (level === 1) return L1.map(level1Question);
            if (level === 2) return L2.map(level2Question);
            if (level === 3) return L3A.map(ratioChoice).concat(L3B.map(ratioDrag));
            if (level === 4) return shuffleArray(L3).map(level3Question);
            return L4.map(level4Question);
        }
        const HINT4 = [
            'BC は ∠A の対辺、AB は斜辺。sin 30° = BC/AB だよ。', 'AC は ∠A の隣辺、AB は斜辺。cos 30° = AC/AB だよ。',
            '45° の直角三角形は、辺の比が 1 : 1 : √2。', 'BC は ∠A の対辺、AC は隣辺。tan 60° = BC/AC だよ。',
            'cos(90° − θ) = sin θ を使おう。', 'sin(90° − θ) = cos θ を使おう。', 'tan(90° − θ) = 1/tan θ を使おう。',
            'sin A = 対辺/斜辺 = 3/5 なので、斜辺 5・対辺 3 の直角三角形をかこう。のこりの辺は三平方の定理で。', '高さ/（はなれた距離）は、20° の何の値かな？'
        ];

        // ---------- 画面の流れ ----------
        function selectLevel(level) { goLevel(level); }
        function goLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i === level - 1));
            document.querySelectorAll('.quiz-container').forEach(c => c.classList.remove('active'));
            document.getElementById('level' + level).classList.add('active');
            restartLevel(level);
        }
        function restartLevel(level) {
            currentQuestion = 0;
            score = 0;
            levelQuestions[level] = buildLevel(level);
            document.getElementById('results' + level).style.display = 'none';
            document.querySelector('#level' + level + ' .question-card').style.display = 'block';
            loadQuestion(level);
        }
        function loadQuestion(level) {
            const questions = levelQuestions[level];
            const question = questions[currentQuestion];
            document.getElementById('progress' + level).style.width = (currentQuestion / questions.length * 100) + '%';
            document.getElementById('questionNum' + level).innerHTML = '<span class="question-badge">問' + (currentQuestion + 1) + '</span><span>' + (currentQuestion + 1) + ' / ' + questions.length + '</span>';
            document.getElementById('questionText' + level).innerHTML = displayContent(question.question, level);
            document.getElementById('triangleContainer' + level).innerHTML = question.figure || '';
            const box = document.getElementById('options' + level);
            box.innerHTML = '';
            box.classList.toggle('fig-options', level === 1 || !!question.figOpts);
            box.classList.toggle('drag-mode', question.type === 'drag');
            missedThis = false;
            isAnswered = false;
            if (question.type === 'drag') {
                box.innerHTML = '<p class="drag-note">下のカードを、図の □ までドラッグしよう。<br>（カードを押してから □ を押しても入るよ）</p>' +
                    '<div class="chip-tray">' + CHIPS.map(v => '<button type="button" class="chip" data-v="' + v + '">' + valHTML(v) + '</button>').join('') + '</div>' +
                    '<div class="drag-actions"><button type="button" class="btn btn-primary" disabled>答え合わせ</button></div>';
                setupDrag(level, question);
            }
            order = question.options.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            missedThis = false;
            isAnswered = false;
            order.forEach((orig, index) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'option';
                b.innerHTML = question.options[orig];
                b.onclick = () => selectOption(level, index);
                box.appendChild(b);
            });
            const hint = question.hint || (level === 5 ? HINT4[currentQuestion] : '');
            document.getElementById('hintText' + level).innerHTML = displayContent(hint, level, true);
            document.getElementById('nextBtn' + level).style.display = 'none';
            document.getElementById('retryBtn' + level).style.display = 'none';
            document.getElementById('feedback' + level).style.display = 'none';
            document.getElementById('hint' + level).style.display = 'none';
        }
        function selectOption(level, index) {
            if (isAnswered) return;
            const question = levelQuestions[level][currentQuestion];
            const buttons = document.querySelectorAll('#options' + level + ' .option');
            const fb = document.getElementById('feedback' + level);
            const orig = order[index];
            if (orig === question.correct) {
                isAnswered = true;
                buttons[index].classList.add('correct');
                if (!missedThis) score++;
                fb.className = 'feedback correct';
                fb.innerHTML = '正解です！<div class="why"><span class="explanation-title">解説</span>' + displayContent(question.exp, level, true) + '</div>';
                document.getElementById('nextBtn' + level).style.display = 'inline-block';
            } else {
                missedThis = true;
                buttons[index].classList.add('incorrect');
                buttons[index].disabled = true;
                fb.className = 'feedback incorrect';
                fb.innerHTML = 'ちがいます。<br>のこりの選択肢から<span class="keep-word">えらび直そう！</span><div class="why"><span class="explanation-title">解説</span>' + displayContent(question.why[orig], level, true) + '</div>';
            }
            fb.style.display = 'block';
            fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        function retryQuestion(level) { }   // 使わなくなった（まちがえたあとも、そのままえらび直せる）
        function nextQuestion(level) {
            currentQuestion++;
            if (currentQuestion < levelQuestions[level].length) {
                loadQuestion(level);
                document.getElementById('level' + level).scrollIntoView({ block: 'start' });
            } else showResults(level);
        }
        function showHint(level) {
            const h = document.getElementById('hint' + level);
            h.style.display = h.style.display === 'none' ? 'block' : 'none';
        }
        function showResults(level) {
            const n = levelQuestions[level].length;
            document.querySelector('#level' + level + ' .question-card').style.display = 'none';
            document.getElementById('results' + level).style.display = 'block';
            document.getElementById('score' + level).textContent = '一発正解 ' + score + '/' + n + '問 (' + Math.round(score / n * 100) + '%)';
        }

        // 【ブラッシュアップ】式の表記を教科書にそろえる：文字（x・a・A・θ など）は斜体、数字・記号・sin／cos／tan は立体、書体は数式用。
        //   画面の文字（textContent）は変えずに、英数字のまとまりを <span class="m"> で包み、文字だけを <i> にする（日本語はふつうの書体のまま）。
        //   画面が書きかわるたびに、指定した場所の式を整え直す
        const MATH_RUN = /[A-Za-z0-9θ()=+\-−·×÷\/.,<>≦≧≠°√²³ ]*[A-Za-z0-9θ][A-Za-z0-9θ()=+\-−·×÷\/.,<>≦≧≠°√²³ ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .no-math, .root-term, svg, canvas, script, style, textarea, input')) continue;
                if (/[A-Za-z0-9θ]/.test(n.nodeValue)) nodes.push(n);
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    if (!text) return run;
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    const span = document.createElement('span');
                    span.className = 'm';
                    const parts = text.split(/(sin|cos|tan|[A-Za-zθ])/);
                    parts.forEach((part, k) => {
                        if (!part) return;
                        const upright = k % 2 === 0 || /^(sin|cos|tan)$/.test(part) ||
                            (part === 'm' && /\d\s*$/.test(parts[k - 1] || '') && !/^[A-Za-z]/.test(parts[k + 1] || ''));   // 36.4 m の単位
                        if (upright) span.appendChild(document.createTextNode(part));
                        else { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                    });
                    frag.appendChild(span);
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function () {
            restartLevel(1);
            watchMath(['.question-text', '.options', '.feedback', '.hint-container']);
        });

    </script>
</body>
</html>
