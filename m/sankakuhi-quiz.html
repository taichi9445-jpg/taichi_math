        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5em;
            color: #4a5568;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .level-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #e2e8f0;
            color: #4a5568;
        }

        .level-btn.active {
            background: #4299e1;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.4);
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .progress {
            background: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #4299e1, #667eea);
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .question-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #4299e1;
        }

        .question-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #4299e1;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3em;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .triangle-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            text-align: center;
            font-size: 1.1em;
        }

        .option:hover {
            border-color: #4299e1;
            background: #ebf8ff;
        }

        .option.selected {
            border-color: #4299e1;
            background: #4299e1;
            color: white;
        }

        .option.correct {
            border-color: #48bb78;
            background: #48bb78;
            color: white;
        }

        .option.incorrect {
            border-color: #f56565;
            background: #f56565;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4299e1;
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #48bb78;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #f56565;
        }

        .hint-container {
            background: #fff5cd;
            border: 2px solid #f6e05e;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            display: none;
        }

        .hint-title {
            font-weight: bold;
            color: #744210;
            margin-bottom: 10px;
        }

        .results {
            text-align: center;
            padding: 30px;
            background: #f0fff4;
            border-radius: 15px;
            border: 2px solid #48bb78;
            display: none;
        }

        .score {
            font-size: 2em;
            font-weight: bold;
            color: #22543d;
            margin-bottom: 15px;
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.1em;
            line-height: 1;
        }

        .numerator {
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        .denominator {
            padding-top: 2px;
        }

        .level3-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.1em;
            line-height: 1;
        }

        .level3-numerator {
            border-bottom: 2px solid #333;
            padding-bottom: 3px;
            margin-bottom: 3px;
            min-width: 40px;
            text-align: center;
        }

        .level3-denominator {
            padding-top: 3px;
            min-width: 40px;
            text-align: center;
        }

    <script>
        let currentLevel = 1;
        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let isAnswered = false;
        let shuffledLevel4Questions = [];
        let order = [0, 1, 2, 3];   // 【ブラッシュアップ】選択肢の並び（問題ごとにまぜる）
        let missedThis = false;     // 【ブラッシュアップ】この問題でまちがえたか

        // レベル1の問題データ（三角形の回転と反転）
        const level1Questions = [
            {
                question: "下の直角三角形を、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角A</span>が左下になるように回転させた図はどれですか？",
                originalTriangle: createRotatedTriangle(45, 'A', 3, 4, 5),
                options: [
                    createStandardTriangle('A', 3, 4, 5),
                    createStandardTriangle('B', 3, 4, 5),
                    createStandardTriangle('C', 3, 4, 5),
                    createStandardTriangle('A', 4, 3, 5)
                ],
                correct: 0,
                hint: "直角三角形の直角（90度の角）を右下に、角Aを左下に配置するように回転させてみましょう。"
            },
            {
                question: "下の直角三角形を、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角B</span>が左下になるように回転させた図はどれですか？",
                originalTriangle: createRotatedTriangle(120, 'B', 5, 12, 13),
                options: [
                    createStandardTriangle('A', 5, 12, 13),
                    createStandardTriangle('B', 5, 12, 13),
                    createStandardTriangle('C', 5, 12, 13),
                    createStandardTriangle('B', 12, 5, 13)
                ],
                correct: 1,
                hint: "角Bが左下に来るように、三角形全体を回転させる必要があります。"
            },
            {
                question: "下の直角三角形を左右反転させて、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角C</span>が左下になるように配置した図はどれですか？",
                originalTriangle: createFlippedTriangle('C', 8, 15, 17),
                options: [
                    createStandardTriangle('A', 8, 15, 17),
                    createStandardTriangle('B', 8, 15, 17),
                    createStandardTriangle('C', 8, 15, 17),
                    createStandardTriangle('C', 15, 8, 17)
                ],
                correct: 2,
                hint: "三角形を左右に反転させてから、角Cが左下に来るように配置してみましょう。"
            },
            {
                question: "下の直角三角形を上下反転させて、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角A</span>が左下になるように配置した図はどれですか？",
                originalTriangle: createVerticalFlippedTriangle('A', 7, 24, 25),
                options: [
                    createStandardTriangle('A', 7, 24, 25),
                    createStandardTriangle('A', 24, 7, 25),
                    createStandardTriangle('A', 7, 25, 24),
                    createStandardTriangle('B', 7, 24, 25)   // 【ブラッシュアップ】元は 1 番目と同じ図だった
                ],
                correct: 0,
                hint: "三角形を上下に反転させてから、角Aが左下の位置に来るように配置しましょう。"
            },
            {
                question: "下の直角三角形を左右反転と上下反転の両方を行って、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角B</span>が左下になるように配置した図はどれですか？",
                originalTriangle: createDoubleFlippedTriangle('B', 9, 12, 15),
                options: [
                    createStandardTriangle('B', 9, 12, 15),
                    createStandardTriangle('B', 12, 9, 15),
                    createStandardTriangle('B', 15, 9, 12),
                    createStandardTriangle('B', 9, 15, 12)
                ],
                correct: 0,
                hint: "三角形を左右と上下の両方に反転させると、元の向きから180度回転したような状態になります。"
            },
            {
                question: "下の斜めに配置された直角三角形を、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角C</span>が左下になるように配置した図はどれですか？",
                originalTriangle: createDiagonalTriangle('C', 20, 21, 29),
                options: [
                    createStandardTriangle('C', 20, 21, 29),
                    createStandardTriangle('C', 21, 20, 29),
                    createStandardTriangle('C', 29, 20, 21),
                    createStandardTriangle('C', 20, 29, 21)
                ],
                correct: 0,
                hint: "斜めに配置された三角形を、標準的な位置（直角が右下、角Cが左下）に変形させましょう。"
            },
            {
                question: "下の斜めに反転された直角三角形を、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角A</span>が左下になるように配置した図はどれですか？",
                originalTriangle: createDiagonalFlippedTriangle('A', 12, 16, 20),
                options: [
                    createStandardTriangle('A', 12, 16, 20),

                question: "下の複雑に変形された直角三角形を、直角が右下、<span style='color: red; font-size: 24px; font-weight: bold;'>角B</span>が左下になるように配置した図はどれですか？",

                    createStandardTriangle('B', 20, 15, 25),
                    createStandardTriangle('B', 25, 15, 20),
                    createStandardTriangle('B', 15, 25, 20)

                correct: 0,
                hint: "複雑に変形された三角形でも、辺の長さの比は変わりません。角Bの位置を確認しましょう。"
            }
        ];

        // レベル2の問題データ（sin A、cos A、tan Aの計算）
        const level2Questions = [
            {
                question: "右の直角三角形で、sin A の値はいくつですか？",

        // レベル選択
        function selectLevel(level) {
            currentLevel = level;

            // レベルボタンの状態更新
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // クイズコンテナの表示切り替え
            document.querySelectorAll('.quiz-container').forEach(container => container.classList.remove('active'));
            document.getElementById(`level${level}`).classList.add('active');

            // レベルをリスタート
            restartLevel(level);
        }

        // レベルをリスタート
        function restartLevel(level) {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            isAnswered = false;

            // レベル4の場合は問題をシャッフル
            if (level === 4) {
                shuffledLevel4Questions = shuffleArray(level3Questions);
            }

            document.getElementById(`results${level}`).style.display = 'none';
            document.querySelector(`#level${level} .question-card`).style.display = 'block';

            loadQuestion(level);
        }

        // 問題を読み込み
        function loadQuestion(level) {
            const questions = level === 1 ? level1Questions :
                            level === 2 ? level2Questions :
                            level === 3 ? level3Questions :
                            shuffledLevel4Questions;
            const question = questions[currentQuestion];

            // プログレスバー更新
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById(`progress${level}`).style.width = `${progress}%`;

            // 問題番号と問題文
            document.getElementById(`questionNum${level}`).textContent = `問題 ${currentQuestion + 1}/${questions.length}`;
            document.getElementById(`questionText${level}`).innerHTML = question.question;

            // 三角形表示
            const triangleContainer = document.getElementById(`triangleContainer${level}`);
            if (level === 1) {
                triangleContainer.innerHTML = `
                    <div>
                        <h4>元の三角形：</h4>
                        ${question.originalTriangle}
                    </div>
                `;
            } else if (level === 2) {
                triangleContainer.innerHTML = question.triangle;
            } else if (level === 3 || level === 4) {
                triangleContainer.innerHTML = '';
            }

            // 選択肢表示
            const optionsContainer = document.getElementById(`options${level}`);
            optionsContainer.innerHTML = '';

            order = question.options.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            missedThis = false;
            order.forEach((orig, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.onclick = () => selectOption(level, index);
                optionDiv.innerHTML = question.options[orig];
                optionsContainer.appendChild(optionDiv);
            });

            // ヒント設定
            document.getElementById(`hintText${level}`).innerHTML = question.hint +
                (question.hintTriangle ? `<br><br>${question.hintTriangle}` : '');

            // ボタンとフィードバックをリセット
            document.getElementById(`retryBtn${level}`).style.display = 'none';
            document.getElementById(`nextBtn${level}`).style.display = 'none';
            document.getElementById(`feedback${level}`).style.display = 'none';
            document.getElementById(`hint${level}`).style.display = 'none';

            selectedAnswer = null;
            isAnswered = false;
        }

        // 選択肢を選択
        function selectOption(level, index) {
            if (isAnswered) return;

            selectedAnswer = index;

            // 選択状態をリセット
            document.querySelectorAll(`#options${level} .option`).forEach(opt => {
                opt.classList.remove('selected');
            });

            // 選択した選択肢をハイライト
            document.querySelectorAll(`#options${level} .option`)[index].classList.add('selected');

            // 自動で正誤判定
            setTimeout(() => {
                submitAnswer(level);
            }, 500);
        }

        // 回答を提出
        function submitAnswer(level) {
            if (selectedAnswer === null || isAnswered) return;

            const questions = level === 1 ? level1Questions :
                            level === 2 ? level2Questions :
                            level === 3 ? level3Questions :
                            shuffledLevel4Questions;
            const question = questions[currentQuestion];
            const isCorrect = order[selectedAnswer] === question.correct;

            isAnswered = true;

            // 選択肢の色を更新
            const options = document.querySelectorAll(`#options${level} .option`);

            if (isCorrect) {
                options[selectedAnswer].classList.remove('selected');
                options[selectedAnswer].classList.add('correct');
                if (!missedThis) score++;   // 【ブラッシュアップ】元はやり直して正解しても点に入り、いつも満点になった

                // 正解フィードバック
                const feedback = document.getElementById(`feedback${level}`);
                feedback.className = 'feedback correct';
                feedback.textContent = '正解です！🎉';
                feedback.style.display = 'block';

                // 次の問題ボタンを表示
                const nextBtn = document.getElementById(`nextBtn${level}`);
                nextBtn.style.display = 'inline-block';

            } else {
                options[selectedAnswer].classList.remove('selected');
                options[selectedAnswer].classList.add('incorrect');
                missedThis = true;

                // 不正解フィードバック
                const feedback = document.getElementById(`feedback${level}`);
                feedback.className = 'feedback incorrect';
                feedback.textContent = '不正解です。もう一度考えてみましょう！';
                feedback.style.display = 'block';

                // もう一度挑戦ボタンを表示
                document.getElementById(`retryBtn${level}`).style.display = 'inline-block';
            }

            // 【ブラッシュアップ】元はここで存在しない「回答ボタン」を操作してエラーになっていた（削除）
        }

        // 問題をやり直し
        function retryQuestion(level) {
            // 選択肢の色をリセット
            document.querySelectorAll(`#options${level} .option`).forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });

            // 状態をリセット
            selectedAnswer = null;
            isAnswered = false;

            // ボタンとフィードバックをリセット
            document.getElementById(`retryBtn${level}`).style.display = 'none';
            document.getElementById(`feedback${level}`).style.display = 'none';
        }

        // 次の問題へ進む
        function nextQuestion(level) {
            currentQuestion++;
            const questions = level === 1 ? level1Questions :
                            level === 2 ? level2Questions :
                            level === 3 ? level3Questions :
                            shuffledLevel4Questions;

            if (currentQuestion < questions.length) {
                loadQuestion(level);
            } else {
                showResults(level);
            }
        }

        // ヒントを表示
        function showHint(level) {
            const hintContainer = document.getElementById(`hint${level}`);
            hintContainer.style.display = hintContainer.style.display === 'none' ? 'block' : 'none';
        }

        // 結果を表示
        function showResults(level) {
            const questions = level === 1 ? level1Questions :
                            level === 2 ? level2Questions :
                            level === 3 ? level3Questions :
                            shuffledLevel4Questions;
            const percentage = Math.round((score / questions.length) * 100);

            document.querySelector(`#level${level} .question-card`).style.display = 'none';
            document.getElementById(`results${level}`).style.display = 'block';
            document.getElementById(`score${level}`).textContent = `一発正解 ${score}/${questions.length}問 (${percentage}%)`;
        }

        // 【ブラッシュアップ】結果画面から次のレベルへ
        function goLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i === level - 1));
            document.querySelectorAll('.quiz-container').forEach(container => container.classList.remove('active'));
            document.getElementById(`level${level}`).classList.add('active');
            restartLevel(level);
            window.scrollTo(0, 0);
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadQuestion(1);
        });
    </script>
<script>

    ".level-btn:not(.active)": "u-btn u-btn-plain",

    ".option.incorrect": "u-ng",
    ".buttons .btn-secondary": "u-btn u-btn-plain",
    ".buttons .btn-primary": "u-btn u-btn-blue",
    ".result-nav .again": "u-btn",
    ".result-nav .next": "u-btn u-btn-blue"

</script>
