    <div class="container">
        <h1>🔢 二次関数座標クイズ</h1>

        <div class="level-selector" id="levelSelector">
            <h2>レベルを選択してください</h2>
            <button class="level-btn" onclick="startLevel(1)">レベル1 (係数1の問題)</button>
            <button class="level-btn" onclick="startLevel(2)">レベル2 (係数2の問題)</button>
            <!-- 【ブラッシュアップ】数学Ⅰの内容として、レベル3・4 を足した -->
            <button class="level-btn" onclick="startLevel(3)">レベル3 (y = ax² + bx + c に代入)<small>y = a(x − p)² + q の形もあるよ</small></button>
            <button class="level-btn" onclick="startLevel(4)">レベル4 (f(x) の記号)<small>f(−1) の値・f(a + 1) の式</small></button>
        </div>

        <div class="quiz-container" id="quizContainer" style="display: none;">
            <div class="level-display" id="levelDisplay"></div>
            <div class="score">
                一発正解: <span id="correct">0</span> / 解いた問題: <span id="total">0</span>
            </div></div>

        <div class="quiz-section" id="quizSection" style="display: none;">
            <div class="function-display" id="functionDisplay"></div>

            <!-- 【ブラッシュアップ】問題文を関数のすぐ下に（元はヒントのボタンの下にあった） -->
            <div id="questionText" style="text-align: center; font-size: 1.2em; margin: 16px 0; font-weight: bold;"></div>

            <div class="graph-container" id="graphContainer" style="display: none;">
                <div id="graph"></div>
            </div>

            <div style="text-align: center; margin: 20px 0;">
                <button id="hintBtn" onclick="showGraphHint()" style="background: linear-gradient(135deg, #ffc107, #ff8f00); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1.1em; cursor: pointer;">
                    📊 グラフのヒントを見る
                </button>
            </div>

            <div class="choices-section" id="choicesSection">
                <div class="choices-grid" id="choicesGrid"></div>
            </div>

            <div class="hint-section" id="hintSection">
                <div class="hint-text" id="hintText"></div>
            </div>

            <div id="result" class="result" style="display: none;"></div>

            <button class="new-problem-btn" onclick="generateNewProblem()" style="display: none;">次の問題へ ▶</button>
            <div class="final-nav" id="finalNav" style="display: none;"></div>
        </div>
    </div>

    <script>

        let currentProblem = {};
        let correctCount = 0;   // 一発で正解できた問題の数
        let totalCount = 0;     // 解いた問題の数
        let attemptCount = 0;
        let choices = [];
        let currentLevel = 1;
        let selectedCorrectAnswers = new Set();
        const PER_LEVEL = 6;
        const MAX_LEVEL = 4;

        // --- 【ブラッシュアップ】レベル3・4 の関数（v があるものは y = a(x − p)² + q の形で表示する） ---
        const LEVEL3_FUNCS = [
            { a: 1, b: -3, c: 2 },
            { a: -1, b: 4, c: 0 },
            { a: 2, b: -1, c: -1 },
            { a: 2, b: -4, c: 5, v: { p: 1, q: 3 } },
            { a: -1, b: -4, c: 1, v: { p: -2, q: 5 } },
            { a: 1, b: 2, c: -3 }
        ];
        const LEVEL4_FUNCS = [
            { a: 1, b: -3, c: 2 },
            { a: -2, b: 1, c: 3 },
            { a: 1, b: 4, c: -1 },
            { a: 3, b: -2, c: 0 },
            { a: -1, b: 2, c: 5 }
        ];
        // f(a + 1) のように、文字の式を代入する問題（答えは node で検算済み）
        const EXPR_PROBLEMS = [
            { func: { a: 1, b: 0, c: 1 }, arg: 'a + 1', answer: 'a² + 2a + 2',
              wrongs: [['a² + 2', '(a + 1)² = a² + 2a + 1。(a + 1)² を a² + 1 としていないかな'],
                       ['a² + 2a + 1', '最後の + 1 をたし忘れていないかな'],
                       ['a² + a + 2', '(a + 1)² = a² + 2a + 1。2a の 2 に注意']],
              steps: 'f(a + 1) = (a + 1)² + 1\n= a² + 2a + 1 + 1\n= a² + 2a + 2' },
            { func: { a: 1, b: -2, c: 0 }, arg: 'a - 1', answer: 'a² - 4a + 3',
              wrongs: [['a² - 4a - 1', '-2(a - 1) = -2a + 2。符号に注意'],
                       ['a² - 2a + 3', '(a - 1)² = a² - 2a + 1 の -2a を忘れていないかな'],
                       ['a² - 3', '(a - 1)² = a² - 2a + 1。2 乗の展開を見直そう']],
              steps: 'f(a - 1) = (a - 1)² - 2(a - 1)\n= a² - 2a + 1 - 2a + 2\n= a² - 4a + 3' },
            { func: { a: 2, b: 0, c: -3 }, arg: '-a', answer: '2a² - 3',
              wrongs: [['-2a² - 3', '(-a)² = a²（負の数の 2 乗は正）。2 × a² = 2a²'],
                       ['4a² - 3', '2(-a)² = 2 × a²。2 は 2 乗しないよ'],
                       ['2a² + 3', '-3 はそのまま残るよ']],
              steps: 'f(-a) = 2(-a)² - 3\n= 2a² - 3' }
        ];

        // 表示用：マイナスを「−」に
        function mm(s) { return String(s).replace(/-/g, '−'); }

        // 関数の式（元の updateDisplay と同じ書き方。頂点の形も書ける）
        function funcText(f, head) {
            let t = (head || 'y') + ' = ';
            if (f.v) {
                const k = f.a === 1 ? '' : (f.a === -1 ? '-' : String(f.a));
                t += k + '(x ' + (f.v.p > 0 ? '- ' + f.v.p : '+ ' + (-f.v.p)) + ')²';
                if (f.v.q > 0) t += ' + ' + f.v.q; else if (f.v.q < 0) t += ' - ' + Math.abs(f.v.q);
                return t;
            }
            if (f.a === 1) t += 'x²'; else if (f.a === -1) t += '-x²'; else t += f.a + 'x²';
            if (f.b > 0) t += ' + ' + (f.b === 1 ? '' : f.b) + 'x'; else if (f.b < 0) t += ' - ' + (f.b === -1 ? '' : Math.abs(f.b)) + 'x';
            if (f.c > 0) t += ' + ' + f.c; else if (f.c < 0) t += ' - ' + Math.abs(f.c);
            return t;
        }
        function valueAt(f, x) { return f.a * x * x + f.b * x + f.c; }

        function startLevel(level) {
            currentLevel = level;
            correctCount = 0;
            totalCount = 0;

            document.getElementById('levelSelector').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('levelDisplay').textContent = 'レベル' + level;
            document.getElementById('quizSection').style.display = 'block';
            document.getElementById('finalNav').style.display = 'none';
            document.getElementById('choicesSection').style.display = 'block';
            const npb = document.querySelector('.new-problem-btn');
            npb.textContent = '次の問題へ ▶';
            npb.onclick = () => generateNewProblem();

            updateScore();
            generateNewProblem();
        }

        function generateNewProblem() {
            // 6問で終了チェック
            if (totalCount >= PER_LEVEL) {
                showFinalResult();
                return;
            }
            if (currentLevel >= 3) { generateFuncProblem(); return; }   // 【ブラッシュアップ】

            // 問題のタイプを決定（1-4問目はy を求める、5-6問目はx を求める）
            const findX = totalCount >= 4;
            let func, candidates = [];

            if (currentLevel === 1) {
                // レベル1: 係数1の問題（下に凸を多めに、問題5はy=1固定）
                if (findX) {
                    if (totalCount === 4) {
                        func = { a: 1, b: 0, c: 0 };   // 問題5は y = x², y = 1 で固定
                    } else {
                        const functions = [{ a: 1, b: 0, c: 0 }, { a: 1, b: 0, c: 0 }, { a: -1, b: 0, c: 0 }];
                        func = functions[Math.floor(Math.random() * functions.length)];
                    }
                } else {
                    const functions = [{ a: 1, b: 0, c: 0 }, { a: 1, b: 0, c: 0 }, { a: 1, b: 0, c: 0 }, { a: -1, b: 0, c: 0 }];
                    func = functions[Math.floor(Math.random() * functions.length)];
                }
            } else {
                // レベル2: 係数2の問題（下に凸を多めに）
                const functions = [{ a: 1, b: 0, c: 0 }, { a: 2, b: 0, c: 0 }, { a: 2, b: 0, c: 0 }, { a: 2, b: 0, c: 0 }, { a: -1, b: 0, c: 0 }, { a: -2, b: 0, c: 0 }];
                func = functions[Math.floor(Math.random() * functions.length)];
            }

            const { a, b, c } = func;
            const xRange = currentLevel === 1 ? [-2, -1, 1, 2] : [-3, -2, -1, 1, 2, 3];

            if (currentLevel === 1 && totalCount === 4 && findX) {
                candidates.push({ x: 1, y: 1 }, { x: -1, y: 1 });   // 問題5の特別処理（y = 1 固定）
            } else {
                for (let x of xRange) {
                    const y = a * x * x + b * x + c;
                    if (y !== 0 && Math.abs(y) <= 18 && Number.isInteger(y)) candidates.push({ x, y });
                }
            }
            const selected = candidates[Math.floor(Math.random() * candidates.length)];

            if (findX) {
                currentProblem = { a, b, c, func, knownValue: selected.y, knownType: 'y', findType: 'x',
                    answers: solveForX(a, b, c, selected.y), displayPoint: { x: selected.x, y: selected.y } };
            } else {
                currentProblem = { a, b, c, func, knownValue: selected.x, knownType: 'x', findType: 'y',
                    answers: [selected.y], displayPoint: { x: selected.x, y: selected.y } };
            }
            startProblem();
        }

        // 【ブラッシュアップ】レベル3・4 の問題を作る
        function generateFuncProblem() {
            const fNote = currentLevel === 4;
            if (fNote && totalCount === PER_LEVEL - 1) {
                const e = EXPR_PROBLEMS[Math.floor(Math.random() * EXPR_PROBLEMS.length)];
                currentProblem = { expr: e, func: e.func, a: e.func.a, b: e.func.b, c: e.func.c, findType: 'expr', answers: [e.answer] };
                startProblem();
                return;
            }
            const list = fNote ? LEVEL4_FUNCS : LEVEL3_FUNCS;
            // 同じレベルの中で、なるべく同じ関数が続かないようにする
            if (totalCount === 0) window.__funcOrder = shuffle(list.map((f, i) => i));
            const func = list[window.__funcOrder[totalCount % list.length]];
            const xs = fNote ? [-3, -2, -1, 0, 1, 2, 3] : [-3, -2, -1, 1, 2, 3];
            // 負の数を代入する問題を多めに（半分以上）
            const neg = xs.filter(x => x < 0), pos = xs.filter(x => x >= 0);
            let pool = (Math.random() < 0.6 ? neg : pos).filter(x => Math.abs(valueAt(func, x)) <= 40);
            if (!pool.length) pool = xs.filter(x => Math.abs(valueAt(func, x)) <= 40);
            const x = pool[Math.floor(Math.random() * pool.length)];
            currentProblem = { a: func.a, b: func.b, c: func.c, func, fNote, knownValue: x, knownType: 'x', findType: 'y',
                answers: [valueAt(func, x)], displayPoint: { x, y: valueAt(func, x) } };
            startProblem();
        }

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }

        // 問題ごとの準備（元の generateNewProblem の後半）
        function startProblem() {
            attemptCount = 0;
            selectedCorrectAnswers.clear();
            document.querySelector('.new-problem-btn').style.display = 'none';   // 答えるまで出さない
            const rd0 = document.getElementById('result'); rd0.style.background = ''; rd0.style.color = ''; rd0.style.border = '';
            generateChoices();
            updateDisplay();
            document.getElementById('result').style.display = 'none';
            document.getElementById('hintSection').style.display = 'none';
            document.getElementById('graphContainer').style.display = 'none';
            document.getElementById('hintBtn').style.display = currentProblem.findType === 'expr' ? 'none' : 'inline-block';
        }

        // --- 選択肢：正解と、よくあるまちがい（理由つき）。足りない分は近い数でうめる ---
        function generateChoices() {
            const P = currentProblem;
            choices = [];
            if (P.findType === 'expr') {
                choices = [{ value: P.expr.answer, isCorrect: true }].concat(P.expr.wrongs.map(w => ({ value: w[0], isCorrect: false, why: w[1] })));
                choices = shuffle(choices);
                return;
            }
            const answers = P.answers;
            answers.forEach(v => choices.push({ value: v, isCorrect: true }));
            const want = P.findType === 'x' && answers.length === 2 ? 4 : 4;
            const traps = makeTraps(P);
            const used = new Set(answers.map(v => Math.round(v * 1000)));
            const addWrong = (v, why) => {
                if (choices.length >= want || !Number.isInteger(v) || used.has(Math.round(v * 1000))) return;
                used.add(Math.round(v * 1000));
                choices.push({ value: v, isCorrect: false, why });
            };
            // よくあるまちがいから 2 つまで（順番はまぜる）
            shuffle(traps).slice(0, 2).forEach(t => addWrong(t.v, t.why));
            // 残りは近い数（x を求める問題は ±1〜±3、y を求める問題は正解の近く）
            let guard = 0;
            while (choices.length < want && guard++ < 200) {
                let v;
                if (P.findType === 'x') v = [-3, -2, -1, 1, 2, 3][Math.floor(Math.random() * 6)];
                else v = answers[0] + [-6, -4, -3, -2, -1, 1, 2, 3, 4, 6][Math.floor(Math.random() * 10)];
                addWrong(v, P.findType === 'x' ? 'x = ' + mm(v) + ' を代入すると y = ' + mm(valueAt(P.func, v)) + ' になるよ' : 'もう一度、かっこをつけて代入して計算しよう');
            }
            choices = shuffle(choices);
        }

        // よくあるまちがいと、その理由
        function makeTraps(P) {
            const t = [], f = P.func, x = P.knownValue;
            if (P.findType === 'x') {
                const r = P.knownValue / P.a;   // x² = r のとき、√ をつけ忘れると x = r
                t.push({ v: r, why: 'x² = ' + mm(r) + ' なので、x は「2 乗して ' + mm(r) + ' になる数」。√ をとるのを忘れていないかな' });
                t.push({ v: -r, why: 'x² = ' + mm(r) + ' なので、x は「2 乗して ' + mm(r) + ' になる数」だよ' });
                return t;
            }
            const y = P.answers[0];
            if (!f.b && !f.c) {
                // y = ax²（元の版のトラップに理由をつけた）
                t.push({ v: -y, why: P.a > 0 ? '(' + mm(x) + ')² = ' + (x * x) + ' は正の数。y = ' + (P.a === 1 ? '' : P.a + ' × ') + (x * x) + ' だよ' : 'y = ' + mm(P.a) + ' × (' + mm(x) + ')²。' + mm(P.a) + ' をかけるので負の数になるよ' });
                t.push({ v: P.a * x, why: 'x² は x × x。2 乗するのを忘れていないかな' });
                t.push({ v: 2 * P.a * x, why: 'x² は x × x（2 × x ではない）' });
                t.push({ v: P.a * P.a * x * x, why: 'a は 2 乗しないよ。y = ' + mm(P.a) + ' × x²' });
                return t;
            }
            // レベル3・4：代入のまちがい
            if (x < 0) t.push({ v: -f.a * x * x + f.b * x + f.c, why: '負の数の 2 乗は正。(' + mm(x) + ')² = ' + (x * x) + ' だよ' });
            if (f.b && x !== 0) t.push({ v: f.a * x * x - f.b * x + f.c, why: (f.v ? 'かっこの中の計算' : mm(f.b) + ' × (' + mm(x) + ') = ' + mm(f.b * x)) + '。符号に注意しよう' });
            if (f.v) {
                t.push({ v: f.a * (x + f.v.p) * (x + f.v.p) + f.v.q, why: 'x = ' + mm(x) + ' のとき (x ' + (f.v.p > 0 ? '- ' + f.v.p : '+ ' + (-f.v.p)) + ') = ' + mm(x - f.v.p) + '。かっこの中の符号に注意' });
                t.push({ v: f.a * (x - f.v.p) * (x - f.v.p), why: '最後の ' + (f.v.q > 0 ? '+ ' : '- ') + Math.abs(f.v.q) + ' をたし忘れていないかな' });
            } else if (f.c) {
                t.push({ v: f.a * x * x + f.b * x, why: '定数項の ' + mm(f.c) + ' をたし忘れていないかな' });
            }
            if (f.a !== 1 && !f.v) t.push({ v: x * x + f.b * x + f.c, why: 'x² に ' + mm(f.a) + ' をかけるのを忘れていないかな' });
            return t;
        }

        function solveForX(a, b, c, y) {
            // ax² + bx + c = y を解く
            const A = a, B = b, C = c - y;
            const discriminant = B * B - 4 * A * C;
            if (discriminant < 0) return [];
            if (discriminant === 0) return [-B / (2 * A)];
            const x1 = (-B + Math.sqrt(discriminant)) / (2 * A);
            const x2 = (-B - Math.sqrt(discriminant)) / (2 * A);
            return [x1, x2].sort((a, b) => a - b);
        }

        function updateDisplay() {
            const P = currentProblem;
            const fd = document.getElementById('functionDisplay');
            const qt = document.getElementById('questionText');
            if (P.findType === 'expr') {
                fd.textContent = mm(funcText(P.func, 'f(x)'));
                qt.textContent = mm('f(' + P.expr.arg + ') を a の式で表すと？');
            } else if (P.fNote) {
                fd.textContent = mm(funcText(P.func, 'f(x)'));
                qt.textContent = mm('f(' + P.knownValue + ') の値を求めてください。');
            } else {
                fd.textContent = mm(funcText(P.func));
                if (P.findType === 'x') {
                    qt.textContent = mm('グラフ上の点で y = ' + P.knownValue + ' のとき、x の値を' + (P.answers.length === 2 ? 'すべて選んでください。（2 つあります）' : '求めてください。'));
                } else {
                    qt.textContent = mm('グラフ上の点で x = ' + P.knownValue + ' のとき、y の値を求めてください。');
                }
            }
            displayChoices();
        }

        function displayChoices() {
            const choicesGrid = document.getElementById('choicesGrid');
            choicesGrid.innerHTML = '';
            choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = mm(choice.value);
                button.onclick = () => selectChoice(index);
                choicesGrid.appendChild(button);
            });
        }

        // 正解したときの計算の説明
        function calcText() {
            const P = currentProblem, f = P.func, x = P.knownValue;
            if (P.findType === 'expr') return P.expr.steps;
            if (P.findType === 'x') {
                const r = P.knownValue / P.a;
                let s = '関数 ' + funcText(f) + ' に y = ' + P.knownValue + ' を代入すると:\n';
                if (P.a !== 1) s += (P.a === -1 ? '-' : P.a) + 'x² = ' + P.knownValue + '\n';
                s += 'x² = ' + r + '\nx = ±√' + r + ' = ±' + Math.sqrt(r);
                return s;
            }
            const head = P.fNote ? 'f(' + x + ')' : 'y';
            const X = '(' + x + ')';
            let l1, l2;
            if (!f.b && !f.c && !f.v) {
                // y = ax²（レベル1・2）
                const name0 = funcText(f);
                if (f.a === 1) return '関数 ' + name0 + ' に x = ' + x + ' を代入すると:\ny = ' + X + '²\ny = ' + P.answers[0];
                if (f.a === -1) return '関数 ' + name0 + ' に x = ' + x + ' を代入すると:\ny = -' + X + '²\ny = ' + P.answers[0] + '（' + X + '² = ' + (x * x) + ' に − をつける）';
                return '関数 ' + name0 + ' に x = ' + x + ' を代入すると:\ny = ' + f.a + X + '²\ny = ' + f.a + ' × ' + (x * x) + '\ny = ' + P.answers[0];
            }
            if (f.v) {
                const k = f.a === 1 ? '' : (f.a === -1 ? '-' : f.a + ' × ');
                const inner = x - f.v.p;
                l1 = k + '(' + x + ' ' + (f.v.p > 0 ? '- ' + f.v.p : '+ ' + (-f.v.p)) + ')²' + (f.v.q > 0 ? ' + ' + f.v.q : ' - ' + Math.abs(f.v.q));
                l2 = k + '(' + inner + ')²' + (f.v.q > 0 ? ' + ' + f.v.q : ' - ' + Math.abs(f.v.q));
                l2 += '\n= ' + (f.a * inner * inner) + (f.v.q > 0 ? ' + ' + f.v.q : ' - ' + Math.abs(f.v.q));
            } else {
                const k = f.a === 1 ? '' : (f.a === -1 ? '-' : f.a + ' × ');
                l1 = k + X + '²';
                if (f.b) l1 += (f.b > 0 ? ' + ' : ' - ') + (Math.abs(f.b) === 1 ? '' : Math.abs(f.b) + ' × ') + X;
                if (f.c) l1 += (f.c > 0 ? ' + ' : ' - ') + Math.abs(f.c);
                const parts = [f.a * x * x];
                if (f.b) parts.push(f.b * x);
                if (f.c) parts.push(f.c);
                l2 = parts.map((v, i) => (i === 0 ? String(v) : (v < 0 ? '- ' + (-v) : '+ ' + v))).join(' ');
            }
            const name = P.fNote ? funcText(f, 'f(x)') : funcText(f);
            return '関数 ' + name + ' に x = ' + x + ' を代入すると:\n' + head + ' = ' + l1 + '\n= ' + l2 + '\n= ' + P.answers[0];
        }

        function selectChoice(index) {
            const selectedChoice = choices[index];
            const buttons = document.querySelectorAll('.choice-btn');
            const P = currentProblem;

            if (selectedChoice.isCorrect) {
                buttons[index].classList.add('correct');
                buttons[index].style.pointerEvents = 'none';
                selectedCorrectAnswers.add(selectedChoice.value);
                const need = P.findType === 'x' ? P.answers.length : 1;
                const resultDiv = document.getElementById('result');
                if (selectedCorrectAnswers.size < need) {
                    // まだ1つだけ
                    resultDiv.className = 'result';
                    resultDiv.style.background = '#fff3cd';
                    resultDiv.style.color = '#856404';
                    resultDiv.style.border = '2px solid #ffc107';
                    resultDiv.textContent = '👍 1つ正解！もう1つの値も見つけてください。';
                    resultDiv.style.display = 'block';
                    return;
                }
                if (attemptCount === 0) correctCount++;   // 一発で正解したときだけ数える
                totalCount++;
                resultDiv.style.background = ''; resultDiv.style.color = ''; resultDiv.style.border = '';
                resultDiv.className = 'result correct';
                resultDiv.textContent = mm((need === 2 ? '🎉 正解です！両方の値を見つけました！' : '🎉 正解です！') + '\n\n' + calcText());
                resultDiv.style.display = 'block';
                document.getElementById('hintSection').style.display = 'none';
                buttons.forEach(btn => btn.style.pointerEvents = 'none');
                updateScore();
                const npb = document.querySelector('.new-problem-btn');
                npb.textContent = totalCount >= PER_LEVEL ? '結果を見る ▶' : '次の問題へ ▶';
                npb.style.display = 'block';
                npb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                // 不正解：理由とヒントを出す
                attemptCount++;
                buttons[index].classList.add('incorrect');
                buttons[index].style.pointerEvents = 'none';
                showHint(selectedChoice);
            }
        }

        function showGraphHint() {
            const graphContainer = document.getElementById('graphContainer');
            graphContainer.style.display = 'flex';
            document.getElementById('hintBtn').style.display = 'none';
            drawGraph();
        }

        // 【ブラッシュアップ】まちがえたとき：選んだ答えがなぜちがうか ＋ 考え方のヒント
        function showHint(choice) {
            const P = currentProblem;
            let hint = '';
            if (P.findType === 'expr') {
                hint = 'x のところに (' + P.expr.arg + ') をまるごと入れて、展開しよう';
            } else if (P.findType === 'x') {
                hint = attemptCount === 1 ? 'グラフ上の点から軸への破線を見て、対称性を考えてみましょう！'
                    : '二次関数 y = ax² のグラフは y 軸について左右対称。同じ y の値になる x は、正と負の 2 つあるよ！';
            } else if (!P.func.b && !P.func.c) {
                hint = attemptCount === 1 ? 'x = ' + P.knownValue + ' を代入しよう。負の数は (−2)² のようにかっこをつけて 2 乗する'
                    : 'y = ax² では、x = 2 と x = −2 で y は同じ値になるよ（グラフは y 軸について対称）';
            } else {
                hint = attemptCount === 1 ? 'x に (' + P.knownValue + ') をかっこごと代入して、2 乗・かけ算から先に計算しよう'
                    : '代入した式：' + calcText().split('\n')[1];
            }
            const why = choice && choice.why ? '✖ ' + mm(choice.value) + ' ではないよ。' + choice.why + '\n' : '';
            const hintText = document.getElementById('hintText');
            hintText.textContent = mm(why + 'ヒント: ' + hint);
            document.getElementById('hintSection').style.display = 'block';
        }

        // 【ブラッシュアップ】グラフは共通部品 graph.js で描く（点から座標軸への破線も graph.js の guide で）
        function drawGraph() {
            const P = currentProblem, f = P.func, box = document.getElementById('graph');
            if (!window.Graph) { box.textContent = ''; return; }
            let pts, xmin, xmax;
            if (P.findType === 'x') {
                pts = P.answers.map(x => ({ x, y: P.knownValue, label: '(?, ' + mm(P.knownValue) + ')', guide: true }));
                const m = Math.max(...P.answers.map(Math.abs));
                xmin = -m - 1; xmax = m + 1;
            } else {
                pts = [{ x: P.knownValue, y: P.answers[0], label: '(' + mm(P.knownValue) + ', ?)', guide: true }];
                const vx = -f.b / (2 * f.a);
                xmin = Math.floor(Math.min(P.knownValue, vx)) - 2; xmax = Math.ceil(Math.max(P.knownValue, vx)) + 2;
                if (!f.b && !f.c) { const m = Math.abs(P.knownValue) + 1; xmin = -m; xmax = m; }
            }
            box.innerHTML = Graph.parabola({ a: f.a, b: f.b, c: f.c, xmin, xmax, points: pts });   // guide: 点から座標軸への破線
            const svg = box.querySelector('svg');
            if (svg) { svg.removeAttribute('width'); svg.style.width = '100%'; svg.style.maxWidth = '420px'; svg.style.height = 'auto'; }
        }
        function updateScore() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('total').textContent = totalCount;
        }

        function showFinalResult() {
            const resultDiv = document.getElementById('result');
            const percentage = Math.round((correctCount / PER_LEVEL) * 100);
            let message = '';
            if (percentage >= 80) {
                message = '🎉 素晴らしい！一発正解 ' + correctCount + '/6問（' + percentage + '%）\n二次関数の座標をよく理解していますね！';
            } else if (percentage >= 60) {
                message = '👍 よくできました！一発正解 ' + correctCount + '/6問（' + percentage + '%）\nもう少し練習すればもっと上達しますよ！';
            } else {
                message = '📚 一発正解 ' + correctCount + '/6問（' + percentage + '%）\n理由を読みながら、もう一度やってみましょう！';
            }
            resultDiv.className = 'result';
            resultDiv.style.background = '#e6fffa';
            resultDiv.style.color = '#234e52';
            resultDiv.style.border = '2px solid #4fd1c7';
            resultDiv.textContent = message;
            resultDiv.style.display = 'block';
            document.getElementById('choicesSection').style.display = 'none';
            document.getElementById('hintSection').style.display = 'none';
            document.getElementById('graphContainer').style.display = 'none';
            document.getElementById('hintBtn').style.display = 'none';
            document.getElementById('questionText').textContent = '';
            document.getElementById('functionDisplay').textContent = 'レベル' + currentLevel + ' おわり';
            document.querySelector('.new-problem-btn').style.display = 'none';
            const nav = document.getElementById('finalNav');
            nav.innerHTML = '<button class="again" onclick="startLevel(currentLevel)">同じレベルでもう一度</button>' +
                (currentLevel < MAX_LEVEL ? '<button class="next" onclick="startLevel(' + (currentLevel + 1) + ')">レベル' + (currentLevel + 1) + 'へ ▶</button>' : '') +
                '<button class="back" onclick="backToLevels()">レベル選択に戻る</button>' +
                '<a href="../remake.html">ほかの教材をえらぶ</a>';
            nav.style.display = 'flex';
        }

        // レベル選択に戻る
        function backToLevels() {
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('levelSelector').style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }


        // 【ブラッシュアップ】式の書き方を教科書にそろえる：文字（x, y, a, p, q, f, D, k など）は斜体、
        //   数字・記号はまっすぐ。どちらも数式の書体（var(--u-math-font)）で、日本語は普通の書体のまま。
        //   式のひとかたまり（「0 ≦ x ≦ 2」など）は途中で改行しない（長い式は「=」の前で分ける）。
        //   画面の文字はマイナスを「−」にする以外は変えないので、答え合わせには影響しない。
        //   画面が書きかわるたびに、指定した場所に当て直す。
        const MATH_RUN = /[A-Za-z0-9²³±√≦≧<>=+\-−·×÷\/.,()|' ]*[A-Za-z0-9][A-Za-z0-9²³±√≦≧<>=+\-−·×÷\/.,()|' ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .math, i, script, style, svg, input, textarea, mjx-container, .MathJax')) continue;
                if (/\\|\$\$/.test(n.nodeValue)) continue;   // MathJax がまだ組んでいない式（\( … \) など）にはさわらない
                if (/[A-Za-z0-9]/.test(n.nodeValue)) nodes.push(n);
                else if (/-/.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/-/g, '−');   // 「-(」など記号だけの部分もマイナスは「−」
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    // 長い式は「 = 」の前で区切り、区切りのところだけで改行できるようにする
                    const pieces = text.length > 22 ? text.split(/(?= = )/) : [text];
                    pieces.forEach((piece, k) => {
                        if (k) frag.appendChild(document.createTextNode(' '));
                        const span = document.createElement('span');
                        span.className = 'm';
                        piece.trim().split(/([A-Za-z]+)/).forEach((part, j) => {
                            if (!part) return;
                            if (j % 2) { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                            else span.appendChild(document.createTextNode(part.replace(/-/g, '−')));
                        });
                        frag.appendChild(span);
                    });
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        watchMath(['#functionDisplay', '#questionText', '#choicesGrid', '#result', '#hintText', '.level-selector']);

        // レベル選択画面から開始
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    "h1": "u-title",
    ".level-btn": "u-btn",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.incorrect": "u-ng",
    "#hintBtn": "u-btn",
    ".new-problem-btn": "u-btn u-btn-blue",
    ".final-nav .again": "u-btn",
    ".final-nav .next": "u-btn u-btn-blue",
    ".final-nav .back": "u-btn u-btn-plain"
  });
</script>
