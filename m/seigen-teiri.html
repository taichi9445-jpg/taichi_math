</style></head><body><a class="port-back" href="../index.html">← 教材の一覧へ</a><main class="fs-wrap"><header class="fs-head"><small>数学Ⅰ　図形と計量</small><h1>正弦定理</h1></header><div id="app"></div></main><script src="../assets/fill-steps.js"></script><script>
function drawTriangle(triangle, problem) {
      // 【ブラッシュアップ】元は BC と CA の長さを決め打ちして角 C だけで描いていたため、
      //   角 A・B と辺の比が問題の数値と合っていなかった（105° が鋭角に描かれる、大きい角と小さい角が逆 など）。
      //   正弦定理 BC : CA = sinA : sinB から形を計算し、画面に収まるように拡大してかく。
      //   同じ色の辺と角が「向かい合うペア」（青：わかっているペア、オレンジ：求めるペア）。
      const toRad = d => d * Math.PI / 180;
      const { A, B, C } = triangle;
      const ca = Math.sin(toRad(B)) / Math.sin(toRad(A));          // BC を 1 としたときの CA
      const raw = { C: [0, 0], B: [1, 0], A: [ca * Math.cos(toRad(C)), ca * Math.sin(toRad(C))] };
      const R0 = 1 / (2 * Math.sin(toRad(A)));                      // 外接円の半径（BC = 1 のとき）
      const O0 = [0.5, Math.sqrt(Math.max(R0 * R0 - 0.25, 0)) * (A < 90 ? 1 : -1)];
      const xs = [0, 1, raw.A[0]], ys = [0, 0, raw.A[1]];
      if (triangle.circle) { xs.push(O0[0] - R0, O0[0] + R0); ys.push(O0[1] - R0, O0[1] + R0); }
      const W = 250, H = 170, M = 36;
      const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
      const k = Math.min(W / (maxx - minx), H / (maxy - miny));
      const ox = M + (W - (maxx - minx) * k) / 2, oy = M + (H - (maxy - miny) * k) / 2;
      const T = p => [ox + (p[0] - minx) * k, oy + (maxy - p[1]) * k];
      const P = { A: T(raw.A), B: T(raw.B), C: T(raw.C) };
      const G = [(P.A[0] + P.B[0] + P.C[0]) / 3, (P.A[1] + P.B[1] + P.C[1]) / 3];
      const f = v => Math.round(v * 10) / 10;
      const unit = (p, q) => { const x = q[0] - p[0], y = q[1] - p[1], l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
      const at = (p, u, d) => [f(p[0] + u[0] * d), f(p[1] + u[1] * d)];
      const pair = L => {
        const l = L.toLowerCase();
        if (triangle.known && triangle.known === l) return ' k';
        if (triangle.target && triangle.target === l) return ' t';
        return '';
      };
      const text = (p, s, cls) => `<text x="${p[0]}" y="${p[1]}" class="${cls}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
      let svg = `<svg viewBox="0 0 ${W + 2 * M} ${H + 2 * M}" width="${W + 2 * M}" height="${H + 2 * M}" class="st-svg" data-pts="${[P.A, P.B, P.C].map(p => f(p[0]) + ',' + f(p[1])).join(' ')}">`;
      svg += `<polygon points="${[P.A, P.B, P.C].map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" class="st-body" />`;
      if (triangle.circle) {   // 外接円（三角形の上にかいて、中心 O と半径 R が見えるように）
        const O = T(O0), r = R0 * k;
        svg += `<circle cx="${f(O[0])}" cy="${f(O[1])}" r="${f(r)}" class="st-circle" />`;
        svg += `<line x1="${f(O[0])}" y1="${f(O[1])}" x2="${f(O[0]+r)}" y2="${f(O[1])}" class="st-radius" />`;
        svg += `<circle cx="${f(O[0])}" cy="${f(O[1])}" r="3" class="st-center" />`;
        
        const mid = [O[0]+r*.65, O[1]-28], u = [1,0];
        svg += text(at(mid, [-u[1], u[0]], 14), triangle.circle.replace(/([A-Za-z])/g, '<tspan class="v">$1</tspan>'), 'st-r');   // R は斜体
      }
      const others = { A: ['B', 'C'], B: ['C', 'A'], C: ['A', 'B'] };
      ['A', 'B', 'C'].forEach(L => {
        const V = P[L], u1 = unit(V, P[others[L][0]]), u2 = unit(V, P[others[L][1]]);
        const lens = others[L].map(o => Math.hypot(P[o][0] - V[0], P[o][1] - V[1]));
        const deg = triangle[L];
        const label = triangle.angles && triangle.angles[L];
        if (!label && Math.abs(deg - 90) < 0.01) {   // 直角のしるし
          const s = 12, a1 = at(V, u1, s), a2 = at(V, u2, s), c = [f(V[0] + (u1[0] + u2[0]) * s), f(V[1] + (u1[1] + u2[1]) * s)];
          svg += `<path d="M ${a1[0]},${a1[1]} L ${c[0]},${c[1]} L ${a2[0]},${a2[1]}" class="st-right" />`;
        }
        if (!label) return;
        const r = Math.min(95, 0.75 * Math.min(...lens));
        const a1 = at(V, u1, r), a2 = at(V, u2, r);
        const sweep = (u1[0] * u2[1] - u1[1] * u2[0]) > 0 ? 1 : 0;
        svg += `<path d="M ${a1[0]},${a1[1]} A ${f(r)},${f(r)} 0 0,${sweep} ${a2[0]},${a2[1]}" class="st-arc${pair(L)}" />`;
        const bis = unit([0, 0], [u1[0] + u2[0], u1[1] + u2[1]]);
        svg += text(at(V, bis, r * .78), label, 'st-ang' + pair(L));
      });
      const ends = { a: ['B', 'C'], b: ['C', 'A'], c: ['A', 'B'] };
      Object.keys(triangle.sides || {}).forEach(l => {
        const p = P[ends[l][0]], q = P[ends[l][1]], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
        let n = [-(q[1] - p[1]), q[0] - p[0]]; const len = Math.hypot(...n); n = [n[0] / len, n[1] / len];
        if ((m[0] - G[0]) * n[0] + (m[1] - G[1]) * n[1] < 0) n = [-n[0], -n[1]];
        svg += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="st-edge${pair(l)}"/>`;
 const s = triangle.sides[l], w = 10 * s.length + 4;
        svg += text(at(m, n, 8 + Math.abs(n[0]) * w / 2 + Math.abs(n[1]) * 9), s, 'st-side' + (/^[abc]$/.test(s) ? ' var' : '') + pair(l));
      });
      ['A', 'B', 'C'].forEach(L => { svg += text(at(P[L], unit(G, P[L]), 17), L, 'st-vtx' + pair(L)); });
      return svg + '</svg>';
    }
