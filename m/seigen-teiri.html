<script>
const NAVY = '#1f4e8c', ORANGE = '#d9480f', INK = '#1f2328';

// 図の中の数（√ は記号の右上から横線が中の数字にかぶさる）。(x, y) が文字のまん中
function svgNum(x, y, s, color, fs = 19) {
  const m = String(s).match(/^(\d*)√(\d+)$/), cw = fs * 0.56, b = y + fs * 0.35;
  if (!m) return `<text x="${x}" y="${b}" text-anchor="middle" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${s}</text>`;
  const hw = m[1].length * cw, dw = m[2].length * cw, w = hw + fs * 0.75 + dw + 2, x0 = x - w / 2, x1 = x0 + hw + 1;
  return `<text x="${x0}" y="${b}" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${m[1]}</text>` +
    `<path d="M${x1} ${b - fs * 0.3}L${x1 + fs * 0.18} ${b - fs * 0.4}L${x1 + fs * 0.4} ${b + 1}L${x1 + fs * 0.7} ${b - fs * 0.92}H${x1 + fs * 0.75 + dw + 2}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>` +
    `<text x="${x1 + fs * 0.75}" y="${b}" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${m[2]}</text>`;
}
const ital = (x, y, s, color, fs = 22) => `<text x="${x}" y="${y + fs * 0.35}" text-anchor="middle" font-family="STIX Two Text, serif" font-style="italic" font-size="${fs}" fill="${color}">${s}</text>`;

// 問題の図：正弦定理 BC : CA = sin A : sin B から形を計算する（PR #5 の形をもとに、文字の置き方を直した）
function drawTriangle(tr) {
  const rad = d => d * Math.PI / 180, { A, B, C } = tr;
  const ca = Math.sin(rad(B)) / Math.sin(rad(A));
  const raw = { C: [0, 0], B: [1, 0], A: [ca * Math.cos(rad(C)), ca * Math.sin(rad(C))] };
  const R0 = 1 / (2 * Math.sin(rad(A))), O0 = [0.5, Math.sqrt(Math.max(R0 * R0 - 0.25, 0)) * (A < 90 ? 1 : -1)];
  const xs = [0, 1, raw.A[0]], ys = [0, 0, raw.A[1]];
  if (tr.circle) { xs.push(O0[0] - R0, O0[0] + R0); ys.push(O0[1] - R0, O0[1] + R0); }
  const W = 250, H = 170, M = 34;
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const k = Math.min(W / (maxx - minx), H / (maxy - miny));
  const ox = M + (W - (maxx - minx) * k) / 2, oy = M + (H - (maxy - miny) * k) / 2;
  const T = p => [ox + (p[0] - minx) * k, oy + (maxy - p[1]) * k];
  const P = { A: T(raw.A), B: T(raw.B), C: T(raw.C) };
  const G = [(P.A[0] + P.B[0] + P.C[0]) / 3, (P.A[1] + P.B[1] + P.C[1]) / 3];
  const f = v => Math.round(v * 10) / 10, unit = (p, q) => { const x = q[0] - p[0], y = q[1] - p[1], l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  const col = L => { const l = L.toLowerCase(); return tr.known === l ? NAVY : tr.target === l ? ORANGE : INK; };
  const segs = [[P.A, P.B], [P.B, P.C], [P.C, P.A]];
  const inTri = (x, y) => { const c = (U, V) => (V[0] - U[0]) * (y - U[1]) - (V[1] - U[1]) * (x - U[0]); const d = [c(P.A, P.B), c(P.B, P.C), c(P.C, P.A)]; return d.every(v => v >= 0) || d.every(v => v <= 0); };
  const offEdges = (x, y, w, h) => segs.every(([U, V]) => { for (let i = 0; i <= 40; i++) { const sx = U[0] + (V[0] - U[0]) * i / 40, sy = U[1] + (V[1] - U[1]) * i / 40; if (Math.abs(sx - x) < w / 2 + 3 && Math.abs(sy - y) < h / 2 + 3) return false; } return true; });
  let s = `<svg viewBox="0 0 ${W + 2 * M} ${H + 2 * M}" width="${W + 2 * M}" role="img" aria-label="三角形ABC">`;
  s += `<polygon points="${[P.A, P.B, P.C].map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="#eef4fb" stroke="${INK}" stroke-width="2"/>`;
  let away = null; const avoid = [];   // 角度の文字が重なってはいけないもの（円の中心・R の文字）
  if (tr.circle) {   // 外接円。半径は頂点からはなれた向きにかき、R はその線のすぐ上
    const O = T(O0), r = R0 * k, dirs = [P.A, P.B, P.C].map(V => Math.atan2(V[1] - O[1], V[0] - O[0]));
    let best = 0, bestGap = -1;   // 3つの頂点の向きから、いちばんはなれた向き（水平に近いほうを少し優先）
    for (let d = 0; d < 360; d += 5) { const t = d * Math.PI / 180, gap = Math.min(...dirs.map(q => Math.abs(Math.atan2(Math.sin(t - q), Math.cos(t - q))))) + 0.15 * Math.abs(Math.cos(t)); if (gap > bestGap) { bestGap = gap; best = t; } }
    away = [Math.cos(best), Math.sin(best)];
    const E = [O[0] + away[0] * r, O[1] + away[1] * r];
    s += `<circle cx="${f(O[0])}" cy="${f(O[1])}" r="${f(r)}" fill="none" stroke="#7296be" stroke-width="1.5"/>`;
    s += `<path d="M${f(O[0])} ${f(O[1])}L${f(E[0])} ${f(E[1])}" stroke="#2b8a3e" stroke-width="2" stroke-dasharray="5 3"/><circle cx="${f(O[0])}" cy="${f(O[1])}" r="3.2" fill="#2b8a3e"/>`;
    const n = [-away[1], away[0]], lw = tr.circleVal ? 58 : 16;
    let mx = (O[0] + E[0]) / 2 + n[0] * 14, my = (O[1] + E[1]) / 2 + n[1] * 14;
    pick: for (const t of [0.55, 0.7, 0.4, 0.85]) for (const sd of [1, -1]) {   // 三角形の外で、辺にかからない場所
      const off = 8 + Math.abs(n[0]) * lw / 2 + Math.abs(n[1]) * 10, x = O[0] + (E[0] - O[0]) * t + n[0] * off * sd, y = O[1] + (E[1] - O[1]) * t + n[1] * off * sd;
      if (!inTri(x, y) && offEdges(x, y, lw, 20)) { mx = x; my = y; break pick; }
    }
    avoid.push([O[0], O[1], 6, 6], [mx, my, lw, 20]);
    s += tr.circleVal ? `<text x="${mx}" y="${my + 7}" text-anchor="middle" font-size="20" fill="#2b8a3e"><tspan font-family="STIX Two Text, serif" font-style="italic">R</tspan><tspan font-family="BIZ UDPGothic, sans-serif" font-weight="700"> = ${tr.circleVal}</tspan></text>` : ital(mx, my, 'R', '#2b8a3e', 21);
  }
  ['A', 'B', 'C'].forEach(L => {   // 角：弧と角度の文字（三角形の中の、辺にかからない場所）
    const V = P[L], o = { A: ['B', 'C'], B: ['C', 'A'], C: ['A', 'B'] }[L], u1 = unit(V, P[o[0]]), u2 = unit(V, P[o[1]]), deg = tr[L], label = tr.angles && tr.angles[L];
    if (!label) {
      if (Math.abs(deg - 90) < 0.01) { const a1 = [V[0] + u1[0] * 12, V[1] + u1[1] * 12], a2 = [V[0] + u2[0] * 12, V[1] + u2[1] * 12]; s += `<path d="M${f(a1[0])} ${f(a1[1])}L${f(a1[0] + u2[0] * 12)} ${f(a1[1] + u2[1] * 12)}L${f(a2[0])} ${f(a2[1])}" fill="none" stroke="${INK}" stroke-width="1.5"/>`; }
      return;
    }
    const lens = o.map(q => Math.hypot(P[q][0] - V[0], P[q][1] - V[1])), r = Math.min(deg > 90 ? 18 : 26, 0.4 * Math.min(...lens));
    const a1 = [V[0] + u1[0] * r, V[1] + u1[1] * r], a2 = [V[0] + u2[0] * r, V[1] + u2[1] * r], sweep = (u1[0] * u2[1] - u1[1] * u2[0]) > 0 ? 1 : 0;
    s += `<path d="M${f(a1[0])} ${f(a1[1])}A${f(r)} ${f(r)} 0 0 ${sweep} ${f(a2[0])} ${f(a2[1])}" fill="none" stroke="${col(L)}" stroke-width="2"/>`;
    const fs = 17, w = String(label).length * fs * 0.62, h = fs;
    const t0 = Math.atan2(u1[1], u1[0]); let dt = Math.atan2(u2[1], u2[0]) - t0; if (dt > Math.PI) dt -= 2 * Math.PI; if (dt < -Math.PI) dt += 2 * Math.PI;
    let at = null;
    search: for (let d = r + 6; d < 150; d += 1) for (const q of [0.5, 0.4, 0.6, 0.3, 0.7, 0.2, 0.8]) {
      const x = V[0] + d * Math.cos(t0 + dt * q), y = V[1] + d * Math.sin(t0 + dt * q);
      if (inTri(x, y) && offEdges(x, y, w, h) && Math.hypot(x - V[0], y - V[1]) > r + w / 2 && avoid.every(([ax, ay, aw, ah]) => Math.abs(ax - x) > (aw + w) / 2 + 3 || Math.abs(ay - y) > (ah + h) / 2 + 3)) { at = [x, y]; break search; }
    }
    if (!at) at = [V[0] + (r + 16) * Math.cos(t0 + dt / 2), V[1] + (r + 16) * Math.sin(t0 + dt / 2)];
    s += `<text x="${f(at[0])}" y="${f(at[1] + fs * 0.35)}" text-anchor="middle" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${col(L)}">${label}</text>`;
  });
  const ends = { a: ['B', 'C'], b: ['C', 'A'], c: ['A', 'B'] };
  Object.keys(tr.sides || {}).forEach(l => {   // 辺：わかっている組・求める組は太線。長さは辺のまん中の外側（円があるときは内側）
    const p = P[ends[l][0]], q = P[ends[l][1]], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let n = [-(q[1] - p[1]), q[0] - p[0]]; const len = Math.hypot(...n); n = [n[0] / len, n[1] / len];
    if ((m[0] - G[0]) * n[0] + (m[1] - G[1]) * n[1] < 0) n = [-n[0], -n[1]];
    if (tr.circle) n = [-n[0], -n[1]];
    if (col(l) !== INK) s += `<path d="M${f(p[0])} ${f(p[1])}L${f(q[0])} ${f(q[1])}" stroke="${col(l)}" stroke-width="4" stroke-linecap="round"/>`;
    const txt = tr.sides[l], d = 12 + Math.abs(n[0]) * (txt.length * 6 + 4);
    s += /^[abc]$/.test(txt) ? ital(m[0] + n[0] * d, m[1] + n[1] * d, txt, col(l)) : svgNum(m[0] + n[0] * d, m[1] + n[1] * d, txt, col(l));
  });
  ['A', 'B', 'C'].forEach(L => { const u = unit(G, P[L]); s += ital(P[L][0] + u[0] * 17, P[L][1] + u[1] * 17, L, col(L), 21); });
  return s + '</svg>';
}

// 行は [式, ヒントの種類]。ヒントの文は hint() で作る
const problems = [
  { // 問1：空欄は少なめ
    q: '△ABC において、A = 30°、B = 60°、b = 6 のとき、辺 a の長さを求めよ。',
    triangle: { A: 30, B: 60, C: 90, angles: { A: '30°', B: '60°' }, sides: { a: 'a', b: '6' }, known: 'b', target: 'a' },
    pair: ['b', 'B', 'a', 'A'],
    rows: [
      ['!{a|sin A} = {b|sin B}'],
      ['{a|sin 30°} = {[6]|sin 60°}', 'sub'],
      ['#両辺に sin 30° をかけて'],
      ['a = {6|sin 60°} × sin 30°', 'mul'],
      ['sin 30° = [1/2]', 'sin'],
      ['sin 60° = [√3/2]', 'sin'],
      ['#を代入すると'],
      ['a = 6 ÷ {√3|2} × {1|2}', 'put'],
      ['#÷ 分数 は、逆数をかける'],
      ['a = 6 × [2/√3] × {1|2}', 'inv'],
      ['a = {6|√3}', 'prod'],
      ['#分母にルートがあるので有理化すると、'],
      ['a = {6 × [√3]|√3 × [√3]}', 'rat'],
      ['a = {6√3|3}', 'rat2'],
      ['a = [2√3]', 'red']
    ],
    cards: ['√3', '2√3', ['3√2', '{6√3|3} は、6 ÷ 3 を計算します。√ の中の数は変わりません。'], null,
      '6', ['3', '辺 b の長さは 6 です。'], null, '1/2', '√3/2', '2/√3', ['1/√3', '{√3|2} の逆数は、分子と分母を入れかえた {2|√3} です。']],
    ans: 'a = 2√3'
  },
  { // 問2
    q: '△ABC において、A = 30°、C = 45°、c = 4 のとき、辺 a の長さを求めよ。',
    triangle: { A: 30, B: 105, C: 45, angles: { A: '30°', C: '45°' }, sides: { a: 'a', c: '4' }, known: 'c', target: 'a' },
    pair: ['c', 'C', 'a', 'A'],
    rows: [
      ['!{a|sin A} = {c|sin C}'],
      ['{a|[sin 30°]} = {[4]|[sin 45°]}', 'sub'],
      ['#両辺に sin 30° をかけて'],
      ['a = {4|sin 45°} × sin 30°', 'mul'],
      ['sin 30° = [1/2]', 'sin'],
      ['sin 45° = [1/√2]', 'sin'],
      ['#を代入すると'],
      ['a = 4 ÷ {1|√2} × {1|2}', 'put'],
      ['#÷ 分数 は、逆数をかける'],
      ['a = 4 × [√2] × {1|2}', 'inv'],
      ['a = [4√2/2]', 'prod'],
      ['a = [2√2]', 'red']
    ],
    cards: [['sin 105°', '辺 a と向かい合う角は A ＝ 30° です。'], 'sin 45°', 'sin 30°', null,
      '√2', '2√2', null, '4', null, '1/2', '1/√2', ['√2/2', 'sin 45° は {1|√2}。45° の直角三角形の辺の比 1 : 1 : √2 で考えよう。'], '4√2/2'],
    ans: 'a = 2√2'
  },
  { // 問3
    q: '△ABC において、A = 45°、B = 60°、b = 6 のとき、辺 a の長さを求めよ。',
    triangle: { A: 45, B: 60, C: 75, angles: { A: '45°', B: '60°' }, sides: { a: 'a', b: '6' }, known: 'b', target: 'a' },
    pair: ['b', 'B', 'a', 'A'],
    rows: [
      ['!{a|sin A} = {b|sin B}'],
      ['{a|[sin 45°]} = {[6]|sin 60°}', 'sub'],
      ['#両辺に sin 45° をかけて'],
      ['a = {6|sin 60°} × sin 45°', 'mul'],
      ['sin 45° = [1/√2]', 'sin'],
      ['sin 60° = [√3/2]', 'sin'],
      ['#を代入すると'],
      ['a = 6 ÷ {√3|2} × {1|√2}', 'put'],
      ['#÷ 分数 は、逆数をかける'],
      ['a = 6 × [2/√3] × [1/√2]', 'inv'],
      ['a = [12/√6]', 'prod'],
      ['#分母にルートがあるので有理化すると、'],
      ['a = {12 × √6|√6 × [√6]}', 'rat'],
      ['a = [12√6/6]', 'rat2'],
      ['a = [2√6]', 'red']
    ],
    cards: [['sin 75°', '辺 a と向かい合う角は A ＝ 45° です。'], 'sin 45°', null,
      '√6', '2√6', ['12√6', '分母の 6 で約分します。'], null, '6', null, '1/√2', '√3/2', '2/√3', '12/√6', '12√6/6'],
    ans: 'a = 2√6'
  },
  { // 問4
    q: '△ABC において、B = 60°、C = 45°、b = 12 のとき、辺 c の長さを求めよ。',
    triangle: { A: 75, B: 60, C: 45, angles: { B: '60°', C: '45°' }, sides: { b: '12', c: 'c' }, known: 'b', target: 'c' },
    pair: ['b', 'B', 'c', 'C'],
    rows: [
      ['!{c|sin C} = {b|sin B}'],
      ['{c|[sin 45°]} = {[12]|[sin 60°]}', 'sub'],

    ],

      '√6', '4√6', ['2√6', '{24√6|6} は、24 ÷ 6 を計算します。'], null, '12', null, '1/√2', '√3/2', '2/√3', '24/√6', '24√6/6'],

    pair: ['a', 'A', 'b', 'B'],

    ],
    cards: [['sin 75°', '辺 b と向かい合う角は B ＝ 45° です。'], 'sin 60°', 'sin 45°', null,
      '√6', null, '8', null, '1/√2', '√3/2', '2/√3', '16/√6', '16√6/6', '8√6/3', ['4√6/3', '{16√6|6} の分子と分母を 2 でわると？']],
    ans: 'b = {8√6|3}'
  },
  { // 問6：まず C を求める（ほぼすべて空欄）
    q: '△ABC において、A = 105°、B = 45°、b = 4 のとき、辺 c の長さを求めよ。（まず C を求めよう）',
    triangle: { A: 105, B: 45, C: 30, angles: { A: '105°', B: '45°', C: '?' }, sides: { b: '4', c: 'c' }, known: 'b', target: 'c' },
    pair: ['b', 'B', 'c', 'C'],
    rows: [
      ['C = 180° − [105°] − [45°]', 'csum'],
      ['C = [30°]', 'ccalc'],
      ['!{c|sin C} = {b|sin B}'],
      ['{c|[sin 30°]} = {[4]|[sin 45°]}', 'sub'],
      ['#両辺に sin 30° をかけて'],
      ['c = {[4]|[sin 45°]} × [sin 30°]', 'mul'],
      ['sin 30° = [1/2]', 'sin'],
      ['sin 45° = [1/√2]', 'sin'],
      ['#を代入すると'],
      ['c = [4] ÷ [1/√2] × [1/2]', 'put'],
      ['#÷ 分数 は、逆数をかける'],
      ['c = [4] × [√2] × [1/2]', 'inv'],
      ['c = [4√2/2]', 'prod'],
      ['c = [2√2]', 'red']
    ],
    cards: [['sin 105°', '辺 c と向かい合う角は C です。まず C を求めよう。'], 'sin 45°', 'sin 30°', null,
      '105°', '45°', '30°', ['60°', '180° − 105° − 45° をもう一度計算しよう。'], null,
      '√2', '2√2', null, '4', null, '1/2', '1/√2', '4√2/2'],
    ans: 'c = 2√2'
  },
  { // 問7：外接円の半径（= 2R の問題。問8 と同じ形）
    q: '△ABC において、a = 6、A = 30° のとき、外接円の半径 R を求めよ。',
    triangle: { A: 30, B: 65, C: 85, angles: { A: '30°' }, sides: { a: '6' }, known: 'a', circle: true },
    rows: [
      ['!{a|sin A} = 2R'],
      ['{[6]|[sin 30°]} = 2R', 'sub2'],
      ['sin 30° = [1/2]', 'sin'],

    ],

    ans: 'R = 6'
  },
  { // 問8：外接円の半径から辺
    q: '△ABC の外接円の半径が R = 3、A = 45° のとき、辺 a の長さを求めよ。',
    triangle: { A: 45, B: 75, C: 60, angles: { A: '45°' }, sides: { a: 'a' }, target: 'a', circle: true, circleVal: '3' },
    rows: [
      ['!{a|sin A} = 2R'],
      ['{a|[sin 45°]} = 2 × [3]', 'sub3'],
      ['{a|sin 45°} = [6]', 'mul2'],

// 行ごとのヒント（今うめている行のヒントが出る）
function hintText(p, kind, row) {
  const pr = p.pair, sd = (row.t.match(/sin (\d+)°/) || [])[1];
  return {
    sub: pr ? `わかっている「辺 ${pr[0]} と角 ${pr[1]}」が向かい合うペア。求める ${pr[2]} は、角 ${pr[3]} と向かい合います。` : '',
    mul: `両辺に sin ${sd}° をかけると、左は ${row.t[0]} だけになります。`,
    sin: `sin ${sd}° は、この直角三角形で考えよう。`,
    put: 'sin の値を代入します。',
    inv: '分数でわるときは、分子と分母を入れかえた数（逆数）をかけます。',
    prod: '分子どうし・分母どうしをかけて、1つの分数にまとめます（√2 × √3 = √6）。約分できるときは約分します。',
    rat: '分母の √ と同じものを、分母と分子にかけます。',
    rat2: '同じ √ どうしをかけると、√ がはずれます（√6 × √6 = 6）。',
    red: '約分します。√ の中の数は変わりません。',
    csum: '三角形の内角の和は 180° です。',
    ccalc: '180° − 105° − 45° を計算しよう。',
    sub2: '正弦定理の最後の「= 2R」を使います。わかっている辺 a と角 A を入れよう。',
    sub3: '正弦定理の最後の「= 2R」を使います。R に 3 を入れよう。',
    put2: 'sin 30° の値を代入します。',
    inv2: '分数でわるときは、分子と分母を入れかえた数（逆数）をかけます。',
    mul2: 'かけ算をします。',
    half: '2R が 12 なので、R はその半分です。'
  }[kind] || '';
}

problems.forEach(p => {
  p.fig = drawTriangle(p.triangle);
  p.rows = p.rows.map(([t, k]) => ({ t, k }));
});
FillSteps.mount({
  el: '#app', problems,
  top: () => '<div class="st-formula"><span>' + FillSteps.md('{a|sin A} = {b|sin B} = {c|sin C} = 2R') + '</span><small>R は外接円の半径</small></div>',
  hint: (p, row) => hintText(p, row.k, row),
  hintFig: (p, row) => row.k === 'sin' ? HintFig.trace(+row.t.match(/sin (\d+)°/)[1], 'sin') : ''
});
// 問題文を上にとめているので、今の空欄がその下に隠れたら見える位置へもどす（PR #5 で ChatGPT Work が入れた補助）
let follow; new MutationObserver(() => { clearTimeout(follow); follow = setTimeout(() => { const b = document.querySelector('.fs-blank.active'), q = document.querySelector('.fs-q'); if (b && q && getComputedStyle(q).position === 'sticky') { const r = b.getBoundingClientRect(), limit = q.getBoundingClientRect().bottom + 10; if (r.top < limit) window.scrollBy(0, r.top - limit); } }, 450); }).observe(document.querySelector('#app'), { childList: true, subtree: true });
</script>
