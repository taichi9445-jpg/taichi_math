<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <!--
    07. 展開の練習（数学バトルクエスト - 展開の冒険）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../assets/port.css">
  <script src="../assets/port.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学バトルクエスト</title>
  
  <style>
    body {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eee;
      overflow: auto;
    }

    .game-container {
      width: 100%;
      min-height: 100%;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1rem;
      color: #ffd700;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 2rem;
      color: #ffeb3b;
    }

    .mode-selection {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .mode-btn {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      border: 3px solid #ffd700;
      padding: 1.5rem;
      border-radius: 15px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .mode-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(255,215,0,0.5);
    }

    .mode-btn .mode-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .mode-btn .mode-desc {
      font-size: 1rem;
      opacity: 0.9;
    }

    .question-type-selection {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .type-btn {
      flex: 1;
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      border: 2px solid #74b9ff;
      padding: 1rem;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .type-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(116,185,255,0.5);
    }

    .battle-screen {
      width: 100%;
      max-width: 900px;
      display: none;
      flex-direction: column;
      gap: 2rem;
    }

    .battle-screen.active {
      display: flex;
    }

    .battle-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      border: 2px solid #ffd700;
    }

    .hero-status, .enemy-status {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .status-label {
      font-size: 1rem;
      color: #ffeb3b;
    }

    .status-value {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .battle-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem;
      background: rgba(0,0,0,0.3);
      border-radius: 15px;
      position: relative;
      min-height: 300px;
    }

    .character {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
    }

    .character-sprite {
      font-size: 8rem;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
      transition: all 0.3s;
    }

    .character.attack .character-sprite {
      animation: slash 0.5s ease-out;
    }

    .character.damaged .character-sprite {
      animation: shake 0.5s ease-out;
    }

    .character.defeated .character-sprite {
      animation: defeat 1s ease-out forwards;
    }

    @keyframes slash {
      0% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(30px) rotate(-15deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-5deg); }
      75% { transform: translateX(10px) rotate(5deg); }
    }

    @keyframes defeat {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.2) rotate(-10deg); opacity: 0.7; }
      100% { transform: scale(0) rotate(-45deg); opacity: 0; }
    }

    .slash-effect {
      position: absolute;
      font-size: 4rem;
      animation: slashMove 0.5s ease-out forwards;
      pointer-events: none;
    }

    @keyframes slashMove {
      0% { transform: translateX(-50px) scale(0) rotate(-45deg); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(50px) scale(1.5) rotate(-45deg); opacity: 0; }
    }

    .speech-bubble {
      position: absolute;
      top: -60px;
      background: white;
      color: #333;
      padding: 0.8rem 1.2rem;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: bubble 0.3s ease-out;
      white-space: nowrap;
    }

    @keyframes bubble {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .question-area {
      background: rgba(255,255,255,0.1);
      padding: 2rem;
      border-radius: 15px;
      border: 2px solid #74b9ff;
    }

    .question-text {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 2rem;
      color: #ffeb3b;
    }

    .question-text .math-expression {
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
      font-size: 2.8rem;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .choice-btn {
      background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
      border: 3px solid #2ecc71;
      padding: 1.5rem;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .choice-btn .math-expression {
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
      font-size: 2.2rem;
    }

    .choice-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(46,204,113,0.5);
    }

    .choice-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-mode {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-row span {
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
    }

    .input-field {
      width: 120px;
      padding: 0.7rem;
      font-size: 2.3rem;
      text-align: center;
      border: 3px solid #74b9ff;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      font-weight: bold;
      color: #333;
      font-family: 'Times New Roman', Times, serif;
      font-style: italic;
    }

    .submit-btn {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
      border: 3px solid #ffd700;
      padding: 1rem 3rem;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .submit-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(255,215,0,0.5);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .back-btn {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
      border: 2px solid #bdc3c7;
      padding: 0.8rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 1rem;
    }

    .back-btn:hover {
      transform: scale(1.05);
    }

    .victory-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 3rem;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      border: 3px solid #ffd700;
    }

    .victory-screen.active {
      display: flex;
    }

    .victory-title {
      font-size: 3rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      animation: victory 1s ease-out;
    }

    @keyframes victory {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .continue-btn {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      border: 3px solid #ffd700;
      padding: 1.5rem 3rem;
      border-radius: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .continue-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(255,215,0,0.5);
    }

    /* 【ブラッシュアップ】 */
    .port-back { max-width: 900px; width: 100%; padding-left: 0; padding-right: 0; }
    .victory-nav { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 380px; }
    .victory-nav .continue-btn { width: 100%; padding: 1rem 1.5rem; font-size: 1.25rem; }
    .victory-nav .continue-btn.sub { background: rgba(255,255,255,0.15); }
    .question-type-selection { flex-wrap: wrap; justify-content: center; max-width: 600px; }
    /* 【ブラッシュアップ】戦っている間は、タイトルを隠して問題を上に（Chromebook で問題が画面の外に出ていた） */
    .in-battle .title, .in-battle .subtitle { display: none; }
    @media (max-height: 820px) {
      .battle-screen { gap: 1rem; }
      .battle-info { padding: 0.5rem 1rem; }
      .battle-area { min-height: 130px; padding: 0.5rem 2rem; }
      .character-sprite { font-size: 4.5rem; }
      .question-area { padding: 1rem 1.2rem; }
      .question-text { margin-bottom: 0.8rem; }
      .game-container { padding-top: 1rem; }
      .choices { gap: 0.7rem; }
      .choice-btn { padding: 0.8rem; }
    }
    /* 【ブラッシュアップ】正解したら、入力欄を「ふつうの式」に整える：消す項は幅ごと縮めて詰める（元はピクセル固定の移動で、スマホでは項が重なった） */
    .input-row > * { max-width: 12rem; transition: max-width .5s, opacity .4s, margin .5s, padding .5s; }
    .input-row .fold { max-width: 0 !important; opacity: 0 !important; padding: 0 !important; margin: 0 !important; border-width: 0 !important; overflow: hidden; }
    .input-row.is-settled { gap: 0; }
    .input-row.is-settled .sign-before-x, .input-row.is-settled .sign-before-c { margin: 0 .3em; }
    .input-row span.settled { font-family: 'Times New Roman', Times, serif; animation: settleIn .4s ease-out; }
    @keyframes settleIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

    /* 【ブラッシュアップ】スマホ用の表示（画面の幅が 640px 以下のときだけ切り替わる） */
    @media (max-width: 640px) {
      .game-container { padding: 12px; }
      .title { font-size: min(2.5rem, 6.4vw); white-space: nowrap; letter-spacing: 0.02em; }
      .subtitle { font-size: 1rem; margin-bottom: 1.2rem; }
      .mode-selection { gap: 0.9rem; }
      .mode-btn { padding: 1rem; }
      .mode-btn .mode-title { font-size: 1.2rem; }
      .battle-screen { gap: 1rem; }
      .battle-info { padding: 0.6rem 0.8rem; }
      .battle-area { min-height: 120px; padding: 0.6rem 1.5rem; }
      .character-sprite { font-size: 4rem; }
      .question-area { padding: 1rem 0.8rem; }
      .question-text { font-size: 1.2rem; margin-bottom: 1rem; }
      .question-text .math-expression { font-size: min(2.2rem, 8.4vw); display: block; white-space: nowrap; }
      .choices { grid-template-columns: 1fr; gap: 0.7rem; }
      .choice-btn { padding: 0.8rem; }
      .choice-btn .math-expression { font-size: min(1.9rem, 7.6vw); }
      .input-row { font-size: 1.45rem; gap: 0.2rem; flex-wrap: nowrap; }
      .input-field, #inputX2 { width: 50px !important; font-size: 1.3rem; padding: 0.4rem 0.1rem; margin-top: 0; }
      .xp-steps { font-size: 1.25rem; }
      .victory-screen { padding: 1.5rem 1rem; gap: 1.2rem; }
      .victory-title { font-size: min(3rem, 9vw); white-space: nowrap; }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  
  <!-- 【ブラッシュアップ】元は Tailwind の開発用CDN（cdn.tailwindcss.com）をその場で動かしていた。
       本番用ではなく、重いうえに読み込めないと見た目が全部崩れるため、
       同じクラスから作った固定の CSS に置きかえた。見た目は同じ。 -->
  <link rel="stylesheet" href="../assets/gas.css">
   <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    body { color: var(--u-ink); }
    .title { letter-spacing: 0.04em; font-size: min(2.5rem, 5.6vw); white-space: nowrap; }
    .subtitle { color: var(--u-sub); font-weight: 700; }
    .mode-btn { text-align: left; }
    .mode-btn .mode-title { color: var(--u-title-dark); font-weight: 800; }
    .mode-btn .mode-desc { color: var(--u-sub); }
    .mode-btn[style] { background: #fff1f2 !important; border-color: #fecdd3 !important; }
    .mode-btn[style] .mode-title { color: #be123c; }
    .question-type-selection { gap: 1rem; }
    .battle-screen { padding: 1.5rem; max-width: 760px; }
    .battle-info { background: #f8fafc; border: 2px solid var(--u-line); border-radius: 20px; }
    .status-label { color: var(--u-sub); font-weight: 700; }
    .status-value { color: var(--u-ink); }
    .battle-area { border-radius: 24px; background: linear-gradient(135deg, #dbeafe 0%, #fef3c7 100%) !important; border: 3px solid var(--u-line); }
    .battle-area[style*="139"] { background: linear-gradient(135deg, #fee2e2 0%, #fde68a 100%) !important; }
    .question-area { background: var(--u-soft-yellow) !important; border: 4px dashed #fde68a !important; box-shadow: none !important; border-radius: 24px; }
    .question-text { color: var(--u-title-dark); }
    .input-row { color: var(--u-ink); }
    .input-row .input-field { color: var(--u-ink) !important; }
    .sign-before-x, .sign-before-c, .x-span, .x2-span, .y2-span { color: var(--u-ink) !important; }
    .victory-screen { padding: 2rem 1.5rem; }
    .victory-title { color: var(--u-accent-text) !important; text-shadow: none !important; }
    .victory-screen > div { color: var(--u-ink); }
    .victory-nav a { color: var(--u-sub); }
    .answer-hint { color: var(--u-title); }
    /* 【ブラッシュアップ】数式は教科書と同じ書き方：文字は斜体、数字は立体 */
    .math-expression, .input-row .input-field, .input-row span.settled { font-style: normal !important; }
    .math-expression i, .input-row i, .xp i { font-style: italic; }
    .choice-btn .math-expression { font-weight: 400; }
    /* 【ブラッシュアップ】ヒント・解説 */
    .xp { margin-top: 1rem; border-radius: 18px; padding: 10px 16px; font-size: 1.05rem; line-height: 1.7; text-align: left; font-weight: 700; }
    .xp:empty { display: none; }
    .xp-hint { background: var(--u-soft-blue); color: var(--u-title-dark); border: 2px solid var(--u-soft-blue-line); }
    .xp-full { background: #fff; color: var(--u-ink); border: 3px dashed var(--u-line); }
    .xp-steps { font-family: var(--u-math-font); font-size: 1.5rem; color: var(--u-math); margin-top: 4px; }
    .type-note { width: 100%; text-align: center; color: var(--u-sub); font-weight: 700; }
    .victory-miss { font-size: 1.2rem; font-weight: 700; color: var(--u-sub); }
  
  </style>
</head>
 <body class="u-theme">
  <div class="game-container">
   <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
   <h1 class="title" id="gameTitle">数学バトルクエスト - 展開の冒険</h1>
   <p class="subtitle">敵を倒して、展開の力をマスターせよ！</p>
   <div class="mode-selection" id="modeSelection"><button class="mode-btn" onclick="selectMode(1)">
     <div class="mode-title">

     </div>
     <div class="mode-desc">
      (x+a)² の形を展開しよう！
     </div></button> <button class="mode-btn" onclick="selectMode(3)">
     <div class="mode-title">
      ⚔️ モード③ 和と差の展開
     </div>
     <div class="mode-desc">
      (x+a)(x-a) の形を展開しよう！
     </div></button> <button class="mode-btn" onclick="selectMode(4)">
     <div class="mode-title">

     </div>
     <div class="mode-desc">
      ①～③がランダムで出題！
     </div></button> <button class="mode-btn" onclick="selectMode(5)" style="background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%); border-color: #ff4444;">
     <div class="mode-title">

   <div class="battle-screen" id="battleScreen">
    <div class="battle-info">

    </div>
    <div class="battle-area" id="battleArea">

    <div class="victory-miss" id="victoryMiss"></div>
    <!-- 【ブラッシュアップ】元は「メニューに戻る」だけだった。同じモード・次のモードも選べるようにした -->
    <div class="victory-nav">
     <button class="continue-btn" onclick="replayMode(lastMode)">同じモードでもう一度</button>
     <button class="continue-btn" id="nextModeBtn" onclick="replayMode(lastMode + 1)">次のモードへ ▶</button>
     <button class="continue-btn sub" onclick="backToMenu()">モードをえらび直す</button>
     <a href="../remake.html">ほかの教材をえらぶ</a>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: '数学バトルクエスト - 展開の冒険',
      hero_name: '勇者',
      victory_message: '🎉 見事討伐！ 🎉'
    };

    let config = { ...defaultConfig };

    const enemies = [
      { name: 'スライム', sprite: '👾', speech: 'プルプル...!' },
      { name: 'ゴブリン', sprite: '👹', speech: 'グルルル...!' },
      { name: 'オーク', sprite: '👺', speech: 'ブオォ...!' },
      { name: 'ドラゴン', sprite: '🐉', speech: 'ガオオォ...!' },
      { name: '魔王', sprite: '😈', speech: 'フハハハ...!' }
    ];

    let currentMode = 0;
    let currentType = '';
    let currentStage = 0;
    let currentQuestion = null;
    let isProcessingAnswer = false;
    let usedQuestions = [];
    // 【ブラッシュアップ】
    let session = 0;        // メニューに戻ったら、前の「あとで動く処理」を止めるための番号
    let lastMode = 1, lastType = 'choice';
    let missCount = 0;      // この問題でまちがえた回数（1 回目はヒント、2 回目は解説）
    let missTotal = 0;      // このモードでまちがえた回数（クリア画面に出す）
    let inputLocked = false; // 穴埋めで正解したあと、「答える！」の 2 度押しを受け付けない
    const MODE_NAMES = { 1: 'モード① 基本の展開', 2: 'モード② 2乗の展開', 3: 'モード③ 和と差の展開', 4: 'モード④ ランダムチャレンジ', 5: 'モード⑤ 最凶展開モード', 6: 'モード⑥ 2文字の展開' };

    // 【ブラッシュアップ】数式の表示：文字は斜体、数字は立体、マイナスは「−」。＋・− の前後は少しあける
    function fmtMath(s) {
      return String(s).replace(/([^(\s])([+-])/g, '$1 $2 ').replace(/-/g, '−').replace(/[a-z]/g, '<i>$&</i>');
    }
    // 【ブラッシュアップ】教科書では出さない形の問題をよける：同じ式どうしのかけ算（(2x+1)(2x+1) は (2x+1)² と書く）、
    //   (2x+4) のように、かっこの中に共通な因数がある式
    function isAwkward(q) {
      const m = q.match(/^\((\d*)x([+-]\d+)\)\((\d*)x([+-]\d+)\)$/);
      if (!m) return false;
      const g = (a, b) => b ? g(b, a % b) : a;
      if (m[1] + m[2] === m[3] + m[4]) return true;
      return (m[1] && g(+m[1], Math.abs(+m[2])) > 1) || (m[3] && g(+m[3], Math.abs(+m[4])) > 1);
    }
    // 【ブラッシュアップ】ヒント（使う公式）と解説（公式に数を入れた途中式）
    function explainHtml(full) {
      const q = currentQuestion.question;
      const m = q.match(/^\((\d*)x([+-]\d*)(y?)\)(?:\((\d*)x([+-]\d*)(y?)\))?(²?)$/);
      if (!m) return '';
      const num = s => s === '+' ? 1 : s === '-' ? -1 : Number(s);
      const a = m[1] ? +m[1] : 1, b = num(m[2]), u = m[3];
      const isSq = m[7] === '²', c = isSq ? a : (m[4] ? +m[4] : 1), d = isSq ? b : num(m[5]);
      const n = v => v < 0 ? '(' + v + ')' : String(v);
      const term = (k, v) => (k === 1 ? '' : k) + v;
      const sq = (k, v) => v ? (k === 1 ? v + '²' : '(' + k + v + ')²') : k + '²';
      const B = Math.abs(b), U2 = u ? u + '²' : '';
      let rule, step;
      if (isSq) {
        rule = b > 0 ? '(a + b)² = a² + 2ab + b²' : '(a - b)² = a² - 2ab + b²';
        step = sq(a, 'x') + (b > 0 ? ' + ' : ' - ') + '2 × ' + term(a, 'x') + ' × ' + (u ? term(B, u) : B) + ' + ' + sq(B, u);
      } else if (a === c && b === -d) {
        rule = '(a + b)(a - b) = a² - b²';
        step = sq(a, 'x') + ' - ' + sq(B, u);
      } else if (a === 1 && c === 1) {
        rule = '(x + a)(x + b) = x² + (a + b)x + ab';
        step = 'x² + (' + n(b) + ' + ' + n(d) + ')x' + u + ' + ' + n(b) + ' × ' + n(d) + U2;
      } else {
        rule = '(ax + b)(cx + d) = acx² + (ad + bc)x + bd';
        step = '(' + a + ' × ' + c + ')x² + (' + a + ' × ' + n(d) + ' + ' + n(b) + ' × ' + c + ')x' + u + ' + ' + n(b) + ' × ' + n(d) + U2;
      }
      if (!full) return '<b>💡 ヒント</b>　公式 ' + fmtMath(rule);
      const fin = formatAnswer(currentQuestion.answer);
      return '<b>解説</b>　公式 ' + fmtMath(rule) + '<div class="xp-steps">' + fmtMath(q) + '<br>= ' + fmtMath(step) +
        (step.replace(/ /g, '') === fin ? '' : '<br>= ' + fmtMath(fin)) + '</div>';
    }
    function showXp(html, kind) {
      const x = document.getElementById('xpArea');
      x.className = 'xp' + (kind ? ' xp-' + kind : '');
      x.innerHTML = html || '';
      if (html) requestAnimationFrame(() => x.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));   // 画面の外に出ないように
    }

    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('typeNote').textContent = (MODE_NAMES[mode] || '') + '：答え方をえらぼう';   // 【ブラッシュアップ】
      document.getElementById('modeSelection').style.display = 'none';
      document.getElementById('typeSelection').style.display = 'flex';

      const battleArea = document.getElementById('battleArea');
      const questionArea = document.querySelector('.question-area');

      if (mode === 5) {
        battleArea.style.background = 'linear-gradient(135deg, rgba(139,0,0,0.4) 0%, rgba(0,0,0,0.6) 100%)';
        questionArea.style.borderColor = '#ff4444';
        questionArea.style.boxShadow = '0 0 30px rgba(255,68,68,0.5)';
      } else {
        battleArea.style.background = 'rgba(0,0,0,0.3)';
        questionArea.style.borderColor = '#74b9ff';
        questionArea.style.boxShadow = 'none';
      }
    }

    function selectType(type) {
      session++;
      lastMode = currentMode; lastType = type;
      missTotal = 0;
      document.body.classList.add('in-battle');   // 【ブラッシュアップ】戦っている間はタイトルを隠す
      currentType = type;
      currentStage = 0;
      isProcessingAnswer = false;
      document.getElementById('typeSelection').style.display = 'none';
      document.getElementById('battleScreen').classList.add('active');
      nextStage();
    }

    function nextStage() {
      if (currentStage >= 5) {
        showVictory();
        return;
      }

      isProcessingAnswer = false;
      const enemy = enemies[currentStage];
      document.getElementById('stage').textContent = currentStage + 1;
      document.getElementById('enemyName').textContent = enemy.name;
      document.getElementById('enemySprite').textContent = enemy.sprite;

      const enemyChar = document.getElementById('enemyChar');
      enemyChar.className = 'character enemy';

      generateQuestion();
    }

    function generateQuestion() {
      missCount = 0;
      inputLocked = false;
      showXp('');
      const stage = currentStage;
      let question, answer, effectiveMode;
      let attempts = 0;
      const maxAttempts = 100;

      do {
        attempts++;

        if (currentMode === 4) {
          const rand = Math.random();
          if (rand < 0.33) {
            effectiveMode = 1;
          } else if (rand < 0.66) {
            effectiveMode = 2;
          } else {
            effectiveMode = 3;
          }
        } else {
          effectiveMode = currentMode;
        }

        let maxVal;
        if (stage === 0) {
          maxVal = 3;
        } else if (stage === 1) {
          maxVal = 5;
        } else if (stage === 2) {
          maxVal = 6;
        } else if (stage === 3) {
          maxVal = 7;
        } else {
          maxVal = 9;
        }

        if (effectiveMode === 1) {
          let a, b;
          do {
            a = Math.floor(Math.random() * maxVal) + 1;
            b = Math.floor(Math.random() * maxVal) + 1;
          } while (a === b);

          const signA = stage === 0 ? '+' : (Math.random() > 0.5 ? '+' : '-');
          const signB = stage === 0 ? '+' : (Math.random() > 0.5 ? '+' : '-');
          const valA = signA === '+' ? a : -a;
          const valB = signB === '+' ? b : -b;

          question = '(x' + signA + a + ')(x' + signB + b + ')';
          answer = { x2: 1, x: valA + valB, c: valA * valB };
        } else if (effectiveMode === 2) {
          const a = Math.floor(Math.random() * maxVal) + 1;
          const sign = stage === 0 ? '+' : (Math.random() > 0.5 ? '+' : '-');
          const val = sign === '+' ? a : -a;

          question = '(x' + sign + a + ')²';
          answer = { x2: 1, x: 2 * val, c: val * val };
        } else if (effectiveMode === 3) {
          const a = Math.floor(Math.random() * maxVal) + 1;
          const firstSign = Math.random() > 0.5 ? '+' : '-';
          const secondSign = firstSign === '+' ? '-' : '+';

          question = '(x' + firstSign + a + ')(x' + secondSign + a + ')';
          answer = { x2: 1, x: 0, c: -(a * a) };
        } else if (effectiveMode === 6) {
          // 【ブラッシュアップ】2文字の展開：(x+2y)(x-3y)、(x-3y)²、(2x+y)(2x-y)、(2x+y)(x-3y)
          const kinds = stage <= 1 ? [1, 2] : stage <= 3 ? [1, 2, 3] : [1, 2, 3, 4];
          const kind = kinds[Math.floor(Math.random() * kinds.length)];
          const mv = Math.min(maxVal, 6);
          const rn = () => { const v = Math.floor(Math.random() * mv) + 1; return (stage === 0 || Math.random() > 0.5) ? v : -v; };
          const yt = v => (v > 0 ? '+' : '-') + (Math.abs(v) === 1 ? '' : Math.abs(v)) + 'y';
          const g = (p, q) => q ? g(q, p % q) : p;
          if (kind === 1) {
            let a, b;
            do { a = rn(); b = rn(); } while (a === b || a + b === 0);
            question = '(x' + yt(a) + ')(x' + yt(b) + ')';
            answer = { x2: 1, x: a + b, c: a * b };
          } else if (kind === 2) {
            const a = rn();
            question = '(x' + yt(a) + ')²';
            answer = { x2: 1, x: 2 * a, c: a * a };
          } else if (kind === 3) {
            let p, a;
            do { p = Math.floor(Math.random() * 3) + 1; a = Math.floor(Math.random() * 4) + 1; } while (g(p, a) > 1 || (p === 1 && a === 1 && Math.random() < 0.5));
            const ps = p === 1 ? '' : p;
            question = '(' + ps + 'x' + yt(a) + ')(' + ps + 'x' + yt(-a) + ')';
            answer = { x2: p * p, x: 0, c: -a * a };
          } else {
            let p, q, a, b;
            do { p = Math.floor(Math.random() * 3) + 1; q = Math.floor(Math.random() * 3) + 1; a = rn(); b = rn(); }
            while (p === q || g(p, Math.abs(a)) > 1 || g(q, Math.abs(b)) > 1 || p * b + q * a === 0);
            question = '(' + (p === 1 ? '' : p) + 'x' + yt(a) + ')(' + (q === 1 ? '' : q) + 'x' + yt(b) + ')';
            answer = { x2: p * q, x: p * b + q * a, c: a * b };
          }
        } else if (effectiveMode === 5) {
          let coefA, coefB, a, b;

          if (stage === 0) {
            coefA = Math.random() > 0.5 ? 2 : 1;
            coefB = coefA === 1 ? 2 : (Math.random() > 0.5 ? 2 : 1);
            a = Math.floor(Math.random() * 3) + 1;
            b = Math.floor(Math.random() * 3) + 1;
          } else if (stage === 1) {
            const pool = [1, 2, 2, 3];
            coefA = pool[Math.floor(Math.random() * pool.length)];
            coefB = pool[Math.floor(Math.random() * pool.length)];
            if (coefA === 1 && coefB === 1) coefB = 2;
            a = Math.floor(Math.random() * 4) + 1;
            b = Math.floor(Math.random() * 4) + 1;
          } else if (stage === 2) {
            const pool = [1, 2, 2, 3, 3];
            coefA = pool[Math.floor(Math.random() * pool.length)];
            coefB = pool[Math.floor(Math.random() * pool.length)];
            if (coefA === 1 && coefB === 1) coefB = 2;
            a = Math.floor(Math.random() * 5) + 1;
            b = Math.floor(Math.random() * 5) + 1;
          } else if (stage === 3) {
            const pool = [1, 2, 2, 3, 3, 4];
            coefA = pool[Math.floor(Math.random() * pool.length)];
            coefB = pool[Math.floor(Math.random() * pool.length)];
            if (coefA === 1 && coefB === 1) coefB = 2;
            a = Math.floor(Math.random() * 6) + 1;
            b = Math.floor(Math.random() * 6) + 1;
          } else {
            const pool = [1, 2, 2, 3, 3, 4, 4, 5];
            coefA = pool[Math.floor(Math.random() * pool.length)];
            coefB = pool[Math.floor(Math.random() * pool.length)];
            if (coefA === 1 && coefB === 1) coefB = 2;
            a = Math.floor(Math.random() * 7) + 1;
            b = Math.floor(Math.random() * 7) + 1;
          }

          const signA = stage === 0 ? '+' : (Math.random() > 0.5 ? '+' : '-');
          const signB = stage === 0 ? '+' : (Math.random() > 0.5 ? '+' : '-');
          const valA = signA === '+' ? a : -a;
          const valB = signB === '+' ? b : -b;

          const coefAStr = coefA === 1 ? '' : coefA;
          const coefBStr = coefB === 1 ? '' : coefB;

          question = '(' + coefAStr + 'x' + signA + a + ')(' + coefBStr + 'x' + signB + b + ')';
          answer = {
            x2: coefA * coefB,
            x: coefA * valB + coefB * valA,
            c: valA * valB
          };
        }
      } while ((usedQuestions.includes(question) || isAwkward(question)) && attempts < maxAttempts);   // 【ブラッシュアップ】教科書で出さない形もよける

      usedQuestions.push(question);

      currentQuestion = { question: question, answer: answer, effectiveMode: effectiveMode, twoVar: /y/.test(question) };

      let displayHTML;
      if (currentMode === 5) {
        displayHTML = '💀 <span class="math-expression">' + fmtMath(question) + '</span> を展開せよ！ 💀';
      } else {
        displayHTML = '<span class="math-expression">' + fmtMath(question) + '</span> を展開せよ！';
      }

      document.getElementById('questionText').innerHTML = displayHTML;

      if (currentType === 'choice') {
        showChoices(answer);
      } else {
        showInput(answer);
      }
    }

    function showChoices(answer) {
      document.getElementById('choicesArea').style.display = 'grid';
      document.getElementById('inputArea').style.display = 'none';

      const choices = generateChoices(answer);
      const choicesArea = document.getElementById('choicesArea');
      choicesArea.innerHTML = '';

      choices.forEach((choice) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = '<span class="math-expression">' + fmtMath(choice.text) + '</span>';
        btn.onclick = () => {
          if (!isProcessingAnswer) {
            checkAnswer(choice.isCorrect, btn);
          }
        };
        choicesArea.appendChild(btn);
      });
    }

    function generateChoices(answer) {
      const correct = formatAnswer(answer);
      const choices = [{ text: correct, isCorrect: true }];

      // 【ブラッシュアップ】元はまちがいの選択肢を、x の係数と定数を「でたらめにずらす」だけで作っていた。
      //   よくあるまちがい（定数や真ん中の符号・2 倍の忘れ・係数と定数の取りちがえ など）を先に入れる。
      const A = answer, traps = [];
      const q = (currentQuestion && currentQuestion.question) || '';
      const m = q.match(/\((\d*)x([+-]\d*)y?\)\((\d*)x([+-]\d*)y?\)/);
      traps.push({ x2: A.x2, x: A.x, c: -A.c });
      if (A.x !== 0) traps.push({ x2: A.x2, x: -A.x, c: A.c });
      if (A.x !== 0 && A.x !== A.c) traps.push({ x2: A.x2, x: A.c, c: A.x });
      if (/²$/.test(q)) {
        traps.push({ x2: A.x2, x: A.x / 2, c: A.c });   // 真ん中の 2 倍を忘れた
        traps.push({ x2: A.x2, x: 0, c: A.c });         // 真ん中の項を忘れた
      }
      if (A.x === 0 && A.c < 0) {                       // 和と差
        const a = Math.round(Math.sqrt(-A.c));
        traps.push({ x2: A.x2, x: 0, c: -A.c });        // x² + a² としてしまう
        traps.push({ x2: A.x2, x: 2 * a, c: A.c });
        traps.push({ x2: A.x2, x: -2 * a, c: A.c });
      }
      if (m) {
        const num = s => s === '+' ? 1 : s === '-' ? -1 : +s;
        const cA = m[1] === '' ? 1 : +m[1], vA = num(m[2]), cB = m[3] === '' ? 1 : +m[3], vB = num(m[4]);
        if (cA !== 1 || cB !== 1) {
          traps.push({ x2: A.x2, x: vA + vB, c: A.c });          // 係数をかけ忘れた
          traps.push({ x2: cA + cB, x: A.x, c: A.c });
        }
      }
      shuffleList(traps).forEach(t => {
        const text = formatAnswer(t);
        if (choices.length < 4 && !choices.find(c => c.text === text)) choices.push({ text: text, isCorrect: false });
      });

      while (choices.length < 4) {
        const wrongAnswer = {
          x2: answer.x2,
          x: answer.x + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 3) + 1),
          c: answer.c + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1)
        };
        const wrongText = formatAnswer(wrongAnswer);
        if (!choices.find(c => c.text === wrongText)) {
          choices.push({ text: wrongText, isCorrect: false });
        }
      }

      return shuffleList(choices);
    }

    function shuffleList(a) {
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function formatAnswer(answer) {
      // 【ブラッシュアップ】2 文字（モード⑥）のときは、x の項を xy、定数の項を y² にする
      const two = currentQuestion && currentQuestion.twoVar;
      const X = two ? 'xy' : 'x';
      let result = '';

      if (answer.x2 !== 0) {
        result += answer.x2 === 1 ? 'x²' : answer.x2 + 'x²';
      }

      if (answer.x !== 0) {
        if (result && answer.x > 0) result += '+';
        result += answer.x === 1 ? X : answer.x === -1 ? '-' + X : answer.x + X;
      }

      if (answer.c !== 0) {
        if (result && answer.c > 0) result += '+';
        result += two ? (answer.c === 1 ? 'y²' : answer.c === -1 ? '-y²' : answer.c + 'y²') : answer.c;
      }

      return result || '0';
    }

    function showInput(answer) {
      document.getElementById('choicesArea').style.display = 'none';
      document.getElementById('inputArea').style.display = 'flex';

      const inputArea = document.getElementById('inputArea');
      const two = currentQuestion && currentQuestion.twoVar;

      let inputHTML = '<div class="input-row">';

      if (answer.x2 !== 1) {
        inputHTML += '<input type="number" class="input-field" id="inputX2" placeholder="?" style="width: 110px;">';
        inputHTML += '<span class="x2-span" style="margin-right: 0.3rem;"><i>x</i>²</span>';
      } else {
        inputHTML += '<span class="x2-span" style="margin-right: 0.3rem;"><i>x</i>²</span>';
      }

      inputHTML += '<span class="sign-before-x">+</span>';
      inputHTML += '<input type="number" class="input-field input-x-coef" id="inputXCoef" placeholder="?">';
      inputHTML += '<span class="x-span">' + (two ? '<i>xy</i>' : '<i>x</i>') + '</span>';
      inputHTML += '<span class="sign-before-c">+</span>';
      inputHTML += '<input type="number" class="input-field" id="inputC" placeholder="?">';
      if (two) inputHTML += '<span class="y2-span"><i>y</i>²</span>';
      inputHTML += '</div>';
      inputHTML += '<button class="submit-btn" onclick="checkInputAnswer()">答える！</button>';

      inputArea.innerHTML = inputHTML;

      const fields = [...inputArea.querySelectorAll('.input-field')];
      fields.forEach((f, i) => {
        f.setAttribute('enterkeyhint', i === fields.length - 1 ? 'done' : 'next');
        f.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          if (i < fields.length - 1) fields[i + 1].focus(); else checkInputAnswer();
        });
      });
      if (window.matchMedia && matchMedia('(pointer: fine)').matches && fields[0]) fields[0].focus({ preventScroll: true });
    }

    function checkInputAnswer() {
      if (isProcessingAnswer || inputLocked) return;

      const inputX2Element = document.getElementById('inputX2');
      const inputXCoefElement = document.getElementById('inputXCoef');
      const inputCElement = document.getElementById('inputC');
      const answer = currentQuestion.answer;
      const read = el => el.value.trim() === '' ? NaN : Number(el.value);

      const inputX2 = inputX2Element ? read(inputX2Element) : 1;
      const inputXCoef = inputXCoefElement.value.trim() === '' ? 0 : Number(inputXCoefElement.value);   // x の係数の空らんは 0（和と差の公式）
      const inputC = read(inputCElement);

      if (isNaN(inputX2) || isNaN(inputC) || isNaN(inputXCoef)) {
        showXp('空らんに数を入れてから「答える！」を押そう', 'hint');
        const empty = [inputX2Element, inputCElement].find(el => el && el.value.trim() === '');
        if (empty) empty.focus();
        return;
      }

      const isCorrect = inputX2 === answer.x2 && inputXCoef === answer.x && inputC === answer.c;
      const submitBtn = document.querySelector('.submit-btn');

      if (isCorrect) {
        inputLocked = true;
        settleAnimation(inputX2, inputXCoef, inputC);
        setTimeout(() => checkAnswer(true, submitBtn), 800);
      } else {
        checkAnswer(false, submitBtn);
      }
    }

    // 【ブラッシュアップ】正解したら、入力欄を「ふつうの式」に整える（先生の「+ (−6)x を −6x に整える」しかけ）。
    //   元は 5 つの関数でピクセル固定の移動をしていたため、スマホでは項が重なり、
    //   共通デザインの入力欄（!important の白い背景と枠）も消えなかった。
    //   入力欄は数の文字に置きかえ、消す項（0x・係数の 1・＋のあとの −）は幅ごと縮めて詰める。
    function settleAnimation(x2, xc, c) {
      const row = document.querySelector('.input-row');
      if (!row) return;
      const two = currentQuestion.twoVar;
      const fold = el => { if (el) el.classList.add('fold'); };
      const toText = (el, v) => {
        if (!el) return;
        const s = document.createElement('span');
        s.className = 'settled';
        s.textContent = String(v);
        el.replaceWith(s);
      };
      toText(document.getElementById('inputX2'), x2);
      const signX = row.querySelector('.sign-before-x'), inX = document.getElementById('inputXCoef'), spanX = row.querySelector('.x-span');
      if (xc === 0) { fold(signX); fold(inX); fold(spanX); }
      else {
        signX.textContent = xc < 0 ? '−' : '+';
        if (Math.abs(xc) === 1) fold(inX); else toText(inX, Math.abs(xc));
      }
      const signC = row.querySelector('.sign-before-c'), inC = document.getElementById('inputC');
      signC.textContent = c < 0 ? '−' : '+';
      if (two && Math.abs(c) === 1) fold(inC); else toText(inC, Math.abs(c));
      row.classList.add('is-settled');
    }

    function checkAnswer(isCorrect, btn) {
      if (isProcessingAnswer) return;
      if (!document.getElementById('battleScreen').classList.contains('active')) return;   // 【ブラッシュアップ】
      const sid = session;
      isProcessingAnswer = true;

      // 【ブラッシュアップ】まちがえたときは入力欄を止めない（スマホのキーボードが閉じないように）
      const buttons = document.querySelectorAll(isCorrect ? '.choice-btn, .submit-btn, .input-field' : '.choice-btn, .submit-btn');
      buttons.forEach(b => b.disabled = true);

      const hero = document.querySelector('.hero');
      const enemyChar = document.getElementById('enemyChar');
      const battleArea = document.getElementById('battleArea');

      if (isCorrect) {
        if (btn && btn.classList.contains('choice-btn')) btn.classList.add('is-correct');   // 【ブラッシュアップ】正解の選択肢に色
        hero.classList.add('attack');

        setTimeout(() => {
          const slash = document.createElement('div');
          slash.className = 'slash-effect';
          slash.textContent = '⚔️';
          slash.style.left = '50%';
          slash.style.top = '50%';
          battleArea.appendChild(slash);

          setTimeout(() => slash.remove(), 500);
        }, 250);

        setTimeout(() => {
          hero.classList.remove('attack');
          enemyChar.classList.add('defeated');

          setTimeout(() => {
            if (sid !== session) return;   // 【ブラッシュアップ】途中でメニューに戻っていたら何もしない
            currentStage++;
            nextStage();
          }, 1000);
        }, 500);
      } else {
        // 【ブラッシュアップ】まちがえたら、1 回目はヒント（公式）、2 回目は解説（途中式）。まちがえた選択肢は押せないまま
        missCount++; missTotal++;
        if (btn && btn.classList.contains('choice-btn')) btn.classList.add('is-wrong');
        showXp(explainHtml(missCount >= 2), missCount >= 2 ? 'full' : 'hint');

        enemyChar.classList.add('damaged');

        const bubble = document.createElement('div');
        bubble.className = 'speech-bubble';
        bubble.textContent = enemies[currentStage].speech;
        enemyChar.appendChild(bubble);

        setTimeout(() => {
          enemyChar.classList.remove('damaged');
          bubble.remove();
          buttons.forEach(b => {
            if (!b.classList.contains('is-wrong')) b.disabled = false;
          });
          isProcessingAnswer = false;
        }, 900);   // 【ブラッシュアップ】元は 1.5 秒待たされた
      }
    }

    function showVictory() {
      document.getElementById('battleScreen').classList.remove('active');
      document.getElementById('victoryScreen').classList.add('active');
      document.getElementById('victoryMessage').textContent = config.victory_message || defaultConfig.victory_message;
      document.getElementById('nextModeBtn').style.display = lastMode < 6 ? '' : 'none';
      document.body.classList.remove('in-battle');
      document.getElementById('victoryMiss').textContent = missTotal === 0 ? 'ノーミス！すばらしい！' : 'まちがい ' + missTotal + ' 回';
    }

    // 【ブラッシュアップ】同じ答え方（4択・穴埋め）のまま、モードを選んで始める
    function replayMode(mode) {
      const type = lastType;
      backToMenu();
      selectMode(mode);
      selectType(type);
      window.scrollTo(0, 0);
    }

    function backToMenu() {
      session++;
      document.body.classList.remove('in-battle');
      document.getElementById('battleScreen').classList.remove('active');
      document.getElementById('victoryScreen').classList.remove('active');
      document.getElementById('modeSelection').style.display = 'flex';
      document.getElementById('typeSelection').style.display = 'none';
      currentMode = 0;
      currentType = '';
      currentStage = 0;
      isProcessingAnswer = false;
      usedQuestions = [];
    }

    async function onConfigChange(newConfig) {
      config = { ...newConfig };
      document.getElementById('gameTitle').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('heroLabel').textContent = config.hero_name || defaultConfig.hero_name;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig: defaultConfig,
        onConfigChange: onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['game_title', config.game_title || defaultConfig.game_title],
          ['hero_name', config.hero_name || defaultConfig.hero_name],
          ['victory_message', config.victory_message || defaultConfig.victory_message]
        ])
      });
    }
  </script>
 <script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".title": "u-title",
    ".mode-btn": "u-choice",
    ".type-btn:not(.back)": "u-btn u-btn-blue",
    ".type-btn.back": "u-btn u-btn-plain",
    ".battle-screen": "u-card",
    ".choice-btn": "u-choice",
    ".choice-btn.is-correct": "u-ok",
    ".choice-btn.is-wrong": "u-ng",
    ".input-field": "u-input",
    ".submit-btn": "u-btn",
    ".back-btn": "u-btn u-btn-plain",
    ".victory-screen": "u-card",
    ".continue-btn:not(.sub)": "u-btn",
    ".continue-btn.sub": "u-btn u-btn-plain"
  });
</script>
