<body class="u-theme bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container mx-auto px-4 py-8">
        <!-- ヘッダー -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-800 mb-2">二次不等式グラフクイズ</h1>
            <p class="text-lg text-gray-600">グラフとx軸の位置関係を考えよう！</p>
        </div>

        <!-- レベル選択 -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">レベル選択</h2>
            <div class="flex flex-wrap gap-4">
                <button onclick="setLevel(0)" id="level0" class="px-6 py-3 bg-yellow-500 text-white rounded-lg font-medium hover:bg-yellow-600 transition-colors">
                    レベル0 (因数分解の練習)
                </button>
                <button onclick="setLevel(1)" id="level1" class="px-6 py-3 bg-green-500 text-white rounded-lg font-medium hover:bg-green-600 transition-colors">
                    レベル1 (グラフ問題)
                </button>
                <button onclick="setLevel(2)" id="level2" class="px-6 py-3 bg-purple-500 text-white rounded-lg font-medium hover:bg-purple-600 transition-colors">
                    レベル2 (二次不等式を解く)
                </button>
            </div>
        </div>

        <!-- 問題表示エリア -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-gray-800">問題 <span id="questionNumber">1</span></h3>
                <div class="text-sm text-gray-600">
                    レベル <span id="currentLevel">0</span> | 正解数: <span id="score">0</span>/<span id="totalQuestions">0</span>
                </div>
            </div>

            <!-- 問題文と不等式表示 -->
            <div class="text-center mb-6">
                <p id="questionText" class="text-lg text-gray-700 mb-3">次の二次不等式が表す図として、正しいものを選びなさい。</p>
                <div class="text-2xl font-bold text-indigo-800 bg-indigo-50 p-4 rounded-lg inline-block">
                    <span id="inequality">x² - 4x + 3 > 0</span>
                </div>
                <div id="intersectionInfo" class="text-sm text-gray-600 mt-2"></div>
            </div>



            <!-- ヒントボタン（レベル0と2で表示） -->
            <div id="hintSection" class="hidden mb-4 text-center">
                <button onclick="showHint(1)" id="hint1Btn" class="px-4 py-2 bg-yellow-500 text-white rounded-lg font-medium hover:bg-yellow-600 transition-colors mr-2">
                    ヒント1 💡
                </button>
                <button onclick="showHint(2)" id="hint2Btn" class="px-4 py-2 bg-orange-500 text-white rounded-lg font-medium hover:bg-orange-600 transition-colors mr-2">
                    ヒント2 📊
                </button>
                <button onclick="showHint(3)" id="hint3Btn" class="px-4 py-2 bg-red-500 text-white rounded-lg font-medium hover:bg-red-600 transition-colors">
                    ヒント3 🎯
                </button>
            </div>

            <!-- ヒント表示（レベル0用：選択肢の上に表示） -->
            <div id="hintDisplay" class="hidden mb-4 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                <h4 class="text-lg font-semibold text-yellow-800 mb-2" id="hintTitle">💡 ヒント</h4>
                <div id="hintContent" class="text-yellow-700"></div>
                <div id="hintGraph" class="flex justify-center mt-4">
                    <canvas id="hintCanvas" width="300" height="200" class="border border-yellow-200 rounded bg-white"></canvas>
                </div>
                <div id="hintNavigation" class="hidden mt-4 text-center space-x-2">
                    <button onclick="showHint(1)" id="backToHint1" class="px-3 py-1 bg-yellow-400 text-yellow-800 rounded font-medium hover:bg-yellow-500 transition-colors">
                        ← ヒント1に戻る
                    </button>
                </div>
            </div>

            <!-- 選択肢 -->
            <div id="optionsGrid" class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="selectAnswer(0)" id="option0" class="p-3 border-2 border-gray-200 rounded-lg hover:border-indigo-400 transition-all">
                    <canvas id="optionCanvas0" width="240" height="160" class="border border-gray-100 rounded bg-white mx-auto" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"></canvas>
                </button>
                <button onclick="selectAnswer(1)" id="option1" class="p-3 border-2 border-gray-200 rounded-lg hover:border-indigo-400 transition-all">
                    <canvas id="optionCanvas1" width="240" height="160" class="border border-gray-100 rounded bg-white mx-auto" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"></canvas>
                </button>
                <button onclick="selectAnswer(2)" id="option2" class="p-3 border-2 border-gray-200 rounded-lg hover:border-indigo-400 transition-all">
                    <canvas id="optionCanvas2" width="240" height="160" class="border border-gray-100 rounded bg-white mx-auto" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"></canvas>
                </button>
                <button onclick="selectAnswer(3)" id="option3" class="p-3 border-2 border-gray-200 rounded-lg hover:border-indigo-400 transition-all">
                    <canvas id="optionCanvas3" width="240" height="160" class="border border-gray-100 rounded bg-white mx-auto" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;"></canvas>
                </button>
            </div>



            <!-- 結果表示 -->
            <div id="result" class="hidden mb-4 p-4 rounded-lg"></div>

            <!-- 正解時の解説 -->
            <div id="explanation" class="hidden mb-4 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <h4 class="text-lg font-semibold text-blue-800 mb-3">📚 解説</h4>
                <div id="explanationContent" class="text-blue-700 mb-4"></div>
                <div class="flex justify-center">
                    <canvas id="explanationCanvas" width="300" height="200" class="border border-blue-200 rounded bg-white"></canvas>
                </div>
            </div>

            <!-- ボタンエリア -->
            <div class="text-center space-x-4">
                <button onclick="retryQuestion()" id="retryBtn" class="hidden px-6 py-3 bg-orange-500 text-white rounded-lg font-medium hover:bg-orange-600 transition-colors">
                    もう一度挑戦
                </button>
                <button onclick="nextQuestion()" id="nextBtn" class="hidden px-8 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors">
                    次の問題
                </button>
                <button onclick="shuffleLevel1()" id="shuffleBtn" class="hidden px-6 py-3 bg-purple-500 text-white rounded-lg font-medium hover:bg-purple-600 transition-colors">
                    🔀 問題をランダムに
                </button>
            </div>
        </div>

        <!-- 説明（レベル1と2のみ表示） -->
        <div id="explanationSection" class="bg-white rounded-xl shadow-lg p-6">
            <h3 class="text-xl font-semibold text-gray-800 mb-3">解き方のポイント</h3>
            <ul class="space-y-2 text-gray-700">
                <li>• <strong>f(x) > 0</strong>: グラフがx軸より上にある部分</li>
                <li>• <strong>f(x) < 0</strong>: グラフがx軸より下にある部分</li>
                <li>• <strong>f(x) ≥ 0</strong>: グラフがx軸より上 + x軸上の点</li>
                <li>• <strong>f(x) ≤ 0</strong>: グラフがx軸より下 + x軸上の点</li>
            </ul>
        </div>
    </div>

    <script>
        let currentLevel = 0;
        let questionCount = 0;
        let score = 0;
        let currentQuestion = null;
        let answered = false;
        let shuffledProblems = {};
        let missedThis = false;   // 【ブラッシュアップ】この問題でまちがえたか（一発正解だけを点にする）

        // 配列をシャッフルする関数
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 問題データ
        const problems = {
            0: [ // レベル0: 因数分解の練習（12問）
                {expression: "x² + 5x + 6", answer: "(x + 2)(x + 3)", hint1: "かけて6、たして5になる2つの数を探そう", hint2: "かけて6、たして5になるのは2と3だね！"},
                {expression: "x² + 7x + 12", answer: "(x + 3)(x + 4)", hint1: "かけて12、たして7になる2つの数を探そう", hint2: "かけて12、たして7になるのは3と4だね！"},
                {expression: "x² - 5x + 6", answer: "(x - 2)(x - 3)", hint1: "かけて6、たして-5になる2つの数を探そう", hint2: "かけて6、たして-5になるのは-2と-3だね！"},
                {expression: "x² - 7x + 12", answer: "(x - 3)(x - 4)", hint1: "かけて12、たして-7になる2つの数を探そう", hint2: "かけて12、たして-7になるのは-3と-4だね！"},
                {expression: "x² + x - 6", answer: "(x + 3)(x - 2)", hint1: "かけて-6、たして1になる2つの数を探そう", hint2: "かけて-6、たして1になるのは3と-2だね！"},
                {expression: "x² - x - 6", answer: "(x - 3)(x + 2)", hint1: "かけて-6、たして-1になる2つの数を探そう", hint2: "かけて-6、たして-1になるのは-3と2だね！"},
                {expression: "x² + 3x - 10", answer: "(x + 5)(x - 2)", hint1: "かけて-10、たして3になる2つの数を探そう", hint2: "かけて-10、たして3になるのは5と-2だね！"},
                {expression: "x² - 3x - 10", answer: "(x - 5)(x + 2)", hint1: "かけて-10、たして-3になる2つの数を探そう", hint2: "かけて-10、たして-3になるのは-5と2だね！"},
                {expression: "x² + 8x + 15", answer: "(x + 3)(x + 5)", hint1: "かけて15、たして8になる2つの数を探そう", hint2: "かけて15、たして8になるのは3と5だね！"},
                {expression: "x² - 8x + 15", answer: "(x - 3)(x - 5)", hint1: "かけて15、たして-8になる2つの数を探そう", hint2: "かけて15、たして-8になるのは-3と-5だね！"},
                {expression: "x² + 2x - 8", answer: "(x + 4)(x - 2)", hint1: "かけて-8、たして2になる2つの数を探そう", hint2: "かけて-8、たして2になるのは4と-2だね！"},
                {expression: "x² - 2x - 8", answer: "(x - 4)(x + 2)", hint1: "かけて-8、たして-2になる2つの数を探そう", hint2: "かけて-8、たして-2になるのは-4と2だね！"}
            ],
            1: [ // レベル1: グラフ問題（16問）- ≤と≥を含む問題を追加
                {a: 1, b: -4, c: 3, inequality: '=', answer: 3}, // (x-1)(x-3) = 0 → x=1,3
                {a: 1, b: -4, c: 3, inequality: '>', answer: 0}, // (x-1)(x-3) > 0 → x<1, x>3
                {a: 1, b: -4, c: 3, inequality: '<', answer: 1}, // (x-1)(x-3) < 0 → 1<x<3
                {a: 1, b: -4, c: 3, inequality: '≥', answer: 2}, // (x-1)(x-3) ≥ 0 → x≤1, x≥3
                {a: 1, b: -4, c: 3, inequality: '≤', answer: 3}, // (x-1)(x-3) ≤ 0 → 1≤x≤3
                {a: 1, b: 0, c: -4, inequality: '=', answer: 3}, // x² - 4 = 0 → x=±2
                {a: 1, b: 0, c: -4, inequality: '>', answer: 0}, // x² - 4 > 0 → x<-2, x>2
                {a: 1, b: 0, c: -4, inequality: '<', answer: 1}, // x² - 4 < 0 → -2<x<2
                {a: 1, b: 0, c: -4, inequality: '≥', answer: 2}, // x² - 4 ≥ 0 → x≤-2, x≥2
                {a: 1, b: 0, c: -4, inequality: '≤', answer: 3}, // x² - 4 ≤ 0 → -2≤x≤2
                {a: 1, b: -2, c: -3, inequality: '>', answer: 0}, // (x+1)(x-3) > 0 → x<-1, x>3
                {a: 1, b: -2, c: -3, inequality: '<', answer: 1}, // (x+1)(x-3) < 0 → -1<x<3
                {a: 1, b: -5, c: 6, inequality: '≥', answer: 2}, // (x-2)(x-3) ≥ 0 → x≤2, x≥3
                {a: 1, b: -5, c: 6, inequality: '≤', answer: 3}, // (x-2)(x-3) ≤ 0 → 2≤x≤3
                {a: 1, b: 1, c: -6, inequality: '>', answer: 0}, // (x+3)(x-2) > 0 → x<-3, x>2
                {a: 1, b: 1, c: -6, inequality: '≤', answer: 3}, // (x+3)(x-2) ≤ 0 → -3≤x≤2
            ],
            2: [ // レベル2: 二次不等式を解く問題（16問）
                {inequality: "x² - 5x + 6 > 0", factored: "(x-2)(x-3)", roots: [2, 3], answer: "x < 2 または x > 3", hint1: "因数分解すると (x-2)(x-3) > 0", hint2: "因数分解すると (x-2)(x-3) > 0\nx軸との交点は x = 2, 3", hint3: "グラフがx軸より上の部分が解"},
                {inequality: "x² - 5x + 6 ≥ 0", factored: "(x-2)(x-3)", roots: [2, 3], answer: "x ≤ 2 または x ≥ 3", hint1: "因数分解すると (x-2)(x-3) ≥ 0", hint2: "因数分解すると (x-2)(x-3) ≥ 0\nx軸との交点は x = 2, 3", hint3: "グラフがx軸より上の部分と交点が解"},
                {inequality: "x² - 4 < 0", factored: "(x-2)(x+2)", roots: [-2, 2], answer: "-2 < x < 2", hint1: "因数分解すると (x+2)(x-2) < 0", hint2: "因数分解すると (x+2)(x-2) < 0\nx軸との交点は x = -2, 2", hint3: "グラフがx軸より下の部分が解"},
                {inequality: "x² - 4 ≤ 0", factored: "(x-2)(x+2)", roots: [-2, 2], answer: "-2 ≤ x ≤ 2", hint1: "因数分解すると (x+2)(x-2) ≤ 0", hint2: "因数分解すると (x+2)(x-2) ≤ 0\nx軸との交点は x = -2, 2", hint3: "グラフがx軸より下の部分と交点が解"},
                {inequality: "x² + x - 6 > 0", factored: "(x+3)(x-2)", roots: [-3, 2], answer: "x < -3 または x > 2", hint1: "因数分解すると (x+3)(x-2) > 0", hint2: "因数分解すると (x+3)(x-2) > 0\nx軸との交点は x = -3, 2", hint3: "グラフがx軸より上の部分が解"},
                {inequality: "x² + x - 6 ≥ 0", factored: "(x+3)(x-2)", roots: [-3, 2], answer: "x ≤ -3 または x ≥ 2", hint1: "因数分解すると (x+3)(x-2) ≥ 0", hint2: "因数分解すると (x+3)(x-2) ≥ 0\nx軸との交点は x = -3, 2", hint3: "グラフがx軸より上の部分と交点が解"},
                {inequality: "x² + x - 6 < 0", factored: "(x+3)(x-2)", roots: [-3, 2], answer: "-3 < x < 2", hint1: "因数分解すると (x+3)(x-2) < 0", hint2: "因数分解すると (x+3)(x-2) < 0\nx軸との交点は x = -3, 2", hint3: "グラフがx軸より下の部分が解"},
                {inequality: "x² + x - 6 ≤ 0", factored: "(x+3)(x-2)", roots: [-3, 2], answer: "-3 ≤ x ≤ 2", hint1: "因数分解すると (x+3)(x-2) ≤ 0", hint2: "因数分解すると (x+3)(x-2) ≤ 0\nx軸との交点は x = -3, 2", hint3: "グラフがx軸より下の部分と交点が解"},
                {inequality: "x² - 9 > 0", factored: "(x-3)(x+3)", roots: [-3, 3], answer: "x < -3 または x > 3", hint1: "因数分解すると (x+3)(x-3) > 0", hint2: "因数分解すると (x+3)(x-3) > 0\nx軸との交点は x = -3, 3", hint3: "グラフがx軸より上の部分が解"},
                {inequality: "x² - 9 ≥ 0", factored: "(x-3)(x+3)", roots: [-3, 3], answer: "x ≤ -3 または x ≥ 3", hint1: "因数分解すると (x+3)(x-3) ≥ 0", hint2: "因数分解すると (x+3)(x-3) ≥ 0\nx軸との交点は x = -3, 3", hint3: "グラフがx軸より上の部分と交点が解"},
                {inequality: "x² + 2x - 8 < 0", factored: "(x+4)(x-2)", roots: [-4, 2], answer: "-4 < x < 2", hint1: "因数分解すると (x+4)(x-2) < 0", hint2: "因数分解すると (x+4)(x-2) < 0\nx軸との交点は x = -4, 2", hint3: "グラフがx軸より下の部分が解"},
                {inequality: "x² + 2x - 8 ≤ 0", factored: "(x+4)(x-2)", roots: [-4, 2], answer: "-4 ≤ x ≤ 2", hint1: "因数分解すると (x+4)(x-2) ≤ 0", hint2: "因数分解すると (x+4)(x-2) ≤ 0\nx軸との交点は x = -4, 2", hint3: "グラフがx軸より下の部分と交点が解"},
                {inequality: "x² - 6x + 9 > 0", factored: "(x-3)²", roots: [3], answer: "x ≠ 3", hint1: "因数分解すると (x-3)² > 0", hint2: "因数分解すると (x-3)² > 0\nx軸との交点は x = 3（接点）", hint3: "完全平方式でx=3以外は正"},
                {inequality: "x² - 6x + 9 ≥ 0", factored: "(x-3)²", roots: [3], answer: "すべての実数", hint1: "因数分解すると (x-3)² ≥ 0", hint2: "因数分解すると (x-3)² ≥ 0\nx軸との交点は x = 3（接点）", hint3: "完全平方式なので常に0以上"},
                {inequality: "x² + 1 > 0", factored: "x² + 1", roots: [], answer: "すべての実数", hint1: "x² + 1 > 0（因数分解できない）", hint2: "x² + 1 > 0（因数分解できない）\nx軸との交点はなし", hint3: "x²は常に0以上なので常に正"},

        function formatFunction(a, b, c) {
            let result = '';

            if (a === 1) result += 'x²';
            else if (a === -1) result += '-x²';
            else result += `${a}x²`;

            if (b > 0) result += ` + ${b}x`;
            else if (b < 0) result += ` - ${Math.abs(b)}x`;

            if (c > 0) result += ` + ${c}`;
            else if (c < 0) result += ` - ${Math.abs(c)}`;

            return result;
        }

        function getIntersectionInfo(a, b, c) {
            const discriminant = b * b - 4 * a * c;

            if (discriminant > 0) {
                const x1 = (-b - Math.sqrt(discriminant)) / (2 * a);
                const x2 = (-b + Math.sqrt(discriminant)) / (2 * a);
                return `x軸との交点は、x = ${Math.round(x1)} と x = ${Math.round(x2)} です。`;
            } else if (discriminant === 0) {
                const x1 = -b / (2 * a);
                return `x軸との交点は、x = ${Math.round(x1)} です（接点）。`;
            } else {
                return 'x軸との交点はありません。';
            }
        }

        function generateLevel0Options(correctAnswer) {
            const options = [correctAnswer];

            // 間違った選択肢を生成
            const wrongOptions = [];

            // 正解から数字を抽出して間違った選択肢を作成
            const match = correctAnswer.match(/\(x [+-] \d+\)\(x [+-] \d+\)/);
            if (match) {
                const nums = correctAnswer.match(/\d+/g);
                if (nums && nums.length >= 2) {
                    const num1 = parseInt(nums[0]);
                    const num2 = parseInt(nums[1]);

                    // 符号を変えた選択肢
                    wrongOptions.push(`(x - ${num1})(x + ${num2})`);
                    wrongOptions.push(`(x + ${num1})(x - ${num2})`);

                    // 数字を変えた選択肢
                    wrongOptions.push(`(x + ${num1 + 1})(x + ${num2})`);
                    wrongOptions.push(`(x - ${num1})(x - ${num2 + 1})`);
                    wrongOptions.push(`(x + ${num1})(x + ${num2 + 1})`);
                }
            }

            // 3つの間違った選択肢を追加
            for (let i = 0; i < 3 && i < wrongOptions.length; i++) {
                if (!options.includes(wrongOptions[i])) {
                    options.push(wrongOptions[i]);
                }
            }

            // 足りない場合は追加の選択肢を生成
            while (options.length < 4) {
                const additionalOptions = ['(x + 1)(x + 1)', '(x - 1)(x - 1)', '(x + 2)(x - 1)', '(x - 2)(x + 1)'];
                for (const opt of additionalOptions) {
                    if (!options.includes(opt)) {
                        options.push(opt);
                        break;
                    }
                }
                if (options.length >= 4) break;
            }

            // 配列をシャッフル
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            return options;
        }

        function generateLevel2Options(correctAnswer) {
            const options = [correctAnswer];

            // 間違った選択肢を生成（4つの異なるパターン）
            const wrongOptions = [];

            // 不等式の種類に応じて間違った選択肢を生成
            if (correctAnswer.includes('または') && !correctAnswer.includes('≤')) {
                // x < a または x > b の形の場合（例：x < 2 または x > 3）
                const parts = correctAnswer.split(' または ');
                const leftPart = parts[0]; // x < 2
                const rightPart = parts[1]; // x > 3
                const num1 = leftPart.match(/-?\d+/)[0];
                const num2 = rightPart.match(/-?\d+/)[0];

                wrongOptions.push(`${num1} < x < ${num2}`); // 2 < x < 3
                wrongOptions.push(`x ≤ ${num1} または x ≥ ${num2}`); // x ≤ 2 または x ≥ 3
                wrongOptions.push(`${num1} ≤ x ≤ ${num2}`); // 2 ≤ x ≤ 3
                wrongOptions.push('解なし');
            } else if (correctAnswer.includes('≤') && correctAnswer.includes('≥')) {
                // x ≤ a または x ≥ b の形の場合（例：x ≤ 2 または x ≥ 3）
                const parts = correctAnswer.split(' または ');
                const leftPart = parts[0]; // x ≤ 2
                const rightPart = parts[1]; // x ≥ 3
                const num1 = leftPart.match(/-?\d+/)[0];
                const num2 = rightPart.match(/-?\d+/)[0];

                wrongOptions.push(`x < ${num1} または x > ${num2}`); // x < 2 または x > 3
                wrongOptions.push(`${num1} < x < ${num2}`); // 2 < x < 3
                wrongOptions.push(`${num1} ≤ x ≤ ${num2}`); // 2 ≤ x ≤ 3
                wrongOptions.push('解なし');
            } else if ((correctAnswer.includes('<') || correctAnswer.includes('≤')) && !correctAnswer.includes('>') && !correctAnswer.includes('≥')) {
                // a < x < b または a ≤ x ≤ b の形の場合
                const match = correctAnswer.match(/-?\d+/g);
                if (match && match.length >= 2) {
                    const num1 = match[0];
                    const num2 = match[1];

                    // < と ≤ を入れ替えた選択肢
                    if (correctAnswer.includes('≤')) {
                        wrongOptions.push(`${num1} < x < ${num2}`); // ≤ を < に変更
                        wrongOptions.push(`x < ${num1}, x > ${num2}`); // 範囲を逆転
                        wrongOptions.push(`x ≤ ${num1}, x ≥ ${num2}`); // 範囲を逆転（≤, ≥）
                    } else {
                        wrongOptions.push(`${num1} ≤ x ≤ ${num2}`); // < を ≤ に変更
                        wrongOptions.push(`x < ${num1}, x > ${num2}`); // 範囲を逆転
                        wrongOptions.push(`x ≤ ${num1}, x ≥ ${num2}`); // 範囲を逆転（≤, ≥）
                    }
                    wrongOptions.push('解なし');
                } else {
                    wrongOptions.push('解なし');
                    wrongOptions.push('すべての実数');
                    wrongOptions.push('x > 0');
                }
            } else if (correctAnswer === 'すべての実数') {
                wrongOptions.push('解なし');
                wrongOptions.push('x ≥ 0');
                wrongOptions.push('x > 0');
                wrongOptions.push('x = 0');
            } else if (correctAnswer === '解なし') {
                wrongOptions.push('すべての実数');
                wrongOptions.push('x ≥ 0');
                wrongOptions.push('x > 0');
                wrongOptions.push('x = 0');
            } else if (correctAnswer.includes('≠')) {
                // x ≠ 4 の形の場合
                const num = correctAnswer.match(/-?\d+/)[0];
                wrongOptions.push('すべての実数');
                wrongOptions.push('解なし');
                wrongOptions.push(`x = ${num}`);
                wrongOptions.push(`x > ${num}`);
            } else {
                // その他の場合
                wrongOptions.push('解なし');
                wrongOptions.push('すべての実数');
                wrongOptions.push('x ≥ 0');
                wrongOptions.push('x > 0');
            }

            // 3つの間違った選択肢を追加
            for (let i = 0; i < 3 && i < wrongOptions.length; i++) {
                if (!options.includes(wrongOptions[i])) {
                    options.push(wrongOptions[i]);
                }
            }

            // 足りない場合は追加の選択肢を生成
            while (options.length < 4) {
                const additionalOptions = ['x > 0', 'x < 0', 'x = 0', 'x ≥ 1', 'x ≤ -1', 'x ≠ 0'];
                for (const opt of additionalOptions) {
                    if (!options.includes(opt)) {
                        options.push(opt);
                        break;
                    }
                }
                if (options.length >= 4) break;
            }

            // 配列をシャッフル
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            return options;
        }

        function drawOptionGraphs(a, b, c, inequality) {
            // 正解を決定
            let correctAnswer;
            if (inequality === '=') {
                correctAnswer = 3; // 点のみ
            } else if (inequality === '>') {
                if (a > 0) correctAnswer = 0; // 上に凸なら上の部分（白丸）
                else correctAnswer = 1; // 下に凸なら下の部分（白丸）
            } else if (inequality === '<') {
                if (a > 0) correctAnswer = 1; // 上に凸なら下の部分（白丸）
                else correctAnswer = 0; // 下に凸なら上の部分（白丸）
            } else if (inequality === '≥') {
                if (a > 0) correctAnswer = 2; // 上に凸なら上の部分（黒丸）
                else correctAnswer = 3; // 下に凸なら下の部分（黒丸）
            } else if (inequality === '≤') {
                if (a > 0) correctAnswer = 3; // 上に凸なら下の部分（黒丸）
                else correctAnswer = 2; // 下に凸なら上の部分（黒丸）
            }

            // 常に4つの異なるパターンを表示
            const options = [
                { id: 0, type: 'above', includePoints: false }, // x軸より上（白丸）
                { id: 1, type: 'below', includePoints: false }, // x軸より下（白丸）
                { id: 2, type: 'above', includePoints: true },  // x軸より上（黒丸）
                { id: 3, type: 'below', includePoints: true }   // x軸より下（黒丸）
            ];
            // 【ブラッシュアップ】並びをまぜて、正解の位置を決める
            for (let k = options.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [options[k], options[j]] = [options[j], options[k]]; }
            currentQuestion.answer = options.findIndex(o => o.id === correctAnswer);

            const numOptions = 4;

            for (let i = 0; i < numOptions; i++) {
                const canvas = document.getElementById(`optionCanvas${i}`);
                const ctx = canvas.getContext('2d');

                // キャンバスをクリア
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const option = options[i];
                // 座標系の設定（問題に応じて調整）
                let centerX = canvas.width / 2;
                let centerY = canvas.height / 2;

                // 標準的な軸配置を使用

                // 問題に応じてスケールを調整
                let scaleX = 15;
                let scaleY = 15;

                // 頂点が見えるようにスケールを調整
                const vertex_x = -b / (2 * a);
                const vertex_y = a * vertex_x * vertex_x + b * vertex_x + c;

                if (Math.abs(vertex_y) > 4) {
                    scaleY = Math.max(8, 60 / Math.abs(vertex_y));
                }
                if (Math.abs(vertex_x) > 4) {
                    scaleX = Math.max(8, 60 / Math.abs(vertex_x));
                }

                // 軸を描画
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1;

                // x軸
                ctx.beginPath();
                ctx.moveTo(0, centerY);
                ctx.lineTo(canvas.width, centerY);
                ctx.stroke();

                // 交点の値のみを表示するため、ここでは何も描画しない

                // 二次関数を描画（滑らかな曲線）
                ctx.strokeStyle = '#3B82F6';
                ctx.lineWidth = 2;
                ctx.beginPath();

                let firstPoint = true;
                const range = Math.max(6, Math.abs(vertex_x) + 3);
                for (let x = -range; x <= range; x += 0.05) {
                    const y = a * x * x + b * x + c;
                    const canvasX = centerX + x * scaleX;
                    const canvasY = centerY - y * scaleY;

                    if (canvasY >= 0 && canvasY <= canvas.height && canvasX >= 0 && canvasX <= canvas.width) {
                        if (firstPoint) {
                            ctx.moveTo(canvasX, canvasY);
                            firstPoint = false;
                        } else {
                            ctx.lineTo(canvasX, canvasY);
                        }
                    } else if (!firstPoint) {
                        ctx.stroke();
                        ctx.beginPath();
                        firstPoint = true;
                    }
                }
                if (!firstPoint) ctx.stroke();

                // 関数の式を表示
                const functionText = formatFunction(a, b, c);
                ctx.fillStyle = '#3B82F6';
                ctx.font = 'bold 10px Noto Sans JP';
                ctx.fillText(`y = ${functionText}`, 5, 15);

                // 該当する部分のグラフを赤で描画

                // 二次方程式（=）の場合は特別処理
                if (inequality === '=' && option.id === 3) {
                    // 選択肢4は点のみ（何も描画しない、後で交点だけ描画）
                } else {
                    ctx.strokeStyle = '#EF4444';
                    ctx.lineWidth = 4;

                    ctx.beginPath();
                    let firstPoint = true;
                    for (let x = -range; x <= range; x += 0.05) {
                        const y = a * x * x + b * x + c;
                        const canvasX = centerX + x * scaleX;
                        const canvasY = centerY - y * scaleY;

                        let shouldHighlight = false;
                        if (option.type === 'above' && y > 0) shouldHighlight = true;
                        if (option.type === 'below' && y < 0) shouldHighlight = true;

                        if (shouldHighlight && canvasY >= 0 && canvasY <= canvas.height && canvasX >= 0 && canvasX <= canvas.width) {
                            if (firstPoint) {
                                ctx.moveTo(canvasX, canvasY);
                                firstPoint = false;
                            } else {
                                ctx.lineTo(canvasX, canvasY);
                            }
                        } else if (!firstPoint) {
                            // 線を切る
                            ctx.stroke();
                            ctx.beginPath();
                            firstPoint = true;
                        }
                    }
                    if (!firstPoint) ctx.stroke();
                }

                // x軸との交点を描画
                const discriminant = b * b - 4 * a * c;
                if (discriminant >= 0) {
                    const x1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                    const x2 = (-b - Math.sqrt(discriminant)) / (2 * a);

                    const includePoints = option.includePoints;

                    if (discriminant > 0) {
                        // 2つの交点
                        if (includePoints) {
                            // 黒丸（点を含む）- 完全に塗りつぶし
                            ctx.fillStyle = '#EF4444';
                            ctx.beginPath();
                            ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(centerX + x2 * scaleX, centerY, 5, 0, 2 * Math.PI);
                            ctx.fill();
                        } else {
                            // 白丸（点を含まない）- 中が白で縁だけ赤
                            ctx.strokeStyle = '#EF4444';
                            ctx.fillStyle = '#FFFFFF';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.stroke();
                            ctx.beginPath();
                            ctx.arc(centerX + x2 * scaleX, centerY, 5, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.stroke();
                        }

                        // 交点の値を表示（左の交点は左側下、右の交点は右側下に表示）
                        ctx.fillStyle = '#1F2937';
                        ctx.font = '12px Noto Sans JP';
                        ctx.textAlign = 'center';
                        const leftX = Math.min(x1, x2);
                        const rightX = Math.max(x1, x2);
                        // 左の交点は左側下に表示
                        ctx.fillText(`${Math.round(leftX)}`, centerX + leftX * scaleX - 15, centerY + 20);
                        // 右の交点は右側下に表示
                        ctx.fillText(`${Math.round(rightX)}`, centerX + rightX * scaleX + 15, centerY + 20);
                    } else {
                        // 1つの交点（接点）
                        if (includePoints) {
                            // 黒丸（点を含む）- 完全に塗りつぶし
                            ctx.fillStyle = '#EF4444';
                            ctx.beginPath();
                            ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                            ctx.fill();
                        } else {
                            // 白丸（点を含まない）- 中が白で縁だけ赤
                            ctx.strokeStyle = '#EF4444';
                            ctx.fillStyle = '#FFFFFF';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.stroke();
                        }

                        // 交点の値を表示（接点は下側に表示）
                        ctx.fillStyle = '#1F2937';
                        ctx.font = '12px Noto Sans JP';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${Math.round(x1)}`, centerX + x1 * scaleX, centerY + 20);
                    }
                }
            }
        }

        function getAdvice(question, userChoice) {
            if (currentLevel === 0) {
                // レベル0: 因数分解のヒント（答えは教えない）
                return 'ヒントボタンを押して、「かけていくつ、たしていくつ」を確認してみよう！因数分解は練習すればきっとできるようになるよ！';
            } else if (currentLevel === 1) {
                // レベル1: グラフ問題のアドバイス
                const {a, b, c, inequality} = question;
                const discriminant = b * b - 4 * a * c;

                let advice = '';

                // 判別式による場合分け
                if (discriminant > 0) {
                    advice += 'この二次関数はx軸と2点で交わります。';
                } else if (discriminant === 0) {
                    advice += 'この二次関数はx軸と1点で接します。';
                } else {
                    advice += 'この二次関数はx軸と交わりません。';
                }

                // 二次項の係数による向き
                if (a > 0) {
                    advice += ' グラフは下に凸（上向き）です。';
                } else {
                    advice += ' グラフは上に凸（下向き）です。';
                }

                // 不等号の意味
                if (inequality === '>') {
                    advice += ' f(x) > 0 は、グラフがx軸より上にある部分を表します。';
                } else if (inequality === '<') {
                    advice += ' f(x) < 0 は、グラフがx軸より下にある部分を表します。';
                } else if (inequality === '≥') {
                    advice += ' f(x) ≥ 0 は、グラフがx軸より上にある部分とx軸上の点を含みます。';
                } else if (inequality === '≤') {
                    advice += ' f(x) ≤ 0 は、グラフがx軸より下にある部分とx軸上の点を含みます。';
                } else if (inequality === '=') {
                    advice += ' f(x) = 0 は、グラフがx軸と交わる点を表します。';
                }

                advice += ' グラフの形と不等号の向きをよく確認してみましょう！';

                return advice;
            } else {
                // レベル2: 二次不等式のヒント（答えは教えない）
                return 'ヒントボタンを押して、因数分解から始めてみよう！グラフを思い浮かべながら考えると分かりやすいよ！';
            }
        }

                }

                } else if (inequality === '<') {
                    explanation += `f(x) < 0 なので、グラフがx軸より下にある部分が解になります。`;
                } else if (inequality === '≥') {
                    explanation += `f(x) ≥ 0 なので、グラフがx軸より上にある部分とx軸上の点が解になります。`;
                } else if (inequality === '≤') {
                    explanation += `f(x) ≤ 0 なので、グラフがx軸より下にある部分とx軸上の点が解になります。`;
                } else if (inequality === '=') {

        function drawLevel3Graph(ctx, question) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            const scaleX = 25;
            const scaleY = 25;

            // 軸を描画
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(ctx.canvas.width, centerY);
            ctx.stroke();

            // 放物線を描画
            ctx.strokeStyle = '#3B82F6';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const roots = question.roots;
            const range = Math.max(6, roots.length > 0 ? Math.max(...roots.map(Math.abs)) + 2 : 4);
            let firstPoint = true;

            for (let x = -range; x <= range; x += 0.1) {
                let y;
                if (roots.length === 0) {
                    // x² + 1 の場合
                    y = x * x + 1;
                } else if (roots.length === 1) {
                    // 重解の場合: (x - roots[0])²
                    y = Math.pow(x - roots[0], 2);
                } else {
                    // 2つの解の場合: (x - roots[0])(x - roots[1])
                    y = (x - roots[0]) * (x - roots[1]);
                }

                const canvasX = centerX + x * scaleX;
                const canvasY = centerY - y * scaleY;

                if (canvasY >= -10 && canvasY <= ctx.canvas.height + 10) {
                    if (firstPoint) {
                        ctx.moveTo(canvasX, canvasY);
                        firstPoint = false;
                    } else {
                        ctx.lineTo(canvasX, canvasY);
                    }
                }
            }
            ctx.stroke();

            // 解の範囲を赤で描画
            const inequality = question.inequality;
            if (!inequality.includes('すべて') && !inequality.includes('解なし')) {
                ctx.strokeStyle = '#EF4444';
                ctx.lineWidth = 4;

                ctx.beginPath();
                let firstPoint = true;
                for (let x = -range; x <= range; x += 0.05) {
                    let y;
                    if (roots.length === 0) {
                        y = x * x + 1;
                    } else if (roots.length === 1) {
                        y = Math.pow(x - roots[0], 2);
                    } else {
                        y = (x - roots[0]) * (x - roots[1]);
                    }

                    const canvasX = centerX + x * scaleX;
                    const canvasY = centerY - y * scaleY;

                    let shouldHighlight = false;
                    if (inequality.includes('>') && y > 0) shouldHighlight = true;
                    if (inequality.includes('<') && y < 0) shouldHighlight = true;
                    if (inequality.includes('≥') && y >= 0) shouldHighlight = true;
                    if (inequality.includes('≤') && y <= 0) shouldHighlight = true;

                    if (shouldHighlight && canvasY >= -10 && canvasY <= ctx.canvas.height + 10) {
                        if (firstPoint) {
                            ctx.moveTo(canvasX, canvasY);
                            firstPoint = false;
                        } else {
                            ctx.lineTo(canvasX, canvasY);
                        }
                    } else if (!firstPoint) {
                        ctx.stroke();
                        ctx.beginPath();
                        firstPoint = true;
                    }
                }
                if (!firstPoint) ctx.stroke();
            }

            // 交点を描画
            ctx.fillStyle = '#EF4444';
            roots.forEach(root => {
                ctx.beginPath();
                ctx.arc(centerX + root * scaleX, centerY, 4, 0, 2 * Math.PI);
                ctx.fill();
            });

            // 不等式を表示
            ctx.fillStyle = '#3B82F6';
            ctx.font = '14px Noto Sans JP';
            ctx.fillText(question.inequality, 10, 20);
        }

        function drawExplanationGraph(a, b, c, inequality) {
            const canvas = document.getElementById('explanationCanvas');
            const ctx = canvas.getContext('2d');

            // キャンバスをクリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 座標系の設定
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scaleX = 20;
            const scaleY = 20;

            // 軸を描画
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;

            // x軸
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            // 解説グラフでは交点の値のみを表示するため、ここでは何も描画しない

            // 二次関数を描画
            ctx.strokeStyle = '#3B82F6';
            ctx.lineWidth = 2;
            ctx.beginPath();

            let firstPoint = true;
            for (let x = -7; x <= 7; x += 0.05) {
                const y = a * x * x + b * x + c;
                const canvasX = centerX + x * scaleX;
                const canvasY = centerY - y * scaleY;

                if (canvasY >= 0 && canvasY <= canvas.height && canvasX >= 0 && canvasX <= canvas.width) {
                    if (firstPoint) {
                        ctx.moveTo(canvasX, canvasY);
                        firstPoint = false;
                    } else {
                        ctx.lineTo(canvasX, canvasY);
                    }
                } else if (!firstPoint) {
                    ctx.stroke();
                    ctx.beginPath();
                    firstPoint = true;
                }
            }
            if (!firstPoint) ctx.stroke();

            // 該当する部分のグラフを赤で描画
            if (inequality !== '=') {
                ctx.strokeStyle = '#EF4444';
                ctx.lineWidth = 4;

                ctx.beginPath();
                let firstPoint = true;
                for (let x = -7; x <= 7; x += 0.05) {
                    const y = a * x * x + b * x + c;
                    const canvasX = centerX + x * scaleX;
                    const canvasY = centerY - y * scaleY;

                    let shouldHighlight = false;
                    if ((inequality === '>' || inequality === '≥') && y > 0) shouldHighlight = true;
                    if ((inequality === '<' || inequality === '≤') && y < 0) shouldHighlight = true;

                    if (shouldHighlight && canvasY >= 0 && canvasY <= canvas.height && canvasX >= 0 && canvasX <= canvas.width) {
                        if (firstPoint) {
                            ctx.moveTo(canvasX, canvasY);
                            firstPoint = false;
                        } else {
                            ctx.lineTo(canvasX, canvasY);
                        }
                    } else if (!firstPoint) {
                        // 線を切る
                        ctx.stroke();
                        ctx.beginPath();
                        firstPoint = true;
                    }
                }
                if (!firstPoint) ctx.stroke();
            }

            // x軸との交点を描画
            const discriminant = b * b - 4 * a * c;
            if (discriminant >= 0) {
                const x1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                const x2 = (-b - Math.sqrt(discriminant)) / (2 * a);

                // 不等式の種類に応じて交点の表示を変更
                const includePoints = inequality.includes('≥') || inequality.includes('≤') || inequality === '=';

                if (discriminant > 0) {
                    // 2つの交点
                    if (includePoints) {
                        // 黒丸（点を含む）- 完全に塗りつぶし
                        ctx.fillStyle = '#EF4444';
                        ctx.beginPath();
                        ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(centerX + x2 * scaleX, centerY, 5, 0, 2 * Math.PI);
                        ctx.fill();
                    } else {
                        // 白丸（点を含まない）- 中が白で縁だけ赤
                        ctx.strokeStyle = '#EF4444';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(centerX + x2 * scaleX, centerY, 5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.stroke();
                    }

                    // 交点の値を表示（左の交点は左側、右の交点は右側に表示）
                    ctx.fillStyle = '#1F2937';
                    ctx.font = '12px Noto Sans JP';
                    ctx.textAlign = 'center';
                    const leftX = Math.min(x1, x2);
                    const rightX = Math.max(x1, x2);
                    // 左の交点は左側下に表示
                    ctx.fillText(`${Math.round(leftX)}`, centerX + leftX * scaleX - 15, centerY + 20);
                    // 右の交点は右側下に表示
                    ctx.fillText(`${Math.round(rightX)}`, centerX + rightX * scaleX + 15, centerY + 20);
                } else {
                    // 1つの交点（接点）
                    if (includePoints) {
                        // 黒丸（点を含む）- 完全に塗りつぶし
                        ctx.fillStyle = '#EF4444';
                        ctx.beginPath();
                        ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                        ctx.fill();
                    } else {
                        // 白丸（点を含まない）- 中が白で縁だけ赤
                        ctx.strokeStyle = '#EF4444';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(centerX + x1 * scaleX, centerY, 5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.stroke();
                    }

                    // 交点の値を表示（接点は下側に表示）
                    ctx.fillStyle = '#1F2937';
                    ctx.font = '12px Noto Sans JP';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.round(x1)}`, centerX + x1 * scaleX, centerY + 20);
                }
            }

            // 関数の式を表示
            const functionText = formatFunction(a, b, c);
            ctx.fillStyle = '#3B82F6';
            ctx.font = '14px Noto Sans JP';
            ctx.fillText(`y = ${functionText}`, 10, 20);
        }

                            </button>
                        </div>
                    </div>
                `;
            } else {
                resultDiv.className = 'mb-4 p-6 rounded-lg bg-yellow-100 border border-yellow-300';
                resultDiv.innerHTML = `
                    <div class="text-center">
                        <div class="text-yellow-800 font-bold text-xl mb-2">${congratsMessage}</div>
                        <div class="text-yellow-700 text-lg">${score}/${shuffledProblems[currentLevel].length}問正解 (${percentage}%)</div>
                        <div class="mt-4 space-x-4">
                            <button onclick="setLevel(currentLevel)" class="px-6 py-3 bg-orange-600 text-white rounded-lg font-medium hover:bg-orange-700 transition-colors">
                                もう一度挑戦
                            </button>
                            ${currentLevel === 1 ? `<button onclick="shuffleLevel1()" class="px-6 py-3 bg-purple-600 text-white rounded-lg font-medium hover:bg-purple-700 transition-colors">
                                🔀 問題をランダムに
                            </button>` : ''}
                            <button onclick="location.reload()" class="px-6 py-3 bg-gray-600 text-white rounded-lg font-medium hover:bg-gray-700 transition-colors">
                                タイトルに戻る
                            </button>
                        </div>
                    </div>
                `;
            }

            // 【ブラッシュアップ】結果のボタンを並べ直す
            const total = shuffledProblems[currentLevel].length;
            resultDiv.querySelector('.mt-4').outerHTML =
                '<div class="final-nav">' +
                (currentLevel < 2 ? '<button class="next" onclick="setLevel(' + (currentLevel + 1) + '); window.scrollTo(0, 0);">次のレベルに挑戦 ▶</button>' : '') +
                '<button class="again" onclick="setLevel(currentLevel); window.scrollTo(0, 0);">同じレベルでもう一度</button>' +
                (currentLevel === 1 ? '<button class="plain" onclick="shuffleLevel1(); window.scrollTo(0, 0);">🔀 問題をランダムに</button>' : '') +
                '<a href="../remake.html">ほかの教材をえらぶ</a>' +
                '</div>';
            resultDiv.querySelector('.text-lg').textContent = '一発正解 ' + score + ' / ' + total + '問（' + Math.round(score / total * 100) + '%）';
            // 既存のボタンを非表示
            document.getElementById('nextBtn').classList.add('hidden');
        }

        function showHint(hintNumber) {
            const hintDisplay = document.getElementById('hintDisplay');
            const hintTitle = document.getElementById('hintTitle');
            const hintContent = document.getElementById('hintContent');
            const hintCanvas = document.getElementById('hintCanvas');

            if (hintNumber === 1) {
                if (currentLevel === 0) {
                    // レベル0: 因数分解のヒント1
                    hintTitle.textContent = '💡 ヒント1';

                    // 式から係数を抽出してヒント1を生成
                    const expression = currentQuestion.expression;
                    const match = expression.match(/x² ([+-]) (\d+)x ([+-]) (\d+)/);
                    if (match) {
                        const bSign = match[1];
                        const bValue = parseInt(match[2]);
                        const cSign = match[3];
                        const cValue = parseInt(match[4]);

                        const b = bSign === '+' ? bValue : -bValue;
                        const c = cSign === '+' ? cValue : -cValue;

                        hintContent.innerHTML = `
                            <div class="space-y-3">
                                <p class="text-lg">たして${b}になる2つの数は？</p>
                                <p class="text-lg">かけて${c}になる2つの数は？</p>
                            </div>
                        `;
                    } else {
                        hintContent.textContent = currentQuestion.hint1;
                    }
                } else {
                    // レベル2: 二次不等式のヒント1
                    hintTitle.textContent = '💡 ヒント1: 因数分解';
                    hintContent.textContent = currentQuestion.hint1;
                }

                hintDisplay.classList.remove('hidden');

                // ヒント1では図は表示しない
                document.getElementById('hintGraph').style.display = 'none';

                // ヒント1ボタンを無効化
                document.getElementById('hint1Btn').disabled = true;
                document.getElementById('hint1Btn').classList.add('opacity-50');

                // ヒント1ではナビゲーションを隠す
                document.getElementById('hintNavigation').classList.add('hidden');
            } else if (hintNumber === 2) {
                if (currentLevel === 0) {
                    // レベル0: 因数分解のヒント2
                    hintTitle.textContent = '📊 ヒント2';

                    // 因数分解のヒント2を詳しく表示
                    const expression = currentQuestion.expression;
                    const match = expression.match(/x² ([+-]) (\d+)x ([+-]) (\d+)/);
                    if (match) {
                        const bSign = match[1];
                        const bValue = parseInt(match[2]);
                        const cSign = match[3];
                        const cValue = parseInt(match[4]);

                        const b = bSign === '+' ? bValue : -bValue;
                        const c = cSign === '+' ? cValue : -cValue;

                        const hint2Match = currentQuestion.hint2.match(/(-?\d+)と(-?\d+)/);   // 【ブラッシュアップ】マイナスもふくめて読む
                        if (hint2Match) {
                            const num1 = hint2Match[1];
                            const num2 = hint2Match[2];

                            hintContent.innerHTML = `
                                <div class="space-y-3">
                                    <p class="text-lg">たして${b}になる2つの数は？ → ${num1}と${num2}</p>
                                    <p class="text-lg">かけて${c}になる2つの数は？ → ${num1}と${num2}</p>
                                    <p class="text-lg text-green-700 font-semibold">両方の条件を満たすのは${num1}と${num2}です！</p>
                                </div>
                            `;
                        } else {
                            hintContent.innerHTML = currentQuestion.hint2.replace(/\n/g, '<br>');
                        }
                    } else {
                        hintContent.innerHTML = currentQuestion.hint2.replace(/\n/g, '<br>');
                    }

                    // レベル0では図は表示しない
                    document.getElementById('hintGraph').style.display = 'none';
                } else {
                    // レベル2: 二次不等式のヒント2
                    hintTitle.textContent = '📊 ヒント2: グラフと交点';
                    hintContent.innerHTML = currentQuestion.hint2.replace(/\n/g, '<br>');

                    // ヒント2では図を表示
                    document.getElementById('hintGraph').style.display = 'flex';
                    drawHintGraph(currentQuestion, false);
                }

                hintDisplay.classList.remove('hidden');

                // ヒント2ボタンを無効化
                document.getElementById('hint2Btn').disabled = true;
                document.getElementById('hint2Btn').classList.add('opacity-50');

                // ヒント1に戻るボタンを表示
                document.getElementById('hintNavigation').classList.remove('hidden');
            } else if (hintNumber === 3) {
                hintTitle.textContent = '🎯 ヒント3: 解の範囲';
                hintContent.innerHTML = currentQuestion.hint3;
                hintDisplay.classList.remove('hidden');

                // ヒント3では赤いグラフを表示
                document.getElementById('hintGraph').style.display = 'flex';
                drawHintGraph(currentQuestion, true);

                // ヒント3ボタンを無効化
                document.getElementById('hint3Btn').disabled = true;
                document.getElementById('hint3Btn').classList.add('opacity-50');
            }
        }

        function drawHintGraph(question, showSolution) {
            const canvas = document.getElementById('hintCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scaleX = 25;
            const scaleY = 25;

            // 軸を描画
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            // 放物線を描画
            ctx.strokeStyle = '#3B82F6';
            ctx.lineWidth = 2;
            ctx.beginPath();

            const roots = question.roots;
            const range = Math.max(6, roots.length > 0 ? Math.max(...roots.map(Math.abs)) + 2 : 4);
            let firstPoint = true;

            for (let x = -range; x <= range; x += 0.05) {
                let y;
                if (roots.length === 0) {
                    // x² + 1 の場合
                    y = x * x + 1;
                } else if (roots.length === 1) {
                    // 重解の場合: (x - roots[0])²
                    y = Math.pow(x - roots[0], 2);
                } else {
                    // 2つの解の場合: (x - roots[0])(x - roots[1])
                    y = (x - roots[0]) * (x - roots[1]);
                }

                const canvasX = centerX + x * scaleX;
                const canvasY = centerY - y * scaleY;

                if (canvasY >= 0 && canvasY <= canvas.height && canvasX >= 0 && canvasX <= canvas.width) {
                    if (firstPoint) {
                        ctx.moveTo(canvasX, canvasY);
                        firstPoint = false;
                    } else {
                        ctx.lineTo(canvasX, canvasY);
                    }
                } else if (!firstPoint) {
                    ctx.stroke();
                    ctx.beginPath();
                    firstPoint = true;
                }
            }
            ctx.stroke();

            // ヒント3の場合は解の範囲を赤で描画
            if (showSolution) {
                const inequality = question.inequality;
                ctx.strokeStyle = '#EF4444';
                ctx.lineWidth = 4;

                ctx.beginPath();
                let firstPoint = true;
                for (let x = -range; x <= range; x += 0.05) {
                    let y;
                    if (roots.length === 0) {
                        y = x * x + 1;
                    } else if (roots.length === 1) {
                        y = Math.pow(x - roots[0], 2);
                    } else {
                        y = (x - roots[0]) * (x - roots[1]);
                    }

                    const canvasX = centerX + x * scaleX;
                    const canvasY = centerY - y * scaleY;

                    let shouldHighlight = false;
                    if (inequality.includes('>') && y > 0) shouldHighlight = true;
                    if (inequality.includes('<') && y < 0) shouldHighlight = true;
                    if (inequality.includes('≥') && y >= 0) shouldHighlight = true;
                    if (inequality.includes('≤') && y <= 0) shouldHighlight = true;

                    if (shouldHighlight && canvasY >= 0 && canvasY <= canvas.height && canvasX >= 0 && canvasX <= canvas.width) {
                        if (firstPoint) {
                            ctx.moveTo(canvasX, canvasY);
                            firstPoint = false;
                        } else {
                            ctx.lineTo(canvasX, canvasY);
                        }
                    } else if (!firstPoint) {
                        ctx.stroke();
                        ctx.beginPath();
                        firstPoint = true;
                    }
                }
                if (!firstPoint) ctx.stroke();
            }

            // 交点を描画（不等式の種類に応じて白丸または黒丸）
            const includePoints = question.inequality.includes('≥') || question.inequality.includes('≤');

            roots.forEach(root => {
                if (includePoints) {
                    // 黒丸（点を含む）- 完全に塗りつぶし
                    ctx.fillStyle = '#EF4444';
                    ctx.beginPath();
                    ctx.arc(centerX + root * scaleX, centerY, 5, 0, 2 * Math.PI);
                    ctx.fill();
                } else {
                    // 白丸（点を含まない）- 中が白で縁だけ赤
                    ctx.strokeStyle = '#EF4444';
                    ctx.fillStyle = '#FFFFFF';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(centerX + root * scaleX, centerY, 5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.stroke();
                }

                // 交点の座標を表示
                ctx.fillStyle = '#1F2937';
                ctx.font = '12px Noto Sans JP';
                ctx.fillText(`(${root}, 0)`, centerX + root * scaleX - 15, centerY + 20);
            });

            // 不等式を表示
            ctx.fillStyle = '#3B82F6';
            ctx.font = '14px Noto Sans JP';
            ctx.fillText(question.inequality, 10, 20);
        }

        // 初期化
        setLevel(1);
    </script>
