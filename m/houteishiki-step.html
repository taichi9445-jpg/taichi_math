      wrongs: [[["x < 8/3", "+1 を右辺へ移項すると -1。3x < 6 なので x < 2 だよ"], ["x > 2", "正の数（3）でわるときは、不等号の向きは変わらないよ"]],
               [["x ≦ -3", "-2x ≦ 6 を負の数（-2）でわると、向きが逆になるよ！"], ["x ≧ 3", "6 ÷ (-2) = -3。符号に注意"]],
               [["-3 < x < 2", "x ≧ -3 は -3 をふくむよ。-3 ≦ x < 2（数直線では -3 は ●）"], ["x < 2", "連立不等式は両方をみたす範囲。x ≧ -3 も必要だよ"]]] }
  ];

  // 通常問題とマイナス割り問題に分離してそれぞれシャッフル
  var normalPool = allQuestions.filter(function(q) { return q.type === type && q.level === level && !q.isMinusDivide; });
  var minusPool = allQuestions.filter(function(q) { return q.type === type && q.level === level && q.isMinusDivide; });

  function shuffle(array) {
    for (var i = array.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = array[i]; array[i] = array[j]; array[j] = temp;
    }
    return array;
  }

  // 通常から3問、マイナスから2問をランダム抽出
  var selectedNormal = shuffle(normalPool).slice(0, 3);
  var selectedMinus = shuffle(minusPool).slice(0, 2);

  // 段階的に難しくなるよう、最後にマイナス割りを結合して合計5問にする
  return selectedNormal.concat(selectedMinus);
}
    return { getQuizData: getQuizData };
    })();

<script>
  let selectedType = 'equation';
  let selectedLevel = 'basic';
  let quizQuestions = [];
  let currentQuestionIndex = 0;
  let currentStepIndex = 0;
  // 【ブラッシュアップ】正解のあと、次に進むまでの間は受け付けない／一発で正解できたステップを数える
  let waiting = false;
  let stepMissed = false, cleanSteps = 0, stepTotal = 0;
  let currentOptions = [];

  function selectType(type) {
    selectedType = type;
    document.getElementById('type-eq').classList.toggle('active', type === 'equation');
    document.getElementById('type-ineq').classList.toggle('active', type === 'inequality');
  }

  function selectLevel(level) {
    selectedLevel = level;
    document.getElementById('lvl-basic').classList.toggle('active', level === 'basic');
    document.getElementById('lvl-adv').classList.toggle('active', level === 'advanced');
    document.getElementById('lvl-chal').classList.toggle('active', level === 'challenge');   // 【ブラッシュアップ】
  }
  function startQuiz() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('spacer').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    document.getElementById('btn-back-home').classList.remove('hidden');
    
    google.script.run
      .withSuccessHandler(function(questions) {
        quizQuestions = questions;
        currentQuestionIndex = 0;
        cleanSteps = 0; stepTotal = 0;   // 【ブラッシュアップ】
        showQuestion();
      })
      .getQuizData(selectedType, selectedLevel);
  }

  // 【ブラッシュアップ】式を教科書の書き方で表示する（マイナスは「−」、x は斜体）
  function mathHTML(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/-/g, '−').replace(/x/g, '<i>x</i>')
      .split(' , ').map((p) => '<span class="nw">' + p + '</span>').join(', ');   // 連立不等式は 1 つずつ改行しないかたまりに
  }

  function showQuestion() {
    currentStepIndex = 0;
    document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;

    let q = quizQuestions[currentQuestionIndex];
    document.getElementById('problem-text').innerHTML = mathHTML(q.problem);
    const lead = document.getElementById('problem-lead');
    lead.textContent = q.lead || '';
    lead.classList.toggle('hidden', !q.lead);

    // 【ブラッシュアップ】発展の問題は、問題ごとの案内を使う
    var guides = q.guides || ["① つぎの変形（移項）をえらぶ", "② 計算した結果をえらぶ",
      q.type === 'inequality' ? "③ 答えをえらぶ（不等号の向きに注意）" : "③ 答えをえらぶ"];
    for (var i = 0; i < 3; i++) {
      var line = document.getElementById('line-' + i);
      line.innerHTML = '<span>' + mathText(guides[i]) + '</span>';   // 欄は flex なので、中身を 1 つにまとめる（文字と式がばらばらに並ばないように）
      line.className = 'answer-line guide';
    }

    document.getElementById('numline').classList.add('hidden');
    document.getElementById('btn-next-q').classList.add('hidden');
    document.getElementById('options-area').classList.remove('hidden');
    hideFeedback();
    makeOptions();
  }

  function makeOptions() {
    let q = quizQuestions[currentQuestionIndex];
    // 正解 1 個 ＋ まちがい 2 個（まちがいには「なぜちがうか」がついている）
    let options = [{ t: q.steps[currentStepIndex], ok: true }].concat(makeWrongs(q, currentStepIndex));
    options = shuffleArray(options);
    currentOptions = options;
    stepMissed = false;

    let optionsArea = document.getElementById('options-area');
    optionsArea.innerHTML = '';
    optionsArea.classList.remove('locked');
    waiting = false;

    options.forEach(function(opt) {
      let btn = document.createElement('button');
      btn.className = 'option-btn math';
      btn.innerHTML = mathHTML(opt.t);
      btn.onclick = function() { checkAnswer(opt, btn); };
      optionsArea.appendChild(btn);
    });
  }

  function checkAnswer(opt, btn) {
    // 元は正解を続けて押すと、次のステップで「ちがう」と出たり、1 問とばしたりした
    if (waiting) return;
    let q = quizQuestions[currentQuestionIndex];

    if (opt.ok) {
      waiting = true;
      stepTotal++;
      if (!stepMissed) cleanSteps++;
      document.getElementById('options-area').classList.add('locked');
      showFeedback(true, okMessage(q, currentStepIndex));

      let line = document.getElementById('line-' + currentStepIndex);
      line.innerHTML = '<span>' + mathHTML(opt.t) + '</span>';
      line.className = 'answer-line done math';

      currentStepIndex++;

      if (currentStepIndex > 2) {
        setTimeout(finishQuestion, 500);
      } else {
        setTimeout(function() {
          hideFeedback();
          makeOptions();
        }, 700);
      }
    } else {
      // 【ブラッシュアップ】元は「ちがう式があるよ」だけだった。選んだ式のどこがちがうかを出す
      stepMissed = true;
      if (btn) btn.disabled = true;
      showFeedback(false, '<span class="why-head">✖ その式はちがうよ</span>' + mathText(opt.why || 'もういちど見てみよう！'));
    }
  }

  // 理由の文の中の式も「−」で表示する（日本語はそのまま）
  function mathText(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/(^|[^0-9A-Za-z)])-(?=[0-9x(])/g, '$1−');
  }

  function okMessage(q, step) {
    if (step === 2 && q.type === 'inequality' && q.isMinusDivide && !/,/.test(q.problem) && !/\|/.test(q.problem)) {
      return 'せいかい！ 負の数でわったので、不等号の向きを逆にしたね ✨';
    }
    return 'せいかい！その調子！ ✨';
  }

  // 1 問できたら：不等式は数直線を見せ、「次の問題へ」ボタンで進む
  function finishQuestion() {
    let q = quizQuestions[currentQuestionIndex];
    showFeedback(true, 'できた！ 答えは ' + mathHTML(q.steps[2]));
    document.getElementById('options-area').classList.add('hidden');
    const nl = document.getElementById('numline');
    if (q.type === 'inequality' && window.Graph) {
      const g = numberLineFor(q.steps[2]);
      if (g) {
        nl.innerHTML = '<div class="numline-title">数直線で表すと（● はふくむ、○ はふくまない）</div>' + g;
        nl.classList.remove('hidden');
      }
    }
    const nb = document.getElementById('btn-next-q');
    nb.textContent = currentQuestionIndex + 1 < quizQuestions.length ? '次の問題へ ▶' : '結果を見る ▶';
    nb.classList.remove('hidden');
    nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizQuestions.length) {
      showQuestion();
      document.getElementById('quiz-screen').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      showResult();
    }
  }

  // 答えの式（x > 5、-3 ≦ x < 2 など）から数直線を作る
  function numVal(s) {
    const m = String(s).match(/^(-?\d+(?:\.\d+)?)(?:\/(\d+))?$/);
    if (!m) return NaN;
    return m[2] ? Number(m[1]) / Number(m[2]) : Number(m[1]);
  }
  function numberLineFor(ans) {
    const s = String(ans).replace(/\s+/g, '');
    let m = s.match(/^x(<|>|≦|≧)(.+)$/);
    const pts = [], ranges = [];
    let lo, hi;
    if (m) {
      const v = numVal(m[2]);
      if (!isFinite(v)) return '';
      lo = Math.floor(v) - 4; hi = Math.ceil(v) + 4;
      const filled = m[1] === '≦' || m[1] === '≧';
      if (m[1] === '>' || m[1] === '≧') ranges.push({ from: v, to: hi }); else ranges.push({ from: lo, to: v });
      pts.push({ x: v, filled: filled });
    } else {
      m = s.match(/^(.+?)(<|≦)x(<|≦)(.+)$/);
      if (!m) return '';
      const a = numVal(m[1]), b = numVal(m[4]);
      if (!isFinite(a) || !isFinite(b)) return '';
      lo = Math.floor(a) - 3; hi = Math.ceil(b) + 3;
      ranges.push({ from: a, to: b });
      pts.push({ x: a, filled: m[2] === '≦' }, { x: b, filled: m[3] === '≦' });
    }
    return Graph.numberLine({ lo: lo, hi: hi, ranges: ranges, points: pts });
  }

  function showFeedback(isCorrect, message) {
    let fb = document.getElementById('feedback-message');
    fb.innerHTML = message;   // 【ブラッシュアップ】式を「−」・斜体で出すため HTML で入れる（中身はこのページで作った文だけ）
    fb.className = "feedback " + (isCorrect ? "correct" : "wrong");
  }
  
  function hideFeedback() {
    document.getElementById('feedback-message').className = "feedback hidden";
  }

  function showResult() {
    // 【ブラッシュアップ】一発で正解できたステップの数
    document.getElementById('result-score').textContent = '一発正解 ' + cleanSteps + ' / ' + stepTotal;
    document.getElementById('result-msg').textContent = cleanSteps === stepTotal
      ? 'ぜんぶ一発で正解！ 完ぺきです。'
      : (cleanSteps >= stepTotal * 0.8 ? 'よくできました。まちがえたステップの理由をもう一度たしかめよう。' : '理由を読みながら、同じ設定でもう一度やってみよう。');
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
  }

  function backToMenu() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('btn-back-home').classList.add('hidden');
    document.getElementById('spacer').classList.remove('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }

  function shuffleArray(array) {
    var arr = array.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
    }
    return arr;
  }

  // 【ブラッシュアップ】まちがいの選択肢を理由つきで作る。
  //   発展の問題はデータに書いた wrongs を使い、初級・上級は問題の式から「よくあるまちがい」を作る。
  function makeWrongs(q, step) {
    let list = [];
    if (q.wrongs) {
      list = q.wrongs[step].map(function(w) { return { t: w[0], ok: false, why: w[1] }; });
    } else {
      list = autoWrongs(q, step);
    }
    // 正解と同じ式・重なりを除いて 2 個にする
    const seen = [q.steps[step]], out = [];
    list.forEach(function(w) { if (seen.indexOf(w.t) < 0 && out.length < 2) { seen.push(w.t); out.push(w); } });
    return out;
  }

  // 「ax + b」の形の式を読む（例：「5x - 4」→ {a: 5, b: -4}、「x + 10」→ {a: 1, b: 10}）
  function readSide(s) {
    let a = 0, b = 0;
    s.replace(/\s+/g, '').replace(/-/g, '+-').split('+').filter(Boolean).forEach(function(t) {
      if (t.indexOf('x') >= 0) { const k = t.replace('x', ''); a += k === '' ? 1 : (k === '-' ? -1 : Number(k)); }
      else b += Number(t);
    });
    return { a: a, b: b };
  }
  function xs(k) { return k === 1 ? 'x' : (k === -1 ? '-x' : k + 'x'); }
  function sgn(n) { return (n > 0 ? '+' : '-') + Math.abs(n); }
  function sgnx(k) { return (k > 0 ? '+' : '-') + xs(Math.abs(k)); }
  function frac(n, d) {
    if (d < 0) { n = -n; d = -d; }
    const g = (function gcd(p, r) { return r ? gcd(r, p % r) : Math.abs(p); })(n, d);
    n /= g; d /= g;
    return d === 1 ? String(n) : n + '/' + d;
  }

  function autoWrongs(q, step) {
    const m = q.problem.match(/^(.*?)\s*(=|>|<|≧|≦)\s*(.*)$/);
    const op = m[2], L = readSide(m[1]), R = readSide(m[3]);
    const ineq = op !== '=';
    const A = L.a - R.a, B = R.b - L.b;
    const adv = R.a !== 0;
    const minus = (n) => (n > 0 ? '-' : '+') + ' ' + Math.abs(n);   // 移項したあとの符号
    const plus = (n) => (n > 0 ? '+' : '-') + ' ' + Math.abs(n);    // 符号を変え忘れたとき
    const leftX = adv ? xs(L.a) + ' ' + minus(R.a).replace(/\d+$/, (d) => xs(Number(d))) : xs(L.a);
    const leftXbad = adv ? xs(L.a) + ' ' + plus(R.a).replace(/\d+$/, (d) => xs(Number(d))) : xs(L.a);
    const w = [];

    if (step === 0) {
      const signC = { t: leftX + ' ' + op + ' ' + R.b + ' ' + plus(L.b), ok: false,
        why: '左辺の ' + sgn(L.b) + ' を右辺へ移項すると ' + sgn(-L.b) + ' になるよ。移項するときは符号を変える' };
      const signX = { t: leftXbad + ' ' + op + ' ' + R.b + ' ' + minus(L.b), ok: false,
        why: '右辺の ' + sgnx(R.a) + ' を左辺へ移項すると ' + sgnx(-R.a) + ' になるよ。移項するときは符号を変える' };
      const keep = { t: xs(L.a) + ' ' + plus(L.b) + ' ' + op + ' ' + R.b + ' ' + minus(L.b), ok: false,
        why: '移項した ' + sgn(L.b) + ' は、左辺からは消えるよ（両辺から同じ数をひく・たすのと同じ）' };
      const dir = { t: q.steps[0].replace(/[<>≦≧]/, invertSign), ok: false,
        why: '移項しても不等号の向きは変わらないよ。向きが変わるのは、負の数をかけたりわったりしたときだけ' };
      if (!adv) w.push(signC, ineq ? dir : keep);
      else if (!ineq) w.push(signX, signC);
      else w.push(dir, Math.random() < 0.5 ? signX : signC);
    } else if (step === 1) {
      const expr = R.b + ' ' + minus(L.b);
      w.push({ t: xs(A) + ' ' + op + ' ' + (R.b + L.b), ok: false,
        why: '右辺の計算：' + expr + ' = ' + B + ' だよ' });
      if (adv) {
        w.push({ t: xs(-A) + ' ' + op + ' ' + B, ok: false,
          why: 'x の係数：' + L.a + ' ' + minus(R.a) + ' = ' + A + '。符号に注意しよう' });
      } else {
        w.push({ t: xs(A) + ' ' + op + ' ' + (-B), ok: false,
          why: '右辺の計算：' + expr + ' = ' + B + '。符号に注意しよう' });
      }
    } else {
      const V = B / A;
      const inv = frac(A, B);
      const invWhy = xs(A) + ' ' + op + ' ' + B + ' は両辺を ' + A + ' でわる。x ' + op + ' ' + B + ' ÷ ' + (A < 0 ? '(' + A + ')' : A) + ' だよ（わる順番が逆）';
      if (!ineq) {
        if (A < 0) w.push({ t: 'x = ' + (-V), ok: false, why: B + ' ÷ (' + A + ') = ' + V + '。' + (B < 0 ? '負 ÷ 負 は正' : '正 ÷ 負 は負') + 'だよ' });
        else w.push({ t: 'x = ' + (A * B), ok: false, why: '両辺を ' + A + ' で「わる」よ。かけるのではない' });
        w.push({ t: 'x = ' + inv, ok: false, why: invWhy });
      } else if (A > 0) {
        w.push({ t: 'x ' + invertSign(op) + ' ' + V, ok: false, why: '正の数（' + A + '）でわるときは、不等号の向きは変わらないよ' });
        w.push({ t: 'x ' + op + ' ' + inv, ok: false, why: invWhy });
      } else {
        w.push({ t: 'x ' + op + ' ' + V, ok: false, why: '負の数（' + A + '）でわると、不等号の向きが逆になるよ！' });
        w.push({ t: 'x ' + invertSign(op) + ' ' + (-V), ok: false, why: B + ' ÷ (' + A + ') = ' + V + '。符号に注意' });
      }
    }
    // 念のための予備（正解と重なったときだけ使う）
    w.push({ t: q.steps[step].replace(/(-?\d+)$/, (d) => String(Number(d) + 1)), ok: false, why: '計算をもう一度見直そう' });
    return w;
  }


        // 【ブラッシュアップ】式の書き方を教科書にそろえる：文字（x, y, a, p, q, f, D, k など）は斜体、
        //   数字・記号はまっすぐ。どちらも数式の書体（var(--u-math-font)）で、日本語は普通の書体のまま。
        //   式のひとかたまり（「0 ≦ x ≦ 2」など）は途中で改行しない（長い式は「=」の前で分ける）。
        //   画面の文字はマイナスを「−」にする以外は変えないので、答え合わせには影響しない。
        //   画面が書きかわるたびに、指定した場所に当て直す。
        const MATH_RUN = /[A-Za-z0-9²³±√≦≧<>=+\-−·×÷\/.,()|' ]*[A-Za-z0-9][A-Za-z0-9²³±√≦≧<>=+\-−·×÷\/.,()|' ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .math, i, script, style, svg, input, textarea, mjx-container, .MathJax')) continue;
                if (/\\|\$\$/.test(n.nodeValue)) continue;   // MathJax がまだ組んでいない式（\( … \) など）にはさわらない
                if (/[A-Za-z0-9]/.test(n.nodeValue)) nodes.push(n);
                else if (/-/.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/-/g, '−');   // 「-(」など記号だけの部分もマイナスは「−」
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    // 長い式は「 = 」の前で区切り、区切りのところだけで改行できるようにする
                    const pieces = text.length > 22 ? text.split(/(?= = )/) : [text];
                    pieces.forEach((piece, k) => {
                        if (k) frag.appendChild(document.createTextNode(' '));
                        const span = document.createElement('span');
                        span.className = 'm';
                        piece.trim().split(/([A-Za-z]+)/).forEach((part, j) => {
                            if (!part) return;
                            if (j % 2) { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                            else span.appendChild(document.createTextNode(part.replace(/-/g, '−')));
                        });
                        frag.appendChild(span);
                    });
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

  watchMath(['#feedback-message', '.answer-line.guide']);

  function invertSign(sign) {
    if (sign === '>') return '<';
    if (sign === '<') return '>';
    if (sign === '≧') return '≦';
    if (sign === '≦') return '≧';
    return sign;
  }
</script>
