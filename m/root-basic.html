  <link rel="stylesheet" href="../assets/gas.css">
  
  <style>
    * { font-family: 'Fredoka', sans-serif; }
    html, body, #app { height: 100%; width: 100%; margin: 0; padding: 0; }

    body {

    .stage-btn {

    .stage-btn:hover {

    .floor2 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .floor3 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

<body class="u-theme h-full">
  <div id="app" class="h-full w-full">

    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <!-- ヘッダー -->

      <h1 id="game-title" style="font-size: 48px; font-weight: 800; margin-bottom: 16px; background: linear-gradient(to right, #fbbf24, #f87171, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">平方根タワー 基礎編</h1>
      <p style="font-size: 16px; opacity: 0.9; color: white;">9つのフロアを登ってマスターを目指そう！🏗️</p>
    </div>

    <div id="stage-select" class="glass-panel">
      <h2 style="font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 8px; background: linear-gradient(to right, #06b6d4, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">ステージを選択</h2>
      <p style="font-size: 14px; text-align: center; opacity: 0.7; margin-bottom: 32px; color: white;">🏗️ 登りたいフロアを選んでください</p>

    </div>

    <!-- 難易度選択画面 -->
    <div id="difficulty-select" class="glass-panel hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <button id="back-btn" style="font-size: 14px; opacity: 0.7; cursor: pointer; background: none; border: none; color: white; font-weight: 600;">← 戻る</button>
        <h2 id="difficulty-title" style="font-size: 24px; font-weight: bold; background: linear-gradient(to right, #c084fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></h2>

  <script>
    const stages = [
      { name: '平方根を求める', floor: '1F', hasDifficulty: true },
      { name: '√を使って表す', floor: '2F', hasDifficulty: false },   // 【ブラッシュアップ】1F と同じ名前だった
      { name: '根号を外す', floor: '3F', hasDifficulty: true },
      // 【ブラッシュアップ】4F に中級（√(a²) の問題）を足した。5F と 6F を入れかえた（問題データもあとで入れかえる）
      { name: '値を求める', floor: '4F', hasDifficulty: true },
      { name: 'a√bの変形', floor: '5F', hasDifficulty: true },
      { name: '乗除の基本', floor: '6F', hasDifficulty: true },
      { name: '加減の計算', floor: '7F', hasDifficulty: true },
      { name: '展開の計算', floor: '8F', hasDifficulty: true },
      { name: '分母の有理化', floor: '9F', hasDifficulty: true }
    ];

    // 【ブラッシュアップ】√ の中が式のとき（√(3²) など）に、中身の上に横線（括線）を引いて表す
    function rt(x) { return '√<span class="rad">' + x + '</span>'; }

    function makeFraction(numerator, denominator) {
      return `<div class="fraction"><div class="fraction-numerator">${numerator}</div><div class="fraction-denominator">${denominator}</div></div>`;
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    // 【ブラッシュアップ】ヒントを見直した。元は 8F で 1 問ずれていたり（√3(√3+2) に √2 のヒント）、
    //   (√2+1)² に「(a+b)(a−b)」、マイナスのない √64 に「マイナスをつけて」と出たり、7F では答えそのものが出ていた。
    //   ヒントは下で問題 1 つ 1 つに結びつけるので、問題の順番を混ぜてもずれない。
    const hints = {
      1: {
        beginner: ['□×□=16 となる数 □ は？ 正と負の 2 つあるよ', '9の平方根は？両側に±の符号をつけてね', '□×□=25 となる数は、正と負の 2 つ', '□×□=36 となる数は、正と負の 2 つ', '□×□=49 となる数は、正と負の 2 つ'],
        intermediate: ['12×12 はいくつ？ 負の数も忘れずに', '平方根の定義を思い出して', 'a²=b のときbの平方根は±a', '掛け算で確認してね', '11×11 はいくつ？'],
        advanced: ['0.3×0.3 はいくつ？ 平方根は正と負の 2 つ', '分母と分子をそれぞれ 2 乗して考えよう', '平方数を覚えてる？ 13×13 は？', 'もう一度丁寧に計算してみて', '15×15 はいくつ？']
      },
      2: {
        beginner: ['このままで大丈夫。√の形で答えるよ', '平方根の形で答えましょう', '√で囲まれた数が答えです', 'ルートの形のままで正解！', '無理数になるから√の形です']

            });
            frag.appendChild(span);
          });
          last = at + lead + text.length;
          return run;
        });
        frag.appendChild(document.createTextNode(s.slice(last)));
        n.parentNode.replaceChild(frag, n);
      });
    }
    var queued = false;
    function run() { queued = false; SELS.forEach(function (sel) { document.querySelectorAll(sel).forEach(mathify); }); }
    function start() {
      run();
      if (window.MutationObserver) new MutationObserver(function () { if (!queued) { queued = true; (window.requestAnimationFrame || setTimeout)(run); } })
        .observe(document.body, { childList: true, subtree: true, characterData: true });
    }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  })();
</script>
