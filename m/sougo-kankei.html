}.choices{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.choice{position:relative;background:white!important;color:#1f2328!important;min-height:80px!important;font-size:22px!important;padding:18px 8px!important}.choice:before{content:attr(data-label);position:absolute;left:8px;top:3px;font-size:12px;color:#5b6470}.choice.correct{background:#ebfbee!important;border-color:#2b8a3e!important}.choice.incorrect{background:#fff5f5!important;border-color:#c92a2a!important}.score{font-size:13px!important;color:#5b6470!important}.problem-text{font-size:18px!important;font-weight:400!important}.problem-area{padding:0!important;background:white!important;border:0!important}.hint-content,.feedback-message,.explanation{font-size:17px!important;text-align:left!important;border:0!important;border-left:4px solid #1f4e8c!important;border-radius:0!important;background:#f1f6fc!important;padding:12px!important}.feedback-correct{background:#ebfbee!important;border-color:#2b8a3e!important}.feedback-incorrect{background:#fff5f5!important;border-color:#c92a2a!important}.tri,.semi{display:block;max-width:100%;height:auto;margin:16px auto}.math-root{vertical-align:-.4em;overflow:visible}.root-term{white-space:nowrap}.fr,.fraction{display:inline-flex!important;flex-direction:column!important;vertical-align:middle!important;align-items:stretch;line-height:1.25!important;text-align:center;margin:0 .15em!important;font-family:'STIX Two Text',serif}.fr>span:first-child,.numerator,.fraction-numerator{border-bottom:1px solid;padding:0 .16em .12em!important}.fr>span:last-child,.denominator,.fraction-denominator{padding:.22em .16em 0!important}.m,.math{font-family:'STIX Two Text',serif}.eq{display:block;margin:10px 0}.press-progress{height:3px;background:#e6edf5}.press-progress span{display:block;height:100%;background:#1f4e8c}.question-badge{background:#1f4e8c;color:white;padding:2px 8px;margin-right:12px}.result-box{background:white!important;border:1px solid #d0d7de!important;border-radius:8px!important;max-width:600px!important}.result-emoji{display:none}.trace{stroke-dasharray:1000;stroke-dashoffset:0;animation:draw 1s ease-out}@keyframes draw{from{stroke-dashoffset:1000}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}@media(min-width:641px){.choices{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
.equation-group{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.wrap-equation{align-items:flex-start!important}.step-line{max-width:100%}.step-line.wrap-equation{flex-direction:column!important;gap:8px!important}.step-line.wrap-equation .equation-group:not(:first-child){margin-left:16px}:root{--u-math-font:'STIX Two Text','BIZ UDPGothic',serif}.m,.mi,.math{font-family:'STIX Two Text','BIZ UDPGothic',serif!important;font-weight:400!important}.fr,.fraction{font-family:'STIX Two Text','BIZ UDPGothic',serif!important}.header{text-align:left!important}.header p{font-size:14px;font-weight:400;color:#5b6470}button{font-family:'BIZ UDPGothic',sans-serif!important;font-weight:400!important}.hint-btn{background:white!important;color:#1f4e8c!important;border-bottom-color:#b6bfc9!important}.score{border:0!important;background:white!important;padding:4px!important}.progress{width:100%!important;text-align:left!important}.feedback-message{animation:none!important;opacity:1!important}.choice .m{font-size:1em!important}.semi{width:360px!important}.tri{width:360px!important}.tri text{font-family:'BIZ UDPGothic',sans-serif}.eq{font-weight:400!important}.hint-content{font-weight:400!important}.problem-text .xv{color:#1f4e8c!important}
[hidden]{display:none!important}.step-line{margin:14px 0;display:flex;align-items:center;gap:4px;white-space:nowrap}.step-line.wrap-equation{flex-wrap:wrap}.drop-zone{background:#f1f6fc;color:#1f4e8c;min-width:50px;padding:4px;font:inherit;white-space:nowrap}.drop-zone.correct{background:#ebfbee}.card-bank{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0;background:#fff;padding:8px;position:sticky;bottom:0;border:1px solid #d0d7de;z-index:2;max-height:35vh;overflow:auto}.option{font:18px 'STIX Two Text';background:white;padding:8px 12px;touch-action:none;min-height:56px;white-space:nowrap}.option.selected{outline:2px solid #1f4e8c}.option:disabled{opacity:.4}.controls,.navigation{display:flex;gap:12px;justify-content:space-between;margin:18px 0}.controls button,.navigation button{padding:8px 16px;font:inherit;background:white;color:#1f4e8c}.drag-ghost{position:fixed;pointer-events:none;transform:translate(-50%,-50%);z-index:100;background:white;border:2px solid #1f4e8c;padding:10px}#hint-box,#explanation{padding:12px;background:#f1f6fc;border-left:4px solid #1f4e8c;margin:16px 0}#reason{color:#c92a2a}.small{font-size:14px;color:#5b6470}sup{font-size:.75em}</style></head><body><a href="../remake.html">← 教材の一覧へ</a><main class="container"><small>数学Ⅰ　図形と計量</small><h1>相互関係の計算</h1><p>カードを選んで空欄を押すか、空欄まで動かして入れよう。</p><div id="lesson"></div></main><script>    const problems = [
      {
        id: 1,
        given: "0° < A < 90°、cos A = 3/5",
        target: "sin A と tan A",
        steps: [
          { seg: ["【三角比の相互関係】 sin²A + ", { b: 0, a: "cos²A" }, " = ", { b: 1, a: "1" }] },
          { seg: ["sin²A + ", { b: 2, a: "(3/5)²" }, " = 1"] },
          { seg: ["sin²A = 1 − 9/25 = ", { b: 3, a: "16/25" }] },
          { seg: ["0° < A < 90° より ", { b: 4, a: "sin A > 0" }, " なので"] },
          { seg: ["sin A = ", { b: 5, a: "4/5" }] },
          { seg: ["【三角比の相互関係】 tan A = ", { frac: [{ b: 6, a: "sin A" }, { b: 7, a: "cos A" }] }] },
          { seg: ["tan A = 4/5 ÷ 3/5 = 4/5 × ", { b: 8, a: "5/3" }, " = ", { b: 9, a: "4/3" }] }
        ],
        options: ["cos²A", "1", "(3/5)²", "16/25", "sin A > 0", "4/5", "sin A", "cos A", "5/3", "4/3", "tan²A", "9/25", "4/25", "sin A < 0", "−4/5", "3/4"],
        explanation: "sin²A + cos²A = 1 に cos A = 3/5 を代入して sin²A = 16/25。0° < A < 90° では sin A > 0 なので sin A = 4/5（16/25 の分子・分母それぞれの √ をとる）。tan A = sin A ÷ cos A = 4/5 ÷ 3/5 = 4/3。<br>答え：sin A = 4/5、tan A = 4/3"
      },
      {
        id: 2,
        given: "0° < A < 90°、cos A = 2/3",
        target: "sin A と tan A",
        steps: [
          { seg: ["sin²A + cos²A = 1 より"] },
          { seg: ["sin²A = 1 − ", { b: 0, a: "(2/3)²" }, " = ", { b: 1, a: "5/9" }] },
          { seg: ["0° < A < 90° より sin A > 0 なので sin A = ", { b: 2, a: "√5/3" }] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " = √5/3 ÷ 2/3 = ", { b: 3, a: "√5/2" }] }
        ],
        options: ["(2/3)²", "5/9", "√5/3", "√5/2", "4/9", "5/3", "√5/9", "−√5/3", "2√5/9", "2/√5"],
        explanation: "sin²A = 1 − 4/9 = 5/9。sin A > 0 なので sin A = √5/3（分母の 9 も √ をとって 3）。tan A = √5/3 × 3/2 = √5/2。<br>答え：sin A = √5/3、tan A = √5/2"
      },
      {
        id: 3,
        given: "0° < A < 90°、sin A = 1/3",
        target: "cos A と tan A",
        steps: [
          { seg: ["sin²A + cos²A = 1 より"] },
          { seg: ["cos²A = 1 − ", { b: 0, a: "(1/3)²" }, " = ", { b: 1, a: "8/9" }] },
          { seg: ["0° < A < 90° より ", { b: 2, a: "cos A > 0" }, " なので cos A = ", { b: 3, a: "2√2/3" }] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " = 1/3 ÷ 2√2/3 = 1/3 × ", { b: 4, a: "3/2√2" }, " = ", { b: 5, a: "1/2√2" }] },
          { seg: ["分母を有理化して tan A = ", { b: 6, a: "√2/4" }] }
        ],
        options: ["(1/3)²", "8/9", "cos A > 0", "2√2/3", "3/2√2", "1/2√2", "√2/4", "2/3", "cos A < 0", "−2√2/3", "8/3", "√2/2"],
        explanation: "cos²A = 1 − 1/9 = 8/9。cos A > 0 なので cos A = √8/3 = 2√2/3。tan A = 1/3 ÷ 2√2/3 = 1/2√2 = √2/4（分母と分子に √2 をかけて有理化）。<br>答え：cos A = 2√2/3、tan A = √2/4"
      },
      {
        id: 4,
        given: "0° < A < 90°、sin A = 3/4",
        target: "cos A と tan A",
        steps: [
          { seg: ["sin²A + cos²A = 1 より"] },
          { seg: ["cos²A = 1 − ", { b: 0, a: "(3/4)²" }, " = ", { b: 1, a: "7/16" }] },
          { seg: ["0° < A < 90° より cos A > 0 なので cos A = ", { b: 2, a: "√7/4" }] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " = 3/4 ÷ √7/4 = ", { b: 3, a: "3/√7" }] },
          { seg: ["分母を有理化して tan A = ", { b: 4, a: "3√7/7" }] }
        ],
        options: ["(3/4)²", "7/16", "√7/4", "3/√7", "3√7/7", "9/16", "√7/16", "−√7/4", "√7/3", "3√7/4"],
        explanation: "cos²A = 1 − 9/16 = 7/16。cos A > 0 なので cos A = √7/4。tan A = 3/4 × 4/√7 = 3/√7 = 3√7/7。<br>答え：cos A = √7/4、tan A = 3√7/7"
      },
      {
        id: 5,
        given: "0° < A < 90°、sin A = 2/5",
        target: "cos A と tan A",
        steps: [
          { seg: ["sin²A + cos²A = 1 より"] },
          { seg: ["cos²A = 1 − ", { b: 0, a: "(2/5)²" }, " = ", { b: 1, a: "21/25" }] },
          { seg: ["0° < A < 90° より cos A > 0 なので cos A = ", { b: 2, a: "√21/5" }] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " = 2/5 ÷ √21/5 = ", { b: 3, a: "2/√21" }] },
          { seg: ["分母を有理化して tan A = ", { b: 4, a: "2√21/21" }] }
        ],
        options: ["(2/5)²", "21/25", "√21/5", "2/√21", "2√21/21", "4/25", "21/5", "√21/25", "2√21/5", "5/√21"],
        explanation: "cos²A = 1 − 4/25 = 21/25。cos A > 0 なので cos A = √21/5。tan A = 2/5 × 5/√21 = 2/√21 = 2√21/21。<br>答え：cos A = √21/5、tan A = 2√21/21"
      },
      {
        id: 6,
        given: "0° < A < 90°、tan A = 2",
        target: "cos A と sin A",
        steps: [
          { seg: ["【三角比の相互関係】 1 + tan²A = ", { b: 0, a: "1/cos²A" }, " より"] },
          { seg: ["1/cos²A = 1 + 2² = ", { b: 1, a: "5" }] },
          { seg: ["cos²A = ", { b: 2, a: "1/5" }] },
          { seg: ["0° < A < 90° より cos A > 0 なので cos A = ", { b: 3, a: "1/√5" }, " = √5/5"] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " より sin A = tan A × cos A = 2 × ", { b: 4, a: "1/√5" }, " = ", { b: 5, a: "2√5/5" }] }
        ],
        options: ["1/cos²A", "5", "1/5", "1/√5", "2√5/5", "1/sin²A", "3", "√5", "2/5", "−1/√5", "√5/2"],
        explanation: "1 + tan²A = 1/cos²A に tan A = 2 を代入すると 1/cos²A = 5、cos²A = 1/5。cos A > 0 なので cos A = 1/√5 = √5/5。sin A = tan A cos A = 2/√5 = 2√5/5。<br>答え：cos A = √5/5、sin A = 2√5/5"
      },
      {
        id: 7,
        given: "90° < A < 180°、sin A = 1/3",
        target: "cos A と tan A",
        steps: [
          { seg: ["sin²A + cos²A = 1 より cos²A = 1 − (1/3)² = ", { b: 0, a: "8/9" }] },
          { seg: ["90° < A < 180° より ", { b: 1, a: "cos A < 0" }, " なので cos A = ", { b: 2, a: "−2√2/3" }] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " = 1/3 ÷ (−2√2/3) = ", { b: 3, a: "−1/2√2" }, " = ", { b: 4, a: "−√2/4" }] }
        ],
        options: ["8/9", "cos A < 0", "−2√2/3", "−1/2√2", "−√2/4", "cos A > 0", "2√2/3", "√2/4", "1/2√2", "−8/9"],
        explanation: "cos²A = 8/9 までは問題 3 と同じ。90° < A < 180°（鈍角）では点 P の x 座標が負なので cos A < 0、cos A = −2√2/3。tan A も負になり tan A = −√2/4。<br>答え：cos A = −2√2/3、tan A = −√2/4"
      },
      {
        id: 8,
        given: "90° < A < 180°、cos A = −3/5",
        target: "sin A と tan A",
        steps: [
          { seg: ["sin²A + cos²A = 1 より sin²A = 1 − ", { b: 0, a: "(−3/5)²" }, " = ", { b: 1, a: "16/25" }] },
          { seg: ["90° < A < 180° のときも ", { b: 2, a: "sin A > 0" }, " なので sin A = ", { b: 3, a: "4/5" }] },
          { seg: ["tan A = ", { frac: ["sin A", "cos A"] }, " = 4/5 ÷ (−3/5) = ", { b: 4, a: "−4/3" }] }
        ],
        options: ["(−3/5)²", "16/25", "sin A > 0", "4/5", "−4/3", "sin A < 0", "−4/5", "4/3", "−3/4", "−9/25"],
        explanation: "(−3/5)² = 9/25 なので sin²A = 16/25。0° < A < 180° では点 P の y 座標は正なので、鈍角でも sin A > 0、sin A = 4/5。tan A = 4/5 ÷ (−3/5) = −4/3。<br>答え：sin A = 4/5、tan A = −4/3"
      }
    ];

        function radicalSVG(digits, o = {}) {
            const size = o.size || 20, scale = size / 20, width = 16 + String(digits).length * 15;
            const dimensions = o.diagram
                ? 'x="' + o.x + '" y="' + o.y + '" width="' + width * scale + '" height="' + 30 * scale + '"'
                : 'width="' + width / 20 + 'em" height="1.5em"';
            return '<svg class="math-root" ' + dimensions + ' viewBox="0 0 ' + width + ' 30" role="img" aria-label="√' + digits + '" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M1 16 L4 14 L7 23 L13 5 H' + (width - 1) + '" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="miter"/>' +
                '<text x="14" y="22" font-size="20" font-family="' + (o.diagram ? 'BIZ UDPGothic, sans-serif' : 'STIX Two Text, serif') + '" font-weight="' + (o.diagram ? '700' : '400') + '" fill="currentColor">' + digits + '</text></svg>';
        }
        function rtHTML(s) {
            return String(s).replace(/(\d*)√(\d+)/g, (_, coefficient, digits) => '<span class="root-term">' + coefficient + radicalSVG(digits) + '</span>');
        }
        function mathHTML(s) {
            s = String(s);
            let sign = '';
            if (s[0] === '−') { sign = '−'; s = s.slice(1); }
            if (s.includes('/')) { const [n, d] = s.split('/'); return sign + '<span class="fr"><span class="fr-n">' + rtHTML(n) + '</span><span class="fr-d">' + rtHTML(d) + '</span></span>'; }
            return sign + rtHTML(s);
        }

        // 問題データはそのままに、表示の段階で表記を整える。
// Each answer card can be reused until all matching blanks have been filled.
const extraProblems=[
 {given:'0° ≦ A ≦ 180°、sin A = 2/3',target:'cos A と tan A（2通り）',answers:[['0° < A < 90° のとき cos A','√5/3'],['tan A','2√5/5'],['90° < A < 180° のとき cos A','−√5/3'],['tan A','−2√5/5']],wrong:['√5/9','2/√5','−2/3'],explanation:'cos²A = 1 − 4/9 = 5/9。鋭角ではcos Aは正、鈍角では負。sin Aはどちらも正。tan A = sin A / cos A より、cos Aと同じ符号になります。'},
 {given:'90° < A < 180°、tan A = −2',target:'cos A と sin A',answers:[['cos A','−√5/5'],['sin A','2√5/5']],wrong:['√5/5','−2√5/5','−1/5'],explanation:'1 + tan²A = 1/cos²A より 1/cos²A = 5。cos²A = 1/5。鈍角なのでcos Aは負、cos A = −√5/5。sin A = tan A × cos A = 2√5/5。'},
 {given:'0° < A < 90°、cos A = 1/4',target:'sin A と tan A',answers:[['sin A','√15/4'],['tan A','√15']],wrong:['15/16','√15/16','1/√15','−√15/4'],explanation:'sin²A = 1 − 1/16 = 15/16。鋭角なのでsin A = √15/4。tan A = sin A / cos A = √15。'}];
extraProblems.forEach((p,i)=>problems.push({...p,id:9+i,steps:p.answers.map(([name,a],b)=>({seg:[name+' = ',{b,a}]})),options:p.answers.map(v=>v[1]).concat(p.wrong)}));
// Gradually remove scaffolding while keeping all original givens and final answers.
for(const i of [4,5,6,7]){const p=problems[i];const finals=[['cos A','√21/5','tan A','2√21/21'],['cos A','√5/5','sin A','2√5/5'],['cos A','−2√2/3','tan A','−√2/4'],['sin A','4/5','tan A','−4/3']][i-4];p.steps=[{seg:[finals[0]+' = ',{b:0,a:finals[1]}]},{seg:[finals[2]+' = ',{b:1,a:finals[3]}]}];p.options=[...new Set(p.options.concat(finals[1],finals[3]))];}
function formatText(s){return String(s).replace(/(−?)(\d*√\d+|\d+|sin A|cos A|tan A)\s*\/\s*(\d*√\d+|\d+|cos²A|sin²A|sin A|cos A)/g,(_,sign,a,b)=>'@@'+stash(sign+fraction(a,b))+'@@').replace(/(\d*)√(\d+)/g,(_,a,b)=>a+radicalSVG(b)).replace(/@@(\d+)@@/g,(_,i)=>pieces[i]).replace(/²/g,'<sup>2</sup>').replace(/\bA\b/g,'<i>A</i>')}
const pieces=[];function stash(s){return pieces.push(s)-1}
function fraction(a,b){return '<span class="fr"><span>'+rtHTML(a)+'</span><span>'+rtHTML(b)+'</span></span>'}
let currentPage=0,doneFlags={},mistakes=0,selected=null,records=problems.map(()=>({answers:{},revealed:0,shown:false}));
function textHint(p,row){const s=row.seg.map(v=>typeof v==='string'?v:v.a||'').join('');if(/[<>]/.test(s))return 'sin A は点Pのy座標、cos A はx座標に対応します。角の範囲からPがy軸の右か左か考えよう。';if(s.includes('tan'))return 'tan A = sin A / cos A。分数で割るときは、逆数をかけます。符号も確かめよう。';if(s.includes('²'))return 'sin²A + cos²A = 1 に、'+p.given.split('、')[1]+'を代入しよう。与えられた値を2乗して、1から引きます。';return '2乗を外すには分子と分母の両方の平方根をとります。角の範囲を見て正負を決めよう。'}
function signFigure(p){const left=p.given.startsWith('90'),x=left?90:250;return `<svg class="semi" viewBox="0 0 340 200"><path d="M50 160A120 120 0 0 1 290 160M30 160H315M170 185V20" fill="none" stroke="#1f2328" stroke-width="2"/><path d="M170 160L${x} 70L${x} 160" fill="none" stroke="#1f4e8c" stroke-width="3"/><circle cx="${x}" cy="70" r="4"/><text x="${x-10}" y="55">P</text><text x="310" y="180">x</text><text x="180" y="25">y</text><text x="155" y="183">O</text></svg>`}
function errorHint(value,answer,p,row){const specific={'9/25':'与えられたcos Aを2乗した値です。sin²Aは1から引いた残りになります。','16/25':'これはsin²Aの値です。sin Aを求めるには2乗を外そう。','√5/9':'分母の9にも平方根をとる必要があります。','3/4':'tan Aの分子はsin A、分母はcos Aです。逆になっていないか確かめよう。'};if(p.id===1&&specific[value])return specific[value];if(p.id===2&&value==='√5/9')return specific[value];if(value.includes('<')||value.includes('>')||value.startsWith('−')!==answer.startsWith('−'))return '角Aの範囲から符号を確かめよう。sin Aはy、cos Aはxに対応します。';if(value.includes('²')||/\/(9|16|25)$/.test(value)&&!answer.includes('²'))return '2乗の値と、2乗を外した値を区別しよう。分母にも平方根が必要です。';if(row.seg.join('').includes('tan'))return 'tan Aはsin Aをcos Aで割った値です。逆数や約分を確かめよう。';return 'この空欄の直前の式を確かめよう。代入、2乗、引き算を一つずつ計算し直そう。'}
function rowBlanks(row){return row.seg.flatMap(v=>typeof v==='string'?[]:v.frac?v.frac.filter(t=>typeof t==='object'):[v])}
function render(){const p=problems[currentPage],r=records[currentPage];selected=null;let blocked=false;const rows=p.steps.map((row,i)=>{const visible=r.shown||!blocked;const blanks=rowBlanks(row);if(blanks.some(z=>r.answers[z.b]!==z.a))blocked=true;return `<div class="step-line" data-row="${i}" ${visible?'':'hidden'}>${renderRow(row,r)}</div>`}).join('');
 document.getElementById('lesson').innerHTML=`<div><span class="question-badge">問${p.id}</span>${p.id} / ${problems.length}</div><div class="press-progress"><span style="width:${100*p.id/problems.length}%"></span></div><p class="problem-text">${formatText(p.given)} のとき、${p.target}を求めなさい。</p>${p.id>=5?'<p class="small">途中式はノートで考えよう。</p>':''}<div class="steps-content">${rows}</div><div class="card-bank">${p.options.map((o,i)=>`<button class="option" data-card="${i}" aria-label="${o}">${formatText(o)}</button>`).join('')}</div><p id="reason" role="status"></p><div class="controls"><button id="hint">ヒント</button><button id="show" ${doneFlags[p.id]?'disabled':''}>答えを見る</button></div><div id="hint-box" hidden></div><div id="explanation" ${doneFlags[p.id]?'':'hidden'}><h3>解説</h3>${p.explanation.split(/。|<br>/).filter(Boolean).map(t=>'<p>'+formatText(t)+'</p>').join('')}</div><div class="navigation"><button id="prev" ${currentPage===0?'disabled':''}>前へ</button><button id="next">${currentPage===problems.length-1?'結果を見る':'次へ'}</button></div>`;
 document.querySelectorAll('[data-card]').forEach(b=>{const value=p.options[+b.dataset.card];const needed=p.steps.flatMap(rowBlanks).filter(z=>z.a===value).length,used=Object.values(r.answers).filter(v=>v===value).length;b.disabled=!!doneFlags[p.id]||(used>0&&used>=needed);b.onclick=()=>{document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));selected=value;b.classList.add('selected')};setupDrag(b,value)});
 document.querySelectorAll('[data-blank]').forEach(b=>b.onclick=()=>place(+b.dataset.blank,selected));document.getElementById('hint').onclick=()=>{const row=p.steps.find(row=>rowBlanks(row).some(z=>r.answers[z.b]!==z.a))||p.steps[0],box=document.getElementById('hint-box');box.hidden=!box.hidden;box.innerHTML='<h3>ヒント</h3><p>'+formatText(textHint(p,row))+'</p>'+signFigure(p)};
 document.getElementById('show').onclick=()=>{r.shown=true;p.steps.flatMap(rowBlanks).forEach(z=>r.answers[z.b]=z.a);doneFlags[p.id]='shown';render()};document.getElementById('prev').onclick=()=>goToPage(currentPage-1);document.getElementById('next').onclick=()=>currentPage===problems.length-1?showFinal():goToPage(currentPage+1);requestAnimationFrame(layoutEquations);
}
function renderRow(row,r){let html=row.seg.map(v=>typeof v==='string'?formatText(v):v.frac?fraction(...v.frac.map(w=>typeof w==='string'?w:zone(w,r))):zone(v,r)).join('');html=html.replace('【三角比の相互関係】','');const box=document.createElement('div');box.innerHTML=html;const groups=[document.createElement('span')];groups[0].className='equation-group';Array.from(box.childNodes).forEach(n=>{if(n.nodeType===3){const chunks=n.textContent.split(/( = | より | なので |分母を有理化して )/);chunks.forEach(c=>{if(c===' = '){const g=document.createElement('span');g.className='equation-group';g.textContent='= ';groups.push(g)}else if(/より|なので|有理化/.test(c)){groups.at(-1).append(document.createTextNode(c));const g=document.createElement('span');g.className='equation-group';groups.push(g)}else groups.at(-1).append(document.createTextNode(c))})}else groups.at(-1).append(n)});return groups.map(g=>g.outerHTML).join('')}
function zone(z,r){return `<button class="drop-zone ${r.answers[z.b]?'correct':''}" data-blank="${z.b}" aria-label="空欄${z.b+1}">${r.answers[z.b]?formatText(r.answers[z.b]):'□'}</button>`}
function place(id,value){const p=problems[currentPage],r=records[currentPage];if(doneFlags[p.id])return;if(r.answers[id]&&value===null){delete r.answers[id];render();return}if(value===null)return;const row=p.steps.find(row=>rowBlanks(row).some(z=>z.b===id)),z=rowBlanks(row).find(z=>z.b===id);if(z.a!==value){mistakes++;document.getElementById('reason').textContent=errorHint(value,z.a,p,row);return}r.answers[id]=value;if(p.steps.flatMap(rowBlanks).every(z=>r.answers[z.b]===z.a))doneFlags[p.id]='self';render()}
function setupDrag(b,value){let start=null,ghost=null,moved=false;b.onpointerdown=e=>{if(b.disabled)return;start=[e.clientX,e.clientY];moved=false;b.setPointerCapture(e.pointerId)};b.onpointermove=e=>{if(!start)return;if(Math.hypot(e.clientX-start[0],e.clientY-start[1])>6)moved=true;if(!moved)return;if(!ghost){ghost=b.cloneNode(true);ghost.className='drag-ghost';document.body.append(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'};b.onpointerup=e=>{if(!start)return;start=null;if(ghost)ghost.remove();ghost=null;if(moved){const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-blank]');if(z)place(+z.dataset.blank,value);b.onclick=e=>{e.preventDefault();b.onclick=()=>{selected=value;b.classList.add('selected')}}}};b.onpointercancel=()=>{start=null;ghost?.remove();ghost=null}}
function layoutEquations(){document.querySelectorAll('.step-line').forEach(row=>{if(row.hidden)return;row.classList.remove('wrap-equation');row.classList.toggle('wrap-equation',row.scrollWidth>row.clientWidth+1)})}
function goToPage(i){currentPage=i;render();window.scrollTo(0,0)}
function showFinal(){document.getElementById('lesson').innerHTML='<h2>学習の記録</h2><p>自力で正解 '+Object.values(doneFlags).filter(v=>v==='self').length+' / '+problems.length+'</p><p>答えを見た問題 '+Object.values(doneFlags).filter(v=>v==='shown').length+'</p><p>まちがえて入れた回数 '+mistakes+'</p><button onclick="restartAll()">最初から</button> <button onclick="render()">問題に戻る</button><p><a href="../remake.html">教材の一覧へ</a></p>'}
function restartAll(){doneFlags={};mistakes=0;records=problems.map(()=>({answers:{},shown:false}));goToPage(0)}
window.addEventListener('resize',layoutEquations);document.fonts.ready.then(layoutEquations);render();
</script></body></html>
