<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>相互関係の計算</title>
<!--
  27. 相互関係の計算
  2026-10-28 先生の確認を受けて作り直し（Claude Code）。
  ・どの問題も「sin²A + cos²A = 1 → 代入 → 計算 → 移項 → 符号 → √ → tan」の同じ形。空欄の数だけ少しずつ増やす。
  ・問1 はカードを左上から順に使う。問2 からは、使うカードの間にダミーをはさむ。
  ・最後の問6 は分母の有理化まで。
  ・PC・Chromebook の横長の画面では、カードを右に置く（assets/fill-steps.css）。
-->
<link rel="stylesheet" href="../assets/port.css">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/fill-steps.css">
<style>
.sign-fig{width:280px}
.sign-note{margin:4px 0 0;font-size:15px}
</style>
</head><body>
<a class="port-back" href="../index.html">← 教材の一覧へ</a>
<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅰ　図形と計量</small><h1>相互関係の計算</h1></header>
  <div id="app"></div>
</main>
<script src="../assets/fill-steps.js"></script>
<script>
// 行の並びはどの問題も同じ（0〜9 行目）。問6 だけ有理化の 10・11 行目がある。
const problems = [
  { // 問1：空欄は少なめ。カードは左上から順に使う。
    q: '0° < A < 90° で、cos A = {3|5} のとき、sin A と tan A の値を求めなさい。',
    given: 'cos A = {3|5}',
    rows: [
      'sin²A + cos²A = 1',
      'sin²A + ([3/5])² = 1',
      'sin²A + {9|25} = 1',
      'sin²A = 1 − {9|25}',
      'sin²A = [16/25]',
      '#0° < A < 90° より sin A > 0 なので',
      'sin A = {√16|√25} = [4/5]',
      'tan A = {sin A|cos A} = sin A ÷ cos A',
      'tan A = {4|5} ÷ {3|5}',
      'tan A = {4|5} × [5/3] = [4/3]'
    ],
    cards: ['3/5', '16/25', '4/5', '5/3', '4/3',
      ['9/25', '9/25 は (3/5)² の値です。sin²A は、1 からひいた残りです。'],
      ['3/4', 'tan A は sin A ÷ cos A。分子と分母が逆になっていないかな。'],
      ['−4/5', '0° < A < 90° なので、sin A は正の数です。']],
    ans: 'sin A = {4|5}、tan A = {4|3}'
  },
  { // 問2
    q: '0° < A < 90° で、cos A = {2|3} のとき、sin A と tan A の値を求めなさい。',
    given: 'cos A = {2|3}',
    rows: [
      'sin²A + cos²A = 1',
      'sin²A + ([2/3])² = 1',
      'sin²A + [4/9] = 1',
      'sin²A = 1 − {4|9}',
      'sin²A = [5/9]',
      '#0° < A < 90° より [sin A > 0] なので',
      'sin A = {√5|√9} = [√5/3]',
      'tan A = {sin A|cos A} = sin A ÷ cos A',
      'tan A = {√5|3} ÷ [2/3]',
      'tan A = {√5|3} × [3/2] = [√5/2]'
    ],
    cards: ['2/3', ['2/9', '2乗するときは、分子も分母も2乗します。'], '4/9', '5/9',
      ['sin A < 0', '0° < A < 90° のとき、sin A は正の数です。'], 'sin A > 0',
      ['√5/9', '分母の 9 も √ をとります。√9 = 3 です。'], '√5/3', '3/2',
      ['2√5/9', '分数でわるときは、わる数の逆数をかけます。'], '√5/2'],
    ans: 'sin A = {√5|3}、tan A = {√5|2}'
  },
  { // 問3：sin A がわかっている
    q: '0° < A < 90° で、sin A = {12|13} のとき、cos A と tan A の値を求めなさい。',
    given: 'sin A = {12|13}',
    rows: [
      'sin²A + cos²A = 1',
      '([12/13])² + cos²A = 1',
      '[144/169] + cos²A = 1',
      'cos²A = 1 − [144/169]',
      'cos²A = [25/169]',
      '#0° < A < 90° より [cos A > 0] なので',
      'cos A = {√25|√169} = [5/13]',
      'tan A = {sin A|cos A} = sin A ÷ cos A',
      'tan A = [12/13] ÷ [5/13]',
      'tan A = {12|13} × [13/5] = [12/5]'
    ],
    cards: ['12/13', ['144/13', '2乗するときは、分母の 13 も2乗します。'], '144/169', '25/169',
      ['cos A < 0', '0° < A < 90° のとき、cos A は正の数です。'], 'cos A > 0',
      ['5/169', '分母の 169 も √ をとります。√169 = 13 です。'], '5/13', '13/5',
      ['5/12', 'tan A は sin A ÷ cos A。分子と分母が逆になっていないかな。'], '12/5'],
    ans: 'cos A = {5|13}、tan A = {12|5}'
  },
  { // 問4：鈍角
    q: '90° < A < 180° で、cos A = −{2|5} のとき、sin A と tan A の値を求めなさい。',
    given: 'cos A = −{2|5}',
    obtuse: true,
    rows: [
      'sin²A + [cos²A] = [1]',
      'sin²A + ([−2/5])² = 1',
      'sin²A + [4/25] = 1',
      'sin²A = [1] − [4/25]',
      'sin²A = [21/25]',
      '#90° < A < 180° のときも [sin A > 0] なので',
      'sin A = {√21|√25} = [√21/5]',
      'tan A = {sin A|cos A} = [sin A] ÷ [cos A]',
      'tan A = [√21/5] ÷ ([−2/5])',
      'tan A = {√21|5} × ([−5/2]) = [−√21/2]'
    ],
    cards: [['tan²A', 'sin²A と組み合わせて 1 になるのは cos²A です。'], 'cos²A', '1', '−2/5',
      ['−4/25', '負の数を2乗すると、正の数になります。'], '4/25', '21/25',
      ['sin A < 0', '0° < A < 180° では、点 P は x 軸より上にあるので sin A は正の数です。'], 'sin A > 0',
      '√21/5', ['−√21/5', 'sin A は正の数です。'], 'sin A', 'cos A',
      ['2/5', 'cos A は負の数です。'], '−5/2',
      ['√21/2', '正の数を負の数でわると、答えは負の数になります。'], '−√21/2'],
    ans: 'sin A = {√21|5}、tan A = −{√21|2}'
  },
  { // 問5：√ を簡単にする
    q: '0° < A < 90° で、cos A = {2|7} のとき、sin A と tan A の値を求めなさい。',
    given: 'cos A = {2|7}',
    rows: [
      'sin²A + [cos²A] = [1]',
      'sin²A + ([2/7])² = 1',
      'sin²A + [4/49] = 1',
      'sin²A = [1] − [4/49]',
      'sin²A = [45/49]',
      '#0° < A < 90° より [sin A > 0] なので',
      'sin A = {[√45]|[√49]} = [3√5/7]',
      'tan A = {[sin A]|[cos A]} = [sin A] ÷ [cos A]',
      'tan A = [3√5/7] ÷ [2/7]',
      'tan A = {3√5|7} × [7/2] = [3√5/2]'
    ],
    cards: ['cos²A', '1', '2/7', ['4/7', '2乗するときは、分母の 7 も2乗します。'], '4/49', '45/49',
      ['sin A < 0', '0° < A < 90° のとき、sin A は正の数です。'], 'sin A > 0', '√45', '√49',
      ['√5/7', '√45 = √(3² × 5) なので、3 が √ の外に出ます。'], '3√5/7', 'sin A', 'cos A', '7/2',
      ['3√5/49', '{3√5|7} × {7|2} の 7 は約分できます。'], '3√5/2'],
    ans: 'sin A = {3√5|7}、tan A = {3√5|2}'
  },
  { // 問6：分母の有理化まで
    q: '0° < A < 90° で、sin A = {3|4} のとき、cos A と tan A の値を求めなさい。',
    given: 'sin A = {3|4}',
    rows: [
      '[sin²A] + [cos²A] = [1]',
      '([3/4])² + cos²A = 1',
      '[9/16] + cos²A = 1',
      'cos²A = [1] − [9/16]',
      'cos²A = [7/16]',
      '#0° < A < 90° より [cos A > 0] なので',
      'cos A = {[√7]|[√16]} = [√7/4]',
      'tan A = {[sin A]|[cos A]} = [sin A] ÷ [cos A]',
      'tan A = [3/4] ÷ [√7/4]',
      'tan A = {3|4} × [4/√7] = [3/√7]',
      '#分母を有理化して',
      'tan A = {3 × [√7]|√7 × [√7]} = [3√7/7]'
    ],
    cards: ['sin²A', 'cos²A', '1', '3/4', ['9/4', '2乗するときは、分母の 4 も2乗します。'], '9/16', '7/16',
      ['cos A < 0', '0° < A < 90° のとき、cos A は正の数です。'], 'cos A > 0', '√7', '√16',
      ['√7/16', '分母の 16 も √ をとります。√16 = 4 です。'], '√7/4', 'sin A', 'cos A', '4/√7',
      ['√7/3', 'tan A は sin A ÷ cos A。分子と分母が逆になっていないかな。'], '3/√7',
      ['3√7', '分母の √7 × √7 = 7 が残ります。'], '3√7/7'],
    ans: 'cos A = {√7|4}、tan A = {3√7|7}'
  }
];

// 行ごとのヒント（行の位置で決まる）
const HINTS = [
  '三角比の相互関係 sin²A + cos²A = 1 から始めます。',
  null, // 代入（問題ごとに作る）
  '( )² を計算します。分子と分母を、それぞれ2乗します。',
  '左の分数を右へ移項します。移項すると符号が変わります。',
  '1 を分母が同じ分数に直してから、引き算します。',
  'sin A は点 P の y 座標、cos A は x 座標と同じ符号です。',
  '分子と分母、それぞれの √ をとります。√ の中が「ある数の2乗」なら √ がはずれます。',
  'tan A = {sin A|cos A}。分数の線は「÷」と同じ意味です。',
  'sin A と cos A の値を、それぞれ代入します。',
  '分数でわるときは、わる数の逆数をかけます。',
  '',
  '分母と分子に同じ √7 をかけます。√7 × √7 = 7 です。'
];
function hint(p, row) {
  const i = p.rows.indexOf(row);
  if (i === 1) return p.given + ' を代入します。';
  return HINTS[i];
}

// 符号を決める行のヒント：点 P が y 軸の右か左か
function hintFig(p, row) {
  if (p.rows.indexOf(row) !== 5) return '';
  const left = !!p.obtuse, deg = left ? 125 : 52, t = deg * Math.PI / 180, ox = 140, oy = 150, R = 100;
  const px = ox + R * Math.cos(t), py = oy - R * Math.sin(t);
  return `<svg class="sign-fig" viewBox="0 0 280 185" role="img" aria-label="角Aと点Pの位置">
    <path d="M40 150A100 100 0 0 1 240 150" fill="none" stroke="#1f2328" stroke-width="1.6"/>
    <path d="M14 150H268M140 178V24" stroke="#1f2328" stroke-width="1.4"/>
    <path d="M${ox} ${oy}L${px} ${py}" stroke="#1f4e8c" stroke-width="2.5"/>
    <path d="M${px} ${py}V${oy}" stroke="#c92a2a" stroke-width="2.5" stroke-dasharray="5 4"/>
    <path d="M${ox} ${oy}H${px}" stroke="#2b8a3e" stroke-width="4"/>
    <path d="M${ox + 26} ${oy}A26 26 0 0 0 ${ox + 26 * Math.cos(t)} ${oy - 26 * Math.sin(t)}" fill="none" stroke="#d9480f" stroke-width="2"/>
    <circle cx="${px}" cy="${py}" r="4" fill="#1f2328"/>
    <g font-family="STIX Two Text" font-size="19" font-style="italic">
      <text x="${px + (left ? -18 : 6)}" y="${py - 8}">P</text>
      <text x="${ox + (left ? 30 : 30)}" y="${oy - 10}" fill="#d9480f">A</text>
      <text x="258" y="170">x</text><text x="147" y="26">y</text><text x="124" y="170">O</text>
    </g>
    <g font-family="BIZ UDPGothic" font-size="13">
      <text x="${(ox + px) / 2}" y="${oy + 18}" text-anchor="middle" fill="#2b8a3e">x 座標 ${left ? '−' : '＋'}</text>
      <text x="${px + (left ? -8 : 8)}" y="${(oy + py) / 2 + 4}" text-anchor="${left ? 'end' : 'start'}" fill="#c92a2a">y 座標 ＋</text>
    </g></svg>
    <p class="sign-note">${left ? '90° < A < 180°：P は y 軸の左。cos A は負、sin A は正。' : '0° < A < 90°：P は y 軸の右。cos A も sin A も正。'}</p>`;
}

function wrong(p, b, v) {
  if (/[<>]/.test(b.a)) return '角 A の範囲から、点 P が y 軸の右か左かを考えよう。';
  if (/\d/.test(v) && v.startsWith('−') !== b.a.startsWith('−')) return '符号（＋か−か）を確かめよう。';
  return null;
}

FillSteps.mount({ el: '#app', problems, hint, hintFig, wrong });
</script>
</body></html>
