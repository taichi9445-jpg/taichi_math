<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三角比（座標）</title>
<!--
  30. 三角比（座標）
  2026-10-28 先生の確認を受けて作り直し（Claude Code）。
  ・図が動く練習：角度を決めた問題（sin 150° など）。図の中にも 150° と書く。P の座標と半径は書かない（自分でうめる）。
    ヒントで、その角の直角三角形（30°・45°・60°）と辺の比を見せる。カードは 27・28 と同じ仕組み（assets/fill-steps.js）。
  ・θ を求める問題：問題文 → ヒント1（円と直線）→ ヒント2（交点・直角三角形）→ ヒント3（角）と、図に少しずつかきこむ。
  ・「r が 2 でない点」は使わないので消した。
-->
<link rel="stylesheet" href="../assets/port.css">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/fill-steps.css">
<style>
/* メニュー */
.zm-sec{margin:4px 0 14px}
.zm-sec h2{font-size:15px;margin:0 0 6px;color:#1f4e8c;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.zm-sec h2 small{font-size:13px;color:#5b6470;font-weight:400}
.zm-list{display:grid;gap:8px}
.zm-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border:1px solid #c5d3e4;border-left:5px solid #1f4e8c;border-bottom:3px solid #b6bfc9;border-radius:6px;background:#fff;color:#1f2328;font:inherit;cursor:pointer;transition:transform .08s}
.zm-item:active{transform:translateY(2px);border-bottom-width:1px}
.zm-item .n{flex:none;width:30px;height:30px;border-radius:50%;background:#e3ecf7;color:#1f4e8c;font-weight:700;display:flex;align-items:center;justify-content:center}
.zm-item b{display:block;font-size:17px}
.zm-item span.s{display:block;font-size:14px;color:#5b6470}
.zm-item.m2{border-left-color:#7048e8}.zm-item.m2 .n{background:#efe9fd;color:#5f3dc4}
.zm-item.rev{border-left-color:#e8890c}.zm-item.rev .n{background:#fff1dc;color:#b35c00}
.zm-item .ok{margin-left:auto;color:#2b8a3e;font-size:14px;font-weight:700;white-space:nowrap}
.zm-note{font-size:14px;color:#5b6470;margin:4px 0 0}
.zm-back{min-height:32px!important;padding:2px 10px!important;font-size:14px!important;margin-right:6px}
/* 図 */
.zf{position:relative;margin:0 auto;max-width:100%}
.zf>svg{display:block;width:100%;height:auto}
.zl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;width:max-content;font-size:17px;line-height:1.2;color:#b02525;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.fs-fig .zf{width:340px}
.fs-hint .zf{width:250px;margin-top:6px}
@media (min-width:900px) and (orientation:landscape){.fs-fig .zf{width:380px}}
/* θ を求める */
.rv-q{font-size:20px;margin:4px 0 10px;padding:10px 14px;background:#fff8e6;border-left:4px solid #e8890c;border-radius:4px}
.rv-hints{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.rv-hints .fs-btn.on{background:#e3ecf7}
.rv-text{margin:6px 0;font-size:16px;line-height:1.8}
.rv-text p{margin:2px 0}
.rv-text .h{display:inline-block;font-size:13px;color:#fff;background:#1f4e8c;border-radius:3px;padding:0 6px;margin-right:6px}
.rv-fig .zf{width:360px}
.rv-angles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0}
.rv-angle{min-height:46px;border:1px solid #9db6d6;border-bottom:3px solid #7f9cc4;border-radius:6px;background:#fff;font:19px 'STIX Two Text',serif;cursor:pointer;transition:transform .08s}
.rv-angle:active{transform:translateY(2px);border-bottom-width:1px}
.rv-angle.on{background:#1f4e8c;color:#fff;border-color:#1f4e8c;border-bottom-color:#163a69}
.rv-res{margin:8px 0;padding:8px 12px;border-radius:4px}
.rv-res.ok{background:#ebfbee;border-left:4px solid #2b8a3e}
.rv-res.ng{background:#fff5f5;border-left:4px solid #c92a2a;color:#a61e1e}
@media (min-width:900px) and (orientation:landscape){
  .rv-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .rv-side{position:sticky;top:12px}
  .rv-angles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head><body>
<a class="port-back" href="../index.html">← 教材の一覧へ</a>
<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅰ　図形と計量</small><h1>三角比（座標）</h1></header>
  <div id="menu"></div>
  <div id="app"></div>
  <div id="rev"></div>
</main>
<script src="../assets/fill-steps.js"></script>
<script src="../assets/zahyou.js"></script>
<script>
const MODES = [
  { id: 'basic', name: '基本の角', sub: '30°・45°・60°・120°・135°・150°', angles: [30, 45, 60, 120, 135, 150] },
  { id: 'axis', name: '軸の上の角', sub: '0°・90°・180°（P が x 軸・y 軸の上）', angles: [0, 90, 180] },
  { id: 'm2a', name: '180° をこえる角', sub: '210°・225°・240°・300°・315°・330°', angles: [210, 225, 240, 300, 315, 330], full: true, m2: true },
  { id: 'm2b', name: '270°・360°', sub: 'P が軸の上（円で考える）', angles: [270, 360], full: true, m2: true }
];
const done = {};   // メニューの「クリア」の印

function startMode(m) {
  const mode = MODES.find(x => x.id === m);
  document.getElementById('menu').innerHTML = ''; document.getElementById('rev').innerHTML = '';
  const app = document.getElementById('app'); app.hidden = false;
  mountZahyou(app, mode.angles, m, {
    onDone: () => { done[m] = true; },
    menuBtn: '<button type="button" class="fs-btn zm-back" onclick="showMenu()">メニュー</button>',
    finalExtra: '<p><button type="button" class="fs-btn" onclick="showMenu()">メニューにもどる</button></p>'
  });
  window.scrollTo(0, 0);
}

// ---------------- θ を求める ----------------
const REV = [
  { f: 'sin', v: '1/2', r: '2', k: '1', ans: [30, 150] },
  { f: 'sin', v: '√3/2', r: '2', k: '√3', ans: [60, 120] },
  { f: 'sin', v: '1/√2', r: '√2', k: '1', ans: [45, 135] },
  { f: 'cos', v: '−1/2', r: '2', k: '−1', ans: [120] },
  { f: 'cos', v: '1/√2', r: '√2', k: '1', ans: [45] },
  { f: 'cos', v: '−√3/2', r: '2', k: '−√3', ans: [150] },
  { f: 'sin', v: '1', r: '1', k: '1', ans: [90] },
  { f: 'sin', v: '0', r: '1', k: '0', ans: [0, 180] }
];
const REV_ANGLES = [0, 30, 45, 60, 90, 120, 135, 150, 180];
let rv = { i: 0, stage: 0, picked: new Set(), res: null, solved: {} };

function revFig(q, stage) {
  const W = 360, H = 250, ox = 180, oy = 214, R = 140, u = R / num(q.r), k = num(q.k), isSin = q.f === 'sin';
  let s = axes(W, H, ox, oy, R, false, q.r), labels = '';
  if (stage >= 1) {
    if (isSin) { const yy = oy - k * u; s += `<path d="M18 ${yy}H${W - 18}" stroke="${ORANGE}" stroke-width="2" stroke-dasharray="7 5"/>`; labels += zl(ox + 36, yy - (k === 0 ? 14 : 13), W, H, md(`y = ${q.k}`), ORANGE); }
    else { const xx = ox + k * u; s += `<path d="M${xx} ${oy + 20}V14" stroke="${ORANGE}" stroke-width="2" stroke-dasharray="7 5"/>`; labels += zl(xx + (k < 0 ? -34 : 34), 22, W, H, md(`x = ${q.k}`), ORANGE); }
  }
  if (stage >= 2) {
    q.ans.forEach((d, j) => {
      const a = d * Math.PI / 180, px = ox + R * Math.cos(a), py = oy - R * Math.sin(a), [x, y] = T[d];
      if (!onAxis(d)) {
        s += `<path d="M${ox} ${oy}L${px} ${oy}L${px} ${py}Z" fill="#e3ecf7" opacity=".85"/>`;
        s += `<path d="M${ox} ${oy}L${px} ${oy}" stroke="${GREEN}" stroke-width="3"/><path d="M${px} ${oy}L${px} ${py}" stroke="${RED}" stroke-width="3"/>`;
        const sx = px > ox ? -1 : 1; s += `<path d="M${px + sx * 9} ${oy}V${oy - 9}H${px}" fill="none" stroke="#1f2328" stroke-width="1.2"/>`;
        s += sideNum([ox, oy], [px, oy], px, py, x.replace('−', ''), GREEN, 15) + sideNum([px, oy], [px, py], ox, oy, y.replace('−', ''), RED, 15);
      }
      s += `<path d="M${ox} ${oy}L${px} ${py}" stroke="${NAVY}" stroke-width="3"/><circle cx="${px}" cy="${py}" r="4.5" fill="${NAVY}"/>`;
      if (!onAxis(d)) s += j ? sideNum([ox, oy], [px, py], ox, py, q.r, NAVY, 15) : sideNum([ox, oy], [px, py], px, oy, q.r, NAVY, 15);
      s += it(px + Math.cos(a) * 16, py - Math.sin(a) * 16 + (onAxis(d) && d !== 90 ? -8 : 4), q.ans.length > 1 ? (j ? 'P′' : 'P') : 'P', NAVY, 17);
    });
  }
  if (stage >= 3) {
    q.ans.forEach((d, j) => {
      const c = j ? PURPLE : ORANGE, r0 = j ? 36 : 24, a = d * Math.PI / 180;
      if (d > 0) s += `<path d="M${ox + r0} ${oy}A${r0} ${r0} 0 0 0 ${ox + r0 * Math.cos(a)} ${oy - r0 * Math.sin(a)}" fill="none" stroke="${c}" stroke-width="2.2"/>`;
      let m = d / 2, rr = j ? 56 : (d < 60 ? Math.min(66, 24 / Math.sin(Math.max(d, 1) * Math.PI / 360)) : 42);
      if (d === 0) { m = 14; rr = 58; } if (d === 180) { m = 118; rr = 56; } if (j && d > 90 && d < 180) { m = 118; rr = 50; }
      s += gtext(ox + rr * Math.cos(m * Math.PI / 180), oy - rr * Math.sin(m * Math.PI / 180) + 5, d + '°', c, 15);
    });
  }
  return `<div class="zf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="θを求める図">${s}</svg>${labels}</div>`;
}
function revTexts(q, stage) {
  const L = q.f === 'sin' ? 'y' : 'x', out = [];
  if (stage >= 1) out.push(`<p><span class="h">ヒント1</span>${md(`${q.f} θ = {${L}|r} = ${tex(q.v)} なので、半径 r = ${q.r} の半円の上で、${L} = ${q.k} となる点 P をさがそう。`)}</p>`);
  if (stage >= 2) out.push(`<p><span class="h">ヒント2</span>${md((q.ans.length > 1 ? '点 P は2つあります。' : '点 P は1つです。') + (onAxis(q.ans[0]) ? 'P は x 軸・y 軸の上にあります。' : '直角三角形の辺の比を見よう。'))}</p>`);
  if (stage >= 3) out.push(`<p><span class="h">ヒント3</span>${md('θ は、x 軸の正の向きから OP までの角です。')}</p>`);
  return out.join('');
}
function renderRev() {
  const q = REV[rv.i], el = document.getElementById('rev');
  const tabs = REV.map((_, j) => `<button type="button" class="fs-tab${j === rv.i ? ' cur' : ''}${rv.solved[j] ? ' done' : ''}" onclick="revGo(${j})">${j + 1}</button>`).join('');
  const finished = rv.res === 'ok';
  el.innerHTML = `<nav class="fs-tabs"><button type="button" class="fs-btn zm-back" onclick="showMenu()">メニュー</button><span>問</span>${tabs}</nav>
  <div class="rv-grid"><div>
    <p class="rv-q"><span class="fs-badge">問${rv.i + 1}</span>${md(`${q.f} θ = ${tex(q.v)}　を満たす θ を求めよ。`)}<span style="font-size:15px">${md('（0° ≦ θ ≦ 180°）')}</span></p>
    <div class="rv-hints">${[1, 2, 3].map(h => `<button type="button" class="fs-btn${rv.stage >= h ? ' on' : ''}" onclick="revHint(${h})"${h > rv.stage + 1 && !finished ? ' disabled' : ''}>ヒント${h}</button>`).join('')}</div>
    <div class="rv-text">${revTexts(q, finished ? 3 : rv.stage)}</div>
    <div class="rv-fig">${(rv.stage || finished) ? revFig(q, finished ? 3 : rv.stage) : ''}</div>
  </div><div class="rv-side">
    <p style="margin:6px 0 0;font-size:15px">${md('あてはまる θ を')}<b>すべて</b>えらぼう</p>
    <div class="rv-angles">${REV_ANGLES.map(a => `<button type="button" class="rv-angle${rv.picked.has(a) ? ' on' : ''}" onclick="revPick(${a})">${a}°</button>`).join('')}</div>
    <div class="fs-ctrl"><button type="button" class="fs-btn primary" onclick="revCheck()">こたえ合わせ</button></div>
    ${rv.res ? `<div class="rv-res ${finished ? 'ok' : 'ng'}">${finished ? '<b>正解</b>　θ = ' + q.ans.map(a => a + '°').join('、') : rv.res}</div>` : ''}
    <div class="fs-nav"><button type="button" class="fs-btn" onclick="revGo(${rv.i - 1})"${rv.i ? '' : ' disabled'}>前の問題</button><button type="button" class="fs-btn${finished ? ' primary' : ''}" onclick="${rv.i === REV.length - 1 ? 'showMenu()' : `revGo(${rv.i + 1})`}">${rv.i === REV.length - 1 ? 'メニューへ' : '次の問題'}</button></div>
  </div></div>`;
}
function revHint(h) { rv.stage = Math.max(rv.stage, h); renderRev(); }
function revPick(a) { if (rv.res === 'ok') return; rv.picked.has(a) ? rv.picked.delete(a) : rv.picked.add(a); rv.res = null; renderRev(); }
function revGo(j) { if (j < 0 || j >= REV.length) return; rv = { i: j, stage: 0, picked: new Set(), res: null, solved: rv.solved }; renderRev(); window.scrollTo(0, 0); }
function revCheck() {
  const q = REV[rv.i], ans = new Set(q.ans), p = [...rv.picked];
  if (!p.length) rv.res = 'θ をえらんでから、こたえ合わせをしよう。';
  else if (p.length === ans.size && p.every(a => ans.has(a))) { rv.res = 'ok'; rv.solved[rv.i] = true; if (Object.keys(rv.solved).length === REV.length) done.rev = true; }
  else if (p.every(a => ans.has(a))) rv.res = 'あてはまる θ は、ほかにもあります。ヒントの図で、点 P がいくつあるか見てみよう。';
  else rv.res = 'あてはまらない角がまざっています。ヒントの図で確かめよう。';
  renderRev();
}
function startRev() {
  document.getElementById('menu').innerHTML = ''; document.getElementById('app').hidden = true; document.getElementById('app').innerHTML = '';
  revGo(0);
}

// ---------------- メニュー ----------------
function showMenu() {
  animTok++;
  document.getElementById('app').hidden = true; document.getElementById('app').innerHTML = ''; document.getElementById('rev').innerHTML = '';
  const item = (m, n, cls) => `<button type="button" class="zm-item ${cls || ''}" onclick="${m.id === 'rev' ? 'startRev()' : `startMode('${m.id}')`}"><span class="n">${n}</span><span><b>${m.name}</b><span class="s">${m.sub}</span></span>${done[m.id] ? '<span class="ok">✓ クリア</span>' : ''}</button>`;
  document.getElementById('menu').innerHTML = `
  <section class="zm-sec"><h2>角度から三角比を求める<small>図の P が回ります。P の座標と r を入れて sin・cos・tan へ</small></h2>
    <div class="zm-list">${item(MODES[0], 1)}${item(MODES[1], 2)}</div></section>
  <section class="zm-sec"><h2>三角比の値から θ を求める<small>問題を読んで、ヒントの図を1つずつ出して考える</small></h2>
    <div class="zm-list">${item({ id: 'rev', name: 'θ を求める', sub: 'sin θ = ½ などを満たす θ（全8問）' }, 3, 'rev')}</div></section>
  <section class="zm-sec"><h2>数学Ⅱの予習<small>180° をこえる角（円で考える）</small></h2>
    <div class="zm-list">${item(MODES[2], 4, 'm2')}${item(MODES[3], 5, 'm2')}</div></section>
  <p class="zm-note">三角比の値をすばやく言えるようにする練習は <a href="sankakuhi-value.html">31. 三角比の値（総合）</a> へ</p>`;
  window.scrollTo(0, 0);
}
showMenu();
</script>
</body></html>
