<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三角比（座標）</title>
<!--
  30. 三角比（座標）
  2026-10-28 先生の確認を受けて作り直し（Claude Code）。
  ・図が動く練習：角度を決めた問題（sin 150° など）。図の中にも 150° と書く。P の座標と半径は書かない（自分でうめる）。
    ヒントで、その角の直角三角形（30°・45°・60°）と辺の比を見せる。カードは 27・28 と同じ仕組み（assets/fill-steps.js）。
  ・θ を求める問題：問題文 → ヒント1（円と直線）→ ヒント2（交点・直角三角形）→ ヒント3（角）と、図に少しずつかきこむ。
  ・「r が 2 でない点」は使わないので消した。
-->

</head><body>
<a class="port-back" href="../index.html">← 教材の一覧へ</a>
<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅰ　図形と計量</small><h1>三角比（座標）</h1></header>
  <div id="menu"></div>
  <div id="app"></div>
  <div id="rev"></div>
</main>
<script src="../assets/fill-steps.js"></script>
<script>
const md = FillSteps.md;
const NAVY = '#1f4e8c', RED = '#c92a2a', GREEN = '#2b8a3e', ORANGE = '#d9480f', PURPLE = '#7048e8';

// 角度ごとの P(x, y)・r・sin・cos・tan
const T = {
  0: ['1', '0', '1', '0', '1', '0'], 30: ['√3', '1', '2', '1/2', '√3/2', '1/√3'], 45: ['1', '1', '√2', '1/√2', '1/√2', '1'],
  60: ['1', '√3', '2', '√3/2', '1/2', '√3'], 90: ['0', '1', '1', '1', '0', 'なし'], 120: ['−1', '√3', '2', '√3/2', '−1/2', '−√3'],
  135: ['−1', '1', '√2', '1/√2', '−1/√2', '−1'], 150: ['−√3', '1', '2', '1/2', '−√3/2', '−1/√3'], 180: ['−1', '0', '1', '0', '−1', '0'],
  210: ['−√3', '−1', '2', '−1/2', '−√3/2', '1/√3'], 225: ['−1', '−1', '√2', '−1/√2', '−1/√2', '1'], 240: ['−1', '−√3', '2', '−√3/2', '−1/2', '√3'],
  270: ['0', '−1', '1', '−1', '0', 'なし'], 300: ['1', '−√3', '2', '−√3/2', '1/2', '−√3'], 315: ['1', '−1', '√2', '−1/√2', '1/√2', '−1'],
  330: ['√3', '−1', '2', '−1/2', '√3/2', '−1/√3'], 360: ['1', '0', '1', '0', '1', '0']
};
const MODES = [
  { id: 'basic', name: '基本の角', sub: '30°・45°・60°・120°・135°・150°', angles: [30, 45, 60, 120, 135, 150] },
  { id: 'axis', name: '軸の上の角', sub: '0°・90°・180°（P が x 軸・y 軸の上）', angles: [0, 90, 180] },
  { id: 'm2a', name: '180° をこえる角', sub: '210°・225°・240°・300°・315°・330°', angles: [210, 225, 240, 300, 315, 330], full: true, m2: true },
  { id: 'm2b', name: '270°・360°', sub: 'P が軸の上（円で考える）', angles: [270, 360], full: true, m2: true }
];
const done = {};   // メニューの「クリア」の印

const num = s => { s = String(s); const neg = s[0] === '−'; s = s.replace('−', ''); const m = s.match(/^(\d*)√(\d+)$/); const v = m ? (+m[1] || 1) * Math.sqrt(+m[2]) : +s; return neg ? -v : v; };
const refOf = d => { d = ((d % 360) + 360) % 360; return d <= 90 ? d : d <= 180 ? 180 - d : d <= 270 ? d - 180 : 360 - d; };
const onAxis = d => d % 90 === 0;

// 図の中の長さ（BIZ UDPGothic の太字。√ は記号の右上から線が中の数字にかぶさる）
function svgNum(x, y, s, color, fs = 16) {
  const m = String(s).match(/^(−?\d*)√(\d+)$/), cw = fs * 0.56;
  if (!m) return `<text x="${x}" y="${y}" text-anchor="middle" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${s}</text>`;
  const cwid = m[1].length * cw, dwid = m[2].length * cw, w = cwid + fs * 0.75 + dwid + 2, x0 = x - w / 2, x1 = x0 + cwid + 1;
  return `<text x="${x0}" y="${y}" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${m[1]}</text>` +
    `<path d="M${x1} ${y - fs * 0.3}L${x1 + fs * 0.18} ${y - fs * 0.4}L${x1 + fs * 0.4} ${y + 1}L${x1 + fs * 0.7} ${y - fs * 0.92}H${x1 + fs * 0.75 + dwid + 2}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>` +
    `<text x="${x1 + fs * 0.75}" y="${y}" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${m[2]}</text>`;
}
const it = (x, y, s, color = '#1f2328', fs = 18, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="STIX Two Text, serif" font-style="italic" font-size="${fs}" fill="${color}">${s}</text>`;
const gtext = (x, y, s, color, fs = 15) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="BIZ UDPGothic, sans-serif" font-weight="700" font-size="${fs}" fill="${color}">${s}</text>`;
const arrow = (x1, y1, x2, y2) => { const a = Math.atan2(y2 - y1, x2 - x1); return `<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#5b6470" stroke-width="1.4"/><path d="M${x2} ${y2}L${x2 - 10 * Math.cos(a - .4)} ${y2 - 10 * Math.sin(a - .4)}L${x2 - 10 * Math.cos(a + .4)} ${y2 - 10 * Math.sin(a + .4)}Z" fill="#5b6470"/>`; };
const zl = (x, y, W, H, html, color) => `<span class="zl" style="left:${(x / W * 100).toFixed(2)}%;top:${(y / H * 100).toFixed(2)}%;color:${color}">${html}</span>`;

// 座標軸と円（半円）。ticks に文字を入れると、目盛りに長さを書く
function axes(W, H, ox, oy, R, full, tick) {
  let s = `<path d="${full ? `M${ox + R} ${oy}A${R} ${R} 0 1 0 ${ox - R} ${oy}A${R} ${R} 0 1 0 ${ox + R} ${oy}` : `M${ox + R} ${oy}A${R} ${R} 0 0 0 ${ox - R} ${oy}`}" fill="none" stroke="#98a2ad" stroke-width="1.6" stroke-dasharray="6 5"/>`;
  s += arrow(14, oy, W - 8, oy) + arrow(ox, full ? H - 8 : oy + 24, ox, 10);
  s += it(W - 12, oy + 20, 'x', '#5b6470', 17) + it(ox + 12, 20, 'y', '#5b6470', 17) + it(ox - (full ? 15 : 12), oy + (full ? 22 : 19), 'O', '#5b6470', 17);
  [[ox + R, oy, 1], [ox - R, oy, 1], [ox, oy - R, 0]].concat(full ? [[ox, oy + R, 0]] : []).forEach(([x, y, h]) => {
    s += h ? `<path d="M${x} ${y - 5}V${y + 5}" stroke="#5b6470" stroke-width="1.4"/>` : `<path d="M${x - 5} ${y}H${x + 5}" stroke="#5b6470" stroke-width="1.4"/>`;
  });
  if (tick) s += svgNum(ox + R, oy + 19, tick, '#5b6470', 14) + svgNum(ox - R - 4, oy + 19, '−' + tick, '#5b6470', 14) + svgNum(ox - 16, oy - R + 5, tick, '#5b6470', 14);
  return s;
}

// 辺 AB の長さを、辺のまん中から（cx, cy）と反対側に置く
function sideNum(A, B, cx, cy, txt, color, fs = 16) {
  const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2; let nx = -(B[1] - A[1]), ny = B[0] - A[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
  if ((cx - mx) * nx + (cy - my) * ny > 0) { nx = -nx; ny = -ny; }
  const k = Math.abs(nx) > .6 ? 18 + String(txt).length * 2 : 13;
  return svgNum(mx + nx * k, my + ny * k + fs * .36, txt, color, fs);
}

// 問題の図：0° から deg まで OP が回る（t が今の角度）
function zahyouFig(deg, t, info) {
  const full = deg > 180, W = 360, H = full ? 330 : 236, ox = 180, oy = full ? 168 : 206, R = 128;
  const a = t * Math.PI / 180, px = ox + R * Math.cos(a), py = oy - R * Math.sin(a), fin = t === deg;
  let s = axes(W, H, ox, oy, R, full), labels = '';
  if (fin && !onAxis(deg)) {
    s += `<path d="M${ox} ${oy}L${px} ${oy}L${px} ${py}Z" fill="#e3ecf7" opacity=".8"/>`;
    s += `<path d="M${px} ${py}V${oy}" stroke="${NAVY}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    const sx = px > ox ? -1 : 1, sy = py < oy ? -1 : 1;
    s += `<path d="M${px + sx * 10} ${oy}V${oy + sy * 10}H${px}" fill="none" stroke="${NAVY}" stroke-width="1.3"/>`;
  }
  if (t > 0) {
    const r0 = t > 180 ? 16 : 24, big = t > 180 ? 1 : 0, e = [ox + r0 * Math.cos(a), oy - r0 * Math.sin(a)];
    s += t >= 359.9 ? `<circle cx="${ox}" cy="${oy}" r="${r0}" fill="none" stroke="${ORANGE}" stroke-width="2.2"/>`
      : `<path d="M${ox + r0} ${oy}A${r0} ${r0} 0 ${big} 0 ${e[0]} ${e[1]}" fill="none" stroke="${ORANGE}" stroke-width="2.2"/>`;
  }
  if (fin) {
    // 角度の文字：弧の外の、二等分線の上（軸にかかるときは少しずらす）
    let m = deg / 2, rr = deg < 60 ? Math.min(70, 25 / Math.sin(deg * Math.PI / 360)) : 46;
    if (deg === 0) { m = 18; rr = 52; } else if (deg === 180) { m = 122; rr = 50; } else if (deg === 360) { m = 125; rr = 50; }
    let lx = ox + rr * Math.cos(m * Math.PI / 180), ly = oy - rr * Math.sin(m * Math.PI / 180);
    if (Math.abs(lx - ox) < 24) lx = ox + (Math.cos(m * Math.PI / 180) < -0.01 ? -24 : 24);   // y 軸にかからない
    if (Math.abs(ly - oy) < 13) ly = oy + (Math.sin(m * Math.PI / 180) < -0.01 ? 13 : -13);  // x 軸にかからない
    s += gtext(lx, ly + 5, deg + '°', ORANGE, 16);
  }
  s += `<path d="M${ox} ${oy}L${px} ${py}" stroke="${RED}" stroke-width="3" stroke-linecap="round"/><circle cx="${px}" cy="${py}" r="4.5" fill="${RED}"/>`;
  if (fin) {
    // P の名前（座標がうまったら P(x, y)）。点から外向きに
    const ux = Math.cos(a), uy = -Math.sin(a), w = info.xy ? 30 + (info.xy.join('').length) * 9 : 14;
    let lx = px + ux * 18 + (Math.abs(ux) > .25 ? Math.sign(ux) * w / 2 : 0), ly = py + uy * 20 + (Math.abs(uy) < .3 ? -14 : 0);
    lx = Math.min(W - w / 2 - 2, Math.max(w / 2 + 2, lx));
    labels += zl(lx, Math.max(12, Math.min(H - 12, ly)), W, H, info.xy ? md(`P(${info.xy[0]}, ${info.xy[1]})`) : md('P'), RED);
    if (info.r) { // 半径がうまったら OP の長さ
      const mx = (ox + px) / 2, my = (oy + py) / 2; let nx = -(py - oy), ny = px - ox; const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
      if (!onAxis(deg) && nx * (px - mx) + ny * (oy - my) > 0) { nx = -nx; ny = -ny; }
      if (onAxis(deg)) { nx = deg % 180 === 0 ? 0 : -1; ny = deg % 180 === 0 ? -1 : 0; }
      s += svgNum(mx + nx * 16, my + ny * 16 + 6, info.r, NAVY, 16);
    }
  }
  return `<div class="zf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${deg}°の動径OP">${s}</svg>${labels}</div>`;
}

// ヒントの図：その角の直角三角形（30°・45°・60°）と辺の比。座標の図と同じ向きにかく
function refTriFig(deg) {
  const d = ((deg % 360) + 360) % 360, ref = refOf(d), [x, y, r] = T[deg];
  const W = 260, H = 170, a = d * Math.PI / 180, L = Math.min(170 / Math.abs(Math.cos(a)), 112 / Math.abs(Math.sin(a)), 160);
  const dx = Math.cos(a) * L, dy = -Math.sin(a) * L;
  const ox = (W - dx) / 2, oy = (H - dy) / 2;
  const O = [ox, oy], Hh = [ox + dx, oy], P = [ox + dx, oy + dy];
  const cx = (O[0] + Hh[0] + P[0]) / 3, cy = (O[1] + Hh[1] + P[1]) / 3;
  let s = `<path d="M${O[0] - 20 * Math.sign(dx || 1)} ${oy}H${Hh[0] + 20 * Math.sign(dx || 1)}" stroke="#98a2ad" stroke-width="1.2"/>`;
  s += `<path d="M${O[0]} ${O[1]}L${Hh[0]} ${Hh[1]}L${P[0]} ${P[1]}Z" fill="#f1f6fc"/>`;
  s += `<path d="M${O[0]} ${O[1]}L${Hh[0]} ${Hh[1]}" stroke="${GREEN}" stroke-width="3.5"/><path d="M${Hh[0]} ${Hh[1]}L${P[0]} ${P[1]}" stroke="${RED}" stroke-width="3.5"/><path d="M${O[0]} ${O[1]}L${P[0]} ${P[1]}" stroke="${NAVY}" stroke-width="3.5"/>`;
  const sx = Math.sign(O[0] - Hh[0]), sy = Math.sign(P[1] - Hh[1]);
  s += `<path d="M${Hh[0] + sx * 10} ${Hh[1]}V${Hh[1] + sy * 10}H${Hh[0]}" fill="none" stroke="#1f2328" stroke-width="1.2"/>`;
  // O の角
  const b0 = dx >= 0 ? 0 : Math.PI, b1 = Math.atan2(-dy, dx), r0 = 22;
  const p0 = [ox + r0 * Math.cos(b0), oy - r0 * Math.sin(b0)], p1 = [ox + r0 * Math.cos(b1), oy - r0 * Math.sin(b1)];
  const diff = Math.atan2(Math.sin(b1 - b0), Math.cos(b1 - b0));
  s += `<path d="M${p0[0]} ${p0[1]}A${r0} ${r0} 0 0 ${diff > 0 ? 0 : 1} ${p1[0]} ${p1[1]}" fill="none" stroke="${ORANGE}" stroke-width="2"/>`;
  const bm = b0 + diff / 2, rl = ref === 60 ? 36 : ref === 45 ? 42 : 50;
  s += gtext(ox + rl * Math.cos(bm), oy - rl * Math.sin(bm) + 5, ref + '°', ORANGE, 14);
  // 辺の長さ（符号はつけない）
  const side = (A, B, txt, color) => sideNum(A, B, cx, cy, txt, color);
  s += side(O, Hh, x.replace('−', ''), GREEN) + side(Hh, P, y.replace('−', ''), RED) + side(O, P, r, NAVY);
  const vn = (Q, n) => { let ux = Q[0] - cx, uy = Q[1] - cy; const l = Math.hypot(ux, uy); return it(Q[0] + ux / l * 14, Q[1] + uy / l * 14 + 6, n, '#1f2328', 16); };
  s += vn(O, 'O') + vn(P, 'P') + vn(Hh, 'H');
  return `<div class="zf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ref}°の直角三角形">${s}</svg></div>`;
}

function problemFor(deg, mode) {
  const [x, y, r, sn, cs, tn] = T[deg];
  const flip = v => (v === '0' || v === 'なし') ? null : v[0] === '−' ? v.slice(1) : '−' + v;
  const NUM = ['−2', '−√3', '−√2', '−1', '0', '1', '√2', '√3', '2'];
  const RAT = ['−√3', '−1', '−√3/2', '−1/√2', '−1/2', '−1/√3', '0', '1/√3', '1/2', '1/√2', '√3/2', '1', '√3', 'なし'];
  const nums = new Set([x, y, r]); [x, y].forEach(v => { const f = flip(v); if (f) nums.add(f); });
  nums.add(r === '2' ? '√2' : '2');
  const rats = new Set([sn, cs, tn]); [sn, cs, tn].forEach(v => { const f = flip(v); if (f && rats.size < 6) rats.add(f); });
  for (const v of ['1/2', '√3/2', '1/√3', '√3', '−1/2', '−√3/2']) if (rats.size < 6) rats.add(v);
  const rows = [`P([${x}], [${y}])`, `r = OP = [${r}]`, `sin ${deg}° = {[y]|[r]} = [${sn}]`, `cos ${deg}° = {[x]|[r]} = [${cs}]`];
  if (tn === 'なし') rows.push(`tan ${deg}° = {[y]|[x]}`, `#x = 0 なので、tan ${deg}° の値は [なし]`);
  else rows.push(`tan ${deg}° = {[y]|[x]} = [${tn}]`);
  return {
    deg, mode, fig: ' ',
    q: `点 P の座標と r を求めて、${deg}° の三角比の値を求めよう。`,
    rows,
    cards: ['x', 'y', 'r', null].concat(NUM.filter(v => nums.has(v)), [null], RAT.filter(v => rats.has(v) && !nums.has(v))),
    ans: `sin ${deg}° = ${tex(sn)}、cos ${deg}° = ${tex(cs)}、tan ${deg}° ${tn === 'なし' ? 'の値はなし' : '= ' + tex(tn)}`
  };
}
function tex(v) { const m = v.match(/^(−?)([^/]+)\/(.+)$/); return m ? m[1] + '{' + m[2] + '|' + m[3] + '}' : v; }

function hint(p, row) {
  const i = p.rows.indexOf(row), d = p.deg, ref = refOf(d);
  if (i === 0) return onAxis(d) ? `${d}° のとき、P は軸の上にあります。この円の半径は 1 です。` :
    `${ref}° の直角三角形で考えよう。P が y 軸より左なら x 座標は −、x 軸より下なら y 座標は − です。`;
  if (i === 1) return onAxis(d) ? 'この円の半径は 1 です。' : '直角三角形の斜辺の長さが r です。';
  if (i === 2) return 'sin = {y|r}（y 座標 ÷ r）です。';
  if (i === 3) return 'cos = {x|r}（x 座標 ÷ r）です。';
  if (i === 4) return 'tan = {y|x}（y 座標 ÷ x 座標）です。';
  return '0 でわることはできません。';
}
function hintFig(p, row) { const i = p.rows.indexOf(row); return (i <= 1 && !onAxis(p.deg)) ? refTriFig(p.deg) : ''; }

// 図：問題がかわったときだけ OP を回す。うめた座標・r は図にもかきこむ
let animKey = null, animTok = 0;
function afterRender(root, p, st) {
  const box = root.querySelector('.fs-fig'); if (!box) return;
  const filled = i => st.fill[i] !== undefined || st.shown;
  const info = { xy: filled(0) && filled(1) ? [st.fill[0] || p.blanks[0].a, st.fill[1] || p.blanks[1].a] : null, r: filled(2) ? p.blanks[2].a : null };
  const key = p.mode + p.deg, tok = ++animTok;
  if (animKey === key || matchMedia('(prefers-reduced-motion: reduce)').matches) { box.innerHTML = zahyouFig(p.deg, p.deg, info); animKey = key; return; }
  animKey = key;
  const t0 = performance.now(), dur = 300 + p.deg * 3.2;
  (function step(now) {
    if (tok !== animTok) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    box.innerHTML = zahyouFig(p.deg, k >= 1 ? p.deg : p.deg * e, info);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function startMode(m) {
  const mode = MODES.find(x => x.id === m);
  document.getElementById('menu').innerHTML = ''; document.getElementById('rev').innerHTML = '';
  const app = document.getElementById('app'); app.hidden = false; animKey = null;
  const problems = mode.angles.map(d => problemFor(d, m));
  let api = null;
  api = FillSteps.mount({
    el: app, problems, hint, hintFig, after: (root, p, st) => { afterRender(root, p, st); if (api) markDone(m, api); },
    tabLabel: p => p.deg + '°', tabPrefix: '', badge: p => p.deg + '°',
    tabsBefore: '<button type="button" class="fs-btn zm-back" onclick="showMenu()">メニュー</button>',
    finalExtra: '<p><button type="button" class="fs-btn" onclick="showMenu()">メニューにもどる</button></p>'
  });
  window.scrollTo(0, 0);
}
function markDone(m, api) { if (api.state().every(s => s.done || s.shown)) done[m] = true; }

// ---------------- θ を求める ----------------
const REV = [
  { f: 'sin', v: '1/2', r: '2', k: '1', ans: [30, 150] },
  { f: 'sin', v: '√3/2', r: '2', k: '√3', ans: [60, 120] },
  { f: 'sin', v: '1/√2', r: '√2', k: '1', ans: [45, 135] },
  { f: 'cos', v: '−1/2', r: '2', k: '−1', ans: [120] },
  { f: 'cos', v: '1/√2', r: '√2', k: '1', ans: [45] },
  { f: 'cos', v: '−√3/2', r: '2', k: '−√3', ans: [150] },
  { f: 'sin', v: '1', r: '1', k: '1', ans: [90] },
  { f: 'sin', v: '0', r: '1', k: '0', ans: [0, 180] }
];
const REV_ANGLES = [0, 30, 45, 60, 90, 120, 135, 150, 180];
let rv = { i: 0, stage: 0, picked: new Set(), res: null, solved: {} };

function revFig(q, stage) {
  const W = 360, H = 250, ox = 180, oy = 214, R = 140, u = R / num(q.r), k = num(q.k), isSin = q.f === 'sin';
  let s = axes(W, H, ox, oy, R, false, q.r), labels = '';
  if (stage >= 1) {
    if (isSin) { const yy = oy - k * u; s += `<path d="M18 ${yy}H${W - 18}" stroke="${ORANGE}" stroke-width="2" stroke-dasharray="7 5"/>`; labels += zl(ox + 36, yy - (k === 0 ? 14 : 13), W, H, md(`y = ${q.k}`), ORANGE); }
    else { const xx = ox + k * u; s += `<path d="M${xx} ${oy + 20}V14" stroke="${ORANGE}" stroke-width="2" stroke-dasharray="7 5"/>`; labels += zl(xx + (k < 0 ? -34 : 34), 22, W, H, md(`x = ${q.k}`), ORANGE); }
  }
  if (stage >= 2) {
    q.ans.forEach((d, j) => {
      const a = d * Math.PI / 180, px = ox + R * Math.cos(a), py = oy - R * Math.sin(a), [x, y] = T[d];
      if (!onAxis(d)) {
        s += `<path d="M${ox} ${oy}L${px} ${oy}L${px} ${py}Z" fill="#e3ecf7" opacity=".85"/>`;
        s += `<path d="M${ox} ${oy}L${px} ${oy}" stroke="${GREEN}" stroke-width="3"/><path d="M${px} ${oy}L${px} ${py}" stroke="${RED}" stroke-width="3"/>`;
        const sx = px > ox ? -1 : 1; s += `<path d="M${px + sx * 9} ${oy}V${oy - 9}H${px}" fill="none" stroke="#1f2328" stroke-width="1.2"/>`;
        s += sideNum([ox, oy], [px, oy], px, py, x.replace('−', ''), GREEN, 15) + sideNum([px, oy], [px, py], ox, oy, y.replace('−', ''), RED, 15);
      }
      s += `<path d="M${ox} ${oy}L${px} ${py}" stroke="${NAVY}" stroke-width="3"/><circle cx="${px}" cy="${py}" r="4.5" fill="${NAVY}"/>`;
      if (!onAxis(d)) s += j ? sideNum([ox, oy], [px, py], ox, py, q.r, NAVY, 15) : sideNum([ox, oy], [px, py], px, oy, q.r, NAVY, 15);
      s += it(px + Math.cos(a) * 16, py - Math.sin(a) * 16 + (onAxis(d) && d !== 90 ? -8 : 4), q.ans.length > 1 ? (j ? 'P′' : 'P') : 'P', NAVY, 17);
    });
  }
  if (stage >= 3) {
    q.ans.forEach((d, j) => {
      const c = j ? PURPLE : ORANGE, r0 = j ? 36 : 24, a = d * Math.PI / 180;
      if (d > 0) s += `<path d="M${ox + r0} ${oy}A${r0} ${r0} 0 0 0 ${ox + r0 * Math.cos(a)} ${oy - r0 * Math.sin(a)}" fill="none" stroke="${c}" stroke-width="2.2"/>`;
      let m = d / 2, rr = j ? 56 : (d < 60 ? Math.min(66, 24 / Math.sin(Math.max(d, 1) * Math.PI / 360)) : 42);
      if (d === 0) { m = 14; rr = 58; } if (d === 180) { m = 118; rr = 56; } if (j && d > 90 && d < 180) { m = 118; rr = 50; }
      s += gtext(ox + rr * Math.cos(m * Math.PI / 180), oy - rr * Math.sin(m * Math.PI / 180) + 5, d + '°', c, 15);
    });
  }
  return `<div class="zf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="θを求める図">${s}</svg>${labels}</div>`;
}
function revTexts(q, stage) {
  const L = q.f === 'sin' ? 'y' : 'x', out = [];
  if (stage >= 1) out.push(`<p><span class="h">ヒント1</span>${md(`${q.f} θ = {${L}|r} = ${tex(q.v)} なので、半径 r = ${q.r} の半円の上で、${L} = ${q.k} となる点 P をさがそう。`)}</p>`);
  if (stage >= 2) out.push(`<p><span class="h">ヒント2</span>${md((q.ans.length > 1 ? '点 P は2つあります。' : '点 P は1つです。') + (onAxis(q.ans[0]) ? 'P は x 軸・y 軸の上にあります。' : '直角三角形の辺の比を見よう。'))}</p>`);
  if (stage >= 3) out.push(`<p><span class="h">ヒント3</span>${md('θ は、x 軸の正の向きから OP までの角です。')}</p>`);
  return out.join('');
}
function renderRev() {
  const q = REV[rv.i], el = document.getElementById('rev');
  const tabs = REV.map((_, j) => `<button type="button" class="fs-tab${j === rv.i ? ' cur' : ''}${rv.solved[j] ? ' done' : ''}" onclick="revGo(${j})">${j + 1}</button>`).join('');
  const finished = rv.res === 'ok';
  el.innerHTML = `<nav class="fs-tabs"><button type="button" class="fs-btn zm-back" onclick="showMenu()">メニュー</button><span>問</span>${tabs}</nav>
  <div class="rv-grid"><div>
    <p class="rv-q"><span class="fs-badge">問${rv.i + 1}</span>${md(`${q.f} θ = ${tex(q.v)}　を満たす θ を求めよ。`)}<span style="font-size:15px">${md('（0° ≦ θ ≦ 180°）')}</span></p>
    <div class="rv-hints">${[1, 2, 3].map(h => `<button type="button" class="fs-btn${rv.stage >= h ? ' on' : ''}" onclick="revHint(${h})"${h > rv.stage + 1 && !finished ? ' disabled' : ''}>ヒント${h}</button>`).join('')}</div>
    <div class="rv-text">${revTexts(q, finished ? 3 : rv.stage)}</div>
    <div class="rv-fig">${(rv.stage || finished) ? revFig(q, finished ? 3 : rv.stage) : ''}</div>
  </div><div class="rv-side">
    <p style="margin:6px 0 0;font-size:15px">${md('あてはまる θ を')}<b>すべて</b>えらぼう</p>
    <div class="rv-angles">${REV_ANGLES.map(a => `<button type="button" class="rv-angle${rv.picked.has(a) ? ' on' : ''}" onclick="revPick(${a})">${a}°</button>`).join('')}</div>
    <div class="fs-ctrl"><button type="button" class="fs-btn primary" onclick="revCheck()">こたえ合わせ</button></div>
    ${rv.res ? `<div class="rv-res ${finished ? 'ok' : 'ng'}">${finished ? '<b>正解</b>　θ = ' + q.ans.map(a => a + '°').join('、') : rv.res}</div>` : ''}
    <div class="fs-nav"><button type="button" class="fs-btn" onclick="revGo(${rv.i - 1})"${rv.i ? '' : ' disabled'}>前の問題</button><button type="button" class="fs-btn${finished ? ' primary' : ''}" onclick="${rv.i === REV.length - 1 ? 'showMenu()' : `revGo(${rv.i + 1})`}">${rv.i === REV.length - 1 ? 'メニューへ' : '次の問題'}</button></div>
  </div></div>`;
}
function revHint(h) { rv.stage = Math.max(rv.stage, h); renderRev(); }
function revPick(a) { if (rv.res === 'ok') return; rv.picked.has(a) ? rv.picked.delete(a) : rv.picked.add(a); rv.res = null; renderRev(); }
function revGo(j) { if (j < 0 || j >= REV.length) return; rv = { i: j, stage: 0, picked: new Set(), res: null, solved: rv.solved }; renderRev(); window.scrollTo(0, 0); }
function revCheck() {
  const q = REV[rv.i], ans = new Set(q.ans), p = [...rv.picked];
  if (!p.length) rv.res = 'θ をえらんでから、こたえ合わせをしよう。';
  else if (p.length === ans.size && p.every(a => ans.has(a))) { rv.res = 'ok'; rv.solved[rv.i] = true; if (Object.keys(rv.solved).length === REV.length) done.rev = true; }
  else if (p.every(a => ans.has(a))) rv.res = 'あてはまる θ は、ほかにもあります。ヒントの図で、点 P がいくつあるか見てみよう。';
  else rv.res = 'あてはまらない角がまざっています。ヒントの図で確かめよう。';
  renderRev();
}
function startRev() {
  document.getElementById('menu').innerHTML = ''; document.getElementById('app').hidden = true; document.getElementById('app').innerHTML = '';
  revGo(0);
}

// ---------------- メニュー ----------------
function showMenu() {
  animTok++;
  document.getElementById('app').hidden = true; document.getElementById('app').innerHTML = ''; document.getElementById('rev').innerHTML = '';
  const item = (m, n, cls) => `<button type="button" class="zm-item ${cls || ''}" onclick="${m.id === 'rev' ? 'startRev()' : `startMode('${m.id}')`}"><span class="n">${n}</span><span><b>${m.name}</b><span class="s">${m.sub}</span></span>${done[m.id] ? '<span class="ok">✓ クリア</span>' : ''}</button>`;
  document.getElementById('menu').innerHTML = `
  <section class="zm-sec"><h2>角度から三角比を求める<small>図の P が回ります。P の座標と r を入れて sin・cos・tan へ</small></h2>
    <div class="zm-list">${item(MODES[0], 1)}${item(MODES[1], 2)}</div></section>
  <section class="zm-sec"><h2>三角比の値から θ を求める<small>問題を読んで、ヒントの図を1つずつ出して考える</small></h2>
    <div class="zm-list">${item({ id: 'rev', name: 'θ を求める', sub: 'sin θ = ½ などを満たす θ（全8問）' }, 3, 'rev')}</div></section>
  <section class="zm-sec"><h2>数学Ⅱの予習<small>180° をこえる角（円で考える）</small></h2>
    <div class="zm-list">${item(MODES[2], 4, 'm2')}${item(MODES[3], 5, 'm2')}</div></section>
  <p class="zm-note">三角比の値をすばやく言えるようにする練習は <a href="sankakuhi-value.html">31. 三角比の値（総合）</a> へ</p>`;
  window.scrollTo(0, 0);
}
showMenu();
</script>
</body></html>
