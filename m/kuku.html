<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <!--
    04. 九九の練習（九九フラッシュカード）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../assets/port.css">
  <script src="../assets/port.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九フラッシュカード</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100%;
            display: flex;
            flex-direction: column;   /* 【ブラッシュアップ】上が切れないように、上から並べる */
            align-items: center;
        }

        html {
            height: 100%;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            margin: auto 0;   /* 【ブラッシュアップ】画面に収まるときだけ縦まん中に */
        }

        .title {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 15px;
            padding: 40px;
            margin: 30px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: scale(1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .question {
            font-size: 3rem;
            color: #2d3748;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .answer-input {
            font-size: 2rem;
            padding: 15px 20px;
            border: 3px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            width: 120px;
            margin: 0 10px;
            transition: border-color 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px 10px;
            transition: transform 0.2s ease;
            font-weight: bold;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .next-btn {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px 10px;
            transition: transform 0.2s ease;
            font-weight: bold;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.4);
        }

        .feedback {
            font-size: 1.5rem;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .correct {
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            color: #22543d;
            animation: bounce 0.6s ease;
        }

        .incorrect {
            background: linear-gradient(135deg, #fed7d7 0%, #feb2b2 100%);
            color: #742a2a;
        }

        .score {
            font-size: 1.2rem;
            color: #4a5568;
            margin-bottom: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .celebration {
            font-size: 3rem;
            margin: 10px 0;
            animation: spin 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 20%, 60%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            80% { transform: translateY(-5px); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .level-select {
            text-align: center;
        }

        .character {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        .level-select h2 {
            color: #4a5568;
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .level-btn {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border: none;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .level-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .level-btn.special {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }

        .level-number {
            font-size: 2rem;
            font-weight: bold;
            color: #2d3748;
        }

        .level-btn.special .level-number {
            color: white;
        }

        .level-name {
            font-size: 1rem;
            color: #4a5568;
            margin: 5px 0;
        }

        .level-btn.special .level-name {
            color: white;
        }

        .level-character {
            font-size: 2rem;
            margin-top: 5px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .back-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: #cbd5e0;
        }

        .current-level {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a5568;
        }

        #current-level-character {
            font-size: 1.5rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }

            .title {
                font-size: 2rem;
            }

            .question {
                font-size: 2.5rem;
            }

            .answer-input {
                font-size: 1.5rem;
                width: 100px;
            }
        }

        /* 【ブラッシュアップ】 */
        .port-back { max-width: 500px; width: 100%; }
        .completion-nav { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .completion-nav a { color: #718096; margin-top: 8px; }

        /* 【ブラッシュアップ】スマホ用の表示（画面の幅が 600px 以下のときだけ切り替わる） */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .container { padding: 16px 12px; margin: 0; }
            .title { font-size: min(2rem, 6.6vw); white-space: nowrap; margin: 4px 0 16px; }
            .level-select h2 { font-size: min(1.5rem, 6vw); margin-bottom: 16px; white-space: nowrap; }
            .character { font-size: 3rem; margin-bottom: 8px; }
            .level-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .level-btn { padding: 12px 8px; }
            .card { padding: 24px 12px; margin: 16px 0; }
            .question { font-size: min(2.8rem, 12vw); margin-bottom: 20px; }
            .answer-input { font-size: 2rem; width: 130px; }
            .submit-btn, .next-btn { font-size: 1.25rem; padding: 14px 26px; margin: 16px 6px 4px; }
            .feedback { font-size: 1.3rem; padding: 14px; }
            .game-header { padding: 10px; }
            .score { font-size: 1.05rem; padding: 10px; }
        }
    </style>
  <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    .container { padding: 32px 28px; }
    .title { font-size: min(2.2rem, 6.4vw); white-space: nowrap; }
    .level-select h2 { color: var(--u-title-dark); }
    .level-btn .level-number { color: var(--u-title); }
    .level-btn .level-name { color: var(--u-ink); font-weight: 700; }
    .level-btn.special .level-number, .level-btn.special .level-name { color: #fff; }
    .card { background: var(--u-soft-yellow) !important; border: 4px dashed #fde68a; box-shadow: none; }
    .card:hover { transform: none; }
    .question { color: var(--u-ink); }
    .game-header, .score { background: #f8fafc; border: 2px solid var(--u-line); border-radius: 20px; color: var(--u-ink); }
    .current-level { color: var(--u-ink); }
    .back-btn { font-weight: 700; padding: 8px 14px; }
    .feedback { border: 3px solid transparent; border-radius: 20px; }
    .completion-nav a { color: var(--u-sub); }
    /* 【ブラッシュアップ】スコアを1行に・正誤の表示を問題のすぐ下に・まちがえた問題の一覧 */
    .score-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-weight: 700; }
    .card .feedback { margin: 0 0 14px; padding: 10px 12px; font-size: 1.25rem; }
    .card .feedback .celebration { font-size: 2rem; margin: 0; }
    .missed-box { margin: 12px 0 0; padding: 12px; background: var(--u-soft-blue); border: 2px solid var(--u-soft-blue-line); border-radius: 18px; color: var(--u-ink); font-weight: 700; }
    .missed-box:empty { display: none; }
    .missed-title { color: var(--u-title); margin-bottom: 6px; }
    .missed-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 1.2rem; }
    @media (max-width: 600px) { .container { padding: 16px 12px; } .card .feedback { font-size: 1.1rem; } }
  
  </style>
</head>
<body class="u-theme">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container">
        <h1 class="title">🌟 九九フラッシュカード 🌟</h1>

        <!-- レベル選択画面 -->
        <div id="level-select" class="level-select">
            <div class="character">🦸‍♂️</div>
            <h2>きみのレベルをえらぼう！</h2>
            <div class="level-grid">
                <button class="level-btn" onclick="showModeSelect(1)">
                    <div class="level-number">1</div>
                    <div class="level-name">1のだん</div>
                    <div class="level-character">🚀</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(2)">
                    <div class="level-number">2</div>
                    <div class="level-name">2のだん</div>
                    <div class="level-character">🦁</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(3)">
                    <div class="level-number">3</div>
                    <div class="level-name">3のだん</div>
                    <div class="level-character">🐉</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(4)">
                    <div class="level-number">4</div>
                    <div class="level-name">4のだん</div>
                    <div class="level-character">🦅</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(5)">
                    <div class="level-number">5</div>
                    <div class="level-name">5のだん</div>
                    <div class="level-character">🐺</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(6)">
                    <div class="level-number">6</div>
                    <div class="level-name">6のだん</div>
                    <div class="level-character">🦈</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(7)">
                    <div class="level-number">7</div>
                    <div class="level-name">7のだん</div>
                    <div class="level-character">🐅</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(8)">
                    <div class="level-number">8</div>
                    <div class="level-name">8のだん</div>
                    <div class="level-character">🦖</div>
                </button>
                <button class="level-btn" onclick="showModeSelect(9)">
                    <div class="level-number">9</div>
                    <div class="level-name">9のだん</div>
                    <div class="level-character">🤖</div>
                </button>
                <button class="level-btn special" onclick="startLevel(0, 'random')">
                    <div class="level-number">🌟</div>
                    <div class="level-name">チャンピオン</div>
                    <div class="level-character">👑</div>
                </button>
                <!-- 【ブラッシュアップ】高校の計算（因数分解・約分・平方根）につなぐ練習を追加 -->
                <button class="level-btn" onclick="startLevel(10, 'random')">
                    <div class="level-number">🔁</div>
                    <div class="level-name">逆九九（□×7＝56）</div>
                    <div class="level-character">🧩</div>
                </button>
                <button class="level-btn" onclick="startLevel(11, 'random')">
                    <div class="level-number">x²</div>
                    <div class="level-name">11〜19 の 2 乗</div>
                    <div class="level-character">🏔️</div>
                </button>
            </div>
        </div>

        <!-- モード選択画面 -->
        <div id="mode-select" class="level-select hidden">
            <div class="character" id="mode-character">🚀</div>
            <h2 id="mode-title">1のだん - モードをえらぼう！</h2>
            <div class="level-grid">
                <button class="level-btn" onclick="startLevel(selectedLevel, 'sequential')">
                    <div class="level-number">📚</div>
                    <div class="level-name">じゅんばん</div>
                    <div class="level-character">×1, ×2, ×3...</div>
                </button>
                <button class="level-btn" onclick="startLevel(selectedLevel, 'random')">
                    <div class="level-number">🎲</div>
                    <div class="level-name">ランダム</div>
                    <div class="level-character">×3, ×1, ×7...</div>
                </button>
            </div>
            <button class="back-btn" onclick="backToLevelSelect()" style="margin-top: 20px;">← もどる</button>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="hidden">
            <div class="game-header">
                <button class="back-btn" onclick="backToLevelSelect()">← もどる</button>
                <div class="current-level">
                    <span id="current-level-character">🚀</span>
                    <span id="current-level-name">1のだん</span>
                </div>
            </div>

            <!-- 【ブラッシュアップ】4 行あったスコアを 1 行に（スマホで問題と入力欄が下に押し出されていた） -->
            <div class="score score-line">
                <span>問題 <span id="question-progress">1</span>/<span id="total-questions">9</span></span>
                <span>正解 <span id="correct-count">0</span>/<span id="total-count">0</span>（<span id="accuracy">0</span>%）</span>
                <span>⏱️ <span id="timer">00:00</span></span>
            </div>

            <div class="card">
                <div id="chant" class="hidden" style="font-size: 1.5rem; color: #666; margin-bottom: 15px;"></div>
                <div class="question" id="question">1 × 1 = ?</div>
                <!-- 【ブラッシュアップ】正誤と正しい答えは、問題のすぐ下に出す（元はカードの下で、スマホではキーボードにかくれた） -->
                <div id="feedback" class="feedback hidden"></div>
                <div>
                    <input type="number" id="answer-input" class="answer-input" placeholder="?" min="0" max="400" inputmode="numeric" pattern="[0-9]*" enterkeyhint="go">
                </div>
                <div>
                    <button class="submit-btn" id="submit-btn" onclick="checkAnswer()">こたえる！</button>
                    <button class="next-btn hidden" id="next-btn" onclick="nextQuestion()">つぎの問題</button>
                </div>
            </div>
        </div>

        <!-- 完了画面 -->
        <div id="completion-screen" class="level-select hidden">
            <div class="character" id="completion-character">🎉</div>
            <h2 id="completion-title">おめでとう！</h2>
            <div id="completion-message" class="card">
                <div style="font-size: 2rem; margin-bottom: 20px;">🏆 すごい！すごい！ 🏆</div>
                <div style="font-size: 1.5rem; margin-bottom: 15px;">きみは本当にすばらしい！</div>
                <div id="completion-stats" style="font-size: 1.2rem; color: #4a5568;"></div>
            </div>
            <!-- 【ブラッシュアップ】まちがえた問題の一覧 -->
            <div id="missed-box" class="missed-box"></div>
            <!-- 【ブラッシュアップ】「つぎのだん」と「ほかの教材」を選べるようにした -->
            <div class="completion-nav" style="margin-top: 30px;">
                <button class="submit-btn" id="retry-missed-btn" onclick="retryMissed()">まちがえた問題だけもう一度</button>
                <button class="submit-btn" id="next-level-btn" onclick="goNextLevel()">つぎのだんへ ▶</button>
                <button class="submit-btn" onclick="restartLevel()">もういちどちょうせん</button>
                <button class="next-btn" onclick="backToLevelSelect()">べつのレベルにちょうせん</button>
                <a href="../remake.html">ほかの教材をえらぶ</a>
            </div>
        </div>
    </div>

    <script>
        let currentQuestion = {};
        let correctCount = 0;
        let totalCount = 0;
        let currentLevel = 1;
        let currentMode = 'random';
        let selectedLevel = 1;
        let questionQueue = [];
        let currentQuestionIndex = 0;
        let startTime = 0;
        let timerInterval = null;

        const levelData = {
            1: { name: '1のだん', character: '🚀' },
            2: { name: '2のだん', character: '🦁' },
            3: { name: '3のだん', character: '🐉' },
            4: { name: '4のだん', character: '🦅' },
            5: { name: '5のだん', character: '🐺' },
            6: { name: '6のだん', character: '🦈' },
            7: { name: '7のだん', character: '🐅' },
            8: { name: '8のだん', character: '🦖' },
            9: { name: '9のだん', character: '🤖' },
            0: { name: 'チャンピオン', character: '👑' },
            10: { name: '逆九九', character: '🧩' },          // 【ブラッシュアップ】
            11: { name: '11〜19の2乗', character: '🏔️' }     // 【ブラッシュアップ】
        };

        const celebrations = ['🎉', '⭐', '🌟', '✨', '🎊', '🏆', '👏', '🎈'];
        const encouragements = [
            'すごい！せいかい！',
            'やったね！かんぺき！',
            'さすが！てんさい！',
            'すばらしい！',
            'かっこいい！',
            'すてき！よくできました！',
            'ばんざい！せいかい！',
            'きみはすごいね！'
        ];

        const tryAgainMessages = [
            'だいじょうぶ！もういちどやってみよう！',
            'おしい！つぎはできるよ！',
            'がんばって！もういちど！',
            'あきらめないで！やってみよう！',
            'つぎはぜったいできる！'
        ];

        function getMultiplicationChant(num1, num2) {
            const chants = {
                '1': ['いんいちが', 'いんにが', 'いんさんが', 'いんしが', 'いんごが', 'いんろくが', 'いんしちが', 'いんはちが', 'いんくが'],
                '2': ['にいちが', 'ににんが', 'にさんが', 'にしが', 'にご', 'にろく', 'にしち', 'にはち', 'にく'],
                '3': ['さんいちが', 'さんにが', 'さざんが', 'さんし', 'さんご', 'さぶろく', 'さんしち', 'さんぱ', 'さんく'],
                '4': ['しいちが', 'しにが', 'しさん', 'しし', 'しご', 'しろく', 'ししち', 'しは', 'しく'],
                '5': ['ごいちが', 'ごに', 'ごさん', 'ごし', 'ごご', 'ごろく', 'ごしち', 'ごは', 'ごっく'],
                '6': ['ろくいちが', 'ろくに', 'ろくさん', 'ろくし', 'ろくご', 'ろくろく', 'ろくしち', 'ろくは', 'ろっく'],
                '7': ['しちいちが', 'しちに', 'しちさん', 'しちし', 'しちご', 'しちろく', 'しちしち', 'しちは', 'しちく'],
                '8': ['はちいちが', 'はちに', 'はちさん', 'はちし', 'はちご', 'はちろく', 'はちしち', 'はっぱ', 'はっく'],
                '9': ['くいちが', 'くに', 'くさん', 'くし', 'くご', 'くろく', 'くしち', 'くは', 'くく']
            };

            return chants[num1.toString()][num2 - 1];
        }

        function showModeSelect(level) {
            selectedLevel = level;
            document.getElementById('level-select').classList.add('hidden');
            document.getElementById('mode-select').classList.remove('hidden');

            // モード選択画面の情報を更新
            document.getElementById('mode-character').textContent = levelData[level].character;
            document.getElementById('mode-title').textContent = `${levelData[level].name} - モードをえらぼう！`;
        }

        function startLevel(level, mode, customQueue) {
            currentLevel = level;
            currentMode = mode;
            correctCount = 0;
            totalCount = 0;
            currentQuestionIndex = 0;
            missed = [];   // 【ブラッシュアップ】

            // 問題キューを生成（【ブラッシュアップ】「まちがえた問題だけもう一度」のときは、その問題）
            if (customQueue) questionQueue = customQueue; else generateQuestionQueue();

            // 画面を切り替え
            document.getElementById('level-select').classList.add('hidden');
            document.getElementById('mode-select').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('completion-screen').classList.add('hidden');

            // 現在のレベル情報を更新
            document.getElementById('current-level-character').textContent = levelData[level].character;
            document.getElementById('current-level-name').textContent = levelData[level].name;

            // 問題数を更新
            const totalQuestions = questionQueue.length;   // 【ブラッシュアップ】レベルによって問題数がちがうので、実際の数を出す
            document.getElementById('total-questions').textContent = totalQuestions;

            // タイマー開始
            startTimer();

            updateScore();
            generateQuestion();
        }

        function generateQuestionQueue() {
            questionQueue = [];

            // 【ブラッシュアップ】逆九九：□ × 7 = 56 の □ をこたえる（2〜9 の段から 20 問）
            if (currentLevel === 10) {
                const pairs = [];
                for (let a = 2; a <= 9; a++) for (let b = 2; b <= 9; b++) pairs.push([a, b]);
                for (let i = pairs.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pairs[i], pairs[j]] = [pairs[j], pairs[i]]; }
                pairs.slice(0, 20).forEach(([a, b]) => {
                    const left = Math.random() < 0.5;
                    questionQueue.push({ num1: a, num2: b, answer: a,
                        text: left ? `□ × ${b} = ${a * b}` : `${b} × □ = ${a * b}`,
                        label: left ? `${a} × ${b} = ${a * b}` : `${b} × ${a} = ${a * b}` });
                });
                return;
            }
            // 【ブラッシュアップ】11〜19 の 2 乗（平方根や因数分解でよく使う）
            if (currentLevel === 11) {
                for (let n = 11; n <= 19; n++) questionQueue.push({ num1: n, num2: n, answer: n * n, text: `${n}² = ?`, label: `${n}² = ${n * n}` });
                for (let i = questionQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [questionQueue[i], questionQueue[j]] = [questionQueue[j], questionQueue[i]]; }
                return;
            }

            if (currentLevel === 0) {
                // チャンピオンレベル：81問すべて
                for (let i = 1; i <= 9; i++) {
                    for (let j = 1; j <= 9; j++) {
                        questionQueue.push({ num1: i, num2: j, answer: i * j });
                    }
                }
                // ランダムにシャッフル
                for (let i = questionQueue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questionQueue[i], questionQueue[j]] = [questionQueue[j], questionQueue[i]];
                }
            } else {
                // 各段：9問
                for (let i = 1; i <= 9; i++) {
                    questionQueue.push({
                        num1: currentLevel,
                        num2: i,
                        answer: currentLevel * i
                    });
                }

                if (currentMode === 'random') {
                    // ランダムにシャッフル
                    for (let i = questionQueue.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [questionQueue[i], questionQueue[j]] = [questionQueue[j], questionQueue[i]];
                    }
                }
                // sequentialの場合はそのまま（×1, ×2, ×3...の順番）
            }
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function backToLevelSelect() {
            stopTimer();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('mode-select').classList.add('hidden');
            document.getElementById('completion-screen').classList.add('hidden');
            document.getElementById('level-select').classList.remove('hidden');
        }

        function restartLevel() {
            startLevel(currentLevel, currentMode);
        }

        // 【ブラッシュアップ】まちがえた問題だけもう一度
        function retryMissed() {
            const q = missed.map(m => ({ num1: m.num1, num2: m.num2, answer: m.answer, text: m.text, label: m.label }));
            for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
            startLevel(currentLevel, currentMode, q);
        }

        // 【ブラッシュアップ】つぎのだんへ（9のだんのつぎはチャンピオン）
        function goNextLevel() {
            if (currentLevel === 0 || currentLevel >= 10) { backToLevelSelect(); return; }
            if (currentLevel === 9) startLevel(0, 'random');
            else startLevel(currentLevel + 1, currentMode);
        }

        function generateQuestion() {
            if (currentQuestionIndex >= questionQueue.length) {
                // 全問題完了
                showCompletionScreen();
                return;
            }

            currentQuestion = questionQueue[currentQuestionIndex];

            // 【ブラッシュアップ】逆九九・2 乗は問題の文を持っている
            document.getElementById('question').textContent = currentQuestion.text || `${currentQuestion.num1} × ${currentQuestion.num2} = ?`;
            document.getElementById('total-questions').textContent = questionQueue.length;
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();

            // 九九の読み方を表示（順番モードのみ）
            const chantDiv = document.getElementById('chant');
            if (currentMode === 'sequential' && currentLevel !== 0) {
                const chant = getMultiplicationChant(currentQuestion.num1, currentQuestion.num2);
                chantDiv.textContent = chant;
                chantDiv.classList.remove('hidden');
            } else {
                chantDiv.classList.add('hidden');
            }

            // 進捗を更新
            document.getElementById('question-progress').textContent = currentQuestionIndex + 1;

            // ボタンとフィードバックをリセット
            document.getElementById('submit-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('feedback').classList.add('hidden');
        }

        function showCompletionScreen() {
            stopTimer();

            // 画面を切り替え
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('completion-screen').classList.remove('hidden');

            // 完了メッセージを設定
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const timeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const accuracy = Math.round((correctCount / totalCount) * 100);

            let completionMessage = '';
            let character = '';

            if (currentLevel === 0) {
                // チャンピオンレベル完了
                character = '👑🎉🏆';
                completionMessage = `
                    <div style="font-size: 2.5rem; margin-bottom: 20px;">🏆 チャンピオン！ 🏆</div>
                    <div style="font-size: 2rem; margin-bottom: 15px;">きみは九九マスター！</div>
                    <div style="font-size: 1.8rem; margin-bottom: 15px;">すごい！すごい！すごい！</div>
                    <div style="font-size: 1.5rem; margin-bottom: 15px;">${missed.length === 0 ? '81問ぜんぶ一発でせいかい！' : '81問さいごまでやりきった！'}</div>
                    <div style="font-size: 1.3rem; color: #4a5568;">
                        かかった時間: ${timeStr}<br>
                        正解率: ${accuracy}%<br>
                        きみは本当にすばらしい！
                    </div>
                `;
            } else {
                // 各段完了
                character = levelData[currentLevel].character + '🎉';
                completionMessage = `
                    <div style="font-size: 2rem; margin-bottom: 20px;">🎉 ${levelData[currentLevel].name} かんりょう！ 🎉</div>
                    <div style="font-size: 1.5rem; margin-bottom: 15px;">すごい！すごい！</div>
                    <div style="font-size: 1.3rem; margin-bottom: 15px;">きみは本当にがんばった！</div>
                    <div style="font-size: 1.2rem; color: #4a5568;">
                        かかった時間: ${timeStr}<br>
                        正解率: ${accuracy}%<br>
                        つぎのレベルもがんばろう！
                    </div>
                `;
            }

            document.getElementById('completion-character').textContent = character;
            // 【ブラッシュアップ】つぎのだんのボタンの文字
            const nb = document.getElementById('next-level-btn');
            nb.textContent = currentLevel === 9 ? 'チャンピオンにちょうせん ▶' : 'つぎのだんへ ▶';
            nb.style.display = (currentLevel === 0 || currentLevel >= 10) ? 'none' : '';
            // 【ブラッシュアップ】まちがえた問題の一覧と「まちがえた問題だけもう一度」
            const missBox = document.getElementById('missed-box');
            missBox.innerHTML = missed.length
                ? '<div class="missed-title">まちがえた問題（おぼえなおそう）</div><div class="missed-list">' + missed.map(q => '<span>' + q.label + '</span>').join('') + '</div>'
                : '🎯 ぜんぶ一発でせいかい！';
            document.getElementById('retry-missed-btn').style.display = missed.length ? '' : 'none';
            document.getElementById('completion-message').innerHTML = completionMessage;
        }

        function checkAnswer() {
            // 【ブラッシュアップ】元は何も入れずに押すと「まちがい」に数えられ、答えまで出てしまった。
            //   全角の数字（「１２」）も受け付ける。
            const raw = document.getElementById('answer-input').value.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).trim();
            if (raw === '' || isNaN(parseInt(raw))) { document.getElementById('answer-input').focus(); return; }
            if (document.getElementById('submit-btn').classList.contains('hidden')) return;
            const userAnswer = parseInt(raw);
            const feedbackDiv = document.getElementById('feedback');
            
            totalCount++;

            if (userAnswer === currentQuestion.answer) {
                correctCount++;
                const celebration = celebrations[Math.floor(Math.random() * celebrations.length)];
                const encouragement = encouragements[Math.floor(Math.random() * encouragements.length)];

                feedbackDiv.innerHTML = `
                    <div class="celebration">${celebration}</div>
                    <div>${encouragement}</div>
                `;
                feedbackDiv.className = 'feedback correct';

                document.getElementById('submit-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
                lastCorrectAt = Date.now();
                // 【ブラッシュアップ】正解したら少し待って自動で次へ（元は毎回「つぎの問題」を押す必要があった）
                autoNextTimer = setTimeout(() => { lastCorrectAt = 0; nextQuestion(); }, 800);
            } else {
                const tryAgain = tryAgainMessages[Math.floor(Math.random() * tryAgainMessages.length)];
                feedbackDiv.innerHTML = `
                    <div>😊 ${tryAgain}</div>
                    <div>せいかいは ${currentQuestion.answer} だよ！</div>
                `;
                feedbackDiv.className = 'feedback incorrect';

                // 【ブラッシュアップ】まちがえた問題は、さいごにもう一度出す（1 問につき 1 回）。完了画面の一覧にも出す
                const qLabel = currentQuestion.label || `${currentQuestion.num1} × ${currentQuestion.num2} = ${currentQuestion.answer}`;
                if (!currentQuestion.retry) {
                    questionQueue.push(Object.assign({}, currentQuestion, { retry: true, label: qLabel }));
                    document.getElementById('total-questions').textContent = questionQueue.length;
                }
                if (!missed.some(q => q.label === qLabel)) missed.push(Object.assign({}, currentQuestion, { label: qLabel }));

                // 間違えた場合は再挑戦できるようにボタンを残す
                document.getElementById('answer-input').value = '';
                document.getElementById('answer-input').focus();
            }

            feedbackDiv.classList.remove('hidden');
            updateScore();
        }

        let lastCorrectAt = 0;
        let autoNextTimer = null;
        let missed = [];   // 【ブラッシュアップ】まちがえた問題（完了画面に出す・もう一度に使う）
        function nextQuestion() {
            if (Date.now() - lastCorrectAt < 400) return;   // 【ブラッシュアップ】2 度押しよけ
            if (!document.getElementById('submit-btn').classList.contains('hidden')) return;   // 【ブラッシュアップ】まだ答えていないときは進まない
            clearTimeout(autoNextTimer);
            currentQuestionIndex++;
            generateQuestion();
        }

        function updateScore() {
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-count').textContent = totalCount;

            const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy;
        }

        // 【ブラッシュアップ】「こたえる！」「つぎの問題」を押しても入力欄からフォーカスを外さない（スマホでキーボードが閉じないように）
        ['submit-btn', 'next-btn'].forEach(id => document.getElementById(id).addEventListener('mousedown', (e) => e.preventDefault()));

        // エンターキーで回答
        document.getElementById('answer-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (!document.getElementById('submit-btn').classList.contains('hidden')) {
                    checkAnswer();
                } else {
                    nextQuestion();
                }
            }
        });

        // 初期化：レベル選択画面を表示
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".title": "u-title",
    ".level-btn:not(.special)": "u-choice",
    ".level-btn.special": "u-btn",
    ".back-btn": "u-btn u-btn-plain",
    ".answer-input": "u-input",
    ".submit-btn": "u-btn",
    ".next-btn": "u-btn u-btn-blue",
    ".feedback.correct": "u-ok",
    ".feedback.incorrect": "u-ng"
  });
</script>
</body>
</html>
