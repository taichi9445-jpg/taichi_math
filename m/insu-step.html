  <script>
    // 問題パターンをカテゴリ別に分類
    // 【ブラッシュアップ】（2 回目）元は「ペアが3個以下」などの名前と中身が合っておらず、1 問目に 6 組（12 欄）の問題が
    //   出ることもあった。ペアの数が少ない順に並べ直し、⑥ 定数が大きい負の数、⑦ 文字 2 種類 を足して 7 問にした。
    //   式の文字列は数から作る（書きまちがいが起きないように）。答えは node で検算済み。
    function makeFormula(type, m, a) {
      const tv = type === 'two_var';
      let s = 'x²';
      if (a !== 0) s += (a > 0 ? ' + ' : ' − ') + (Math.abs(a) === 1 ? '' : Math.abs(a)) + (tv ? 'xy' : 'x');
      s += (m > 0 ? ' + ' : ' − ') + (tv && Math.abs(m) === 1 ? '' : Math.abs(m)) + (tv ? 'y²' : '');
      return s;
    }
    const P = (type, multiply, add, factorA, factorB) => ({ type, formula: makeFormula(type, multiply, add), multiply, add, factorA, factorB });
    const problemCategories = {
      // ① ペアが 2 組
      pair2: [P('two_factor', 2, 3, 1, 2), P('two_factor', 2, -3, -1, -2), P('two_factor', -3, 2, -1, 3), P('two_factor', -3, -2, -3, 1), P('two_factor', 3, 4, 1, 3), P('two_factor', 3, -4, -1, -3)],
      // ② ペアが 4 組
      pair4: [P('two_factor', 6, 5, 2, 3), P('two_factor', 6, -5, -2, -3), P('two_factor', -6, 5, -1, 6), P('two_factor', -6, -5, -6, 1), P('two_factor', -6, 1, -2, 3),
              P('two_factor', 8, 6, 2, 4), P('two_factor', 8, -6, -2, -4), P('two_factor', 10, 7, 2, 5), P('two_factor', 10, -7, -2, -5), P('two_factor', 15, -8, -3, -5)],
      // ③ (x+a)(x−a) の差の平方
      difference: [P('difference', -9, 0, -3, 3), P('difference', -4, 0, -2, 2), P('difference', -25, 0, -5, 5), P('difference', -16, 0, -4, 4), P('difference', -1, 0, -1, 1)],
      // ④ ペアが 6 組
      pair6: [P('two_factor', 12, 7, 3, 4), P('two_factor', 12, -7, -3, -4), P('two_factor', 12, -8, -2, -6), P('two_factor', 12, 8, 2, 6),
              P('two_factor', 18, 9, 3, 6), P('two_factor', 18, -9, -3, -6), P('two_factor', 18, -11, -2, -9)],
      // ⑤ (x+a)² の完全平方
      perfectSquare: [P('perfect_square', 9, 6, 3, 3), P('perfect_square', 16, -8, -4, -4), P('perfect_square', 4, 4, 2, 2), P('perfect_square', 25, -10, -5, -5), P('perfect_square', 1, 2, 1, 1)],
      // ⑥ 定数が大きい負の数（符号のちがう組を見つける）
      bigNegative: [P('two_factor', -12, -1, -4, 3), P('two_factor', -12, 1, -3, 4), P('two_factor', -20, 1, -4, 5), P('two_factor', -20, -1, -5, 4), P('two_factor', -18, 3, -3, 6), P('two_factor', -18, -7, -9, 2)],
      // ⑦ 文字 2 種類（y² の係数と xy の係数で考える）
      twoVar: [P('two_var', 6, 5, 2, 3), P('two_var', -6, -1, -3, 2), P('two_var', -8, 2, -2, 4), P('two_var', 12, -7, -3, -4), P('two_var', -12, 1, -3, 4)]
    };
    const ORDER = ['pair2', 'pair4', 'difference', 'pair6', 'perfectSquare', 'bigNegative', 'twoVar'];
    const TOTAL = ORDER.length;

    // 【ブラッシュアップ】名前：12「因数分解の練習（因数分解マスター Pro）」とかぶっていた
    const defaultConfig = { main_title: '🧮 因数分解ステップ学習' };
    let currentProblems = [];
    let currentProblemIndex = 0;
    let currentProblem = null;
    let signStateA = '+';
    let signStateB = '+';

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
        },
        mapToCapabilities: () => ({ recolorables: [], borderables: [], fontEditable: undefined, fontSizeable: undefined }),
        mapToEditPanelValues: (config) => new Map([['main_title', config.main_title || defaultConfig.main_title]])
      });
    }

    function selectProblems() {
      // 各カテゴリからランダムに1問ずつ選択（指定の順番で出題）
      currentProblems = ORDER.map(k => problemCategories[k][Math.floor(Math.random() * problemCategories[k].length)]);
    }

    function updateProgressBar() {
      const progressBar = document.getElementById('progress-bar');
      progressBar.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.textContent = i + 1;
        if (i === currentProblemIndex) dot.classList.add('active');
        else if (i < currentProblemIndex) dot.classList.add('complete');
        progressBar.appendChild(dot);
      }
    }

    function getPairsForProduct(product) {
      const pairs = [];
      const divisors = new Set();

      for (let i = 1; i <= Math.abs(product); i++) {
        if (Math.abs(product) % i === 0) {
          divisors.add(i);
          divisors.add(-i);
        }
      }

      divisors.forEach(divisor => {
        const other = product / divisor;
        if (divisor <= other) {
          pairs.push([divisor, other]);
        }
      });

      return pairs;
    }

    // 【ブラッシュアップ】数の表示：負の数は数学の「−」で
    const num = n => (n < 0 ? '−' + Math.abs(n) : String(n));
    const numP = n => (n < 0 ? '(−' + Math.abs(n) + ')' : String(n));   // 式の中の負の数はかっこつき
    // 【ブラッシュアップ】まちがえたときの一言を、各ステップの下に出す
    function setHint(n, msg) { const el = document.getElementById('hint' + n); if (el) el.textContent = msg ? '💡 ' + msg : ''; }
    function markWrong(els) { els.forEach(el => { el.classList.remove('incorrect'); void el.offsetWidth; el.classList.add('incorrect'); }); }
    const isGo = e => (e.key === 'Tab' || e.key === 'Enter') && !e.shiftKey && !e.isComposing;

    function resetUI() {
      ['multiply-answer', 'add-answer'].forEach(id => {
        const el = document.getElementById(id);
        el.value = '';
        el.readOnly = false;
        el.classList.remove('correct', 'incorrect');
      });
      document.getElementById('multiply-feedback').textContent = '';
      document.getElementById('add-feedback').textContent = '';
      document.getElementById('step1-badge').style.display = 'none';
      document.getElementById('step3-badge').style.display = 'none';
      document.getElementById('step4-badge').style.display = 'none';
      [1, 2, 3, 4].forEach(n => setHint(n, ''));
      document.getElementById('completion').style.display = 'none';
      document.getElementById('all-complete').style.display = 'none';

      document.getElementById('step1').classList.add('visible');
      document.getElementById('step2').classList.remove('visible');
      document.getElementById('step3').classList.remove('visible');
      document.getElementById('step4').classList.remove('visible');

      signStateA = '+';
      signStateB = '+';
    }

    function loadProblem() {
      currentProblem = currentProblems[currentProblemIndex];
      resetUI();
      const tv = currentProblem.type === 'two_var';

      const validPairs = getPairsForProduct(currentProblem.multiply);
      const pairRow = document.getElementById('pair-row');
      pairRow.innerHTML = '';
      document.getElementById('step2-badge').style.display = 'none';

      for (let i = 0; i < validPairs.length; i++) {
        const pairItem = document.createElement('div');
        pairItem.className = 'pair-item';
        pairItem.innerHTML = `
          <input type="text" id="pair${i}-a" class="input-box" style="width: 2.5rem;" maxlength="4" autocomplete="off">
          <span class="math-text math-formula">×</span>
          <input type="text" id="pair${i}-b" class="input-box" style="width: 2.5rem;" maxlength="4" autocomplete="off">
        `;
        pairRow.appendChild(pairItem);
      }

      document.getElementById('problem-text').textContent = currentProblem.formula;
      // 【ブラッシュアップ】ステップ①で何を書くのか、⑦（文字 2 種類）では何を見るのかを書く
      document.getElementById('step1-note').textContent = tv
        ? '「かけて」は y² の係数、「たして」は xy の係数を書こう（y は数といっしょに考える）'
        : '「かけて」は定数項（x のつかない数）、「たして」は x の係数を書こう（符号もいっしょに）';
      document.getElementById('step2-title').textContent = `かけて${num(currentProblem.multiply)}になるペアを書き入れよう`;
      // 【ブラッシュアップ】符号の見当をつけるヒント
      document.getElementById('sign-guide').textContent = currentProblem.multiply > 0
        ? '※ かけて正 → 2つは同じ符号（＋どうし・−どうし）。負の組も書こう！'
        : '※ かけて負 → 2つは符号がちがう（＋と−）。';
      document.getElementById('step3-title').textContent = `かけて${num(currentProblem.multiply)}、たして${num(currentProblem.add)}になる組は？`;
      document.getElementById('sum-choices').innerHTML = '';

      const step4Desc = document.getElementById('step4-description');
      step4Desc.innerHTML = `<span class="math-formula">${currentProblem.formula}</span> を因数分解すると...`;

      const y = tv ? '<span class="math-text math-formula">y</span>' : '';
      const step4Inputs = document.getElementById('step4-inputs');
      if (currentProblem.type === 'perfect_square') {
        step4Inputs.innerHTML = `<span class="math-text math-formula">(x</span>
          <span id="sign1" class="math-text math-formula"></span>
          <input type="text" id="factor-a" class="input-box" style="width: 2.5rem;" maxlength="4" autocomplete="off">
          <button type="button" class="sign-btn" onclick="toggleSign('A')">±</button>
          <span class="math-text math-formula">)²</span>`;
      } else {
        step4Inputs.innerHTML = `<span class="math-text math-formula">(x</span>
          <span id="sign1" class="math-text math-formula"></span>
          <input type="text" id="factor-a" class="input-box" style="width: 2.5rem;" maxlength="4" autocomplete="off">${y}
          <button type="button" class="sign-btn" onclick="toggleSign('A')">±</button>
          <span class="math-text math-formula">)(x</span>
          <span id="sign2" class="math-text math-formula"></span>
          <input type="text" id="factor-b" class="input-box" style="width: 2.5rem;" maxlength="4" autocomplete="off">${y}
          <button type="button" class="sign-btn" onclick="toggleSign('B')">±</button>
          <span class="math-text math-formula">)</span>`;
      }

      setupEventListeners(validPairs);
      updateProgressBar();
      document.getElementById('multiply-answer').focus();
    }

    // 【ブラッシュアップ】（2 回目）
    //   ・まちがえても入力を消さない（元は 0.5 秒で消えて、何をまちがえたか見返せなかった）。かわりに一言ヒントを出す
    //   ・③ は ② で見つけた組をタップして選ぶ（元は同じ数を打ち直していた）
    //   ・キーの受け付けは onkeydown に入れる（元は問題ごとに addEventListener で足していて、同じ処理が重なっていた）
    let step1Done = false;
    function setupEventListeners(validPairs) {
      step1Done = false;
      const completedPairs = new Set();
      const cp = () => currentProblem;
      const tv = currentProblem.type === 'two_var';

      const multiplyInput = document.getElementById('multiply-answer');
      const addInput = document.getElementById('add-answer');
      const multiplyFeedback = document.getElementById('multiply-feedback');
      const addFeedback = document.getElementById('add-feedback');

      function judge1(input, fb, target, hint) {
        if (input.classList.contains('correct')) return true;
        if (parseInt(input.value) === target) {
          input.classList.add('correct'); input.readOnly = true;
          fb.textContent = '✓'; fb.style.color = '#22c55e';
          return true;
        }
        markWrong([input]);
        fb.textContent = '✗'; fb.style.color = '#ef4444';
        setHint(1, hint);
        return false;
      }
      const hintM = tv ? 'y² の係数（y² の前の数）はいくつ？ 符号もいっしょに。' : '定数項（x がつかない数）はいくつ？ 符号もいっしょに。';
      const hintA = currentProblem.type === 'difference' ? 'x の項がない → x の係数は 0。たして 0 だよ。'
        : tv ? 'xy の係数（xy の前の数）はいくつ？ 符号もいっしょに。' : 'x の係数（x の前の数）はいくつ？ 符号もいっしょに。';
      window.checkMultiply = () => {
        if (judge1(multiplyInput, multiplyFeedback, cp().multiply, hintM)) { if (!addInput.classList.contains('correct')) addInput.focus(); finishStep1(); }
      };
      window.checkAdd = () => {
        const okM = judge1(multiplyInput, multiplyFeedback, cp().multiply, hintM);
        const okA = judge1(addInput, addFeedback, cp().add, hintA);
        if (!okM) multiplyInput.focus();
        if (okM && okA) finishStep1();
      };
      function finishStep1() {
        if (step1Done || !multiplyInput.classList.contains('correct') || !addInput.classList.contains('correct')) return;
        step1Done = true;
        setHint(1, '');
        document.getElementById('step1-badge').style.display = 'inline-flex';
        setTimeout(() => {
          document.getElementById('step2').classList.add('visible');
          document.getElementById('pair0-a').focus();
        }, 300);
      }
      multiplyInput.onkeydown = (e) => { if (isGo(e)) { e.preventDefault(); window.checkMultiply(); } };
      addInput.onkeydown = (e) => { if (isGo(e)) { e.preventDefault(); window.checkAdd(); } };

      // --- ② ペア ---
      window.checkPair = (index) => {
        const inputA = document.getElementById(`pair${index}-a`);
        const inputB = document.getElementById(`pair${index}-b`);
        if (completedPairs.has(index)) return;
        const a = parseInt(inputA.value);
        const b = parseInt(inputB.value);
        if (isNaN(a) || isNaN(b)) { markWrong([inputA, inputB]); setHint(2, '2つとも数を入れよう。'); return; }
        let isUsed = false;
        completedPairs.forEach(i => {
          const ea = parseInt(document.getElementById(`pair${i}-a`).value), eb = parseInt(document.getElementById(`pair${i}-b`).value);
          if ((ea === a && eb === b) || (ea === b && eb === a)) isUsed = true;
        });
        if (a * b !== cp().multiply) {
          markWrong([inputA, inputB]);
          setHint(2, `${numP(a)}×${numP(b)}＝${num(a * b)}。かけて ${num(cp().multiply)} になる組をさがそう。`);
          return;
        }
        if (isUsed) { markWrong([inputA, inputB]); setHint(2, 'その組はもう書いたよ。ほかの組をさがそう。'); return; }
        inputA.classList.add('correct'); inputB.classList.add('correct');
        inputA.readOnly = true; inputB.readOnly = true;
        completedPairs.add(index);
        setHint(2, '');
        if (completedPairs.size === validPairs.length) {
          document.getElementById('step2-badge').style.display = 'inline-flex';
          buildStep3(validPairs);
          setTimeout(() => {
            document.getElementById('step3').classList.add('visible');
            const first = document.querySelector('#sum-choices button');
            if (first) first.focus();
          }, 300);
        } else {
          for (let i = 0; i < validPairs.length; i++) {
            if (!completedPairs.has(i)) { document.getElementById(`pair${i}-a`).focus(); break; }
          }
        }
      };
      for (let index = 0; index < validPairs.length; index++) {
        const inputA = document.getElementById(`pair${index}-a`);
        const inputB = document.getElementById(`pair${index}-b`);
        inputA.onkeydown = (e) => { if (isGo(e)) { e.preventDefault(); inputB.focus(); } };
        inputB.onkeydown = (e) => { if (isGo(e)) { e.preventDefault(); window.checkPair(index); } };
      }

      // --- ③ たして○になる組：② の組から選ぶ ---
      function buildStep3(pairs) {
        const box = document.getElementById('sum-choices');
        box.innerHTML = '';
        pairs.forEach(([a, b]) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'sum-choice u-choice';
          btn.textContent = `${num(a)} と ${num(b)}`;
          btn.onclick = () => {
            if (btn.disabled) return;
            const ok = (a === cp().factorA && b === cp().factorB) || (a === cp().factorB && b === cp().factorA);
            if (ok) {
              btn.classList.add('u-ok');
              box.querySelectorAll('button').forEach(x => { x.disabled = true; });
              setHint(3, '');
              document.getElementById('step3-badge').style.display = 'inline-flex';
              setTimeout(() => {
                document.getElementById('step4').classList.add('visible');
                document.getElementById('factor-a').focus();
              }, 300);
            } else {
              btn.classList.add('u-ng');
              btn.disabled = true;
              setHint(3, `${numP(a)}＋${numP(b)}＝${num(a + b)}。たして ${num(cp().add)} になる組は？`);
            }
          };
          box.appendChild(btn);
        });
      }

      // --- ④ 因数分解の答え ---
      const factorA = document.getElementById('factor-a');
      const factorB = document.getElementById('factor-b');
      const sign1 = document.getElementById('sign1');
      const sign2 = document.getElementById('sign2');

      factorA.addEventListener('keydown', (e) => {
        if (e.key === '-' || e.key === '−') {
          e.preventDefault();
          signStateA = signStateA === '+' ? '−' : '+';
          sign1.textContent = signStateA;
        } else if (isGo(e)) {
          e.preventDefault();
          if (currentProblem.type === 'perfect_square') checkFactors();
          else factorB.focus();
        }
      });
      if (factorB) {
        factorB.addEventListener('keydown', (e) => {
          if (e.key === '-' || e.key === '−') {
            e.preventDefault();
            signStateB = signStateB === '+' ? '−' : '+';
            sign2.textContent = signStateB;
          } else if (isGo(e)) {
            e.preventDefault();
            checkFactors();
          }
        });
      }
      factorA.addEventListener('input', () => {
        const value = factorA.value;
        if (/-/.test(value)) signStateA = signStateA === '+' ? '−' : '+';   // 【ブラッシュアップ】スマホの「-」でも符号を切りかえる
        const numberOnly = value.replace(/[^0-9]/g, '');
        factorA.value = numberOnly;
        sign1.textContent = (numberOnly === '' && signStateA === '+') ? '' : signStateA;
      });
      if (factorB) {
        factorB.addEventListener('input', () => {
          const value = factorB.value;
          if (/-/.test(value)) signStateB = signStateB === '+' ? '−' : '+';   // 【ブラッシュアップ】
          const numberOnly = value.replace(/[^0-9]/g, '');
          factorB.value = numberOnly;
          sign2.textContent = (numberOnly === '' && signStateB === '+') ? '' : signStateB;
        });
      }

      // 【ブラッシュアップ】符号も見る（元の完全平方は Math.abs で比べていて、(x+4)² も (x−4)² も正解になっていた）。
      //   まちがえても入力は消さずに、ヒントを出す
      function checkFactors() {
        const ps = currentProblem.type === 'perfect_square';
        const els = ps ? [factorA] : [factorA, factorB];
        if (els.some(el => el.value.trim() === '')) { markWrong(els.filter(el => el.value.trim() === '')); setHint(4, '数を入れよう。符号は「±」ボタンで切りかえるよ。'); return; }
        const signedA = (signStateA === '−' ? -1 : 1) * parseInt(factorA.value);
        const signedB = ps ? signedA : (signStateB === '−' ? -1 : 1) * parseInt(factorB.value);
        const isCorrect = (signedA === currentProblem.factorA && signedB === currentProblem.factorB) || (signedA === currentProblem.factorB && signedB === currentProblem.factorA);
        if (isCorrect) {
          els.forEach(el => { el.classList.add('correct'); el.readOnly = true; });
          setHint(4, '');
          document.getElementById('step4-badge').style.display = 'inline-flex';
          showCompletion();
          setTimeout(() => { document.getElementById('next-button').focus(); }, 100);
        } else {
          markWrong(els);
          setHint(4, ps ? '③ で選んだ数（同じ数が 2 つ）を、符号ごと入れよう。' : '③ で選んだ 2 つの数を、符号ごと入れよう。(x＋a)(x＋b)＝x²＋(a＋b)x＋ab');
        }
      }
      window.checkFactors = checkFactors;
    }

    function formatAnswer() {
      const cp = currentProblem;
      const y = cp.type === 'two_var' ? 'y' : '';
      const term = n => (n > 0 ? ' + ' : ' − ') + (Math.abs(n) === 1 && y ? '' : Math.abs(n)) + y;
      if (cp.type === 'perfect_square') return `${cp.formula} = (x${term(cp.factorA)})²`;
      // 【ブラッシュアップ】教科書の慣例の並び：差の平方は (x＋a)(x−a)、ほかは定数の小さい順
      const [p, q] = cp.type === 'difference' ? [Math.max(cp.factorA, cp.factorB), Math.min(cp.factorA, cp.factorB)] : [Math.min(cp.factorA, cp.factorB), Math.max(cp.factorA, cp.factorB)];
      return `${cp.formula} = (x${term(p)})(x${term(q)})`;
    }
    // 【ブラッシュアップ】答えのあとに、確かめ・公式を 1 行
    function checkLine() {
      const cp = currentProblem;
      if (cp.type === 'perfect_square') return '公式 a² ＋ 2ab ＋ b² ＝ (a ＋ b)² の形だね';
      if (cp.type === 'difference') return '公式 a² − b² ＝ (a ＋ b)(a − b) の形だね（たして 0）';
      const y = cp.type === 'two_var' ? 'y' : '';
      return `確かめ：${numP(cp.factorA)}＋${numP(cp.factorB)}＝${num(cp.add)}、${numP(cp.factorA)}×${numP(cp.factorB)}＝${num(cp.multiply)}` + (y ? '（y をつけて展開するともとの式）' : '');
    }

    function showCompletion() {
      const completion = document.getElementById('completion');
      const completionText = document.getElementById('completion-text');
      const completionAnswer = document.getElementById('completion-answer');

      completionText.textContent = '問題' + (currentProblemIndex + 1) + 'をクリア！';
      completionAnswer.innerHTML = `<span class="math-formula">${formatAnswer()}</span><div class="check-line"></div>`;
      completionAnswer.querySelector('.check-line').textContent = checkLine();
      completion.style.display = 'block';
      completion.style.opacity = '0';
      completion.style.transform = 'scale(0.9)';
      setTimeout(() => {
        completion.style.transition = 'all 0.5s ease';
        completion.style.opacity = '1';
        completion.style.transform = 'scale(1)';
      }, 100);
    }

    document.addEventListener('click', (e) => {
      if (e.target.id === 'next-button') {
        currentProblemIndex++;
        if (currentProblemIndex < TOTAL) {
          loadProblem();
          window.scrollTo(0, 0);
          document.getElementById('app-wrapper').scrollTop = 0;
        } else {
          document.getElementById('completion').style.display = 'none';
          const allComplete = document.getElementById('all-complete');
          allComplete.style.display = 'block';
          allComplete.style.opacity = '0';
          allComplete.style.transform = 'scale(0.9)';
          setTimeout(() => {
            allComplete.style.transition = 'all 0.5s ease';
            allComplete.style.opacity = '1';
            allComplete.style.transform = 'scale(1)';
          }, 100);
        }
      }
      if (e.target.id === 'restart-button') {
        currentProblemIndex = 0;
        selectProblems();
        loadProblem();
      }
    });

    document.getElementById('next-button').addEventListener('keydown', (e) => {
      if ((e.key === 'Tab' || e.key === 'Enter') && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('next-button').click();
      }
    });

    document.getElementById('restart-button').addEventListener('keydown', (e) => {
      if ((e.key === 'Tab' || e.key === 'Enter') && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('restart-button').click();
      }
    });

    // 【ブラッシュアップ】「こたえ合わせ」ボタン（Tab キーのないスマホ用）
    function checkStep(n) {
      if (n === 1) window.checkAdd();
      else if (n === 2) {
        let any = false;
        document.querySelectorAll('#pair-row .pair-item').forEach((it, i) => {
          const a = document.getElementById('pair' + i + '-a'), b = document.getElementById('pair' + i + '-b');
          if (!b.classList.contains('correct') && (a.value.trim() !== '' || b.value.trim() !== '')) { any = true; window.checkPair(i); }
        });
        if (!any) setHint(2, '空いている欄に、かけて ' + num(currentProblem.multiply) + ' になる 2 つの数を入れよう。');
      }
      else window.checkFactors();
    }
    // 【ブラッシュアップ】符号の「±」ボタン
    function toggleSign(which) {
      const input = document.getElementById(which === 'A' ? 'factor-a' : 'factor-b');
      const span = document.getElementById(which === 'A' ? 'sign1' : 'sign2');
      if (which === 'A') signStateA = signStateA === '+' ? '−' : '+';
      else signStateB = signStateB === '+' ? '−' : '+';
      const st = which === 'A' ? signStateA : signStateB;
      span.textContent = (input.value !== '' || st === '−') ? st : '';
      input.focus();
    }
    // 【ブラッシュアップ】全角の数字（「６」）や、いろいろなマイナス記号（− ー）を半角にそろえる。書き直したら赤い印を消す
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (!t.classList || !t.classList.contains('input-box')) return;
      const v = t.value.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/[−－ー―‐]/g, '-');
      if (v !== t.value) t.value = v;
      t.classList.remove('incorrect');
      if (t.id === 'multiply-answer') document.getElementById('multiply-feedback').textContent = '';
      if (t.id === 'add-answer') document.getElementById('add-feedback').textContent = '';
    }, true);

    selectProblems();
    loadProblem();
  </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    "#app-wrapper > .max-w-2xl": "u-card",
    "#main-title": "u-title",
    ".input-box": "u-input",
    ".input-box.correct": "u-ok",
    ".input-box.incorrect": "u-ng",
    ".check-btn": "u-btn",
    "#next-button": "u-btn u-btn-blue",
    "#restart-button": "u-btn",
    ".sign-btn": "u-btn u-btn-plain"
  });
</script>
</body>
</html>
