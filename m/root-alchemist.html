<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <!--
    15. ルートの計算（ルート・アルケミスト）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../assets/port.css">
  <script src="../assets/port.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルート・アルケミスト</title>
  <!-- 【ブラッシュアップ】元は Tailwind の開発用CDN（cdn.tailwindcss.com）をその場で動かしていた。
       本番用ではなく、重いうえに読み込めないと見た目が全部崩れるため、
       同じクラスから作った固定の CSS に置きかえた。見た目は同じ。 -->
  <link rel="stylesheet" href="../assets/gas.css">
  
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .game-bg {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    }

    .card-bg {
      background: linear-gradient(145deg, rgba(30, 27, 75, 0.9), rgba(20, 18, 50, 0.95));
      border: 1px solid rgba(147, 51, 234, 0.3);
    }

    .magic-border {
      border: 2px solid transparent;
      background: linear-gradient(145deg, rgba(30, 27, 75, 0.9), rgba(20, 18, 50, 0.95)) padding-box,
                  linear-gradient(135deg, #9333ea, #ec4899, #9333ea) border-box;
    }

    .hp-bar {
      background: linear-gradient(90deg, #ef4444, #f97316);
    }

    .exp-bar {
      background: linear-gradient(90deg, #22c55e, #84cc16);
    }

    .choice-btn {
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 0.8rem;
      font-size: 1.2rem;
      line-height: 1.5;
      min-height: 120px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), rgba(168, 85, 247, 0.5));
      border: 2px solid rgba(147, 51, 234, 0.5);
      color: white;
      font-weight: 700;
      border-radius: 0.5rem;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateX(-3px);
      box-shadow: 0 8px 20px rgba(147, 51, 234, 0.7);
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.8), rgba(168, 85, 247, 0.8));
    }

    .choice-btn:active:not(:disabled) {
      transform: translateX(0px);
    }

    .scroll-area {
      scrollbar-width: thin;
      scrollbar-color: rgba(147, 51, 234, 0.6) transparent;
    }

    .scroll-area::-webkit-scrollbar {
      width: 6px;
    }

    .scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .scroll-area::-webkit-scrollbar-thumb {
      background: rgba(147, 51, 234, 0.6);
      border-radius: 3px;
    }

    .message-item {
      word-wrap: break-word;
      overflow-wrap: break-word;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
      padding: 0.6rem 0.8rem;
      border-radius: 0.3rem;
      margin-bottom: 0.4rem;
      display: block;
    }

    .message-item.problem {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.7;
      color: #fef08a;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.5), rgba(217, 70, 239, 0.3));
      border-left: 4px solid #dc2626;
      padding: 1.2rem 0.8rem;
    }

    .message-item.story {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: #d1d5ff;
      background: rgba(99, 102, 241, 0.25);
      border-left: 2px solid #8b5cf6;
    }

    .message-item.answer-result {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      color: #86efac;
      background: rgba(34, 197, 94, 0.3);
      border-left: 3px solid #22c55e;
    }

    .message-item.answer-result.wrong {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.3);
      border-left: 3px solid #ef4444;
    }

    .float-animation {
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .difficulty-select {
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
    }

    .difficulty-select:hover {
      transform: scale(1.02);
    }

    .difficulty-select.selected {
      border: 3px solid white;
      transform: scale(1.06);
      filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .frac {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
      margin: 0 0.15em;
    }

    .frac > span:first-child {
      display: block;
      border-bottom: 2px solid currentColor;
      padding: 0.1em 0.2em;
    }

    .frac > span:last-child {
      display: block;
      padding: 0.1em 0.2em;
    }
  </style>
  <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    #app.game-bg { background: var(--u-bg) !important; font-family: var(--u-font) !important; }
    #title-screen .text-8xl { color: var(--u-accent-text); }
    #title-screen h1 { color: var(--u-title) !important; -webkit-text-fill-color: currentColor !important; background: none !important; }
    #title-screen .text-purple-300 { color: var(--u-title-dark) !important; font-weight: 700; }
    #title-screen .text-gray-400 { color: var(--u-sub) !important; }
    #title-screen button { width: 16rem; padding: 14px 20px; }
    .card-bg { background: #fff !important; border: 3px solid var(--u-line) !important; color: var(--u-ink); }
    #difficulty-screen > .card-bg, #name-screen > .card-bg, #levelup-modal .card-bg, #clear-modal .card-bg, #collection-modal > .card-bg { border: 8px solid var(--u-frame) !important; border-radius: 32px !important; box-shadow: 0 12px 0 rgba(0,0,0,0.05); }
    .card-bg h2 { color: var(--u-title) !important; -webkit-text-fill-color: currentColor !important; background: none !important; }
    .card-bg .text-gray-400 { color: var(--u-sub) !important; }
    .card-bg .text-white { color: var(--u-ink) !important; }
    .card-bg .text-yellow-400 { color: var(--u-accent-text) !important; }
    .card-bg .text-green-400 { color: var(--u-ok) !important; }
    .card-bg .text-purple-300 { color: var(--u-title-dark) !important; }
    .card-bg .bg-purple-900\/30 { background: #f8fafc !important; border: 2px dashed var(--u-line); }
    .difficulty-option { background: #fff !important; }
    .difficulty-option .text-sm { color: var(--u-sub) !important; }
    .difficulty-select.selected { border-color: var(--u-accent) !important; background: #fff7ed !important; filter: none; box-shadow: 0 0 0 4px rgba(251,146,60,0.3) !important; transform: scale(1.02); }
    #player-name-input { text-align: center; }
    #game-screen { padding: 8px; gap: 8px; }
    #game-screen > .card-bg { border-radius: 16px; }
    #game-screen .text-purple-300, #game-screen .text-green-300 { color: var(--u-sub) !important; font-weight: 700; }
    #player-name-display, #player-level { color: var(--u-ink); }
    #collection-btn, #menu-btn, #back-btn { border-radius: 10px !important; font-size: 0.8rem !important; padding: 4px 2px !important; }
    .message-item { text-shadow: none; border-radius: 12px; }
    .message-item.problem { color: var(--u-ink); background: var(--u-soft-yellow); border-left: 6px solid var(--u-accent); }
    .message-item.story { color: var(--u-title-dark); background: var(--u-soft-blue); border-left: 4px solid var(--u-soft-blue-line); }
    .message-item.answer-result { color: var(--u-ok); background: var(--u-ok-soft); border-left: 4px solid var(--u-ok-line); }
    .message-item.answer-result.wrong { color: var(--u-ng); background: var(--u-ng-soft); border-left-color: var(--u-ng-line); }
    .message-item.answer-result.close { color: #b45309; background: #fffbeb; border-left-color: #fcd34d; }
    .choice-btn { min-height: 96px; font-size: 1.25rem; }
    .scroll-area { scrollbar-color: var(--u-line-dark) transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--u-line-dark); }
    #collection-grid .card-bg { border-width: 2px !important; }
    .clear-nav { display: flex; flex-direction: column; gap: 10px; }
    .clear-nav a { color: var(--u-sub); font-weight: 700; }
    .rad { border-top: 2px solid currentColor; padding: 1px 1px 0; margin-left: 1px; }   /* 【ブラッシュアップ】√ の横線（括線） */
    /* スマホ：左右に分けていた「問題」と「選択肢」を上下に並べる */
    @media (max-width: 640px) {
      #game-screen > .flex-1 { flex-direction: column; }
      #game-screen > .flex-1 > .card-bg:first-child { flex: 1 1 auto; min-height: 0; }
      #game-screen > .flex-1 > .card-bg:last-child { flex: 0 0 auto; }
      #choice-area { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px; height: auto !important; }
      .choice-btn { min-height: 64px; padding: 0.7rem 0.4rem; font-size: 1.1rem; }
      .message-item.problem { font-size: 1.25rem; padding: 0.9rem 0.6rem; }
      #title-screen h1 { font-size: min(3rem, 9vw); white-space: nowrap; }
      #game-screen .grid-cols-4 { grid-template-columns: 1.2fr 1fr 1fr 1.3fr; }
    }
  
  </style>
</head>
<body class="u-theme h-full overflow-hidden">
  <div id="app" class="game-bg h-full w-full flex flex-col" style="font-family: 'Noto Sans JP', sans-serif;">

    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <!-- タイトル画面 -->
    <div id="title-screen" class="flex-1 flex items-center justify-center p-6 overflow-auto">
      <div class="text-center">
        <div class="float-animation mb-4">
          <div class="text-8xl mb-4">√</div>
        </div>
        <h1 class="text-5xl font-bold mb-2 bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
          ルート・アルケミスト
        </h1>
        <p class="text-purple-300 text-lg mb-2">〜根号の錬金術師〜</p>
        <p class="text-gray-400 text-sm mb-8">世界を覆う「ルートの霧」を晴らす冒険へ...</p>

        <div class="space-y-2">
          <button id="new-game-btn" class="w-64 py-3 px-6 magic-border rounded-lg text-white font-bold text-lg hover:brightness-110 transition-all">
            🗡️ 新しい冒険
          </button>
          <button id="continue-btn" class="w-64 py-3 px-6 card-bg rounded-lg text-purple-300 font-bold text-lg hover:bg-purple-700/50 transition-all hidden">
            📜 続ける
          </button>
        </div>
      </div>
    </div>

    <!-- 難易度選択画面 -->
    <div id="difficulty-screen" class="flex-1 flex items-center justify-center p-4 hidden overflow-auto">
      <div class="card-bg rounded-xl p-6 max-w-2xl w-full">
        <h2 class="text-2xl font-bold text-center text-purple-300 mb-1">難易度を選択</h2>
        <p class="text-center text-gray-400 mb-4 text-sm">選んだ難易度で試練が変わります</p>

        <div class="grid grid-cols-1 gap-3">
          <button class="difficulty-select difficulty-option p-4 rounded-lg bg-green-900/20 hover:bg-green-900/40 transition-all text-left border-2 border-transparent" data-difficulty="1">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xl font-bold text-green-400">★☆☆☆☆ イージー</div>
                <div class="text-sm text-green-300">基礎をマスター</div>
              </div>
              <div class="text-3xl">🟢</div>
            </div>
          </button>

          <button class="difficulty-select difficulty-option p-4 rounded-lg bg-blue-900/20 hover:bg-blue-900/40 transition-all text-left border-2 border-transparent" data-difficulty="2">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xl font-bold text-blue-400">★★☆☆☆ ノーマル</div>
                <div class="text-sm text-blue-300">基本を極める</div>
              </div>
              <div class="text-3xl">🔵</div>
            </div>
          </button>

          <button class="difficulty-select difficulty-option p-4 rounded-lg bg-purple-900/20 hover:bg-purple-900/40 transition-all text-left border-2 border-transparent selected" data-difficulty="3">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xl font-bold text-purple-400">★★★☆☆ ハード</div>
                <div class="text-sm text-purple-300">推奨 / 公式を活用</div>
              </div>
              <div class="text-3xl">🟣</div>
            </div>
          </button>

          <button class="difficulty-select difficulty-option p-4 rounded-lg bg-orange-900/20 hover:bg-orange-900/40 transition-all text-left border-2 border-transparent" data-difficulty="4">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xl font-bold text-orange-400">★★★★☆ ベリーハード</div>
                <div class="text-sm text-orange-300">複雑な展開</div>
              </div>
              <div class="text-3xl">🟠</div>
            </div>
          </button>

          <button class="difficulty-select difficulty-option p-4 rounded-lg bg-red-900/20 hover:bg-red-900/40 transition-all text-left border-2 border-transparent" data-difficulty="5">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xl font-bold text-red-400">★★★★★ インフェルノ</div>
                <div class="text-sm text-red-300">達人向け</div>
              </div>
              <div class="text-3xl">🔴</div>
            </div>
          </button>
        </div>

        <button id="difficulty-confirm-btn" class="w-full mt-4 py-3 magic-border rounded-lg text-white font-bold text-base hover:brightness-110 transition-all">
          冒険を始める！
        </button>
      </div>
    </div>

    <!-- 名前入力画面 -->
    <div id="name-screen" class="flex-1 flex items-center justify-center p-4 hidden">
      <div class="card-bg rounded-xl p-6 max-w-sm w-full">
        <h2 class="text-2xl font-bold text-center text-purple-300 mb-4">名前を入力</h2>
        <div class="mb-4">
          <input type="text" id="player-name-input"
                 class="w-full bg-purple-900/30 border border-purple-500/50 rounded-lg px-3 py-2 text-white text-center text-lg focus:outline-none focus:border-purple-400"
                 placeholder="名前（なくてもOK）" maxlength="10">
        </div>
        <button id="start-adventure-btn" class="w-full py-3 magic-border rounded-lg text-white font-bold text-base hover:brightness-110 transition-all">
          開始！ ⚔️
        </button>
      </div>
    </div>

    <!-- メインゲーム画面 -->
    <div id="game-screen" class="flex-1 flex flex-col p-1.5 hidden overflow-hidden gap-1">
      <!-- ステータスバー -->
      <div class="card-bg rounded-lg p-1.5">
        <div class="grid grid-cols-4 gap-1.5 text-xs">
          <div class="text-white font-bold truncate text-xs"><span id="player-name-display">勇者</span> Lv.<span id="player-level">1</span></div>
          <div class="text-purple-300">
            <div class="text-xs leading-tight">HP <span id="hp-text">100/100</span></div>
            <div class="h-1 bg-gray-700 rounded-full overflow-hidden mt-0.5">
              <div id="hp-bar" class="hp-bar h-full transition-all duration-300" style="width: 100%"></div>
            </div>
          </div>
          <div class="text-green-300">
            <div class="text-xs leading-tight">EXP <span id="exp-text">0/100</span></div>
            <div class="h-1 bg-gray-700 rounded-full overflow-hidden mt-0.5">
              <div id="exp-bar" class="exp-bar h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
          <div class="flex gap-1">
            <button id="collection-btn" class="flex-1 px-0.5 py-0.5 bg-purple-600/50 hover:bg-purple-600 rounded text-white text-xs font-bold transition-all">📚図鑑</button>
            <button id="menu-btn" class="flex-1 px-0.5 py-0.5 bg-gray-600/50 hover:bg-gray-600 rounded text-white text-xs font-bold transition-all">💚回復</button>
            <button id="back-btn" class="flex-1 px-0.5 py-0.5 bg-blue-600/50 hover:bg-blue-600 rounded text-white text-xs font-bold transition-all">↩戻る</button>
          </div>
        </div>
      </div>

      <!-- コンテンツエリア（左右分割） -->
      <div class="flex-1 flex gap-1.5 min-h-0 overflow-hidden">
        <!-- 左側：ストーリー・問題 -->
        <div class="flex-1 card-bg rounded-lg p-2 overflow-hidden">
          <div id="message-area" class="h-full overflow-y-auto scroll-area flex flex-col gap-1">
          </div>
        </div>

        <!-- 右側：選択肢 -->
        <div class="flex-1 card-bg rounded-lg p-2 overflow-hidden">
          <div id="choice-area" class="h-full overflow-y-auto scroll-area flex flex-col gap-2">
          </div>
        </div>
      </div>
    </div>

    <!-- モンスター図鑑 -->
    <div id="collection-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 overflow-auto">
      <div class="card-bg rounded-xl p-4 max-w-lg w-full max-h-[80vh] overflow-hidden flex flex-col my-auto">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-lg font-bold text-purple-300">📚 モンスター図鑑</h2>
          <button id="close-collection-btn" class="text-gray-400 hover:text-white text-2xl">&times;</button>
        </div>
        <div id="collection-grid" class="flex-1 overflow-auto scroll-area grid grid-cols-3 gap-2">
        </div>
      </div>
    </div>

    <!-- レベルアップ -->
    <div id="levelup-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
      <div class="card-bg rounded-xl p-6 max-w-sm w-full text-center">
        <div class="text-5xl mb-2">⬆️</div>
        <h2 class="text-3xl font-bold text-yellow-400 mb-2">LEVEL UP!</h2>
        <p class="text-white text-xl mb-1">Lv.<span id="new-level">2</span></p>
        <p id="new-title-text" class="text-purple-300 mb-4 hidden">新しい称号: <span id="new-title" class="text-yellow-400"></span></p>
        <button id="close-levelup-btn" class="w-full px-6 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg text-white font-bold transition-colors">
          続ける
        </button>
      </div>
    </div>

    <!-- クリア -->
    <div id="clear-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 overflow-auto">
      <div class="card-bg rounded-xl p-6 max-w-sm w-full text-center my-auto">
        <div class="text-5xl mb-2">🏆</div>
        <h2 class="text-2xl font-bold bg-gradient-to-r from-yellow-400 via-pink-400 to-purple-400 bg-clip-text text-transparent mb-2">
          冒険完了！
        </h2>
        <p class="text-white text-lg mb-1"><span id="clear-name">勇者</span>、おつかれさま！</p>
        <div class="bg-purple-900/30 rounded-lg p-3 mb-4 text-sm">
          <p class="text-gray-400 mb-1">最高称号</p>
          <p id="final-title" class="text-lg text-yellow-400 font-bold">実数の賢者</p>
          <p class="text-gray-400 mt-2 mb-1">正解率</p>
          <p id="accuracy-rate" class="text-2xl text-green-400 font-bold">100%</p>
        </div>
        <!-- 【ブラッシュアップ】次の難易度へそのまま進めるようにした -->
        <div class="clear-nav">
          <button id="next-diff-btn" class="w-full px-6 py-3 rounded-lg font-bold">次の難易度へ ▶</button>
          <button id="restart-btn" class="w-full px-6 py-3 rounded-lg font-bold">
            別の難易度を選択
          </button>
          <a href="../remake.html">ほかの教材をえらぶ</a>
        </div>
      </div>
    </div>

  </div>

  <script>
    let playerData = null;
    let allRecords = [];
    let currentStage = 1;
    let currentQuestion = 0;
    let selectedDifficulty = 3;
    let wrongAnswerCount = 0;
    let messageHistory = [];

    const titles = [
      { level: 1, name: 'ルートの迷子', emoji: '🌀' },
      { level: 3, name: '平方根の見習い', emoji: '📚' },
      { level: 5, name: '計算修行者', emoji: '🧘' },
      { level: 8, name: '有理化の騎士', emoji: '⚔️' },   // 【ブラッシュアップ】誤字
      { level: 12, name: '展開の魔術師', emoji: '🔮' },
      { level: 15, name: '実数の賢者', emoji: '👑' }
    ];

    const monsters = {

    async function initSDKs() {
      if (window.dataSdk) {
        await window.dataSdk.init({
          onDataChanged: (data) => {
            allRecords = data;
            if (data.length > 0) {
              playerData = data[0];
              updateContinueButton();
            }
          }
        });
      }
    }

    function updateContinueButton() {
      if (playerData) {
        document.getElementById('continue-btn').classList.remove('hidden');
      }
    }

    function showScreen(screenId) {
      document.querySelectorAll('#title-screen, #name-screen, #difficulty-screen, #game-screen').forEach(el => {
        el.classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    function renderMessages() {
      const area = document.getElementById('message-area');
      area.innerHTML = '';
      messageHistory.forEach((msg) => {
        const div = document.createElement('div');
        div.className = 'message-item ' + msg.type;
        div.innerHTML = fmtMath(msg.text);   // 【ブラッシュアップ】
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    function addMessage(text, type = 'story') {
      messageHistory.push({ text, type });
      renderMessages();
    }

    function showChoices(choices, onSelect) {
      const choiceArea = document.getElementById('choice-area');
      choiceArea.innerHTML = '';

      choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML = String.fromCharCode(65 + index) + '. ' + fmtMath(choice);   // 【ブラッシュアップ】

        btn.onclick = () => {
          Array.from(choiceArea.querySelectorAll('button')).forEach(b => b.disabled = true);
          onSelect(choice);
        };
        choiceArea.appendChild(btn);
      });
    }

    function updateStatus() {
      if (!playerData) return;

      document.getElementById('player-name-display').textContent = playerData.player_name;
      document.getElementById('player-level').textContent = playerData.level;
      document.getElementById('hp-text').textContent = `${playerData.hp}/100`;
      document.getElementById('hp-bar').style.width = `${playerData.hp}%`;
      document.getElementById('exp-text').textContent = `${playerData.exp}/100`;
      document.getElementById('exp-bar').style.width = `${playerData.exp}%`;
    }

    async function addExp(amount) {
      let newExp = playerData.exp + amount;
      let newLevel = playerData.level;
      let leveledUp = false;
      let newTitle = playerData.title;
      const oldTitle = playerData.title;   // 【ブラッシュアップ】

      while (newExp >= 100) {
        newExp -= 100;
        newLevel++;
        leveledUp = true;

        for (const t of titles) {
          if (newLevel >= t.level) {
            newTitle = t.name;
          }
        }
      }

      playerData.exp = newExp;
      playerData.level = newLevel;
      playerData.title = newTitle;

      await window.dataSdk.update(playerData);
      updateStatus();

      if (leveledUp) {
        document.getElementById('new-level').textContent = newLevel;
        // 【ブラッシュアップ】称号が変わったら見せる（元は欄はあるのに出てこなかった）
        document.getElementById('new-title').textContent = newTitle;
        document.getElementById('new-title-text').classList.toggle('hidden', newTitle === oldTitle);
        document.getElementById('levelup-modal').classList.remove('hidden');
      }
    }

    async function takeDamage(amount) {
      playerData.hp = Math.max(0, playerData.hp - amount);
      await window.dataSdk.update(playerData);
      updateStatus();
    }

    function showCollection() {
      const grid = document.getElementById('collection-grid');
      grid.innerHTML = '';

      const collected = playerData?.monster_collection ? playerData.monster_collection.split(',').filter(m => m) : [];

      for (const [name, data] of Object.entries(monsters)) {
        const card = document.createElement('div');
        const isCollected = collected.includes(name);

        card.className = `card-bg rounded-lg p-2 text-center text-xs ${isCollected ? '' : 'opacity-50'}`;
        card.innerHTML = `
          <div class="text-3xl mb-1">${isCollected ? data.emoji : '❓'}</div>
          <div class="text-white font-bold mb-0.5">${isCollected ? name : '???'}</div>
          <div class="text-gray-400">${isCollected ? data.desc : '未発見'}</div>
        `;
        grid.appendChild(card);
      }

      document.getElementById('collection-modal').classList.remove('hidden');
    }

    async function addMonster(name) {
      const collected = playerData.monster_collection ? playerData.monster_collection.split(',').filter(m => m) : [];
      if (!collected.includes(name)) {
        collected.push(name);
        playerData.monster_collection = collected.join(',');
        await window.dataSdk.update(playerData);
      }
    }

    async function clearStage(stageNum) {
      const cleared = playerData.cleared_stages ? playerData.cleared_stages.split(',').filter(s => s) : [];
      if (!cleared.includes(String(stageNum))) {
        cleared.push(String(stageNum));
        playerData.cleared_stages = cleared.join(',');
        await window.dataSdk.update(playerData);
      }
    }

      flow++;
      if (isNew) {
        showScreen('difficulty-screen');
      } else {
        showScreen('game-screen');
        messageHistory = [];
        selectedDifficulty = playerData.difficulty || 3;
        updateStatus();

        const cleared = playerData.cleared_stages ? playerData.cleared_stages.split(',').filter(s => s) : [];
        currentStage = cleared.length + 1;
        if (currentStage > 7) currentStage = 7;
        currentQuestion = 0;
        wrongAnswerCount = 0;

        addMessage(`${playerData.player_name}、おかえり！`, 'story');   // 【ブラッシュアップ】誤字
        await delayMs(800);
        startStage(currentStage);
      }
    }

    // 【ブラッシュアップ】元は「戻」→「続ける」とすると、前の進行の処理が残っていて問題が 2 重に出ることがあった。
    //   画面を切りかえるたびに番号を変え、古い進行の「待ち」は終わらないようにする。
    let flow = 0;
    function delayMs(ms) {
      const f = flow;
      return new Promise(r => setTimeout(() => { if (f === flow) r(); }, Math.round(ms * 0.45)));   // 【ブラッシュアップ】演出の待ち時間を半分以下に
    }

    async function createNewGame(name) {
      flow++;
      if (allRecords.length >= 999) {
        addMessage('セーブがいっぱい', 'story');
        return;
      }

      const newPlayer = {
        player_name: name,
        level: 1,
        exp: 0,
        hp: 100,
        title: 'ルートの迷子',
        cleared_stages: '',
        monster_collection: '',
        correct_count: 0,
        total_count: 0,
        difficulty: selectedDifficulty,
        created_at: new Date().toISOString()
      };

      const result = await window.dataSdk.create(newPlayer);

      if (result.isOk) {
        playerData = { ...newPlayer };
        showScreen('game-screen');
        messageHistory = [];
        updateStatus();

        currentStage = 1;
        currentQuestion = 0;
        wrongAnswerCount = 0;

        addMessage(`${name}、冒険へようこそ！`, 'story');
        await delayMs(800);
        startStage(1);
      }
    }

    async function startStage(stageNum) {
      const stage = stagesByDifficulty[selectedDifficulty][stageNum];
      if (!stage) {
        showClearScreen();
        return;
      }

      currentStage = stageNum;
      currentQuestion = 0;
      wrongAnswerCount = 0;

      addMessage(`第${stageNum}章 : ${stage.name}`, 'story');
      document.getElementById('choice-area').innerHTML = '';

      await delayMs(600);

      const monsterEmoji = monsters[stage.monster].emoji;
      addMessage(`${monsterEmoji} ${stage.monster}が現れた！`, 'story');
      await addMonster(stage.monster);

      await delayMs(600);
      askQuestion();
    }

    // 【ブラッシュアップ】この問題でまちがえた選択肢（選び直しのときは出さない）
    let excluded = [];

    function askQuestion() {
      const stage = stagesByDifficulty[selectedDifficulty][currentStage];
      const question = stage.questions[currentQuestion];
      excluded = [];
      // 【ブラッシュアップ】まちがえた回数を問題ごとに 0 に戻す。元は章ごとにしか戻らず、
      //   2 問目は 1 回まちがえただけで答えが出たり、いきなり「最後のチャンス」になったりした。
      wrongAnswerCount = 0;

      addMessage(question.q, 'problem');
      showChoices(question.choices, (selected) => checkAnswer(selected, question));
    }

    // 【ブラッシュアップ】選び直し：問題文は出し直さず、まちがえた選択肢を除いて出す
    function retryChoices(question) {
      showChoices(question.choices.filter(c => !excluded.includes(c)), (selected) => checkAnswer(selected, question));
    }

    // 【ブラッシュアップ】まちがえたときの一言ヒント（問題の種類から決める）
    function hintFor(q) {
      if (/平方根を求めよ/.test(q)) return '2乗してその数になる数は、正と負の 2 つ（±）あるよ。';
      if (/の値を求めよ/.test(q)) return '√a は「a の正の平方根」。± はつかないよ。';
      if (/\)² を計算せよ/.test(q)) return '(√a)² = a だよ。';
      if (/有理化/.test(q)) return '分母と分子に同じ数をかけて、分母の √ を消そう。分母が √a+b なら √a−b をかける（和と差の積）。';
      if (/展開/.test(q)) return '分配法則や、(a+b)²=a²+2ab+b²、(a+b)(a−b)=a²−b² を使おう。';
      if (/簡単にせよ/.test(q)) return '√ の中を「平方数×○」に分けて、平方数を外に出そう（例：√12=√(4×3)=2√3）。';
      if (/frac|÷/.test(q)) return '√a÷√b=√(a÷b)。√ の中どうしでわろう。';
      if (/×/.test(q)) return '√a×√b=√(ab)。かけたあと、√ の中を簡単にできないか確かめよう。';
      return '√ の中を簡単にしてそろえてから、係数どうしをたし引きしよう。';
    }

    // 【ブラッシュアップ】表示用：半角の - を数学の − に、√ のあとの数に横線（括線）を引く（採点は元の文字列で行う）
    function fmtMath(html) {
      return ('>' + html + '<').replace(/>([^<]*)</g, (m, t) => '>' + t.replace(/ - /g, ' − ').replace(/(^|[^0-9A-Za-z])-(?=[0-9√(])/g, '$1−').replace(/√(\d+)/g, '√<span class="rad">$1</span>') + '<').slice(1, -1);
    }

    // 【ブラッシュアップ】次の問題・次の章へ（正解のときと、答えを見せたときで同じ動き）
    async function goNext() {
      currentQuestion++;
      const stage = stagesByDifficulty[selectedDifficulty][currentStage];
      if (currentQuestion >= stage.questions.length) {
        await delayMs(500);
        addMessage('🎉 ' + stage.monster + 'を倒した！', 'story');
        await clearStage(currentStage);
        await delayMs(800);
        if (currentStage < 7) {
          startStage(currentStage + 1);
        } else {
          showClearScreen();
        }
      } else {
        await delayMs(800);
        askQuestion();
      }
    }

    async function checkAnswer(answer, question) {
      document.getElementById('choice-area').innerHTML = '';

      const isCorrect = answer === question.answer;

      // 【ブラッシュアップ】元は √25（＝5）のように「値は同じだけど、まだ簡単にできる形」を選んでも
      //   不正解になり HP が減っていた。「おしい」と伝えて、もう一度選ばせる。
      if (!isCorrect && sameValue(answer, question.answer)) {
        excluded.push(answer);
        addMessage('🤏 おしい！値は同じだけど、もっと簡単な形にできるよ', 'answer-result close');
        await delayMs(900);
        retryChoices(question);
        return;
      }

      playerData.total_count++;

      if (isCorrect) {
        playerData.correct_count++;
        await window.dataSdk.update(playerData);

        addMessage('✨ 正解！', 'answer-result');
        await addExp(30);
        await goNext();
      } else {
        await window.dataSdk.update(playerData);
        wrongAnswerCount++;
        excluded.push(answer);

        // 【ブラッシュアップ】元は同じ問題・同じ選択肢を出し直すだけだった。まちがえた選択肢を除き、一言ヒントを出す
        if (wrongAnswerCount <= 2) {
          addMessage((wrongAnswerCount === 1 ? '❌ 不正解...もう一度！' : '⚠️ 最後のチャンス！') + '<br>💡 ' + hintFor(question.q), 'answer-result wrong');
          await takeDamage(15);
          await delayMs(800);
          retryChoices(question);
        } else {
          addMessage('📍 正解は「' + question.answer + '」<br>💡 ' + hintFor(question.q), 'answer-result wrong');
          await takeDamage(15);
          await goNext();
        }

        if (playerData.hp <= 0) {
          playerData.hp = 100;
          await window.dataSdk.update(playerData);
          updateStatus();
        }
      }
    }

    function showClearScreen() {
      const accuracy = playerData.total_count > 0
        ? Math.round((playerData.correct_count / playerData.total_count) * 100)
        : 0;

      document.getElementById('clear-name').textContent = playerData.player_name;
      document.getElementById('final-title').textContent = playerData.title;
      document.getElementById('accuracy-rate').textContent = `${accuracy}%`;
      document.getElementById('next-diff-btn').style.display = selectedDifficulty < 5 ? '' : 'none';
      document.getElementById('levelup-modal').classList.add('hidden');   // 【ブラッシュアップ】前のレベルアップ表示が残らないように
      document.getElementById('clear-modal').classList.remove('hidden');
    }

    document.getElementById('new-game-btn').onclick = () => startGame(true);
    document.getElementById('continue-btn').onclick = () => startGame(false);

    document.querySelectorAll('.difficulty-option').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.difficulty-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedDifficulty = parseInt(btn.dataset.difficulty);
      };
    });

    document.getElementById('difficulty-confirm-btn').onclick = () => {
      // 【ブラッシュアップ】前に使った名前があれば入れておく（打ち直さなくてよい）
      const nameInput = document.getElementById('player-name-input');
      if (!nameInput.value && playerData && playerData.player_name) nameInput.value = playerData.player_name;
      showScreen('name-screen');
    };

    document.getElementById('start-adventure-btn').onclick = () => {
      const name = document.getElementById('player-name-input').value.trim();
      createNewGame(name || '勇者');   // 【ブラッシュアップ】名前は入れなくても始められる
    };

    document.getElementById('player-name-input').onkeypress = (e) => {
      if (e.key === 'Enter') {
        const name = e.target.value.trim();
        createNewGame(name || '勇者');   // 【ブラッシュアップ】
      }
    };

    document.getElementById('collection-btn').onclick = showCollection;
    document.getElementById('close-collection-btn').onclick = () => {
      document.getElementById('collection-modal').classList.add('hidden');
    };

    document.getElementById('close-levelup-btn').onclick = () => {
      document.getElementById('levelup-modal').classList.add('hidden');
    };

    // 【ブラッシュアップ】次の難易度へ：同じ名前で、ひとつ上の難易度の冒険を始める
    document.getElementById('next-diff-btn').onclick = async () => {
      const name = playerData ? playerData.player_name : '勇者';
      if (playerData) await window.dataSdk.delete(playerData);
      document.getElementById('clear-modal').classList.add('hidden');
      selectedDifficulty = Math.min(5, selectedDifficulty + 1);
      document.querySelectorAll('.difficulty-option').forEach(b => b.classList.toggle('selected', +b.dataset.difficulty === selectedDifficulty));
      createNewGame(name);
    };

    document.getElementById('restart-btn').onclick = async () => {
      if (playerData) {
        await window.dataSdk.delete(playerData);
      }
      document.getElementById('clear-modal').classList.add('hidden');
      messageHistory = [];
      showScreen('title-screen');
      playerData = null;
      updateContinueButton();
    };

    document.getElementById('back-btn').onclick = () => {
      flow++;
      if (document.getElementById('clear-modal').classList.contains('hidden') === false) {
        document.getElementById('clear-modal').classList.add('hidden');
      }
      messageHistory = [];
      showScreen('title-screen');
    };

    document.getElementById('menu-btn').onclick = async () => {
      if (playerData && playerData.hp < 100) {
        playerData.hp = 100;
        await window.dataSdk.update(playerData);
        updateStatus();
        addMessage('💚 体力全回復！', 'story');
      }
    };

    // 【ブラッシュアップ】選択肢の値を計算する（「値は同じだけど形がちがう」を見分けるため）
    function valueOf(s) {
      let t = String(s).replace(/<div class="frac"><span>(.*?)<\/span><span>(.*?)<\/span><\/div>/g, '(($1)/($2))');
      if (/±/.test(t)) return NaN;
      t = t.replace(/\s+/g, '').replace(/√(\d+)/g, 'Math.sqrt($1)').replace(/×/g, '*').replace(/(\d|\))(?=M|\()/g, '$1*');
      if (!/^[0-9+\-*/().Mathsqr]+$/.test(t)) return NaN;
      try { return Function('return (' + t + ');')(); } catch (e) { return NaN; }
    }
    function sameValue(a, b) {
      const x = valueOf(a), y = valueOf(b);
      return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-9;
    }

    initSDKs();
  </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    "#new-game-btn": "u-btn",
    "#continue-btn": "u-btn u-btn-blue",
    ".difficulty-option": "u-choice",
    "#difficulty-confirm-btn": "u-btn",
    "#player-name-input": "u-input",
    "#start-adventure-btn": "u-btn",
    "#collection-btn": "u-btn u-btn-blue",
    "#menu-btn": "u-btn",
    "#back-btn": "u-btn u-btn-plain",
    ".choice-btn": "u-choice",
    "#close-levelup-btn": "u-btn",
    "#next-diff-btn": "u-btn",
    "#restart-btn": "u-btn u-btn-plain"
  });
</script>
</body>
</html>
