    <!--
      12. 因数分解の練習（因数分解マスター Pro）
      山﨑先生の GAS 版をもとにブラッシュアップしたもの。
      問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
    -->
    <link rel="stylesheet" href="../assets/port.css">
    <script src="../assets/port.js"></script>
  <!-- 【ブラッシュアップ】GAS が自動で入れていた画面幅の設定とタイトルを、ページに直接書く -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>因数分解マスター Pro</title>
  <style>
    :root { --primary: #2980b9; --secondary: #8e44ad; --success: #27ae60; --bg: #f4f7f6; }
    body { font-family: 'Arial Black', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; overflow-y: auto; }
    #container { width: 100%; max-width: 850px; background: white; margin: 0 auto; border: 8px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.3); min-height: 100vh; display: flex; flex-direction: column; }
    .screen { display: none; flex-direction: column; padding: 25px; box-sizing: border-box; flex-grow: 1; }
    .active { display: flex; }
    button { transition: all 0.1s; cursor: pointer; border: none; }
    button:active { transform: translateY(4px); }

    .menu-header { text-align: center; font-size: 2.5rem; margin-bottom: 20px; font-weight: 900; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .menu-card { border: 4px solid #eee; border-radius: 20px; padding: 15px; background: #fff; }
    .card-title { font-size: 1.8rem; text-align: center; margin-top: 0; border-bottom: 4px solid #333; padding-bottom: 10px; }
    .mode-row { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; padding: 10px; background: #f8f9fa; border-radius: 12px; }
    .math-txt { font-size: 1.2rem; font-weight: 900; }
    .btn-group { display: flex; gap: 8px; }
    .btn-start { padding: 10px 15px; border-radius: 10px; font-weight: 900; color: white; font-size: 1rem; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }

    #tasuki-area { background: #fff; border: 5px solid var(--secondary); border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: center; }
    .t-grid { display: grid; grid-template-columns: 80px 60px 80px 40px 100px; align-items: center; gap: 10px; }
    .t-in { width: 80px; height: 60px; font-size: 2.5rem; text-align: center; border: 3px solid #ccc; border-radius: 10px; font-weight: 900; }
    .t-cross { position: relative; width: 60px; height: 130px; grid-row: span 2; display: flex; align-items: center; justify-content: center; }
    .t-cross::before, .t-cross::after { content: ""; position: absolute; width: 70px; height: 4px; background: #bbb; top: 50%; left: 50%; }
    .t-cross::before { transform: translate(-50%, -50%) rotate(40deg); }
    .t-cross::after { transform: translate(-50%, -50%) rotate(-40deg); }
    .t-res { font-size: 2.5rem; font-weight: 900; text-align: right; }
    .t-sum-line { grid-column: 5; border-top: 5px solid #333; text-align: right; font-size: 2.8rem; color: red; font-weight: 900; }

    #ans-box { background: #fff9c4; border: 4px solid #fbc02d; border-radius: 25px; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 3rem; gap: 2px; margin-bottom: 15px; padding: 10px; position: relative; cursor: text; flex-wrap: wrap; }
    .ans-char { padding: 0 2px; cursor: pointer; border-radius: 5px; }
    .ans-char:hover { background: rgba(0,0,0,0.1); }
    .cursor { width: 4px; height: 3.2rem; background: #f39c12; animation: blink 0.8s infinite; margin: 0 2px; }
    @keyframes blink { 50% { opacity: 0; } }

    #problem { font-size: 3.5rem; text-align: center; margin: 20px 0; font-weight: 900; color: #2c3e50; }
    .tile-wrap { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; background: #e3f2fd; padding: 20px; border-radius: 25px; }
    .btn-tile { padding: 12px 22px; font-size: 1.8rem; background: white; border-radius: 12px; font-weight: 900; box-shadow: 0 5px 0 #bdc3c7; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn-choice { padding: 20px; font-size: 1.6rem; font-weight: 900; background: white; border: 4px solid var(--primary); border-radius: 18px; box-shadow: 0 5px 0 var(--primary); }
    .btn-submit { background: var(--success); color: white; padding: 15px; font-size: 2.2rem; border-radius: 20px; font-weight: 900; margin-top: 15px; width: 100%; }
    .btn-show-ans { background: #e74c3c; color: white; padding: 10px; font-size: 1.2rem; border-radius: 12px; font-weight: 900; margin-top: 10px; width: 100%; }
    .btn-home { background: #95a5a6; color: white; padding: 15px; border-radius: 15px; width: 100%; font-weight: 900; margin-top: 20px; }
    #peek-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; }

    /* 【ブラッシュアップ】 */
    .port-back { max-width: 850px; margin-top: 8px; }
    #container { box-sizing: border-box; }
    .btn-choice:disabled { opacity: .35; }
    .locked .btn-choice, .locked .btn-submit, .locked .btn-tile { pointer-events: none; }
    #finish-nav { display: none; flex-direction: column; gap: 12px; max-width: 26rem; width: 100%; margin: 0 auto; }
    #finish-nav a { text-align: center; color: #7f8c8d; }
    .modal-content button { font-size: 1.3rem; padding: 10px 30px; border-radius: 12px; background: #3498db; color: white; font-weight: 900; }

    /* 【ブラッシュアップ】スマホ用の表示（画面の幅が 640px 以下のときだけ切り替わる） */
    @media (max-width: 640px) {

      .btn-tile { font-size: 1.6rem; padding: 10px 16px; }

  </style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  let qs = [], qIdx = 0, currentMode = "", userAns = [], cursorIdx = 0;
  let lastStart = [1, 1, '4'];   // 【ブラッシュアップ】「同じ種類でもう一度」用
  let solved = false;             // 【ブラッシュアップ】正解のあとの連打よけ

  function backToHome() {
    document.getElementById('quiz').classList.remove('active');
    document.getElementById('home').classList.add('active');
    qs = []; qIdx = 0;
  }

  function start(lv, sub, m) {
    lastStart = [lv, sub, m];
    currentMode = m; qIdx = 0; qs = [];
    document.getElementById('finish-nav').style.display = 'none';
    document.getElementById('home-btn').style.display = 'block';
    if (lv === 4) {   // 【ブラッシュアップ】レベル4（総合）：5 つの型を 1 問ずつ
      for (let i = 0; i < 5; i++) qs.push(generateQ4(i));
    } else if(lv === 2) {
      let pool = [1, 2, 3, 1, 2].sort(() => Math.random() - 0.5);
      for(let i=0; i<5; i++) qs.push(generateQ(1, pool[i]));
    } else {
      for(let i=0; i<5; i++) qs.push(generateQ(lv, sub));
    }
    document.getElementById('home').classList.remove('active');
    document.getElementById('quiz').classList.add('active');
    render();
  }

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b){ a%=b; [a,b]=[b,a]; } return a; }

  function generateQ(lv, sub) {
    const r = (min, max) => Math.floor(Math.random()*(max-min+1))+min;
    let a=1, b, c=1, d, limit=0;
    while(limit < 500) {
      limit++;
      if(lv===1) {
        if(sub===1) { b=r(1,9)*(r(0,1)?1:-1); d=r(1,9)*(r(0,1)?1:-1); if(Math.abs(b)===Math.abs(d) || b*d===0) continue; }
        else if(sub===2) { b=r(1,9)*(r(0,1)?1:-1); d=b; } 
        else { b=r(1,9); d=-b; }
      } else {
        a=r(1,5); c=r(1,5); b=r(1,6)*(r(0,1)?1:-1); d=r(1,6)*(r(0,1)?1:-1);
        if(a*c<=1 || gcd(a*c, gcd(a*d+b*c, b*d))!==1) continue;
      } break;
    }
    const ac=a*c, adbc=a*d+b*c, bd=b*d;
    let f = (ac===1?'':ac===-1?'-':ac)+'x²'+(adbc===0?'':(adbc>0?'+':'-')+(Math.abs(adbc)===1?'':Math.abs(adbc))+'x')+(bd===0?'':(bd>0?'+':'')+bd);
    const fmt = (k1, k2) => (k1===1?'':k1) + 'x' + (k2>=0?'+':'') + k2;
    let s1 = (a===c && b===d) ? `(${fmt(a,b)})²` : `(${fmt(a,b)})(${fmt(c,d)})`;
    let s2 = (a===c && b===d) ? s1 : `(${fmt(c,d)})(${fmt(a,b)})`;
    return { form: f, sols: [s1, s2], raw: {a,b,c,d} };
  }

  // ====== 【ブラッシュアップ】（2 回目）式の計算・答え合わせ・レベル4（総合） ======
  // 単項式 { c: 係数, v: { 文字: 次数 } }、多項式は単項式の配列
  function mono(c, v) { return { c: c, v: Object.assign({}, v || {}) }; }
  function vkey(v) { return Object.keys(v).filter(k => v[k]).sort().map(k => k + v[k]).join(''); }
  function mmul(p, q) { const v = Object.assign({}, p.v); for (const k in q.v) v[k] = (v[k] || 0) + q.v[k]; return mono(p.c * q.c, v); }
  function pnorm(P) {
    const m = {}, order = [];
    P.forEach(t => { const k = vkey(t.v); if (!m[k]) { m[k] = mono(0, t.v); order.push(k); } m[k].c += t.c; });
    return order.map(k => m[k]).filter(t => t.c !== 0);
  }
  function pmul(P, Q) { const out = []; P.forEach(p => Q.forEach(q => out.push(mmul(p, q)))); return pnorm(out); }
  function pkey(P) { return pnorm(P).map(t => t.c + '*' + vkey(t.v)).sort().join('|'); }
  function pgcd(P) { return P.reduce((g, t) => gcd(g, t.c), 0); }
  function pcommonVar(P) { return ['a', 'x', 'y'].some(k => P.every(t => (t.v[k] || 0) > 0)); }
  function tdeg(t) { return Object.keys(t.v).reduce((s, k) => s + t.v[k], 0); }
  function expand(f) { let r = [f.head || mono(1, {})]; f.groups.forEach(G => { r = pmul(r, G); }); return r; }
  // 文字列にする（- は半角。画面に出すときに − にする）
  function monoS(t, first) {
    const vs = Object.keys(t.v).filter(k => t.v[k]).sort();
    const abs = Math.abs(t.c);
    let s = (abs === 1 && vs.length) ? '' : String(abs);
    vs.forEach(k => { s += k + (t.v[k] === 2 ? '²' : ''); });
    return (t.c < 0 ? '-' : (first ? '' : '+')) + s;
  }
  function polyS(P) { return P.map((t, i) => monoS(t, i === 0)).join(''); }
  function factS(f) {
    let s = f.head ? (f.head.c === -1 && !vkey(f.head.v) ? '-' : monoS(f.head, true)) : '';
    const gs = f.groups.map(G => '(' + polyS(G) + ')');
    for (let i = 0; i < gs.length; i++) {
      if (gs[i + 1] === gs[i]) { s += gs[i] + '²'; i++; } else s += gs[i];
    }
    return s;
  }
  const lin = (a, b, v) => [mono(a, { x: 1 }), mono(b, v || {})];   // ax + b（v があれば b の後ろに文字）

  // 入力（タイル・選択肢）の式を読む。形：[−][単項式]( … )( … )²…
  function parseMono(s) {
    const m = s.match(/^(\d*)((?:[axy]²?)*)$/);
    if (!m || (m[1] === '' && m[2] === '')) return null;
    const v = {};
    (m[2].match(/[axy]²?/g) || []).forEach(t => { v[t[0]] = (v[t[0]] || 0) + (t[1] ? 2 : 1); });
    return mono(m[1] === '' ? 1 : +m[1], v);
  }
  function parseAns(str) {
    const m = String(str).replace(/−/g, '-').match(/^(-?)([^()]*)((?:\([^()]+\)²?)+)$/);
    if (!m) return null;
    let head = null;
    if (m[2] !== '') { head = parseMono(m[2]); if (!head) return null; }
    if (m[1] === '-') head = head ? mono(-head.c, head.v) : mono(-1, {});
    const groups = [];
    for (const g of m[3].match(/\([^()]+\)²?/g)) {
      const sq = g.endsWith('²'), inner = g.replace(/²$/, '').slice(1, -1);
      if (!/^[+-]?[^+-]+(?:[+-][^+-]+)+$/.test(inner)) return null;   // かっこの中は 2 項以上
      const terms = inner.match(/[+-]?[^+-]+/g).map(t => { const p = parseMono(t.replace(/^[+-]/, '')); if (p && t[0] === '-') p.c = -p.c; return p; });
      if (terms.some(t => !t)) return null;
      groups.push(terms);
      if (sq) groups.push(terms);
    }
    return { head: head, groups: groups };
  }
  // 答え合わせ：「展開するともとの式になる」「かっこの中はどれも 1 次式で、共通因数が残っていない」「かっこの中の最初の項が +」なら正解
  function judge(str, poly) {
    const a = parseAns(str);
    if (!a) return 'かっこを使った「かけ算の形」にしよう。';
    if (pkey(expand(a)) !== pkey(poly)) return '展開すると、もとの式にもどらないよ。';
    if (a.groups.some(G => G.some(t => tdeg(t) > 1))) return 'まだ因数分解できるところがあるよ。';
    if (a.groups.some(G => pgcd(G) > 1 || pcommonVar(G))) return 'かっこの中に共通因数が残っているよ。前にくくり出そう。';
    if (a.groups.some(G => G[0].c < 0)) return 'かっこの中の最初の項が ＋ になるように、− を前に出そう。';
    return '';
  }
  function polyOf(q) {
    if (!q.poly) { const { a, b, c, d } = q.raw; q.poly = pmul(lin(a, b), lin(c, d)); }
    return q.poly;
  }

  // レベル4：共通因数＋公式、差の平方・平方、文字 2 種類、最高次の係数が負、置きかえ
  function generateQ4(i) {
    const r = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const sg = () => (r(0, 1) ? 1 : -1);
    const pair = () => { let p, q; do { p = r(1, 6) * sg(); q = r(1, 6) * sg(); } while (p === q || p === -q); return p < q ? [p, q] : [q, p]; };
    let f, form = null;
    if (i === 0) {          // 共通因数＋(x+p)(x+q)：2x²+4x−30 = 2(x−3)(x+5)
      const [p, q] = pair();
      f = { head: mono([2, 3, 5][r(0, 2)], {}), groups: [lin(1, p), lin(1, q)] };
    } else if (i === 1) {
      if (r(0, 1)) { const p = r(1, 5); f = { head: mono([2, 3, 5][r(0, 2)], {}), groups: [lin(1, p), lin(1, -p)] }; }   // 3x²−12 = 3(x+2)(x−2)
      else { const p = r(1, 4) * sg(); f = { head: mono(1, { a: 1 }), groups: [lin(1, p), lin(1, p)] }; }                 // ax²−2ax+a = a(x−1)²
    } else if (i === 2) {
      if (r(0, 1)) { const [p, q] = pair(); f = { head: null, groups: [lin(1, p, { y: 1 }), lin(1, q, { y: 1 })] }; }      // x²−xy−6y² = (x+2y)(x−3y)
      else { const p = r(2, 5); f = { head: null, groups: [lin(1, p, { y: 1 }), lin(1, -p, { y: 1 })] }; }                  // x²−9y² = (x+3y)(x−3y)
    } else if (i === 3) {   // −x²+5x−6 = −(x−2)(x−3)
      const [p, q] = pair();
      f = { head: mono(-1, {}), groups: [lin(1, p), lin(1, q)] };
    } else {                // 置きかえ：(x+1)²+3(x+1)+2 = (x+2)(x+3)
      let m, u, v;
      do { m = r(1, 3) * sg(); u = r(1, 4) * sg(); v = r(1, 4) * sg(); } while (u >= v || m + u === 0 || m + v === 0 || u + v === 0);
      const s = u + v, t = u * v, M = '(x' + (m > 0 ? '+' : '') + m + ')';
      form = M + '²' + (s > 0 ? '+' : '-') + (Math.abs(s) === 1 ? '' : Math.abs(s)) + M + (t > 0 ? '+' : '') + t;
      f = { head: null, groups: [lin(1, m + u), lin(1, m + v)], sub: { m: m, u: u, v: v } };
    }
    const poly = expand(f);
    return { form: form || polyS(poly), sols: [factS(f)], raw: { a: 1, b: 0, c: 1, d: 0 }, poly: poly, f: f };
  }
  // レベル4 の4択：よくあるまちがい（くくり出した数の書き忘れ・符号・もどし忘れ など）
  function wrong4(q) {
    const f = q.f, out = [];
    const flip = G => G.map((t, j) => (j === 0 ? t : mono(-t.c, t.v)));
    if (f.head) out.push({ head: null, groups: f.groups });                                            // 前にくくり出したもの（−・数・a）の書き忘れ
    if (f.head && f.head.c > 1) out.push({ head: null, groups: [f.groups[0].map(t => mmul(t, f.head)), f.groups[1]] });   // かっこの中に共通因数が残る
    if (f.sub) {
      out.push({ head: null, groups: [lin(1, f.sub.u), lin(1, f.sub.v)] });                           // x+1 を X とおいたまま（もどし忘れ）
      out.push({ head: null, groups: [lin(1, f.sub.m + f.sub.u), lin(1, f.sub.v)] });
    }
    if (!f.head && !f.sub) out.push({ head: null, groups: f.groups.map(G => [G[0], mono(G[1].c, {})]) });   // y の付け忘れ
    out.push({ head: f.head, groups: f.groups.map(flip) });                                             // 符号
    out.push({ head: f.head, groups: [f.groups[0], flip(f.groups[1])] });
    out.push({ head: f.head, groups: [f.groups[0], f.groups[0]] });               // 2 乗にしてしまう
    out.push({ head: f.head, groups: [flip(f.groups[0]), flip(f.groups[0])] });
    const seen = new Set([q.sols[0]]), res = [];
    out.forEach(o => { const s = factS(o); if (!seen.has(s) && judge(s, q.poly) !== '' && res.length < 3) { seen.add(s); res.push(s); } });
    return res;
  }
  function renderChoices4(q) {
    const arr = [q.sols[0]].concat(wrong4(q)).sort(() => Math.random() - 0.5);
    const area = document.getElementById('4択-area'); area.innerHTML = "";
    arr.forEach(t => {
      const btn = document.createElement('button'); btn.className = "btn-choice"; btn.innerText = spaced(t);
      btn.onclick = () => check(t, btn); area.appendChild(btn);
    });
  }

  // 【ブラッシュアップ】表示用：− を数学の記号にし、2 項のあいだの ＋・− の前後に小さな空き（U+202F）を入れる。採点には使わない
  function spaced(s) { return String(s).replace(/-/g, '−').replace(/([0-9a-z)²])([+−])/g, '$1\u202F$2\u202F'); }

  function render() {
    if (qIdx >= 5) { finish(); return; }
    const q = qs[qIdx];
    document.getElementById('problem').innerText = spaced(q.form);
    document.getElementById('q-instr').style.display = '';   // 【ブラッシュアップ】
    document.getElementById('feedback').innerText = "";
    solved = false;
    document.getElementById('quiz').classList.remove('locked');
    ["ta","tb","tc","td"].forEach(id => { document.getElementById(id).value=""; });
    ["tr_top","tr_bottom","tsum"].forEach(id => document.getElementById(id).innerText = "0");
    document.getElementById('tasuki-area').style.display = (q.raw.a * q.raw.c > 1) ? 'flex' : 'none';
    
    if(currentMode === '4') {
      document.getElementById('4択-area').style.display = 'grid';
      document.getElementById('つなげる-area').style.display = 'none';
      renderChoices(q);
    } else {
      document.getElementById('4択-area').style.display = 'none';
      document.getElementById('つなげる-area').style.display = 'flex';
      userAns = []; cursorIdx = 0; updateAns(); renderTiles(q);
    }
  }

  function renderChoices(q) {
    if (q.f) { renderChoices4(q); return; }   // 【ブラッシュアップ】レベル4
    const {a,b,c,d} = q.raw;
    const fmt = (k1, k2) => (k1===1?'':k1) + 'x' + (k2>=0?'+':'') + k2;
    
    // カッコ内の重複(順序違い)を検知するための正規化関数
    const normalize = (k1, k2, k3, k4) => {
      let p1 = fmt(k1,k2), p2 = fmt(k3,k4);
      return (k1===k3 && k2===k4) ? `(${p1})²` : [p1, p2].sort().map(s => `(${s})`).join("");
    };

    let set = new Set();
    let displayMap = new Map(); // 正規化キー -> 実際の表示文字列

    const addChoice = (k1, k2, k3, k4) => {
      // 共通因数チェック: どちらかのカッコが2以上の数で割り切れるなら無効
      if(gcd(k1, k2) > 1 || gcd(k3, k4) > 1) return;
      let key = normalize(k1, k2, k3, k4);
      if(!set.has(key)) {
        set.add(key);
        displayMap.set(key, (k1===k3 && k2===k4) ? `(${fmt(k1,k2)})²` : `(${fmt(k1,k2)})(${fmt(k3,k4)})`);
      }
    };

    addChoice(a, b, c, d); // 正解
    // 【ブラッシュアップ】誤答は「符号ちがい」「かけて同じ・たしてちがう」「たして同じ・かけてちがう」「たすき掛けの組み方ちがい」から作る。
    //   元は数を少しずらすだけで、定数項の符号を見るだけで消せる選択肢が多かった。
    const tryAdd = w => { if (set.size < 4) addChoice(w[0], w[1], w[2], w[3]); };
    const mix = arr => arr.sort(() => Math.random() - 0.5);
    tryAdd([a, -b, c, -d]);   // 符号ちがい
    if (a * c > 1) {
      tryAdd([a, d, c, b]);   // たすき掛けの組み合わせミス
      const splits = [];
      for (let k = 1; k <= a * c; k++) if ((a * c) % k === 0 && k !== a && k !== c) splits.push([k, b, a * c / k, d]);   // x² の係数の分け方ちがい
      mix(splits).forEach(tryAdd);
      tryAdd([c, b, a, d]);
    } else {
      const Pr = b * d, Sm = b + d, sameP = [], sameS = [];
      if (b === d) tryAdd([1, b, 1, -b]);                              // 完全平方 → 和と差にしてしまう
      if (b === -d) { tryAdd([1, b, 1, b]); tryAdd([1, -b, 1, -b]); }  // 和と差 → 完全平方にしてしまう
      for (let k = -Math.abs(Pr); k <= Math.abs(Pr); k++) if (k !== 0 && Pr % k === 0 && k !== b && k !== d && k + Pr / k !== Sm) sameP.push([1, k, 1, Pr / k]);   // かけて同じ・たしてちがう
      [[b + 1, d - 1], [b - 1, d + 1]].forEach(w => { if (w[0] !== 0 && w[1] !== 0 && w[0] * w[1] !== Pr) sameS.push([1, w[0], 1, w[1]]); });   // たして同じ・かけてちがう
      tryAdd(mix(sameP)[0] || [1, -b, 1, d]);
      tryAdd(mix(sameS)[0] || [1, b, 1, -d]);
      sameP.forEach(tryAdd);
    }
    
    // 【ブラッシュアップ】元は試す回数が少なく数の変え方も狭かったため、たすき掛けでは
    //   選択肢が 2〜3 個しか出ないことがあった（約 4%）。変え方を広げ、4 つそろうまで試す。
    let timeout = 0;
    while(set.size < 4 && timeout < 600) {
      timeout++;
      const spread = timeout < 100 ? 1 : 3;
      let nb = (Math.abs(b) + Math.floor(Math.random()*(2*spread+1)) - spread) || 1;
      let nd = (Math.abs(d) + Math.floor(Math.random()*(2*spread+1)) - spread) || 1;
      if (timeout < 100) addChoice(a, nb, c, -nd);
      else addChoice(a, nb * (Math.random() < 0.5 ? 1 : -1), c, nd * (Math.random() < 0.5 ? 1 : -1));
    }

    let arr = Array.from(displayMap.values()).sort(()=>Math.random()-0.5);
    const area = document.getElementById('4択-area'); area.innerHTML = "";
    arr.forEach(t => {
      const btn = document.createElement('button'); btn.className="btn-choice"; btn.innerText=spaced(t);
      btn.onclick=()=>check(t, btn); area.appendChild(btn);
    });
  }

  function updateAns() {
    const box = document.getElementById('ans-box'); box.innerHTML = "";
    userAns.forEach((char, i) => {
      if(i === cursorIdx) box.appendChild(createCursor());
      const s = document.createElement('span'); s.className="ans-char"; s.innerText = char === '-' ? '−' : char;
      if (char === '+' || char === '-') s.classList.add('op');   // 【ブラッシュアップ】＋・− の前後に空き
      s.onclick=(e)=>{ e.stopPropagation(); cursorIdx=i; updateAns(); };
      box.appendChild(s);
    });
    if(cursorIdx === userAns.length) box.appendChild(createCursor());
  }
  function createCursor() { const d = document.createElement('div'); d.className="cursor"; return d; }
  function setCursorEnd() { cursorIdx = userAns.length; updateAns(); }

  function handleGlobalKey(e) {
    if(currentMode !== 'T' || !document.getElementById('quiz').classList.contains('active')) return;
    // 【ブラッシュアップ】たすき掛けの入力欄で打っているときは、答えの欄を操作しない。
    //   元はたすきの欄で Backspace を押すと、答えの欄の文字まで消えていた。
    if (e.target && e.target.tagName === 'INPUT') return;
    if(e.key === "ArrowLeft" && cursorIdx > 0) { cursorIdx--; updateAns(); }
    if(e.key === "ArrowRight" && cursorIdx < userAns.length) { cursorIdx++; updateAns(); }
    if(e.key === "Backspace" && cursorIdx > 0) { userAns.splice(cursorIdx-1, 1); cursorIdx--; updateAns(); }
    if(e.key === "Delete" && cursorIdx < userAns.length) { userAns.splice(cursorIdx, 1); updateAns(); }
    // 【ブラッシュアップ】キーボードからも入力できる（^ は ²、Enter で「できた！」）
    if (e.isComposing) return;
    if (/^[0-9xya()+\-]$/.test(e.key)) { userAns.splice(cursorIdx, 0, e.key); cursorIdx++; updateAns(); }
    if (e.key === "^") { userAns.splice(cursorIdx, 0, "²"); cursorIdx++; updateAns(); }
    if (e.key === "Enter") submitAns();
  }

  function renderTiles(q) {
    const tArea = document.getElementById('tiles'); tArea.innerHTML = "";
    const base = ["x", ...["y", "a"].filter(k => q.sols[0].includes(k)), "²","(",")","+","-"];   // 【ブラッシュアップ】
    const nums = [...new Set([Math.abs(q.raw.a), Math.abs(q.raw.b), Math.abs(q.raw.c), Math.abs(q.raw.d), 1, 2, 3, 4, 5, ...(q.sols[0].replace(/²/g, '').match(/\d/g) || []).map(Number)])].filter(n => n > 0).sort((a,b)=>a-b);
    [...base, ...nums].forEach(p => {
      const b = document.createElement('button'); b.className="btn-tile"; b.innerText = p === '-' ? '−' : p;
      b.onclick=(e)=>{ e.stopPropagation(); userAns.splice(cursorIdx, 0, String(p)); cursorIdx++; updateAns(); };
      tArea.appendChild(b);
    });
    // 【ブラッシュアップ】1 字消す・全部消す
    const del = document.createElement('button'); del.className = "btn-tile tile-del"; del.innerText = '⌫'; del.title = '1字消す';
    del.onclick = (e) => { e.stopPropagation(); if (cursorIdx > 0) { userAns.splice(cursorIdx - 1, 1); cursorIdx--; updateAns(); } };
    tArea.appendChild(del);
    const clr = document.createElement('button'); clr.className = "btn-tile tile-del"; clr.innerText = '全消し';
    clr.onclick = (e) => { e.stopPropagation(); userAns = []; cursorIdx = 0; updateAns(); };
    tArea.appendChild(clr);
  }

  function calcT() {
    const a = Number(document.getElementById('ta').value), c = Number(document.getElementById('tc').value);
    const b = Number(document.getElementById('tb').value), d = Number(document.getElementById('td').value);
    document.getElementById('tr_top').innerText = c * b || 0;
    document.getElementById('tr_bottom').innerText = a * d || 0;
    document.getElementById('tsum').innerText = (c*b + a*d) || 0;
  }

  // 【ブラッシュアップ】組み立てた答えを「かっこの組」として比べる。
  //   元は決まった書き方の文字列と完全一致でないと不正解で、(x+3)² を (x+3)(x+3) と書くと
  //   正しいのに不正解だった。かっこの順番がちがうもの・2乗を 2 つのかっこで書いたものも正解にする。
  function factorsOf(s) {
    const m = s.match(/^(\([^()]+\)(²)?)+$/);
    if (!m) return null;
    const list = [];
    for (const f of s.matchAll(/\(([^()]+)\)(²)?/g)) {
      const t = f[1].match(/^(\d*)x([+-]\d+)$/);
      if (!t) return null;
      const key = (t[1] || '1') + 'x' + t[2];
      list.push(key);
      if (f[2]) list.push(key);
    }
    return list.sort().join('|');
  }

  function check(v, btn) {
    if (solved) return;   // 【ブラッシュアップ】元は正解を続けて押すと 1 問とばしていた
    if (currentMode === 'T' && !v) { document.getElementById('feedback').style.color = "#999"; document.getElementById('feedback').innerText = "タイルを並べて式を作ろう"; return; }
    const q = qs[qIdx];
    // 【ブラッシュアップ】（2 回目）展開して比べる。かっこの順番・(x+3)² と (x+3)(x+3)・(3+x) のような書き方のちがいも正解にする
    const same = q.sols.includes(v) || judge(v, polyOf(q)) === '';
    if(same) {
      solved = true;
      document.getElementById('quiz').classList.add('locked');
      document.getElementById('feedback').style.color="var(--success)";
      document.getElementById('feedback').innerText="✨ 正解！！";
      // 【ブラッシュアップ】紙吹雪の部品が読み込めなかったときでも、次の問題へ進めるようにする
      if (window.confetti) confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
      setTimeout(()=>{ qIdx++; render(); }, 1000);
    } else {
      document.getElementById('feedback').style.color="orange";
      // 【ブラッシュアップ】なぜちがうかを出す（4択は、選んだ式を展開した結果を見せる）
      const pa = parseAns(v), why = judge(v, polyOf(q));
      let detail = why;
      if (currentMode === '4' && pa && why.indexOf('展開すると') === 0) detail = spaced(v) + ' を展開すると ' + spaced(polyS(expand(pa))) + '。';
      document.getElementById('feedback').innerHTML = "❌ 違いそうです<div class=\"why\"></div>";
      document.getElementById('feedback').querySelector('.why').textContent = detail;
      if (btn) btn.disabled = true;
    }
  }

  function submitAns() { check(userAns.join("")); }
  function finish() { 
    document.getElementById('q-instr').style.display = 'none';   // 【ブラッシュアップ】
    document.getElementById('problem').innerText = "🎉 全問クリア！"; 
    document.getElementById('4択-area').style.display="none"; 
    document.getElementById('つなげる-area').style.display="none"; 
    document.getElementById('tasuki-area').style.display="none";
    document.getElementById('feedback').innerText = "";
    document.getElementById('finish-nav').style.display = 'flex';
    document.getElementById('home-btn').style.display = 'none';
  }
  function openModal() { document.getElementById('peek-ans').innerText = spaced(qs[qIdx].sols[0]); document.getElementById('peek-modal').style.display='flex'; }
  function closeModal() { document.getElementById('peek-modal').style.display='none'; }
</script>
<script>
  // 【ブラッシュアップ】式の文字を斜体に（教科書の書き方）。textContent は変えない
  (function () {
    var RUN = /[A-Za-z0-9²³√±'()=+\-−·×÷\/.,<> ]*[A-Za-z0-9][A-Za-z0-9²³√±'()=+\-−·×÷\/.,<> ]*/g;
    var SKIP = ".m, .no-math, script, style, textarea, mjx-container";
    var SELS = ["#problem","[id=\"4択-area\"]","#tiles","#ans-box","#feedback","#peek-ans",".menu-card:first-child .math-txt"];
    function mathify(root) {
      if (!root || !document.createTreeWalker) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
      while (walker.nextNode()) {
        var n = walker.currentNode, p = n.parentElement;
        if (!p || p.closest(SKIP)) continue;
        if (/[A-Za-z0-9]/.test(n.nodeValue)) nodes.push(n);
      }
      nodes.forEach(function (n) {
        var s = n.nodeValue, frag = document.createDocumentFragment(), last = 0;
        s.replace(RUN, function (run, at) {
          var lead = run.match(/^\s*/)[0].length, text = run.trim();
          if (!text) return run;
          frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
          text.split(/(\b\d+F\b)/).forEach(function (seg, j) {
            if (!seg) return;
            if (j % 2) { frag.appendChild(document.createTextNode(seg)); return; }   // 「6F」のような階の番号はそのまま
            var span = document.createElement('span');
            span.className = 'm';
            seg.split(/([A-Za-z]+)/).forEach(function (part, k) {
              if (!part) return;
              if (k % 2) { var i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
              else span.appendChild(document.createTextNode(part));
            });
            frag.appendChild(span);
          });
          last = at + lead + text.length;
          return run;
        });
        frag.appendChild(document.createTextNode(s.slice(last)));
        n.parentNode.replaceChild(frag, n);
      });
    }
    var queued = false;
    function run() { queued = false; SELS.forEach(function (sel) { document.querySelectorAll(sel).forEach(mathify); }); }
    function start() {
      run();
      if (window.MutationObserver) new MutationObserver(function () { if (!queued) { queued = true; (window.requestAnimationFrame || setTimeout)(run); } })
        .observe(document.body, { childList: true, subtree: true, characterData: true });
    }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  })();
</script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    "#container": "u-card",
    ".menu-header": "u-title",
    ".btn-start": "u-btn",
    ".btn-group .btn-start:first-child": "u-btn-blue",
    ".btn-choice": "u-choice",
    ".btn-choice:disabled": "u-ng",
    ".btn-submit": "u-btn",
    ".btn-show-ans": "u-btn u-btn-plain",
    ".btn-home": "u-btn u-btn-plain",
