<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅰ　図形と計量</small><h1>三角比の値（総合）</h1></header>
  <div id="menu"></div>
  <div id="app"></div>
  <div id="ta"></div>
</main>
<script src="../assets/fill-steps.js"></script>
<script src="../assets/zahyou.js"></script>
<script>
const PRACTICE = {
  basic: { name: '基本の角', sub: '30°・45°・60°・120°・135°・150°', angles: [30, 45, 60, 120, 135, 150] },
  axis: { name: '軸の上の角', sub: '0°・90°・180°', angles: [0, 90, 180] },
  m2a: { name: '180° をこえる角', sub: '210°・225°・240°・300°・315°・330°', angles: [210, 225, 240, 300, 315, 330] },
  m2b: { name: '270°・360°', sub: 'P が軸の上（円で考える）', angles: [270, 360] }
};
const RUNS = {
  ta1: { name: 'タイムアタック', sub: '0°〜180° の sin・cos・tan から 10 問', all: false, n: 10 },
  mr1: { name: 'マラソン', sub: '0°〜180° の 27 問をぜんぶ', all: false },
  ta2: { name: '一般角 タイムアタック', sub: '0°〜330° から 10 問', all: true, n: 10 },
  mr2: { name: '一般角 マラソン', sub: '16 の角度の 48 問をぜんぶ', all: true }
};
const done = {}, best = {};
const MENU_BTN = '<button type="button" class="fs-btn zm-back" onclick="showMenu()">メニュー</button>';

function clearViews() { animTok++; clearInterval(timer); ['menu', 'app', 'ta'].forEach(id => document.getElementById(id).innerHTML = ''); }

function startPractice(id) {
  clearViews();
  mountZahyou(document.getElementById('app'), PRACTICE[id].angles, id, {
    onDone: () => { done[id] = true; }, menuBtn: MENU_BTN,
    finalExtra: '<p><button type="button" class="fs-btn" onclick="showMenu()">メニューにもどる</button></p>'
  });
  window.scrollTo(0, 0);
}

// ---------------- タイムアタック・マラソン ----------------
const VALUES = ['0', '1', '−1', '1/2', '−1/2', '√3/2', '−√3/2', '1/√2', '−1/√2', '√3', '−√3', '1/√3', '−1/√3', 'なし'];
const NEAR = { '1/2': ['√3/2', '1/√2'], '√3/2': ['1/2', '1/√2'], '1/√2': ['1/2', '√3/2', '1'], '√3': ['1/√3', '√3/2'], '1/√3': ['√3', '1/2'], '1': ['0', '1/√2', '√3'], '0': ['なし', '1', '−1'], 'なし': ['0', '1'] };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// 選択肢：まちがえやすい値（符号ちがい・sin と cos の取りちがえ・tan の逆数・0 と なし）を先に入れる
function choicesFor(correct) {
  const minus = correct[0] === '−', abs = minus ? correct.slice(1) : correct;
  const signed = v => (minus && v !== '0' && v !== 'なし') ? '−' + v : v;
  let traps = (correct !== '0' && correct !== 'なし') ? [minus ? abs : '−' + abs] : [];
  traps = traps.concat(shuffle((NEAR[abs] || []).map(signed)), shuffle(VALUES.slice()));
  const out = [correct];
  for (const v of traps) { if (out.length >= 6) break; if (!out.includes(v)) out.push(v); }
  return shuffle(out);
}
let run = null, timer = null;
function startRun(id) {
  clearViews();
  const R = RUNS[id], qs = [];
  Object.keys(T).map(Number).filter(d => R.all ? d !== 360 : d <= 180).forEach(d => ['sin', 'cos', 'tan'].forEach((f, k) => qs.push({ d, f, v: T[d][3 + k] })));
  shuffle(qs);
  run = { id, qs: R.n ? qs.slice(0, R.n) : qs, i: 0, miss: 0, t0: performance.now(), lock: false, picked: [] };
  timer = setInterval(tick, 100);
  renderRun(); window.scrollTo(0, 0);
}
const fmt = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), d = Math.floor(ms % 1000 / 100); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + d; };
function tick() { const el = document.getElementById('ta-timer'); if (el && run) el.textContent = fmt(performance.now() - run.t0); }
function renderRun() {
  const q = run.qs[run.i], el = document.getElementById('ta');
  if (!q.ch) q.ch = choicesFor(q.v);
  el.innerHTML = `<div class="ta-wrap">
    <div class="ta-top">${MENU_BTN}<span class="ta-count">${RUNS[run.id].name}　${run.i + 1} / ${run.qs.length}</span><span class="ta-timer" id="ta-timer">${fmt(performance.now() - run.t0)}</span></div>
    <div class="ta-bar"><span style="width:${run.i / run.qs.length * 100}%"></span></div>
    <div class="ta-q ${q.f}">${FillSteps.md(`${q.f} ${q.d}° =`)}<span class="qm">?</span></div>
    <div class="ta-opts">${q.ch.map((v, k) => `<button type="button" class="ta-opt${run.picked.includes(v) ? ' ng' : ''}" data-k="${k}"${run.picked.includes(v) ? ' disabled' : ''}>${FillSteps.valHTML(v)}</button>`).join('')}</div>
  </div>`;
  el.querySelectorAll('.ta-opt').forEach(b => b.onclick = () => answer(q, q.ch[+b.dataset.k], b));
}
function answer(q, v, b) {
  if (run.lock || b.disabled) return;
  if (v === q.v) {
    run.lock = true; b.classList.add('ok');
    setTimeout(() => { run.i++; run.picked = []; run.lock = false; run.i >= run.qs.length ? finishRun() : renderRun(); }, 220);
  } else { run.miss++; run.picked.push(v); renderRun(); }
}
function finishRun() {
  clearInterval(timer);
  const ms = performance.now() - run.t0, id = run.id, R = RUNS[id];
  const prev = best[id], newBest = prev && ms < prev; if (!prev || newBest) best[id] = ms; done[id] = true;
  document.getElementById('ta').innerHTML = `<div class="ta-wrap ta-res">
    <h2>${R.name}　クリア</h2><div class="t">${fmt(ms)}</div>
    <p>${run.miss ? 'まちがえた回数　' + run.miss + ' 回' : 'ノーミス'}${newBest ? '　記録更新！' : ''}</p>
    <div class="fs-nav"><button type="button" class="fs-btn" onclick="showMenu()">メニューへ</button><button type="button" class="fs-btn primary" onclick="startRun('${id}')">もう一度</button></div></div>`;
}

// ---------------- メニュー ----------------
function showMenu() {
  clearViews();
  const item = (id, n, cls, m, fn) => `<button type="button" class="zm-item ${cls}" onclick="${fn}('${id}')"><span class="n">${n}</span><span><b>${m.name}</b><span class="s">${m.sub}</span></span>${done[id] ? `<span class="ok">✓${best[id] ? ' ' + fmt(best[id]) : ''}</span>` : ''}</button>`;
  document.getElementById('menu').innerHTML = `
  <section class="zm-sec"><h2>数学Ⅰ<small>0° ≦ θ ≦ 180°</small></h2>
    <div class="zm-list">${item('basic', 1, '', PRACTICE.basic, 'startPractice')}${item('axis', 2, '', PRACTICE.axis, 'startPractice')}
    ${item('ta1', 3, 'ta', RUNS.ta1, 'startRun')}${item('mr1', 4, 'mr', RUNS.mr1, 'startRun')}</div></section>
  <section class="zm-sec"><h2>数学Ⅱの予習<small>180° をこえる角</small></h2>
    <div class="zm-list">${item('m2a', 5, 'm2', PRACTICE.m2a, 'startPractice')}${item('m2b', 6, 'm2', PRACTICE.m2b, 'startPractice')}
    ${item('ta2', 7, 'ta', RUNS.ta2, 'startRun')}${item('mr2', 8, 'mr', RUNS.mr2, 'startRun')}</div></section>
  <p class="zm-note">P の座標から三角比を考える練習・θ を求める問題は <a href="sankakuhi-zahyou.html">30. 三角比（座標）</a> へ</p>`;
  window.scrollTo(0, 0);
}
showMenu();
</script>
