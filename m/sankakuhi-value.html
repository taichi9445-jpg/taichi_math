<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<!--
  31. 三角比の値（総合）
  2026-10-28 先生の確認を受けて作り直し（Claude Code）。
  ・図が動く練習は 30「三角比（座標）」と同じもの（assets/zahyou.js・fill-steps.js）。
  ・タイムアタック（10問）とマラソン（全部）は、問題がランダムに出る。選択肢は6つ。
  ・√ は SVG で描き、外と中の数字を同じ大きさに（元は文字の √ に線を重ねていてずれていた）。
  ・2026-10-28 夜：終わったあと「間違えた問題を確認する」で、間違えた問題の図つきの解説を見られる（途中には出さない）。メニューは 30 と同じカード。
-->
<link rel="stylesheet" href="../assets/port.css">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/fill-steps.css">
<link rel="stylesheet" href="../assets/zahyou.css">
<style>
/* タイムアタック・マラソン */
.ta-wrap{max-width:720px;margin:0 auto}
.ta-top{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.ta-count{font-size:14px;color:#5b6470;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ta-timer{flex:none;margin-left:auto;font:700 18px/1 'BIZ UDPGothic',sans-serif;font-variant-numeric:tabular-nums;color:#fff;background:#1f4e8c;border-radius:6px;padding:7px 12px}
.ta-bar{height:6px;background:#e6edf5;border-radius:3px;overflow:hidden;margin:0 0 12px}
.ta-bar span{display:block;height:100%;background:#e8890c;transition:width .2s}
.ta-q{display:flex;justify-content:center;align-items:center;min-height:120px;margin:0 0 14px;padding:12px;background:#fff8e6;border:1px solid #f3d9a4;border-left:5px solid #e8890c;border-radius:8px;font-size:40px;color:#1f4e8c}
.ta-q .fs-m{font-size:1em}
.ta-q .qm{color:#e8890c;font-family:'BIZ UDPGothic',sans-serif;font-weight:700;margin-left:.2em}
.ta-q.sin{color:#c92a2a}.ta-q.cos{color:#2b8a3e}.ta-q.tan{color:#1f4e8c}
.ta-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ta-opt{position:relative;min-height:84px;border:1px solid #c5d3e4;border-bottom:4px solid #9fb2c8;border-radius:8px;background:#fff;color:#1f2328;font:30px 'STIX Two Text',serif;cursor:pointer;transition:transform .08s}
.ta-opt:not(:disabled):active{transform:translateY(2px);border-bottom-width:2px}
.ta-opt .fs-jp{font-size:24px}
.ta-opt.ok{background:#ebfbee;border-color:#2b8a3e;border-bottom-color:#1f6a2f}
.ta-opt.ng{background:#fff5f5;border-color:#c92a2a;border-bottom-color:#a61e1e;opacity:.75}
.ta-opt.ng::after{content:'×';position:absolute;right:8px;top:2px;font:700 16px 'BIZ UDPGothic',sans-serif;color:#c92a2a}
@media (min-width:640px){.ta-opts{grid-template-columns:repeat(3,1fr)}.ta-q{font-size:48px;min-height:140px}}
.ta-res{text-align:center;padding:10px 0}
.ta-res h2{font-size:21px;margin:0 0 8px}
.ta-res .t{font:700 44px/1.2 'BIZ UDPGothic',sans-serif;font-variant-numeric:tabular-nums;color:#1f4e8c;margin:6px 0}
.ta-res .fs-nav{justify-content:center}
/* 間違えた問題の確認 */
.rv-list{display:grid;gap:12px;margin:10px 0}
.rv-item{border:1px solid #d0d7de;border-left:5px solid #c92a2a;border-radius:8px;padding:8px 12px;background:#fff}
.rv-item h3{margin:0 0 4px;font-size:21px;font-weight:400}
.rv-item .you{font-size:14px;color:#a61e1e;margin:0 0 4px}
.rv-item .ex{font-size:16px;line-height:1.9;margin:4px 0 0}
.rv-item .zf{width:300px}
@media (min-width:640px){.rv-item{display:grid;grid-template-columns:1fr 300px;gap:4px 16px;align-items:center}.rv-item .zf{grid-row:1/4;grid-column:2}}
</style>
</head><body>
<a class="port-back" href="../index.html">← 教材の一覧へ</a>
<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅰ　図形と計量</small><h1>三角比の値（総合）</h1></header>
  <div id="menu"></div>
  <div id="app"></div>
  <div id="ta"></div>
</main>
<script src="../assets/fill-steps.js"></script>
<script src="../assets/zahyou.js"></script>
<script>
const PRACTICE = {
  basic: { name: '基本の角', sub: '30°・45°・60°・120°・135°・150°', angles: [30, 45, 60, 120, 135, 150] },
  axis: { name: '軸の上の角', sub: '0°・90°・180°', angles: [0, 90, 180] },
  m2a: { name: '180° をこえる角', sub: '210°・225°・240°・300°・315°・330°', angles: [210, 225, 240, 300, 315, 330] },
  m2b: { name: '270°・360°', sub: 'P が軸の上', angles: [270, 360] }
};
const RUNS = {
  ta1: { name: 'タイムアタック', sub: '0°〜180° から 10 問', all: false, n: 10 },
  mr1: { name: 'マラソン', sub: '0°〜180° の 27 問ぜんぶ', all: false },
  ta2: { name: '一般角 タイムアタック', sub: '0°〜330° から 10 問', all: true, n: 10 },
  mr2: { name: '一般角 マラソン', sub: '48 問ぜんぶ', all: true }
};
const done = {}, best = {};
const MENU_BTN = '<button type="button" class="fs-btn zm-back" onclick="showMenu()">メニュー</button>';

function clearViews() { animTok++; clearInterval(timer); ['menu', 'app', 'ta'].forEach(id => document.getElementById(id).innerHTML = ''); }

function startPractice(id) {
  clearViews();
  mountZahyou(document.getElementById('app'), PRACTICE[id].angles, id, {
    onDone: () => { done[id] = true; }, menuBtn: MENU_BTN,
    finalExtra: '<p><button type="button" class="fs-btn" onclick="showMenu()">メニューにもどる</button></p>'
  });
  window.scrollTo(0, 0);
}

// ---------------- タイムアタック・マラソン ----------------
const VALUES = ['0', '1', '−1', '1/2', '−1/2', '√3/2', '−√3/2', '1/√2', '−1/√2', '√3', '−√3', '1/√3', '−1/√3', 'なし'];
const NEAR = { '1/2': ['√3/2', '1/√2'], '√3/2': ['1/2', '1/√2'], '1/√2': ['1/2', '√3/2', '1'], '√3': ['1/√3', '√3/2'], '1/√3': ['√3', '1/2'], '1': ['0', '1/√2', '√3'], '0': ['なし', '1', '−1'], 'なし': ['0', '1'] };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// 選択肢：まちがえやすい値（符号ちがい・sin と cos の取りちがえ・tan の逆数・0 と なし）を先に入れる
function choicesFor(correct) {
  const minus = correct[0] === '−', abs = minus ? correct.slice(1) : correct;
  const signed = v => (minus && v !== '0' && v !== 'なし') ? '−' + v : v;
  let traps = (correct !== '0' && correct !== 'なし') ? [minus ? abs : '−' + abs] : [];
  traps = traps.concat(shuffle((NEAR[abs] || []).map(signed)), shuffle(VALUES.slice()));
  const out = [correct];
  for (const v of traps) { if (out.length >= 6) break; if (!out.includes(v)) out.push(v); }
  return shuffle(out);
}
let run = null, timer = null;
function startRun(id) {
  clearViews();
  const R = RUNS[id], qs = [];
  Object.keys(T).map(Number).filter(d => R.all ? d !== 360 : d <= 180).forEach(d => ['sin', 'cos', 'tan'].forEach((f, k) => qs.push({ d, f, v: T[d][3 + k] })));
  shuffle(qs);
  run = { id, qs: R.n ? qs.slice(0, R.n) : qs, i: 0, miss: 0, t0: performance.now(), lock: false, picked: [], wrong: [] };
  timer = setInterval(tick, 100);
  renderRun(); window.scrollTo(0, 0);
}
const fmt = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), d = Math.floor(ms % 1000 / 100); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + d; };
function tick() { const el = document.getElementById('ta-timer'); if (el && run) el.textContent = fmt(performance.now() - run.t0); }
function renderRun() {
  const q = run.qs[run.i], el = document.getElementById('ta');
  if (!q.ch) q.ch = choicesFor(q.v);
  el.innerHTML = `<div class="ta-wrap">
    <div class="ta-top">${MENU_BTN}<span class="ta-count">${RUNS[run.id].name}　${run.i + 1} / ${run.qs.length}</span><span class="ta-timer" id="ta-timer">${fmt(performance.now() - run.t0)}</span></div>
    <div class="ta-bar"><span style="width:${run.i / run.qs.length * 100}%"></span></div>
    <div class="ta-q ${q.f}">${FillSteps.md(`${q.f} ${q.d}° =`)}<span class="qm">?</span></div>
    <div class="ta-opts">${q.ch.map((v, k) => `<button type="button" class="ta-opt${run.picked.includes(v) ? ' ng' : ''}" data-k="${k}"${run.picked.includes(v) ? ' disabled' : ''}>${FillSteps.valHTML(v)}</button>`).join('')}</div>
  </div>`;
  el.querySelectorAll('.ta-opt').forEach(b => b.onclick = () => answer(q, q.ch[+b.dataset.k], b));
}
function answer(q, v, b) {
  if (run.lock || b.disabled) return;
  if (v === q.v) {
    run.lock = true; b.classList.add('ok');
    setTimeout(() => { run.i++; run.picked = []; run.lock = false; run.i >= run.qs.length ? finishRun() : renderRun(); }, 220);
  } else { run.miss++; run.picked.push(v); if (!run.wrong.includes(q)) run.wrong.push(q); (q.you = q.you || []).push(v); renderRun(); }
}
function finishRun() {
  clearInterval(timer);
  const ms = performance.now() - run.t0, id = run.id, R = RUNS[id];
  const prev = best[id], newBest = prev && ms < prev; if (!prev || newBest) best[id] = ms; done[id] = true;
  document.getElementById('ta').innerHTML = `<div class="ta-wrap ta-res">
    <h2>${R.name}　クリア</h2><div class="t">${fmt(ms)}</div>
    <p>${run.miss ? 'まちがえた回数　' + run.miss + ' 回' : 'ノーミス'}${newBest ? '　記録更新！' : ''}</p>
    ${run.wrong.length ? '<p><button type="button" class="fs-btn primary" onclick="showReview()">間違えた問題を確認する（' + run.wrong.length + '問）</button></p>' : ''}
    <div class="fs-nav"><button type="button" class="fs-btn" onclick="showMenu()">メニューへ</button><button type="button" class="fs-btn${run.wrong.length ? '' : ' primary'}" onclick="startRun('${id}')">もう一度</button></div></div>`;
  window.scrollTo(0, 0);
}
// 間違えた問題の解説（P が回る図と、P の座標・r から値を出す式）
function showReview() {
  const id = run.id;
  const items = run.wrong.map(q => {
    const [x, y, r] = T[q.d], u = q.f === 'sin' ? ['y', y, 'r', r] : q.f === 'cos' ? ['x', x, 'r', r] : ['y', y, 'x', x];
    const ex = q.v === 'なし' ? `P(${x}, ${y}) で x = 0 なので、${q.f} ${q.d}° = {y|x} は 0 でわることになり、値はなし。`
      : `P(${x}, ${y})、r = ${r} なので、${q.f} ${q.d}° = {${u[0]}|${u[2]}} = {${u[1]}|${u[3]}}${u[1] + "/" + u[3] === q.v ? "" : " = " + tex(q.v)}`;
    return `<div class="rv-item"><h3>${md(`${q.f} ${q.d}° = ${tex(q.v)}`)}</h3>
      <p class="you">選んだ答え：${q.you.map(v => FillSteps.valHTML(v)).join('、')}</p>
      <p class="ex">${md(ex)}</p>${zahyouFig(q.d, q.d, { xy: [x, y], r })}</div>`;
  }).join('');
  document.getElementById('ta').innerHTML = `<div class="ta-wrap"><div class="ta-top">${MENU_BTN}<span class="ta-count">${RUNS[id].name}　間違えた問題</span></div>
    <div class="rv-list">${items}</div>
    <div class="fs-nav"><button type="button" class="fs-btn" onclick="showMenu()">メニューへ</button><button type="button" class="fs-btn primary" onclick="startRun('${id}')">もう一度</button></div></div>`;
  window.scrollTo(0, 0);
}

// ---------------- メニュー ----------------
function showMenu() {
  clearViews();
  const item = (id, cls, m, fn, icon) => `<button type="button" class="zm-item ${cls}" onclick="${fn}('${id}')"><span class="ic">${icon}</span><b>${m.name}</b><span class="s">${m.sub}</span>${done[id] ? `<span class="ok">✓${best[id] ? ' ' + fmt(best[id]) : ''}</span>` : ''}</button>`;
  document.getElementById('menu').innerHTML = `<div class="zm">
  <section class="zm-sec"><h2>数学Ⅰ<small>0° ≦ θ ≦ 180°</small></h2>
    <div class="zm-list">${item('basic', '', PRACTICE.basic, 'startPractice', menuIcon('ang', 150))}${item('axis', '', PRACTICE.axis, 'startPractice', menuIcon('ang', 90))}
    ${item('ta1', 'ta', RUNS.ta1, 'startRun', menuIcon('ta', 0, ORANGE))}${item('mr1', 'mr', RUNS.mr1, 'startRun', menuIcon('mr', 0, GREEN))}</div></section>
  <section class="zm-sec m2"><h2>数学Ⅱの予習<small>180° をこえる角</small></h2>
    <div class="zm-list">${item('m2a', 'm2', PRACTICE.m2a, 'startPractice', menuIcon('ang', 210, PURPLE))}${item('m2b', 'm2', PRACTICE.m2b, 'startPractice', menuIcon('ang', 270, PURPLE))}
    ${item('ta2', 'ta', RUNS.ta2, 'startRun', menuIcon('ta', 0, ORANGE))}${item('mr2', 'mr', RUNS.mr2, 'startRun', menuIcon('mr', 0, GREEN))}</div></section>
  <p class="zm-note">P の座標から三角比を考える練習・θ を求める問題は <a href="sankakuhi-zahyou.html">30. 三角比（座標）</a> へ</p></div>`;
  window.scrollTo(0, 0);
}
showMenu();
</script>
</body></html>
