<script>
let mode='', lv=1, qIdx=0, probs=[], input=[], cursor=0;
let solved = false;   // 【ブラッシュアップ】正解のあとの連打よけ
const chars = ['a', 'b', 'x', 'y'];

function getGCD(a, b) { return b === 0 ? a : getGCD(b, a % b); }

function goBackToMenu() {
  document.getElementById('done').classList.add('hidden');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('message').innerText = '';
  input = []; cursor = 0;
}

function start(l, m) {
  lv=l; mode=m; qIdx=0;
  generate();
  document.getElementById('done').classList.add('hidden');
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  show();
}

// 【ブラッシュアップ】問題の作り方と答え合わせを作り直した（2 回目のブラッシュアップ）。
//   ・文字は ABC 順に並べる（元は 18xa・7yx・30ba のような並びが出ていた）
//   ・最大公約数が 2 ばかりにならないよう、共通因数を先に決めてから問題を作る
//   ・レベル3（次数ちがい・3項・先頭が負・1 が残る・文字2種類）とレベル4（かっこでくくる）を追加
//   ・4択の誤答は「くくり不足」「割り忘れ」「符号」など、よくあるまちがいから作る（元は 2 割ほどの問題で
//     「2(5x+26y)」のような意味のない選択肢や、同じ選択肢が 2 つ出ていた）
//   ・つなげるの答え合わせは「展開するともとの式になるか」「かっこの中にまだくくれるものが残っていないか」で見る
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function gcd2(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }

// --- 式の計算：単項式 { c: 係数, v: { 文字: 次数 } }、多項式は単項式の配列 ---
function mono(c, v) { return { c: c, v: Object.assign({}, v || {}) }; }
function vkey(v) { return Object.keys(v).filter(k => v[k]).sort().map(k => k + v[k]).join(''); }
function mmul(p, q) { const v = Object.assign({}, p.v); for (const k in q.v) v[k] = (v[k] || 0) + q.v[k]; return mono(p.c * q.c, v); }
function pnorm(P) {
  const m = {}, order = [];
  P.forEach(t => { const k = vkey(t.v); if (!m[k]) { m[k] = mono(0, t.v); order.push(k); } m[k].c += t.c; });
  return order.map(k => m[k]).filter(t => t.c !== 0);
}
function pmul(P, Q) { const out = []; P.forEach(p => Q.forEach(q => out.push(mmul(p, q)))); return pnorm(out); }
function pkey(P) { return pnorm(P).map(t => t.c + '*' + vkey(t.v)).sort().join('|'); }
function pgcd(P) { return P.reduce((g, t) => gcd2(g, t.c), 0); }
function pcommonVar(P) { return ['a', 'b', 'x', 'y'].some(k => P.every(t => (t.v[k] || 0) > 0)); }
function expand(f) { let r = [f.head || mono(1, {})]; f.groups.forEach(G => { r = pmul(r, G); }); return r; }

// --- 表示（HTML） ---
function monoHTML(t, first, tight) {
  const vs = Object.keys(t.v).filter(k => t.v[k]).sort();
  const abs = Math.abs(t.c);
  let s = (abs === 1 && vs.length) ? '' : String(abs);
  vs.forEach(k => { s += k + (t.v[k] > 1 ? '<sup>' + t.v[k] + '</sup>' : ''); });
  const sp = tight ? '' : ' ';
  const sign = t.c < 0 ? (first ? '−' : sp + '−' + sp) : (first ? '' : sp + '+' + sp);
  return sign + s;
}
function polyHTML(P, tight) { return P.map((t, i) => monoHTML(t, i === 0, tight)).join(''); }
function factHTML(f) {   // 答えの形：3x(2x+3)、(x−y)(a+b)
  let s = '';
  if (f.head) s += (f.head.c === -1 && !vkey(f.head.v)) ? '−' : monoHTML(f.head, true, true);
  f.groups.forEach(G => { s += '(' + polyHTML(G, true) + ')'; });
  return s;
}

// --- 問題を作る ---
function coprimePair(max) { let k1, k2; do { k1 = ri(1, max); k2 = ri(1, max); } while (k1 === k2 || gcd2(k1, k2) !== 1); return [k1, k2]; }
function others(used) { return ['a', 'b', 'x', 'y'].filter(k => used.indexOf(k) < 0); }
function makeProblem(level, i) {
  let head = null, groups, q = null;
  const v1 = {};
  if (level === 1 || level === 2) {
    // 先生の版と同じ流れ：レベル1 は 1・2 問目が数だけ、3〜5 問目は数と文字。レベル2 は文字（2乗も）をくくる
    const c1 = pick(['a', 'x', 'b', 'y']);
    const c2 = pick(others([c1]));
    if (level === 1) { if (i >= 2) v1[c1] = 1; }
    else { v1[c1] = i >= 2 ? 2 : 1; if (i === 4) v1[c2] = 1; }
    const inner = others(Object.keys(v1));
    const u0 = pick(inner), w0 = pick(inner.filter(k => k !== u0));
    const [u, w] = [u0, w0].sort();   // 項は ABC 順（12ax + 18ay）
    const g = level === 1 ? pick([2, 3, 4, 4, 5, 6, 6, 8]) : pick([2, 3, 4, 6, 6, 8, 9, 12]);
    let k; do { k = coprimePair(level === 1 ? 5 : 7); } while (g * Math.max(k[0], k[1]) > (level === 1 ? 30 : 60));
    head = mono(g, v1);
    groups = [[mono(k[0], { [u]: 1 }), mono(k[1], { [w]: 1 })]];
  } else if (level === 3) {
    const L = pick(['x', 'a']);
    if (i === 0) {        // 次数のちがう共通の文字：6x² + 9x = 3x(2x + 3)
      const g = pick([2, 3, 4, 5, 6]), k = coprimePair(5);
      head = mono(g, { [L]: 1 });
      groups = [[mono(k[0], { [L]: 1 }), mono(k[1] * pick([1, -1]), {})]];
    } else if (i === 1) { // 3 項：3x² − 6x + 9 = 3(x² − 2x + 3)
      const g = pick([2, 3, 4, 5]);
      let a1, a2, a3; do { a1 = ri(1, 3); a2 = ri(1, 5) * pick([1, -1]); a3 = ri(1, 7) * pick([1, -1]); } while (gcd2(gcd2(a1, a2), a3) !== 1 || Number.isInteger(Math.sqrt(a2 * a2 - 4 * a1 * a3)));   // かっこの中がさらに因数分解できるものは出さない
      head = mono(g, {});
      groups = [[mono(a1, { [L]: 2 }), mono(a2, { [L]: 1 }), mono(a3, {})]];
    } else if (i === 2) { // 先頭が負：−2x + 4 = −2(x − 2)
      const g = pick([2, 3, 4, 5, 6]), k = coprimePair(4);
      head = mono(-g, {});
      groups = [[mono(k[0], { [L]: 1 }), pick([mono(-k[1], {}), mono(k[1], {}), mono(k[1], { y: 1 })])]];
    } else if (i === 3) { // 1 が残る：ab + a = a(b + 1)
      const u = pick(['a', 'x']), w = u === 'a' ? 'b' : 'y';
      head = mono(pick([1, 2, 3]), { [u]: 1 });
      groups = [[mono(pick([1, 1, 2, 3]), { [w]: 1 }), mono(1, {})]];
    } else {              // 文字 2 種類：4a²b − 6ab² = 2ab(2a − 3b)
      const [u, w] = pick([['a', 'b'], ['x', 'y']]);
      const g = pick([2, 3, 4]), k = coprimePair(5);
      head = mono(g, { [u]: 1, [w]: 1 });
      groups = [[mono(k[0], { [u]: 1 }), mono(-k[1], { [w]: 1 })]];
    }
  } else {
    // レベル4：かっこの式をくくる（共通因数を前に出す）
    const [p, q2, r, s] = pick([['a', 'b', 'x', 'y'], ['x', 'y', 'a', 'b']]);
    const m = (c, l) => mono(c, l ? { [l]: 1 } : {});
    const G1 = [m(1, r), m(-1, s)], G1p = [m(1, r), m(1, s)];
    if (i === 0) { groups = [G1, [m(1, p), m(1, q2)]]; q = p + '(' + r + ' − ' + s + ') + ' + q2 + '(' + r + ' − ' + s + ')'; }
    else if (i === 1) { groups = [G1, [m(1, p), m(-1, q2)]]; q = p + '(' + r + ' − ' + s + ') − ' + q2 + '(' + r + ' − ' + s + ')'; }
    else if (i === 2) { groups = [G1, [m(1, p), m(-1, q2)]]; q = p + '(' + r + ' − ' + s + ') + ' + q2 + '(' + s + ' − ' + r + ')'; }
    else if (i === 3) { const k = coprimePair(5); groups = [G1p, [m(k[0], p), m(-k[1], q2)]]; q = (k[0] === 1 ? '' : k[0]) + p + '(' + r + ' + ' + s + ') − ' + (k[1] === 1 ? '' : k[1]) + q2 + '(' + r + ' + ' + s + ')'; }
    else { groups = [[m(1, p), m(1, q2)], G1p]; }
  }
  const f = { head: head, groups: groups };
  const poly = expand(f);
  return { f: f, poly: poly, q: q || polyHTML(poly), ans: factHTML(f) };
}

// --- 4択の誤答（よくあるまちがい） ---
function wrongChoices(pr) {
  const out = [];
  const head = pr.f.head, P = pr.f.groups[0];
  const add = (f, kind) => out.push({ html: factHTML(f), kind: kind });
  if (head) {
    const g = Math.abs(head.c), sg = Math.sign(head.c), hv = head.v;
    const p = [2, 3, 5, 7].find(p => g % p === 0 && g > p);
    if (p) add({ head: mono(sg * g / p, hv), groups: [P.map(t => mono(t.c * p, t.v))] }, 'under');           // くくり不足（数）
    if (vkey(hv) && g > 1) add({ head: mono(head.c, {}), groups: [P.map(t => mmul(t, mono(1, hv)))] }, 'under');        // くくり不足（文字）
    if (head.c < 0) add({ head: mono(-head.c, hv), groups: [P.map(t => mono(-t.c, t.v))] }, 'minus');        // − をくくり出していない
    if (P.length === 2 && P.some(t => !vkey(t.v) && Math.abs(t.c) === 1)) add({ head: head, groups: [[P[0]]] }, 'one');   // 1 を書き忘れ（6x(3x) のように）
    add({ head: head, groups: [P.map((t, i) => i === P.length - 1 ? mmul(t, head) : t)] }, 'forgot');         // 割り忘れ
    add({ head: head, groups: [P.map((t, i) => i === P.length - 1 ? mono(-t.c, t.v) : t)] }, 'sign');         // 符号
    add({ head: head, groups: [P.map((t, i) => i === 0 ? mono(t.c + 1, t.v) : t)] }, 'calc');                 // わり算のミス
  } else {
    // レベル4：かっこの中の符号のまちがい
    const [A, B] = pr.f.groups;
    const flip = G => [G[0], mono(-G[1].c, G[1].v)];
    add({ head: null, groups: [A, flip(B)] }, 'sign');
    add({ head: null, groups: [flip(A), B] }, 'sign');
    add({ head: null, groups: [flip(A), flip(B)] }, 'sign');
  }
  const seen = new Set([pr.ans]);
  return out.filter(o => { if (seen.has(o.html)) return false; seen.add(o.html); return true; }).slice(0, 3);
}
const WRONG_MSG = {
  under: 'まだくくれるよ！かっこの中に、共通な数や文字が残っている。',
  minus: '先頭が − のときは − もくくり出して、かっこの中の最初の項を ＋ にしよう。',
  one: 'くくり出したあとには 1 が残るよ（a = a × 1）。',
  forgot: 'かっこの中のすべての項を、共通因数でわった？',
  sign: '符号に注意！展開して、もとの式にもどるか確かめよう。',
  calc: 'わり算をもう一度。展開して、もとの式にもどるか確かめよう。'
};

function generate() {
  probs = [];
  for (let i = 0; i < 5; i++) {
    let pr, tries = 0;
    do { pr = makeProblem(lv, i); tries++; } while (tries < 20 && probs.some(o => o.ans === pr.ans));
    probs.push(pr);
  }
}

function show() {
  input = []; cursor = 0;
  const p = probs[qIdx];
  document.getElementById('q-info').innerText = '第 ' + (qIdx + 1) + ' 問 / 5';
  const box = document.getElementById('problem');
  box.innerHTML = '<span>' + p.q + '</span>';   // flex の中で上つき文字がずれないように 1 つにまとめる
  box.classList.toggle('long', box.textContent.length > 11);   // 長い式は文字を小さく（スマホではみ出さないように）
  document.getElementById('message').innerText = '';
  document.getElementById('answer-note').innerText = '';
  solved = false;
  document.getElementById('game').classList.remove('locked');

  if (mode == 'choice') {
    document.getElementById('choice-mode').classList.remove('hidden');
    document.getElementById('build-mode').classList.add('hidden');
    const list = document.getElementById('choice-list');
    list.innerHTML = '';
    const options = [{ html: p.ans, kind: 'ok' }].concat(wrongChoices(p)).sort(() => Math.random() - 0.5);
    options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'nav-card build1-green'; b.style.padding = '20px 5px'; b.innerHTML = opt.html;
      b.onclick = () => {
        if (opt.kind === 'ok') success();
        else { b.disabled = true; document.getElementById('message').innerText = WRONG_MSG[opt.kind]; }
      };
      list.appendChild(b);
    });
  } else {
    document.getElementById('build-mode').classList.remove('hidden');
    document.getElementById('choice-mode').classList.add('hidden');
    renderEdit();
    const kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    // キー：答えに使う数字、文字 a・b・x・y、記号、2乗。最後に「1字消す」「全部消す」
    const digits = [...new Set(('1' + p.ans.replace(/<sup>\d+<\/sup>/g, '')).replace(/[^0-9]/g, '').split(''))].sort();
    const keys = digits.concat(['a', 'b', 'x', 'y', '(', ')', '+', '-', '^']);
    keys.forEach(k => {
      const b = document.createElement('button');
      if (k == '^') { b.className = 'key exp'; b.innerHTML = '<sup>2</sup>'; }
      else { b.className = 'key'; b.innerText = k === '-' ? '−' : k; }
      b.onclick = () => addInput(k);
      kb.appendChild(b);
    });
    // 【ブラッシュアップ】元は消すキーがなく、スマホでは 1 字まちがえると直せなかった
    const bs = document.createElement('button');
    bs.className = 'key key-del'; bs.innerText = '⌫'; bs.title = '1字消す';
    bs.onclick = () => backspace();
    kb.appendChild(bs);
    const cl = document.createElement('button');
    cl.className = 'key key-del'; cl.innerText = '全消し';
    cl.onclick = () => clearInput();
    kb.appendChild(cl);
  }
}

function addInput(k) { input.splice(cursor, 0, k); cursor++; renderEdit(); }

function renderEdit() {
  const ed = document.getElementById('editor');
  ed.innerHTML = '';
  input.forEach((c, i) => {
    if(i==cursor) ed.innerHTML += '<div class="cursor"></div>';
    let span = document.createElement('span');
    span.className = 'char-span';
    span.innerHTML = c=='^' ? '<sup>2</sup>' : c=='-' ? '−' : c;   // 【ブラッシュアップ】
    ed.appendChild(span);
  });
  if(cursor==input.length) ed.innerHTML += '<div class="cursor"></div>';
}

function handleEditorClick(e) {
  const rect = document.getElementById('editor').getBoundingClientRect();
  const x = e.clientX - rect.left;
  const spans = document.querySelectorAll('.char-span');
  let newIdx = spans.length;
  for(let i=0; i<spans.length; i++) {
    if(x < spans[i].offsetLeft + spans[i].offsetWidth / 2) { newIdx = i; break; }
  }
  cursor = newIdx; renderEdit();
}

// 【ブラッシュアップ】キー操作は「つなげる」のときだけ。日本語入力中のキーは無視する
window.onkeydown = (e) => {
  if (document.getElementById('game').classList.contains('hidden') || solved || mode !== 'build' || e.isComposing) return;
  if (e.key >= '0' && e.key <= '9') addInput(e.key);
  else if (['a', 'b', 'x', 'y', '(', ')', '+', '-'].includes(e.key)) addInput(e.key);
  else if (e.key === '^') addInput('^');
  else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
  else if (e.key === 'ArrowLeft') { cursor = Math.max(0, cursor - 1); renderEdit(); }
  else if (e.key === 'ArrowRight') { cursor = Math.min(input.length, cursor + 1); renderEdit(); }
  else if (e.key === 'Enter') check();
};
function backspace() { if (cursor > 0) { input.splice(cursor - 1, 1); cursor--; renderEdit(); } }
function clearInput() { input = []; cursor = 0; renderEdit(); }

// 【ブラッシュアップ】入力した式を読む。形：[−][単項式]( 多項式 )( 多項式 )…　「^」は直前の文字の 2 乗
function parseMono(s) {
  const m = s.match(/^(\d*)((?:[abxy]\^?)*)$/);
  if (!m || (m[1] === '' && m[2] === '')) return null;
  const v = {};
  (m[2].match(/[abxy]\^?/g) || []).forEach(t => { v[t[0]] = (v[t[0]] || 0) + (t[1] ? 2 : 1); });
  return { t: mono(m[1] === '' ? 1 : +m[1], v), one: m[1] === '1' && m[2] !== '' };
}
function parseAnswer(str) {
  const m = str.match(/^(-?)([^()]*)((?:\([^()]+\))+)$/);
  if (!m) return null;
  let head = null, one = false;
  if (m[2] !== '') { const h = parseMono(m[2]); if (!h) return null; head = h.t; one = h.one; }
  if (m[1] === '-') head = head ? mono(-head.c, head.v) : mono(-1, {});
  const groups = [];
  for (const g of m[3].match(/\([^()]+\)/g)) {
    const inner = g.slice(1, -1);
    if (!/^[+-]?[^+-]+(?:[+-][^+-]+)+$/.test(inner)) return null;   // かっこの中は 2 項以上
    const terms = inner.match(/[+-]?[^+-]+/g).map(t => {
      const p = parseMono(t.replace(/^[+-]/, ''));
      if (!p) return null;
      if (p.one) one = true;
      if (t[0] === '-') p.t.c = -p.t.c;
      return p.t;
    });
    if (terms.some(t => !t)) return null;
    groups.push(terms);
  }
  return { head: head, groups: groups, one: one };
}
// 【ブラッシュアップ】答え合わせ：元は決まった書き方の文字列と比べていた。
//   「展開するともとの式になる」「かっこの中にまだくくれるものがない」「かっこの中の最初の項が +」なら正解。
function judge(str, p) {
  const a = parseAnswer(str);
  if (!a) return 'かっこでくくった「かけ算の形」で入力しよう（例：3x(2x+3)）';
  if (a.one) return '1a の「1」は省略してね！';
  if (pkey(expand(a)) !== pkey(p.poly)) return '展開すると、もとの式にもどらないよ。割り算や符号をチェック！';
  if (a.groups.length < p.f.groups.length || a.groups.some(G => pgcd(G) > 1 || pcommonVar(G))) return WRONG_MSG.under;
  if (a.groups.some(G => G[0].c < 0)) return WRONG_MSG.minus;
  return '';
}
function check() {
  const msg = judge(input.join(''), probs[qIdx]);
  if (!msg) success();
  else document.getElementById('message').innerText = msg;
}

function success() {
  if (solved) return;   // 【ブラッシュアップ】元は正解を続けて押すと 1 問とばしていた
  solved = true;
  document.getElementById('game').classList.add('locked');
  document.getElementById('message').innerHTML = '<span style="color:var(--correct)">✨ 正解！すごすぎる！ ✨</span>';
  setTimeout(() => {
    qIdx++;
    if(qIdx<5) show();
    else {
      // 【ブラッシュアップ】alert をやめて終了画面を出す
      document.getElementById('game').classList.add('hidden');
      document.getElementById('done').classList.remove('hidden');
      window.scrollTo(0, 0);
    }
  }, 1000);
}

// 【ブラッシュアップ】alert をやめて、画面の中に答えを出す
function showHint() { document.getElementById('answer-note').innerHTML = '答え： ' + probs[qIdx].ans; }   // 【ブラッシュアップ】
</script>
<script>
  // 【ブラッシュアップ】式の文字を斜体に（教科書の書き方）。textContent は変えない
  (function () {
    var RUN = /[A-Za-z0-9²³√±'()=+\-−·×÷\/.,<> ]*[A-Za-z0-9][A-Za-z0-9²³√±'()=+\-−·×÷\/.,<> ]*/g;
    var SKIP = ".m, .no-math, script, style, textarea, mjx-container";
    var SELS = ["#problem","#choice-list","#keyboard","#editor","#message","#answer-note"];
    function mathify(root) {
      if (!root || !document.createTreeWalker) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
      while (walker.nextNode()) {
        var n = walker.currentNode, p = n.parentElement;
        if (!p || p.closest(SKIP)) continue;
        if (/[A-Za-z0-9]/.test(n.nodeValue)) nodes.push(n);
      }
      nodes.forEach(function (n) {
        var s = n.nodeValue, frag = document.createDocumentFragment(), last = 0;
        s.replace(RUN, function (run, at) {
          var lead = run.match(/^\s*/)[0].length, text = run.trim();
          if (!text) return run;
          frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
          text.split(/(\b\d+F\b)/).forEach(function (seg, j) {
            if (!seg) return;
            if (j % 2) { frag.appendChild(document.createTextNode(seg)); return; }   // 「6F」のような階の番号はそのまま
            var span = document.createElement('span');
            span.className = 'm';
            seg.split(/([A-Za-z]+)/).forEach(function (part, k) {
              if (!part) return;
              if (k % 2) { var i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
              else span.appendChild(document.createTextNode(part));
            });
            frag.appendChild(span);
          });
          last = at + lead + text.length;
          return run;
        });
        frag.appendChild(document.createTextNode(s.slice(last)));
        n.parentNode.replaceChild(frag, n);
      });
    }
    var queued = false;
    function run() { queued = false; SELS.forEach(function (sel) { document.querySelectorAll(sel).forEach(mathify); }); }
    function start() {
      run();
      if (window.MutationObserver) new MutationObserver(function () { if (!queued) { queued = true; (window.requestAnimationFrame || setTimeout)(run); } })
        .observe(document.body, { childList: true, subtree: true, characterData: true });
    }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  })();
</script>

  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({

    "#choice-list .nav-card:disabled": "u-ng",

    ".big-btn.hint": "u-btn u-btn-plain",
    "#done .nav .big-btn:not(.submit)": "u-btn u-btn-plain"
  });
</script>
