    .res-btn-next-level { background: linear-gradient(45deg, #00e5ff, #2575fc); color: #000; box-shadow: 0 4px 15px rgba(0,229,255,0.3); }
    .res-btn-next-level:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,229,255,0.5); }
    .res-btn-back-diff { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .res-btn-back-diff:hover { background: rgba(255,255,255,0.2); }
    .res-btn-home { background: transparent; color: var(--accent-blue); border: 2px solid var(--accent-blue); }
    .res-btn-home:hover { background: var(--accent-blue); color: #000; }

    .loader { text-align: center; padding: 50px 0; font-size: 18px; color: #aaa; }

    /* 【ブラッシュアップ】 */
    body { flex-direction: column; align-items: center; }
    .port-back { max-width: 900px; color: #aaa; }
    .q-box.math-wait, .options-grid.math-wait { visibility: hidden; }
    /* 発展フロアの色（10F〜12F）と総合ランダム（13F） */
    .f10 { background: linear-gradient(135deg, #00897b, #26a69a); }
    .f11 { background: linear-gradient(135deg, #3949ab, #5c6bc0); }
    .f12 { background: linear-gradient(135deg, #c2185b, #ec407a); }
    .f13 { background: linear-gradient(135deg, #e056fd, #be2edd); }
    .menu-sub { font-size: 17px; font-weight: 800; margin: 18px 0 10px; }
    .menu-sub:first-child { margin-top: 0; }
    .judge-msg { text-align: center; font-size: 18px; font-weight: 800; min-height: 1.4em; margin-top: 14px; }
    .judge-msg.close { color: #b45309; }

    /* 【ブラッシュアップ】スマホ用の表示（画面の幅が 640px 以下のときだけ切り替わる） */
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 16px 12px 22px; border-radius: 16px; min-height: 0; }
      /* HOME・戻るボタンがタイトルに重なっていたので、タイトルの上に並べる */
      .nav-buttons { position: static; margin-bottom: 10px; }

      .diff-btn { width: 100%; font-size: 20px; padding: 20px; }
      .q-box { font-size: 21px; margin: 18px 0; }
      /* 【ブラッシュアップ】選択肢は 2 列のまま（1 列だと解説と「次へ」まで毎回スクロールが必要だった） */
      .options-grid { gap: 8px; }
      .opt-btn { font-size: 19px; padding: 14px 6px; min-height: 64px; }
      .res-btn { width: 100%; font-size: 17px; padding: 16px; }
    }</style>
    <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    :root { --text-main: var(--u-ink); --accent-blue: var(--u-title); }

</head>
<body class="u-theme">
  <a class="port-back" href="../remake.html">← 教材の一覧へ</a>

  <div class="container tex2jax_process">
    <div class="nav-buttons">
      <button class="back-btn" id="home-btn" style="display:none;" onclick="showMenuScreen()">
        <span class="material-icons">home</span>HOME
      </button>
      <button class="back-btn" id="back-nav-btn" style="display:none;">
        <span class="material-icons">arrow_back</span>戻る
      </button>
    </div>

    <!-- 【ブラッシュアップ】14「ルートの基礎」と名前が同じだったので「発展編」に。発展フロアを足した -->
    <h1 class="title">平方根タワー 発展編</h1>
    <div class="subtitle">式の値・整数部分と小数部分・二重根号に挑戦！（1F〜9F はおさらい） 🗼</div>

    <div id="scr-load" class="screen active"><div class="loader">データを展開しています...</div></div>

    <div id="scr-menu" class="screen">
      <div class="section-title">ステージを選択</div>
      <!-- 【ブラッシュアップ】14「ルートの基礎」との役割分担：こちらは発展が中心。1F〜9F はおさらい -->
      <div class="menu-sub">🚀 発展フロア</div>
      <div class="menu-grid" id="menu-grid-adv"></div>
      <div class="menu-sub">📘 おさらいフロア（1F〜9F：14「ルートの基礎」と同じはんい）</div>
      <div class="menu-grid" id="menu-grid-container"></div>
    </div>

    <div id="scr-diff" class="screen">
      <div class="section-title" id="diff-title-floor"></div>
      <div class="diff-container" id="diff-buttons-container"></div>
    </div>

    <div id="scr-quiz" class="screen">
      <div style="display:flex; justify-content:space-between; color:#aaa; font-size:14px;">
        <span id="quiz-header-title"></span>
        <span id="quiz-header-counter"></span>
      </div>
      <div class="progress-container"><div class="progress-bar" id="p-bar"></div></div>
      
      <div class="q-box" id="q-text"></div>
      <div class="options-grid" id="opts-grid"></div>

      <!-- 【ブラッシュアップ】まちがえたとき・おしいときのことば -->
      <div id="judge-msg" class="judge-msg"></div>
      <div id="explanation-area">
        <div style="color:var(--accent-blue); font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:5px;">
          <span class="material-icons" style="font-size:18px;">menu_book</span>解説
        </div>
        <div id="exp-text"></div>
      </div>

      <div class="next-zone" id="next-zone">
        <button class="action-btn" id="next-q-btn">次へ進む</button>
      </div>
    </div>

    <div id="scr-res" class="screen">
      <div style="text-align:center; padding-top:10px;">
        <div style="font-size:28px; color:var(--accent-blue); font-weight:700; margin-bottom:15px;" id="res-score-text"></div>
        <div style="margin-bottom:10px; font-size:16px; color:#ccc;" id="res-comment-text"></div>
        
        <div class="res-buttons-flex" id="res-actions-container"></div>
      </div>
    </div>
  </div>

  <script>
    let masterData = {};
    let activeQuestions = [];
    let currentIdx = 0;
    let correctCount = 0;
    let selectedFloorId = null;
    let selectedLevel = "";
    let isCorrected = false;
    let currentQuestionMistakes = 0; 

    const difficultyOrder = ["初級", "中級", "上級", "中級・上級まとめ"];
    const RANDOM_F = 13;   // 【ブラッシュアップ】総合ランダムのフロア番号（元は 10F。発展フロア 10F〜12F を足したので 13F に）

    window.addEventListener('DOMContentLoaded', () => {
      google.script.run.withSuccessHandler(data => {
        masterData = data;
        buildFloorMenu();
        showMenuScreen();
      }).getQuizDataFixed();
    });

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMenuScreen() {
      selectedFloorId = null;
      selectedLevel = "";
      document.getElementById('home-btn').style.display = 'none';
      document.getElementById('back-nav-btn').style.display = 'none';
      showScreen('scr-menu');
    }

    function buildFloorMenu() {
      // 【ブラッシュアップ】発展フロア（10F〜12F）と総合ランダムを上に、1F〜9F を「おさらい」として下に並べる
      const container = document.getElementById('menu-grid-container');
      const adv = document.getElementById('menu-grid-adv');
      container.innerHTML = "";
      adv.innerHTML = "";
      const card = (cls, label, name, onclick) => {
        const div = document.createElement('div');
        div.className = 'floor-card ' + cls;
        div.innerHTML = '<div style="font-size:24px; font-weight:700;">' + label + '</div><div style="font-size:14px; opacity:0.9; font-weight:500;">' + name + '</div>';
        div.onclick = onclick;
        return div;
      };
      for (let i = 1; i <= 12; i++) {
        if (!masterData[i]) continue;
        let shortName = masterData[i].name.split('：')[1] || masterData[i].name;
        (i >= 10 ? adv : container).appendChild(card('f' + i, i + 'F', shortName, () => showDiffScreen(i)));
      }
      adv.appendChild(card('f13', RANDOM_F + 'F', '総合ランダム', () => showDiffScreen(RANDOM_F)));
    }

    function showDiffScreen(floorId) {
      selectedFloorId = floorId;
      selectedLevel = "";
      document.getElementById('home-btn').style.display = 'flex';
      document.getElementById('back-nav-btn').style.display = 'flex';
      document.getElementById('back-nav-btn').onclick = showMenuScreen;
      
      const btnContainer = document.getElementById('diff-buttons-container');
      btnContainer.innerHTML = "";

      if (floorId === RANDOM_F) {
        document.getElementById('diff-title-floor').textContent = RANDOM_F + "F：総合ランダム（1F〜12F 各1問・計12問）";
        ["初級", "中級", "上級"].forEach(level => {
          const btn = document.createElement('button');
          btn.className = `diff-btn ${level === '初級' ? 'easy' : level === '中級' ? 'mid' : 'hard'}`;
          btn.textContent = `${level}のランダム`;
          btn.onclick = () => startRandomQuiz(level);
          btnContainer.appendChild(btn);
        });
      } else {
        document.getElementById('diff-title-floor').textContent = masterData[floorId].name;
        const availableLevels = Object.keys(masterData[floorId].questions);
        // 【ブラッシュアップ】ボタンが 1 つしかない難易度の画面は出さずに、すぐ始める
        if (availableLevels.length === 1) { startQuiz(floorId, availableLevels[0]); return; }
        difficultyOrder.forEach(level => {
          if (!availableLevels.includes(level)) return;
          const btn = document.createElement('button');
          let colorClass = 'easy';
          if (level === '中級') colorClass = 'mid';
          if (level === '上級' || level === '中級・上級まとめ') colorClass = 'hard';
          
          btn.className = `diff-btn ${colorClass}`;
          btn.textContent = level;
          btn.onclick = () => startQuiz(floorId, level);
          btnContainer.appendChild(btn);
        });
      }
      showScreen('scr-diff');
    }

    function startQuiz(floorId, level) {
      selectedFloorId = floorId;
      selectedLevel = level;
      activeQuestions = JSON.parse(JSON.stringify(masterData[floorId].questions[level])).sort(() => Math.random() - 0.5);
      currentIdx = 0;
      correctCount = 0;
      activeQuestions.forEach(q => { q._f = floorId; });   // 【ブラッシュアップ】「おしい」のことばをフロアに合わせるため
      document.getElementById('back-nav-btn').onclick = () => (Object.keys(masterData[floorId].questions).length === 1 ? showMenuScreen() : showDiffScreen(floorId));
      renderQuestion();
      showScreen('scr-quiz');
    }

    function startRandomQuiz(baseLevel) {
      selectedFloorId = RANDOM_F;
      selectedLevel = `${baseLevel}のランダム`;
      
      let selectedPool = [];

      for (let f = 1; f <= 12; f++) {
        if (!masterData[f] || !masterData[f].questions) continue;
        
        let floorQuestions = [];
        let searchLevels = [];
        if (baseLevel === "上級") {
          searchLevels = ["上級", "中級・上級まとめ", "中級", "初級"];
        } else if (baseLevel === "中級") {
          searchLevels = ["中級", "中級・上級まとめ", "初級", "上級"];
        } else {
          searchLevels = ["初級", "中級", "中級・上級まとめ", "上級"];
        }

        for (let lvl of searchLevels) {
          if (masterData[f].questions[lvl] && masterData[f].questions[lvl].length > 0) {
            floorQuestions = masterData[f].questions[lvl];
            break; 
          }
        }

        if (floorQuestions.length > 0) {
          const randomIdx = Math.floor(Math.random() * floorQuestions.length);
          const one = JSON.parse(JSON.stringify(floorQuestions[randomIdx]));
          one._f = f;   // 【ブラッシュアップ】「おしい」のことばをフロアに合わせるため
          selectedPool.push(one);
        }
      }

      activeQuestions = selectedPool;
      currentIdx = 0;
      correctCount = 0;
      document.getElementById('back-nav-btn').onclick = () => showDiffScreen(RANDOM_F);
      renderQuestion();
      showScreen('scr-quiz');
    }

    // 【改良機能】LaTex用の数式文字列内に含まれる「\times」や壊れた「imes」を、
    // 見やすい日本の中学数学標準の全角「×」に強制置換する関数
    function cleanMathText(text) {
      if (!text) return "";
      // もしGAS側から \times や、エスケープ漏れした imes が送られてきてもすべて「×」に統一
      return text.replace(/\\times/g, "×").replace(/imes/g, "×");
    }

    // 【ブラッシュアップ】数式の表示。MathJax の準備ができるまで隠し、読み込めないときは
    //   \frac{a}{b} → (a)/(b)、\sqrt{x} → √x のように、読める形に直して表示する。
    function texToPlain(s) {
      let t = s;
      for (let i = 0; i < 5; i++) {
        t = t.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)')
             .replace(/\\sqrt\{([^{}]*)\}/g, '√$1');
      }
      return t.replace(/\\sqrt\s*(\d+)/g, '√$1').replace(/\\pm\s*/g, '±').replace(/\\\(|\\\)/g, '').replace(/\\left|\\right/g, '').replace(/\\/g, '');
    }
    function typesetOrFallback(els) {
      els.forEach(el => el.classList.add('math-wait'));
      const reveal = () => els.forEach(el => el.classList.remove('math-wait'));
      const fallback = () => {
        els.forEach(el => el.querySelectorAll('*').forEach(n => { if (n.children.length === 0) n.textContent = texToPlain(n.textContent); }));
        els.forEach(el => { if (el.children.length === 0 || el.id === 'q-text') el.innerHTML = texToPlain(el.innerHTML); });
        reveal();
      };
      let tries = 0;
      (function wait() {
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(els).then(reveal).catch(fallback);
        else if (tries++ < 50) setTimeout(wait, 100);
        else fallback();
      })();
    }

    function renderQuestion() {
      isCorrected = false;
      currentQuestionMistakes = 0;
      document.getElementById('explanation-area').style.display = 'none';
      document.getElementById('next-zone').style.display = 'none';
      document.getElementById('judge-msg').textContent = '';   // 【ブラッシュアップ】
      document.getElementById('judge-msg').className = 'judge-msg';
      
      const q = activeQuestions[currentIdx];
      document.getElementById('quiz-header-title').textContent = selectedFloorId === RANDOM_F ? `${RANDOM_F}F [${selectedLevel}]` : `${selectedFloorId}F [${selectedLevel}]`;
      document.getElementById('quiz-header-counter').textContent = `${currentIdx + 1} / ${activeQuestions.length}`;
      
      const rate = (currentIdx / activeQuestions.length) * 100;
      document.getElementById('p-bar').style.width = `${rate}%`;

      const qTextEl = document.getElementById('q-text');
      qTextEl.textContent = `第 ${currentIdx + 1} 問:\n${dispMath(q.q)}`;
      qTextEl.innerHTML = qTextEl.innerHTML.replace(/\n/g, '<br>');

      const grid = document.getElementById('opts-grid');
      grid.innerHTML = "";
      
      const shuffledOpts = [...q.opts].sort(() => Math.random() - 0.5);
      shuffledOpts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "opt-btn";
        btn.textContent = dispMath(opt);   // 【ブラッシュアップ】
        btn._opt = opt; 
        btn.onclick = () => checkAnswer(btn, opt, q);
        grid.appendChild(btn);
      });

      typesetOrFallback([qTextEl, grid]);
    }

    // 【ブラッシュアップ】問題・選択肢の表示用：式全体を 1 つの数式にする。
    //   元は「2\(\sqrt{3}\)」のように係数だけ数式の外にあり、数字と √ で書体がちがっていた。
    //   ±√5 のような Unicode の書き方も数式にそろえる（採点は元の文字列のまま比べる）。
    function dispMath(s) {
      s = cleanMathText(s);
      if (/[ぁ-んァ-ヶ一-龠]/.test(s)) return s.replace(/(^|[\s、])(\d+)\\\(/g, '$1\\($2');
      const t = s.replace(/\\\(|\\\)/g, '').replace(/±/g, '\\pm ').replace(/√(\d+)/g, '\\sqrt{$1}');
      return '\\(' + t + '\\)';
    }
    // 【ブラッシュアップ】選択肢の値を計算する（「値は同じだけど形がちがう」を見分けるため）
    function valTex(s) {
      if (/±|\\pm/.test(s)) return NaN;
      let t = String(s).replace(/\\\(|\\\)/g, '').replace(/\\times|×/g, '*').replace(/\\div|÷/g, '/').replace(/−/g, '-').replace(/\\left|\\right/g, '');
      for (let i = 0; i < 5; i++) {
        t = t.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '(($1)/($2))').replace(/\\sqrt\{([^{}]*)\}/g, 'Math.sqrt($1)');
      }
      t = t.replace(/√(\d+)/g, 'Math.sqrt($1)').replace(/\^2/g, '**2').replace(/\s+/g, '').replace(/(\d|\))(?=M|\()/g, '$1*');
      if (!/^[0-9+\-*/().Mathsqr]+$/.test(t)) return NaN;
      try { return Function('return (' + t + ');')(); } catch (e) { return NaN; }
    }
    function sameValue(a, b) {
      const x = valTex(a), y = valTex(b);
      return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-9;
    }
    function closeMsg(f, chosen, ans) {
      if (chosen && ans && /sqrt|√/.test(chosen) && !/sqrt|√/.test(ans)) return '√ をはずして、整数や分数にしよう。';
      if (f === 9) return '分母に √ が残らない、約分しきった形にしよう。';
      if (f >= 5 && f <= 8) return '√ の中をできるだけ小さい数にして、整理しよう。';
      return '計算できるところは、最後まで計算しよう。';
    }

    function checkAnswer(btn, chosen, qObj) {
      if (isCorrected) return;
      // 【ブラッシュアップ】元はまちがえても赤くなるだけで、解説は正解のあとにしか出なかった。
      //   おしい（値は同じで形がちがう）ときはそう伝え、2 回まちがえたら解説を出す。
      const jm = document.getElementById('judge-msg');
      const expTextEl = document.getElementById('exp-text');
      const showExp = () => {
        expTextEl.textContent = cleanMathText(qObj.exp);
        document.getElementById('explanation-area').style.display = 'block';
        typesetOrFallback([expTextEl]);
      };

      if (chosen === qObj.a) {
        isCorrected = true;
        btn.classList.add('correct');
        jm.className = 'judge-msg ok';
        jm.textContent = currentQuestionMistakes === 0 ? '⭕ 正解！' : '⭕ 正解！（得点になるのは 1 回目で正解したときだけ）';

        if (currentQuestionMistakes === 0) {
          correctCount++;
        }

        document.querySelectorAll('.opt-btn').forEach(b => {
          b.disabled = true;
          if (b._opt !== qObj.a) b.style.opacity = "0.4";
        });

        // 解説文に含まれる掛け算記号も「×」に置換して代入
        showExp();
        document.getElementById('next-zone').style.display = 'block';
        setTimeout(() => document.getElementById('next-zone').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);

        const nextBtn = document.getElementById('next-q-btn');
        nextBtn.onclick = () => {
          currentIdx++;
          if (currentIdx < activeQuestions.length) renderQuestion();
          else showFinalResult();
        };
        nextBtn.textContent = (currentIdx === activeQuestions.length - 1) ? "結果を見る" : "次の問題へ";
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        currentQuestionMistakes++;
        if (sameValue(chosen, qObj.a)) {
          jm.className = 'judge-msg close';
          jm.textContent = '🤏 おしい！値は同じだけど、まだ答えの形ではないよ。' + closeMsg(qObj._f, chosen, qObj.a);
        } else if (currentQuestionMistakes === 1) {
          jm.className = 'judge-msg ng';
          jm.textContent = '❌ ちがうよ。もう一度えらぼう。';
        } else {
          jm.className = 'judge-msg ng';
          jm.textContent = '❌ ちがうよ。下の解説を読んで、もう一度えらぼう。';
          showExp();
          setTimeout(() => document.getElementById('explanation-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 60);
        }
      }
    }

    function showFinalResult() {
      document.getElementById('p-bar').style.width = "100%";
      showScreen('scr-res');
      
      document.getElementById('res-score-text').textContent = `${activeQuestions.length}問中 ${correctCount} 問正解！`;
      // 【ブラッシュアップ】元は「6問以上」で判定していて、5問のフロアでは合わなかったので、正答率で判定する
      let comment = (correctCount === activeQuestions.length) ? "完璧です！全フロア完全制覇！" : (correctCount >= activeQuestions.length * 0.7) ? "素晴らしい！タワーを登りきりました！" : "ナイスファイト！もう一度全階制覇に挑みましょう！";
      document.getElementById('res-comment-text').textContent = comment;

      const actionsContainer = document.getElementById('res-actions-container');
      actionsContainer.innerHTML = "";

      if (selectedFloorId === RANDOM_F) {
        const backDiffBtn = document.createElement('button');
        backDiffBtn.className = "res-btn res-btn-back-diff";
        backDiffBtn.innerHTML = RANDOM_F + "Fの難易度選択に戻る";
        backDiffBtn.onclick = () => showDiffScreen(RANDOM_F);
        actionsContainer.appendChild(backDiffBtn);
      } else {
        const availableLevels = Object.keys(masterData[selectedFloorId].questions);
        const currentPos = difficultyOrder.indexOf(selectedLevel);
        let nextLevelName = null;
        
        for (let i = currentPos + 1; i < difficultyOrder.length; i++) {
          if (availableLevels.includes(difficultyOrder[i])) {
            nextLevelName = difficultyOrder[i];
            break;
          }
        }

        if (nextLevelName) {
          const nextLvlBtn = document.createElement('button');
          nextLvlBtn.className = "res-btn res-btn-next-level";
          nextLvlBtn.innerHTML = `<span style="vertical-align:middle;" class="material-icons">trending_up</span> 次のレベル【${nextLevelName}】に挑戦`;
          nextLvlBtn.onclick = () => startQuiz(selectedFloorId, nextLevelName);
          actionsContainer.appendChild(nextLvlBtn);
        }

        const backDiffBtn = document.createElement('button');
        backDiffBtn.className = "res-btn res-btn-back-diff";
        // 【ブラッシュアップ】難易度が 1 つだけのフロアは「もう一度」に
        if (availableLevels.length === 1) {
          backDiffBtn.innerHTML = "もう一度挑戦する";
          backDiffBtn.onclick = () => startQuiz(selectedFloorId, selectedLevel);
        } else {
          backDiffBtn.innerHTML = "この階の難易度選択に戻る";
          backDiffBtn.onclick = () => showDiffScreen(selectedFloorId);
        }
        actionsContainer.appendChild(backDiffBtn);
      }

      const homeBackBtn = document.createElement('button');
      homeBackBtn.className = "res-btn res-btn-home";
      homeBackBtn.innerHTML = "別のフロアを選ぶ (HOME)";
      homeBackBtn.onclick = showMenuScreen;
      actionsContainer.appendChild(homeBackBtn);

      // 【ブラッシュアップ】ほかの教材へ
      const otherLink = document.createElement('a');
      otherLink.href = '../remake.html';
      otherLink.textContent = 'ほかの教材をえらぶ';
      otherLink.style.cssText = 'color:#aaa; margin-top:4px;';
      actionsContainer.appendChild(otherLink);
    }
  </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    "h1.title": "u-title",
    ".back-btn": "u-btn u-btn-plain",
    ".progress-container": "u-progress",
    ".opt-btn": "u-choice",
    ".opt-btn.correct": "u-ok",
    ".opt-btn.wrong": "u-ng",
    ".action-btn": "u-btn u-btn-blue",
    ".res-btn-next-level": "u-btn u-btn-blue",
    ".res-btn-back-diff": "u-btn",
    ".res-btn-home": "u-btn u-btn-plain"
  });
</script>
</body>
</html>
