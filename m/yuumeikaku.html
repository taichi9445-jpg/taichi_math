        body {
            box-sizing: border-box;

        }

        html {

        }

        .container {
            max-width: 800px;

            background: white;
            border-radius: 20px;

        .header h1 {
            color: #4a5568;

            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .level-btn.active {
            background: #4299e1;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.4);
        }

        .level-btn:not(.active) {
            background: #e2e8f0;
            color: #4a5568;
        }

        .level-btn:hover:not(.active) {
            background: #cbd5e0;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 8px 20px;
            border: 2px solid #4299e1;
            border-radius: 20px;
            background: white;
            color: #4299e1;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #4299e1;
            color: white;
        }

        .problem-area {
            background: #f7fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #4299e1;
        }

        .problem-text {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .choice {
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            background: white;
        }

        .choice:hover {
            border-color: #4299e1;
            background: #ebf8ff;
        }

        .choice.correct {
            background: #c6f6d5;
            border-color: #38a169;
            color: #22543d;
        }

        .choice.incorrect {
            background: #fed7d7;
            border-color: #e53e3e;
            color: #742a2a;
        }

        .hint-section {
            margin-top: 20px;
            padding: 20px;
            background: #fff5cd;
            border-radius: 10px;
            border-left: 4px solid #d69e2e;
        }

        .hint-btn {
            background: #d69e2e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .hint-content {
            display: none;
        }

        .triangle-diagram {
            text-align: center;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4299e1;
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        .btn-retry {
            background: #ed8936;
            color: white;
            display: none;
        }

        .btn-retry:hover {
            background: #dd6b20;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #4a5568;
        }

        .score {
            background: #e6fffa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #38b2ac;
        }

        .feedback-message {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1em;
            animation: slideIn 0.3s ease;
        }

        .feedback-correct {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #38a169;
        }

        .feedback-incorrect {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #e53e3e;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fraction {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
        }

        .fraction .numerator {
            display: block;
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
        }

        .fraction .denominator {
            display: block;
            padding-top: 2px;
        }

        .problem-diagram {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: #f0f8ff;
            border-radius: 10px;
            border: 2px solid #4299e1;
        }

        @media (max-width: 600px) {
            .choices {
                grid-template-columns: 1fr;
            }

            .level-selector {
                flex-direction: column;
                align-items: center;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initializeShuffledIndices() {
            const totalProblems = problems[currentLevel].length;
            const indices = Array.from({length: totalProblems}, (_, i) => i);
            shuffledIndices = shuffleArray(indices);
            shufflePosition = 0;
        }

        function selectLevel(level) {
            currentLevel = level;
            currentProblemIndex = 0;
            correctAnswers = 0;
            totalAnswered = 0;

            // Initialize shuffled indices for random mode
            initializeShuffledIndices();

            // Update active button
            document.querySelectorAll('.level-btn').forEach((btn, index) => {
                btn.classList.toggle('active', index === level);
            });

            // Show/hide hint section
            const hintSection = document.getElementById('hintSection');
            hintSection.style.display = level > 0 ? 'block' : 'none';

            loadProblem();
            updateDisplay();
        }

        function selectMode(mode) {
            currentMode = mode;
            currentProblemIndex = 0;
            // 【ブラッシュアップ】元はモードを変えても正解数が前のまま残っていた
            correctAnswers = 0;
            totalAnswered = 0;
            initializeShuffledIndices();

            // Update active button
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(mode === 'sequential' ? '順番' : 'ランダム'));
            });

            loadProblem();
            updateDisplay();
        }

        function loadProblem() {
            flow++; solved = false; missedThis = false;   // 【ブラッシュアップ】
            answered = false;
            currentAnswer = null;

            // Clear feedback message
            document.getElementById('feedbackMessage').innerHTML = '';

            let problemIndex;
            if (currentMode === 'sequential') {
                problemIndex = currentProblemIndex % problems[currentLevel].length;
            } else {
                // Use shuffled indices for random mode
                problemIndex = shuffledIndices[shufflePosition];
            }

            const problem = problems[currentLevel][problemIndex];

            const problemTextElement = document.getElementById('problemText');
            problemTextElement.innerHTML = problem.question;

            // Add diagram for level 0
            if (currentLevel === 0 && problem.diagram) {
                const diagramDiv = document.createElement('div');
                diagramDiv.className = 'problem-diagram';
                diagramDiv.innerHTML = problem.diagram;
                problemTextElement.appendChild(diagramDiv);
                const svg = diagramDiv.querySelector('svg');   // 【ブラッシュアップ】
                if (svg) {
                    const b = svg.getBBox();
                    svg.setAttribute('viewBox', `${b.x - 24} ${b.y - 16} ${b.width + 48} ${b.height + 32}`);
                    svg.removeAttribute('height');
                    svg.style.width = '100%';
                    svg.style.maxWidth = '300px';
                }
            }

            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            order = problem.choices.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            order.forEach((orig, index) => {
                const choiceElement = document.createElement('div');
                choiceElement.className = 'choice';
                choiceElement.innerHTML = problem.choices[orig];
                choiceElement.onclick = () => selectChoice(index, order.indexOf(problem.correct));
                choicesContainer.appendChild(choiceElement);
            });

            // Update hint content based on current problem
            updateHintContent(problem.question);

            // Hide hint content
            document.getElementById('hintContent').style.display = 'none';
            const hintBtn = document.querySelector('.hint-btn');
            if (hintBtn) hintBtn.textContent = 'ヒントを見る';

            // Hide retry button
            document.getElementById('retryBtn').style.display = 'none';

            // Update next button appearance
            updateNextButton();
        }

        function selectChoice(selectedIndex, correctIndex) {
            if (answered) return;

            answered = true;
            currentAnswer = correctIndex;

            const choices = document.querySelectorAll('.choice');
            const feedbackMessage = document.getElementById('feedbackMessage');

            if (selectedIndex === correctIndex) {
                choices[selectedIndex].classList.add('correct');
                solved = true;
                totalAnswered++;
                if (!missedThis) correctAnswers++;   // 【ブラッシュアップ】一発正解だけ

                // Show praise message
                const praiseMessages = [
                    '🎉 正解！素晴らしい！',
                    '✨ その調子！完璧です！',
                    '🌟 大正解！よくできました！',
                    '👏 すごい！正解です！',
                    '💯 パーフェクト！',
                    '🎊 見事！正解です！',
                    '⭐ 素晴らしい理解力！',
                    '🏆 完璧な答えです！'
                ];
                const randomPraise = praiseMessages[Math.floor(Math.random() * praiseMessages.length)];
                feedbackMessage.innerHTML = `<div class="feedback-message feedback-correct">${randomPraise}</div>`;
            } else {
                choices[selectedIndex].classList.add('incorrect');
                missedThis = true;   // 【ブラッシュアップ】
                // 正解は緑色にしない（問題文の要求通り）

                // Show encouragement message
                const encouragementMessages = [
                    '💪 もう一度挑戦してみよう！',
                    '📚 ヒントを見て考えてみよう！',
                    '🤔 惜しい！もう一度トライ！',
                    '✏️ 落ち着いて考えてみよう！'
                ];
                const randomEncouragement = encouragementMessages[Math.floor(Math.random() * encouragementMessages.length)];
                feedbackMessage.innerHTML = `<div class="feedback-message feedback-incorrect">${randomEncouragement}</div>`;

                // Auto-reset after 1 second
                const myFlow = flow;   // 【ブラッシュアップ】別の問題に移っていたら何もしない
                setTimeout(() => {
                    if (myFlow === flow) retryProblem();
                }, 1000);
            }

            // Update next button appearance
            updateNextButton();
            updateDisplay();
        }

        function retryProblem() {
            // Reset the current problem without changing the problem index
            answered = false;
            currentAnswer = null;

            const choices = document.querySelectorAll('.choice');
            choices.forEach(choice => {
                choice.classList.remove('correct', 'incorrect');
            });

        // 【ブラッシュアップ】新しいヒント
        function updateHintContent(question) {
            if (currentLevel === 0) return;
            const m = question.match(/(sin|cos|tan)\s*(\d+)°/);
            if (!m) return;
            const deg = Number(m[2]);
            const hintContent = document.getElementById('hintContent');
            const fr = (a, b) => `<span class='fraction'><span class='numerator'>${a}</span><span class='denominator'>${b}</span></span>`;
            if (deg === 30 || deg === 45 || deg === 60) {
                const sides = { 30: ['√3', '1', '2'], 45: ['1', '1', '√2'], 60: ['1', '√3', '2'] }[deg];
                hintContent.innerHTML = `
                    <h4>${deg}° の直角三角形</h4>
                    <div class="triangle-diagram">${hintTriangle(deg, sides)}</div>
                    <div class="hint-formula"><span class="f">sin = ${fr('高さ', '斜辺')}</span><span class="f">cos = ${fr('底辺', '斜辺')}</span><span class="f">tan = ${fr('高さ', '底辺')}</span></div>`;
            } else {
                const pts = { 0: ['1', '0', '1'], 90: ['0', '1', '1'], 180: ['−1', '0', '1'], 120: ['−1', '√3', '2'], 135: ['−1', '1', '√2'], 150: ['−√3', '1', '2'] }[deg];
                if (!pts) return;
                hintContent.innerHTML = `
                    <h4>半径 r の半円の上の点 P で考える（${deg}°）</h4>
                    <div class="triangle-diagram">${hintSemicircle(deg, pts)}</div>
                    <div class="hint-formula"><span class="f">sin = ${fr('y', 'r')}</span><span class="f">cos = ${fr('x', 'r')}</span><span class="f">tan = ${fr('y', 'x')}</span>${deg === 90 ? '<br>x = 0 のとき、tan は 0 でわることになるので…？' : ''}</div>`;
            }
        }

        // 直角三角形（左下の角が deg°、右下が直角）。sides = [底辺, 高さ, 斜辺]
        function hintTriangle(deg, sides) {
            const t = deg * Math.PI / 180, H = 170;
            const ax = 40, ay = 185, bx = ax + H * Math.cos(t), cy = ay - H * Math.sin(t);
            const mx = (ax + bx) / 2, my = (ay + cy) / 2;
            return `<svg width="300" height="210" viewBox="0 0 300 210">
                <polygon points="${ax},${ay} ${bx},${ay} ${bx},${cy}" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
                <path d="M ${bx - 12},${ay} L ${bx - 12},${ay - 12} L ${bx},${ay - 12}" stroke="#666" stroke-width="2" fill="none"/>
                <path d="M ${ax + 30},${ay} A 30 30 0 0 0 ${ax + 30 * Math.cos(t)},${ay - 30 * Math.sin(t)}" stroke="#ea580c" stroke-width="2" fill="none"/>
                <text x="${ax + 36}" y="${ay - 8}" font-size="15" fill="#ea580c" font-weight="bold">${deg}°</text>
                <text x="${mx}" y="${ay + 20}" font-size="18" text-anchor="middle" font-weight="bold">${sides[0]}</text>
                <text x="${bx + 10}" y="${(ay + cy) / 2 + 6}" font-size="18" font-weight="bold">${sides[1]}</text>
                <text x="${mx - 16 * Math.sin(t) - 6}" y="${my - 16 * Math.cos(t)}" font-size="18" text-anchor="middle" font-weight="bold">${sides[2]}</text>
            </svg>`;
        }

        // 半径 r の半円と、角 deg° の点 P(x, y)。pts = [x, y, r]
        function hintSemicircle(deg, pts) {
            const t = deg * Math.PI / 180, R = 110, ox = 150, oy = 150;
            const px = ox + R * Math.cos(t), py = oy - R * Math.sin(t);
            const onAxis = deg === 0 || deg === 90 || deg === 180;
            // 点 P の名前：左側の点は左へ、90° は右へ、0° は点の上へ
            const lx = deg === 0 ? px : deg === 90 ? px + 10 : px - 8;
            const ly = deg === 90 ? py - 6 : py - 12;
            const anchor = deg === 90 ? 'start' : 'end';
            // r の文字：線 OP の外側（x 軸の上の線なら上側）
            let nx = Math.sin(t), ny = Math.cos(t);
            if (deg === 0) { nx = 0; ny = -1; }
            const rx = (ox + px) / 2 + 10 * nx, ry = (oy + py) / 2 + 10 * ny + (ny > 0 ? 10 : 0);
            const rAnchor = nx > 0.3 ? 'start' : 'middle';
            const degY = deg === 0 ? oy + 20 : oy - 8;
            const arcEnd = `${ox + 26 * Math.cos(t)},${oy - 26 * Math.sin(t)}`;
            return `<svg width="340" height="190" viewBox="-40 0 340 190">
                <line x1="15" y1="${oy}" x2="290" y2="${oy}" stroke="#94a3b8" stroke-width="2"/>
                <line x1="${ox}" y1="175" x2="${ox}" y2="12" stroke="#94a3b8" stroke-width="2"/>
                <text x="285" y="${oy + 18}" font-size="14" text-anchor="end">x</text>
                <text x="${ox + 8}" y="22" font-size="14">y</text>
                <text x="${ox - 6}" y="${oy + 18}" font-size="14" text-anchor="end">O</text>
                <path d="M ${ox - R},${oy} A ${R} ${R} 0 0 1 ${ox + R},${oy}" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
                ${onAxis ? '' : `<line x1="${px}" y1="${py}" x2="${px}" y2="${oy}" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>`}
                <line x1="${ox}" y1="${oy}" x2="${px}" y2="${py}" stroke="#2563eb" stroke-width="3"/>
                ${deg === 0 ? '' : `<path d="M ${ox + 26},${oy} A 26 26 0 0 0 ${arcEnd}" stroke="#ea580c" stroke-width="2" fill="none"/>`}
                <text x="${ox + 30}" y="${degY}" font-size="14" fill="#ea580c" font-weight="bold">${deg}°</text>
                <circle cx="${px}" cy="${py}" r="5" fill="#dc2626"/>
                <text x="${lx}" y="${ly}" font-size="16" fill="#dc2626" font-weight="bold" text-anchor="${anchor}">P(${pts[0]}, ${pts[1]})</text>
                <text x="${rx}" y="${ry}" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="${rAnchor}">${pts[2]}</text>
            </svg>`;
        }

            const progressText = `問題 ${Math.min(currentProblemIndex + 1, n)} / ${n}`;

            document.getElementById('progress').textContent = progressText;
            document.getElementById('score').textContent = `一発正解: ${correctAnswers} / ${totalAnswered}`;
        }

        // Initialize
        initializeShuffledIndices();
        loadProblem();
        updateDisplay();
    </script>
