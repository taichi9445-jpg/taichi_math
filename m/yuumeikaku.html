    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。

  <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            color: #333;
        }

        html {
            height: 100%;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;

        .header h1 {

            justify-content: center;

            font-weight: bold;

            background: #e2e8f0;

        }

        .level-btn:hover:not(.active) {
            background: #cbd5e0;

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;

        .mode-btn {
            padding: 8px 20px;

            font-weight: bold;

        .choice.correct {

            color: #22543d;
        }

        .choice.incorrect {
            background: #fed7d7;
            border-color: #e53e3e;
            color: #742a2a;
        }

        .hint-section {

        }

        .hint-btn {
            background: #d69e2e;
            color: white;
            border: none;
            padding: 10px 20px;

            font-weight: bold;
            margin-bottom: 15px;
        }

        .hint-content {
            display: none;
        }

        .triangle-diagram {
            text-align: center;
            margin: 20px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4299e1;
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        .btn-retry {
            background: #ed8936;
            color: white;
            display: none;
        }

        .btn-retry:hover {
            background: #dd6b20;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;

        }

        .score {
            background: #e6fffa;
            padding: 15px;
            border-radius: 10px;

            margin-bottom: 20px;

        }

        .feedback-message {
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1em;
            animation: slideIn 0.3s ease;

        .feedback-correct {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #38a169;
        }

        .feedback-incorrect {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #e53e3e;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);

        .fraction {

            text-align: center;
            vertical-align: middle;

            border-bottom: 1px solid currentColor;

        .fraction .denominator {
            display: block;

        }

        .problem-diagram {

            margin: 20px 0;
            padding: 20px;

            border-radius: 10px;

  <div class="container">
   <header class="header">
    <h1>三角比練習問題</h1>
    <p>レベルを選んで三角比の値を求めよう！</p>
   </header>
   <div class="level-selector"><button class="level-btn active" onclick="selectLevel(0)"><span class="lv-l">レベル0: 有名角の辺の比</span><span class="lv-s">Lv0<br>辺の比</span></button> <button class="level-btn" onclick="selectLevel(1)"><span class="lv-l">レベル1: 鋭角の三角比</span><span class="lv-s">Lv1<br>鋭角</span></button> <button class="level-btn" onclick="selectLevel(2)"><span class="lv-l">レベル2: 鈍角・0°・90°・180°</span><span class="lv-s">Lv2<br>鈍角</span></button> <button class="level-btn" onclick="selectLevel(3)"><span class="lv-l">レベル3: 全部まぜて</span><span class="lv-s">Lv3<br>まぜる</span></button> <button class="level-btn" onclick="selectLevel(4)"><span class="lv-l">レベル4: 180°−<i class="mi">θ</i>・角を求める</span><span class="lv-s">Lv4<br>角<i class="mi">θ</i></span></button>
   </div>
   <div class="mode-selector"><button class="mode-btn active" onclick="selectMode('sequential')">順番モード</button> <button class="mode-btn" onclick="selectMode('random')">ランダムモード</button>
   </div>
   <div class="progress" id="progress">
    問題 1 / 9
   </div>
   <div class="score" id="score">
    一発正解: 0 / 0
   </div>
   <div class="problem-area">
    <div class="problem-text" id="problemText"></div>
    <div class="choices" id="choices"></div>
    <div id="feedbackMessage"></div>
    <div class="hint-section" id="hintSection" style="display: none;"><button class="hint-btn" onclick="toggleHint()">ヒントを見る</button>
     <div class="hint-content" id="hintContent"></div>
    </div>
   </div>
   <div class="controls"><button class="btn btn-retry" id="retryBtn" onclick="retryProblem()">もう一度挑戦</button> <button class="btn btn-primary" onclick="nextProblem()">次の問題</button>
   </div>
  </div>
  <script>
        // 【ブラッシュアップ】問題・判定・ヒントを作り直した本体。元の「レベル・順番／ランダムモード・ヒント」の流れはそのまま。
        //   ・レベル0：三角形を角度どおりにかき、角の印をつけた。1, √3, 2 そのままの問題に加えて、大きさを変えた三角形
        //              （斜辺 6 の 30° の三角形の底辺 など）を追加。元の 5 問目と 6 問目は同じ問題だったので 1 つにした
        //   ・レベル3：レベル1・2 をまぜて出す（元は順番モードだと sin → cos → tan の順が決まっていた）
        //   ・レベル4（新しく追加）：180° − θ・90° − θ の関係と、三角比の値から角 θ を求める問題
        //   ・正解したら「なぜその値か」を一言、まちがえたら「えらんだ値が何なのか」を一言。
        //     まちがえた選択肢は押せなくなり、そのままえらび直せる（元は 1 秒後に自動でやり直しになり、同じ選択肢もまた押せた）
        let currentLevel = 0;
        let currentMode = 'sequential';
        let currentProblemIndex = 0;
        let correctAnswers = 0;
        let totalAnswered = 0;
        let answered = false;
        let solved = false;
        let missedThis = false;   // この問題でまちがえたか（一発正解だけを点にする）
        let order = [0, 1, 2, 3];
        let playList = [];        // このレベルで出す問題の順番

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ---------- 数式の表示：「1/2」→ 縦の分数、「√3」→ 上に線、「−」は前に ----------
        function rtHTML(s) { return String(s).replace(/√(\d+)/g, '<span class="rt">√<span class="rt-in">$1</span></span>'); }
        function mathHTML(s) {
            return String(s).split(', ').map(part => {
                let sign = '';
                if (part[0] === '−') { sign = '− '; part = part.slice(1); }
                const m = part.match(/^([^/\s]+)\/([^/\s]+)$/);
                if (m) return sign + '<span class="fraction"><span class="numerator">' + rtHTML(m[1]) + '</span><span class="denominator">' + rtHTML(m[2]) + '</span></span>';
                return sign + rtHTML(part);
            }).join(', ');
        }
        // 値を数にする（まちがえたときの一言を作るのに使う）
        function valueOf(s) {
            if (s === '定義されない') return NaN;
            let t = String(s).replace(/−/g, '-').replace(/(\d)√(\d+)/g, '$1*Math.sqrt($2)').replace(/√(\d+)/g, 'Math.sqrt($1)');
            const m = t.match(/^(-?)([^/]+)\/(.+)$/);
            try { return m ? (m[1] ? -1 : 1) * Function('return ' + m[2])() / Function('return ' + m[3])() : Function('return ' + t)(); } catch (e) { return NaN; }
        }

        // ---------- 直角三角形の図（#25 と同じかき方）：V = 左下の角、R = 直角（右下）、T = 上 ----------
        function triSVG(o) {
            const w = o.w || 260, h = o.h || 200, pad = o.pad || 44;
            const P = { V: [0, 0], R: [o.p, 0], T: [o.p, o.q] };
            const maxx = o.p, maxy = o.q;
            const s = Math.min((w - 2 * pad) / maxx, (h - 2 * pad) / maxy);
            const ox = (w - maxx * s) / 2, oy = (h - maxy * s) / 2;
            const S = {};
            Object.keys(P).forEach(k => { S[k] = [ox + P[k][0] * s, oy + (maxy - P[k][1]) * s]; });
            const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [dx / L, dy / L]; };
            const f = v => v.toFixed(1);
            let out = '<svg class="tri" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="直角三角形">';
            out += '<polygon points="' + ['V', 'R', 'T'].map(k => f(S[k][0]) + ',' + f(S[k][1])).join(' ') + '" fill="#eff6ff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>';
            const u1 = unit(S.R, S.V), u2 = unit(S.R, S.T), m = 12;
            out += '<path d="M ' + f(S.R[0] + u1[0] * m) + ' ' + f(S.R[1] + u1[1] * m) + ' L ' + f(S.R[0] + (u1[0] + u2[0]) * m) + ' ' + f(S.R[1] + (u1[1] + u2[1]) * m) + ' L ' + f(S.R[0] + u2[0] * m) + ' ' + f(S.R[1] + u2[1] * m) + '" fill="none" stroke="#475569" stroke-width="2"/>';
            // 角の印と角度
            const a1 = unit(S.V, S.R), a2 = unit(S.V, S.T), r = 26;
            out += '<path d="M ' + f(S.V[0] + a1[0] * r) + ' ' + f(S.V[1] + a1[1] * r) + ' A ' + r + ' ' + r + ' 0 0 0 ' + f(S.V[0] + a2[0] * r) + ' ' + f(S.V[1] + a2[1] * r) + '" fill="none" stroke="#ea580c" stroke-width="2.5"/>';
            const bis = unit([0, 0], [a1[0] + a2[0], a1[1] + a2[1]]);
            const half = Math.acos(a1[0] * a2[0] + a1[1] * a2[1]) / 2;
            const dd = Math.max(44, Math.min(90, 15 / Math.tan(half)));
            out += '<text x="' + f(S.V[0] + bis[0] * dd) + '" y="' + f(S.V[1] + bis[1] * dd) + '" font-size="18" font-weight="bold" font-family="Times New Roman, serif" fill="#ea580c" text-anchor="middle" dominant-baseline="central">' + o.deg + '°</text>';
            // 辺の長さ（辺の中点から外向き）。o.ask の辺は赤い x
            [['VR', 'V', 'R', 'T'], ['RT', 'R', 'T', 'V'], ['VT', 'V', 'T', 'R']].forEach(([key, a, b, c]) => {
                const t = o.ask === key ? 'x' : o.sides[key];
                if (!t) return;
                const mx = (S[a][0] + S[b][0]) / 2, my = (S[a][1] + S[b][1]) / 2;
                let n = unit(S[a], S[b]); n = [-n[1], n[0]];

        // ---------- 問題データ ----------

            { deg: 60, sides: { VR: '1', RT: '√3', VT: '2' }, ask: 'VT', choices: ['1', '√2', '√3', '2'] },

            { deg: 60, sides: { VR: '5', RT: '5√3', VT: '10' }, ask: 'VT', choices: ['10', '5√3', '5√2', '5/2'], k: '5' },

        const L1 = [

        const POINT = { 0: ['1', '0', '1'], 30: ['√3', '1', '2'], 45: ['1', '1', '√2'], 60: ['1', '√3', '2'], 90: ['0', '1', '1'], 120: ['−1', '√3', '2'], 135: ['−1', '1', '√2'], 150: ['−√3', '1', '2'], 180: ['−1', '0', '1'] };
        // レベル4：180° − θ・90° − θ と、値から角を求める問題（0° ≦ θ ≦ 180°）
        const L4 = [
            { q: 'sin 150° と等しいものは？', choices: ['sin 30°', '−sin 30°', 'cos 30°', '−cos 30°'], correct: 0,

            { q: 'cos 120° と等しいものは？', choices: ['−cos 60°', 'cos 60°', 'sin 60°', '−sin 60°'], correct: 0,

            { q: 'tan 135° と等しいものは？', choices: ['−tan 45°', 'tan 45°', '1/tan 45°', 'sin 45°'], correct: 0,
              exp: 'tan(180° − θ) = −tan θ。tan 135° = tan(180° − 45°) = −tan 45°',

            { q: 'sin(90° − 30°) と等しいものは？', choices: ['cos 30°', 'sin 30°', '−cos 30°', 'tan 30°'], correct: 0,

            { q: 'cos 70° を 45° 以下の角の三角比で表すと？', choices: ['sin 20°', 'cos 20°', '−sin 20°', 'sin 70°'], correct: 0,

        const LEVEL_SIZE = [L0.length, L1.length, L2.length, L1.length + L2.length, L4.length];
        function levelList(level) {
            if (level === 0) return L0.map((d, i) => ({ kind: 0, i }));

        // 1 問ぶんの表示データ：question, figure, choices, correct, exp, why[], hint
        function makeProblem(item) {
            if (item.kind === 0) {
                const d = L0[item.i];
                const ans = d.sides[d.ask];

                    if (c === ans) return '';

                    if (ans === '定義されない') return 'tan 90° は x = 0 で割ることになるので、値は定義されないよ。';

                    if (Math.abs(v + a) < 1e-9 && a !== 0) return '符号に注意。' + deg + '° の点 P(' + px + ', ' + py + ') は ' + (valueOf(px) < 0 ? 'x < 0' : 'x > 0') + '、y ' + (valueOf(py) > 0 ? '> 0' : '= 0') + ' だよ。';

        // 数値 → 分数表示の中の「−1/2」などを正しく出すため、choices は mathHTML で表示する
        function hintFor(deg) {
            const fr = (a, b) => `<span class='fraction'><span class='numerator'>${a}</span><span class='denominator'>${b}</span></span>`;

        // 半径 r の半円と、角 deg° の点 P(x, y)。pts = [x, y, r]

            const anchor = deg === 90 ? 'start' : 'end';
            // r の文字：線 OP の外側（x 軸の上の線なら下側）
            let nx = Math.sin(t), ny = Math.cos(t);
            if (deg === 0) { nx = 0; ny = 1; }
            const rx = (ox + px) / 2 + 10 * nx, ry = (oy + py) / 2 + 10 * ny + (ny > 0 ? 12 : 0);
            const rAnchor = nx > 0.3 ? 'start' : 'middle';
            const degY = deg === 0 ? oy - 10 : oy - 8;
            const arcEnd = `${ox + 26 * Math.cos(t)},${oy - 26 * Math.sin(t)}`;
            return `<svg width="340" height="190" viewBox="-40 0 340 190">
                <line x1="15" y1="${oy}" x2="290" y2="${oy}" stroke="#94a3b8" stroke-width="2"/>
                <line x1="${ox}" y1="175" x2="${ox}" y2="12" stroke="#94a3b8" stroke-width="2"/>
                <text x="285" y="${oy + 18}" font-size="17" font-style="italic" font-family="Times New Roman, serif" text-anchor="end">x</text>
                <text x="${ox - 8}" y="22" font-size="17" font-style="italic" font-family="Times New Roman, serif" text-anchor="end">y</text>
                <text x="${ox - 6}" y="${oy + 18}" font-size="17" font-style="italic" font-family="Times New Roman, serif" text-anchor="end">O</text>
                <path d="M ${ox - R},${oy} A ${R} ${R} 0 0 1 ${ox + R},${oy}" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
                ${onAxis ? '' : `<line x1="${px}" y1="${py}" x2="${px}" y2="${oy}" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>`}
                <line x1="${ox}" y1="${oy}" x2="${px}" y2="${py}" stroke="#2563eb" stroke-width="3"/>
                ${deg === 0 ? '' : `<path d="M ${ox + 26},${oy} A 26 26 0 0 0 ${arcEnd}" stroke="#ea580c" stroke-width="2" fill="none"/>`}
                <text x="${ox + 30}" y="${degY}" font-size="16" fill="#ea580c" font-weight="bold" font-family="Times New Roman, serif">${deg}°</text>
                <circle cx="${px}" cy="${py}" r="5" fill="#dc2626"/>
                <text x="${lx}" y="${ly}" font-size="18" fill="#dc2626" font-weight="bold" font-family="Times New Roman, serif" text-anchor="${anchor}"><tspan font-style="italic">P</tspan>(${pts[0]}, ${pts[1]})</text>
                <text x="${rx}" y="${ry}" font-size="18" font-weight="bold" font-family="Times New Roman, serif" fill="#1d4ed8" text-anchor="${rAnchor}">${pts[2]}</text>
            </svg>`;
        }

        // ---------- 画面の流れ ----------
        function selectLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach((btn, index) => btn.classList.toggle('active', index === level));
            restart();
        }
        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.textContent.includes(mode === 'sequential' ? '順番' : 'ランダム')));
            restart();
        }
        function restart() {
            currentProblemIndex = 0;
            correctAnswers = 0;
            totalAnswered = 0;
            playList = levelList(currentLevel);
            if (currentMode === 'random') playList = shuffleArray(playList);
            loadProblem();
            updateDisplay();
        }
        let current = null;
        function loadProblem() {
            answered = false; solved = false; missedThis = false;
            current = makeProblem(playList[currentProblemIndex]);
            document.getElementById('feedbackMessage').innerHTML = '';
            const pt = document.getElementById('problemText');
            pt.innerHTML = current.question + (current.figure ? '<div class="problem-diagram">' + current.figure + '</div>' : '');
            const box = document.getElementById('choices');
            box.innerHTML = '';
            order = current.choices.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            order.forEach((orig, index) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'choice';
                b.innerHTML = mathHTML(current.choices[orig]);
                b.onclick = () => selectChoice(index);
                box.appendChild(b);
            });
            document.getElementById('hintContent').innerHTML = current.hint;
            document.getElementById('hintContent').style.display = 'none';
            document.getElementById('hintSection').style.display = 'block';
            const hintBtn = document.querySelector('.hint-btn');
            if (hintBtn) hintBtn.textContent = 'ヒントを見る';
            document.getElementById('retryBtn').style.display = 'none';
            updateNextButton();
        }
        function selectChoice(index) {
            if (answered) return;
            const orig = order[index];
            const buttons = document.querySelectorAll('.choice');
            const fb = document.getElementById('feedbackMessage');
            if (orig === current.correct) {
                answered = true; solved = true;
                buttons[index].classList.add('correct');
                totalAnswered++;
                if (!missedThis) correctAnswers++;
                const praise = ['🎉 正解！', '✨ その調子！', '🌟 大正解！', '👏 正解です！'][Math.floor(Math.random() * 4)];
                fb.innerHTML = '<div class="feedback-message feedback-correct">' + praise + '<div class="why">💡 ' + current.exp + '</div></div>';
            } else {
                missedThis = true;
                buttons[index].classList.add('incorrect');
                buttons[index].disabled = true;
                fb.innerHTML = '<div class="feedback-message feedback-incorrect">🤔 ちがいます。のこりからえらび直そう！<div class="why">💡 ' + current.why[orig] + '</div></div>';
            }
            updateNextButton();
            updateDisplay();
        }
        function retryProblem() { }   // 使わなくなった（まちがえたあとも、そのままえらび直せる）

        function nextProblem() {
            if (!solved) return;   // 正解するまで次へ進めない
            if (document.getElementById('resultModal')) return;
            currentProblemIndex++;
            if (currentProblemIndex >= playList.length) { updateDisplay(); showResult(); return; }
            loadProblem();
            updateDisplay();
            document.getElementById('problemText').scrollIntoView({ block: 'nearest' });
        }

        // 結果：次のレベル・同じレベル・モードを変えて・ほかの教材
        function showResult() {
            const n = playList.length;
            const perfect = correctAnswers === n;
            const names = ['有名角の直角三角形の辺の比', '鋭角の三角比', '鈍角・0°・90°・180° の三角比', '0°〜180° の三角比', '180° − θ・90° − θ と、値から角を求める問題'];
            const other = currentMode === 'random' ? 'sequential' : 'random';
            const modal = document.createElement('div');
            modal.className = 'result-modal';
            modal.id = 'resultModal';
            modal.innerHTML = `
                <div class="result-box">
                    <h2>${perfect ? '🎊 全問一発正解！' : '🎉 レベル' + currentLevel + ' 完了！'}</h2>
                    ${perfect ? '<div class="result-emoji">🎯💯🎯</div>' : ''}
                    <div class="result-score">一発正解 ${correctAnswers} / ${n} 問</div>
                    <p>${names[currentLevel]}を${perfect ? '完全にマスターしました！' : '練習しました。まちがえた問題をもう一度たしかめよう！'}</p>
                    <div class="result-nav">
                        ${currentLevel < 4 ? `<button class="next" onclick="closeResult(); selectLevel(${currentLevel + 1});">次のレベル（レベル${currentLevel + 1}）へ ▶</button>` : ''}
                        <button class="again" onclick="closeResult(); selectLevel(currentLevel);">同じレベルでもう一度</button>
                        <button class="mode" onclick="closeResult(); selectMode('${other}');">${other === 'random' ? 'ランダムモード' : '順番モード'}でもう一度</button>
                        <a href="../remake.html">ほかの教材をえらぶ</a>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }
        function closeResult() {
            const modal = document.getElementById('resultModal');
            if (modal) modal.remove();
            window.scrollTo(0, 0);
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && solved) nextProblem();
        });

        function toggleHint() {
            const hintContent = document.getElementById('hintContent');
            const hintBtn = document.querySelector('.hint-btn');
            const open = hintContent.style.display === 'none';
            hintContent.style.display = open ? 'block' : 'none';
            hintBtn.textContent = open ? 'ヒントを隠す' : 'ヒントを見る';
        }
        function updateNextButton() {
            const nextBtn = document.querySelector('.btn-primary');
            nextBtn.disabled = !solved;
        }
        function updateDisplay() {
            const n = playList.length;
            document.getElementById('progress').textContent = '問題 ' + Math.min(currentProblemIndex + 1, n) + ' / ' + n;
            document.getElementById('score').textContent = '一発正解: ' + correctAnswers + ' / ' + totalAnswered;
        }

        // 【ブラッシュアップ】式の表記を教科書にそろえる：文字（x・a・A・θ など）は斜体、数字・記号・sin／cos／tan は立体、書体は数式用。
        //   画面の文字（textContent）は変えずに、英数字のまとまりを <span class="m"> で包み、文字だけを <i> にする（日本語はふつうの書体のまま）。
        //   画面が書きかわるたびに、指定した場所の式を整え直す
        const MATH_RUN = /[A-Za-z0-9θ()=+\-−·×÷\/.,<>≦≧≠°√²³ ]*[A-Za-z0-9θ][A-Za-z0-9θ()=+\-−·×÷\/.,<>≦≧≠°√²³ ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .no-math, svg, canvas, script, style, textarea, input')) continue;
                if (/[A-Za-z0-9θ]/.test(n.nodeValue)) nodes.push(n);
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    if (!text) return run;
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    const span = document.createElement('span');
                    span.className = 'm';
                    const parts = text.split(/(sin|cos|tan|[A-Za-zθ])/);
                    parts.forEach((part, k) => {
                        if (!part) return;
                        const upright = k % 2 === 0 || /^(sin|cos|tan)$/.test(part) ||
                            (part === 'm' && /\d\s*$/.test(parts[k - 1] || '') && !/^[A-Za-z]/.test(parts[k + 1] || ''));   // 36.4 m の単位
                        if (upright) span.appendChild(document.createTextNode(part));
                        else { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                    });
                    frag.appendChild(span);
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        // 初期化
        restart();
        watchMath(['#problemText', '#choices', '#feedbackMessage', '#hintContent', '#resultModal']);

    </script>
 <script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".header h1": "u-title",
    ".level-btn:not(.active)": "u-btn u-btn-plain",
    ".level-btn.active": "u-btn",
    ".mode-btn:not(.active)": "u-btn u-btn-white",
    ".mode-btn.active": "u-btn u-btn-blue",
    ".progress": "u-progress",
    ".choice": "u-choice",
    ".choice.correct": "u-ok",
    ".choice.incorrect": "u-ng",
    ".hint-btn": "u-btn",
    ".btn-retry": "u-btn",
    ".btn-primary": "u-btn u-btn-blue",
    ".result-nav .next": "u-btn u-btn-blue",
    ".result-nav .again": "u-btn",
    ".result-nav .mode": "u-btn u-btn-plain"
  });
</script>
</body>
