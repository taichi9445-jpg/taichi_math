<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!--
      03. 多項式の計算（多項式マスター）
      山﨑先生の GAS 版をもとにブラッシュアップしたもの。
      問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
    -->
    <link rel="stylesheet" href="../assets/port.css">
    <script src="../assets/port.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多項式マスター</title>
    <!-- 【ブラッシュアップ】元は Tailwind の開発用CDN（cdn.tailwindcss.com）をその場で動かしていた。
         本番用ではなく、重いうえに読み込めないと見た目が全部崩れるため、
         同じクラスから作った固定の CSS に置きかえた。見た目は同じ。 -->
    <link rel="stylesheet" href="../assets/gas.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
        
        :root {
            --bg-main: #f0f9ff;
            --text-main: #1e293b;
            --sky-dark: #0369a1;
            --sky-mid: #0ea5e9;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 0 #bae6fd;
        }

        .btn-pop {
            transition: all 0.2s;
            box-shadow: 0 6px 0 #0369a1;
        }

        .btn-pop:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .input-hole {
            border: 3px solid #cbd5e1;
            border-bottom: 5px solid var(--sky-mid);
            width: 3.2rem; /* 少しスリムに */
            text-align: center;
            font-weight: 800;
            font-size: 1.4rem; /* 少し小さく */
            color: var(--sky-dark);
            background: #ffffff;
            outline: none;
            margin: 2px; /* 余白を詰める */
            border-radius: 10px;
        }

        .input-hole-sign {
            width: 2.6rem; /* 少しスリムに */
            border-bottom-color: #f97316;
            color: #c2410c;
        }

        .input-hole.error {
            border-color: #ef4444;
            background-color: #fee2e2;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .math-text {
            font-weight: 700;
            font-size: 1.4rem; /* デフォルトを少しだけ小さく調整 */
            letter-spacing: -0.02em; /* 文字間を少し詰める */
        }

        /* 1行に収めるための修正 */
        .step-box {
            background-color: #f8fafc;
            padding: 12px 8px; /* 上下左右の余白を少し詰める */
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            margin: 8px 0;
            display: flex;
            flex-wrap: nowrap; /* 絶対に折り返さない */
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-height: 70px;
            /* 【ブラッシュアップ】元は hidden で、項が多いと右側の穴埋め欄が見えず入力できなかった。
               はみ出すときは横に動かせるようにする（スマホでは下の設定で折り返す）。 */
            overflow-x: auto;
            white-space: nowrap;
        }

        /* スマートフォンなどの狭い画面でも収まりやすくする */
        @media (max-width: 640px) {
            .math-text {
                font-size: 1.1rem;
            }
            .input-hole {
                width: 2.6rem;
                font-size: 1.1rem;
            }
            .input-hole-sign {
                width: 2.2rem;
            }
            /* 【ブラッシュアップ】スマホでは途中式を折り返して、全部の穴が見えるようにする */
            .step-box { flex-wrap: wrap; white-space: normal; row-gap: 6px; overflow-x: visible; }
            .step-box .math-text { font-size: 1.35rem; }
            .step-box .input-hole { width: 3rem; height: 2.8rem; font-size: 1.35rem; }
            .step-box .input-hole-sign { width: 2.6rem; }
            body { padding: .75rem; }
            #menu { padding-top: 1rem; }
            #menu h1 { font-size: 2.2rem; margin-bottom: 1.5rem; }
            #menu .card h2 { font-size: 1.35rem; }
            #problem-header { font-size: 1.5rem; }
            #problem-header .text-3xl { font-size: 2rem; }
            #problem-instruction { font-size: 1.35rem; margin-bottom: 1rem; }
            .choice-btn { font-size: 1.5rem; min-height: 90px; padding: .6rem; }
            #game .card { padding: 1rem; }
            #check-btn, #next-trigger-btn { font-size: 1.6rem; }
            #feedback h2 { font-size: 1.5rem; }
            #feedback .card { padding: 1rem; }
            #explanation { padding: 1rem; }
            .hissan-block { font-size: 1.15rem; padding: 10px; }
        }
        /* 【ブラッシュアップ】符号の欄はタップで ＋／− を切り替える */
        .input-hole-sign { cursor: pointer; caret-color: transparent; }
        .choice-grid.locked .choice-btn { pointer-events: none; }
        #finish .big { font-size: 3rem; }

        .choice-btn {
            background: white;
            border: 3px solid #e2e8f0;
            border-bottom-width: 6px;
            border-radius: 18px;
            padding: 1rem;
            font-size: 1.3rem;
            font-weight: 800;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
        }

        .choice-btn:hover {
            border-color: var(--sky-mid);
            background-color: #f0f9ff;
        }

        .choice-btn.correct {
            background-color: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .choice-btn.wrong {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .hissan-block {
            font-family: monospace;
            font-size: 1.4rem;
            text-align: right;
            padding: 15px;
            display: inline-block;
            background: white;
            border-radius: 12px;
        }

        .hissan-line {
            border-top: 3px solid #333;
            margin-top: 5px;
            padding-top: 5px;
        }

        .sign-change {
            color: #ef4444;
            font-weight: 900;
        }
    </style>
    <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="../assets/theme.css">
    <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    body.u-theme { padding: 12px !important; }
    #app { padding: 24px 20px; box-sizing: border-box; }
    #menu { padding: 8px 0 !important; }
    #menu h1 { margin-bottom: 20px !important; font-size: min(2.4rem, 9vw); white-space: nowrap; }
    #menu .card h2 { color: var(--u-title) !important; }
    #menu .card p { color: var(--u-sub) !important; font-weight: 700; }
    #game .card, #finish .card, #feedback .card { box-shadow: none; border: 3px solid var(--u-line); background: #f8fafc; }
    #problem-header { background: var(--u-soft-yellow) !important; border: 4px dashed #fde68a; color: var(--u-ink) !important; }
    #problem-instruction { color: var(--u-title-dark) !important; }
    .input-hole { border-color: var(--u-line-dark); border-bottom-color: var(--u-blue); color: var(--u-ink); }
    .input-hole-sign { border-bottom-color: var(--u-accent); color: var(--u-accent-text); }
    .step-box { border-color: var(--u-line); }
    #finish h2 { color: var(--u-accent-text) !important; }
    #feedback .card { border-color: var(--u-ok-line); background: var(--u-ok-soft); }
    #feedback h2 { color: var(--u-ok) !important; white-space: nowrap; font-size: min(1.9rem, 6.5vw); }
    /* 【ブラッシュアップ】日本語を言葉の切れ目で改行し、見出しは行の長さをそろえる（スマホで言葉の途中で切れないように） */
    body.u-theme { word-break: auto-phrase; line-break: strict; }
    h1, h2 { text-wrap: balance; }
    .nw { display: inline-block; white-space: nowrap; }

    /* 【ブラッシュアップ】ひっ算の表・モード1の解説 */
    .hissan-table { border-collapse: collapse; font-size: 1.35rem; font-weight: 700; background: #fff; font-family: var(--u-math-font); }
    /* 【ブラッシュアップ】式は全体を数式の書体で（数字は立て、文字だけ斜体）。元は丸ゴシックの数字と斜体の文字がまざっていた */
    .fx { font-family: var(--u-math-font); font-style: normal; font-weight: 700; }
    .fx i { font-style: italic; }
    .step-box .math-text, .hissan-table td { font-family: var(--u-math-font); }
    .input-hole { font-family: var(--u-math-font); }
    #problem-header .fx { font-size: 1.1em; }
    .choice-btn .fx { font-size: 1.3em; }
    /* 途中式の1行目は長いので、スマホでは折り返す。符号の前後にすきまを */
    .step-box > span.math-text:only-child { flex-shrink: 1 !important; min-width: 0; white-space: normal; }
    .step-box .mx-0\.5 { margin: 0 .3em !important; }
    .step-box > span.math-text:first-child:not(:only-child) { margin-right: .3em; }
    .hissan-table td { padding: 3px 8px; text-align: right; white-space: nowrap; min-width: 2.2em; }
    .hissan-table td.op { text-align: left; color: var(--u-sub); min-width: 1.8em; }
    .hissan-table tr.sum td { border-top: 3px solid var(--u-ink); }
    .hissan-table tr.flip td:not(.op) { color: #ef4444; }
    .hissan-table tr.res td { color: #e11d48; }
    .hissan-wrap { overflow-x: auto; max-width: 100%; }
    .ex-list { margin: 0; padding-left: 1.2em; line-height: 1.9; font-weight: 700; }
    .step-note { font-size: .85rem; color: var(--u-sub); font-weight: 400; }
    @media (max-width: 640px) { .hissan-table { font-size: 1.1rem; } .hissan-table td { padding: 2px 5px; } }
    @media (max-width: 640px) {
      body.u-theme { padding: 8px !important; }
      #app { padding: 14px 10px; }
    }
  
    </style>
</head>
<body class="u-theme p-4 md:p-8">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div id="app" class="max-w-3xl mx-auto">
        <!-- メインメニュー -->
        <div id="menu" class="text-center py-10">
            <h1 class="text-4xl font-black text-sky-600 mb-10">多項式マスター</h1>
            <div class="grid gap-6">
                <button onclick="startMode(1)" class="card p-6 hover:bg-emerald-50 text-left border-2 border-emerald-200">
                    <h2 class="text-2xl font-bold text-emerald-600 mb-1">モード1：選ぶトレーニング</h2>
                    <p class="text-gray-500">同じ仲間の項をまとめて、答えを選ぼう！</p>
                </button>
                <button onclick="startMode(2)" class="card p-6 hover:bg-sky-50 text-left border-2 border-sky-200">
                    <h2 class="text-2xl font-bold text-sky-600 mb-1">モード2：穴埋めチャレンジ</h2>
                    <p class="text-gray-500">段階的に穴が増えていくよ！</p>
                </button>
                <button onclick="startMode(3)" class="card p-6 hover:bg-rose-50 text-left border-2 border-rose-200">
                    <h2 class="text-2xl font-bold text-rose-600 mb-1">モード3：フル計算マスター</h2>

        <!-- ゲーム画面 -->
        <div id="game" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="showMenu()" class="text-sky-600 font-black text-lg bg-white px-4 py-2 rounded-xl shadow-sm border border-sky-100">メニューへ</button>
                <div id="progress" class="bg-sky-600 px-6 py-2 rounded-full text-white font-black text-lg">Q 1 / 4</div>
            </div>

            <div class="card p-6 mb-6">
                <div id="problem-header" class="mb-4 p-4 bg-sky-50 rounded-xl math-text text-center text-sky-900 min-height-[60px]"></div>

            <div class="flex flex-col gap-3">

                <button id="show-ans-btn" onclick="showAnswerAuto()" class="w-full py-3 bg-gray-400 text-white text-xl font-bold rounded-xl hover:bg-gray-500 transition-colors">答えを見る</button>
                <button id="next-trigger-btn" onclick="goToFeedback()" class="hidden w-full py-5 bg-emerald-500 text-white text-3xl font-black rounded-2xl btn-pop">正解！解説へ進む →</button>
            </div>
        </div>

        <!-- 【ブラッシュアップ】全問クリアの画面。元は alert() を出してメニューに戻っていた。
             alert は学校の環境によっては出ずに止まることがあるため、画面で出すようにした。 -->
        <div id="finish" class="hidden text-center py-8">
            <div class="card p-8 border-4 border-sky-200">
                <p class="big">🌸</p>
                <h2 class="text-3xl font-black text-sky-700 mb-2">全問クリア！</h2>
                <p class="text-xl font-bold text-gray-600 mb-6">この調子で頑張ろう！</p>
                <div class="flex flex-col gap-3 max-w-sm mx-auto">
                    <button onclick="startMode(currentMode)" class="w-full py-4 bg-sky-500 text-white text-2xl font-black rounded-2xl btn-pop">同じモードでもう一度</button>
                    <button onclick="showMenu()" class="w-full py-4 bg-white text-sky-700 text-xl font-black rounded-2xl border-2 border-sky-200">モードをえらび直す</button>
                    <a href="../remake.html" class="text-gray-500 underline mt-2">ほかの教材をえらぶ</a>
                </div>
            </div>
        </div>

        <!-- 解説画面 -->
        <div id="feedback" class="hidden">
            <div class="card p-6 border-4 border-emerald-400 bg-emerald-50 mb-6 text-center">
                <h2 id="feedback-title" class="text-3xl font-black mb-4 text-emerald-700">正解！解説をチェック ✨</h2>
                <div id="explanation" class="text-left bg-white p-6 rounded-xl shadow-inner overflow-x-auto min-w-full"></div>
            </div>
            <button onclick="nextProblem()" class="w-full py-5 bg-orange-500 text-white text-3xl font-black rounded-2xl btn-pop">次の問題へ！</button>
        </div>
    </div>

    <script>
        let currentMode = 1;
        let currentIdx = 0;
        let currentProblem = null;

        // 【ブラッシュアップ】モード1：選択肢を「よくあるまちがい」で作る（元は全部の係数に同じ数を足すだけで、
        //   3x + 3 なら 4x + 4、5x + 5 … と同じ形ばかりだった）。解説（ex）も問題ごとに。5・6 問目を追加
        const stageDataMode1 = [
            { display: "2x + 3 + x", resultCoeffs: [0, 0, 3, 3], answer: "3x + 3",
              choices: ["3x + 3", "2x + 3", "6x", "2x + 4"],
              ex: ["2x + x = 3x（x は 1x のこと）", "3 は数の項。文字の項とはまとめられないので、そのまま"] },
            { display: "5x - 4 + 2x + 1", resultCoeffs: [0, 0, 7, -3], answer: "7x - 3",
              choices: ["7x - 3", "7x - 5", "7x + 3", "4x"],
              ex: ["5x + 2x = 7x", "-4 + 1 = -3", "7x と -3 は同類項ではないので、4x にはしない"] },
            { display: "3x² + 2x + x²", resultCoeffs: [0, 4, 2, 0], answer: "4x² + 2x",
              choices: ["4x² + 2x", "4x⁴ + 2x", "3x² + 3x", "6x²"],
              ex: ["3x² + x² = 4x²（係数だけをたす。指数はたさないので x⁴ にはならない）", "2x は x² と同類項ではないので、そのまま"] },
            { display: "2x² + 3x + 5x² - 2x", resultCoeffs: [0, 7, 1, 0], answer: "7x² + x",
              choices: ["7x² + x", "7x² + 5x", "7x⁴ + x", "8x²"],
              ex: ["2x² + 5x² = 7x²", "3x - 2x = x（1x の 1 は書かない）"] },
            { display: "x² - 3x + 5 - 2x² + x - 7", resultCoeffs: [0, -1, -2, -2], answer: "-x² - 2x - 2",
              choices: ["-x² - 2x - 2", "x² - 2x - 2", "-x² - 4x - 2", "-x² - 2x + 2"],
              ex: ["x² - 2x² = -x²", "-3x + x = -2x", "5 - 7 = -2"] },
            { display: "3a²b - ab² + 2a²b + 4ab²", answer: "5a²b + 3ab²",
              choices: ["5a²b + 3ab²", "8a²b", "5a²b - 5ab²", "5a²b + 5ab²"],
              ex: ["3a²b + 2a²b = 5a²b", "-ab² + 4ab² = 3ab²", "a²b と ab² は文字の指数がちがうので、同類項ではない"] }
        ];

        // 【ブラッシュアップ】モード2・3：5〜7 問目を追加（抜けている次数・2A − 3B・文字が2つ）
        const stageDataNormal = [
            { a: [0, 0, 5, 2], b: [0, 0, 3, 1], type: "A+B" },
            { a: [0, 0, 4, 3], b: [0, 0, 2, -1], type: "A-B" },
            { a: [0, 3, 6, 4], b: [0, 2, -4, -3], type: "A+B" },
            { a: [0, 1, -2, 5], b: [0, 2, 3, -1], type: "A-B" },
            { a: [2, 0, -5, 3], b: [1, 2, 0, -4], type: "A-B" },
            { a: [0, 1, -2, 3], b: [0, 2, 1, -1], type: "2A-3B" },
            { a: [3, -2, 1], b: [1, 4, -3], type: "A-B", units: ["x²", "xy", "y²"] }
        ];

        // 【ブラッシュアップ】ここから
        // 項の文字の部分（元は x³, x², x, 数 に決まっていた。文字が2つの問題では問題ごとに持つ）
        function unitsOf(p) { return (p && p.units) || ["x³", "x²", "x", ""]; }
        // A と B にかける数（A+B → 1 と 1、A-B → 1 と -1、2A-3B → 2 と -3）
        function multOf(p) {
            const m = String(p.type).replace(/\s/g, '').match(/^(\d*)A([+-])(\d*)B$/);
            return { ka: m[1] ? +m[1] : 1, kb: (m[3] ? +m[3] : 1) * (m[2] === '-' ? -1 : 1) };
        }
        function typeLabel(p) { return String(p.type).replace('-', ' − ').replace('+', ' + '); }
        // 表示用：マイナスは「−」、文字は斜体
        // 【ブラッシュアップ】式の部分（日本語でないところ）を span.fx で包み、数式の書体で表示する。
        //   数字は立て、文字だけ斜体。マイナスは「−」。日本語の説明はそのまま
        function mt(s) {
            return String(s).replace(/[^　-ヿ㐀-鿿＀-￯]+/g, seg => {
                const core = seg.trim();
                if (!core) return seg;
                const at = seg.indexOf(core);
                return seg.slice(0, at) + '<span class="fx">' + core.replace(/-/g, '−').replace(/([a-zA-Z])/g, '<i>$1</i>') + '</span>' + seg.slice(at + core.length);
            });
        }
        let revealedThis = false;   // 「答えを見る」を使ったか

        // ひっ算：次数（文字の部分）ごとに列をそろえた表。抜けている次数は空けておく
        function hissanTable(rows, U) {
            let h = '<table class="hissan-table">';
            const used = U.map((u, i) => rows.some(r => r.coeffs && r.coeffs[i] !== 0));   // どの行にも出てこない列は作らない
            rows.forEach(r => {
                h += `<tr class="${r.line ? 'sum' : ''} ${r.cls || ''}"><td class="op">${r.op || ''}</td>`;
                let first = true;
                U.forEach((u, i) => {
                    if (!used[i]) return;
                    const c = r.coeffs ? r.coeffs[i] : 0;
                    let cell = '';
                    if (c !== 0) {
                        const abs = Math.abs(c);
                        cell = mt((c < 0 ? '−' : (first ? '' : '+')) + ((abs === 1 && u !== '') ? '' : abs) + u);
                        first = false;
                    }
                    h += `<td>${cell}</td>`;
                });
                h += '</tr>';
            });
            return h + '</table>';
        }
        // 【ブラッシュアップ】ここまで

        function formatTerm(coeff, power, isFirst = false) {
            if (coeff === 0) return "";
            const abs = Math.abs(coeff);
            const units = unitsOf(currentProblem);   // 【ブラッシュアップ】文字が2つの問題もあるので、問題ごとに
            const sign = coeff > 0 ? (isFirst ? "" : "+ ") : (isFirst ? "-" : "- ");   // 【ブラッシュアップ】先頭は「-x²」
            let valStr = abs.toString();
            if (abs === 1 && units[power] !== "") valStr = "";   // 【ブラッシュアップ】数だけの項のときは 1 を残す 
            return sign + valStr + units[power];
        }

        function formatPoly(coeffs, isJoinAfterOperator = false) {
            let res = "";
            coeffs.forEach((c, i) => {
                const isActuallyFirstInPoly = (res === "");
                const t = formatTerm(c, i, isActuallyFirstInPoly && !isJoinAfterOperator);
                if (t) res += (res === "" ? "" : " ") + t;
            });
            return res || "0";
        }

        function showMenu() {
            document.getElementById('finish').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('game').classList.add('hidden');
            document.getElementById('feedback').classList.add('hidden');
        }

        function startMode(mode) {
            currentMode = mode;
            currentIdx = 0;
            document.getElementById('finish').classList.add('hidden');
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            loadProblem();
        }

        function loadProblem() {
            const data = (currentMode === 1) ? stageDataMode1 : stageDataNormal;
            currentProblem = data[currentIdx];
            
            document.getElementById('progress').innerText = `Q ${currentIdx + 1} / ${data.length}`;   // 【ブラッシュアップ】問題を増やしたので
            revealedThis = false;
            window.scrollTo(0, 0);
            document.getElementById('message-box').classList.add('hidden');
            document.getElementById('check-btn').classList.remove('hidden');
            document.getElementById('show-ans-btn').classList.remove('hidden');
            document.getElementById('next-trigger-btn').classList.add('hidden');
            
            const area = document.getElementById('answer-area');
            area.innerHTML = "";

            if (currentMode === 1) {
                document.getElementById('problem-header').innerHTML = `<span class="text-3xl">${mt(currentProblem.display)}</span>`;
                document.getElementById('problem-instruction').innerText = `同類項をまとめよう！`;
                renderMode1();
            } else {
                const A_str = formatPoly(currentProblem.a);
                const B_str = formatPoly(currentProblem.b);
                document.getElementById('problem-header').innerHTML = mt('A = ' + A_str) + '<br>' + mt('B = ' + B_str);   // 【ブラッシュアップ】
                document.getElementById('problem-instruction').innerHTML = mt(typeLabel(currentProblem)) + ' の計算をしよう！';
                renderInputModes();
            }
        }

        function renderMode1() {
            const res = currentProblem.resultCoeffs;
            // 【ブラッシュアップ】答えと選択肢は問題ごとに用意したもの（よくあるまちがい）を使う
            const correctAns = currentProblem.answer || formatPoly(res);
            const choices = currentProblem.choices ? currentProblem.choices.slice() : [correctAns];
            let guard = 0;   // 【ブラッシュアップ】万一ダミーが作れなくても固まらないように
            while(choices.length < 4 && guard++ < 200) {
                let offset = (Math.floor(Math.random() * 3) + 1) * (Math.random() > 0.5 ? 1 : -1);
                const dummyRes = res.map(v => (v !== 0) ? v + offset : 0);
                const dummyStr = formatPoly(dummyRes);
                if(!choices.includes(dummyStr) && dummyStr !== "" && dummyStr !== "0") choices.push(dummyStr);
            }
            choices.sort(() => Math.random() - 0.5);

            const grid = document.createElement('div');
            grid.className = "choice-grid grid grid-cols-2 gap-4 mt-4";
            choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-btn math-text";
                btn.innerHTML = mt(c);   // 【ブラッシュアップ】マイナスは「−」、文字は斜体
                btn.onclick = () => {
                    if (c === correctAns) {
                        btn.classList.add('correct');
                        grid.classList.add('locked');   // 【ブラッシュアップ】正解のあとは押せないように
                        document.getElementById('next-trigger-btn').classList.remove('hidden');
                        document.getElementById('check-btn').classList.add('hidden');
                        document.getElementById('show-ans-btn').classList.add('hidden');
                        showMessage("正解！", true);
                    } else {
                        btn.classList.add('wrong');
                        btn.disabled = true;
                        showMessage("違うみたい...", false);
                    }
                };
                grid.appendChild(btn); 
            });
            document.getElementById('answer-area').appendChild(grid);
            document.getElementById('check-btn').classList.add('hidden');
            document.getElementById('show-ans-btn').classList.add('hidden');
        }

        function renderInputModes() {
            const area = document.getElementById('answer-area');
            const p = currentProblem;
            // 【ブラッシュアップ】A+B・A-B だけでなく 2A-3B も。文字の部分は問題ごと（文字が2つの問題のため）
            const { ka, kb } = multOf(p);
            const U = unitsOf(p);
            const kStr = (k) => (Math.abs(k) === 1 ? '' : Math.abs(k));

            // 【ブラッシュアップ】1 行目の左辺を書く（元は「= (…) - (…)」で、何の計算かが書かれていなかった）
            area.innerHTML += `<div class="step-box"><span class="math-text flex-shrink-0">${mt(typeLabel(p) + ' = ' + (ka === 1 ? '' : ka) + '(' + formatPoly(p.a) + ') ' + (kb < 0 ? '−' : '+') + ' ' + kStr(kb) + '(' + formatPoly(p.b) + ')')}</span></div>`;

            const step2 = document.createElement('div');
            step2.className = "step-box";
            step2.innerHTML = `<span class="math-text flex-shrink-0">= </span>`;

            const terms = [];
            p.a.forEach((v, i) => { if (v !== 0) terms.push({ v: ka * v, i, changed: ka !== 1 }); });
            p.b.forEach((v, i) => { if (v !== 0) terms.push({ v: kb * v, i, changed: true }); });

            // 非常に項が多い場合は少しフォントを小さくする
            if (terms.length > 4) {
                step2.style.fontSize = "0.9em";
            }

            // 【ブラッシュアップ】穴にするところ
            //   モード2：1問目は最後の項の数、2問目は最後の2項の数、3問目からは「かっこを外して変わる項」の数
            //            （ひき算・2A−3B では符号も）。元は3問目から穴がなく、符号も一度も自分で書かなかった
            //   モード3：かっこを外して変わる項の、符号と数を全部（A をそのまま写すだけの欄は作らない）
            terms.forEach((t, idx) => {
                const sign = t.v >= 0 ? "+" : "-";
                const absV = Math.abs(t.v);
                const displayVal = (absV === 1 && U[t.i] !== "") ? "" : absV;
                const unit = U[t.i];
                let valHole = false, signHole = false;
                if (currentMode === 3) { valHole = t.changed; signHole = t.changed; }
                else if (currentIdx === 0) valHole = (idx === terms.length - 1);
                else if (currentIdx === 1) valHole = (idx >= terms.length - 2);
                else { valHole = t.changed; signHole = t.changed && (kb < 0 || ka !== 1); }

                if (idx > 0 || t.v < 0) {
                    if (signHole) {
                        step2.innerHTML += `<input type="text" class="input-hole flex-shrink-0 input-hole-sign sign-part" data-target="${sign}" placeholder="±">`;
                    } else {
                        step2.innerHTML += `<span class="math-text mx-0.5 flex-shrink-0">${sign === '-' ? '−' : '+'}</span>`;
                    }
                }
                if (valHole && displayVal !== "") {
                    step2.innerHTML += `<input type="text" class="input-hole flex-shrink-0 val-part" data-target="${displayVal}" placeholder="?">`;
                } else if (displayVal !== "") {
                    step2.innerHTML += `<span class="math-text flex-shrink-0">${displayVal}</span>`;
                }
                step2.innerHTML += `<span class="math-text flex-shrink-0">${mt(unit)}</span>`;
            });
            step2.innerHTML += `<span class="step-note flex-shrink-0">（かっこを外す）</span>`;
            area.appendChild(step2);

            const res = getResultCoeffs(p);
            const step3 = document.createElement('div');
            step3.className = "step-box";
            step3.innerHTML = `<span class="math-text flex-shrink-0">= </span>`;

            let first = true;
            res.forEach((v, i) => {
                if (v === 0) return;
                const sign = v >= 0 ? "+" : "-";
                const absV = Math.abs(v);
                const displayVal = (absV === 1 && U[i] !== "") ? "" : absV;
                const unit = U[i];

                if (!first || v < 0) {
                    if (currentMode === 3) {
                        step3.innerHTML += `<input type="text" class="input-hole flex-shrink-0 input-hole-sign final-sign" data-target="${sign}" placeholder="±">`;
                    } else {
                        step3.innerHTML += `<span class="math-text mx-0.5 flex-shrink-0">${sign === '-' ? '−' : '+'}</span>`;
                    }
                }

                if (displayVal !== "") {
                    step3.innerHTML += `<input type="text" class="input-hole flex-shrink-0 final-val" data-target="${displayVal}" placeholder="?">`;
                }
                step3.innerHTML += `<span class="math-text flex-shrink-0">${mt(unit)}</span>`;
                first = false;
            });
            area.appendChild(step3);
            setupHoles();
        }

        // 【ブラッシュアップ】入力欄の使い勝手
        //   ・数の欄はスマホで数字キーボードを出す
        //   ・符号の欄はタップするたびに ＋ → − と切り替わる（キーボードで + - を打ってもよい）
        //   ・Enter で答え合わせ
        function setupHoles() {
            document.querySelectorAll('.input-hole').forEach(input => {
                input.setAttribute('autocomplete', 'off');
                if (input.classList.contains('input-hole-sign')) {
                    input.readOnly = true;
                    input.setAttribute('inputmode', 'none');
                    input.addEventListener('click', () => {
                        input.value = input.value === '+' ? '−' : '+';   // マイナスは「−」で表示（答え合わせでは同じあつかい）
                        input.classList.remove('error');
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === '+' || e.key === '-') { input.value = e.key === '-' ? '−' : '+'; input.classList.remove('error'); e.preventDefault(); }
                        if (e.key === 'Enter') checkAnswer();
                    });
                } else {
                    input.setAttribute('inputmode', 'numeric');
                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });
                }
            });
        }

        function getResultCoeffs(p) {
            if (p.resultCoeffs) return p.resultCoeffs;
            // 【ブラッシュアップ】A+B・A-B だけでなく 2A-3B も。項の数も問題ごと
            if (!p.type) return [];   // 文字が2つのモード1の問題は、答えを文字で持っているので使わない
            const { ka, kb } = multOf(p);
            return p.a.map((v, i) => ka * v + kb * p.b[i]);
        }

        function checkAnswer() {
            let allCorrect = true;
            document.querySelectorAll('.input-hole').forEach(input => {
                // 【ブラッシュアップ】全角の数字（「３」）や、いろいろなマイナス記号（− ー）も受け付ける
                const val = input.value.trim()
                    .replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0))
                    .replace(/＋/g, '+').replace(/[－−–ー]/g, '-');
                if (val !== input.dataset.target) {
                    input.classList.add('error');
                    allCorrect = false;
                } else {
                    input.classList.remove('error');
                }
            });
            if (allCorrect) {
                showMessage(revealedThis ? "答えをたしかめたら、解説へ進もう" : "正解！完璧です！", true);   // 【ブラッシュアップ】
                document.getElementById('check-btn').classList.add('hidden');
                document.getElementById('show-ans-btn').classList.add('hidden');
                document.getElementById('next-trigger-btn').classList.remove('hidden');
            } else {
                showMessage("どこか間違っているかも...", false);
            }
        }

        function showAnswerAuto() {
            document.querySelectorAll('.input-hole').forEach(input => {
                input.value = input.dataset.target === '-' ? '−' : input.dataset.target;
                input.classList.remove('error');
            });
            revealedThis = true;   // 【ブラッシュアップ】
        }

        function showMessage(txt, isSuccess) {
            const msg = document.getElementById('message-box');
            msg.innerText = txt;
            msg.className = `mb-4 p-4 rounded-xl text-center font-black text-xl block ${isSuccess ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`;
        }

        function goToFeedback() {
            document.getElementById('game').classList.add('hidden');
            document.getElementById('feedback').classList.remove('hidden');
            // 【ブラッシュアップ】答えを見たときは見出しを変える・解説の先頭から見せる
            document.getElementById('feedback-title').innerText = revealedThis ? '答えと解説をたしかめよう ✨' : '正解！解説をチェック ✨';
            window.scrollTo(0, 0);
            showExplanation();
        }

        function formatHissanRow(coeffs) {
            let row = "";
            coeffs.forEach((c, i) => {
                if (c === 0) return;
                const s = c > 0 ? "+ " : "- ";
                const abs = Math.abs(c);
                const unit = ["x³", "x²", "x", ""][i];
                const dispVal = (abs === 1 && i < 3) ? "" : abs;
                row += (row === "" && c > 0 ? "  " : s) + dispVal + unit + " ";
            });
            return row || " 0";
        }

        function coeffsToHissanFlipped(coeffs) {
            let res = "";
            coeffs.forEach((c, i) => {
                if(c === 0) return;
                const flipped = -c;
                const s = flipped > 0 ? `<span class="sign-change">+</span> ` : `<span class="sign-change">-</span> `;
                const abs = Math.abs(flipped);
                const unit = ["x³", "x²", "x", ""][i];
                const dispVal = (abs === 1 && i < 3) ? "" : abs;
                res += s + dispVal + unit + " ";
            });
            return res;
        }

        function showExplanation() {
            const p = currentProblem;
            const res = getResultCoeffs(p);
            const area = document.getElementById('explanation');
            area.innerHTML = "";

            if (currentMode === 1) {
                // 【ブラッシュアップ】答えだけでなく、どの項どうしをまとめたかを書く
                area.innerHTML = `<div class="math-text p-4 bg-slate-50 rounded-xl mb-4 text-center">${mt(p.display)}<br>${mt('=')} <span class="text-rose-600 font-black underline">${mt(p.answer || formatPoly(res))}</span></div>`
                    + (p.ex ? `<ul class="ex-list">${p.ex.map(l => '<li>' + mt(l) + '</li>').join('')}</ul>` : '');
                return;
            }

            // 【ブラッシュアップ】2A − 3B・文字が2つの問題にも対応。「同類項を集める」の行を追加
            const { ka, kb } = multOf(p);
            const U = unitsOf(p);
            const kStr = (k) => (Math.abs(k) === 1 ? '' : Math.abs(k));
            const aK = p.a.map(v => ka * v), bK = p.b.map(v => kb * v);
            let group = '';
            U.forEach((u, i) => {
                const ts = [aK[i], bK[i]].filter(v => v !== 0);
                if (!ts.length) return;
                if (ts.length === 2) group += (group ? ' + ' : '') + '(' + ts.map((v, j) => formatTerm(v, i, j === 0)).join(' ') + ')';
                else group += (group ? ' ' : '') + formatTerm(ts[0], i, group === '');
            });

            let stepHtml = `<div class="mb-8">
                <p class="font-black text-xl text-sky-700 mb-4 border-l-4 border-sky-400 pl-3">① 横書きで計算する</p>
                <div class="math-text space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>${mt(typeLabel(p) + ' = ' + (ka === 1 ? '' : ka) + '(' + formatPoly(p.a) + ') ' + (kb < 0 ? '−' : '+') + ' ' + kStr(kb) + '(' + formatPoly(p.b) + ')')}</div>
                    <div>${mt('= ' + formatPoly(aK) + ' ' + formatPoly(bK, true))} <span class="text-sm text-gray-500 font-normal">（かっこを外す）</span></div>
                    <div>${mt('= ' + group)} <span class="text-sm text-gray-500 font-normal">（同類項を集める）</span></div>
                    <div class="text-rose-600 underline font-black">${mt('= ' + formatPoly(res))}</div>
                </div>
            </div>`;

            // 【ブラッシュアップ】ひっ算は次数（文字の部分）ごとに列をそろえた表に。抜けている次数は空ける
            let hissanHtml = `<div class="mb-4">
                <p class="font-black text-xl text-sky-700 mb-4 border-l-4 border-sky-400 pl-3">② ひっ算で計算する</p>
                <div class="flex items-center gap-4 flex-wrap">`;
            if (ka === 1 && kb === -1) {
                hissanHtml += '<div class="hissan-wrap">' + hissanTable([{ coeffs: p.a }, { op: '−)', coeffs: p.b }, { line: true }], U) + '</div>';
                hissanHtml += `<span class="text-2xl">➡</span>`;
                hissanHtml += '<div class="hissan-wrap">' + hissanTable([{ coeffs: p.a }, { op: '+)', coeffs: p.b.map(v => -v), cls: 'flip' }, { line: true, coeffs: res, cls: 'res' }], U) + '</div>';
                hissanHtml += `</div><p class="text-rose-600 font-bold mt-4 bg-rose-50 p-3 rounded-lg">💡 引き算は、引く方の式のすべての符号を逆にして「足し算」として計算するのがミスを防ぐコツだよ！</p>`;
            } else if (ka === 1 && kb === 1) {
                hissanHtml += '<div class="hissan-wrap">' + hissanTable([{ coeffs: p.a }, { op: '+)', coeffs: p.b }, { line: true, coeffs: res, cls: 'res' }], U) + '</div>';
                hissanHtml += `</div>`;
            } else {
                hissanHtml += '<div class="hissan-wrap">' + hissanTable([{ coeffs: aK }, { op: '+)', coeffs: bK, cls: kb < 0 ? 'flip' : '' }, { line: true, coeffs: res, cls: 'res' }], U) + '</div>';
                hissanHtml += `</div><p class="text-rose-600 font-bold mt-4 bg-rose-50 p-3 rounded-lg">💡 先に ${mt(ka + 'A = ' + formatPoly(aK))}、${mt(kb + 'B = ' + formatPoly(bK))} を作ってから、たし算のひっ算にする。${kb < 0 ? '引く方の式は、符号が全部逆になる！' : ''}</p>`;
            }
            hissanHtml += `</div>`;

            area.innerHTML = stepHtml + hissanHtml;
        }

        function nextProblem() {
            currentIdx++;
            const data = (currentMode === 1) ? stageDataMode1 : stageDataNormal;
            if (currentIdx < data.length) {
                document.getElementById('feedback').classList.add('hidden');
                document.getElementById('game').classList.remove('hidden');
                loadProblem();
            } else {
                document.getElementById('feedback').classList.add('hidden');
                document.getElementById('finish').classList.remove('hidden');
                window.scrollTo(0, 0);
            }
        }
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    "#app": "u-card",
    "#menu h1": "u-title",
    "#menu button.card": "u-choice",
    "#game > div:first-child button": "u-btn u-btn-plain",
    "#progress": "u-pill",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.wrong": "u-ng",
    "#check-btn": "u-btn",
    "#show-ans-btn": "u-btn u-btn-plain",
    "#next-trigger-btn": "u-btn u-btn-blue",
    "#feedback > button": "u-btn u-btn-blue",
    "#finish button.bg-sky-500": "u-btn",
    "#finish button.bg-white": "u-btn u-btn-plain"
  });
</script>
</body>
