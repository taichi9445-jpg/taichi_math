      問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。

         本番用ではなく、重いうえに読み込めないと見た目が全部崩れるため、

    <style>
        :root { --bg: #F0F9FF; }
        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            color: #333;
            touch-action: manipulation;
        }
        .math-font { 
            font-family: 'Times New Roman', Times, serif; 
            font-style: italic; 
            font-weight: bold; 
        }
        .pop-card { background: white; border: 4px solid #333; border-radius: 20px; box-shadow: 6px 6px 0px #333; }
        .btn-pop { transition: all 0.2s; border-bottom: 6px solid rgba(0,0,0,0.3); text-shadow: 1px 1px 0 rgba(0,0,0,0.2); cursor: pointer; }
        .btn-pop:active { transform: translateY(4px); border-bottom-width: 2px; }
        
        .keyword-jisuu { color: #e11d48; font-size: 2rem; font-weight: 900; border-bottom: 4px solid #e11d48; padding: 0 4px; display: inline-block; line-height: 1.1; }
        .keyword-keisuu { color: #2563eb; font-size: 2rem; font-weight: 900; border-bottom: 4px solid #2563eb; padding: 0 4px; display: inline-block; line-height: 1.1; }
        .keyword-teisuu { color: #7c3aed; font-size: 2rem; font-weight: 900; border-bottom: 4px solid #7c3aed; padding: 0 4px; display: inline-block; line-height: 1.1; }
        .keyword-matome { color: #059669; font-size: 1.6rem; font-weight: 900; border-bottom: 4px solid #059669; padding: 0 4px; display: inline-block; line-height: 1.1; }

        @keyframes success-pop {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.4) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .success-overlay { animation: success-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .enemy-shake { animation: shake 0.2s ease-in-out infinite; }
        
        .game-container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 1rem; max-width: 500px; margin: 0 auto; }
        #ans-input { font-family: 'Times New Roman', Times, serif; font-style: italic; }

        /* 【ブラッシュアップ】スマホ用の表示（画面の幅が 640px 以下のときだけ切り替わる） */
        @media (max-width: 640px) {
            .game-container { padding: .6rem; justify-content: flex-start; }
            #screen-start h1 { font-size: 2.1rem; margin-bottom: 1.5rem; }
            #screen-start h1 span { font-size: 1.6rem; }
            #screen-start button, #screen-format button.py-6 { font-size: 1.3rem; }
            #battle-area { height: 7rem; }
            #question-text { min-height: 5.5rem; font-size: 1.3rem; }
            .keyword-jisuu, .keyword-keisuu, .keyword-teisuu { font-size: 1.7rem; }
            .keyword-matome { font-size: 1.4rem; }
            #question-formula { font-size: 2.3rem; padding: 1.1rem 0; }
            #ui-choice .choice-btn { font-size: 1.75rem; min-height: 6rem; }
            #ui-choice { gap: .8rem; }
            #btn-attack, #btn-next { font-size: 1.5rem; padding: 1.1rem 0; }
            #message-box { font-size: 1.2rem; }

        /* 【ブラッシュアップ】正解したあと次へ進むまでの間は、選択肢を押せないようにする */
        #ui-choice.locked .choice-btn { pointer-events: none; }
        .choice-btn.is-wrong { background: #fee2e2; border-color: #fca5a5; color: #ef4444; }
        #success-label { white-space: nowrap; }
        .input-help { font-size: .85rem; color: #64748b; text-align: center; margin: -8px 0 10px; }

<body class="u-theme">

    <div class="game-container">
        <!-- Start Screen -->

        <!-- Format Selection Screen -->

        <!-- Result Screen -->

            <h2 class="text-4xl font-bold text-orange-500 mb-6" style="-webkit-text-stroke: 1.5px black;">QUEST CLEAR!</h2>
            <div id="final-stats" class="mb-10 p-8 bg-white rounded-3xl border-4 border-black inline-block shadow-xl"></div><br>
            <!-- 【ブラッシュアップ】終わったあとに、同じレベル・別のレベル・別の教材を選べるようにした -->
            <div class="flex flex-col gap-3 max-w-sm mx-auto">
                <button onclick="startGame(currentFormat)" class="bg-orange-400 text-white px-6 py-4 rounded-2xl btn-pop text-xl font-bold border-4 border-black">同じレベルでもう一度</button>
                <button onclick="showStart()" class="bg-white text-gray-700 px-6 py-4 rounded-2xl btn-pop text-lg font-bold border-4 border-black">レベルをえらび直す</button>
                <a href="../remake.html" class="text-gray-500 underline mt-2">ほかの教材をえらぶ</a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 1;
        let currentFormat = 'choice';
        let currentQuestionIndex = 0;
        let currentStepIndex = 0; 
        let currentQuestionData = null;
        let totalTries = 0;
        let totalCorrect = 0;
        let isWaitingNext = false;
        // 【ブラッシュアップ】その段でまちがえた回数（まちがえたあとは解説を読んでから進む）と、自動で次へ進むタイマー
        let stepMisses = 0;
        let autoNextTimer = null;

        function showScreen(id) {
            ['screen-start', 'screen-format', 'screen-game', 'screen-result'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        /**
         * 数学的な表示のクリーンアップ
         * ^2 を ² に、^3 を ³ に変換。1x を x に。末尾の + を削除。
         */
        function formatMath(t) {
            if (!t) return "";
            return t.toString()
                .replace(/\b1([a-z])/g, '$1')        // 1x -> x
                .replace(/\+ -/g, "- ")              // + - -> -
                .replace(/- 1([a-z])/g, "- $1")      // - 1x -> - x
                .replace(/\^2/g, '²')                // ^2 -> ²
                .replace(/\^3/g, '³')                // ^3 -> ³
                .replace(/\^4/g, '⁴')                // ^4 -> ⁴
                .replace(/\^(\d+)/g, (m, d) => d.split('').map(n => '⁰¹²³⁴⁵⁶⁷⁸⁹'[n]).join(''))   // 【ブラッシュアップ】5乗以上も
                .replace(/\s*[+-]\s*$/, '')          // 末尾の記号を削除
                .replace(/-/g, '−')                  // 【ブラッシュアップ】マイナスは「−」で表示
                .replace(/([a-z⁰¹²³⁴⁵⁶⁷⁸⁹])/g, '<span class="math-font">$1</span>')
                .replace(/\s+/g, ' ')                // 余計なスペースを削除
                .trim();
        }

        // 【ブラッシュアップ】ここから：解説・ヒント・よくあるまちがいのダミー・Lv.4 のための関数

        // 並べかえずに式を作る（buildFormula は次数の高い順に並べかえてしまうので、
        //   Lv.3 の「散らばった同類項」がとなり合ってしまっていた）
        function buildRaw(terms) {
            let res = "";
            terms.forEach((t) => {
                if (t.coef === 0) return;
                let sign = t.coef > 0 ? (res === "" ? "" : "+ ") : (res === "" ? "-" : "- ");
                let absCoef = Math.abs(t.coef);
                let coefStr = (absCoef === 1 && t.v !== "") ? "" : absCoef;
                res += `${sign}${coefStr}${t.v} `;
            });
            return res.trim() || "0";
        }

        // 式（"3x^2 + 5x - 2x + 7"、"-4a^2x^3" など）を項に分ける
        function parseTerms(str) {
            const s = String(str).replace(/\s+/g, '').replace(/\+-/g, '-');
            const re = /([+-]?)(\d*)((?:[a-z](?:\^\d+)?)*)/g;
            const terms = [];
            let m;
            while ((m = re.exec(s)) !== null) {
                if (m[0] === '') { re.lastIndex++; continue; }
                if (m[2] === '' && m[3] === '') continue;
                const c = (m[1] === '-' ? -1 : 1) * (m[2] === '' ? 1 : parseInt(m[2]));
                const vars = {};
                (m[3].match(/[a-z](\^\d+)?/g) || []).forEach(v => { vars[v[0]] = (vars[v[0]] || 0) + (v.length > 1 ? parseInt(v.slice(2)) : 1); });
                const deg = Object.values(vars).reduce((a, b) => a + b, 0);
                terms.push({ c, vars, deg, key: Object.keys(vars).sort().map(k => k + vars[k]).join('') });
            }
            return terms;
        }
        function vstr(vars) { return Object.keys(vars).map(k => vars[k] === 1 ? k : k + '^' + vars[k]).join(''); }
        function termText(t) { return buildRaw([{ coef: t.c, v: vstr(t.vars) }]); }
        function numText(n) { return String(n).replace('-', '−'); }

        // 問われているもの（係数・次数・定数項・同類項まとめ）
        function taskKind(task) {
            if (task.kind) return task.kind;
            if (task.label.includes('keyword-keisuu')) return 'coef';
            if (task.label.includes('keyword-jisuu')) return 'deg';
            if (task.label.includes('keyword-teisuu')) return 'const';
            return 'matome';
        }
        // 係数・次数・定数項を読む式（Lv.3 は同類項をまとめた式）
        function targetExpr() {
            return currentMode === 3 ? currentQuestionData.tasks[0].answer : currentQuestionData.formula;
        }

        // まちがえたときのヒント
        function hintFor(task) {
            if (task.hint) return task.hint;
            const kind = taskKind(task);
            if (kind === 'coef') return '係数は「数の部分」。マイナスもふくめるよ';
            if (kind === 'deg') return parseTerms(targetExpr()).length === 1
                ? '単項式の次数は「かけ合わされている文字の個数」'
                : '多項式の次数は「いちばん次数の高い項」の次数';
            if (kind === 'const') return '定数項は「文字をふくまない項」';
            return '文字も指数も同じ項（同類項）どうしだけをまとめよう';
        }

        // 正解（または答えを見た）あとの解説
        function explainTask(task) {
            if (task.ex) return task.ex;
            const kind = taskKind(task);
            const F = (s) => '<b>' + formatMath(s) + '</b>';
            const orig = parseTerms(currentQuestionData.formula);
            const expr = targetExpr();
            const terms = parseTerms(expr);
            if (kind === 'coef') {
                const c = terms[0].c;
                if (Math.abs(c) === 1) return `数の部分が<b>係数</b>（符号もふくめる）。${F(expr)} は ${c > 0 ? '1' : '−1'} の「1」が省略されているので、係数は <b>${numText(c)}</b>`;
                return `数の部分が<b>係数</b>（符号もふくめる）。${F(expr)} の係数は <b>${numText(c)}</b>`;
            }
            if (kind === 'deg') {
                if (terms.length === 1) {
                    const parts = Object.keys(terms[0].vars).map(k => `<i>${k}</i> が ${terms[0].vars[k]} 個`);
                    const sum = parts.length > 1 ? '　' + Object.values(terms[0].vars).join('＋') + '＝' + terms[0].deg : '';
                    return `かけ合わされている文字の個数が<b>次数</b>。${parts.join('、')}${sum} → <b>${terms[0].deg}</b>`;
                }
                const list = terms.map(t => `${F(termText(t))} は ${t.deg} 次`).join('、');
                let s = `各項の次数（${list}）のうち、いちばん大きい <b>${task.answer}</b> が式の次数。`;
                const top = Math.max(...orig.map(t => t.deg));
                if (top > Number(task.answer)) s += `<br>⚠️ ${top} 次の項は、まとめると 0 になって消えている。見かけの ${top} 次にだまされないように！`;
                return s;
            }
            if (kind === 'const') {
                const oc = orig.filter(t => t.deg === 0);
                let s = '文字をふくまない項が<b>定数項</b>。';
                if (currentMode === 3 && oc.length > 1) {
                    s += `${F(buildRaw(oc.map(t => ({ coef: t.c, v: '' }))))} ＝ <b>${numText(task.answer)}</b>`;
                    if (task.answer === '0') s += '（定数の項は消えるので、定数項は 0）';
                    return s;
                }
                return s + ` → <b>${numText(task.answer)}</b>`;
            }
            // 同類項をまとめる
            const groups = {};
            orig.forEach(t => { (groups[t.key] = groups[t.key] || []).push(t); });
            const lines = Object.values(groups).filter(g => g.length > 1).map(g => {
                const sum = g.reduce((s, t) => s + t.c, 0);
                const left = buildRaw(g.map(t => ({ coef: t.c, v: vstr(t.vars) })));
                const right = sum === 0 ? '0' : buildRaw([{ coef: sum, v: vstr(g[0].vars) }]);
                return `${F(left)} ＝ ${F(right)}`;
            });
            return '文字も指数も同じ項（同類項）どうしをまとめる：<br>' + lines.join('<br>') + `<br>→ ${F(task.answer)}`;
        }

        // よくあるまちがいから作るダミー（足りない分は、元のしくみでランダムに作る）
        function smartDummies(task) {
            if (task.dummies) return task.dummies.map(String);
            const kind = taskKind(task);
            const out = [];
            const a = parseInt(task.answer);
            const orig = parseTerms(currentQuestionData.formula);
            const terms = parseTerms(targetExpr());
            if (kind === 'coef') {
                out.push(-a);                                   // 符号の見落とし
                if (Math.abs(a) === 1) out.push(0);             // 「数がない＝0」の思いこみ
                Object.values(terms[0].vars).forEach(e => out.push(e));   // 指数と取りちがえる
                out.push(terms[0].deg);
            } else if (kind === 'deg') {
                if (terms.length === 1) {
                    Object.values(terms[0].vars).forEach(e => out.push(e));      // 1つの文字の指数だけ
                    out.push(Math.abs(terms[0].c));                              // 係数と取りちがえる
                    out.push(Object.values(terms[0].vars).reduce((p, e) => p * e, 1));
                } else {
                    out.push(Math.max(...orig.map(t => t.deg)));      // 消えた項の次数（見かけの次数）
                    out.push(terms.length);                           // 項の数
                    out.push(terms.reduce((s, t) => s + t.deg, 0));   // 全部の指数をたしてしまう
                    out.push(orig[0].deg);                            // 先頭の項の次数
                }
                out.push(a + 1, a - 1);                               // 足りないときは近い数
                return out.filter(v => v >= 1 && v !== a).map(String);
            } else if (kind === 'const') {
                out.push(-a);                                                    // 符号の見落とし
                orig.filter(t => t.deg === 0).forEach(t => out.push(t.c));        // まとめる前の数
                const lin = terms.find(t => t.deg === 1);
                if (lin) out.push(lin.c);                                        // 1次の項の係数と取りちがえる
                out.push(orig.filter(t => t.deg === 0).reduce((s, t) => s + Math.abs(t.c), 0));
            } else if (kind === 'matome') {
                // 同類項のまとめ：係数の計算ミス・符号ミス・「x² + x² = x⁴」のように指数までたすミス
                const ts = parseTerms(task.answer);
                const mk = (f) => buildRaw(ts.map((t, i) => f(t, i)));
                out.push(mk((t, i) => ({ coef: i === 0 ? t.c + (t.c > 0 ? 1 : -1) : t.c, v: vstr(t.vars) })));
                out.push(mk((t, i) => ({ coef: i === ts.length - 1 ? -t.c : t.c, v: vstr(t.vars) })));
                out.push(mk((t) => { const v = {}; Object.keys(t.vars).forEach(k => v[k] = t.vars[k] * 2); return { coef: t.c, v: vstr(v) }; }));
                return out;
            }
            return out.map(String);
        }

        // 解説を出す
        function showTaskExplain() {
            const task = currentQuestionData.tasks[currentStepIndex];
            document.getElementById('explain-text').innerHTML = '💡 ' + explainTask(task);
            document.getElementById('explain-box').classList.remove('hidden');

        // 入力モード：2回まちがえたら「答えを見る」
        function revealAnswer() {
            if (isWaitingNext || !currentQuestionData) return;
            const task = currentQuestionData.tasks[currentStepIndex];
            totalTries++;
            document.getElementById('ans-input').value = task.answer;
            if (currentMode === 3 && currentStepIndex === 0) {

            }
            isWaitingNext = true;

            showTaskExplain();
            document.getElementById('btn-attack').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
        }

        // 【ブラッシュアップ】Lv.4 特定の文字に着目（数学Ⅰ「x に着目すると…」）
        function generateFocus(qIdx) {
            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const sg = () => (Math.random() < 0.5 ? -1 : 1);
            const pw = (v, e) => (e === 1 ? v : `${v}^${e}`);
            const F = (s) => '<b>' + formatMath(s) + '</b>';
            const X = (s) => `<span class="keyword-matome">${s}</span>`;
            const K = '<span class="keyword-keisuu">係数</span>';
            const J = '<span class="keyword-jisuu">次数</span>';
            const T = '<span class="keyword-teisuu">定数項</span>';
            const shuffleArr = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
            let data = { formula: '', tasks: [] };

            if (qIdx === 0) {                       // 例：3ax²
                const c = rnd(2, 6) * sg(), p = rnd(2, 3);
                data.formula = `${c}a${pw('x', p)}`;
                data.tasks = [
                    { label: `${X('x')} に着目したときの${K}を答えよ`, answer: `${c}a`, isFormula: true, kind: 'coef',
                      dummies: [String(c), `${c}${pw('x', p)}`, `${-c}a`],
                      hint: 'x 以外の文字 a は「数と同じあつかい」。x 以外の部分全部が係数',
                      ex: `x に着目すると、x 以外の文字 a は数と同じあつかい。x 以外の部分 ${F(c + 'a')} が係数` },
                    { label: `${X('x')} に着目したときの${J}を答えよ`, answer: String(p), kind: 'deg',
                      dummies: [String(p + 1), '1', String(p + 2)],
                      hint: 'x の個数だけを数えよう（a は数えない）',
                      ex: `x に着目すると、x の個数だけを数えて <b>${p}</b> 次（a もふくめた次数 ${p + 1} とはちがう）` }
                ];
            } else if (qIdx === 1) {                // 例：−2a²x³
                const c = rnd(2, 5) * sg(), m = rnd(2, 3);
                let p = rnd(2, 4); if (p === m) p = m + 1;
                data.formula = `${c}${pw('a', m)}${pw('x', p)}`;
                data.tasks = [
                    { label: `${X('x')} に着目したときの${K}を答えよ`, answer: `${c}${pw('a', m)}`, isFormula: true, kind: 'coef',
                      dummies: [String(c), `${c}${pw('x', p)}`, `${-c}${pw('a', m)}`],
                      hint: 'x 以外の部分全部が係数（a の部分もふくめる）',
                      ex: `x に着目 → x 以外の ${F(c + pw('a', m))} が係数` },
                    { label: `${X('a')} に着目したときの${K}を答えよ`, answer: `${c}${pw('x', p)}`, isFormula: true, kind: 'coef',
                      dummies: [String(c), `${c}${pw('a', m)}`, `${-c}${pw('x', p)}`],
                      hint: 'こんどは a に着目。a 以外の部分全部が係数',
                      ex: `a に着目 → a 以外の ${F(c + pw('x', p))} が係数。着目する文字で係数が変わる！` },
                    { label: `すべての文字に着目したときの${J}を答えよ`, answer: String(m + p), kind: 'deg',
                      dummies: [String(m), String(p), String(m * p)],
                      hint: 'a の個数と x の個数をたそう',
                      ex: `a が ${m} 個、x が ${p} 個 → ${m}＋${p}＝<b>${m + p}</b> 次` }
                ];
            } else if (qIdx === 2) {                // 例：4x³y − 5xy² + 3
                const e1 = rnd(2, 3), f = e1 === 2 ? 3 : 2;
                const c1 = rnd(2, 5), c2 = rnd(2, 6) * sg(), k = rnd(1, 7) * sg();
                const all = Math.max(e1 + 1, f + 1);
                data.formula = buildRaw([{ coef: c1, v: `${pw('x', e1)}y` }, { coef: c2, v: `x${pw('y', f)}` }, { coef: k, v: '' }]);
                data.tasks = [
                    { label: `この式は ${X('x')} について何次式か。${J}を答えよ`, answer: String(e1), kind: 'deg',
                      dummies: [String(f), String(all), String(e1 + 1)],
                      hint: 'x の指数だけを見て、いちばん大きいものをさがそう',
                      ex: `x についての次数は、各項の x の個数（${e1} と 1）のうちいちばん大きい <b>${e1}</b>` },
                    { label: `この式は ${X('y')} について何次式か。${J}を答えよ`, answer: String(f), kind: 'deg',
                      dummies: [String(e1), String(all), String(f + 1)],
                      hint: 'こんどは y の指数だけを見よう',
                      ex: `y についての次数は、各項の y の個数（1 と ${f}）のうちいちばん大きい <b>${f}</b>` },
                    { label: `すべての文字に着目すると何次式か。${J}を答えよ`, answer: String(all), kind: 'deg',
                      dummies: [String(e1), String(f), String(e1 + f + 2)],
                      hint: '各項の「x と y の個数の合計」のうち、いちばん大きいもの',
                      ex: `${F(pw('x', e1) + 'y')} は ${e1 + 1} 次、${F('x' + pw('y', f))} は ${f + 1} 次 → いちばん大きい <b>${all}</b> 次` }
                ];
            } else if (qIdx === 3) {                // 例：x² + 3xy − 2x + y² − 5
                const b1 = rnd(2, 4) * sg(), b0 = rnd(1, 5) * sg(), k = rnd(1, 6) * sg();
                const lin = buildFormula([{ coef: b1, v: 'y' }, { coef: b0, v: '' }]);
                const cst = buildFormula([{ coef: 1, v: 'y^2' }, { coef: k, v: '' }]);
                const parts = shuffleArr([{ coef: 1, v: 'x^2' }, { coef: b1, v: 'xy' }, { coef: b0, v: 'x' }, { coef: 1, v: 'y^2' }, { coef: k, v: '' }]);
                data.formula = buildRaw(parts);
                const org = `x^2 + (${lin})x + (${cst})`;
                data.tasks = [
                    { label: `この式は ${X('x')} について何次式か。${J}を答えよ`, answer: '2', kind: 'deg',
                      dummies: ['1', '3', '4'],
                      hint: 'x の指数だけを見よう（y は数と同じあつかい）',
                      ex: `x について降べきの順に整理すると ${F(org)}。x について <b>2</b> 次式` },
                    { label: `${X('x')} について整理したときの、x の${K}を答えよ`, answer: lin, isFormula: true, kind: 'coef',
                      dummies: [buildFormula([{ coef: b1, v: 'y' }, { coef: -b0, v: '' }]), buildFormula([{ coef: b1, v: 'y' }]), String(b0)],
                      hint: 'x が1個の項（xy の項と x の項）を集めて、x でくくろう',
                      ex: `x が1個の項を集めると ${F(buildRaw([{ coef: b1, v: 'xy' }, { coef: b0, v: 'x' }]))} ＝ ${F('(' + lin + ')x')}。x の係数は ${F(lin)}<br>整理した式：${F(org)}` },
                    { label: `${X('x')} について整理したときの${T}を答えよ`, answer: cst, isFormula: true, kind: 'const',
                      dummies: [String(k), 'y^2', buildFormula([{ coef: 1, v: 'y^2' }, { coef: -k, v: '' }])],
                      hint: 'x をふくまない項は、y がついていても定数項あつかい',
                      ex: `x をふくまない項 ${F(cst)} が、x についての定数項（y がついていてもよい）<br>整理した式：${F(org)}` }
                ];
            } else {                                // 例：2x² − 3xy + x + y² − 4y + 5
                const A = rnd(2, 3), B = rnd(2, 4) * sg(), C = rnd(1, 4) * sg(), D = rnd(2, 5) * sg(), E = rnd(1, 6) * sg();
                const xc = buildFormula([{ coef: B, v: 'y' }, { coef: C, v: '' }]);
                const xk = buildFormula([{ coef: 1, v: 'y^2' }, { coef: D, v: 'y' }, { coef: E, v: '' }]);
                const yk = buildFormula([{ coef: A, v: 'x^2' }, { coef: C, v: 'x' }, { coef: E, v: '' }]);
                const parts = shuffleArr([{ coef: A, v: 'x^2' }, { coef: B, v: 'xy' }, { coef: C, v: 'x' }, { coef: 1, v: 'y^2' }, { coef: D, v: 'y' }, { coef: E, v: '' }]);
                data.formula = buildRaw(parts);
                const org = `${A}x^2 + (${xc})x + (${xk})`;
                data.tasks = [
                    { label: `${X('x')} について整理したときの、x の${K}を答えよ`, answer: xc, isFormula: true, kind: 'coef',
                      dummies: [buildFormula([{ coef: -B, v: 'y' }, { coef: C, v: '' }]), buildFormula([{ coef: B, v: 'y' }]), String(A)],
                      hint: 'x が1個の項（xy の項と x の項）を集めよう',
                      ex: `${F(buildRaw([{ coef: B, v: 'xy' }, { coef: C, v: 'x' }]))} ＝ ${F('(' + xc + ')x')} → x の係数は ${F(xc)}<br>整理した式：${F(org)}` },
                    { label: `${X('x')} について整理したときの${T}を答えよ`, answer: xk, isFormula: true, kind: 'const',
                      dummies: [String(E), buildFormula([{ coef: 1, v: 'y^2' }, { coef: E, v: '' }]), buildFormula([{ coef: 1, v: 'y^2' }, { coef: -D, v: 'y' }, { coef: E, v: '' }])],
                      hint: 'x をふくまない項を全部集めよう（y の項もふくむ）',
                      ex: `x をふくまない項を全部集めて ${F(xk)}<br>整理した式：${F(org)}` },
                    { label: `こんどは ${X('y')} に着目。y について整理したときの${T}を答えよ`, answer: yk, isFormula: true, kind: 'const',
                      dummies: [String(E), buildFormula([{ coef: A, v: 'x^2' }, { coef: E, v: '' }]), xk],
                      hint: 'こんどは y をふくまない項を集めよう（x の項もふくむ）',
                      ex: `y をふくまない項を全部集めて ${F(yk)}。着目する文字が変わると、定数項も変わる！` }
                ];
            }
            return data;
        }
        // 【ブラッシュアップ】ここまで

        function showStart() { showScreen('screen-start'); }
        function showFormatSelection(m) { currentMode = m; showScreen('screen-format'); }
        
        function startGame(f) { 
            currentFormat = f; 
            currentQuestionIndex = 0; 
            currentStepIndex = 0; 
            totalTries = 0; 
            totalCorrect = 0; 
            showScreen('screen-game'); 
            nextQuestion(); 
        }

        function buildFormula(terms) {
            let res = "";
            let sorted = [...terms].sort((a,b) => {
                if(a.v === b.v) return 0;
                if(a.v === "") return 1;
                if(b.v === "") return -1;
                let degA = (a.v.match(/\^(\d+)/)?.[1]) || (a.v === "" ? 0 : 1);
                let degB = (b.v.match(/\^(\d+)/)?.[1]) || (b.v === "" ? 0 : 1);
                return degB - degA;
            });
            sorted.forEach((t) => {
                if (t.coef === 0) return;
                let sign = t.coef > 0 ? (res === "" ? "" : "+ ") : (res === "" ? "-" : "- ");
                let absCoef = Math.abs(t.coef);
                let coefStr = (absCoef === 1 && t.v !== "") ? "" : absCoef;
                res += `${sign}${coefStr}${t.v} `;
            });
            return res.trim() || "0";
        }

        function generateQuestion(mode, qIdx) {
            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const vars = ['x', 'a', 'b'];
            let data = { formula: '', tasks: [] };

            if (mode === 1) {
                let c = rnd(2, 5 + qIdx) * (Math.random() > 0.5 ? 1 : -1);
                // 【ブラッシュアップ】「x」「−x²」のように 1 が省略された係数もまぜる
                if ((qIdx === 1 || qIdx === 3) && Math.random() < 0.4) c = c > 0 ? 1 : -1;
                let v = vars[rnd(0, vars.length-1)];
                let p = (qIdx < 3) ? rnd(1, 2) : rnd(2, 3);
                if (qIdx === 4) {
                    let v2 = vars.filter(x => x !== v)[0];
                    let p2 = rnd(2, 3);
                    // 【ブラッシュアップ】文字はアルファベット順に書く（元は x³a² のようになることがあった）
                    const [l1, e1, l2, e2] = v < v2 ? [v, p, v2, p2] : [v2, p2, v, p];
                    data.formula = `${c}${l1}^${e1}${l2}^${e2}`;
                    data.tasks = [
                        { label: `この単項式の<span class="keyword-keisuu">係数</span>を答えよ`, answer: c.toString() },
                        { label: `この単項式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: (p + p2).toString() }
                    ];
                } else {
                    data.formula = `${c}${v}${p > 1 ? '^'+p : ''}`;
                    data.tasks = [
                        { label: `この単項式の<span class="keyword-keisuu">係数</span>を答えよ`, answer: c.toString() },
                        { label: `この単項式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: p.toString() }
                    ];
                }
            } else if (mode === 2) {
                let v = vars[rnd(0, vars.length-1)];
                if (qIdx === 0) {
                    let c = rnd(2, 5), t = rnd(1, 9);
                    data.formula = buildFormula([{coef: c, v: v}, {coef: t, v: ""}]);
                    data.tasks = [{ label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() }, { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "1" }];
                } else if (qIdx === 1) {
                    let c1 = rnd(2, 4), c2 = rnd(2, 4), t = rnd(1, 9);
                    data.formula = buildFormula([{coef: c1, v: 'a'}, {coef: c2, v: 'b'}, {coef: t, v: ""}]);
                    data.tasks = [{ label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() }, { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "1" }];
                } else if (qIdx === 2) {
                    let c2 = rnd(2, 5), t = rnd(2, 9);
                    data.formula = buildFormula([{coef: c2, v: v+"^2"}, {coef: t, v: ""}]);
                    data.tasks = [{ label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() }, { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "2" }];
                } else if (qIdx === 3) {
                    let c2 = rnd(2, 5), c1 = rnd(2, 5), t = rnd(1, 9);
                    data.formula = buildFormula([{coef: c2, v: v+"^2"}, {coef: c1, v: v}, {coef: t, v: ""}]);
                    data.tasks = [{ label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() }, { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "2" }];
                } else {
                    let c3 = rnd(2, 4), c2 = rnd(2, 4), c1 = rnd(2, 4), t = rnd(1, 9);
                    data.formula = buildFormula([{coef: c3, v: v+"^3"}, {coef: c2, v: v+"^2"}, {coef: c1, v: v}, {coef: t, v: ""}]);
                    data.tasks = [{ label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() }, { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "3" }];
                }
            } else if (mode === 4) {
                return generateFocus(qIdx);   // 【ブラッシュアップ】Lv.4 特定の文字に着目
            } else {
                let v = vars[rnd(0, vars.length-1)];
                if (qIdx === 0) {
                    let c1a = rnd(2, 4), c1b = rnd(2, 4), t = rnd(1, 9);
                    data.formula = buildRaw([{coef: c1a, v: v}, {coef: t, v: ""}, {coef: c1b, v: v}]);   // 【ブラッシュアップ】並べかえない
                    data.tasks = [
                        { label: `<span class="keyword-matome">同類項をまとめて</span>簡単にせよ`, answer: buildFormula([{coef: c1a+c1b, v: v}, {coef: t, v: ""}]), isFormula: true },
                        { label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() },
                        { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "1" }
                    ];
                } else if (qIdx === 1) {
                    let c1a = rnd(2, 5), c1b = rnd(2, 5), t1 = rnd(1, 5), t2 = rnd(1, 5);
                    data.formula = buildRaw([{coef: c1a, v: v}, {coef: t1, v: ""}, {coef: c1b, v: v}, {coef: t2, v: ""}]);   // 【ブラッシュアップ】並べかえない
                    data.tasks = [
                        { label: `<span class="keyword-matome">同類項をまとめて</span>簡単にせよ`, answer: buildFormula([{coef: c1a+c1b, v: v}, {coef: t1+t2, v: ""}]), isFormula: true },
                        { label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: (t1+t2).toString() },
                        { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "1" }
                    ];
                } else if (qIdx === 2) {
                    let c2a = rnd(2, 4), c2b = rnd(2, 4), c1 = rnd(2, 5), t = rnd(1, 9);
                    data.formula = buildRaw([{coef: c2a, v: v+"^2"}, {coef: c1, v: v}, {coef: c2b, v: v+"^2"}, {coef: t, v: ""}]);   // 【ブラッシュアップ】並べかえない
                    data.tasks = [
                        { label: `<span class="keyword-matome">同類項をまとめて</span>簡単にせよ`, answer: buildFormula([{coef: c2a+c2b, v: v+"^2"}, {coef: c1, v: v}, {coef: t, v: ""}]), isFormula: true },
                        { label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: t.toString() },
                        { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "2" }
                    ];
                } else if (qIdx === 3) {
                    let c2 = rnd(2, 5), c1a = rnd(2, 5), c1b = rnd(-4, -1), t1 = rnd(5, 9), t2 = rnd(-4, -1);
                    data.formula = buildRaw([{coef: c2, v: v+"^2"}, {coef: c1a, v: v}, {coef: t1, v: ""}, {coef: c1b, v: v}, {coef: t2, v: ""}]);   // 【ブラッシュアップ】並べかえない
                    data.tasks = [
                        { label: `<span class="keyword-matome">同類項をまとめて</span>簡単にせよ`, answer: buildFormula([{coef: c2, v: v+"^2"}, {coef: c1a+c1b, v: v}, {coef: t1+t2, v: ""}]), isFormula: true },
                        { label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: (t1+t2).toString() },
                        { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: "2" }
                    ];
                } else {
                    let c3a = rnd(2, 4), c3b = rnd(-3, -1);
                    let c2a = rnd(2, 4), c2b = rnd(2, 4);
                    let t1 = rnd(5, 9), t2 = -t1;
                    data.formula = buildRaw([{coef: c3a, v: v+"^3"}, {coef: c2a, v: v+"^2"}, {coef: t1, v: ""}, {coef: c3b, v: v+"^3"}, {coef: c2b, v: v+"^2"}, {coef: t2, v: ""}]);   // 【ブラッシュアップ】並べかえない
                    data.tasks = [
                        { label: `<span class="keyword-matome">同類項をまとめて</span>簡単にせよ`, answer: buildFormula([{coef: c3a+c3b, v: v+"^3"}, {coef: c2a+c2b, v: v+"^2"}]), isFormula: true },
                        { label: `この式の<span class="keyword-teisuu">定数項</span>を答えよ`, answer: "0" },
                        // 【ブラッシュアップ】c3a + c3b = 0 のときは x³ の項が消えるので 2次式
                        { label: `この式の<span class="keyword-jisuu">次数</span>を答えよ`, answer: (c3a + c3b === 0) ? "2" : "3" }
                    ];
                }
            }
            // 【ブラッシュアップ】Lv.2：定数項がマイナスの式や、次数の低い順に並んだ式もまぜる
            //   （元は定数項がいつもプラスで、いちばん前の項を見れば次数がわかってしまった）
            if (mode === 2) {
                let ts = parseTerms(data.formula);
                if (Math.random() < 0.4) {
                    ts.forEach(t => { if (t.deg === 0) t.c = -t.c; });
                    data.tasks[0].answer = String(ts.find(t => t.deg === 0).c);
                }
                if (Math.random() < 0.4) ts = ts.slice().reverse();
                data.formula = buildRaw(ts.map(t => ({ coef: t.c, v: vstr(t.vars) })));
            }
            return data;
        }

        function setupChoices() {
            const container = document.getElementById('ui-choice');
            container.innerHTML = "";
            let task = currentQuestionData.tasks[currentStepIndex];
            let opts = [task.answer];
            // 【ブラッシュアップ】よくあるまちがい（符号の見落とし・指数との取りちがえ・消えた項の次数など）を先に入れる
            const kind = taskKind(task);
            smartDummies(task).forEach(v => { if (opts.length < 4 && v !== '' && !opts.includes(v) && !isEquivalent(v, task.answer)) opts.push(v); });

            // ダミー生成
            // 【ブラッシュアップ】元は「opts.length > 30 なら抜ける」だったが、opts は 4 個までしか増えないので
            //   抜けられず、ダミーが作れない問題で画面が固まるおそれがあった。回数で止める。
            let guard = 0;
            while(opts.length < 4 && guard++ < 200) {
                let v = "";
                if(task.isFormula) {
                    let type = Math.floor(Math.random() * 4);
                    if (type === 0) {
                        v = task.answer.replace(/(?<![\^\d])(-?\d+)/g, (m) =>   /* 【ブラッシュアップ】指数は変えない */ (parseInt(m) + (Math.random() > 0.5 ? 1 : -1)).toString());
                    } else if (type === 1) {
                        v = task.answer.replace(/\^(\d+)/g, (m, p) => `^${parseInt(p) + (Math.random() > 0.5 ? 1 : -1)}`);
                    } else if (type === 2) {
                        v = task.answer.replace(/\s\+\s/g, " + 99 ").replace(/\s\-\s/g, " + ").replace(/99/g, "-");
                    } else {
                        // 【ブラッシュアップ】元は x→a→x で入れかえになっていなかった。「x²＋x² を x⁴ にする」まちがいに替える
                        v = task.answer.replace(/([a-z])(\^(\d+))?/g, (m, l, _, p) => l + '^' + (2 * (p ? +p : 1)));
                    }
                    // ダミーのクリーンアップ（変な指数などを直す）
                    // 【ブラッシュアップ】元は最後に指数をすべて ^2 にしていたため、x³ のある選択肢が正解だけになっていた
                    v = v.replace(/\^1(?!\d)/g, "").replace(/([a-z])\^0(?!\d)/g, "");
                } else {
                    let val = parseInt(task.answer);
                    v = (val + (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1)).toString();
                }
                
                if (kind === 'deg' && !task.isFormula && parseInt(v) < 1) continue;   // 【ブラッシュアップ】「−2次」のような選択肢は出さない
                if (v && v !== task.answer && !opts.includes(v) && !isEquivalent(v, task.answer)) opts.push(v);
            }
            // 【ブラッシュアップ】それでも足りないときは、数字を大きくずらした選択肢で埋める
            let k = 6;
            while(opts.length < 4) {
                const extra = task.isFormula
                    ? task.answer.replace(/(-?\d+)/, (m) => (parseInt(m) + k).toString())
                    : (parseInt(task.answer) + k).toString();
                if (!opts.includes(extra)) opts.push(extra);
                k++;
            }

            opts.sort(() => Math.random()-0.5).forEach(o => {
                const b = document.createElement('button');
                b.className = "choice-btn font-bold btn-pop border-2 border-black bg-white py-2 px-1 rounded-xl text-lg flex items-center justify-center min-h-[3.5rem]";
                b.innerHTML = formatMath(o);
                b.onclick = () => { if (!isEquivalent(o, task.answer)) { b.classList.add('is-wrong'); b.disabled = true; } compareAndHandle(o, task.answer); };
                container.appendChild(b);
            });
        }

        function nextQuestion() {
            if(currentQuestionIndex >= 5) { showResult(); return; }
            if (currentStepIndex === 0) {
                currentQuestionData = generateQuestion(currentMode, currentQuestionIndex);
                document.getElementById('solved-display').classList.add('hidden');
            }
            
            isWaitingNext = false;
            // 【ブラッシュアップ】解説・「答えを見る」を隠して、まちがい回数とタイマーを戻す
            stepMisses = 0;
            clearTimeout(autoNextTimer);
            document.getElementById('explain-box').classList.add('hidden');
            document.getElementById('btn-explain-next').classList.add('hidden');
            document.getElementById('btn-reveal').classList.add('hidden');
            document.getElementById('ui-choice').classList.remove('locked');
            // 【ブラッシュアップ】入力するものに合わせて、例と打ち方を出す
            const curTask = currentQuestionData ? currentQuestionData.tasks[currentStepIndex] : null;
            const inputEl = document.getElementById('ans-input');
            if (curTask && curTask.isFormula) {
                inputEl.placeholder = '例： 3x^2 + 2x + 1';
                document.getElementById('input-help').textContent = '2乗は「^2」と打つ（x² → x^2）';
            } else {
                inputEl.placeholder = '数を入力';
                document.getElementById('input-help').textContent = 'マイナスのときは「-3」のように打つ';
            }
            document.getElementById('btn-attack').classList.remove('hidden');
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('game-progress').innerText = `第 ${currentQuestionIndex+1} / 5 問`;
            document.getElementById('question-formula').innerHTML = formatMath(currentQuestionData.formula);
            document.getElementById('message-box').innerText = "";
            document.getElementById('success-label').classList.add('hidden');
            document.getElementById('enemy').className = "";
            document.getElementById('question-text').innerHTML = currentQuestionData.tasks[currentStepIndex].label;

            if(currentFormat === 'choice') {
                document.getElementById('ui-choice').classList.remove('hidden');
                document.getElementById('ui-input').classList.add('hidden');
                setupChoices();
            } else {
                document.getElementById('ui-choice').classList.add('hidden');
                document.getElementById('ui-input').classList.remove('hidden');
                const input = document.getElementById('ans-input');
                input.value = "";
                input.disabled = false;
                input.focus();   // 【ブラッシュアップ】元は setTimeout の中で、iPhone ではキーボードが開かなかった
            }
        }

        function isEquivalent(input, correct) {
            // 【ブラッシュアップ】全角の数字・記号（「５」「－」など）でも正しく比べる
            const clean = (s) => s.toString().replace(/[！-～]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ').replace(/\s/g, '').replace(/[−–—ー]/g, '-') /* 【ブラッシュアップ】「ー」も */.replace(/^\+/, '').replace(/\b1([a-z])/g, '$1').replace(/\^/g, '');
            // 直接入力時に指数（²など）が入力できない場合を想定し、^2などでも正解とするための柔軟な比較
            let c1 = clean(input).replace(/[²]/g, '2').replace(/[³]/g, '3');
            let c2 = clean(correct).replace(/[²]/g, '2').replace(/[³]/g, '3');
            if (c1 === c2) return true;
            
            const splitTerms = (s) => s.replace(/-/g, ',-').replace(/\+/g, ',').split(',').filter(x => x !== "").sort();
            try { return splitTerms(c1).join('|') === splitTerms(c2).join('|'); } catch(e) { return false; }
        }

        function checkAnswer() {
            const task = currentQuestionData.tasks[currentStepIndex];
            const input = document.getElementById('ans-input').value;
            // 【ブラッシュアップ】空のまま Enter を押しても「ミス」にしない
            if (!input.trim()) { document.getElementById('message-box').innerText = '答えを入力してね'; return; }
            compareAndHandle(input, task.answer);
        }

        function compareAndHandle(input, correct) {
            // 【ブラッシュアップ】正解して次へ進むのを待っている間は受け付けない。
            //   元は 0.8 秒の間にもう一度押すと、得点が二重に入って 1 段とばしてしまった。
            if (isWaitingNext) return;
            if(isEquivalent(input, correct)) handleCorrect();
            else handleWrong();
        }

        function handleCorrect() {
            totalTries++; 
            totalCorrect++;
            document.getElementById('success-label').classList.remove('hidden');
            document.getElementById('enemy').classList.add('enemy-shake');
            // 【ブラッシュアップ】元はここで入力欄のフォーカスを外していた（スマホでキーボードが毎回閉じて、次でまた開き直していた）
            showTaskExplain();
            if(currentMode === 3 && currentStepIndex === 0) {
                document.getElementById('solved-display').classList.remove('hidden');
                document.getElementById('solved-text').innerHTML = formatMath(currentQuestionData.tasks[0].answer);
            }
            isWaitingNext = true;
            document.getElementById('ui-choice').classList.add('locked');
            if (currentFormat === 'choice') {
                // 【ブラッシュアップ】一発で正解したら、解説を見せつつ自動で次へ。まちがえたあとは「次へ」を押すまで解説を読める
                if (stepMisses === 0) autoNextTimer = setTimeout(moveToNext, 1300);
                else document.getElementById('btn-explain-next').classList.remove('hidden');
            }
            else { 
                document.getElementById('btn-attack').classList.add('hidden'); 
                document.getElementById('btn-next').classList.remove('hidden'); 
            }
        }

        function handleWrong() {
            totalTries++;
            stepMisses++;
            // 【ブラッシュアップ】「ミス！」だけでなく、何を見ればよいかのヒントを出す
            const wTask = currentQuestionData.tasks[currentStepIndex];
            document.getElementById('message-box').innerHTML = 'ミス！もう一度！<br><span class="hint-line">💡 ' + hintFor(wTask) + '</span>';
            if (currentFormat === 'input' && stepMisses >= 2) document.getElementById('btn-reveal').classList.remove('hidden');
            document.getElementById('enemy').classList.add('enemy-shake');
            setTimeout(() => { 
                document.getElementById('enemy').classList.remove('enemy-shake'); 
                if(currentFormat === 'input') document.getElementById('ans-input').focus(); 
            }, 300);
        }

        function moveToNext() {
            if (!currentQuestionData) return;
            if (!isWaitingNext) return;   // 【ブラッシュアップ】二重に進まないように
            clearTimeout(autoNextTimer);
            currentStepIndex++;
            if (currentStepIndex >= currentQuestionData.tasks.length) { 
                currentQuestionIndex++; 
                currentStepIndex = 0; 
            }
            if(currentQuestionIndex >= 5) showResult();
            else nextQuestion();
        }

        function showResult() {
            showScreen('screen-result');
            const rate = Math.round((totalCorrect / totalTries) * 100) || 0;
            document.getElementById('final-stats').innerHTML = `
                <p class="text-xl mb-4 text-gray-600">冒険の成果</p>
                <div class="mb-4">
                    <span class="text-gray-500">正解率</span><br>
                    <span class="text-6xl text-red-600 font-black">${rate}%</span>
                </div>
                <p class="text-sm text-gray-400">${totalCorrect} / ${totalTries} アタック成功</p>
            `;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const gameScreen = document.getElementById('screen-game');
                if (!gameScreen.classList.contains('hidden')) {
                    if (isWaitingNext) moveToNext();
                    else if (currentFormat === 'input') checkAnswer();
                }
            }
        });

        // 【ブラッシュアップ】「攻撃！」「次へ！」などを押しても入力欄からフォーカスを外さない（スマホでキーボードが閉じないように）
        ['btn-attack', 'btn-next', 'btn-reveal'].forEach(id => document.getElementById(id).addEventListener('mousedown', (e) => e.preventDefault()));
        showStart();
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".game-container": "u-card",
    "#screen-start h1": "u-title",
    "#screen-start button": "u-choice",

    "#screen-game button.rounded-full": "u-btn u-btn-plain",

    "#btn-explain-next": "u-btn u-btn-blue",

    "#screen-result .max-w-sm button.bg-orange-400": "u-btn",
    "#screen-result .max-w-sm button.bg-white": "u-btn u-btn-plain"
  });
</script>
