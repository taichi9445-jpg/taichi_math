<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展開の公式</title>
<link rel="stylesheet" href="../assets/base.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="../assets/mathcore.js"></script>
<script src="../assets/quiz.js"></script>
<script src="../assets/algebra.js"></script>
<script>
/* ---------------------------------------------------------------------------
   10. 展開の公式
     Lv.1 公式別   (x+a)(x+b) ／ (x±a)² ／ (x+a)(x-a)
     Lv.2 ミックス（完全ランダム）
     Lv.3 係数あり（たすき掛けにつながる形）
   それぞれ「4択」と「穴埋め」で練習できる。

   元教材から直した点：
     ・誤答の選択肢が、たまたま正解と同じ式になっていることがあった
       （例：正解 x²+5x+6 に対して x²+6x+5 のつもりが同じ式になる）。
       → 選択肢はすべて数式として比較し、正解と等しいものは誤答にしない。
     ・穴埋めで符号を別枠にしていたため、「-」と「-3」の二重入力になり
       正しく書いても不正解になっていた。
       → 係数ひとつを 1 つの空欄で入力する形に統一（符号もそこに書く）。
--------------------------------------------------------------------------- */
(function () {
  'use strict';

  var A = Algebra, F = Quiz.fmt, M = MathCore;

  /* --- 誤答を作る：正解と数学的に等しくならないものだけ採用する --- */
  function makeWrongChoices(correctHtml, variants, need) {
    var out = [];
    var correctPlain = F.plain(correctHtml);
    variants.forEach(function (v) {
      if (out.length >= need) return;
      if (v === correctHtml) return;
      if (M.isEqual(F.plain(v), correctPlain)) return;   // 見た目が違っても中身が同じなら不採用
      if (out.indexOf(v) >= 0) return;
      out.push(v);
    });
    return out;
  }

  /* --- 問題を1つ作る（種類を指定） --- */
  function makeItem(kind) {
    if (kind === 'ab') return A.quadraticFromRoots({ lo: -8, hi: 8 });
    if (kind === 'sq') return A.squareForm({ lo: -8, hi: 8 });
    if (kind === 'df') return A.diffOfSquares({ hi: 9 });
    if (kind === 'cross') return A.crossForm();
    return A.quadraticFromRoots();
  }

  var HINTS = {
    ab: '(x + a)(x + b) = x² + (a + b)x + ab',
    sq: '(x + a)² = x² + 2ax + a²',
    df: '(x + a)(x − a) = x² − a²',
    cross: '前どうし・外どうし・内どうし・後ろどうしを、すべてかけて足します。'
  };

  function choiceQuestion(kind) {
    var it = makeItem(kind);
    var c = it.coefs;

    // ありがちなまちがいを誤答にする
    var variants = [
      F.poly([[c.x2, F.pow('x', 2)], [c.x1, 'x'], [-c.x0, '']]),          // 定数の符号ミス
      F.poly([[c.x2, F.pow('x', 2)], [-c.x1, 'x'], [c.x0, '']]),          // x の符号ミス
      F.poly([[c.x2, F.pow('x', 2)], [c.x0, 'x'], [c.x1, '']]),           // 和と積を取りちがえ
      F.poly([[c.x2, F.pow('x', 2)], [c.x1 + 1, 'x'], [c.x0, '']]),
      F.poly([[c.x2, F.pow('x', 2)], [c.x1, 'x'], [c.x0 + 2, '']]),
      F.poly([[c.x2, F.pow('x', 2)], [0, 'x'], [c.x0, '']])
    ];
    var wrongs = makeWrongChoices(it.expanded, Quiz.shuffle(variants), 3);
    var guard = 0;
    while (wrongs.length < 3 && guard++ < 40) {
      var w = F.poly([[c.x2, F.pow('x', 2)], [c.x1 + Quiz.randInt(-4, 4), 'x'], [c.x0 + Quiz.randInt(-5, 5), '']]);
      if (!M.isEqual(F.plain(w), F.plain(it.expanded)) && wrongs.indexOf(w) < 0) wrongs.push(w);
    }

    return {
      tag: '4択',
      text: '次の式を展開しなさい。',
      math: it.factored,
      type: 'choice',
      choices: [it.expanded].concat(wrongs),
      correct: 0,
      hint: HINTS[kind],
      explain: HINTS[kind] + '<br>答え： ' + it.expanded
    };
  }

  function blankQuestion(kind) {
    var it = makeItem(kind);
    var c = it.coefs;
    var answers = [String(c.x1), String(c.x0)];
    var template = (c.x2 === 1 ? 'x<sup>2</sup>' : c.x2 + 'x<sup>2</sup>') + ' ＋ _ x ＋ _';

    return {
      tag: '穴埋め',
      text: '展開した式の空欄を、符号もふくめて埋めなさい。',
      math: it.factored,
      type: 'blanks',
      template: template,
      answers: answers,
      answerLabel: it.expanded,
      hint: HINTS[kind] + '　マイナスのときは「-5」のように符号もつけて入れます。',
      explain: HINTS[kind] + '<br>答え： ' + it.expanded
    };
  }

  function inputQuestion(kind) {
    var it = makeItem(kind);
    return {
      tag: '記述',
      text: '次の式を展開しなさい。',
      math: it.factored,
      type: 'input',
      answer: F.plain(it.expanded),
      answerLabel: it.expanded,
      placeholder: '例： x^2 + 5x + 6',
      note: '2乗は「x^2」または「x²」。書く順番は自由です。',
      hint: HINTS[kind],
      explain: HINTS[kind] + '<br>答え： ' + it.expanded
    };
  }

  function build(kinds, maker, n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(maker(Quiz.pick(kinds)));
    return out;
  }

  Quiz.start({
    title: '展開の公式',
    subtitle: '公式ごとに練習してから、ミックスで実戦に進もう。',
    modes: [
      { id: 'ab:c', group: 'Lv.1 公式別', name: '(x+a)(x+b)　4択', desc: '10問' },
      { id: 'ab:b', group: 'Lv.1 公式別', name: '(x+a)(x+b)　穴埋め', desc: '8問' },
      { id: 'sq:c', group: 'Lv.1 公式別', name: '(x±a)²　4択', desc: '10問' },
      { id: 'sq:b', group: 'Lv.1 公式別', name: '(x±a)²　穴埋め', desc: '8問' },
      { id: 'df:c', group: 'Lv.1 公式別', name: '(x+a)(x−a)　4択', desc: '10問' },
      { id: 'df:b', group: 'Lv.1 公式別', name: '(x+a)(x−a)　穴埋め', desc: '8問' },
      { id: 'mix:c', group: 'Lv.2 ミックス', name: '完全ランダム　4択', desc: '3種類まぜて10問' },
      { id: 'mix:b', group: 'Lv.2 ミックス', name: '完全ランダム　穴埋め', desc: '3種類まぜて8問' },
      { id: 'mix:i', group: 'Lv.2 ミックス', name: '完全ランダム　記述', desc: '全部自分で書く8問' },
      { id: 'cross:c', group: 'Lv.3 係数あり', name: '係数あり　4択', desc: '(2x+3)(x−1) 型　8問' },
      { id: 'cross:i', group: 'Lv.3 係数あり', name: '係数あり　記述', desc: '(2x+3)(x−1) 型　6問' }
    ],
    build: function (id) {
      var parts = id.split(':');
      var kinds = parts[0] === 'mix' ? ['ab', 'sq', 'df'] : [parts[0]];
      if (parts[1] === 'c') return build(kinds, choiceQuestion, parts[0] === 'cross' ? 8 : 10);
      if (parts[1] === 'b') return build(kinds, blankQuestion, 8);
      return build(kinds, inputQuestion, parts[0] === 'cross' ? 6 : 8);
    }
  });
})();
</script>
</body>
</html>
