    <div class="container">
        <div class="header">

        <!-- 【ブラッシュアップ】レベルを 3 → 5 にした。画面はレベルごとに同じ形なので、1 つの入れ物を使い回す -->
        <div class="level-selector">
            <button class="level-btn active" onclick="selectLevel(1)">Lv1 基本（xⁿ・定数）</button>
            <button class="level-btn" onclick="selectLevel(2)">Lv2 係数（＋・−）</button>
            <button class="level-btn" onclick="selectLevel(3)">Lv3 分数の係数</button>
            <button class="level-btn" onclick="selectLevel(4)">Lv4 多項式</button>
            <button class="level-btn" onclick="selectLevel(5)">Lv5 展開・f'(a)</button>
        </div>

        <div id="quiz" class="quiz-container active">
            <div class="progress">
                <div class="progress-bar" id="progress" style="width: 0%"></div>
            </div>

            <div class="question-card">
                <div class="question">問題 <span id="questionNum">1</span>/<span id="questionTotal">6</span></div>
                <div style="text-align: center; margin: 12px 0 20px;">
                    <div class="math" id="problem"></div>

                    <span class="stat-label">ヒントなしで一発正解</span>
                </div>

                    <span class="stat-number" id="rate">0%</span>

    <script>
        // 【ブラッシュアップ】問題データ
        //   元は 3 レベル（xⁿ・正の係数・分数の係数）の単項式だけで、定数・負の係数・多項式・展開・f'(a) がなかった。
        //   5 レベルにし、先生の問題を中心に残して足した。式は [係数, 次数] の並びで書き、
        //   正解（f'(x) や f'(a)）はページの中で計算する（手で書いた答えのまちがいが入らないように）。
        //   係数は 3 のような数か、[分子, 分母]。wrong はまちがいの選択肢（式か数）。
        //   show は問題の式をそのまま見せたいとき（展開する前のかっこの形など）
        const LEVELS = [
            { name: 'レベル1', kind: 'basic', problems: [
                { f: [[1, 1]], wrong: [[[1, 1]], [[0, 0]], [[1, 2]]] },
                { f: [[1, 2]], wrong: [[[1, 1]], [[1, 2]], [[2, 2]]] },
                { f: [[1, 3]], wrong: [[[1, 2]], [[3, 3]], [[1, 3]]] },
                { f: [[1, 4]], wrong: [[[1, 3]], [[4, 4]], [[3, 4]]] },
                { f: [[1, 5]], wrong: [[[1, 4]], [[5, 5]], [[4, 5]]] },
                { f: [[7, 0]], wrong: [[[7, 0]], [[1, 0]], [[7, 1]]] }
            ] },
            { name: 'レベル2', kind: 'coef', problems: [
                { f: [[2, 1]], wrong: [[[2, 1]], [[0, 0]], [[1, 0]]] },
                { f: [[3, 2]], wrong: [[[3, 2]], [[3, 1]], [[6, 0]]] },
                { f: [[4, 3]], wrong: [[[4, 3]], [[12, 1]], [[4, 2]]] },
                { f: [[5, 4]], wrong: [[[5, 4]], [[20, 1]], [[5, 3]]] },
                { f: [[2, 5]], wrong: [[[2, 5]], [[10, 1]], [[2, 4]]] },
                { f: [[-1, 2]], wrong: [[[2, 1]], [[-1, 1]], [[-2, 2]]] },
                { f: [[-3, 2]], wrong: [[[6, 1]], [[-3, 1]], [[-6, 2]]] },
                { f: [[-2, 3]], wrong: [[[6, 2]], [[-2, 2]], [[-6, 3]]] }
            ] },
            { name: 'レベル3', kind: 'frac', problems: [
                { f: [[[1, 2], 2]], wrong: [[[[1, 2], 1]], [[[1, 2], 2]], [[2, 1]]] },
                { f: [[[1, 3], 3]], wrong: [[[[1, 3], 2]], [[[1, 3], 3]], [[3, 2]]] },
                { f: [[[2, 3], 3]], wrong: [[[[2, 3], 2]], [[6, 2]], [[2, 1]]] },
                { f: [[[1, 4], 4]], wrong: [[[[1, 4], 3]], [[4, 3]], [[1, 4]]] },
                { f: [[[3, 2], 2]], wrong: [[[[3, 2], 1]], [[6, 1]], [[3, 2]]] },
                { f: [[[1, 6], 3]], wrong: [[[3, 2]], [[[1, 6], 2]], [[[1, 2], 3]]] },
                { f: [[[2, 9], 3]], wrong: [[[[2, 3], 3]], [[6, 2]], [[[2, 9], 2]]] },
                { f: [[[1, 4], 2]], wrong: [[[[1, 4], 1]], [[2, 1]], [[[1, 2], 2]]] }
            ] },
            { name: 'レベル4', kind: 'poly', problems: [
                { f: [[1, 2], [3, 1]], wrong: [[[2, 1]], [[1, 1], [3, 0]], [[2, 1], [1, 0]]] },
                { f: [[1, 3], [-2, 2]], wrong: [[[3, 2], [-2, 1]], [[3, 2], [4, 1]], [[1, 2], [-4, 1]]] },
                { f: [[2, 3], [-4, 1], [1, 0]], wrong: [[[6, 2], [-3, 0]], [[6, 2], [-4, 1]], [[2, 2], [-4, 0]]] },
                { f: [[1, 2], [-5, 1], [7, 0]], wrong: [[[2, 1], [2, 0]], [[2, 1], [5, 0]], [[1, 1], [-5, 0]]] },
                { f: [[-1, 3], [3, 2], [-1, 1]], wrong: [[[3, 2], [6, 1], [-1, 0]], [[-3, 2], [6, 1]], [[-3, 2], [3, 1], [-1, 0]]] },
                { f: [[3, 2], [2, 0]], wrong: [[[6, 1], [2, 0]], [[3, 1]], [[6, 2]]] },
                { f: [[4, 1], [-3, 0]], wrong: [[[4, 1]], [[-3, 0]], [[1, 0]]] },
                { f: [[1, 4], [-1, 2]], wrong: [[[4, 3], [-1, 1]], [[4, 3], [2, 1]], [[1, 3], [-1, 1]]] }
            ] },
            { name: 'レベル5', kind: 'expand', problems: [
                { show: '(x + 1)²', f: [[1, 2], [2, 1], [1, 0]], wrong: [[[2, 1], [1, 0]], [[2, 1]], [[1, 2], [2, 1]]] },
                { show: 'x(x − 3)', f: [[1, 2], [-3, 1]], wrong: [[[2, 1], [3, 0]], [[1, 1], [-3, 0]], [[2, 1], [-6, 0]]] },
                { show: '(2x − 1)(x + 3)', f: [[2, 2], [5, 1], [-3, 0]], wrong: [[[2, 0]], [[4, 1], [-3, 0]], [[2, 1], [5, 0]]] },
                { show: '(x − 2)²', f: [[1, 2], [-4, 1], [4, 0]], wrong: [[[2, 1], [4, 0]], [[2, 1]], [[2, 1], [-2, 0]]] },
                { show: '(x + 1)(x − 1)', f: [[1, 2], [-1, 0]], wrong: [[[2, 1], [-1, 0]], [[1, 0]], [[1, 1]]] },
                { f: [[1, 3], [-2, 1]], at: 2, wrong: [4, 12, 6] },
                { f: [[1, 2], [4, 1]], at: -1, wrong: [-3, 6, -2] },
                { f: [[2, 3], [-1, 2]], at: 1, wrong: [1, 8, 5] }
            ] }
        ];

        // ---- 分数と式の道具 ----
        const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
        const R = (v) => { let [p, q] = Array.isArray(v) ? v : [v, 1]; if (q < 0) { p = -p; q = -q; } const g = gcd(p, q) || 1; return [p / g, q / g]; };
        const rmul = (a, b) => R([a[0] * b[0], a[1] * b[1]]);
        const radd = (a, b) => R([a[0] * b[1] + b[0] * a[1], a[1] * b[1]]);
        const MINUS = '−';
        const SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
        const sup = (n) => String(n).split('').map(d => SUP[d]).join('');
        const frac = (p, q) => `<span class="fraction"><span class="numerator">${p}</span><span class="denominator">${q}</span></span>`;
        const absR = (r) => (r[1] === 1 ? String(Math.abs(r[0])) : frac(Math.abs(r[0]), r[1]));
        const numTxt = (r) => (r[0] < 0 ? MINUS : '') + absR(r);
        const xpow = (n) => (n === 0 ? '' : n === 1 ? 'x' : 'x' + sup(n));
        // 式を整える：同じ次数をまとめ、0 の項を消し、次数の高い順に
        function norm(terms) {
            const m = {};
            terms.forEach(([c, n]) => { m[n] = radd(m[n] || [0, 1], R(c)); });
            return Object.keys(m).map(Number).filter(n => m[n][0] !== 0).sort((a, b) => b - a).map(n => [m[n], n]);
        }
        function termTxt(c, n, first) {   // c は分数 [p, q]
            const sign = c[0] < 0 ? (first ? MINUS : ` ${MINUS} `) : (first ? '' : ' + ');
            const body = (n > 0 && c[0] !== 0 && Math.abs(c[0]) === 1 && c[1] === 1) ? xpow(n) : absR(c) + xpow(n);
            return sign + body;
        }
        function polyTxt(terms) {
            const t = norm(terms);
            return t.length ? t.map(([c, n], i) => termTxt(c, n, i === 0)).join('') : '0';
        }
        const deriv = (terms) => norm(terms).filter(([, n]) => n > 0).map(([c, n]) => [rmul(c, [n, 1]), n - 1]);
        const key = (terms) => JSON.stringify(norm(terms));
        const valueAt = (terms, a) => norm(terms).reduce((s, [c, n]) => radd(s, rmul(c, [Math.pow(a, n), 1])), [0, 1]);

        // 途中式（1 項ずつの微分）
        function termDeriv(c, n) {   // (kxⁿ)' = k·n xⁿ⁻¹
            if (n === 0) return '0';
            if (n === 1) return numTxt(c);   // (kx)' = k
            const k = (Math.abs(c[0]) === 1 && c[1] === 1) ? (c[0] < 0 ? MINUS : '') : numTxt(c) + '·';
            return `${k}${n}${xpow(n - 1)}`;
        }
        function midOf(q) {
            const t = norm(q.f), d = deriv(q.f);
            let s = '';
            if (q.show) s += `展開すると f(x) = ${polyTxt(q.f)}。`;
            if (t.length === 1) {
                const [c, n] = t[0];
                s += `f'(x) = (${termTxt(c, n, true)})' = ${termDeriv(c, n)}`;
            } else {
                s += `f'(x) = ` + t.map(([c, n], i) => (i === 0 ? (c[0] < 0 ? MINUS : '') : (c[0] < 0 ? ` ${MINUS} ` : ' + ')) + `(${termTxt([Math.abs(c[0]), c[1]], n, true)})'`).join('') +
                    ' = ' + (t.filter(([, n]) => n > 0).map(([c, n], i) => (i === 0 ? '' : (c[0] < 0 ? ` ${MINUS} ` : ' + ')) + termDeriv([i === 0 ? c[0] : Math.abs(c[0]), c[1]], n)).join('') || '0');
            }
            if (q.at !== undefined) {
                const a = q.at, A = a < 0 ? `(${MINUS}${-a})` : String(a);
                if (!s.endsWith(polyTxt(d))) s += ` = ${polyTxt(d)}`;
                s += ` なので、f'(${numTxt([a, 1])}) = ` +
                    d.map(([c, n], i) => {
                        const sign = c[0] < 0 ? (i === 0 ? MINUS : ` ${MINUS} `) : (i === 0 ? '' : ' + ');
                        const k = absR(c);
                        return sign + (n === 0 ? k : `${k}·${A}${n > 1 ? sup(n) : ''}`);
                    }).join('');
            }
            return s;
        }
        const PLAN = {
            basic: "(xⁿ)' = n xⁿ⁻¹（指数を前にかけて、指数を 1 つへらす）。x は x¹ と考えよう。数だけ（定数）を微分すると 0。",
            coef: "(k xⁿ)' = k · n xⁿ⁻¹。係数 k（マイナスも）はそのまま残して、指数 n をかけよう。",
            frac: "係数が分数でも同じ。(k xⁿ)' = k · n xⁿ⁻¹。かけたあと、約分しよう。",
            poly: '1 つの項ずつ微分して、たし算・ひき算でつなぐ。定数の項は微分すると 0 になるよ。',
            expand: 'かっこのままでは微分できない。まず展開して、1 つの項ずつ微分しよう。',
            at: "まず f'(x) を求めてから、x の値を代入しよう。f(a) ではなく f'(a) だよ。"
        };

        // 問題を 1 問ぶん組み立てる：問題の式・聞き方・選択肢（正解は計算で作る）・ヒント
        function build(level, q) {
            const d = deriv(q.f);
            const fTxt = q.show || polyTxt(q.f);
            let answer, opts;
            if (q.at !== undefined) {
                const v = valueAt(d, q.at);
                answer = numTxt(v);
                opts = [{ text: answer, ok: true }].concat(q.wrong.map(w => ({ text: numTxt(R(w)), ok: R(w)[0] === v[0] && R(w)[1] === v[1] })));
            } else {
                answer = polyTxt(d);
                opts = [{ text: answer, ok: true }].concat(q.wrong.map(w => ({ text: polyTxt(w), ok: key(w) === key(d) })));
            }
            const ask = q.at !== undefined ? `のとき、f'(${numTxt([q.at, 1])}) = ？` : "のとき、f'(x) = ？";
            const plan = q.at !== undefined ? PLAN.at : PLAN[LEVELS[level - 1].kind];
            return { fTxt, ask, answer, opts, plan, mid: midOf(q), at: q.at };
        }

        let currentLevel = 1;
        let currentQuestion = 0;
        let correctAnswers = 0;
        let order = [];       // 問題の順番（レベルの中でまぜる）
        let optOrder = [];    // 選択肢の並び
        let stage = 0;        // ヒントの段階（0：なし 1：方針 2：途中式 3：答え）
        let answered = false;
        let built = null;
        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        const total = () => LEVELS[currentLevel - 1].problems.length;

        function selectLevel(level) {
            currentLevel = level;
            currentQuestion = 0;
            correctAnswers = 0;
            order = shuffle(LEVELS[level - 1].problems.map((_, i) => i));
            document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i === level - 1));
            document.getElementById('quiz').classList.add('active');
            document.getElementById('completion').style.display = 'none';
            window.scrollTo(0, 0);
            loadQuestion();
        }

        function loadQuestion() {
            built = build(currentLevel, LEVELS[currentLevel - 1].problems[order[currentQuestion]]);
            stage = 0;
            answered = false;
            document.getElementById('problem').innerHTML = 'f(x) = ' + built.fTxt;
            document.getElementById('ask').innerHTML = built.ask;
            document.getElementById('questionNum').textContent = currentQuestion + 1;
            document.getElementById('questionTotal').textContent = total();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next').style.display = 'none';
            document.getElementById('hints').innerHTML = '';
            const hintBtn = document.getElementById('hintBtn');
            hintBtn.style.display = '';
            hintBtn.textContent = '💡 ヒント（方針）を見る';

            const box = document.getElementById('choices');
            box.innerHTML = '';
            optOrder = shuffle(built.opts.map((_, i) => i));
            optOrder.forEach((o, i) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.innerHTML = built.opts[o].text;
                button.onclick = () => selectChoice(i, button);
                box.appendChild(button);
            });
            document.getElementById('progress').style.width = (currentQuestion / total() * 100) + '%';
        }

        function renderHints() {
            let html = '';
            if (stage >= 1) html += `<div class="hint-box"><span class="hint-tag">💡 方針</span>${built.plan}</div>`;
            if (stage >= 2) html += `<div class="hint-box"><span class="hint-tag">✏️ 途中式</span>${built.mid}</div>`;
            document.getElementById('hints').innerHTML = html;
            document.getElementById('hintBtn').textContent = stage === 0 ? '💡 ヒント（方針）を見る' : stage === 1 ? '✏️ 途中式を見る' : '👀 答えを見る';
        }
        function showNextHint() {
            if (answered) return;
            stage++;
            if (stage >= 3) { finish(false); return; }
            renderHints();
        }

        function selectChoice(i, button) {
            if (answered) return;
            if (built.opts[optOrder[i]].ok) { finish(true); return; }
            button.classList.add('incorrect');
            button.disabled = true;
            stage++;
            if (stage >= 3) { finish(false); return; }
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = 'feedback incorrect';
            feedback.textContent = `❌ ちがうよ。下の${stage === 1 ? '方針' : '途中式'}を見て、もう一度選ぼう。`;
            renderHints();
        }

        // 正解したとき・答えを見たとき：答えと解説を出して、次へ
        function finish(correct) {
            answered = true;
            if (correct && stage === 0) correctAnswers++;
            document.querySelectorAll('#choices .choice-btn').forEach((b, i) => {
                b.disabled = true;
                if (built.opts[optOrder[i]].ok) b.classList.add('correct');
            });
            document.getElementById('hints').innerHTML = '';
            document.getElementById('hintBtn').style.display = 'none';
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = 'feedback ' + (correct ? 'correct' : 'answer');
            feedback.innerHTML = (correct ? '⭕ 正解！' : '👀 答え：' + (built.at !== undefined ? `f'(${numTxt([built.at, 1])}) = ` : "f'(x) = ") + built.answer) +
                `<div class="rule-hint">${built.mid}${built.mid.endsWith(built.answer) ? '' : ' = ' + built.answer}</div>`;
            const last = currentQuestion >= total() - 1;
            const next = document.getElementById('next');
            next.textContent = last ? '結果を見る' : '次の問題';
            next.style.display = 'inline-block';
        }

        function nextQuestion() {
            if (!answered) return;
            if (currentQuestion >= total() - 1) { showCompletion(); return; }
            currentQuestion++;
            loadQuestion();
        }

        function showCompletion() {
            document.getElementById('quiz').classList.remove('active');
            const box = document.getElementById('completion');
            box.style.display = 'block';
            const t = total();
            document.getElementById('score').textContent = `${correctAnswers} / ${t}`;
            document.getElementById('rate').textContent = Math.round(correctAnswers / t * 100) + '%';
            const perfect = correctAnswers === t;
            box.querySelector('h2').textContent = perfect ? '🎉 全問一発正解！' : `👍 レベル${currentLevel} クリア！`;
            box.querySelector('p').textContent = perfect ? 'すばらしい！次のレベルに進もう。' : 'まちがえた問題は、解説の途中式をもう一度たどってみよう。';
            const L = currentLevel;
            document.getElementById('resultNav').innerHTML =
                (L < LEVELS.length ? `<button class="next" onclick="selectLevel(${L + 1})">レベル${L + 1}に挑戦 ▶</button>` : '') +
                `<button class="again" onclick="selectLevel(${L})">レベル${L}をもう一度</button>` +
                (L === LEVELS.length ? '<button class="plain" onclick="selectLevel(1)">レベル1からやり直す</button>' : '') +
                '<a href="../remake.html">ほかの教材をえらぶ</a>';
            window.scrollTo(0, 0);
        }

        // 初期化
        selectLevel(1);
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".header h1": "u-title",
    ".level-btn:not(.active)": "u-btn u-btn-plain",
    ".level-btn.active": "u-btn",
    ".progress": "u-progress",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.incorrect": "u-ng",
    ".btn-group .btn": "u-btn u-btn-blue",
    ".result-nav .next": "u-btn u-btn-blue",
    ".result-nav .again": "u-btn",
    ".result-nav .plain": "u-btn u-btn-plain"
  });
</script>
</body>
</html>
