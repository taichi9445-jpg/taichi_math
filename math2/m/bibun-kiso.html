<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <!--
    数学Ⅱ 04. 微分の練習 基礎（微分クイズ）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../../assets/port.css">
  <script src="../../assets/port.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微分クイズ</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .level-selector {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .level-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #e2e8f0;
            color: #4a5568;
        }

        .level-btn.active {
            background: #4299e1;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 153, 225, 0.3);
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .progress {
            background: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #48bb78, #38a169);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .question-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border-left: 5px solid #4299e1;
        }

        .question {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #2d3748;
        }

        .math {
            font-family: 'Times New Roman', serif;
            font-size: 1.8rem;
            color: #4a5568;
            background: #fefcbf;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .choice-btn {
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            font-size: 1.3rem;
            font-family: 'Times New Roman', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #4a5568;
            font-weight: bold;
        }

        .choice-btn:hover {
            border-color: #4299e1;
            background: #f7fafc;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 153, 225, 0.2);
        }

        .choice-btn.correct {
            background: #c6f6d5;
            border-color: #48bb78;
            color: #22543d;
        }

        .choice-btn.incorrect {
            background: #fed7d7;
            border-color: #e53e3e;
            color: #742a2a;
        }

        .choice-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4299e1;
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
            transform: translateY(-2px);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #48bb78;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #e53e3e;
        }

        .completion {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border-radius: 15px;
            margin-top: 20px;
        }

        .completion h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .completion p {
            font-size: 1.3rem;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            margin: 0 5px;
        }

        .fraction .numerator {
            display: block;
            border-bottom: 2px solid #4a5568;
            padding-bottom: 2px;
            font-size: 0.9em;
        }

        .fraction .denominator {
            display: block;
            padding-top: 2px;
            font-size: 0.9em;
        }
    </style>

  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    body { padding: 12px; }
    .container { padding: 28px 24px; }
    .header h1 { font-size: min(2.4rem, 8vw); white-space: nowrap; margin: 0 0 6px; }
    .header p { color: var(--u-sub); font-weight: 700; }
    .level-selector { flex-wrap: wrap; gap: 8px; }
    .level-btn { padding: 10px 16px; font-size: 1rem; }
    .question-card { background: #f8fafc; border: 3px solid var(--u-line); border-left-width: 3px; border-radius: 24px; }
    .question { color: var(--u-sub); font-weight: 800; font-size: 1.2rem; }
    .math { background: var(--u-soft-yellow); border: 4px dashed #fde68a; border-radius: 18px; color: var(--u-ink); font-weight: 700; }
    .question-card span[style] { color: var(--u-ink); font-weight: 700; }
    .choice-btn { font-size: 1.4rem; }
    .fraction .numerator { border-bottom-color: currentColor; }
    .feedback { border-radius: 16px; }
    .feedback.correct { background: var(--u-ok-soft); color: var(--u-ok); border: 3px solid var(--u-ok-line); }
    .feedback.incorrect { background: var(--u-ng-soft); color: var(--u-ng); border: 3px solid var(--u-ng-line); }
    .rule-hint { margin-top: 10px; background: #fff; color: var(--u-title); border: 2px solid var(--u-soft-blue-line); border-radius: 12px; padding: 8px 12px; font-size: 0.95rem; line-height: 1.7; }
    .completion { background: #fff; color: var(--u-ink); border: 4px dashed var(--u-line); border-radius: 24px; padding: 28px 18px; }
    .completion h2 { color: var(--u-accent-text); font-size: min(2.2rem, 8vw); white-space: nowrap; margin: 0 0 10px; }
    .completion p { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
    .stats { background: var(--u-soft-yellow); border-radius: 16px; }
    .stat-number { color: var(--u-title); }
    .stat-label { color: var(--u-sub); font-weight: 700; opacity: 1; }
    .result-nav { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto; }
    .result-nav button { padding: 12px; }
    .result-nav a { color: var(--u-sub); font-weight: 700; }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 16px 12px; }
      .question-card { padding: 16px 10px; }
      .choices { gap: 8px; }
      .choice-btn { padding: 14px 6px; }
      .level-btn { flex: 1 1 40%; }
    }
  
  </style>
</head>
<body class="u-theme">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container">
        <div class="header">
            <h1>🧮 微分クイズ</h1>
            <p>微分の基本をマスターしよう！</p>
        </div>

        <div class="level-selector">
            <button class="level-btn active" onclick="selectLevel(1)">
                レベル1: 基本の指数
            </button>
            <button class="level-btn" onclick="selectLevel(2)">
                レベル2: 係数付き
            </button>
            <button class="level-btn" onclick="selectLevel(3)">
                レベル3: 分数係数
            </button>
        </div>

        <div id="level1" class="quiz-container active">
            <div class="progress">
                <div class="progress-bar" id="progress1" style="width: 0%"></div>
            </div>

            <div class="question-card">
                <div class="question">問題 <span id="questionNum1">1</span>/5</div>
                <div style="text-align: center; margin: 20px 0;">
                    <div class="math" id="problem1"></div>
                    <span style="font-size: 1.3rem;">の微分は？</span>
                </div>
                <div class="choices" id="choices1"></div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="nextQuestion(1)" style="display: none;" id="next1">次の問題</button>
                    <button class="btn btn-secondary" onclick="retryQuestion(1)" style="display: none;" id="retry1">もう一度</button>
                </div>
                <div class="feedback" id="feedback1" style="display: none;"></div>
            </div>
        </div>

        <div id="level2" class="quiz-container">
            <div class="progress">
                <div class="progress-bar" id="progress2" style="width: 0%"></div>
            </div>

            <div class="question-card">
                <div class="question">問題 <span id="questionNum2">1</span>/10</div>
                <div style="text-align: center; margin: 20px 0;">
                    <div class="math" id="problem2"></div>
                    <span style="font-size: 1.3rem;">の微分は？</span>
                </div>
                <div class="choices" id="choices2"></div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="nextQuestion(2)" style="display: none;" id="next2">次の問題</button>
                    <button class="btn btn-secondary" onclick="retryQuestion(2)" style="display: none;" id="retry2">もう一度</button>
                </div>
                <div class="feedback" id="feedback2" style="display: none;"></div>
            </div>
        </div>

        <div id="completion1" class="completion" style="display: none;">
            <h2>🎉 素晴らしい！</h2>
            <p>レベル1を完璧にクリアしました！</p>
            <div class="stats">
                <div class="stat">
                    <span class="stat-number" id="score1">10</span>
                    <span class="stat-label">正解数</span>
                </div>
                <div class="stat">
                    <span class="stat-number">100%</span>
                    <span class="stat-label">正解率</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="selectLevel(2)">レベル2に挑戦！</button>
            <button class="btn btn-secondary" onclick="restartLevel(1)">もう一度挑戦</button>
        </div>

        <div id="level3" class="quiz-container">
            <div class="progress">
                <div class="progress-bar" id="progress3" style="width: 0%"></div>
            </div>

            <div class="question-card">
                <div class="question">問題 <span id="questionNum3">1</span>/10</div>
                <div style="text-align: center; margin: 20px 0;">
                    <div class="math" id="problem3"></div>
                    <span style="font-size: 1.3rem;">の微分は？</span>
                </div>
                <div class="choices" id="choices3"></div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="nextQuestion(3)" style="display: none;" id="next3">次の問題</button>
                    <button class="btn btn-secondary" onclick="retryQuestion(3)" style="display: none;" id="retry3">もう一度</button>
                </div>
                <div class="feedback" id="feedback3" style="display: none;"></div>
            </div>
        </div>

        <div id="completion2" class="completion" style="display: none;">
            <h2>🏆 完璧です！</h2>
            <p>レベル2も見事にクリア！微分マスターですね！</p>
            <div class="stats">
                <div class="stat">
                    <span class="stat-number" id="score2">10</span>
                    <span class="stat-label">正解数</span>
                </div>
                <div class="stat">
                    <span class="stat-number">100%</span>
                    <span class="stat-label">正解率</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="selectLevel(3)">レベル3に挑戦！</button>
            <button class="btn btn-secondary" onclick="restartLevel(2)">レベル2をもう一度</button>
        </div>

        <div id="completion3" class="completion" style="display: none;">
            <h2>🌟 最高です！</h2>
            <p>レベル3も完璧！分数の微分もマスターしましたね！</p>
            <div class="stats">
                <div class="stat">
                    <span class="stat-number" id="score3">10</span>
                    <span class="stat-label">正解数</span>
                </div>
                <div class="stat">
                    <span class="stat-number">100%</span>
                    <span class="stat-label">正解率</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="restartLevel(1)">レベル1からやり直し</button>
            <button class="btn btn-secondary" onclick="restartLevel(3)">レベル3をもう一度</button>
        </div>
    </div>

    <script>
        // 問題データ
        const level1Problems = [
            { problem: "x", answer: "1", choices: ["1", "x", "0", "x²"] },
            { problem: "x²", answer: "2x", choices: ["2x", "x", "x²", "2x²"] },
            { problem: "x³", answer: "3x²", choices: ["3x²", "x²", "3x³", "x³"] },
            { problem: "x⁴", answer: "4x³", choices: ["4x³", "x³", "4x⁴", "3x⁴"] },
            { problem: "x⁵", answer: "5x⁴", choices: ["5x⁴", "x⁴", "5x⁵", "4x⁵"] }
        ];

        const level2Problems = [
            { problem: "2x", answer: "2", choices: ["2", "2x", "0", "1"] },
            { problem: "3x²", answer: "6x", choices: ["6x", "3x²", "3x", "6"] },
            { problem: "4x³", answer: "12x²", choices: ["12x²", "4x³", "12x", "4x²"] },
            { problem: "5x⁴", answer: "20x³", choices: ["20x³", "5x⁴", "20x", "5x³"] },
            { problem: "2x⁵", answer: "10x⁴", choices: ["10x⁴", "2x⁵", "10x", "2x⁴"] },
            { problem: "6x²", answer: "12x", choices: ["12x", "6x²", "6x", "12"] },
            { problem: "8x³", answer: "24x²", choices: ["24x²", "8x³", "24x", "8x²"] },
            { problem: "3x⁶", answer: "18x⁵", choices: ["18x⁵", "3x⁶", "18x", "3x⁵"] },
            { problem: "7x⁴", answer: "28x³", choices: ["28x³", "7x⁴", "28x", "7x³"] },
            { problem: "9x⁵", answer: "45x⁴", choices: ["45x⁴", "9x⁵", "45x", "9x⁴"] }
        ];

        const level3Problems = [
            {
                problem: '<span class="fraction"><span class="numerator">1</span><span class="denominator">2</span></span>x²',
                answer: 'x',
                choices: ['x', '<span class="fraction"><span class="numerator">1</span><span class="denominator">2</span></span>x', '<span class="fraction"><span class="numerator">x²</span><span class="denominator">2</span></span>', '2x']
            },
            {
                problem: '<span class="fraction"><span class="numerator">1</span><span class="denominator">3</span></span>x³',
                answer: 'x²',
                choices: ['x²', '<span class="fraction"><span class="numerator">1</span><span class="denominator">3</span></span>x²', '<span class="fraction"><span class="numerator">x³</span><span class="denominator">3</span></span>', '3x²']
            },
            {
                problem: '<span class="fraction"><span class="numerator">2</span><span class="denominator">3</span></span>x³',
                answer: '2x²',
                choices: ['2x²', '<span class="fraction"><span class="numerator">2</span><span class="denominator">3</span></span>x²', '<span class="fraction"><span class="numerator">2x³</span><span class="denominator">3</span></span>', '6x²']
            },
            {
                problem: '<span class="fraction"><span class="numerator">1</span><span class="denominator">4</span></span>x⁴',
                answer: 'x³',
                choices: ['x³', '<span class="fraction"><span class="numerator">1</span><span class="denominator">4</span></span>x³', '<span class="fraction"><span class="numerator">x⁴</span><span class="denominator">4</span></span>', '4x³']
            },
            {
                problem: '<span class="fraction"><span class="numerator">3</span><span class="denominator">4</span></span>x⁴',
                answer: '3x³',
                choices: ['3x³', '<span class="fraction"><span class="numerator">3</span><span class="denominator">4</span></span>x³', '<span class="fraction"><span class="numerator">3x⁴</span><span class="denominator">4</span></span>', '12x³']
            },
            {
                problem: '<span class="fraction"><span class="numerator">1</span><span class="denominator">5</span></span>x⁵',
                answer: 'x⁴',
                choices: ['x⁴', '<span class="fraction"><span class="numerator">1</span><span class="denominator">5</span></span>x⁴', '<span class="fraction"><span class="numerator">x⁵</span><span class="denominator">5</span></span>', '5x⁴']
            },
            {
                problem: '<span class="fraction"><span class="numerator">2</span><span class="denominator">5</span></span>x⁵',
                answer: '2x⁴',
                choices: ['2x⁴', '<span class="fraction"><span class="numerator">2</span><span class="denominator">5</span></span>x⁴', '<span class="fraction"><span class="numerator">2x⁵</span><span class="denominator">5</span></span>', '10x⁴']
            },
            {
                problem: '<span class="fraction"><span class="numerator">3</span><span class="denominator">2</span></span>x²',
                answer: '3x',
                choices: ['3x', '<span class="fraction"><span class="numerator">3</span><span class="denominator">2</span></span>x', '<span class="fraction"><span class="numerator">3x²</span><span class="denominator">2</span></span>', '6x']
            },
            {
                problem: '<span class="fraction"><span class="numerator">5</span><span class="denominator">2</span></span>x²',
                answer: '5x',
                choices: ['5x', '<span class="fraction"><span class="numerator">5</span><span class="denominator">2</span></span>x', '<span class="fraction"><span class="numerator">5x²</span><span class="denominator">2</span></span>', '10x']
            },
            {
                problem: '<span class="fraction"><span class="numerator">7</span><span class="denominator">3</span></span>x³',
                answer: '7x²',
                choices: ['7x²', '<span class="fraction"><span class="numerator">7</span><span class="denominator">3</span></span>x²', '<span class="fraction"><span class="numerator">7x³</span><span class="denominator">3</span></span>', '21x²']
            }
        ];

        let currentLevel = 1;
        let currentQuestion = 0;
        let correctAnswers = 0;
        let missedThis = false;   // 【ブラッシュアップ】この問題でまちがえたか（一発正解だけを数える）
        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

        function selectLevel(level) {
            currentLevel = level;
            currentQuestion = 0;
            correctAnswers = 0;

            // レベルボタンの更新
            document.querySelectorAll('.level-btn').forEach((btn, i) => btn.classList.toggle('active', i === level - 1));   // 【ブラッシュアップ】
            window.scrollTo(0, 0);

            // コンテナの表示切り替え
            document.querySelectorAll('.quiz-container').forEach(container => container.classList.remove('active'));
            document.getElementById(`level${level}`).classList.add('active');

            // 完了画面を隠す
            document.getElementById(`completion1`).style.display = 'none';
            document.getElementById(`completion2`).style.display = 'none';
            document.getElementById(`completion3`).style.display = 'none';

            loadQuestion(level);
        }

        function loadQuestion(level) {
            const problems = level === 1 ? level1Problems : (level === 2 ? level2Problems : level3Problems);
            const problem = problems[currentQuestion];
            missedThis = false;   // 【ブラッシュアップ】

            // 問題の表示（HTMLを含む場合はinnerHTMLを使用）
            const problemElement = document.getElementById(`problem${level}`);
            if (problem.problem.includes('<span')) {
                problemElement.innerHTML = problem.problem;
            } else {
                problemElement.textContent = problem.problem;
            }

            document.getElementById(`questionNum${level}`).textContent = currentQuestion + 1;
            document.getElementById(`feedback${level}`).style.display = 'none';
            document.getElementById(`next${level}`).style.display = 'none';
            document.getElementById(`retry${level}`).style.display = 'none';

            // 選択肢の表示
            const choicesContainer = document.getElementById(`choices${level}`);
            choicesContainer.innerHTML = '';

            shuffle([...problem.choices]).forEach((choice, index) => {   // 【ブラッシュアップ】並びをまぜる
                const button = document.createElement('button');
                button.className = 'choice-btn';

                // 選択肢にHTMLが含まれる場合はinnerHTMLを使用
                if (choice.includes('<span')) {
                    button.innerHTML = choice;
                } else {
                    button.textContent = choice;
                }

                button.onclick = () => selectChoice(level, choice, button);
                choicesContainer.appendChild(button);
            });

            // プログレスバーの更新
            const totalQuestions = level === 1 ? 5 : 10;
            const progress = (currentQuestion / totalQuestions) * 100;
            document.getElementById(`progress${level}`).style.width = progress + '%';
        }



        function selectChoice(level, selectedAnswer, buttonElement) {
            const problems = level === 1 ? level1Problems : (level === 2 ? level2Problems : level3Problems);
            const correctAnswer = problems[currentQuestion].answer;

            // すべての選択肢ボタンを無効化
            const allButtons = document.querySelectorAll(`#choices${level} .choice-btn`);
            allButtons.forEach(btn => {
                btn.classList.add('disabled');
                btn.onclick = null;
            });

            const feedback = document.getElementById(`feedback${level}`);
            feedback.style.display = 'block';

            // HTMLタグを除去して比較
            const normalizeAnswer = (answer) => {
                return answer.replace(/<[^>]*>/g, '').trim();
            };

            const normalizedSelected = normalizeAnswer(selectedAnswer);
            const normalizedCorrect = normalizeAnswer(correctAnswer);

            if (normalizedSelected === normalizedCorrect) {
                buttonElement.classList.add('correct');
                feedback.className = 'feedback correct';
                feedback.textContent = '🎉 正解です！素晴らしい！';
                if (!missedThis) correctAnswers++;   // 【ブラッシュアップ】

                const totalQuestions = level === 1 ? 5 : 10;
                if (currentQuestion < totalQuestions - 1) {
                    document.getElementById(`next${level}`).style.display = 'inline-block';
                } else {
                    // 全問完了
                    setTimeout(() => showCompletion(level), 1500);
                }
            } else {
                buttonElement.classList.add('incorrect');
                feedback.className = 'feedback incorrect';

                // 正解の表示（HTMLが含まれる場合はそのまま表示）
                missedThis = true;   // 【ブラッシュアップ】
                feedback.innerHTML = '❌ 不正解です。もう一度挑戦してみましょう！' +
                    '<div class="rule-hint">💡 xⁿ を微分すると n xⁿ⁻¹（指数を前にかけて、指数を 1 つへらす）。' +
                    (level === 1 ? 'x は x¹ と考えよう。' : '係数は、前に出した指数とかけ算しよう。') +
                    (level === 3 ? '分数の係数は約分できるよ。' : '') + '</div>';
                document.getElementById(`retry${level}`).style.display = 'inline-block';
            }
        }

        function nextQuestion(level) {
            currentQuestion++;
            loadQuestion(level);
        }

        function retryQuestion(level) {
            document.getElementById(`feedback${level}`).style.display = 'none';
            document.getElementById(`retry${level}`).style.display = 'none';

            // 選択肢ボタンをリセット
            const allButtons = document.querySelectorAll(`#choices${level} .choice-btn`);
            allButtons.forEach(btn => {
                btn.classList.remove('disabled', 'correct', 'incorrect');

                // HTMLが含まれる場合とそうでない場合を区別
                const choiceValue = btn.innerHTML.includes('<span') ? btn.innerHTML : btn.textContent;
                btn.onclick = () => selectChoice(level, choiceValue, btn);
            });
        }

        function showCompletion(level) {
            document.getElementById(`level${level}`).classList.remove('active');
            document.getElementById(`completion${level}`).style.display = 'block';
            document.getElementById(`score${level}`).textContent = correctAnswers;

            // プログレスバーを100%に
            document.getElementById(`progress${level}`).style.width = '100%';

            // 正解率の計算
            const totalQuestions = level === 1 ? 5 : 10;
            const accuracy = Math.round((correctAnswers / totalQuestions) * 100);
            const accuracyElement = document.querySelector(`#completion${level} .stat:nth-child(2) .stat-number`);
            if (accuracyElement) {
                accuracyElement.textContent = accuracy + '%';
            }
            // 【ブラッシュアップ】
            const box = document.getElementById(`completion${level}`);
            const perfect = correctAnswers === totalQuestions;
            const perfectMessages = ['レベル1を完璧にクリアしました！', 'レベル2も見事にクリア！微分マスターですね！', 'レベル3も完璧！分数の微分もマスターしましたね！'];
            box.querySelector('h2').textContent = perfect ? '🎉 全問一発正解！' : '👍 レベル' + level + ' クリア！';
            box.querySelector('p').textContent = perfect ? perfectMessages[level - 1] : 'まちがえた問題は「指数を前にかけて、指数を 1 つへらす」を思い出そう！';
            box.querySelector('.stat-label').textContent = '一発正解';
            let nav = box.querySelector('.result-nav');
            if (!nav) {
                box.querySelectorAll(':scope > .btn').forEach(b => b.remove());
                nav = document.createElement('div');
                nav.className = 'result-nav';
                box.appendChild(nav);
            }
            nav.innerHTML = (level < 3 ? `<button class="next" onclick="restartLevel(${level + 1})">レベル${level + 1}に挑戦 ▶</button>` : '') +
                `<button class="again" onclick="restartLevel(${level})">レベル${level}をもう一度</button>` +
                (level === 3 ? '<button class="plain" onclick="restartLevel(1)">レベル1からやり直す</button>' : '') +
                '<a href="../remake.html">ほかの教材をえらぶ</a>';
            window.scrollTo(0, 0);
        }

        function restartLevel(level) {
            currentQuestion = 0;
            correctAnswers = 0;
            document.getElementById(`completion${level}`).style.display = 'none';
            selectLevel(level);
        }



        // 初期化
        loadQuestion(1);
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".header h1": "u-title",
    ".level-btn:not(.active)": "u-btn u-btn-plain",
    ".level-btn.active": "u-btn",
    ".progress": "u-progress",
    ".choice-btn": "u-choice",
    ".choice-btn.correct": "u-ok",
    ".choice-btn.incorrect": "u-ng",
    ".btn-group .btn": "u-btn u-btn-blue",
    ".result-nav .next": "u-btn u-btn-blue",
    ".result-nav .again": "u-btn",
    ".result-nav .plain": "u-btn u-btn-plain"
  });
</script>
</body>
</html>
