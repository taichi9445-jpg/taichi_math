<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>微分の練習 基礎</title>
    <link
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/fill-steps.css">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 10px;
        background: #f5f7fa;
        color: #1f2328;
        font:
          17px/1.7 "BIZ UDPGothic",
          sans-serif;
      }
      .port-back {
        display: block;
        max-width: 1120px;
        margin: 0 auto 8px;
        color: #5b6470;
        font-size: 14px;
        text-decoration: none;
      }
      .wrap {
        max-width: 760px;
        margin: auto;
        background: white;
        border: 1px solid #d0d7de;
        border-top: 4px solid #1f4e8c;
        border-radius: 8px;
        padding: 14px;
      }
      .head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .head small {
        font-size: 12px;
        color: #5b6470;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h2 {
        font-size: 19px;
      }
      h3 {
        font-size: 17px;
      }
      #menu > p {
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .menu-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        text-align: left;
        min-height: 135px;
        padding: 12px !important;
      }
      .menu-card svg {
        width: 70px;
        height: 42px;
      }
      .menu-card small {
        font-size: 12px;
        color: #5b6470;
        line-height: 1.7;
      }
      .menu-card b {
        word-break: keep-all;
        font-size: 16px;
      }
      .toolbar button {
        font-size: 12px;
        padding: 6px 8px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 6px 0 12px;
        font-size: 13px;
        color: #5b6470;
      }
      button {
        font:
          15px "BIZ UDPGothic",
          sans-serif;
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid #c5d3e4;
        border-bottom: 3px solid #b6bfc9;
        border-radius: 6px;
        background: white;
        color: #1f4e8c;
        cursor: pointer;
        transition: transform 0.08s;
      }
      button:not(:disabled):active {
        transform: translateY(2px);
        border-bottom-width: 1px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      .primary {
        background: #1f4e8c;
        color: white;
        border-color: #1f4e8c;
        border-bottom-color: #163a69;
      }
      .question-no {
        background: #1f4e8c;
        color: white;
        padding: 2px 8px;
      }
      .problem {
        font-size: 23px;
        margin: 16px 0 8px;
      }
      .ask {
        font-size: 17px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0;
      }
      .choice {
        position: relative;
        min-height: 76px;
        font-size: 22px;
        padding: 22px 8px 12px;
        color: #1f2328;
      }
      .choice::before {
        content: attr(data-label);
        position: absolute;
        top: 4px;
        left: 8px;
        font: 12px "BIZ UDPGothic";
        color: #5b6470;
      }
      .choice.correct {
        background: #ebfbee;
        border-color: #2b8a3e;
      }
      .choice.incorrect {
        background: #fff5f5;
        border-color: #c92a2a;
      }
      .feedback,
      .hint-box,
      .explain-box {
        padding: 12px;
        border-left: 4px solid #1f4e8c;
        background: #f1f6fc;
        margin-top: 12px;
        font-size: 16px;
      }
      .feedback.correct,
      .explain-box.ok {
        background: #ebfbee;
        border-color: #2b8a3e;
      }
      .feedback.incorrect {
        background: #fff5f5;
        border-color: #c92a2a;
      }
      .hint-tag {
        display: block;
        font-size: 13px;
        color: #1f4e8c;
        margin-bottom: 4px;
      }
      .formula {
        background: #f5f0ff;
        border-left: 3px solid #9366d5;
        padding: 8px;
        margin: 8px 0;
      }
      .formula b {
        font: 12px "BIZ UDPGothic";
        color: #6e40c9;
        margin-right: 10px;
      }
      .controls,
      .result-nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .result-nav a {
        font-size: 14px;
        color: #1f4e8c;
        padding: 10px;
      }
      .result-score {
        font-size: 24px;
        color: #1f4e8c;
      }
      .m {
        font-family: "STIX Two Text", serif;
        font-weight: 400;
        white-space: nowrap;
      }
      .m i {
        font-style: italic;
      }
      sup {
        font-size: 0.72em;
        line-height: 0;
        vertical-align: 0.55em;
      }
      .fraction {
        display: inline-flex;
        flex-direction: column;
        vertical-align: middle;
        text-align: center;
        line-height: 1.15;
        margin: 0 0.1em;
        font-family: "STIX Two Text";
        font-weight: 400;
      }
      .numerator {
        border-bottom: 1px solid;
        padding: 0 0.15em 0.1em;
      }
      .denominator {
        padding: 0.12em 0.15em 0;
      }
      .equation {
        font-size: 19px;
        margin: 8px 0;
        line-height: 1.9;
      }
      .eqpart {
        display: inline-block;
        white-space: nowrap;
      }
      .explain-title {
        margin-bottom: 8px;
        font-size: 17px;
      }
      .input-section {
        margin: 16px 0;
      }
      input {
        font: 21px "STIX Two Text";
        width: 100%;
        min-height: 48px;
        border: 1px solid #9db6d6;
        border-radius: 6px;
        padding: 8px;
      }
      .input-tools {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .input-tools button {
        min-width: 42px;
        padding: 6px;
      }
      .input-feedback {
        font-size: 15px;
        margin-top: 8px;
        color: #a61e1e;
      }
      .input-help {
        font-size: 14px;
        margin-top: 12px;
      }
      .review-item {
        border-top: 1px solid #d0d7de;
        padding: 14px 0;
      }
      .review-item svg {
        display: block;
        width: 300px;
        max-width: 100%;
        margin: 12px auto;
      }
      .review-item summary {
        cursor: pointer;
        color: #1f4e8c;
      }
      .formula .m {
        font-size: 18px;
      }
      [hidden] {
        display: none !important;
      }
      .progress-track {
        height: 3px;
        background: #e6edf5;
        margin: 10px 0;
      }
      .progress-track span {
        display: block;
        height: 3px;
        background: #1f4e8c;
      }
      .level-label {
        font-size: 14px;
        color: #8056a1;
      }
      .keyboard-note {
        font-size: 12px;
        color: #5b6470;
      }
      .math-fit {
        max-width: 100%;
      }
      @media (min-width: 900px) and (orientation: landscape) {
        .wrap {
          max-width: 1120px;
          padding: 20px;
        }
        .quiz-grid {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 370px;
          gap: 24px;
          align-items: start;
        }
        .answer-panel {
          position: sticky;
          top: 12px;
        }
        .choices {
          margin-top: 0;
        }
        .menu-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .menu-grid.modes {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .equal {
        display: inline-block;
        margin: 0 0.28em;
      }
      .menu-math {
        display: flex;
        align-items: center;
        height: 52px;
        font-size: 18px;
      }
      .menu-card svg {
        width: 80px;
        height: 52px;
      }

      .pr {
        display: inline-block;
        margin-left: 0.12em;
      }
      .wrap {
        max-width: 760px;
      }
      .question-box {
        border: 1px solid #aebed2;
        border-left: 4px solid #1f4e8c;
        background: #f8faff;
        border-radius: 6px;
        padding: 14px 12px;
        text-align: center;
      }
      .question-box .problem {
        font-size: 26px;
        margin: 4px 0 12px;
      }
      .question-box .ask-line {
        font-size: 17px;
        line-height: 1.8;
      }
      .question-box .m {
        white-space: nowrap;
      }
      .input-tools button {
        font-family: "STIX Two Text", serif;
      }
      .input-preview {
        min-height: 42px;
        font-size: 23px;
        padding: 6px;
        border-bottom: 1px solid #d0d7de;
        overflow-wrap: anywhere;
      }
      .time-value {
        font: 26px "BIZ UDPGothic";
        font-variant-numeric: tabular-nums;
        color: #1f4e8c;
      }
      .toolbar {
        align-items: center;
      }
      .result-time {
        font-size: 26px;
      }
      .answer-panel.flash-correct {
        background: #ebfbee;
      }
      .answer-panel.flash-wrong {
        background: #fff5f5;
      }
      .answer-panel {
        border-radius: 6px;
      }
      .input-section {
        margin-top: 8px;
      }
      .input-help {
        font-size: 12px;
      }
      .input-tools {
        margin: 6px 0;
      }
      .input-tools button {
        min-height: 40px;
      }
      .review-item .question-box {
        margin: 10px 0;
      }
      .review-item summary {
        line-height: 1.8;
      }
      #reviewList[hidden] {
        display: none !important;
      }
      @media (min-width: 900px) and (orientation: landscape) {
        .wrap {
          max-width: 980px;
        }
        .quiz-grid {
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 26px;
        }
        .question-box .problem {
          font-size: 32px;
        }
        .question-box {
          padding: 18px 14px;
        }
      }
      @media (max-width: 899px) {
        .input-running .question-box {
          padding: 8px;
        }
        .input-running .question-box .problem {
          margin: 0 0 4px;
        }
        .input-running .toolbar {
          margin: 3px 0 6px;
        }
        .input-running .head {
          margin-bottom: 6px;
        }
        .input-running .input-section {
          margin-top: 8px;
        }
        .input-running .input-help {
          margin-top: 4px;
        }
      }

      .fn-gap {
        display: inline-block;
        width: 0.07em;
      }
      #questionTabs {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 12px 0;
      }
      #questionTabs button {
        min-width: 34px;
        min-height: 34px;
        padding: 4px 8px;
        border: 1px solid #b7c8dc;
        border-radius: 7px;
        background: #f4f7fb;
        color: #263a54;
      }
      #questionTabs button[aria-current="step"] {
        outline: 2px solid #e67e22;
        outline-offset: 1px;
      }
      #questionTabs .answered {
        background: #d9eee3;
      }
      #questionTabs .needs-review {
        background: #ffe2dc;
      }
      #questionTabs button:disabled {
        opacity: 0.4;
      }
      .mi {
        font-family: "STIX Two Text", serif;
        font-style: italic;
        font-weight: 400;
      }
      .mi-sup {
        font-family: "STIX Two Text", serif;
        font-weight: 400;
        font-size: 0.65em;
      }
      .input-icon .caret {
        margin-left: 4px;
        font-weight: 300;
      }
      /* PC：メニューが1画面に入る大きさに */
      @media (min-width: 700px) {
        .menu-grid.modes {
          max-width: 560px !important;
        }
        #menuGrid:not(.modes) {
          grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
          max-width: 780px !important;
        }
        #menuGrid:not(.modes) .menu-card {
          grid-column: span 2 !important;
          width: 100% !important;
        }
        #menuGrid:not(.modes) .menu-card:nth-child(4) {
          grid-column: 2 / span 2 !important;
        }
      }
      #menuGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 760px;
        margin: auto;
        gap: 16px;
      }
      .menu-card {
        min-width: 0;
        width: 100%;
        aspect-ratio: 4/3;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 12px;
        gap: 10px;
        background: #eaf2fd;
      }
      .menu-card:nth-child(2) {
        background: #eaf6ee;
      }
      .menu-card:nth-child(3) {
        background: #fff1df;
      }
      .menu-card:nth-child(4) {
        background: #f1eafa;
      }
      .menu-card:nth-child(5) {
        grid-column: 1/-1;
        width: calc(50% - 8px);
        justify-self: center;
        background: #edf4f8;
      }
      .menu-card b {
        font-size: clamp(16px, 2vw, 22px);
      }
      .menu-card small {
        font-size: 12px;
      }
      .lesson-icon {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(18px, 3vw, 28px);
        color: #254f82;
        line-height: 1.1;
      }
      .lesson-icon em {
        color: #c65a2b;
        font-style: normal;
      }
      .input-icon {
        border: 2px solid;
        padding: 4px 12px;
        border-radius: 5px;
      }
      .clock-icon {
        border: 3px solid;
        border-radius: 50%;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .clock-icon:before {
        content: "";
        position: absolute;
        top: -8px;
        width: 14px;
        border-top: 4px solid;
      }
      @media (max-width: 480px) {
        #menuGrid {
          gap: 10px;
        }
        .menu-card {
          padding: 10px 7px !important;
          gap: 6px;
        }
        .menu-card:nth-child(5) {
          width: calc(50% - 5px);
        }
        .menu-card b {
          font-size: 16px;
        }
        .lesson-icon {
          font-size: 17px;
          height: 54px;
        }
      }
    
      #levelFiveSteps .fs-tabs,#levelFiveSteps .fs-q,#levelFiveSteps .fs-nav,#levelFiveSteps .fs-done{display:none}
      #levelFiveSteps .fs-grid{grid-template-columns:minmax(0,1fr)}
      #levelFiveSteps .fs-main{min-width:0}
      #levelFiveSteps .fs-bank{position:sticky;bottom:0;z-index:3}
      #levelFiveSteps .fs-eq{font-size:22px} #levelFiveSteps .fs-blank{min-width:2.6em}
      .reviewed-wrong{outline:2px solid #e4a09a;outline-offset:2px}
      #levelFiveSteps .pr{margin-left:.12em;margin-right:.07em}
      @media(min-width:900px) and (orientation:landscape){body.level-five #quiz .quiz-grid{display:block}#levelFiveSteps .fs-grid{grid-template-columns:minmax(0,1fr) 280px}#levelFiveSteps .fs-bank{position:sticky;top:10px;bottom:auto}}
    </style>
  </head>
  <body>
    <a class="port-back" href="../index.html">← 教材の一覧へ</a>
    <main class="wrap">
      <header class="head">
        <small>数学Ⅱ　微分・積分</small>
        <h1>微分の練習 基礎</h1>
      </header>
      <section id="menu">
        <p>レベルを選んで始めよう。</p>
        <div id="menuGrid" class="menu-grid"></div>
      </section>
      <section id="quiz" hidden>
        <div class="toolbar">
          <span class="question-no" id="status"></span><span id="timer"></span
          ><button onclick="menu()">選び直す</button
          ><button onclick="start(ADVANCED ? mode : lev)">
            もう一度やり直す
          </button>
        </div>
        <div class="progress-track"><span id="bar"></span></div>
        <div class="quiz-grid">
          <div>
            <div id="question" class="ask"></div>
            <div id="hints"></div>
            <div id="feedback" aria-live="polite" hidden></div>
          </div>
          <div class="answer-panel">
            <div id="choices" class="choices"></div>
            <div id="inputSection" class="input-section" hidden>
              <label for="answerInput">答えの式</label
              ><input
                id="answerInput"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <div class="input-tools">
                <button onclick="insertText('x')">
                  <span class="m"><i>x</i></span></button
                ><button onclick="insertText('²')">²</button
                ><button onclick="insertText('³')">³</button
                ><button onclick="insertText('−')">−</button
                ><button onclick="insertText('+')">+</button>
              </div>
              <button id="submit" class="primary" onclick="submit()">
                答え合わせ
              </button>
              <div
                id="inputFeedback"
                class="input-feedback"
                aria-live="polite"
              ></div>
              <details class="input-help">
                <summary>入力のしかた</summary>
                2x² は 2x^2 でも入力できます。空白は入っていてもかまいません。
              </details>
            </div>
            <div id="help" class="controls">
              <button onclick="hints()">ヒント</button
              ><button onclick="reveal()">答えを見る</button>
            </div>
            <button id="next" class="primary" onclick="advance()" hidden>
              次の問題へ
            </button>
          </div>
        </div>
      </section>
      <section id="result" hidden></section>
    </main>
    <script src="../../assets/fill-steps.js"></script>
    <script>
      const ADVANCED = false;
      const LEVELS = [
        {
          name: "レベル1",
          kind: "basic",
          problems: [
            { f: [[1, 1]], wrong: [[[1, 1]], [[0, 0]], [[1, 2]]] },
            { f: [[1, 2]], wrong: [[[1, 1]], [[1, 2]], [[2, 2]]] },
            { f: [[1, 3]], wrong: [[[1, 2]], [[3, 3]], [[1, 3]]] },
            { f: [[1, 4]], wrong: [[[1, 3]], [[4, 4]], [[3, 4]]] },
            { f: [[1, 5]], wrong: [[[1, 4]], [[5, 5]], [[4, 5]]] },
            { f: [[7, 0]], wrong: [[[7, 0]], [[1, 0]], [[7, 1]]] },
          ],
        },
        {
          name: "レベル2",
          kind: "coef",
          problems: [
            { f: [[2, 1]], wrong: [[[2, 1]], [[0, 0]], [[1, 0]]] },
            { f: [[3, 2]], wrong: [[[3, 2]], [[3, 1]], [[6, 0]]] },
            { f: [[4, 3]], wrong: [[[4, 3]], [[12, 1]], [[4, 2]]] },
            { f: [[5, 4]], wrong: [[[5, 4]], [[20, 1]], [[5, 3]]] },
            { f: [[2, 5]], wrong: [[[2, 5]], [[10, 1]], [[2, 4]]] },
            { f: [[-1, 2]], wrong: [[[2, 1]], [[-1, 1]], [[-2, 2]]] },
            { f: [[-3, 2]], wrong: [[[6, 1]], [[-3, 1]], [[-6, 2]]] },
            { f: [[-2, 3]], wrong: [[[6, 2]], [[-2, 2]], [[-6, 3]]] },
          ],
        },
        {
          name: "レベル3",
          kind: "frac",
          problems: [
            {
              f: [[[1, 2], 2]],
              wrong: [[[[1, 2], 1]], [[[1, 2], 2]], [[2, 1]]],
            },
            {
              f: [[[1, 3], 3]],
              wrong: [[[[1, 3], 2]], [[[1, 3], 3]], [[3, 2]]],
            },
            { f: [[[2, 3], 3]], wrong: [[[[2, 3], 2]], [[6, 2]], [[2, 1]]] },
            { f: [[[1, 4], 4]], wrong: [[[[1, 4], 3]], [[4, 3]], [[1, 4]]] },
            { f: [[[3, 2], 2]], wrong: [[[[3, 2], 1]], [[6, 1]], [[3, 2]]] },
            {
              f: [[[1, 6], 3]],
              wrong: [[[3, 2]], [[[1, 6], 2]], [[[1, 2], 3]]],
            },
            {
              f: [[[2, 9], 3]],
              wrong: [[[[2, 3], 3]], [[6, 2]], [[[2, 9], 2]]],
            },
            {
              f: [[[1, 4], 2]],
              wrong: [[[[1, 4], 1]], [[2, 1]], [[[1, 2], 2]]],
            },
          ],
        },
        {
          name: "レベル4",
          kind: "poly",
          problems: [
            {
              f: [
                [1, 2],
                [3, 1],
              ],
              wrong: [
                [[2, 1]],
                [
                  [1, 1],
                  [3, 0],
                ],
                [
                  [2, 1],
                  [1, 0],
                ],
              ],
            },
            {
              f: [
                [1, 3],
                [-2, 2],
              ],
              wrong: [
                [
                  [3, 2],
                  [-2, 1],
                ],
                [
                  [3, 2],
                  [4, 1],
                ],
                [
                  [1, 2],
                  [-4, 1],
                ],
              ],
            },
            {
              f: [
                [2, 3],
                [-4, 1],
                [1, 0],
              ],
              wrong: [
                [
                  [6, 2],
                  [-3, 0],
                ],
                [
                  [6, 2],
                  [-4, 1],
                ],
                [
                  [2, 2],
                  [-4, 0],
                ],

      // ---- 分数と式の道具 ----
      const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
      const R = (v) => {
        let [p, q] = Array.isArray(v) ? v : [v, 1];
        if (q < 0) {
          p = -p;
          q = -q;
        }
        const g = gcd(p, q) || 1;
        return [p / g, q / g];
      };
      const rmul = (a, b) => R([a[0] * b[0], a[1] * b[1]]);
      const radd = (a, b) => R([a[0] * b[1] + b[0] * a[1], a[1] * b[1]]);
      const MINUS = "−";
      const SUP = {
        0: "⁰",
        1: "¹",
        2: "²",
        3: "³",
        4: "⁴",
        5: "⁵",
        6: "⁶",
        7: "⁷",
        8: "⁸",
        9: "⁹",
      };
      const sup = (n) =>
        String(n)
          .split("")
          .map((d) => SUP[d])
          .join("");
      const frac = (p, q) =>
        `<span class="fraction"><span class="numerator">${p}</span><span class="denominator">${q}</span></span>`;
      const absR = (r) =>
        r[1] === 1 ? String(Math.abs(r[0])) : frac(Math.abs(r[0]), r[1]);
      const numTxt = (r) => (r[0] < 0 ? MINUS : "") + absR(r);
      const xpow = (n) => (n === 0 ? "" : n === 1 ? "x" : "x" + sup(n));
      // 式を整える：同じ次数をまとめ、0 の項を消し、次数の高い順に
      function norm(terms) {
        const m = {};
        terms.forEach(([c, n]) => {
          m[n] = radd(m[n] || [0, 1], R(c));
        });
        return Object.keys(m)
          .map(Number)
          .filter((n) => m[n][0] !== 0)
          .sort((a, b) => b - a)
          .map((n) => [m[n], n]);
      }
      function termTxt(c, n, first) {
        // c は分数 [p, q]
        const sign =
          c[0] < 0 ? (first ? MINUS : ` ${MINUS} `) : first ? "" : " + ";
        const body =
          n > 0 && c[0] !== 0 && Math.abs(c[0]) === 1 && c[1] === 1
            ? xpow(n)
            : absR(c) + xpow(n);
        return sign + body;
      }
      function polyTxt(terms) {
        const t = norm(terms);
        return t.length
          ? t.map(([c, n], i) => termTxt(c, n, i === 0)).join("")
          : "0";
      }
      const deriv = (terms) =>
        norm(terms)
          .filter(([, n]) => n > 0)
          .map(([c, n]) => [rmul(c, [n, 1]), n - 1]);
      const key = (terms) => JSON.stringify(norm(terms));
      const valueAt = (terms, a) =>
        norm(terms).reduce(
          (s, [c, n]) => radd(s, rmul(c, [Math.pow(a, n), 1])),
          [0, 1],
        );

      // 途中式（1 項ずつの微分）
      function termDeriv(c, n) {
        // (kxⁿ)' = k·n xⁿ⁻¹
        if (n === 0) return "0";
        if (n === 1) return numTxt(c); // (kx)' = k
        const k =
          Math.abs(c[0]) === 1 && c[1] === 1
            ? c[0] < 0
              ? MINUS
              : ""
            : numTxt(c) + "·";
        return `${k}${n}${xpow(n - 1)}`;
      }
      function midOf(q) {
        const t = norm(q.f),
          d = deriv(q.f);
        let s = "";
        if (q.show) s += `展開すると f(x) = ${polyTxt(q.f)}。`;
        if (t.length === 1) {
          const [c, n] = t[0];
          s += `f'(x) = (${termTxt(c, n, true)})' = ${termDeriv(c, n)}`;
        } else {
          s +=
            `f'(x) = ` +
            t
              .map(
                ([c, n], i) =>
                  (i === 0
                    ? c[0] < 0
                      ? MINUS
                      : ""
                    : c[0] < 0
                      ? ` ${MINUS} `
                      : " + ") +
                  `(${termTxt([Math.abs(c[0]), c[1]], n, true)})'`,
              )
              .join("") +
            " = " +
            (t
              .filter(([, n]) => n > 0)
              .map(
                ([c, n], i) =>
                  (i === 0 ? "" : c[0] < 0 ? ` ${MINUS} ` : " + ") +
                  termDeriv([i === 0 ? c[0] : Math.abs(c[0]), c[1]], n),
              )
              .join("") || "0");
        }
        // 最後は整理した式まで（例：3·2x → 6x）
        if (q.at === undefined && !s.endsWith(polyTxt(d))) s += ` = ${polyTxt(d)}`;
        if (q.at !== undefined) {
          const a = q.at,
            A = a < 0 ? `(${MINUS}${-a})` : String(a);
          if (!s.endsWith(polyTxt(d))) s += ` = ${polyTxt(d)}`;
          s +=
            ` なので、f'(${numTxt([a, 1])}) = ` +
            d
              .map(([c, n], i) => {
                const sign =
                  c[0] < 0
                    ? i === 0
                      ? MINUS
                      : ` ${MINUS} `
                    : i === 0
                      ? ""
                      : " + ";
                const k = absR(c);
                return sign + (n === 0 ? k : `${k}·${A}${n > 1 ? sup(n) : ""}`);
              })
              .join("");
        }
        return s;
      }
      const PLAN = {
        basic:
          "(xⁿ)' = n xⁿ⁻¹（指数を前にかけて、指数を 1 つへらす）。x は x¹ と考えよう。数だけ（定数）を微分すると 0。",
        coef: "(k xⁿ)' = k · n xⁿ⁻¹。係数 k（マイナスも）はそのまま残して、指数 n をかけよう。",
        frac: "係数が分数でも同じ。(k xⁿ)' = k · n xⁿ⁻¹。かけたあと、約分しよう。",
        poly: "1 つの項ずつ微分して、たし算・ひき算でつなぐ。定数の項は微分すると 0 になるよ。",
        expand: "まず展開して、1 つの項ずつ微分しよう。",
        at: "まず f'(x) を求めてから、x の値を代入しよう。f(a) ではなく f'(a) だよ。",
      };

      // 問題を 1 問ぶん組み立てる：問題の式・聞き方・選択肢（正解は計算で作る）・ヒント
      function build(level, q) {
        const d = deriv(q.f);
        const fTxt = q.show || polyTxt(q.f);
        let answer, opts;
        if (q.at !== undefined) {
          const v = valueAt(d, q.at);
          answer = numTxt(v);
          opts = [{ text: answer, ok: true }].concat(
            q.wrong.map((w) => ({
              text: numTxt(R(w)),
              ok: R(w)[0] === v[0] && R(w)[1] === v[1],
            })),
          );
        } else {
          answer = polyTxt(d);
          opts = [{ text: answer, ok: true }].concat(
            q.wrong.map((w) => ({ text: polyTxt(w), ok: key(w) === key(d) })),
          );
        }
        const ask =
          q.at !== undefined
            ? `のとき、f'(${numTxt([q.at, 1])}) = ？`
            : "のとき、f'(x) = ？";
        const plan =
          q.at !== undefined ? PLAN.at : PLAN[LEVELS[level - 1].kind];
        return { fTxt, ask, answer, opts, plan, mid: midOf(q), at: q.at };
      }

      // 数式のHTMLは、文字だけ斜体・数字は立体。式の行と日本語の説明を分ける。
      function mathHTML(html) {
        return String(html)
          .split(/(<[^>]+>)/g)
          .map((part, i) =>
            i % 2
              ? part
              : part.replace(
                  /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()+−=×÷·.,^\- ]+/g,
                  (run) => {
                    if (!/[A-Za-z0-9ⁿ]/.test(run)) return run;
                    let text = run
                      .replace(/'/g, "′")
                      .replace(/-/g, "−")
                      .replace(/\^(\d+)/g, (_, n) => "<sup>" + n + "</sup>");
                    text = text.replace(
                      /[ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,
                      (x) =>
                        "<sup>" +
                        [...x]
                          .map((c) =>
                            c === "ⁿ"
                              ? "n"
                              : c === "⁻"
                                ? "−"
                                : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c),
                          )
                          .join("") +
                        "</sup>",
                    );
                    text = text
                      .split(/(<[^>]+>)/g)
                      .map((x, j) =>
                        j % 2
                          ? x
                          : x.replace(/[A-Za-z]+/g, (letters) =>
                              ["sin", "cos", "tan", "log"].includes(letters)
                                ? letters
                                : "<i>" + letters + "</i>",
                            ),
                      )
                      .join("");
                    text = text.replace(
                      /(<i>[fyF]<\/i>)′/g,
                      '$1<span class="pr">′</span>',
                    );
                    text = text.replace(
                      /(<i>f<\/i>|<span class="pr">′<\/span>)(?=\()/g,
                      '$1<span class="fn-gap"></span>',
                    );
                    return '<span class="m">' + text + "</span>";
                  },
                ),
          )
          .join("");
      }

      }

      function escapeText(s) {
        return String(s)
          .replace(/&/g, "&amp;")

      }
      function questionHTML(q) {
        let expression, ask;
        if (ADVANCED) {
          expression = q.q;
          if (q.custom) {
            ask = q.q.includes("ax²")

              : "a は定数。f′(1) = 5 のとき、a を求めよ。";
          } else
            ask =
              q.at !== undefined
                ? "f′(" + numTxt([q.at, 1]) + ") の値を求めよ。"
                : "f′(x) を求めよ。";
        } else {
          const b = build(lev, q);
          expression = "f(x) = " + b.fTxt;
          ask =
            q.at !== undefined
              ? "f′(" + numTxt([q.at, 1]) + ") の値を求めよ。"
              : "f′(x) を求めよ。";
        }
        return (
          '<div class="question-box"><div class="problem">' +
          mathHTML(expression) +
          '</div><div class="ask-line">' +
          mathHTML(ask) +

      }

      function loadFresh() {
        stage = 0;
        done = false;
        const d = details();
        $("status").textContent =
          (ADVANCED ? modeNames[mode] : "レベル " + lev) +
          "　" +
          (index + 1) +
          " / " +
          questions.length;
        $("bar").style.width = (index / questions.length) * 100 + "%";
        $("question").innerHTML = questionHTML(questions[index]);
        $("hints").innerHTML = "";
        $("feedback").hidden = true;
        $("next").hidden = true;
        $("help").hidden = timed();
        $("inputSection").hidden = !(ADVANCED && mode === "input");
        $("choices").hidden = ADVANCED && mode === "input";
        $("answerInput").value = "";
        $("inputFeedback").textContent = "";
        $("submit").disabled = false;
        $("answerInput").disabled = false;
        options = shuffled(d.opts);
        $("choices").innerHTML = options
          .map(
            (o, n) =>
              '<button class="choice" data-label="' +
              ["ア", "イ", "ウ", "エ"][n] +

              n +
              ')">' +
              mathHTML(o.text) +

      function hints() {
        if (done) return;
        rememberIssue("ヒントを見ました");
        stage++;
        if (stage >= 3) {
          finish(false);
          return;
        }
        const d = details();
        $("hints").innerHTML =
          '<div class="hint-box"><span class="hint-tag">' +
          (stage === 1 ? "考え方" : "途中式") +
          "</span>" +
          formulaHTML() +
          (stage === 1 ? mathHTML(d.plan) : stepsHTML(d.mid)) +
          "</div>";
        fitMath();
      }
      function choose(n) {
        if (done || lev===5 && !stepReady) return;
        // A hint is a review reason; keep the student's actual first choice too.
        if(history[index]?.issue && ['ヒントを見ました','答えを見ました'].includes(history[index].chosen)) history[index].chosen=options[n].text;
        const ok = options[n].ok;
        if (timed()) {
          if (ok) score++;
          else
            wrong.push({
              q: questions[index],
              number: index + 1,
              chosen: options[n].text,
            });
          if (!ok && mode === "hell") {
            results();
            return;
          }
          advance();
          return;
        }
        if (ok) {
          finish(true);
          return;
        }
        rememberIssue(options[n].text);
        $("choices").children[n].classList.add("incorrect");
        $("choices").children[n].disabled = true;
        if(lev===5){stage=Math.max(stage,1);$('inputFeedback').textContent='もう一度考えてみよう。';saveQuestion();}else hints();
      }
      function submit() {
        if (done) return;
        const v = $("answerInput").value.trim();
        if (!v) {
          $("inputFeedback").textContent = "答えを入力してください。";
          return;
        }
        if (!parsePoly(v)) {
          $("inputFeedback").textContent =
            "式を読み取れません。例：2x² + 3（2x^2 + 3 でも入力できます）";
          return;
        }
        if (samePoly(v, questions[index].options[questions[index].correct]))
          finish(true);
        else {
          $("inputFeedback").textContent =
            "もう一度、下のヒントを見て考えよう。";
          hints();
        }
      }
      function reveal() {
        if(lev===5 && !stepReady){document.querySelector("#levelFiveSteps [data-act=show]")?.click();return;}
        if (!done) {
          rememberIssue("答えを見ました");
          stage = 3;
          finish(false);
        }
      }
      function finish(ok) {
        done = true;
        if (ok && stage === 0) score++;

        $("feedback").hidden = false;
        $("feedback").className = "feedback " + (ok ? "correct" : "");
        $("feedback").innerHTML =
          "<strong>" +
          (ok ? "正解" : "答えを確認しよう") +
          '</strong><div class="problem">' +
          mathHTML(d.answer || d.ans) +
          "</div>" +
          stepsHTML(d.mid);
        $("hints").innerHTML = "";
        $("help").hidden = true;
        $("next").hidden = false;
        $("next").textContent =
          index + 1 === questions.length ? "結果を見る" : "次の問題へ";
        $("submit").disabled = true;
        $("answerInput").disabled = true;
        [...$("choices").children].forEach((e, n) => {
          e.disabled = true;
          if (options[n].ok) e.classList.add("correct");
        });
        fitMath();
      }
      function advance() {
        saveQuestion();
        index = ADVANCED
          ? index < frontier
            ? frontier
            : frontier + 1
          : index + 1;
        frontier = Math.max(frontier, index);
        if (
          (index >= questions.length && history.some((h) => !h?.done)) ||
          (index >= questions.length && history.length < questions.length)

          index = questions.findIndex((q, i) => !history[i]?.done);
        if (index >= questions.length) results();
        else {
          load();
          window.scrollTo(0, 0);
        }
      }
      function results() {
        saveQuestion();
        clearInterval(timer);
        $("quiz").hidden = true;
        $("result").hidden = false;
        const attempted = timed()
          ? Math.min(index + 1, questions.length)
          : questions.length;
        $("result").innerHTML =
          '<h2>学習の結果</h2><p class="result-score">' +
          score +
          " / " +
          (mode === "hell" && ADVANCED ? attempted : questions.length) +
          " 問</p><p>" +
          (timed()
            ? "記録：" +
              elapsed() +
              (mode === "hell" && wrong.length ? "（不正解で終了）" : "")
            : "ヒントを使わずに正解した問題の数です。") +
          '</p><div class="result-nav"><button class="primary" onclick="start(ADVANCED?mode:lev)">もう一度</button>' +
          (!ADVANCED && lev < 5
            ? '<button onclick="start(lev+1)">次のレベルへ</button>'
            : "") +
          '<button onclick="menu()">' +
          (ADVANCED ? "モード" : "レベル") +
          'を選ぶ</button><a href="../index.html">ほかの教材へ</a></div>' +
          reviewHTML();
        window.scrollTo(0, 0);
        fitMath();
      }
      function graph(q) {
        let f = q.f || readPoly(q.q);
        if (q.custom)
          f = q.q.includes("ax²")
            ? [
                [2, 2],
                [3, 1],
              ]
            : [
                [1, 2],
                [3, 1],
              ];
        const a = q.at ?? (q.custom ? (q.q.includes("ax²") ? 2 : 1) : 0);
        const val = (x) =>
          f.reduce(
            (s, [c, n]) => s + (Array.isArray(c) ? c[0] / c[1] : c) * x ** n,
            0,
          );
        const slope = f.reduce(
          (s, [c, n]) =>
            s +
            (n ? (Array.isArray(c) ? c[0] / c[1] : c) * n * a ** (n - 1) : 0),
          0,
        );
        const xs = Array.from({ length: 101 }, (_, i) => a - 2 + i / 25),
          ys = xs.map(val),
          ts = xs.map((x) => val(a) + slope * (x - a));
        const lo = Math.min(0, ...ys, ...ts) - 1,
          hi = Math.max(0, ...ys, ...ts) + 1;
        const X = (x) => 25 + (x - a + 2) * 62.5,
          Y = (y) => 170 - ((y - lo) / (hi - lo)) * 150;
        const path = (v) =>
          v
            .map(
              (y, i) =>
                (i ? "L" : "M") + X(xs[i]).toFixed(2) + " " + Y(y).toFixed(2),
            )
            .join(" ");
        return (
          '<svg viewBox="0 0 300 200" role="img" aria-label="関数と接線のグラフ"><path d="M25 ' +
          Y(0) +
          "H275" +
          (a - 2 <= 0 && a + 2 >= 0 ? "M" + X(0) + " 20V170" : "") +
          '" stroke="#aaa" fill="none"/><path d="' +
          path(ys) +
          '" stroke="#1f4e8c" stroke-width="2" fill="none"/><path d="' +
          path(ts) +
          '" stroke="#d9480f" stroke-width="2" fill="none"/><circle cx="' +
          X(a) +
          '" cy="' +
          Y(val(a)) +
          '" r="3" fill="#d9480f"/><text x="25" y="190" font-size="12" font-family="STIX Two Text,serif">' +
          String(a - 2).replace(/-/g, "−") +
          '</text><text x="265" y="190" font-size="12" font-family="STIX Two Text,serif">' +
          String(a + 2).replace(/-/g, "−") +
          "</text></svg><small>紺：関数のグラフ　橙：" +
          mathHTML("x = " + a) +
          " の接線（接点 " +
          mathHTML("(" + a + ", " + numTxt(valueAt(f, a)) + ")") +
          "）</small>"
        );
      }
      function insertText(s) {
        const e = $("answerInput");
        e.setRangeText(s, e.selectionStart, e.selectionEnd, "end");
        e.focus();
      }
      $("answerInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          if (done) advance();
          else submit();
        }
      });
      const menuTitles = ADVANCED
        ? [
            "4択で10問",
            "式を入力して10問",
            "全89問タイムアタック",
            "超鬼連チャン",
          ]
        : [
            '<i class="mi">x</i><sup class="mi-sup">n</sup> の導関数',
            "定数倍の導関数",
            "係数が分数の関数",
            "多項式の導関数",
            '展開して微分・<wbr>微分係数',
          ];
      const menuSymbols = ADVANCED
        ? [
            "▢ ▣<br>▢ ▢",
            '<span class="input-icon"><i class="mi">x</i><sup class="mi-sup">2</sup><span class="caret">│</span></span>',
            '<span class="clock-icon">89</span>',
            "×",
          ]
        : [
            "x³ → 3x²",
            "5x³ → 15x²",
            "{1|2}x² → x",
            "x³ <em>+</em> 2x² <em>−</em> 3x",
            "f′(a)",
          ];
      $("menuGrid").innerHTML = menuTitles
        .map(
          (title, i) =>
            '<button class="menu-card" onclick="start(' +
            (ADVANCED ? "'" + Object.keys(modeNames)[i] + "'" : i + 1) +
            ')"><span class="lesson-icon" aria-hidden="true">' +
            (ADVANCED
              ? menuSymbols[i]
              : mathHTML(menuSymbols[i].replace("{1|2}", frac("1", "2")))) +
            "</span><b>" +
            title +
            "</b><small>" +
            (ADVANCED
              ? [
                  "選んで解く・時間を計測",
                  "キーボードで答える",
                  "全部の問題に挑戦",
                  "1回まちがえたら終わり",
                ][i]
              : LEVELS[i].problems.length + "問") +
            "</small></button>",
        )
        .join("");
      let stepAPI=null,stepOwner=-1,stepReady=false;
      const signedTerms=f=>norm(f).map(([c,n],i)=>termTxt(c,n,i===0).replace(/\s/g,''));
      function levelFiveProblem(q){
        const rows=[],d=deriv(q.f),terms=signedTerms(q.f),dt=signedTerms(d);
        const row=(t,h)=>({t,h});
        if(q.show){
          const expanded={
            '(x + 1)²':['x²','+2x','+1'],
            'x(x − 3)':['x²','−3x'],
            '(2x − 1)(x + 3)':['2x²','+6x@s','−x@s','−3'],
            '(x − 2)²':['x²','−4x','+4'],
            '(x + 1)(x − 1)':['x²','−x@s','+x@s','−1']
          }[q.show];
          rows.push(row('#かっこを展開する',''),row('f(x) = '+expanded.map(t=>'['+t+']').join(' '),'分配法則で、それぞれの項をかけます。2乗は (a − b)² = a² − 2ab + b² を使おう。'));
          if(expanded.some(t=>t.includes('@')))rows.push(row('#同類項をまとめる',''),row('f(x) = '+terms.map(t=>'['+t+']').join(' '),'x の項どうしをまとめます。'));
        }
        rows.push(row('#1つの項ずつ微分する',''),row('f′(x) = '+norm(q.f).map(([c,n],i)=>(c[0]<0?' − ':i?' + ':'')+'('+termTxt([Math.abs(c[0]),c[1]],n,true)+')′').join('')+' = '+dt.map(t=>'['+t+']').join(' '),'指数を前にかけ、指数を1つ下げよう。定数の微分は0です。'));
        if(q.at!==undefined){
          const a=q.at,A=a<0?'('+String(a).replace('-','−')+')':String(a);
          const sub=norm(d).map(([c,n],i)=>(c[0]<0?' − ':i?' + ':'')+(n===0?absR(c):(Math.abs(c[0])===c[1]?'':absR(c)+' × ')+A+(n>1?sup(n):''))).join('');
          rows.push(row('#x = '+String(a).replace('-','−')+' を代入する',''),row('f′('+String(a).replace('-','−')+') = '+sub,'f(a) ではなく f′(a)。先に微分してから代入します。'));
        }
        rows.forEach(r=>{
          const right=[...r.t.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1].split('@')[0]);
          const candidates=right.flatMap(v=>[v.startsWith('−')?'+'+v.slice(1):'−'+v.replace(/^\+/,''),v.replace(/²/g,''),v.replace(/\d+/,n=>String(Number(n)*2)),v.replace(/\d+/,n=>String(Number(n)%2===0?Number(n)/2:Number(n)))]);
          r.cards=[...new Set(right.concat(candidates.filter(v=>!right.includes(v)).slice(0,4)))];
        });
        return {q:'',rows,cards:[...new Set(rows.flatMap(r=>r.cards))],ans:build(5,q).answer};
      }
      function mountLevelFive(){
        document.body.classList.toggle('level-five',lev===5&&!ADVANCED);
        let root=$('levelFiveSteps');if(root)root.remove();stepAPI=null;stepOwner=index;stepReady=lev!==5;
        if(lev!==5)return;
        root=document.createElement('div');root.id='levelFiveSteps';$('question').after(root);
        const saved=history[index]?.steps,owner=index,p=levelFiveProblem(questions[index]);
        $('choices').hidden=true;
        let lastMiss=saved?.miss||0;
        stepAPI=FillSteps.mount({el:root,problems:[p],fewCards:false,before:(p,st)=>{
          const b=st.active===null?p.blankOrder.find(i=>st.fill[i]===undefined):st.active;
          if(b!==undefined&&b!==null)p.cards=p.rows[p.blanks[b].row].cards.map(v=>({v}));
        },after:(r,p,st)=>{
          if(owner!==index)return;
          const h=history[index] ||= {};
          if(st.miss>lastMiss){rememberIssue('途中式の空欄で間違えました');stage=Math.max(stage,1);}lastMiss=st.miss;
          if(st.shown||r.querySelector('.fs-hint')){rememberIssue(st.shown?'途中式の答えを見ました':'ヒントを見ました');stage=Math.max(stage,1);}
          if(!matchMedia('(min-width:900px) and (orientation:landscape)').matches && st.active!==null){
            const b=p.blanks[st.active];let allowed=b.g?p.blanks.filter(x=>x.g===b.g).map(x=>x.a):[b.a];
            if(b.g)for(const k in st.fill)if(p.blanks[k].g===b.g)allowed.splice(allowed.indexOf(st.fill[k]),1);
            const buttons=[...r.querySelectorAll('[data-c]')],right=buttons.filter(e=>allowed.includes(p.cards[+e.dataset.c].v)&&!e.disabled),other=buttons.filter(e=>!allowed.includes(p.cards[+e.dataset.c].v)&&!e.disabled).sort((a,c)=>Number(p.blanks.some(x=>x.row===b.row&&x.a===p.cards[+a.dataset.c].v))-Number(p.blanks.some(x=>x.row===b.row&&x.a===p.cards[+c.dataset.c].v))).slice(0,3-right.length),visible=new Set([...right,...other]);
            buttons.forEach(e=>e.hidden=!visible.has(e));r.querySelector('.fs-cards').classList.add('few');
          }
          h.steps=structuredClone(st);stepReady=st.done||st.shown;$('choices').hidden=!stepReady;
          if(!stepReady)$('help').hidden=true;else $('help').hidden=done;
          for(const b of Object.keys(st.wrongBlanks||{}))r.querySelector('[data-b="'+b+'"]')?.classList.add('reviewed-wrong');
          const walker=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),primes=[];while(walker.nextNode())if(walker.currentNode.textContent.includes('′')&&!walker.currentNode.parentElement.closest('.pr'))primes.push(walker.currentNode);
          primes.forEach(t=>{const f=document.createDocumentFragment();t.textContent.split('′').forEach((part,i)=>{if(i){const e=document.createElement('span');e.className='pr';e.textContent='′';f.append(e);}f.append(document.createTextNode(part));});t.replaceWith(f);});
          r.querySelectorAll('.fs-m i').forEach(e=>{if(e.textContent==='f'&&e.nextSibling?.textContent.startsWith('('))e.style.marginRight='.07em';});
        }});
        if(saved){Object.assign(stepAPI.state()[0],saved);lastMiss=saved.miss;stepAPI.go(0);}
      }
      function completedStepHTML(q,h){
        const p=levelFiveProblem(q);let i=0;
        return p.rows.map(r=>'<div class="review-step">'+mathHTML(r.t.replace(/^#/, '').replace(/\[([^\]]+)\]/g,(_,v)=>{const k=i++;return '<span class="'+(h.steps?.wrongBlanks?.[k]?'reviewed-wrong':'')+'">'+(h.steps?.fill?.[k]??v.split('@')[0])+'</span>';}))+'</div>').join('');
      }

      menu();
    </script>
