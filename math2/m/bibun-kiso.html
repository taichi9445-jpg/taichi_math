    <main class="wrap">

      </section>
      <section id="quiz" hidden>
        <div class="toolbar">
          <span class="question-no" id="status"></span><span id="timer"></span
          ><button onclick="menu()">選び直す</button
          ><button onclick="start(ADVANCED ? mode : lev)">
            もう一度やり直す
          </button>
        </div>
        <div class="progress-track"><span id="bar"></span></div>
        <div class="quiz-grid">
          <div>
            <div id="question" class="ask"></div>
            <div id="hints"></div>
            <div id="feedback" aria-live="polite" hidden></div>
          </div>
          <div class="answer-panel">
            <div id="choices" class="choices"></div>
            <div id="inputSection" class="input-section" hidden>
              <label for="answerInput">答えの式</label
              ><input
                id="answerInput"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <div class="input-tools">
                <button onclick="insertText('x')">x</button
                ><button onclick="insertText('²')">²</button
                ><button onclick="insertText('³')">³</button
                ><button onclick="insertText('−')">−</button
                ><button onclick="insertText('+')">+</button>
              </div>
              <button id="submit" class="primary" onclick="submit()">
                答え合わせ
              </button>
              <div
                id="inputFeedback"
                class="input-feedback"
                aria-live="polite"
              ></div>
              <details class="input-help">
                <summary>入力のしかた</summary>
                2x² は 2x^2 でも入力できます。空白は入っていてもかまいません。
              </details>
            </div>
            <div id="help" class="controls">
              <button onclick="hints()">ヒント</button
              ><button onclick="reveal()">答えを見る</button>
            </div>
            <button id="next" class="primary" onclick="advance()" hidden>
              次の問題へ
            </button>
          </div>
        </div>
      </section>
      <section id="result" hidden></section>

    <script>
      const ADVANCED = false;
      const LEVELS = [
        {

        {

            },
            {
              f: [[[1, 3], 3]],
              wrong: [[[[1, 3], 2]], [[[1, 3], 3]], [[3, 2]]],
            },
            { f: [[[2, 3], 3]], wrong: [[[[2, 3], 2]], [[6, 2]], [[2, 1]]] },
            { f: [[[1, 4], 4]], wrong: [[[[1, 4], 3]], [[4, 3]], [[1, 4]]] },
            { f: [[[3, 2], 2]], wrong: [[[[3, 2], 1]], [[6, 1]], [[3, 2]]] },
            {

        {

            {

            {

                [1, 0],
              ],
              wrong: [
                [
                  [6, 2],
                  [-3, 0],
                ],
                [
                  [6, 2],
                  [-4, 1],
                ],
                [

                ],
              ],
            },
            {

                [1, 2],

              ],
              wrong: [
                [

                ],

            },
            {

              ],

            {

            {

                [4, 1],

              ],
              wrong: [[[4, 1]], [[-3, 0]], [[1, 0]]],
            },
            {
              f: [
                [1, 4],
                [-1, 2],
              ],
              wrong: [
                [
                  [4, 3],
                  [-1, 1],
                ],
                [
                  [4, 3],

                ],

            },
          ],
        },
        {
          name: "レベル5",
          kind: "expand",
          problems: [
            {
              show: "(x + 1)²",
              f: [
                [1, 2],
                [2, 1],
                [1, 0],
              ],
              wrong: [
                [
                  [2, 1],
                  [1, 0],
                ],
                [[2, 1]],
                [
                  [1, 2],
                  [2, 1],
                ],
              ],
            },
            {
              show: "x(x − 3)",
              f: [
                [1, 2],
                [-3, 1],
              ],
              wrong: [
                [
                  [2, 1],
                  [3, 0],
                ],
                [
                  [1, 1],
                  [-3, 0],
                ],
                [
                  [2, 1],
                  [-6, 0],
                ],
              ],
            },
            {
              show: "(2x − 1)(x + 3)",
              f: [
                [2, 2],
                [5, 1],
                [-3, 0],
              ],
              wrong: [
                [[2, 0]],
                [
                  [4, 1],
                  [-3, 0],
                ],
                [
                  [2, 1],
                  [5, 0],
                ],
              ],
            },
            {
              show: "(x − 2)²",
              f: [
                [1, 2],
                [-4, 1],
                [4, 0],
              ],
              wrong: [
                [
                  [2, 1],
                  [4, 0],
                ],
                [[2, 1]],
                [
                  [2, 1],
                  [-2, 0],
                ],
              ],
            },
            {
              show: "(x + 1)(x − 1)",
              f: [
                [1, 2],
                [-1, 0],
              ],
              wrong: [
                [
                  [2, 1],
                  [-1, 0],
                ],
                [[1, 0]],
                [[1, 1]],
              ],
            },
            {
              f: [
                [1, 3],
                [-2, 1],
              ],
              at: 2,
              wrong: [4, 12, 6],
            },
            {
              f: [
                [1, 2],
                [4, 1],
              ],
              at: -1,
              wrong: [-3, 6, -2],
            },
            {
              f: [
                [2, 3],
                [-1, 2],
              ],
              at: 1,
              wrong: [1, 8, 5],
            },
          ],
        },
      ];

      // ---- 分数と式の道具 ----
      const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
      const R = (v) => {
        let [p, q] = Array.isArray(v) ? v : [v, 1];
        if (q < 0) {
          p = -p;
          q = -q;
        }
        const g = gcd(p, q) || 1;
        return [p / g, q / g];
      };
      const rmul = (a, b) => R([a[0] * b[0], a[1] * b[1]]);
      const radd = (a, b) => R([a[0] * b[1] + b[0] * a[1], a[1] * b[1]]);
      const MINUS = "−";
      const SUP = {
        0: "⁰",
        1: "¹",
        2: "²",
        3: "³",
        4: "⁴",
        5: "⁵",
        6: "⁶",
        7: "⁷",
        8: "⁸",
        9: "⁹",
      };
      const sup = (n) =>
        String(n)
          .split("")
          .map((d) => SUP[d])
          .join("");
      const frac = (p, q) =>
        `<span class="fraction"><span class="numerator">${p}</span><span class="denominator">${q}</span></span>`;
      const absR = (r) =>
        r[1] === 1 ? String(Math.abs(r[0])) : frac(Math.abs(r[0]), r[1]);
      const numTxt = (r) => (r[0] < 0 ? MINUS : "") + absR(r);
      const xpow = (n) => (n === 0 ? "" : n === 1 ? "x" : "x" + sup(n));
      // 式を整える：同じ次数をまとめ、0 の項を消し、次数の高い順に
      function norm(terms) {
        const m = {};
        terms.forEach(([c, n]) => {
          m[n] = radd(m[n] || [0, 1], R(c));
        });
        return Object.keys(m)
          .map(Number)
          .filter((n) => m[n][0] !== 0)
          .sort((a, b) => b - a)
          .map((n) => [m[n], n]);
      }
      function termTxt(c, n, first) {
        // c は分数 [p, q]
        const sign =
          c[0] < 0 ? (first ? MINUS : ` ${MINUS} `) : first ? "" : " + ";
        const body =
          n > 0 && c[0] !== 0 && Math.abs(c[0]) === 1 && c[1] === 1
            ? xpow(n)
            : absR(c) + xpow(n);
        return sign + body;
      }
      function polyTxt(terms) {
        const t = norm(terms);
        return t.length
          ? t.map(([c, n], i) => termTxt(c, n, i === 0)).join("")
          : "0";
      }
      const deriv = (terms) =>
        norm(terms)
          .filter(([, n]) => n > 0)
          .map(([c, n]) => [rmul(c, [n, 1]), n - 1]);
      const key = (terms) => JSON.stringify(norm(terms));
      const valueAt = (terms, a) =>
        norm(terms).reduce(
          (s, [c, n]) => radd(s, rmul(c, [Math.pow(a, n), 1])),
          [0, 1],
        );

      // 途中式（1 項ずつの微分）
      function termDeriv(c, n) {
        // (kxⁿ)' = k·n xⁿ⁻¹
        if (n === 0) return "0";
        if (n === 1) return numTxt(c); // (kx)' = k
        const k =
          Math.abs(c[0]) === 1 && c[1] === 1
            ? c[0] < 0
              ? MINUS
              : ""
            : numTxt(c) + "·";
        return `${k}${n}${xpow(n - 1)}`;
      }
      function midOf(q) {
        const t = norm(q.f),
          d = deriv(q.f);
        let s = "";
        if (q.show) s += `展開すると f(x) = ${polyTxt(q.f)}。`;
        if (t.length === 1) {
          const [c, n] = t[0];
          s += `f'(x) = (${termTxt(c, n, true)})' = ${termDeriv(c, n)}`;
        } else {
          s +=
            `f'(x) = ` +
            t
              .map(
                ([c, n], i) =>
                  (i === 0
                    ? c[0] < 0
                      ? MINUS
                      : ""
                    : c[0] < 0
                      ? ` ${MINUS} `
                      : " + ") +
                  `(${termTxt([Math.abs(c[0]), c[1]], n, true)})'`,
              )
              .join("") +
            " = " +
            (t
              .filter(([, n]) => n > 0)
              .map(
                ([c, n], i) =>
                  (i === 0 ? "" : c[0] < 0 ? ` ${MINUS} ` : " + ") +
                  termDeriv([i === 0 ? c[0] : Math.abs(c[0]), c[1]], n),
              )
              .join("") || "0");
        }
        if (q.at !== undefined) {
          const a = q.at,
            A = a < 0 ? `(${MINUS}${-a})` : String(a);
          if (!s.endsWith(polyTxt(d))) s += ` = ${polyTxt(d)}`;
          s +=
            ` なので、f'(${numTxt([a, 1])}) = ` +
            d
              .map(([c, n], i) => {
                const sign =
                  c[0] < 0
                    ? i === 0
                      ? MINUS
                      : ` ${MINUS} `
                    : i === 0
                      ? ""
                      : " + ";
                const k = absR(c);
                return sign + (n === 0 ? k : `${k}·${A}${n > 1 ? sup(n) : ""}`);
              })
              .join("");
        }
        return s;
      }
      const PLAN = {
        basic:
          "(xⁿ)' = n xⁿ⁻¹（指数を前にかけて、指数を 1 つへらす）。x は x¹ と考えよう。数だけ（定数）を微分すると 0。",
        coef: "(k xⁿ)' = k · n xⁿ⁻¹。係数 k（マイナスも）はそのまま残して、指数 n をかけよう。",
        frac: "係数が分数でも同じ。(k xⁿ)' = k · n xⁿ⁻¹。かけたあと、約分しよう。",
        poly: "1 つの項ずつ微分して、たし算・ひき算でつなぐ。定数の項は微分すると 0 になるよ。",
        expand: "まず展開して、1 つの項ずつ微分しよう。",
        at: "まず f'(x) を求めてから、x の値を代入しよう。f(a) ではなく f'(a) だよ。",
      };

      // 問題を 1 問ぶん組み立てる：問題の式・聞き方・選択肢（正解は計算で作る）・ヒント
      function build(level, q) {
        const d = deriv(q.f);
        const fTxt = q.show || polyTxt(q.f);
        let answer, opts;
        if (q.at !== undefined) {
          const v = valueAt(d, q.at);
          answer = numTxt(v);
          opts = [{ text: answer, ok: true }].concat(
            q.wrong.map((w) => ({
              text: numTxt(R(w)),
              ok: R(w)[0] === v[0] && R(w)[1] === v[1],
            })),
          );
        } else {
          answer = polyTxt(d);
          opts = [{ text: answer, ok: true }].concat(
            q.wrong.map((w) => ({ text: polyTxt(w), ok: key(w) === key(d) })),
          );
        }
        const ask =
          q.at !== undefined
            ? `のとき、f'(${numTxt([q.at, 1])}) = ？`
            : "のとき、f'(x) = ？";
        const plan =
          q.at !== undefined ? PLAN.at : PLAN[LEVELS[level - 1].kind];
        return { fTxt, ask, answer, opts, plan, mid: midOf(q), at: q.at };
      }

      // 数式のHTMLは、文字だけ斜体・数字は立体。式の行と日本語の説明を分ける。
      function mathHTML(html) {
        return String(html)
          .split(/(<[^>]+>)/g)
          .map((part, i) =>
            i % 2
              ? part
              : part.replace(
                  /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()+−=×÷·.,^\- ]+/g,
                  (run) => {
                    if (!/[A-Za-z0-9ⁿ]/.test(run)) return run;
                    let text = run
                      .replace(/'/g, "′")
                      .replace(/-/g, "−")
                      .replace(/\^(\d+)/g, (_, n) => "<sup>" + n + "</sup>");
                    text = text.replace(
                      /[ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,
                      (x) =>
                        "<sup>" +
                        [...x]
                          .map((c) =>
                            c === "ⁿ"
                              ? "n"
                              : c === "⁻"
                                ? "−"
                                : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c),
                          )
                          .join("") +
                        "</sup>",
                    );
                    text = text
                      .split(/(<[^>]+>)/g)
                      .map((x, j) =>
                        j % 2
                          ? x
                          : x.replace(/[A-Za-z]+/g, (letters) =>
                              ["sin", "cos", "tan", "log"].includes(letters)
                                ? letters
                                : "<i>" + letters + "</i>",
                            ),
                      )
                      .join("");
                    return '<span class="m">' + text + "</span>";
                  },
                ),
          )
          .join("");
      }
      function stepsHTML(mid) {
        return lessonSteps(mid);
      }
      function formulaHTML() {
        return (
          '<div class="formula"><b>公式</b>' +
          mathHTML("(kxⁿ)′ = k·n xⁿ⁻¹") +
          "<br><small>" +
          mathHTML("n") +
          " は正の整数。定数の微分は " +
          mathHTML("0") +
          "</small></div>"
        );
      }
      function fitMath() {
        document
          .querySelectorAll(".problem,.choice,.eqpart,.ask")
          .forEach((e) => {
            e.style.fontSize = "";
            const max = e.classList.contains("eqpart")
              ? e.parentElement.clientWidth
              : e.clientWidth;
            let size = parseFloat(getComputedStyle(e).fontSize);
            while (e.scrollWidth > max + 1 && size > 15) {
              size -= 0.5;
              e.style.fontSize = size + "px";
            }
          });
      }
      function menuIcon(kind) {
        const texts = [
          "x³ → 3x²",
          "2x³ → 6x²",
          '<span class="fraction"><span class="numerator">1</span><span class="denominator">2</span></span>x²',
          "x³ + 2x² − 3x",
          "(x + 1)² → f′(a)",
        ];
        if (!ADVANCED)
          return (
            '<span class="menu-math">' + lessonMath(texts[kind]) + "</span>"
          );
        const drawings = [
          '<rect x="10" y="6" width="25" height="16"/><rect x="43" y="6" width="25" height="16"/><rect x="10" y="29" width="25" height="16"/><rect x="43" y="29" width="25" height="16"/><text x="19" y="18">ア</text><text x="52" y="18">イ</text><text x="19" y="41">ウ</text><text x="52" y="41">エ</text>',
          '<rect x="7" y="12" width="67" height="30"/><path d="M58 17V36"/><text x="14" y="32">2x²</text>',
          '<circle cx="39" cy="29" r="18"/><path d="M39 11V5M32 5H46M39 29V17M39 29L49 34"/>',
          '<path d="M18 46V7L62 7L51 18L62 29H18"/><path d="M31 12L43 24M43 12L31 24"/>',
        ];
        return (
          '<svg viewBox="0 0 80 52" aria-hidden="true"><g fill="none" stroke="#1f4e8c" stroke-width="1.6">' +
          drawings[kind].replace(
            /<text/g,
            '<text fill="#1f4e8c" stroke="none" font-size="12"',
          ) +
          "</g></svg>"
        );
      }
      // 等号を独立した要素にし、折り返しの前後でも左右の間隔を保つ。
      function lessonMath(html) {
        return mathHTML(html)
          .split(/(<[^>]+>)/g)
          .map((s, i) =>
            i % 2 ? s : s.replace(/\s*=\s*/g, '<span class="equal">=</span>'),
          )
          .join("");
      }
      function lessonSteps(mid) {
        return String(mid)
          .replace(/<br\s*\/?\s*>/g, "。")
          .split(/(?:。|、つまり |、(?=y =)| なので、?| なので | より )/)
          .filter(Boolean)
          .map(
            (line) =>
              '<div class="equation">' +
              line
                .split(" = ")
                .map(
                  (s, i) =>
                    '<span class="eqpart">' +
                    (i ? '<span class="equal">=</span>' : "") +
                    lessonMath(s) +
                    "</span>",
                )
                .join("<wbr>") +
              "</div>",
          )
          .join("");
      }

      window.addEventListener("resize", fitMath);
      // 出題内容は元の教材を保持。表示と進行をここでまとめる。
      const $ = (id) => document.getElementById(id);
      let mode = "normal",
        lev = 1,
        questions = [],
        index = 0,
        score = 0,
        stage = 0,
        done = false,
        options = [],
        wrong = [],
        started = 0,
        timer;
      const modeNames = {
        normal: "通常モード",
        input: "入力モード",
        hundred: "全問連続モード",
        hell: "超鬼連チャンモード",
      };
      function shuffled(a) {
        return a
          .map((x) => [Math.random(), x])
          .sort((a, b) => a[0] - b[0])
          .map((x) => x[1]);
      }
      function timed() {
        return ADVANCED && (mode === "hundred" || mode === "hell");
      }
      function menu() {
        clearInterval(timer);
        $("menu").hidden = false;
        $("quiz").hidden = true;
        $("result").hidden = true;
      }
      function start(value) {
        clearInterval(timer);
        if (ADVANCED) {
          mode = value;
          currentMode = value;
          questions = timed() ? shuffled(problemPool) : getRandomQuestions(10);
        } else {
          lev = value;
          questions = shuffled(LEVELS[lev - 1].problems);
        }
        index = score = 0;
        wrong = [];
        started = Date.now();
        $("timer").textContent = timed() ? "0分0秒" : "";
        $("menu").hidden = true;
        $("result").hidden = true;
        $("quiz").hidden = false;
        timer = setInterval(() => {
          $("timer").textContent = timed() ? elapsed() : "";
        }, 250);
        load();
        window.scrollTo(0, 0);
      }
      function elapsed() {
        const s = Math.floor((Date.now() - started) / 1000);
        return Math.floor(s / 60) + "分" + (s % 60) + "秒";
      }
      function details() {
        const q = questions[index];
        if (ADVANCED) {
          const i = info(q);
          return {
            lead: i.lead,
            plan: i.plan,
            mid: i.mid,
            answer: i.ans,
            opts: q.options.map((text, n) => ({ text, ok: n === q.correct })),
          };
        }
        const b = build(lev, q);
        return {
          lead:
            '<div>次の関数について求めなさい。</div><div class="problem">f(x) = ' +
            b.fTxt +
            "</div>" +
            b.ask,
          ...b,
        };
      }
      function load() {
        stage = 0;
        done = false;
        const d = details();
        $("status").textContent =
          (ADVANCED ? modeNames[mode] : "レベル " + lev) +
          "　" +
          (index + 1) +
          " / " +
          questions.length;
        $("bar").style.width = (index / questions.length) * 100 + "%";
        $("question").innerHTML = mathHTML(d.lead.replace(/<br><br>/g, "<br>"));
        $("hints").innerHTML = "";
        $("feedback").hidden = true;
        $("next").hidden = true;
        $("help").hidden = timed();
        $("inputSection").hidden = !(ADVANCED && mode === "input");
        $("choices").hidden = ADVANCED && mode === "input";
        $("answerInput").value = "";
        $("inputFeedback").textContent = "";
        $("submit").disabled = false;
        $("answerInput").disabled = false;
        options = shuffled(d.opts);
        $("choices").innerHTML = options
          .map(
            (o, n) =>
              '<button class="choice" data-label="' +
              ["ア", "イ", "ウ", "エ"][n] +
              '" onclick="choose(' +
              n +
              ')">' +
              mathHTML(o.text) +
              "</button>",
          )
          .join("");
        fitMath();
      }
      function hints() {
        if (done) return;
        stage++;
        if (stage >= 3) {
          finish(false);
          return;
        }
        const d = details();
        $("hints").innerHTML =
          '<div class="hint-box"><span class="hint-tag">' +
          (stage === 1 ? "考え方" : "途中式") +
          "</span>" +
          formulaHTML() +
          (stage === 1 ? mathHTML(d.plan) : stepsHTML(d.mid)) +
          "</div>";
        fitMath();
      }
      function choose(n) {
        if (done) return;
        const ok = options[n].ok;
        if (timed()) {
          if (ok) score++;
          else
            wrong.push({
              q: questions[index],
              number: index + 1,
              chosen: options[n].text,
            });
          if (!ok && mode === "hell") {
            results();
            return;
          }
          advance();
          return;
        }
        if (ok) {
          finish(true);
          return;
        }
        $("choices").children[n].classList.add("incorrect");
        $("choices").children[n].disabled = true;
        hints();
      }
      function submit() {
        if (done) return;
        const v = $("answerInput").value.trim();
        if (!v) {
          $("inputFeedback").textContent = "答えを入力してください。";
          return;
        }
        if (!parsePoly(v)) {
          $("inputFeedback").textContent =
            "式を読み取れません。例：2x² + 3（2x^2 + 3 でも入力できます）";
          return;
        }
        if (samePoly(v, questions[index].options[questions[index].correct]))
          finish(true);
        else {
          $("inputFeedback").textContent =
            "もう一度、下のヒントを見て考えよう。";
          hints();
        }
      }
      function reveal() {
        if (!done) {
          stage = 3;
          finish(false);
        }
      }
      function finish(ok) {
        done = true;
        if (ok && stage === 0) score++;
        const d = details();
        $("feedback").hidden = false;
        $("feedback").className = "feedback " + (ok ? "correct" : "");
        $("feedback").innerHTML =
          "<strong>" +
          (ok ? "正解" : "答えを確認しよう") +
          '</strong><div class="problem">' +
          mathHTML(d.answer || d.ans) +
          "</div>" +
          stepsHTML(d.mid);
        $("hints").innerHTML = "";
        $("help").hidden = true;
        $("next").hidden = false;
        $("next").textContent =
          index + 1 === questions.length ? "結果を見る" : "次の問題へ";
        $("submit").disabled = true;
        $("answerInput").disabled = true;
        [...$("choices").children].forEach((e, n) => {
          e.disabled = true;
          if (options[n].ok) e.classList.add("correct");
        });
        fitMath();
      }
      function advance() {
        index++;
        if (index >= questions.length) results();
        else {
          load();
          window.scrollTo(0, 0);
        }
      }
      function results() {
        clearInterval(timer);
        $("quiz").hidden = true;
        $("result").hidden = false;
        const attempted = timed()
          ? Math.min(index + 1, questions.length)
          : questions.length;
        $("result").innerHTML =
          '<h2>学習の結果</h2><p class="result-score">' +
          score +
          " / " +
          (mode === "hell" && ADVANCED ? attempted : questions.length) +
          " 問</p><p>" +
          (timed()
            ? "記録：" +
              elapsed() +
              (mode === "hell" && wrong.length ? "（不正解で終了）" : "")
            : "ヒントを使わずに正解した問題の数です。") +
          '</p><div class="result-nav"><button class="primary" onclick="start(ADVANCED?mode:lev)">もう一度</button>' +
          (!ADVANCED && lev < 5
            ? '<button onclick="start(lev+1)">次のレベルへ</button>'
            : "") +
          '<button onclick="menu()">' +
          (ADVANCED ? "モード" : "レベル") +
          'を選ぶ</button><a href="../index.html">ほかの教材へ</a></div>' +
          (wrong.length
            ? "<h3>間違えた問題を見直そう</h3>" +
              wrong
                .map(
                  (w, n) =>
                    '<div class="review-item"><details><summary>問題 ' +
                    w.number +
                    "：" +
                    mathHTML(w.q.q) +
                    "</summary><p>選んだ答え：" +
                    mathHTML(w.chosen) +
                    "</p><p>正しい答え：" +
                    mathHTML(info(w.q).ans) +
                    "</p>" +
                    stepsHTML(info(w.q).mid) +
                    graph(w.q) +
                    "</details></div>",
                )
                .join("")
            : "");
        window.scrollTo(0, 0);
        fitMath();
      }
      function graph(q) {
        let f = q.f || readPoly(q.q);
        if (q.custom)
          f = q.q.includes("ax²")
            ? [
                [2, 2],
                [3, 1],
              ]
            : [
                [1, 2],
                [3, 1],
              ];
        const a = q.at ?? (q.custom ? (q.q.includes("ax²") ? 2 : 1) : 0);
        const val = (x) =>
          f.reduce(
            (s, [c, n]) => s + (Array.isArray(c) ? c[0] / c[1] : c) * x ** n,
            0,
          );
        const slope = f.reduce(
          (s, [c, n]) =>
            s +
            (n ? (Array.isArray(c) ? c[0] / c[1] : c) * n * a ** (n - 1) : 0),
          0,
        );
        const xs = Array.from({ length: 101 }, (_, i) => a - 2 + i / 25),
          ys = xs.map(val),
          ts = xs.map((x) => val(a) + slope * (x - a));
        const lo = Math.min(0, ...ys, ...ts) - 1,
          hi = Math.max(0, ...ys, ...ts) + 1;
        const X = (x) => 25 + (x - a + 2) * 62.5,
          Y = (y) => 170 - ((y - lo) / (hi - lo)) * 150;
        const path = (v) =>
          v
            .map(
              (y, i) =>
                (i ? "L" : "M") + X(xs[i]).toFixed(2) + " " + Y(y).toFixed(2),
            )
            .join(" ");
        return (
          '<svg viewBox="0 0 300 200" role="img" aria-label="関数と接線のグラフ"><path d="M25 ' +
          Y(0) +
          "H275" +
          (a - 2 <= 0 && a + 2 >= 0 ? "M" + X(0) + " 20V170" : "") +
          '" stroke="#aaa" fill="none"/><path d="' +
          path(ys) +
          '" stroke="#1f4e8c" stroke-width="2" fill="none"/><path d="' +
          path(ts) +
          '" stroke="#d9480f" stroke-width="2" fill="none"/><circle cx="' +
          X(a) +
          '" cy="' +
          Y(val(a)) +
          '" r="3" fill="#d9480f"/><text x="25" y="190" font-size="12" font-family="STIX Two Text,serif">' +
          String(a - 2).replace(/-/g, "−") +
          '</text><text x="265" y="190" font-size="12" font-family="STIX Two Text,serif">' +
          String(a + 2).replace(/-/g, "−") +
          "</text></svg><small>紺：関数のグラフ　橙：" +
          mathHTML("x = " + a) +
          " の接線（接点 " +
          mathHTML("(" + a + ", " + numTxt(valueAt(f, a)) + ")") +
          "）</small>"
        );
      }
      function insertText(s) {
        const e = $("answerInput");
        e.setRangeText(s, e.selectionStart, e.selectionEnd, "end");
        e.focus();
      }
      $("answerInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          if (done) advance();
          else submit();
        }
      });
      $("menuGrid").innerHTML = ADVANCED
        ? Object.entries(modeNames)
            .map(
              ([key, name], i) =>
                '<button class="menu-card" onclick="start(\'' +
                key +
                "')\">" +
                menuIcon(i) +
                "<b>" +
                name +
                "</b><small>" +
                [
                  "10問・選択式",
                  "10問・式を入力",
                  "全" + problemPool.length + "問・時間を計測",
                  "全" + problemPool.length + "問・1回の間違いで終了",
                ][i] +
                "</small></button>",
            )
            .join("")
        : LEVELS.map(
            (l, i) =>
              '<button class="menu-card" onclick="start(' +
              (i + 1) +
              ')">' +
              menuIcon(i) +
              "<b>レベル " +
              (i + 1) +
              "</b><span>" +
              [
                "べきの微分",
                "係数のある式",
                "分数の係数",
                "多項式",
                "展開・微分係数",
              ][i] +
              "</span><small>" +
              l.problems.length +
              "問</small></button>",
          ).join("");
      menu();
    </script>
  </body>
</html>
