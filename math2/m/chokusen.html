    <style>

<body class="u-theme">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container">
        <header class="header">
            <h1>📐 直線の方程式クイズ</h1>
            <p>点と傾き・2 点から、直線の方程式を求めよう！（全11問）</p>
        </header>

        <main class="quiz-container">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- 【ブラッシュアップ】問題はスクリプトの questions から作る -->
            <div id="cards"></div>

            <!-- 結果画面 -->
            <div class="result-card" id="result">
                <h2>🎉 クイズ完了！</h2>
                <div class="score" id="scoreDisplay">0/5</div>
                <p id="resultMessage">お疲れさまでした！</p>
                <!-- 【ブラッシュアップ】次の教材・ほかの教材も選べるようにした -->
                <div class="result-nav">
                    <button class="again" onclick="restartQuiz()">もう一度挑戦</button>
                    <a class="next" href="sessen.html">つぎは「接線の方程式」へ ▶</a>
                    <a href="../remake.html">ほかの教材をえらぶ</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 【ブラッシュアップ】問題を 5 問 → 11 問にし、段階をつけた
        //   1〜5 ：点と傾き（先生の 5 問）
        //   6    ：傾きが分数
        //   7・8 ：傾き 0（y = b）と、x 軸に垂直な直線（x = a）
        //   9〜11：2 点を通る直線（11 は傾きが分数）
        //   答えは y = mx + n（x 軸に垂直なときは x = a）にそろえた。数は [分子, 分母] でも書ける。
        //   wrong は まちがいの選択肢：[傾き, 切片] か { x: 数 }（x = 数 の直線）
        const questions = [
            { type: 'ps', p: [1, 3], m: 4,        wrong: [[4, -11], [3, 1], [4, 3]] },
            { type: 'ps', p: [-2, 5], m: -3,      wrong: [[-3, 11], [3, 11], [-3, 5]] },
            { type: 'ps', p: [0, -1], m: 2,       wrong: [[2, 1], [-1, 2], [2, 0]] },
            { type: 'ps', p: [3, -4], m: 3,       wrong: [[3, -5], [3, 13], [3, -9]] },
            { type: 'ps', p: [-1, -2], m: -2,     wrong: [[-2, 4], [-2, -3], [2, 0]] },
            { type: 'ps', p: [4, 1], m: [1, 2],   wrong: [[[1, 2], -3], [2, -7], [[1, 2], 1]] },
            { type: 'ps', p: [2, -3], m: 0,       wrong: [{ x: 2 }, [-3, 0], { x: -3 }] },
            { type: '2p', p: [2, 1], r: [2, 5],   wrong: [[0, 2], [0, 3], [4, -7]] },
            { type: '2p', p: [1, 2], r: [3, 8],   wrong: [[[1, 3], [5, 3]], [3, 2], [-3, 5]] },
            { type: '2p', p: [-1, 4], r: [3, -4], wrong: [[2, 6], [[-1, 2], [7, 2]], [-2, 6]] },
            { type: '2p', p: [1, 3], r: [4, 5],   wrong: [[[3, 2], [3, 2]], [[2, 3], 3], [[2, 3], [11, 3]]] }
        ];

        // ---- 分数の計算（[分子, 分母]） ----
        const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
        const F = (v) => { let [p, q] = Array.isArray(v) ? v : [v, 1]; if (q < 0) { p = -p; q = -q; } const g = gcd(p, q) || 1; return [p / g, q / g]; };
        const add = (a, b) => F([a[0] * b[1] + b[0] * a[1], a[1] * b[1]]);
        const mul = (a, b) => F([a[0] * b[0], a[1] * b[1]]);
        const neg = (a) => [-a[0], a[1]];
        const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
        const MINUS = '−';
        const frac = (p, q) => `<span class="fraction"><span class="numerator">${p}</span><span class="denominator">${q}</span></span>`;
        const absTxt = (a) => (a[1] === 1 ? String(Math.abs(a[0])) : frac(Math.abs(a[0]), a[1]));
        const numTxt = (a) => (a[0] < 0 ? MINUS : '') + absTxt(a);
        const coefTxt = (a) => (a[0] === 1 && a[1] === 1 ? '' : a[0] === -1 && a[1] === 1 ? MINUS : numTxt(a));
        const plusTxt = (a) => (a[0] < 0 ? ` ${MINUS} ` : ' + ') + absTxt(a);   // 2 項目以降の「+ 3」「− 3」
        const shift = (v, name) => (v[0] === 0 ? name : name + plusTxt(neg(v)));   // x − a の形
        const pt = (p) => `(${numTxt(F(p[0]))}, ${numTxt(F(p[1]))})`;

        // 直線の表し方：{ m, n }（y = mx + n）か { x }（x = 数）
        function lineTxt(L) {
            if (L.x !== undefined) return 'x = ' + numTxt(L.x);
            if (L.m[0] === 0) return 'y = ' + numTxt(L.n);
            return 'y = ' + coefTxt(L.m) + 'x' + (L.n[0] === 0 ? '' : plusTxt(L.n));
        }
        const toLine = (w) => (Array.isArray(w) ? { m: F(w[0]), n: F(w[1]) } : { x: F(w.x) });
        const sameLine = (a, b) => (a.x !== undefined || b.x !== undefined)
            ? (a.x !== undefined && b.x !== undefined && eq(a.x, b.x))
            : (eq(a.m, b.m) && eq(a.n, b.n));

        // 問題ごとに、正解の直線・問題文・ヒント（方針 → 途中式 → 答え）を作る
        function build(q) {
            const a = F(q.p[0]), b = F(q.p[1]);
            let line, text, plan, mid;
            if (q.type === '2p' && q.p[0] === q.r[0]) {
                line = { x: a };
                text = `2 点 ${pt(q.p)}、${pt(q.r)} を通る直線の方程式はどれか？`;
                plan = '2 点の x 座標が同じだね。傾きの式の分母が 0 になるので、傾きは求められない。この直線は x 軸に垂直で、x = （一定の数）の形になるよ。';
                mid = `どちらの点も x 座標が ${numTxt(a)} なので、この直線上の点はすべて x 座標が ${numTxt(a)}`;
            } else {
                let m;
                if (q.type === '2p') {
                    const dy = add(F(q.r[1]), neg(b)), dx = add(F(q.r[0]), neg(a));
                    m = mul(dy, [dx[1], dx[0]]);
                    text = `2 点 ${pt(q.p)}、${pt(q.r)} を通る直線の方程式はどれか？`;
                    plan = 'まず傾き m = ' + frac('y の増加量', 'x の増加量') + ' を求めよう。そのあと、点 (a, b) を通り傾き m の直線 y − b = m(x − a) に入れて、y = mx + n の形に整理しよう。';
                    mid = `傾きは ${frac(numTxt(F(q.r[1])) + ' ' + MINUS + ' ' + (q.p[1] < 0 ? '(' + numTxt(b) + ')' : numTxt(b)), numTxt(F(q.r[0])) + ' ' + MINUS + ' ' + (q.p[0] < 0 ? '(' + numTxt(a) + ')' : numTxt(a)))} = ${numTxt(m)}。点 ${pt(q.p)} を通るので `;
                } else {
                    m = F(q.m);
                    text = `点 ${pt(q.p)} を通り、傾きが ${numTxt(m)} の直線の方程式はどれか？`;
                    plan = m[0] === 0
                        ? '傾きが 0 の直線は x 軸に平行で、y = （一定の数）の形になるよ。公式 y − b = m(x − a) に入れてみよう。'
                        : '点 (a, b) を通り傾き m の直線は y − b = m(x − a)。代入してから、y = mx + n の形に整理しよう。';
                    mid = '';
                }
                const n = add(mul(neg(m), a), b);
                line = { m, n };
                if (m[0] === 0) {
                    mid += `${shift(b, 'y')} = 0·(${shift(a, 'x')})、つまり ${shift(b, 'y')} = 0`;
                } else {
                    const ma = mul(neg(m), a);   // −ma
                    mid += `${shift(b, 'y')} = ${a[0] === 0 ? coefTxt(m) + 'x' : coefTxt(m) + '(' + shift(a, 'x') + ')'}、` +
                        `y = ${coefTxt(m)}x${ma[0] === 0 ? '' : plusTxt(ma)}${b[0] === 0 ? '' : plusTxt(b)}`;
                }
            }
            const answer = lineTxt(line);
            const opts = [{ text: answer, ok: true }].concat(q.wrong.map(w => { const L = toLine(w); return { text: lineTxt(L), ok: sameLine(L, line) }; }));
            return { text, plan, mid, answer, opts };
        }

        let currentQuestion = 0;
        let score = 0;
        let stage = 0;       // 【ブラッシュアップ】この問題のヒントの段階（0：なし 1：方針 2：途中式 3：答え）
        let answered = false;
        let built = null;
        let order = [];

        function renderQuestion() {
            built = build(questions[currentQuestion]);
            order = built.opts.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            stage = 0;
            answered = false;
            document.getElementById('cards').innerHTML = `
                <div class="question-card active">
                    <div class="question-number">問題 ${currentQuestion + 1}/${questions.length}</div>
                    <div class="question-text">${built.text}</div>
                    <div class="options">
                        ${order.map((o, i) => `<button class="option" id="opt${i}" onclick="selectOption(${i})">${built.opts[o].text}</button>`).join('')}
                    </div>
                    <div id="feedback"></div>
                    <div class="hint-content" id="hint1"><h5>💡 ヒント1（方針）</h5><p>${built.plan}</p></div>
                    <div class="hint-content" id="hint2"><h5>✏️ ヒント2（途中式）</h5><p>${built.mid}</p></div>
                    <div class="hint-buttons" id="hintButtons">
                        <button class="hint-btn" onclick="showHint(1)">💡 ヒント1（方針）</button>
                        <button class="hint-btn" onclick="showHint(2)">✏️ ヒント2（途中式）</button>
                        <button class="hint-btn plain" onclick="showHint(3)">👀 答えを見る</button>
                    </div>
                </div>`;
            updateProgress();
            window.scrollTo(0, 0);
        }

        // ヒントを見る（まちがえたときは自動で 1 段ずつすすむ）。3 段目は答え
        function showHint(n) {
            if (answered) return;
            stage = Math.max(stage, n);
            if (stage >= 3) { finish(false); return; }
            for (let i = 1; i <= 2; i++) document.getElementById('hint' + i).classList.toggle('show', i <= stage);
        }

        function selectOption(i) {
            if (answered) return;
            const btn = document.getElementById('opt' + i);
            if (built.opts[order[i]].ok) { finish(true, btn); return; }
            btn.classList.add('incorrect');
            btn.disabled = true;
            const next = stage + 1;
            document.getElementById('feedback').innerHTML = next >= 3 ? '' :
                `<div class="wrong-explanation show"><h4>ちがうよ</h4><p>すぐ下の${next === 1 ? 'ヒント1（方針）' : 'ヒント2（途中式）'}を見て、もう一度考えよう。</p></div>`;
            showHint(next);
        }

        function finish(correct, btn) {
            answered = true;
            if (correct && stage === 0) score++;
            document.querySelectorAll('#cards .option').forEach((b, i) => {
                b.disabled = true;
                if (built.opts[order[i]].ok) b.classList.add('correct');
            });
            document.getElementById('hintButtons').style.display = 'none';
            document.getElementById('hint1').classList.remove('show');
            document.getElementById('hint2').classList.remove('show');
            const last = currentQuestion >= questions.length - 1;
            document.getElementById('feedback').innerHTML = `
                <div class="${correct ? 'success-message' : 'answer-message'} show">${correct ? '⭕ 正解！' : '👀 答え：' + built.answer}</div>
                <div class="explanation show"><h4>解説</h4><p>${built.mid}。<br>よって <strong>${built.answer}</strong></p></div>
                <button class="next-btn show" onclick="${last ? 'showResult()' : 'nextQuestion()'}">${last ? '結果を見る' : '次の問題へ'}</button>`;
            updateProgress(true);
        }

        function nextQuestion() {
            currentQuestion++;
            renderQuestion();
        }

        function showResult() {
            document.getElementById('cards').innerHTML = '';
            document.getElementById('result').classList.add('show');
            document.getElementById('scoreDisplay').innerHTML = `${score}/${questions.length}<div class="score-label">ヒントなしで一発正解した数</div>`;
            let message = '';
            if (score === questions.length) message = '🎊 全問、ヒントなしで一発正解！完璧です！';
            else if (score >= Math.ceil(questions.length * 0.6)) message = 'よくできました！まちがえた問題は、解説の途中式をもう一度たどってみよう。';
            else message = '「傾き → 公式 y − b = m(x − a) → 整理」の順番を確認して、もう一度挑戦しよう！';
            document.getElementById('resultMessage').textContent = message;
            updateProgress(true);
            window.scrollTo(0, 0);
        }

        // 【ブラッシュアップ】元は最初から 20% になっていて、1 問目に正解しても 20% のままだった。解き終えた問題の数で進める
        function updateProgress(done) {
            const n = currentQuestion + (done ? 1 : 0);
            document.getElementById('progressBar').style.width = (n / questions.length * 100) + '%';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('result').classList.remove('show');
            renderQuestion();
        }

        // 【ブラッシュアップ】式の表記を教科書にそろえる：文字（x・f など）は斜体、数字は立体、書体は問題の式と同じ数式用。
        //   選択肢・ヒント・解説の中の英数字のまとまりを <span class="m"> で包み、文字を <i> にする（日本語はふつうの書体のまま）
        const MATH_RUN = /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()=+\-−·×÷\/.,<>\[\] ]*[A-Za-z0-9][A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()=+\-−·×÷\/.,<>\[\] ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .hint-tag, .no-math, script, style, .katex')) continue;
                if (/[A-Za-z0-9]/.test(n.nodeValue)) nodes.push(n);
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    const span = document.createElement('span');
                    span.className = 'm';
                    text.split(/([A-Za-z]+)/).forEach((part, k) => {
                        if (!part) return;
                        if (k % 2) { const i = document.createElement('i'); i.textContent = part; span.appendChild(i); }
                        else span.appendChild(document.createTextNode(part.replace(/-/g, '−')));   // マイナスは数式の「−」に
                    });
                    frag.appendChild(span);
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        // 画面が書きかわるたびに、指定した場所の式を整える
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        document.addEventListener('DOMContentLoaded', () => { renderQuestion(); watchMath(['.question-text', '.options', '#feedback', '.hint-content p']); });
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".header h1": "u-title",
    ".option": "u-choice",
    ".option.correct": "u-ok",
    ".option.incorrect": "u-ng",
    ".hint-btn:not(.plain)": "u-btn",
    ".hint-btn.plain": "u-btn u-btn-plain",
    ".next-btn": "u-btn u-btn-blue",
    ".result-nav .again": "u-btn",
    ".result-nav .next": "u-btn u-btn-blue"
  });
</script>
</body>
</html>
