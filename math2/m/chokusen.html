  <body>
    <a class="port-back" href="../index.html">← 教材の一覧へ</a>
    <main class="wrap">
      <header class="head">
        <small>数学Ⅱ　微分・積分</small>
        <h1>直線の方程式</h1>
      </header>
      <section id="menu">
        <p>点と傾き・2点・水平と垂直の直線を、全11問で練習します。</p>
        <div class="menu-grid">
          <button class="menu-card" onclick="start()">
            <span class="example" id="menuExample"></span><b>練習を始める</b>
          </button>
        </div>
      </section>
      <section id="quiz" hidden>
        <div class="toolbar">
          <span id="status" class="question-no"></span
          ><button onclick="start()">もう一度やり直す</button
          ><button onclick="showMenu()">最初の画面へ</button>
        </div>
        <div class="quiz-grid">
          <div>
            <div id="question" class="ask"></div>
            <div id="figure" class="figure"></div>
            <div id="hints"></div>
            <div id="feedback" hidden aria-live="polite"></div>
          </div>
          <div class="answer-panel">
            <div id="choices" class="choices"></div>
            <div id="help" class="controls">
              <button onclick="showHint(1)">考え方</button
              ><button onclick="showHint(2)">途中式</button
              ><button onclick="showHint(3)">答えを見る</button>
            </div>
            <button
              id="next"
              class="primary"
              onclick="nextQuestion()"
              hidden
            ></button>
          </div>
        </div>
      </section>
      <section id="result" hidden>
        <h2>学習の結果</h2>
        <p id="score" class="result-score"></p>
        <p>ヒントなしで正解した問題の数です。</p>
        <div class="result-nav">
          <button class="primary" onclick="start()">もう一度</button
          ><button onclick="showMenu()">最初の画面へ</button
          ><a href="sessen.html">次の教材へ</a
          ><a href="../index.html">ほかの教材へ</a>
        </div>
      </section>
    </main>
    <script>
      const TANGENT = false;
      const questions = [
        {
          type: "ps",
          p: [1, 3],
          m: 4,
          wrong: [
            [4, -11],
            [3, 1],
            [4, 3],
          ],
        },
        {
          type: "ps",
          p: [-2, 5],
          m: -3,
          wrong: [
            [-3, 11],
            [3, 11],
            [-3, 5],
          ],
        },
        {
          type: "ps",
          p: [0, -1],
          m: 2,
          wrong: [
            [2, 1],
            [-1, 2],
            [2, 0],
          ],
        },
        {
          type: "ps",
          p: [3, -4],
          m: 3,
          wrong: [
            [3, -5],
            [3, 13],
            [3, -9],
          ],
        },
        {
          type: "ps",
          p: [-1, -2],
          m: -2,
          wrong: [
            [-2, 4],
            [-2, -3],
            [2, 0],
          ],
        },
        {
          type: "ps",
          p: [4, 1],
          m: [1, 2],
          wrong: [
            [[1, 2], -3],
            [2, -7],
            [[1, 2], 1],
          ],
        },
        { type: "ps", p: [2, -3], m: 0, wrong: [{ x: 2 }, [-3, 0], { x: -3 }] },
        {
          type: "2p",
          p: [2, 1],
          r: [2, 5],
          wrong: [
            [0, 2],
            [0, 3],
            [4, -7],
          ],
        },
        {
          type: "2p",
          p: [1, 2],
          r: [3, 8],
          wrong: [
            [
              [1, 3],
              [5, 3],
            ],
            [3, 2],
            [-3, 5],
          ],
        },
        {
          type: "2p",
          p: [-1, 4],
          r: [3, -4],
          wrong: [
            [2, 6],
            [
              [-1, 2],
              [7, 2],
            ],
            [-2, 6],
          ],
        },
        {
          type: "2p",
          p: [1, 3],
          r: [4, 5],
          wrong: [
            [
              [3, 2],
              [3, 2],
            ],
            [[2, 3], 3],
            [
              [2, 3],
              [11, 3],
            ],
          ],
        },
      ];

      // ---- 分数の計算（[分子, 分母]） ----
      const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
      const F = (v) => {
        let [p, q] = Array.isArray(v) ? v : [v, 1];
        if (q < 0) {
          p = -p;
          q = -q;
        }
        const g = gcd(p, q) || 1;
        return [p / g, q / g];
      };
      const add = (a, b) => F([a[0] * b[1] + b[0] * a[1], a[1] * b[1]]);
      const mul = (a, b) => F([a[0] * b[0], a[1] * b[1]]);
      const neg = (a) => [-a[0], a[1]];
      const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
      const MINUS = "−";
      const frac = (p, q) =>
        `<span class="fraction"><span class="numerator">${p}</span><span class="denominator">${q}</span></span>`;
      const absTxt = (a) =>
        a[1] === 1 ? String(Math.abs(a[0])) : frac(Math.abs(a[0]), a[1]);
      const numTxt = (a) => (a[0] < 0 ? MINUS : "") + absTxt(a);
      const coefTxt = (a) =>
        a[0] === 1 && a[1] === 1
          ? ""
          : a[0] === -1 && a[1] === 1
            ? MINUS
            : numTxt(a);
      const plusTxt = (a) => (a[0] < 0 ? ` ${MINUS} ` : " + ") + absTxt(a); // 2 項目以降の「+ 3」「− 3」
      const shift = (v, name) => (v[0] === 0 ? name : name + plusTxt(neg(v))); // x − a の形
      const pt = (p) => `(${numTxt(F(p[0]))}, ${numTxt(F(p[1]))})`;

      // 直線の表し方：{ m, n }（y = mx + n）か { x }（x = 数）
      function lineTxt(L) {
        if (L.x !== undefined) return "x = " + numTxt(L.x);
        if (L.m[0] === 0) return "y = " + numTxt(L.n);
        return "y = " + coefTxt(L.m) + "x" + (L.n[0] === 0 ? "" : plusTxt(L.n));
      }
      const toLine = (w) =>
        Array.isArray(w) ? { m: F(w[0]), n: F(w[1]) } : { x: F(w.x) };
      const sameLine = (a, b) =>
        a.x !== undefined || b.x !== undefined
          ? a.x !== undefined && b.x !== undefined && eq(a.x, b.x)
          : eq(a.m, b.m) && eq(a.n, b.n);

      // 問題ごとに、正解の直線・問題文・ヒント（方針 → 途中式 → 答え）を作る
      function build(q) {
        const a = F(q.p[0]),
          b = F(q.p[1]);
        let line, text, plan, mid;
        if (q.type === "2p" && q.p[0] === q.r[0]) {
          line = { x: a };
          text = `2 点 ${pt(q.p)}、${pt(q.r)} を通る直線の方程式はどれか？`;
          plan =
            "2 点の x 座標が同じだね。傾きの式の分母が 0 になるので、傾きは求められない。この直線は x 軸に垂直で、x = （一定の数）の形になるよ。";
          mid = `どちらの点も x 座標が ${numTxt(a)} なので、この直線上の点はすべて x 座標が ${numTxt(a)}`;
        } else {
          let m;
          if (q.type === "2p") {
            const dy = add(F(q.r[1]), neg(b)),
              dx = add(F(q.r[0]), neg(a));
            m = mul(dy, [dx[1], dx[0]]);
            text = `2 点 ${pt(q.p)}、${pt(q.r)} を通る直線の方程式はどれか？`;
            plan =
              "まず傾き m = " +
              frac("y の増加量", "x の増加量") +
              " を求めよう。そのあと、点 (a, b) を通り傾き m の直線 y − b = m(x − a) に入れて、y = mx + n の形に整理しよう。";
            mid = `傾きは ${frac(numTxt(F(q.r[1])) + " " + MINUS + " " + (q.p[1] < 0 ? "(" + numTxt(b) + ")" : numTxt(b)), numTxt(F(q.r[0])) + " " + MINUS + " " + (q.p[0] < 0 ? "(" + numTxt(a) + ")" : numTxt(a)))} = ${numTxt(m)}。点 ${pt(q.p)} を通るので `;
          } else {
            m = F(q.m);
            text = `点 ${pt(q.p)} を通り、傾きが ${numTxt(m)} の直線の方程式はどれか？`;
            plan =
              m[0] === 0
                ? "傾きが 0 の直線は x 軸に平行で、y = （一定の数）の形になるよ。公式 y − b = m(x − a) に入れてみよう。"
                : "点 (a, b) を通り傾き m の直線は y − b = m(x − a)。代入してから、y = mx + n の形に整理しよう。";
            mid = "";
          }
          const n = add(mul(neg(m), a), b);
          line = { m, n };
          if (m[0] === 0) {
            mid += `${shift(b, "y")} = 0·(${shift(a, "x")})、つまり ${shift(b, "y")} = 0`;
          } else {
            const ma = mul(neg(m), a); // −ma
            mid +=
              `${shift(b, "y")} = ${a[0] === 0 ? coefTxt(m) + "x" : coefTxt(m) + "(" + shift(a, "x") + ")"}、` +
              `y = ${coefTxt(m)}x${ma[0] === 0 ? "" : plusTxt(ma)}${b[0] === 0 ? "" : plusTxt(b)}`;
          }
        }
        const answer = lineTxt(line);
        const opts = [{ text: answer, ok: true }].concat(
          q.wrong.map((w) => {
            const L = toLine(w);
            return { text: lineTxt(L), ok: sameLine(L, line) };
          }),
        );
        return { text, plan, mid, answer, opts };
      }

      // 数式のHTMLは、文字だけ斜体・数字は立体。式の行と日本語の説明を分ける。
      function mathHTML(html) {
        return String(html)
          .split(/(<[^>]+>)/g)
          .map((part, i) =>
            i % 2
              ? part
              : part.replace(
                  /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()+−=×÷·.,^\- ]+/g,
                  (run) => {
                    if (!/[A-Za-z0-9ⁿ]/.test(run)) return run;
                    let text = run
                      .replace(/'/g, "′")
                      .replace(/-/g, "−")
                      .replace(/\^(\d+)/g, (_, n) => "<sup>" + n + "</sup>");
                    text = text.replace(
                      /[ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,
                      (x) =>
                        "<sup>" +
                        [...x]
                          .map((c) =>
                            c === "ⁿ"
                              ? "n"
                              : c === "⁻"
                                ? "−"
                                : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c),
                          )
                          .join("") +
                        "</sup>",
                    );
                    text = text
                      .split(/(<[^>]+>)/g)
                      .map((x, j) =>
                        j % 2
                          ? x
                          : x.replace(/[A-Za-z]+/g, (letters) =>
                              ["sin", "cos", "tan", "log"].includes(letters)
                                ? letters
                                : "<i>" + letters + "</i>",
                            ),
                      )
                      .join("");
                    return '<span class="m">' + text + "</span>";
                  },
                ),
          )
          .join("");
      }
      function fitMath() {
        document
          .querySelectorAll(".problem,.choice,.eqpart,.ask")
          .forEach((e) => {
            e.style.fontSize = "";
            const max = e.classList.contains("eqpart")
              ? e.parentElement.clientWidth
              : e.clientWidth;
            let size = parseFloat(getComputedStyle(e).fontSize);
            while (e.scrollWidth > max + 1 && size > 15) {
              size -= 0.5;
              e.style.fontSize = size + "px";
            }
          });
      }
      // 等号を独立した要素にし、折り返しの前後でも左右の間隔を保つ。
      function lessonMath(html) {
        return mathHTML(html)
          .split(/(<[^>]+>)/g)
          .map((s, i) =>
            i % 2 ? s : s.replace(/\s*=\s*/g, '<span class="equal">=</span>'),
          )
          .join("");
      }
      function lessonSteps(mid) {
        return String(mid)
          .replace(/<br\s*\/?\s*>/g, "。")
          .split(/(?:。|、つまり |、(?=y =)| なので、?| なので | より )/)
          .filter(Boolean)
          .map(
            (line) =>
              '<div class="equation">' +
              line
                .split(" = ")
                .map(
                  (s, i) =>
                    '<span class="eqpart">' +
                    (i ? '<span class="equal">=</span>' : "") +
                    lessonMath(s) +
                    "</span>",
                )
                .join("<wbr>") +
              "</div>",
          )
          .join("");
      }
      function graphSVG(fn, points = [], lines = [], range) {
        const xs = points.map((p) => p[0]);
        let xmin = range ? range[0] : Math.min(-3, ...xs) - 1,
          xmax = range ? range[1] : Math.max(3, ...xs) + 1;
        const samples = Array.from(
          { length: 121 },
          (_, i) => xmin + ((xmax - xmin) * i) / 120,
        );
        const ys = [
          0,
          ...points.map((p) => p[1]),
          ...samples.map((x) => (fn ? fn(x) : 0)),
          ...lines.flatMap((l) =>
            l.x !== undefined ? [] : samples.map((x) => l.m * x + l.n),
          ),
        ];
        let ymin = Math.min(...ys),
          ymax = Math.max(...ys),
          pad = Math.max(1, (ymax - ymin) * 0.12);
        ymin -= pad;
        ymax += pad;
        const X = (x) => 30 + ((x - xmin) / (xmax - xmin)) * 260,
          Y = (y) => 185 - ((y - ymin) / (ymax - ymin)) * 160;
        const path = (f) =>
          samples
            .map(
              (x, i) =>
                (i ? "L" : "M") + X(x).toFixed(2) + " " + Y(f(x)).toFixed(2),
            )
            .join(" ");
        const text = (x, y, t, anchor = "middle") =>
          '<text x="' +
          x +
          '" y="' +
          y +
          '" text-anchor="' +
          anchor +
          '" font-family="STIX Two Text,serif" font-size="13">' +
          String(t).replace(/-/g, "−") +
          "</text>";
        return (
          '<svg viewBox="0 0 320 215" role="img" aria-label="座標とグラフ"><path d="M30 ' +
          Y(0) +
          "H290" +
          (xmin <= 0 && xmax >= 0 ? "M" + X(0) + " 20V190" : "") +
          '" stroke="#aeb8c5" fill="none"/>' +
          text(301, Y(0) + 4, "x") +
          (xmin <= 0 && xmax >= 0 ? text(X(0) + 9, 15, "y") : "") +
          text(30, 207, xmin) +
          text(290, 207, xmax) +
          text(25, Y(Math.floor(ymax)) + 4, Math.floor(ymax), "end") +
          text(25, Y(Math.ceil(ymin)) + 4, Math.ceil(ymin), "end") +
          (fn
            ? '<path d="' +
              path(fn) +
              '" fill="none" stroke="#1f4e8c" stroke-width="2"/>'
            : "") +
          lines
            .map(
              (l) =>
                '<path d="' +
                (l.x !== undefined
                  ? "M" + X(l.x) + " 25V185"
                  : path((x) => l.m * x + l.n)) +
                '" stroke="#d9480f" stroke-width="2" fill="none"/>',
            )
            .join("") +
          points
            .map(
              (p, i) =>
                '<circle cx="' +
                X(p[0]) +
                '" cy="' +
                Y(p[1]) +
                '" r="3" fill="#d9480f"/>' +
                text(
                  X(p[0]) + 9,
                  Y(p[1]) - 8,
                  String.fromCharCode(65 + i),
                  "start",
                ),
            )
            .join("") +
          '</svg><div class="point-labels">' +
          points
            .map((p, i) =>
              lessonMath(
                String.fromCharCode(65 + i) + "(" + p[0] + ", " + p[1] + ")",
              ),
            )
            .join("　") +
          "</div>"
        );
      }

      const $ = (id) => document.getElementById(id);
      let currentQuestion = 0,
        score = 0,
        stage = 0,
        answered = false,
        built,
        options;
      function start() {
        currentQuestion = score = 0;
        $("menu").hidden = true;
        $("result").hidden = true;
        $("quiz").hidden = false;
        renderQuestion();
      }
      function showMenu() {
        $("menu").hidden = false;
        $("quiz").hidden = true;
        $("result").hidden = true;
      }
      function figure(reveal = false) {
        const q = questions[currentQuestion];
        if (TANGENT) {
          let points =
            q.type === "pt" || q.type === "x"
              ? [[q.a, eva(q.f, q.a)]]
              : q.p
                ? [q.p]
                : [];
          if (reveal)
            points = (q.xs || q.ts || [q.a]).map((x) => [x, eva(q.f, x)]);
          return graphSVG(
            (x) => eva(q.f, x),
            points,
            reveal ? built.lines.map((l) => ({ m: l[0], n: l[1] })) : [],
          );
        }
        const points = [q.p, ...(q.r ? [q.r] : [])];
        let lines = [];
        if (reveal) {
          if (q.r && q.r[0] === q.p[0]) lines = [{ x: q.p[0] }];
          else {
            const m =
              q.type === "ps"
                ? Array.isArray(q.m)
                  ? q.m[0] / q.m[1]
                  : q.m
                : (q.r[1] - q.p[1]) / (q.r[0] - q.p[0]);
            lines = [{ m, n: q.p[1] - m * q.p[0] }];
          }
        }
        return graphSVG(null, points, lines);
      }
      function renderQuestion() {
        built = build(questions[currentQuestion]);
        stage = 0;
        answered = false;
        options = built.opts
          .map((o) => ({ ...o, r: Math.random() }))
          .sort((a, b) => a.r - b.r);
        $("status").textContent =
          "問" +
          (currentQuestion + 1) +
          "　" +
          (currentQuestion + 1) +
          " / " +
          questions.length;
        $("question").innerHTML = lessonMath(built.text);
        $("figure").innerHTML = figure();
        $("hints").innerHTML = "";
        $("feedback").hidden = true;
        $("help").hidden = false;
        $("next").hidden = true;
        $("choices").innerHTML = options
          .map(
            (o, n) =>
              '<button class="choice" data-label="' +
              ["ア", "イ", "ウ", "エ"][n] +
              '" onclick="selectAnswer(' +
              n +
              ')">' +
              lessonMath(o.text) +
              "</button>",
          )
          .join("");
        fitMath();
        window.scrollTo(0, 0);
      }
      function showHint(n) {
        if (answered) return;
        stage = Math.max(stage, n);
        if (stage >= 3) {
          finish(false);
          return;
        }
        $("hints").innerHTML =
          '<div class="hint-box"><span class="hint-tag">' +
          (stage === 1 ? "考え方" : "途中式") +
          '</span><div class="formula"><b>公式</b>' +
          lessonMath(TANGENT ? "y − f(a) = f′(a)(x − a)" : "y − b = m(x − a)") +
          "</div>" +
          (stage === 1 ? lessonMath(built.plan) : lessonSteps(built.mid)) +
          "</div>";
        fitMath();
      }
      function selectAnswer(n) {
        if (answered) return;
        if (options[n].ok) {
          finish(true);
          return;
        }
        $("choices").children[n].disabled = true;
        $("choices").children[n].classList.add("incorrect");
        showHint(stage + 1);
      }
      function finish(ok) {
        answered = true;
        if (ok && stage === 0) score++;
        $("help").hidden = true;
        $("hints").innerHTML = "";
        $("feedback").hidden = false;
        $("feedback").className = "feedback " + (ok ? "correct" : "");
        $("feedback").innerHTML =
          "<strong>" +
          (ok ? "正解" : "答え") +
          "</strong>" +
          lessonSteps(built.mid) +
          '<div class="equation">' +
          lessonMath(built.answer) +
          "</div>";
        $("figure").innerHTML = figure(true);
        $("next").hidden = false;
        $("next").textContent =
          currentQuestion === questions.length - 1
            ? "結果を見る"
            : "次の問題へ";
        [...$("choices").children].forEach((e, n) => {
          e.disabled = true;
          if (options[n].ok) e.classList.add("correct");
        });
        fitMath();
      }
      function nextQuestion() {
        if (!answered) return;
        if (++currentQuestion < questions.length) renderQuestion();
        else {
          $("quiz").hidden = true;
          $("result").hidden = false;
          $("score").textContent = score + " / " + questions.length + " 問";
          window.scrollTo(0, 0);
        }
      }
      showMenu();

      $("menuExample").innerHTML = lessonMath("y − b = m(x − a)");
    </script>
  </body>
</html>
