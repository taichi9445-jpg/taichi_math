<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <!--
    数学Ⅱ 07. 接線の方程式（接線の方程式クイズ）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../../assets/port.css">
  <script src="../../assets/port.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接線の方程式クイズ</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100%;
            color: #333;
        }

        html, body {
            height: 100%;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .quiz-container {
            padding: 40px;
        }

        .progress {
            background: #f0f0f0;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 5px solid #4facfe;
        }

        .question-number {
            color: #4facfe;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #2c3e50;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .math-expression {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 15px;
            font-family: 'Times New Roman', serif;
            font-size: 1.4rem;
            font-weight: 600;
            text-align: center;
            margin: 20px 0;
            border: 3px solid #4facfe;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.1);
        }

        .options {
            display: grid;
            gap: 20px;
            margin-top: 35px;
        }

        .option {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border: 3px solid #dee2e6;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            font-family: 'Times New Roman', serif;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .option::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);
        }

        .option:hover::before {
            opacity: 1;
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .next-button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .next-button:hover {
            transform: translateY(-2px);
        }

        .score-display {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #666;
        }

        .final-score {
            text-align: center;
            padding: 40px;
        }

        .final-score h2 {
            color: #4facfe;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .restart-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .restart-button:hover {
            transform: translateY(-2px);
        }

        .correct-background {
            background: linear-gradient(135deg, #d4f4dd 0%, #c8f2d0 100%) !important;
            transition: background 0.5s ease;
        }

        .incorrect-background {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%) !important;
            transition: background 0.5s ease;
        }
    </style>
  <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    html, body { height: auto; }
    body { padding: 12px; }
    body.u-theme.correct-background { background: var(--u-ok-soft) !important; }
    body.u-theme.incorrect-background { background: var(--u-ng-soft) !important; }
    .container { overflow: visible; padding: 20px 16px; }
    .header { background: none; color: var(--u-ink); padding: 4px 4px 0; }
    .header h1 { font-size: min(2.3rem, 7vw); white-space: nowrap; margin: 0 0 6px; }
    .header p { color: var(--u-sub); font-weight: 700; opacity: 1; }
    .quiz-container { padding: 12px 4px; }
    .score-display { color: var(--u-soft-yellow-text); font-weight: 800; }
    .question-card { background: #f8fafc; border: 3px solid var(--u-line); border-left-width: 3px; border-radius: 24px; }
    .question-number { display: inline-block; background: var(--u-soft-yellow); color: var(--u-soft-yellow-text); padding: 4px 16px; border-radius: 999px; }
    .question-text { background: none !important; -webkit-text-fill-color: var(--u-ink); color: var(--u-ink); font-size: 1.25rem; }
    .math-expression { background: var(--u-soft-yellow); border: 3px dashed #fde68a; color: var(--u-ink); font-weight: 700; }
    .option::before { display: none; }
    .option { font-size: 1.3rem; font-weight: 700; text-align: center; }
    .feedback { border-radius: 16px; line-height: 1.7; }
    .feedback.correct { background: var(--u-ok-soft); color: var(--u-ok); border: 3px solid var(--u-ok-line); }
    .feedback.incorrect { background: var(--u-ng-soft); color: var(--u-ng); border: 3px solid var(--u-ng-line); }
    .feedback small { display: block; margin-top: 6px; color: var(--u-ink); font-size: 0.95rem; }
    .next-button { margin-top: 12px; }
    .final-score { background: #fff; border: 4px dashed var(--u-line); border-radius: 24px; padding: 28px 16px; }
    .final-score h2 { color: var(--u-accent-text); white-space: nowrap; font-size: min(2rem, 7.5vw); }
    .final-score div[style] { color: var(--u-title) !important; font-weight: 800; }
    .result-nav { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 16px auto 0; }
    .result-nav button, .result-nav a.next { padding: 12px; margin: 0; }
    .result-nav a { color: var(--u-sub); font-weight: 700; }
    .result-nav a.next { display: block; color: #fff; text-decoration: none; }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 14px 10px; }
      .question-card { padding: 16px 10px; }
      .question-text { font-size: 1.1rem; }
      .math-expression { font-size: 1.25rem; padding: 10px 12px; margin-bottom: 8px; }
      .options { gap: 10px; margin-top: 16px; }
      .option { padding: 14px 8px; font-size: 1.2rem; }
    }
  
  </style>
</head>
<body class="u-theme">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container">
        <header class="header">
            <h1>📐 接線の方程式クイズ</h1>
            <p>微分を使って接線の方程式を求めよう！</p>
        </header>

        <main class="quiz-container">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="score-display">
                <span id="scoreDisplay">一発正解: 0 / 5</span>
            </div>

            <div id="quizContent"></div>
        </main>
    </div>

    <script>
        const questions = [
            {
                question: "曲線 y = x³ - 6x 上の点(2, -4)における接線の方程式を求めなさい。",
                curve: "y = x³ - 6x",
                point: "(2, -4)",
                options: [
                    "y = 6x - 16",
                    "y = 3x - 10",
                    "y = 12x - 28",
                    "y = 9x - 22"
                ],
                correct: 0,
                explanation: "f'(x) = 3x² - 6 なので、x = 2での傾きは f'(2) = 12 - 6 = 6。点(2, -4)を通る直線の方程式は y - (-4) = 6(x - 2) より y = 6x - 16"
            },
            {
                question: "曲線 y = 3x² - 12x + 5 上の点(1, -4)における接線の方程式を求めなさい。",
                curve: "y = 3x² - 12x + 5",
                point: "(1, -4)",
                options: [
                    "y = -6x + 2",
                    "y = -3x - 1",
                    "y = 6x - 10",
                    "y = 3x - 7"
                ],
                correct: 0,
                explanation: "f'(x) = 6x - 12 なので、x = 1での傾きは f'(1) = 6 - 12 = -6。点(1, -4)を通る直線の方程式は y - (-4) = -6(x - 1) より y = -6x + 2"
            },
            {
                question: "曲線 y = x² + 4x - 1 上の点(-1, -4)における接線の方程式を求めなさい。",
                curve: "y = x² + 4x - 1",
                point: "(-1, -4)",
                options: [
                    "y = 2x - 2",
                    "y = -2x - 6",
                    "y = 4x",
                    "y = x - 3"
                ],
                correct: 0,
                explanation: "f'(x) = 2x + 4 なので、x = -1での傾きは f'(-1) = -2 + 4 = 2。点(-1, -4)を通る直線の方程式は y - (-4) = 2(x - (-1)) より y = 2x - 2"
            },
            {
                question: "曲線 y = -2x² + 8x - 6 上の点(2, 2)における接線の方程式を求めなさい。",
                curve: "y = -2x² + 8x - 6",
                point: "(2, 2)",
                options: [
                    "y = 2",
                    "y = 4x - 6",
                    "y = -4x + 10",
                    "y = 8x - 14"
                ],
                correct: 0,
                explanation: "f'(x) = -4x + 8 なので、x = 2での傾きは f'(2) = -8 + 8 = 0。点(2, 2)を通る水平線の方程式は y = 2"
            },
            {
                question: "曲線 y = x³ + 3x² - 9x + 1 上の点(1, -4)における接線の方程式を求めなさい。",
                curve: "y = x³ + 3x² - 9x + 1",
                point: "(1, -4)",
                options: [
                    "y = -4",
                    "y = 3x - 7",
                    "y = 6x - 10",
                    "y = -3x - 1"
                ],
                correct: 0,
                explanation: "f'(x) = 3x² + 6x - 9 なので、x = 1での傾きは f'(1) = 3 + 6 - 9 = 0。点(1, -4)を通る水平線の方程式は y = -4"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        // 【ブラッシュアップ】選択肢の並び・この問題でまちがえたか
        let order = [0, 1, 2, 3];
        let missedThis = false;
        // まちがえたときのヒント：元は解説をそのまま出していて、答えの式まで見えていた。傾きを求めるところまでにする
        function hintOf(q) {
            return q.explanation.split('。')[0] + '。この傾きと点を y − b = m(x − a) に入れてみよう。';
        }

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function updateScore() {
            document.getElementById('scoreDisplay').textContent = `一発正解: ${score} / ${questions.length}`;
        }

        function displayQuestion() {
            const question = questions[currentQuestion];
            const quizContent = document.getElementById('quizContent');
            // 【ブラッシュアップ】並びをまぜる
            order = question.options.map((_, i) => i);
            for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            missedThis = false;
            window.scrollTo(0, 0);

            quizContent.innerHTML = `
                <div class="question-card">
                    <div class="question-number">問題 ${currentQuestion + 1} / ${questions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="math-expression">曲線: ${question.curve}</div>
                    <div class="math-expression">点: ${question.point}</div>
                    <div class="options" id="options">
                        ${order.map((orig, index) =>
                            `<div class="option" onclick="selectAnswer(${index})" id="option${index}">
                                ${question.options[orig]}
                            </div>`
                        ).join('')}
                    </div>
                    <div id="feedback"></div>
                </div>
            `;

            answered = false;
            updateProgress();
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;

            answered = true;
            const question = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');

            // すべてのオプションを無効化
            options.forEach(option => option.classList.add('disabled'));

            if (order[selectedIndex] === question.correct) {   // 【ブラッシュアップ】
                // 正解の場合
                document.getElementById(`option${selectedIndex}`).classList.add('correct');
                document.body.classList.add('correct-background');
                feedback.innerHTML = `
                    <div class="feedback correct">
                        🎉 正解です！<br>
                        <small>${question.explanation}</small>
                        ${currentQuestion < questions.length - 1 ?
                            '<button class="next-button" onclick="nextQuestion()">次の問題へ</button>' :
                            '<button class="next-button" onclick="showFinalScore()">結果を見る</button>'
                        }
                    </div>
                `;
                if (!missedThis) score++;   // 【ブラッシュアップ】
                updateScore();
            } else {
                // 不正解の場合
                document.getElementById(`option${selectedIndex}`).classList.add('incorrect');
                missedThis = true;   // 【ブラッシュアップ】
                document.body.classList.add('incorrect-background');
                feedback.innerHTML = `
                    <div class="feedback incorrect">
                        ❌ 不正解です。もう一度挑戦してみましょう！<br>
                        <small>ヒント: ${hintOf(question)}</small>
                    </div>
                `;

                // 0.5秒後に再挑戦可能にする（メッセージは残す）
                setTimeout(() => {
                    answered = false;
                    document.body.classList.remove('incorrect-background');
                    options.forEach(option => {
                        option.classList.remove('disabled', 'incorrect');
                    });
                    // フィードバックメッセージは残しておく
                    feedback.innerHTML = `
                        <div class="feedback incorrect">
                            ❌ 不正解です。もう一度挑戦してみましょう！<br>
                            <small>ヒント: ${hintOf(question)}</small>
                        </div>
                    `;
                }, 500);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            document.body.classList.remove('correct-background', 'incorrect-background');
            displayQuestion();
        }

        function showFinalScore() {
            const quizContent = document.getElementById('quizContent');
            const percentage = Math.round((score / questions.length) * 100);

            let message = '';
            if (percentage === 100) {
                message = '🏆 完璧です！素晴らしい！';
            } else if (percentage >= 80) {
                message = '🎉 とても良くできました！';
            } else if (percentage >= 60) {
                message = '👍 良い結果です！';
            } else {
                message = '📚 もう少し練習してみましょう！';
            }

            quizContent.innerHTML = `
                <div class="final-score">
                    <h2>${message}</h2>
                    <div style="font-size: 3rem; margin: 20px 0;">${score} / ${questions.length}</div>
                    <div style="font-size: 1.2rem; color: #666; margin-bottom: 10px;">一発正解率: ${percentage}%</div>
                    <!-- 【ブラッシュアップ】次の教材・ほかの教材も選べるようにした -->
                    <div class="result-nav">
                        <button class="again" onclick="restartQuiz()">もう一度挑戦</button>
                        <a class="next" href="zougen.html">つぎは「増減表」へ ▶</a>
                        <a href="../remake.html">ほかの教材をえらぶ</a>
                    </div>
                </div>
            `;

            document.getElementById('progressBar').style.width = '100%';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = false;
            document.body.classList.remove('correct-background', 'incorrect-background');
            updateScore();
            displayQuestion();
        }

        // クイズを開始
        displayQuestion();
        updateScore();
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".header h1": "u-title",
    ".progress": "u-progress",
    ".option": "u-choice",
    ".option.correct": "u-ok",
    ".option.incorrect": "u-ng",
    ".next-button": "u-btn u-btn-blue",
    ".result-nav .again": "u-btn",
    ".result-nav .next": "u-btn u-btn-blue"
  });
</script>
</body>
</html>
