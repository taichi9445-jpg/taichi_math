        },

        },
        {
          type: "2p",

        {

            [

            ],
          ],

      ];
      const $ = (id) => document.getElementById(id);
      const n = (v) => String(v).replace(/-/g, "−");
      const value = (v) => (Array.isArray(v) ? v[0] / v[1] : v);
      const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
      function rat(v) {
        if (Number.isInteger(v)) return n(v);
        for (let d = 2; d <= 24; d++)
          if (Math.abs(v * d - Math.round(v * d)) < 1e-8) {
            const a = Math.round(v * d),
              g = gcd(a, d);
            return n(a / g) + "/" + d / g;
          }
        throw Error("分数が複雑です");
      }
      const frac = (v) => {
        const s = rat(v);
        return s.includes("/") ? "{" + s.replace("/", "|") + "}" : s;
      };
      const par = (v) => (v < 0 ? "(" + n(v) + ")" : n(v));
      const sub = (x, a) =>
        a === 0 ? x : a < 0 ? x + " + " + n(-a) : x + " − " + n(a);
      const add = (v) => (v < 0 ? " − " + frac(-v) : " + " + frac(v));
      const ev = (f, x) => f.reduce((s, c) => s * x + c, 0);
      const der = (f) => f.slice(0, -1).map((c, i) => c * (f.length - 1 - i));
      function poly(f, x = "x") {
        let s = "";
        f.forEach((c, i) => {
          if (!c) return;
          const p = f.length - 1 - i;
          const t = p
            ? (Math.abs(c) === 1 ? "" : frac(Math.abs(c))) +
              x +
              ["", "", "²", "³", "⁴"][p]
            : frac(Math.abs(c));
          s += (s ? (c < 0 ? " − " : " + ") : c < 0 ? "−" : "") + t;
        });
        return s || "0";
      }
      const line = (m, b) => "y = " + poly([m, b]);
      // 教科書の書き方：f(2) = 2³ − 3 × 2（係数 1 は書かない、負の係数は − でつなぐ）
      const at = (f, a, roleName) => {
        let s = "";
        f.forEach((c, i) => {
          if (c === 0) return;
          const k = f.length - 1 - i;
          const pw = k
            ? (roleName ? role(roleName, par(a)) : par(a)) +
              ["", "", "²", "³", "⁴"][k]
            : "";
          const m = Math.abs(c);
          const t = k ? (m === 1 ? pw : frac(m) + " × " + pw) : frac(m);
          s += (s ? (c < 0 ? " − " : " + ") : c < 0 ? "−" : "") + t;
        });
        return s || "0";
      };
      function row(t, h) {
        return { t, h };
      }
      const role = (r, v) => "«" + r + "|" + v + "»";
      const ratSafe=v=>{try{return Number.isFinite(v)?rat(v):null}catch{return null}};
      function coefficients(text){
        const source=text.replace(/\{([^|]+)\|([^}]+)\}/g,'$1/$2').replace(/\s/g,'').replace(/−/g,'-');
        const parts=source.match(/[+-]?[^+-]+/g)||[],result=[];
        for(const t of parts){const m=t.match(/^([+-]?)(?:(\d+(?:\/\d+)?))?([xa])?([²³⁴])?$/);if(!m)throw Error('式を整理できません: '+text);const c=m[2]?m[2].split('/').map(Number).reduce((a,b)=>a/b):1,power=m[3]?(m[4]?{'²':2,'³':3,'⁴':4}[m[4]]:1):0;result[power]=(result[power]||0)+(m[1]==='-'?-c:c);}
        return Array.from({length:result.length||1},(_,i)=>result[i]||0).reverse();
      }
      function expressionMistakes(p,v){
        const correct=coefficients(v),variable=v.includes('a')?'a':'x',candidates=[],q=p.source;
        const add=cs=>{if(cs?.every(Number.isFinite))try{const t=poly(cs,variable);if(!candidates.includes(t))candidates.push(t)}catch{}};
        for(let j=0;j<p.graph.lines.length;j++){
          const l=p.graph.lines[j];if(!Array.isArray(l))continue;
          const [m,z]=l,[a,b]=p.graph.points[j]||p.graph.points[0];
          if(poly(l,variable)!==poly(correct,variable))continue;
          add([m,-m*a-b]);add([m,m*a+b]);add([m,a-m*b]);
          if(m!==0)add([1/m,b-a/m]);
          if(p.kind==='tangent'){add([m,m-m*a]);add([b,b-b*a]);}
          add([-m,b+m*a]);
        }
        if(p.kind==='tangent'){
          const f=q.f,df=der(f);
          if(poly(df,variable)===poly(correct,variable)){
            add(f.slice(0,-1));add([...df,0]);add(df.map(c=>-c));
          }
        }
        // A sign error or forgotten exponent produces a fully collected polynomial.
        add(correct.map(c=>-c));
        for(let i=0;i<correct.length;i++){if(!correct[i])continue;let cs=[...correct];cs[i]*=-1;add(cs);cs=[...correct];cs[i]*=2;add(cs);}
        if(correct.length===1&&correct[0]===0){add([1,0]);add([-1,0]);}
        const answer=poly(correct,variable),out=candidates.filter(t=>t!==answer).slice(0,2);
        if(out.length!==2)throw Error('異なる誤答が不足: '+v);
        return out;
      }
      function complete(p, idx) {
        const q = p.source;
        if(p.kind==='tangent'&&q.type==='pt'){
          const i=p.rows.findIndex(r=>r.t==='#接点の y 座標を求める');
          if(i>=0)p.rows.splice(i,3);
        }
        if (p.kind === "line") {
          const [x, y] = q.p;
          p.q = q.r
            ? "2点 (" +
              role("x1", n(x)) +
              ", " +
              role("y1", n(y)) +
              "), (" +
              role("x2", n(q.r[0])) +
              ", " +
              role("y2", n(q.r[1])) +
              ") を通る直線の方程式を求めよ。"
            : "点 (" +
              role("x1", n(x)) +
              ", " +
              role("y1", n(y)) +
              ") を通り、傾き " +
              role("m", frac(value(q.m))) +
              " の直線の方程式を求めよ。";
          p.rows.forEach((r) => {
            if (r.t.startsWith("x = ["))
              r.t = r.t.replace(/\[[^\]]+\]/, (m) => role("x1", m));
            if (r.t.startsWith("m = {[")) {
              let i = 0;
              r.t = r.t.replace(/\[[^\]]+\]/g, (m) =>
                role(["y2", "y1", "x2", "x1"][i++], m),
              );
            }
            if (r.t.startsWith("y − [") && r.t.includes("(x − [")) {
              let i = 0;
              r.t = r.t.replace(/\[[^\]]+\]/g, (m) => {
                const k = ["y1", q.r ? null : "m", "x1"][i++];
                return k ? role(k, m) : m;
              });
            }
          });
        } else {

          },
          problems: active,
          tabGroup: (p) => ({
            id: p.group,
            label:
              p.kind === "line"
                ? ["点と傾き", "2点", "平行"][p.group]
                : ["接点", "x 座標", "傾き", "外の点"][p.group],
          }),
          finalExtra:
            "<p>練習が終わりました。新しい問題はメニューから選べます。</p>",
          after: (root, p, st) => {
            const q = root.querySelector(".fs-qt");
            if (q && !q.dataset.formatted) {
              q.dataset.formatted = "1";
              if (p.kind === "tangent") {
                const s = p.q.split("　");
                q.innerHTML =
                  '<span class="big-formula">' +
                  md(s[0]) +
                  '</span><span class="ask">' +
                  md(s[1]) +
                  "</span>";
              } else q.innerHTML = md(p.q);
            }
            if (st.done || st.shown) {
              const box = document.createElement("div");
              box.className = "answer-graph";
              box.innerHTML = graph(p.graph);
              root.querySelector(".fs-grid").append(box);
            }
            const cards = root.querySelector(".fs-cards");
            if (cards) {
              const numeric = !p.expressionSlots.includes(st.active);
              cards.classList.toggle("numeric", numeric);
              cards.style.setProperty(
                "--columns",
                Math.ceil(p.numericCards.length / 2),
              );
            }
            decorate(root);
          },
        });
        window.scrollTo(0, 0);
      }
      function renderChallenge() {
        if (challengeIndex === active.length) {
          $("challenge").innerHTML =
            "<h2>学習の記録</h2><p>" +
            challengeScore +
            " / " +
            active.length +
            " 問正解</p>" +
            challengeTabs() +
            (active.some((p) => p.miss || p.hintCount)
              ? "<h3>間違えた問題を確認する</h3>" +
                active
                  .map((p, i) =>
                    p.miss || p.hintCount
                      ? '<button class="fs-btn" onclick="challengeIndex=' +
                        i +
                        ';renderChallenge()">問' +
                        (i + 1) +
                        "・まちがい " +
                        (p.miss || 0) +
                        "回" +
                        (p.hintCount ? "・ヒントを見た" : "") +
                        "</button>"
                      : "",
                  )
                  .join("")
              : "<p>間違えた問題はありません</p>") +
            '<button class="fs-btn" onclick="start(\'challenge\')">もう一度</button>';
          return;
        }
        const p = active[challengeIndex];
        challengeDone = !!p.savedDone;
        const correct = p.ans;
        const wrong = p.source.wrong.map((w) => {
          const ls = Array.isArray(w[0]) ? w : [w];
          return (
            ls.map((l) => line(...l)).join(" と ") +
            (ls.length < p.graph.lines.length ? " のみ" : "")
          );
        });
        const opts =
          p.options || [correct, ...wrong].sort(() => Math.random() - 0.5);
        p.options = opts;
        $("challenge").innerHTML =
          challengeTabs() +
          "<p>ノートでチャレンジ " +
          (challengeIndex + 1) +
          ' / 5</p><div class="fs-q">' +
          '<span class="big-formula">' +
          md(p.q.split("　")[0]) +
          '</span><span class="ask">' +
          md(p.q.split("　")[1]) +
          "</span>" +
          '</div><div class="challenge-options">' +
          opts
            .map(
              (s, i) =>
                '<button class="fs-btn" onclick="chooseChallenge(' +
                i +
                ')">' +
                md(s) +
                "</button>",
            )
            .join("") +
          '</div><button class="fs-btn" onclick="challengeHint()">考え方・途中式のヒント</button><div id="challengeHint"></div><div id="challengeResult"></div>';
        if (p.savedResult) $("challengeResult").innerHTML = p.savedResult;
        if (p.savedHint) $("challengeHint").innerHTML = p.savedHint;
        decorate($("challenge"));
      }
      function challengeTabs() {
        return (
          '<nav class="fs-tabs">' +
          active
            .map(
              (p, i) =>
                '<button class="fs-tab ' +
                (i === challengeIndex ? "cur " : "") +
                (p.savedDone ? "done" : "") +
                '" onclick="challengeIndex=' +
                i +
                ';renderChallenge()">' +
                (i + 1) +
                "</button>",
            )
            .join("") +
          "</nav>"
        );
      }
      function challengeHint() {
        const p = active[challengeIndex],
          i = p.hintCount || 0;
        const steps = p.rows.filter((r) => !r.t.startsWith("#"));
        if (i >= steps.length + 1) return;
        $("challengeHint").insertAdjacentHTML(
          "beforeend",
          '<div class="fs-hint"><b>考え方' +
            (i + 1) +
            "</b><p>" +
            (i < steps.length
              ? md(steps[i].h || "この式を整理します。") +
                "</p>" +
                md(steps[i].t.replace(/^!/, ""))
              : "計算をまとめると、答えは " + md(p.ans)) +
            "</div>",
        );
        p.hintCount = i + 1;
        p.savedHint = $("challengeHint").innerHTML;
        decorate($("challengeHint"));
      }
      function chooseChallenge(i) {
        if (challengeDone) return;
        challengeDone = true;
        const p = active[challengeIndex],
          ok = p.options[i] === p.ans;
        if (ok) challengeScore++;
        p.savedDone = true;
        p.miss = ok ? 0 : 1;
        $("challengeResult").innerHTML =
          "<h3>" +
          (ok ? "正解" : "途中式を確認しよう") +
          "</h3>" +
          p.rows
            .map((r) => "<p>" + md(r.t.replace(/^[!#]/, "")) + "</p>")
            .join("") +
          graph(p.graph) +
          '<button class="fs-btn primary" onclick="challengeIndex++;renderChallenge()">次へ</button>';
        p.savedResult = $("challengeResult").innerHTML;
        decorate($("challengeResult"));
      }
      const icons = [
        '<path d="M6 54L58 10M23 40H45V22"/><circle cx="23" cy="40" r="3" fill="#d9480f"/>',
        '<path d="M6 10Q32 75 58 10M6 43H58"/><circle cx="32" cy="43" r="3" fill="#d9480f"/>',
        '<rect x="10" y="6" width="34" height="50" rx="3"/><path d="M17 18H36M17 27H36M17 36H28M32 49L54 20L59 24L37 53Z"/>',
        '<rect x="5" y="5" width="25" height="25" rx="4"/><circle cx="12" cy="12" r="1"/><circle cx="23" cy="23" r="1"/><path d="M20 58L58 30"/>',
        '<rect x="5" y="5" width="25" height="25" rx="4"/><circle cx="12" cy="12" r="1"/><circle cx="23" cy="23" r="1"/><path d="M27 30Q41 72 60 30M25 49H61"/>',
      ];
      document.querySelectorAll(".menu-card svg").forEach((e, i) => {
        e.setAttribute("viewBox", "0 0 64 64");
        e.innerHTML =
          '<g stroke="#1f4e8c" stroke-width="2" fill="none" stroke-linecap="round">' +
          icons[i] +
          "</g>";
      });
    </script>
  </body>
</html>
