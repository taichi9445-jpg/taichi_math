    <script>
      const TANGENTS = [
        {
          type: "pt",
          f: [1, -2, 0],
          a: 3,
          wrong: [
            [6, -15],
            [4, -15],
            [3, -6],
          ],
        },
        {
          type: "pt",
          f: [1, 0, -6, 0],
          a: 2,
          wrong: [
            [3, -10],
            [12, -28],
            [9, -22],
          ],
        },
        {
          type: "pt",
          f: [3, -12, 5],
          a: 1,
          wrong: [
            [-3, -1],
            [6, -10],
            [3, -7],
          ],
        },
        {
          type: "pt",
          f: [1, 4, -1],
          a: -1,
          wrong: [
            [-2, -6],
            [4, 0],
            [1, -3],
          ],
        },
        {
          type: "pt",
          f: [-2, 8, -6],
          a: 2,
          wrong: [
            [4, -6],
            [-4, 10],
            [8, -14],
          ],
        },
        {
          type: "x",
          f: [1, 0, 0, 0],
          a: -1,
          wrong: [
            [3, 4],
            [-3, -4],
            [3, -4],
          ],
        },
        {
          type: "x",
          f: [1, 3, -9, 1],
          a: 1,
          wrong: [
            [0, 4],
            [18, -22],
            [-9, 5],
          ],
        },
        {
          type: "slope",
          f: [1, -3, 0],
          k: 1,
          xs: [2],
          wrong: [[[1, -3]], [[1, 0]], [[-1, 0]]],
          mid: "f'(x) = 2x − 3 = 1 より x = 2。接点は (2, f(2)) = (2, −2)。接線は y + 2 = 1·(x − 2)",
        },
        {
          type: "slope",
          f: [1, 0, -3, 0],
          k: 9,
          xs: [2, -2],
          wrong: [
            [[9, -16]],
            [[9, 16]],
            [
              [9, -20],
              [9, 20],
            ],
          ],
          mid: "f'(x) = 3x² − 3 = 9 より x² = 4、x = 2, −2。接点は (2, 2) と (−2, −2)。接線は y − 2 = 9(x − 2) と y + 2 = 9(x + 2)",
        },
        {
          type: "ext",
          f: [1, 0, 0],
          p: [1, -3],
          ts: [3, -1],
          wrong: [
            [[2, -5]],
            [[6, -9]],
            [
              [-6, -9],
              [2, -1],
            ],
          ],
          mid: "接点を (t, t²) とすると、f'(t) = 2t なので接線は y − t² = 2t(x − t)、つまり y = 2tx − t²。これが点 (1, −3) を通るので −3 = 2t − t²、t² − 2t − 3 = 0、(t − 3)(t + 1) = 0 より t = 3, −1",
        },
      ];
      const LINES = [
        {
          type: "ps",
          p: [1, 3],
          m: 4,
          wrong: [
            [4, -11],
            [3, 1],
            [4, 3],
          ],
        },
        {
          type: "ps",
          p: [-2, 5],
          m: -3,
          wrong: [
            [-3, 11],
            [3, 11],
            [-3, 5],
          ],
        },
        {
          type: "ps",
          p: [0, -1],
          m: 2,
          wrong: [
            [2, 1],
            [-1, 2],
            [2, 0],
          ],
        },
        {
          type: "ps",
          p: [3, -4],
          m: 3,
          wrong: [
            [3, -5],
            [3, 13],
            [3, -9],
          ],
        },
        {
          type: "ps",
          p: [-1, -2],
          m: -2,
          wrong: [
            [-2, 4],
            [-2, -3],
            [2, 0],
          ],
        },
        {
          type: "ps",
          p: [4, 1],
          m: [1, 2],
          wrong: [
            [[1, 2], -3],
            [2, -7],
            [[1, 2], 1],
          ],
        },
        { type: "ps", p: [2, -3], m: 0, wrong: [{ x: 2 }, [-3, 0], { x: -3 }] },
        {
          type: "2p",
          p: [2, 1],
          r: [2, 5],
          wrong: [
            [0, 2],
            [0, 3],
            [4, -7],
          ],
        },
        {
          type: "2p",
          p: [1, 2],
          r: [3, 8],
          wrong: [
            [
              [1, 3],
              [5, 3],
            ],
            [3, 2],
            [-3, 5],
          ],
        },
        {
          type: "2p",
          p: [-1, 4],
          r: [3, -4],
          wrong: [
            [2, 6],
            [
              [-1, 2],
              [7, 2],
            ],
            [-2, 6],
          ],
        },
        {
          type: "2p",
          p: [1, 3],
          r: [4, 5],
          wrong: [
            [
              [3, 2],
              [3, 2],
            ],
            [[2, 3], 3],
            [
              [2, 3],
              [11, 3],
            ],
          ],
        },
      ];
      const $ = (id) => document.getElementById(id);
      const n = (v) => String(v).replace(/-/g, "−");
      const value = (v) => (Array.isArray(v) ? v[0] / v[1] : v);
      const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
      function rat(v) {
        if (Number.isInteger(v)) return n(v);
        for (let d = 2; d <= 24; d++)
          if (Math.abs(v * d - Math.round(v * d)) < 1e-8) {
            const a = Math.round(v * d),
              g = gcd(a, d);
            return n(a / g) + "/" + d / g;
          }
        throw Error("分数が複雑です");
      }
      const frac = (v) => {
        const s = rat(v);
        return s.includes("/") ? "{" + s.replace("/", "|") + "}" : s;
      };
      const par = (v) => (v < 0 ? "(" + n(v) + ")" : n(v));
      const sub = (x, a) =>
        a === 0 ? x : a < 0 ? x + " + " + n(-a) : x + " − " + n(a);
      const add = (v) => (v < 0 ? " − " + frac(-v) : " + " + frac(v));
      const ev = (f, x) => f.reduce((s, c) => s * x + c, 0);
      const der = (f) => f.slice(0, -1).map((c, i) => c * (f.length - 1 - i));
      function poly(f, x = "x") {
        let s = "";
        f.forEach((c, i) => {
          if (!c) return;
          const p = f.length - 1 - i;
          const t = p
            ? (Math.abs(c) === 1 ? "" : frac(Math.abs(c))) +
              x +
              ["", "", "²", "³", "⁴"][p]
            : frac(Math.abs(c));
          s += (s ? (c < 0 ? " − " : " + ") : c < 0 ? "−" : "") + t;
        });
        return s || "0";
      }
      const line = (m, b) => "y = " + poly([m, b]);
      const at = (f, a) =>
        f
          .map((c, i) =>
            c === 0
              ? ""
              : par(c) +
                (f.length - 1 - i
                  ? " × " + par(a) + ["", "", "²", "³", "⁴"][f.length - 1 - i]
                  : ""),
          )
          .filter(Boolean)
          .join(" + ")
          .replace(/\+ \(−(\d+)\)(?! ×)/g, "− $1");
      function row(t, h) {
        return { t, h };
      }
      function complete(p, idx) {
        // First examples keep the same calculation, but expose fewer blanks.
        let seen = 0;
        if (idx === 0)
          p.rows = p.rows.map((r) => ({
            ...r,
            t: r.t.replace(/\[([^\]]+)\]/g, (m, v) =>
              ++seen % 3 === 1 ? m : v,
            ),
          }));
        const used = [
          ...new Set(
            p.rows.flatMap((r) =>
              [...r.t.matchAll(/\[([^\]]+)\]/g)].map((m) => m[1]),
            ),
          ),
        ];
        p.cards = [
          ...used,
          ...["0", "1", "−1", "2", "−2", "3", "−3", "4", "5", "6"]
            .filter((x) => !used.includes(x))
            .slice(0, 3)
            .map((x) => [
              x,
              "符号と代入する値を確かめよう。傾き f′(a) と高さ f(a) は別の値です。",
            ]),
        ];
        return p;
      }
      function straight(q, idx = 5) {
        const [a, b] = q.p,
          vertical = q.r && q.r[0] === a,
          m = vertical ? null : q.r ? (q.r[1] - b) / (q.r[0] - a) : value(q.m),
          z = vertical ? null : b - m * a;
        const rows = [];
        let prompt;
        if (q.r) {
          prompt =
            "2点 (" +
            n(a) +
            ", " +
            n(b) +
            "), (" +
            n(q.r[0]) +
            ", " +
            n(q.r[1]) +
            ") を通る直線の方程式を求めよ。";
          if (!vertical) {
            rows.push(
              row(
                "!m = {y₂ − y₁|x₂ − x₁}",
                "傾きは y の変化量を x の変化量で割ります。",
              ),
              row("#2点の座標から傾きを求める", ""),
              row(
                "m = {[" +
                  par(q.r[1]) +
                  "] − [" +
                  par(b) +
                  "]|[" +
                  par(q.r[0]) +
                  "] − [" +
                  par(a) +
                  "]}",
                "分母も分子も、同じ順番で引こう。",
              ),
              row(
                "m = {" +
                  n(q.r[1] - b) +
                  "|" +
                  n(q.r[0] - a) +
                  "} = [" +
                  rat(m) +
                  "]",
                "分数を約分しよう。",
              ),
            );
          }
        } else
          prompt =
            "点 (" +
            n(a) +
            ", " +
            n(b) +
            ") を通り、傾き " +
            frac(m) +
            " の直線の方程式を求めよ。";
        if (vertical)
          rows.push(
            row(
              "#2点の x 座標はどちらも " + n(a) + "。y 軸に平行な直線になる。",
              "",
            ),
            row("x = [" + n(a) + "]", "縦の直線では x の値が一定です。"),
          );
        else {
          rows.push(
            row("!y − y₁ = m(x − x₁)", "点の座標と傾きを代入します。"),
            row("#点の座標と傾きを公式に代入する", ""),
            row(
              "y − [" + par(b) + "] = [" + rat(m) + "](x − [" + par(a) + "])",
              "左辺には y 座標、かっこの中には x 座標を入れよう。",
            ),
            row(
              "y − " +
                par(b) +
                " = " +
                poly([m, 0]) +
                " − [" +
                rat(m * a) +
                "]",
              "かっこの中の両方の項に傾きをかけよう。",
            ),
            row(
              "y = " +
                poly([m, 0]) +
                " − " +
                (m * a < 0 ? "(" + frac(m * a) + ")" : frac(m * a)) +
                " + " +
                par(b),
              "左辺の定数を右辺へ移そう。",
            ),
            row("y = [" + poly([m, z]) + "]", "定数の項をまとめよう。"),
          );
          if (m === 0)
            rows.splice(
              0,
              0,
              row("#傾きが 0 なので、x 軸に平行な直線になる。", ""),
            );
        }
        return complete(
          {
            q: prompt,
            rows,
            ans: vertical ? "x = " + n(a) : line(m, z),
            group: vertical ? 2 : q.r ? 1 : 0,
            source: q,
            kind: "line",
            graph: {
              points: [q.p, ...(q.r ? [q.r] : [])],
              lines: vertical ? [{ x: a }] : [[m, z]],
            },
          },
          idx,
        );
      }
      function tangent(q, idx = 5) {
        const df = der(q.f),
          rows = [],
          points = [],
          lines = [];
        let ask, xs;
        rows.push(
          row(
            "!y − f(a) = f′(a)(x − a)",
            "接点は (a, f(a))、接線の傾きは f′(a) です。",
          ),
          row("#関数を微分する", ""),
          row(
            "f′(x) = [" + poly(df) + "]",
            "項ごとに、指数を前にかけて指数を1つ下げよう。定数の微分は0です。",
          ),
        );
        if (q.type === "pt" || q.type === "x") {
          xs = [q.a];
          ask =
            q.type === "pt"
              ? "点 (" +
                n(q.a) +
                ", " +
                n(ev(q.f, q.a)) +
                ") における接線の方程式を求めよ。"
              : "x = " + n(q.a) + " の点における接線の方程式を求めよ。";
        } else if (q.type === "slope") {
          xs = q.xs;
          ask = "傾きが " + n(q.k) + " の接線の方程式をすべて求めよ。";
          rows.push(
            row("#接点の x 座標を a とおく。傾きの条件より", ""),
            row(
              poly(df, "a") + " = [" + n(q.k) + "]",
              "f′(a) を与えられた傾きと等しくしよう。",
            ),
          );
          if (df.length === 2)
            rows.push(
              row(
                poly([df[0], 0], "a") + " = [" + n(q.k - df[1]) + "]",
                "定数を移項しよう。",
              ),
              row("a = [" + n(xs[0]) + "]", "a の係数で割ろう。"),
            );
          else
            rows.push(
              row(
                poly([df[0], 0, 0], "a") + " = [" + n(q.k - df[2]) + "]",
                "定数を移項しよう。",
              ),
              row(
                "a² = [" + n((q.k - df[2]) / df[0]) + "]",
                "a² の係数で割ろう。",
              ),
              row(
                "a = [" + n(xs[0]) + "], [" + n(xs[1]) + "]",
                "正と負の2つの解を忘れないようにしよう。",
              ),
            );
        } else {
          xs = q.ts;
          ask =
            "点 (" +
            n(q.p[0]) +
            ", " +
            n(q.p[1]) +
            ") から引ける接線の方程式をすべて求めよ。";
          rows.push(
            row("#接点を (a, a²) とおく", ""),
            row("f′(a) = [2a]", "接点での傾きを求めよう。"),
            row("y − a² = 2a(x − a)", "接点と傾きを公式に入れます。"),
            row("y = 2ax − a²", "かっこを展開し、a² を右辺に移します。"),
            row("#与えられた点 (1, −3) を通るので", ""),
            row(
              "−3 = 2a × [1] − a²",
              "この点は接点ではありません。x と y に代入しよう。",
            ),
            row("a² − 2a − 3 = 0", "すべて左辺へ移し、a² の係数を正にします。"),
            row(
              "(a − [3])(a + [1]) = 0",
              "かけて −3、足して −2 になる数を探そう。",
            ),
            row("a = [3], [−1]", "それぞれの因数が0になる値を求めよう。"),
          );
        }
        for (const a of xs) {
          const b = ev(q.f, a),
            m = ev(df, a),
            z = b - m * a;
          points.push([a, b]);
          lines.push([m, z]);
          rows.push(
            row("#接点の x 座標 " + n(a) + " を代入し、傾きを求める", ""),
            row(
              "f′(" + n(a) + ") = " + at(df, a),
              "微分した式に x = " + n(a) + " を代入します。",
            ),
            row("f′(" + n(a) + ") = [" + n(m) + "]", "これは接線の傾きです。"),
            row("#接点の y 座標を求める", ""),
            row(
              "f(" + n(a) + ") = " + at(q.f, a),
              "元の関数に代入します。微分した式ではありません。",
            ),
            row("f(" + n(a) + ") = [" + n(b) + "]", "接点の高さを計算しよう。"),
            row("#接点と傾きを公式に代入する", ""),
            row(
              "y − [" + par(b) + "] = [" + n(m) + "](x − [" + par(a) + "])",
              "左辺には f(a)、右辺の係数には f′(a) を入れよう。",
            ),
            row(
              "y − " + par(b) + " = " + poly([m, 0]) + " − [" + n(m * a) + "]",
              "かっこの両方の項に傾きをかけよう。",
            ),
            row(
              "y = " + poly([m, 0]) + " − " + par(m * a) + " + " + par(b),
              "定数を右辺へ移します。",
            ),
            row("y = [" + poly([m, z]) + "]", "定数の項をまとめよう。"),
          );
        }
        return complete(
          {
            q: "f(x) = " + poly(q.f) + "　" + ask,
            rows,
            ans: lines.map((l) => line(...l)).join(" と "),
            group:
              q.type === "pt"
                ? 0
                : q.type === "x"
                  ? 1
                  : q.type === "slope"
                    ? 2
                    : 3,
            kind: "tangent",
            source: q,
            graph: { f: q.f, points, external: q.p, lines },
          },
          idx,
        );
      }
      function graph(g, shown = true) {
        const pts = [...g.points, ...(g.external ? [g.external] : [])],
          xs = pts.map((p) => p[0]);
        let lo = Math.min(-1, ...xs) - 1.5,
          hi = Math.max(1, ...xs) + 1.5;
        const ys = [0, ...pts.map((p) => p[1])];
        if (g.f)
          for (let i = 0; i <= 40; i++)
            ys.push(ev(g.f, lo + ((hi - lo) * i) / 40));
        let bot = Math.min(...ys),
          top = Math.max(...ys),
          pad = Math.max(1, (top - bot) * 0.12);
        bot -= pad;
        top += pad;
        const X = (x) => 45 + ((x - lo) / (hi - lo)) * 290,
          Y = (y) => 230 - ((y - bot) / (top - bot)) * 195;
        const txt = (x, y, s, anchor = "middle", italic = false) =>
          '<text x="' +
          x +
          '" y="' +
          y +
          '" text-anchor="' +
          anchor +
          '" font-size="15" font-family="STIX Two Text,serif"' +
          (italic ? ' font-style="italic"' : "") +
          ">" +
          s +
          "</text>";
        const seg = (x1, y1, x2, y2, col, w = 1, dash = "") =>
          '<line x1="' +
          x1 +
          '" y1="' +
          y1 +
          '" x2="' +
          x2 +
          '" y2="' +
          y2 +
          '" stroke="' +
          col +
          '" stroke-width="' +
          w +
          '"' +
          (dash ? ' stroke-dasharray="4 4"' : "") +
          "/>";
        const path = (f) =>
          '<path d="' +
          Array.from({ length: 151 }, (_, i) => {
            const x = lo + ((hi - lo) * i) / 150;
            return (i ? "L" : "M") + X(x) + "," + Y(f(x));
          }).join(" ") +
          '" fill="none" stroke="#1f4e8c" stroke-width="2.5"/>';
        let h =
          '<svg viewBox="0 0 380 270" role="img" aria-label="関数と直線のグラフ"><defs><clipPath id="plotClip"><rect x="35" y="20" width="310" height="220"/></clipPath></defs>';
        h +=
          seg(35, Y(0), 348, Y(0), "#858e99") +
          seg(X(0), 240, X(0), 18, "#858e99") +
          '<path d="M342 ' +
          (Y(0) - 4) +
          " L350 " +
          Y(0) +
          " L342 " +
          (Y(0) + 4) +
          " M" +
          (X(0) - 4) +
          " 24 L" +
          X(0) +
          " 16 L" +
          (X(0) + 4) +
          ' 24" fill="none" stroke="#858e99"/>' +
          txt(358, Y(0) + 5, "x", "middle", true) +
          txt(X(0) + 12, 18, "y", "middle", true) +
          txt(X(0) - 10, Y(0) + 17, "O", "middle", true);
        const ticks = [...new Set(g.points.map((p) => p[0]))]
          .filter((v) => v !== 0)
          .sort((a, b) => a - b);
        for (const x of ticks)
          h +=
            seg(X(x), Y(0) - 3, X(x), Y(0) + 3, "#555") +
            txt(X(x), Y(0) + 20, n(x));
        h += '<g clip-path="url(#plotClip)">';
        if (g.f) h += path((x) => ev(g.f, x));
        if (shown)
          for (const l of g.lines)
            h +=
              l.x !== undefined
                ? seg(X(l.x), 20, X(l.x), 240, "#d9480f", 2.5)
                : seg(
                    X(lo),
                    Y(l[0] * lo + l[1]),
                    X(hi),
                    Y(l[0] * hi + l[1]),
                    "#d9480f",
                    2.5,
                  );
        pts.forEach((p, i) => {
          h +=
            '<circle cx="' +
            X(p[0]) +
            '" cy="' +
            Y(p[1]) +
            '" r="4" fill="' +
            (i < g.points.length ? "#d9480f" : "#1f4e8c") +
            '"/>' +
            txt(
              X(p[0]) + (p[0] > (lo + hi) / 2 ? -10 : 10),
              Y(p[1]) - 10,
              String.fromCharCode(65 + i) +
                " (" +
                n(p[0]) +
                ", " +
                n(p[1]) +
                ")",
              p[0] > (lo + hi) / 2 ? "end" : "start",
              true,
            );
        });
        h += "</g></svg>";
        return h;
      }
      function decorate(root) {
        root.querySelectorAll(".fs-card,.fs-blank.ok").forEach((e) => {
          if (e.textContent.includes("{")) e.innerHTML = md(e.textContent);
          if (e.querySelector(".fs-fr")) e.classList.add("frac");
        });
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode())
          if (walker.currentNode.textContent.includes("′"))
            nodes.push(walker.currentNode);
        for (const t of nodes) {
          const parts = t.textContent.split("′"),
            f = document.createDocumentFragment();
          parts.forEach((s, i) => {
            if (i) {
              const e = document.createElement("span");
              e.className = "pr";
              e.textContent = "′";
              f.append(e);
            }
            f.append(document.createTextNode(s));
          });
          t.replaceWith(f);
        }
      }
      const md = (s) => FillSteps.md(s);
      const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
      function randomLine() {
        const a = rnd(-4, 4),
          b = rnd(-5, 5),
          m = rnd(-4, 4),
          two = Math.random() < 0.5;
        return two
          ? { type: "2p", p: [a, b], r: [a + 2, b + 2 * m] }
          : { type: "ps", p: [a, b], m };
      }
      function randomTangent() {
        const f = [[-2, -1, 1, 2][rnd(0, 3)], rnd(-4, 4), rnd(-5, 5)],
          a = rnd(-3, 3);
        return { type: Math.random() < 0.5 ? "pt" : "x", f, a };
      }
      let api,
        active = [],
        challengeIndex = 0,
        challengeScore = 0,
        challengeDone = false;
      function menu() {
        $("menu").hidden = false;
        $("lesson").hidden = true;
        $("app").innerHTML = "";
        $("challenge").innerHTML = "";
        window.scrollTo(0, 0);
      }
      function start(mode) {
        $("menu").hidden = true;
        $("lesson").hidden = false;
        $("app").hidden = mode === "challenge";
        $("challenge").hidden = mode !== "challenge";
        if (mode === "challenge") {
          active = [
            TANGENTS[0],
            TANGENTS[5],
            TANGENTS[7],
            TANGENTS[8],
            TANGENTS[9],
          ].map((q, i) => tangent(q, i + 1));
          challengeIndex = challengeScore = 0;
          renderChallenge();
          return;
        }
        active =
          mode === "line"
            ? LINES.map(straight)
            : mode === "tangent"
              ? TANGENTS.map(tangent)
              : Array.from({ length: 10 }, (_, i) =>
                  mode === "random-line"
                    ? straight(randomLine(), i)
                    : tangent(randomTangent(), i),
                );
        api = FillSteps.mount({
          el: "#app",
          problems: active,
          tabGroup: (p) => ({
            id: p.group,
            label:
              p.kind === "line"
                ? ["点と傾き", "2点", "平行"][p.group]
                : ["接点", "x 座標", "傾き", "外の点"][p.group],
          }),
          finalExtra:
            "<p>練習が終わりました。新しい問題はメニューから選べます。</p>",
          after: (root, p, st) => {
            const q = root.querySelector(".fs-qt");
            if (q && !q.dataset.formatted) {
              q.dataset.formatted = "1";
              if (p.kind === "tangent") {
                const s = p.q.split("　");
                q.innerHTML =
                  '<span class="big-formula">' +
                  md(s[0]) +
                  '</span><span class="ask">' +
                  md(s[1]) +
                  "</span>";
              } else q.innerHTML = md(p.q);
            }
            if (st.done || st.shown) {
              const box = document.createElement("div");
              box.className = "answer-graph";
              box.innerHTML = graph(p.graph);
              root.querySelector(".fs-done").after(box);
            }
            decorate(root);
          },
        });
        window.scrollTo(0, 0);
      }
      function renderChallenge() {
        if (challengeIndex === active.length) {
          $("challenge").innerHTML =
            "<h2>学習の記録</h2><p>" +
            challengeScore +
            " / " +
            active.length +
            ' 問正解</p><button class="fs-btn" onclick="start(\'challenge\')">もう一度</button>';
          return;
        }
        const p = active[challengeIndex];
        challengeDone = false;
        const correct = p.ans;
        const wrong = p.source.wrong.map((w) => {
          const ls = Array.isArray(w[0]) ? w : [w];
          return (
            ls.map((l) => line(...l)).join(" と ") +
            (ls.length < p.graph.lines.length ? " のみ" : "")
          );
        });
        const opts = [correct, ...wrong].sort(() => Math.random() - 0.5);
        p.options = opts;
        $("challenge").innerHTML =
          "<p>ノートでチャレンジ " +
          (challengeIndex + 1) +
          ' / 5</p><div class="fs-q">' +
          md(p.q) +
          '</div><div class="challenge-options">' +
          opts
            .map(
              (s, i) =>
                '<button class="fs-btn" onclick="chooseChallenge(' +
                i +
                ')">' +
                md(s) +
                "</button>",
            )
            .join("") +
          '</div><button class="fs-btn" onclick="challengeHint()">考え方・途中式のヒント</button><div id="challengeHint"></div><div id="challengeResult"></div>';
        decorate($("challenge"));
      }
      function challengeHint() {
        const p = active[challengeIndex];
        $("challengeHint").innerHTML =
          "<p>まず接点と傾きを求め、公式に代入します。</p>" +
          p.rows
            .filter((r) => !r.t.startsWith("#"))
            .slice(0, 6)
            .map((r) => "<p>" + md(r.t.replace(/^!/, "")) + "</p>")
            .join("");
        decorate($("challengeHint"));
      }
      function chooseChallenge(i) {
        if (challengeDone) return;
        challengeDone = true;
        const p = active[challengeIndex],
          ok = p.options[i] === p.ans;
        if (ok) challengeScore++;
        $("challengeResult").innerHTML =
          "<h3>" +
          (ok ? "正解" : "途中式を確認しよう") +
          "</h3>" +
          p.rows
            .map((r) => "<p>" + md(r.t.replace(/^[!#]/, "")) + "</p>")
            .join("") +
          graph(p.graph) +
          '<button class="fs-btn primary" onclick="challengeIndex++;renderChallenge()">次へ</button>';
        decorate($("challengeResult"));
      }
    </script>
  </body>
</html>
