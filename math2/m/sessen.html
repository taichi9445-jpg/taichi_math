    <main class="wrap">

        <div class="menu-grid">

    <script>
      const TANGENT = true;
      const questions = [
        {
          type: "pt",
          f: [1, -2, 0],
          a: 3,
          wrong: [
            [6, -15],
            [4, -15],
            [3, -6],
          ],
        },
        {
          type: "pt",
          f: [1, 0, -6, 0],
          a: 2,
          wrong: [
            [3, -10],
            [12, -28],
            [9, -22],
          ],
        },
        {
          type: "pt",
          f: [3, -12, 5],
          a: 1,
          wrong: [
            [-3, -1],
            [6, -10],
            [3, -7],
          ],
        },
        {
          type: "pt",
          f: [1, 4, -1],
          a: -1,
          wrong: [
            [-2, -6],
            [4, 0],
            [1, -3],
          ],
        },
        {
          type: "pt",
          f: [-2, 8, -6],
          a: 2,
          wrong: [
            [4, -6],
            [-4, 10],
            [8, -14],
          ],
        },
        {
          type: "x",
          f: [1, 0, 0, 0],
          a: -1,
          wrong: [
            [3, 4],
            [-3, -4],
            [3, -4],
          ],
        },
        {
          type: "x",
          f: [1, 3, -9, 1],
          a: 1,
          wrong: [
            [0, 4],
            [18, -22],
            [-9, 5],
          ],
        },
        {
          type: "slope",
          f: [1, -3, 0],
          k: 1,
          xs: [2],
          wrong: [[[1, -3]], [[1, 0]], [[-1, 0]]],
          mid: "f'(x) = 2x − 3 = 1 より x = 2。接点は (2, f(2)) = (2, −2)。接線は y + 2 = 1·(x − 2)",
        },
        {
          type: "slope",
          f: [1, 0, -3, 0],
          k: 9,
          xs: [2, -2],
          wrong: [
            [[9, -16]],
            [[9, 16]],
            [
              [9, -20],
              [9, 20],
            ],
          ],
          mid: "f'(x) = 3x² − 3 = 9 より x² = 4、x = 2, −2。接点は (2, 2) と (−2, −2)。接線は y − 2 = 9(x − 2) と y + 2 = 9(x + 2)",
        },
        {
          type: "ext",
          f: [1, 0, 0],
          p: [1, -3],
          ts: [3, -1],
          wrong: [
            [[2, -5]],
            [[6, -9]],
            [
              [-6, -9],
              [2, -1],
            ],
          ],
          mid: "接点を (t, t²) とすると、f'(t) = 2t なので接線は y − t² = 2t(x − t)、つまり y = 2tx − t²。これが点 (1, −3) を通るので −3 = 2t − t²、t² − 2t − 3 = 0、(t − 3)(t + 1) = 0 より t = 3, −1",
        },
      ];

      // ---- 式を扱う道具 ----
      const MINUS = "−";
      const SUP = ["", "", "²", "³", "⁴", "⁵"];
      const eva = (f, x) => f.reduce((s, c) => s * x + c, 0); // f(x) の値
      const der = (f) => f.slice(0, -1).map((c, i) => c * (f.length - 1 - i)); // f'(x) の係数
      const num = (v) => (v < 0 ? MINUS + -v : String(v));
      function fmtPoly(f) {
        // [1, 0, -6, 0] → "x³ − 6x"
        const deg = f.length - 1;
        let out = "";
        f.forEach((c, i) => {
          if (c === 0) return;
          const p = deg - i,
            abs = Math.abs(c);
          const body =
            p === 0 ? String(abs) : (abs === 1 ? "" : abs) + "x" + SUP[p];
          out +=
            out === ""
              ? (c < 0 ? MINUS : "") + body
              : (c < 0 ? " " + MINUS + " " : " + ") + body;
        });
        return out || "0";
      }
      function fmtLine(m, n) {
        // y = mx + n
        let s =
          m === 0 ? "" : m === 1 ? "x" : m === -1 ? MINUS + "x" : num(m) + "x";
        if (n !== 0 || s === "")
          s += s === "" ? num(n) : n < 0 ? " " + MINUS + " " + -n : " + " + n;
        return "y = " + s;
      }
      const shift = (v, name) =>
        v === 0 ? name : v < 0 ? `${name} + ${-v}` : `${name} ${MINUS} ${v}`; // x − a の形
      const fmtLines = (ls) => ls.map((l) => fmtLine(l[0], l[1])).join(" と ");
      const sameLines = (a, b) =>
        a.length === b.length &&
        a.every((l) => b.some((k) => k[0] === l[0] && k[1] === l[1]));

      // 問題ごとに、正解の接線・問題文・ヒント（方針 → 途中式 → 答え）を作る
      function build(q) {
        const df = der(q.f);
        const curve = "y = " + fmtPoly(q.f);
        let lines, text, plan, mid;
        if (q.type === "pt" || q.type === "x") {
          const b = eva(q.f, q.a),
            m = eva(df, q.a);
          lines = [[m, b - m * q.a]];
          text =
            q.type === "pt"
              ? `曲線 ${curve} 上の点 (${num(q.a)}, ${num(b)}) における接線の方程式を求めなさい。`
              : `曲線 ${curve} 上の x = ${num(q.a)} の点における接線の方程式を求めなさい。`;
          plan =
            (q.type === "x"
              ? `まず接点の y 座標 f(${num(q.a)}) を求めよう。`
              : "") +
            `接線の傾きは f'(${num(q.a)})。点 (a, f(a)) における接線は y − f(a) = f'(a)(x − a) だよ。`;
          mid =
            (q.type === "x"
              ? `f(${num(q.a)}) = ${num(b)} なので接点は (${num(q.a)}, ${num(b)})。`
              : "") +
            `f'(x) = ${fmtPoly(df)} なので、傾きは f'(${num(q.a)}) = ${num(m)}。` +
            `接線は ${shift(b, "y")} = ${m === 0 ? "0" : num(m)}${m === 0 ? "·" : ""}(${shift(q.a, "x")})`;
        } else if (q.type === "slope") {
          lines = q.xs.map((x) => {
            const b = eva(q.f, x);
            return [q.k, b - q.k * x];
          });
          text = `曲線 ${curve} の接線のうち、傾きが ${num(q.k)} であるものの方程式を求めなさい。`;
          plan = `接点の x 座標を t とすると、傾きは f'(t)。f'(t) = ${num(q.k)} を解いて接点を求めよう。`;
          mid = q.mid;
        } else {
          lines = q.ts.map((t) => {
            const m = eva(df, t);
            return [m, eva(q.f, t) - m * t];
          });
          text = `点 (${num(q.p[0])}, ${num(q.p[1])}) から曲線 ${curve} に引いた接線の方程式を求めなさい。`;
          plan = `点 (${num(q.p[0])}, ${num(q.p[1])}) は曲線の上にないので、接点ではない。接点を (t, f(t)) とおいて接線の式を作り、それが点 (${num(q.p[0])}, ${num(q.p[1])}) を通る条件から t を求めよう。`;
          mid = q.mid;
        }
        const answer = fmtLines(lines);
        const many = lines.length > 1;
        const opts = [{ text: answer, ok: true }].concat(
          q.wrong.map((w) => {
            const ls = Array.isArray(w[0]) ? w : [w];
            return {
              text: fmtLines(ls) + (many && ls.length === 1 ? " のみ" : ""),
              ok: sameLines(ls, lines),
            };
          }),
        );
        return { curve, text, plan, mid, answer, lines, opts };
      }

      // 数式のHTMLは、文字だけ斜体・数字は立体。式の行と日本語の説明を分ける。
      function mathHTML(html) {
        return String(html)
          .split(/(<[^>]+>)/g)
          .map((part, i) =>
            i % 2
              ? part
              : part.replace(
                  /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()+−=×÷·.,^\- ]+/g,
                  (run) => {
                    if (!/[A-Za-z0-9ⁿ]/.test(run)) return run;
                    let text = run
                      .replace(/'/g, "′")
                      .replace(/-/g, "−")
                      .replace(/\^(\d+)/g, (_, n) => "<sup>" + n + "</sup>");
                    text = text.replace(
                      /[ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,
                      (x) =>
                        "<sup>" +
                        [...x]
                          .map((c) =>
                            c === "ⁿ"
                              ? "n"
                              : c === "⁻"
                                ? "−"
                                : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c),
                          )
                          .join("") +
                        "</sup>",
                    );
                    text = text
                      .split(/(<[^>]+>)/g)
                      .map((x, j) =>
                        j % 2
                          ? x
                          : x.replace(/[A-Za-z]+/g, (letters) =>
                              ["sin", "cos", "tan", "log"].includes(letters)
                                ? letters
                                : "<i>" + letters + "</i>",
                            ),
                      )
                      .join("");
                    return '<span class="m">' + text + "</span>";
                  },
                ),
          )
          .join("");
      }
      function fitMath() {
        document
          .querySelectorAll(".problem,.choice,.eqpart,.ask")
          .forEach((e) => {
            e.style.fontSize = "";
            const max = e.classList.contains("eqpart")
              ? e.parentElement.clientWidth
              : e.clientWidth;
            let size = parseFloat(getComputedStyle(e).fontSize);
            while (e.scrollWidth > max + 1 && size > 15) {
              size -= 0.5;
              e.style.fontSize = size + "px";
            }
          });
      }
      // 等号を独立した要素にし、折り返しの前後でも左右の間隔を保つ。
      function lessonMath(html) {
        return mathHTML(html)
          .split(/(<[^>]+>)/g)
          .map((s, i) =>
            i % 2 ? s : s.replace(/\s*=\s*/g, '<span class="equal">=</span>'),
          )
          .join("");
      }
      function lessonSteps(mid) {
        return String(mid)
          .replace(/<br\s*\/?\s*>/g, "。")
          .split(/(?:。|、つまり |、(?=y =)| なので、?| なので | より )/)
          .filter(Boolean)
          .map(
            (line) =>
              '<div class="equation">' +
              line
                .split(" = ")
                .map(
                  (s, i) =>
                    '<span class="eqpart">' +
                    (i ? '<span class="equal">=</span>' : "") +
                    lessonMath(s) +
                    "</span>",
                )
                .join("<wbr>") +
              "</div>",
          )
          .join("");
      }
      function graphSVG(fn, points = [], lines = [], range) {
        const xs = points.map((p) => p[0]);
        let xmin = range ? range[0] : Math.min(-3, ...xs) - 1,
          xmax = range ? range[1] : Math.max(3, ...xs) + 1;
        const samples = Array.from(
          { length: 121 },
          (_, i) => xmin + ((xmax - xmin) * i) / 120,
        );
        const ys = [
          0,
          ...points.map((p) => p[1]),
          ...samples.map((x) => (fn ? fn(x) : 0)),
          ...lines.flatMap((l) =>
            l.x !== undefined ? [] : samples.map((x) => l.m * x + l.n),
          ),
        ];
        let ymin = Math.min(...ys),
          ymax = Math.max(...ys),
          pad = Math.max(1, (ymax - ymin) * 0.12);
        ymin -= pad;
        ymax += pad;
        const X = (x) => 30 + ((x - xmin) / (xmax - xmin)) * 260,
          Y = (y) => 185 - ((y - ymin) / (ymax - ymin)) * 160;
        const path = (f) =>
          samples
            .map(
              (x, i) =>
                (i ? "L" : "M") + X(x).toFixed(2) + " " + Y(f(x)).toFixed(2),
            )
            .join(" ");
        const text = (x, y, t, anchor = "middle") =>
          '<text x="' +
          x +
          '" y="' +
          y +
          '" text-anchor="' +
          anchor +
          '" font-family="STIX Two Text,serif" font-size="13">' +
          String(t).replace(/-/g, "−") +
          "</text>";
        return (
          '<svg viewBox="0 0 320 215" role="img" aria-label="座標とグラフ"><path d="M30 ' +
          Y(0) +
          "H290" +
          (xmin <= 0 && xmax >= 0 ? "M" + X(0) + " 20V190" : "") +
          '" stroke="#aeb8c5" fill="none"/>' +
          text(301, Y(0) + 4, "x") +
          (xmin <= 0 && xmax >= 0 ? text(X(0) + 9, 15, "y") : "") +
          text(30, 207, xmin) +
          text(290, 207, xmax) +
          text(25, Y(Math.floor(ymax)) + 4, Math.floor(ymax), "end") +
          text(25, Y(Math.ceil(ymin)) + 4, Math.ceil(ymin), "end") +
          (fn
            ? '<path d="' +
              path(fn) +
              '" fill="none" stroke="#1f4e8c" stroke-width="2"/>'
            : "") +
          lines
            .map(
              (l) =>
                '<path d="' +
                (l.x !== undefined
                  ? "M" + X(l.x) + " 25V185"
                  : path((x) => l.m * x + l.n)) +
                '" stroke="#d9480f" stroke-width="2" fill="none"/>',
            )
            .join("") +
          points
            .map(
              (p, i) =>
                '<circle cx="' +
                X(p[0]) +
                '" cy="' +
                Y(p[1]) +
                '" r="3" fill="#d9480f"/>' +
                text(
                  X(p[0]) + 9,
                  Y(p[1]) - 8,
                  String.fromCharCode(65 + i),
                  "start",
                ),
            )
            .join("") +
          '</svg><div class="point-labels">' +
          points
            .map((p, i) =>
              lessonMath(
                String.fromCharCode(65 + i) + "(" + p[0] + ", " + p[1] + ")",
              ),
            )
            .join("　") +
          "</div>"
        );
      }

      const $ = (id) => document.getElementById(id);
      let currentQuestion = 0,
        score = 0,
        stage = 0,
        answered = false,
        built,
        options;
      function start() {
        currentQuestion = score = 0;
        $("menu").hidden = true;
        $("result").hidden = true;
        $("quiz").hidden = false;
        renderQuestion();
      }
      function showMenu() {
        $("menu").hidden = false;
        $("quiz").hidden = true;
        $("result").hidden = true;
      }
      function figure(reveal = false) {
        const q = questions[currentQuestion];
        if (TANGENT) {
          let points =
            q.type === "pt" || q.type === "x"
              ? [[q.a, eva(q.f, q.a)]]
              : q.p
                ? [q.p]
                : [];
          if (reveal)
            points = (q.xs || q.ts || [q.a]).map((x) => [x, eva(q.f, x)]);
          return graphSVG(
            (x) => eva(q.f, x),
            points,
            reveal ? built.lines.map((l) => ({ m: l[0], n: l[1] })) : [],
          );
        }
        const points = [q.p, ...(q.r ? [q.r] : [])];
        let lines = [];
        if (reveal) {
          if (q.r && q.r[0] === q.p[0]) lines = [{ x: q.p[0] }];
          else {
            const m =
              q.type === "ps"
                ? Array.isArray(q.m)
                  ? q.m[0] / q.m[1]
                  : q.m
                : (q.r[1] - q.p[1]) / (q.r[0] - q.p[0]);
            lines = [{ m, n: q.p[1] - m * q.p[0] }];
          }
        }
        return graphSVG(null, points, lines);
      }
      function renderQuestion() {
        built = build(questions[currentQuestion]);
        stage = 0;
        answered = false;
        options = built.opts
          .map((o) => ({ ...o, r: Math.random() }))
          .sort((a, b) => a.r - b.r);
        $("status").textContent =
          "問" +
          (currentQuestion + 1) +
          "　" +
          (currentQuestion + 1) +
          " / " +
          questions.length;
        $("question").innerHTML = lessonMath(built.text);
        $("figure").innerHTML = figure();
        $("hints").innerHTML = "";
        $("feedback").hidden = true;
        $("help").hidden = false;
        $("next").hidden = true;
        $("choices").innerHTML = options
          .map(
            (o, n) =>
              '<button class="choice" data-label="' +
              ["ア", "イ", "ウ", "エ"][n] +
              '" onclick="selectAnswer(' +
              n +
              ')">' +
              lessonMath(o.text) +
              "</button>",
          )
          .join("");
        fitMath();
        window.scrollTo(0, 0);
      }
      function showHint(n) {
        if (answered) return;
        stage = Math.max(stage, n);
        if (stage >= 3) {
          finish(false);
          return;
        }
        $("hints").innerHTML =
          '<div class="hint-box"><span class="hint-tag">' +
          (stage === 1 ? "考え方" : "途中式") +
          '</span><div class="formula"><b>公式</b>' +
          lessonMath(TANGENT ? "y − f(a) = f′(a)(x − a)" : "y − b = m(x − a)") +
          "</div>" +
          (stage === 1 ? lessonMath(built.plan) : lessonSteps(built.mid)) +
          "</div>";
        fitMath();
      }
      function selectAnswer(n) {
        if (answered) return;
        if (options[n].ok) {
          finish(true);
          return;
        }
        $("choices").children[n].disabled = true;
        $("choices").children[n].classList.add("incorrect");
        showHint(stage + 1);
      }
      function finish(ok) {
        answered = true;
        if (ok && stage === 0) score++;
        $("help").hidden = true;
        $("hints").innerHTML = "";
        $("feedback").hidden = false;
        $("feedback").className = "feedback " + (ok ? "correct" : "");
        $("feedback").innerHTML =
          "<strong>" +
          (ok ? "正解" : "答え") +
          "</strong>" +
          lessonSteps(built.mid) +
          '<div class="equation">' +
          lessonMath(built.answer) +
          "</div>";
        $("figure").innerHTML = figure(true);
        $("next").hidden = false;
        $("next").textContent =
          currentQuestion === questions.length - 1
            ? "結果を見る"
            : "次の問題へ";
        [...$("choices").children].forEach((e, n) => {
          e.disabled = true;
          if (options[n].ok) e.classList.add("correct");
        });
        fitMath();
      }
      function nextQuestion() {
        if (!answered) return;
        if (++currentQuestion < questions.length) renderQuestion();
        else {
          $("quiz").hidden = true;
          $("result").hidden = false;
          $("score").textContent = score + " / " + questions.length + " 問";
          window.scrollTo(0, 0);
        }
      }
      showMenu();

      $("menuExample").innerHTML = lessonMath("y − f(a) = f′(a)(x − a)");
    </script>
  </body>
</html>
