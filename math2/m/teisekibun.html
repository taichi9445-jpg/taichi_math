<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <!--
    数学Ⅱ 10. 定積分練習（定積分マスター）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../../assets/port.css">
  <script src="../../assets/port.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定積分マスター</title>
  
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #667eea;
      font-size: 42px;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .mode-selection {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .mode-btn {
      padding: 30px 20px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .mode-btn:nth-child(1) {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .mode-btn:nth-child(2) {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .mode-btn:nth-child(3) {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }

    .mode-btn:nth-child(4) {
      background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
    }

    .mode-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .quiz-container {
      display: none;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      color: white;
    }

    .back-btn {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid white;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateX(-3px);
    }

    .timer {
      font-size: 32px;
      font-weight: bold;
    }

    .question-number {
      font-size: 24px;
      font-weight: bold;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      text-align: center;
    }

    .question {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .integral-container {
      display: inline-flex;
      align-items: center;
      position: relative;
      margin: 0 8px;
    }

    .integral-symbol {
      font-size: 56px;
      line-height: 1;
      position: relative;
      margin: 0 2px;
    }

    .integral-limits {
      display: flex;
      flex-direction: column;
      margin-left: -8px;
      margin-right: 6px;
    }

    .integral-upper {
      font-size: 16px;
      margin-bottom: 8px;
      align-self: flex-start;
    }

    .integral-lower {
      font-size: 16px;
      margin-top: 8px;
      align-self: flex-start;
    }

    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      margin: 0 5px;
    }

    .fraction-numerator {
      border-bottom: 2px solid #333;
      padding: 0 8px 2px 8px;
    }

    .fraction-denominator {
      padding: 2px 8px 0 8px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .option-btn {
      padding: 30px 20px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #667eea;
      border-radius: 15px;
      background: white;
      cursor: pointer;
      transition: all 0.3s;
      color: #333;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-btn:hover {
      background: #f0f0ff;
      transform: scale(1.05);
    }

    .option-btn.correct {
      background: #4caf50;
      color: white;
      border-color: #4caf50;
    }

    .option-btn.incorrect {
      background: #f44336;
      color: white;
      border-color: #f44336;
    }

    .input-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .input-box {
      width: 100px;
      padding: 15px;
      font-size: 28px;
      text-align: center;
      border: 3px solid #667eea;
      border-radius: 10px;
      transition: all 0.3s;
    }

    /* 数字入力欄の矢印を非表示 */
    .input-box::-webkit-outer-spin-button,
    .input-box::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .input-box[type=number] {
      -moz-appearance: textfield;
    }

    .input-box.correct {
      background: #4caf50;
      color: white;
      border-color: #4caf50;
    }

    .input-box.incorrect {
      background: #f44336;
      color: white;
      border-color: #f44336;
    }

    .input-fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .input-fraction input {
      width: 100px;
      margin: 5px 0;
    }

    .input-fraction .fraction-line {
      width: 100%;
      height: 3px;
      background: #333;
      margin: 5px 0;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .action-btn.secondary {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .explanation {
      background: #e8f5e9;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
      font-size: 18px;
      line-height: 1.8;
    }

    .explanation h3 {
      color: #2e7d32;
      margin-top: 0;
    }

    .explanation .exp-fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      margin: 0 3px;
    }

    .explanation .exp-fraction-numerator {
      border-bottom: 1px solid #333;
      padding: 0 6px 1px 6px;
      font-size: 16px;
    }

    .explanation .exp-fraction-denominator {
      padding: 1px 6px 0 6px;
      font-size: 16px;
    }

    .feedback {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    .feedback.correct {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .feedback.incorrect {
      background: #ffebee;
      color: #c62828;
    }

    /* 結果ダイアログのスタイル */
    .result-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .result-dialog {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 90%;
      max-height: 80%;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.4s ease-out;
      text-align: center;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .result-dialog h2 {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-content {
      font-size: 20px;
      line-height: 1.8;
      margin-bottom: 30px;
      color: #333;
    }

    .result-btn {
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .result-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  
  <!-- 【ブラッシュアップ】元は Tailwind の開発用CDN（cdn.tailwindcss.com）をその場で動かしていた。
       本番用ではなく、重いうえに読み込めないと見た目が全部崩れるため、

   <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->

  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    body { padding: 12px; display: block !important; min-height: 0 !important; }
    /* 【ブラッシュアップ】式：文字は斜体、数・記号は立体、数式用の書体 */
    .m { font-family: var(--u-math-font); font-size: 1.08em; }
    .m i { font-style: italic; padding-right: 0.04em; }
    .container { margin: 0 auto; padding: 24px 20px; box-sizing: border-box; }
    h1 { font-size: min(2.4rem, 8vw); white-space: nowrap; margin: 0 0 20px; text-shadow: none; }
    .mode-selection { gap: 12px; }
    .mode-btn { font-size: 1.1rem; padding: 20px 12px; line-height: 1.6; }
    .quiz-header { background: var(--u-soft-yellow) !important; color: var(--u-ink); border: 3px dashed #fde68a; border-radius: 16px; padding: 10px 12px; gap: 8px; }
    .question-number { font-size: 1.1rem; color: var(--u-ink); white-space: nowrap; }
    .back-btn { white-space: nowrap; padding: 8px 14px; font-size: 1rem; }
    .timer { font-size: 1.4rem; color: var(--u-accent-text); }
    .q-lead { margin: 0 0 8px; text-align: center; font-weight: 800; color: var(--u-sub); }
    .question-box { background: #f8fafc; border: 3px solid var(--u-line); border-radius: 24px; }
    .question { color: var(--u-ink); flex-wrap: wrap; }
    .integrand { white-space: nowrap; }
    .integrand.plus { margin: 0 10px; }
    .option-btn { font-size: 1.4rem; padding: 18px 10px; }
    .option-btn:hover { transform: none; }
    .option-btn .minus { margin-right: 4px; }
    .input-box { border-color: var(--u-line-dark) !important; font-size: 22px; }
    .input-box.correct { background: var(--u-ok-soft) !important; color: var(--u-ok) !important; border-color: var(--u-ok-line) !important; }
    .input-box.incorrect { background: var(--u-ng-soft) !important; color: var(--u-ng) !important; border-color: var(--u-ng-line) !important; }
    .input-box.reduce { background: var(--u-soft-yellow) !important; border-color: #fde047 !important; }
    /* 【ブラッシュアップ】入力式の新しい形 */
    #input-container { flex-direction: column; gap: 10px; font-size: 1.6rem; font-weight: 800; color: var(--u-ink); }
    .step-line { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
    .nb { display: inline-flex; align-items: center; gap: 6px; }
    .nb .input-fraction input { width: 84px; padding: 8px; margin: 3px 0; }
    .nb .input-fraction .fraction-line { margin: 2px 0; }
    .nb-sign { min-width: 44px; min-height: 48px; font-size: 1.5rem; font-weight: 800; background: #fff; color: var(--u-ink); cursor: pointer;
               border: 3px solid var(--u-line-dark); border-bottom-width: 5px; border-radius: 12px; }
    .op { margin: 0 2px; }
    .in-help { margin: 0; font-size: 0.9rem; color: var(--u-sub); font-weight: 700; text-align: center; }
    .lim { display: inline-flex; flex-direction: column; justify-content: space-between; vertical-align: middle; font-size: 0.62em; line-height: 1.25; margin: 0 3px 0 1px; text-align: left; }
    .int { font-size: 1.35em; font-weight: 400; vertical-align: middle; }
    .bk { font-size: 1.6em; font-weight: 400; vertical-align: middle; }
    .step-line .fraction { font-size: 0.85em; }
    .explanation .fraction { font-size: 0.8em; margin: 0 2px; }
    .explanation .fraction-numerator, .explanation .fraction-denominator { padding: 0 3px; }
    .explanation p { margin: 0; }
    .feedback { font-size: 1.3rem; border-radius: 16px; }
    .feedback.correct { background: var(--u-ok-soft); color: var(--u-ok); border: 3px solid var(--u-ok-line); }
    .feedback.incorrect { background: var(--u-ng-soft); color: var(--u-ng); border: 3px solid var(--u-ng-line); }
    .feedback.hint { background: var(--u-soft-yellow); color: var(--u-soft-yellow-text); border: 3px solid #fde047; }
    .feedback.shown { background: var(--u-soft-blue); color: var(--u-title); border: 3px solid var(--u-soft-blue-line); }
    .rule-hint { margin-top: 6px; font-size: 0.95rem; color: var(--u-title); }
    .explanation { background: #fff; border: 3px dashed var(--u-line); border-radius: 16px; color: var(--u-ink); font-size: 1.05rem; line-height: 2.3; font-weight: 700; }
    .explanation h3 { color: var(--u-accent-text); }
    .result-overlay { background: rgba(75, 44, 32, 0.55) !important; padding: 16px; box-sizing: border-box; }
    .result-dialog { border: 8px solid var(--u-frame); border-radius: 32px; padding: 26px 18px; box-sizing: border-box; max-height: 90%; }
    .result-dialog h2 { font-size: min(2rem, 7.5vw); background: none; -webkit-text-fill-color: var(--u-accent-text); color: var(--u-accent-text); white-space: nowrap; }
    .result-content { font-size: 1rem; color: var(--u-ink); font-weight: 700; }
    .res-big { font-size: 1.5rem; font-weight: 800; color: var(--u-title); margin-bottom: 6px; }
    .res-comment { margin: 10px 0 0; line-height: 1.7; }
    .result-nav { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 10px auto 0; }
    .result-nav button, .result-nav a.next { padding: 12px; margin: 0; font-size: 1.05rem; }
    .result-nav a { color: var(--u-sub); font-weight: 700; }
    .result-nav a.next { display: block; color: #fff; text-decoration: none; }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 14px 10px; }
      .mode-selection { grid-template-columns: 1fr; }
      .question-box { padding: 18px 8px; }
      .question { font-size: 1.4rem; }
      .integral-symbol { font-size: 2.6rem; }
      .options { gap: 10px; }
      .option-btn { padding: 14px 6px; font-size: 1.25rem; }
      #input-container { font-size: 1.25rem; }
      .nb .input-fraction input { width: 60px; padding: 6px 2px; font-size: 18px; }
      .nb-sign { min-width: 38px; font-size: 1.3rem; }
      .explanation { font-size: 0.95rem; padding: 14px 10px; }
      .action-btn { padding: 12px 22px; font-size: 1.05rem; }
    }
  
  </style>
</head>

  <script>
    const defaultConfig = {
      app_title: "定積分マスター",
      mode1_name: "モード①\nランダム5問",
      mode2_name: "モード②\nランダム10問",
      mode3_name: "モード③\n超鬼連チャンモード\n(間違えたら終了)",
      mode4_name: "モード④\n入力式5問\n（[F(x)] の書き方から）"
    };

    const problems = [
      // レベル1: 積分範囲が0から始まる基本問題（難易度1-10）
      { q: "x dx", lower: "0", upper: "1", a: "1/2", exp: "∫x dx = [x²/2] より [x²/2]₀¹ = [1/2]", difficulty: 1 },
      { q: "2x dx", lower: "0", upper: "1", a: "1", exp: "∫2x dx = x² より [x²]₀¹ = 1", difficulty: 1 },
      { q: "1 dx", lower: "0", upper: "2", a: "2", exp: "∫1 dx = x より [x]₀² = 2", difficulty: 1 },
      { q: "x dx", lower: "0", upper: "2", a: "2", exp: "∫x dx = [x²/2] より [x²/2]₀² = 2", difficulty: 2 },
      { q: "3x² dx", lower: "0", upper: "1", a: "1", exp: "∫3x² dx = x³ より [x³]₀¹ = 1", difficulty: 2 },
      { q: "4x³ dx", lower: "0", upper: "1", a: "1", exp: "∫4x³ dx = x⁴ より [x⁴]₀¹ = 1", difficulty: 2 },
      { q: "(x+1) dx", lower: "0", upper: "1", a: "3/2", exp: "∫(x+1) dx = [x²/2] + x より [[x²/2] + x]₀¹ = [3/2]", difficulty: 3 },

    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
    // 分数 [分子, 分母]（分母は正、約分ずみ）
    function fr(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }

    // 式の文字列（例 "(x+1)²"、"(x²+2x+1)"）を読んで、係数の配列 [定数, x, x², …] にする
    function parsePoly(str) {
      const s = str.replace(/\s/g, '').replace(/[−]/g, '-');
      let i = 0;
      const add = (a, b) => { const r = []; for (let k = 0; k < Math.max(a.length, b.length); k++) r[k] = (a[k] || 0) + (b[k] || 0); return r; };
      const mul = (a, b) => { const r = new Array(a.length + b.length - 1).fill(0); a.forEach((x, p) => b.forEach((y, q) => { r[p + q] += x * y; })); return r; };
      const pow = (a, n) => { let r = [1]; for (let k = 0; k < n; k++) r = mul(r, a); return r; };
      function readSup() { let t = ''; while (i < s.length && SUP.includes(s[i])) t += SUP.indexOf(s[i++]); return t === '' ? 1 : +t; }
      function base() {
        if (s[i] === '(') { i++; const e = expr(); if (s[i] !== ')') throw new Error('かっこが閉じていない: ' + str); i++; return e; }
        if (s[i] === 'x') { i++; return [0, 1]; }
        let t = '';
        while (i < s.length && /\d/.test(s[i])) t += s[i++];
        if (t === '') throw new Error('読めない式: ' + str);
        return [+t];
      }
      function factor() { const b = base(); return pow(b, readSup()); }
      function term() {
        let sign = 1;
        while (s[i] === '+' || s[i] === '-') { if (s[i] === '-') sign = -sign; i++; }
        let r = factor();
        while (i < s.length && (s[i] === '(' || s[i] === 'x' || /\d/.test(s[i]))) r = mul(r, factor());
        return r.map(c => c * sign);
      }
      function expr() {

        while (i < s.length && (s[i] === '+' || s[i] === '-')) r = add(r, term());
        return r;

      const r = expr();

        const a = +q.lower, b = +q.sum.upper;
        const Fb = evalAt(at, b), Fa = evalAt(at, a);

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const seconds = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('timer').textContent = `${minutes}:${seconds}`;
    }

    function formatIntegral(question) {
      const one = (lo, up, body) => `
        <span class="integral-symbol">∫</span>
        <div class="integral-container">
          <div class="integral-limits">
            <span class="integral-upper">${pretty(up)}</span>
            <span class="integral-lower">${pretty(lo)}</span>
          </div>
        </div>
        <span class="integrand">${pretty(body)}</span>`;
      let h = one(question.lower, question.upper, question.q);
      if (question.sum) h += '<span class="integrand plus">+</span>' + one(question.sum.lower, question.sum.upper, question.sum.q);
      return h;
    }


    function showQuestion() {
      isAnswered = false;
      missedThis = false;   // 【ブラッシュアップ】
      const question = currentQuestions[currentQuestionIndex];
      document.getElementById('question-number').textContent = `問題 ${currentQuestionIndex + 1}/${currentQuestions.length}`;
      document.getElementById('question').innerHTML = formatIntegral(question);
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('explanation').style.display = 'none';
      document.getElementById('action-buttons').innerHTML = '';

      if (currentMode === 4) {
        showInputQuestion(question);
      } else {
        showChoiceQuestion(question);
      }
    }

    function showChoiceQuestion(question) {
      document.getElementById('options-container').style.display = 'grid';
      document.getElementById('input-container').style.display = 'none';

      const options = generateOptions(question.a);
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = formatAnswer(option);
        btn.dataset.value = option;
        btn.onclick = () => checkAnswer(option, question.a, question.exp, btn);   // 【ブラッシュアップ】
        optionsContainer.appendChild(btn);
      });
    }

    function numBox(name, label) {
      return `<span class="nb" data-name="${name}">` +
        `<button type="button" class="nb-sign" data-v="+" aria-label="${label}の符号（タップで ＋ と − が入れかわる）">+</button>` +
        `<span class="input-fraction"><input type="text" class="input-box nb-num" inputmode="numeric" autocomplete="off" placeholder="分子" aria-label="${label}の分子">` +
        `<span class="fraction-line"></span>` +
        `<input type="text" class="input-box nb-den" inputmode="numeric" autocomplete="off" placeholder="分母" aria-label="${label}の分母（整数なら空らん）"></span></span>`;
    }
    const isStepQuestion = () => currentMode === 4 && currentQuestionIndex < 2;

    function showInputQuestion(question) {
      document.getElementById('options-container').style.display = 'none';
      const box = document.getElementById('input-container');
      box.style.display = 'flex';

      const at = antiTerms(termsOf(parsePoly(integrandOf(question.q))));
      const a = +question.lower, b = +question.upper;
      let h = '';
      if (isStepQuestion()) {
        h += `<div class="step-line">= ${bracketHTML(polyHTML(at), a, b)}</div>`;
        h += `<div class="step-line">= ${numBox('fb', 'F(上端)')} <span class="op">−</span> ${numBox('fa', 'F(下端)')}</div>`;
        h += `<div class="step-line">= ${numBox('ans', '答え')}</div>`;
        h += '<p class="in-help">書き方の練習：F(上端) と F(下端) を入れてから、引き算しよう</p>';
      } else {
        h += `<div class="step-line">= ${numBox('ans', '答え')}</div>`;
      }
      h += '<p class="in-help">整数なら分母は空らん。マイナスは「+」をタップして「−」に</p>';
      box.innerHTML = h;

      box.querySelectorAll('.nb-sign').forEach(btn => btn.addEventListener('click', () => {
        if (isAnswered) return;
        btn.dataset.v = btn.dataset.v === '+' ? '-' : '+';
        btn.textContent = btn.dataset.v === '+' ? '+' : '−';
        btn.closest('.nb').querySelectorAll('.input-box').forEach(e => e.classList.remove('incorrect', 'reduce'));
      }));
      box.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => inp.closest('.nb').querySelectorAll('.input-box').forEach(e => e.classList.remove('incorrect', 'reduce')));
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); checkInputAnswer(); }
        });
      });

      const actionButtons = document.getElementById('action-buttons');
      actionButtons.innerHTML = `
        <button class="action-btn" onclick="checkInputAnswer()">答え合わせ</button>
        <button class="action-btn secondary" onclick="showAnswerInInput()">答えを見る</button>
      `;
      if (!isTouch) setTimeout(() => { const f = box.querySelector('.nb-num'); if (f) f.focus(); }, 50);
    }

    // 欄の値を読む：null（空）／NaN（数でない）／[分子, 分母, 約分ずみか]
    function readBox(nb) {
      let n = nz(nb.querySelector('.nb-num').value);
      const d = nz(nb.querySelector('.nb-den').value);
      if (n === '' && d === '') return null;
      let sign = nb.querySelector('.nb-sign').dataset.v === '-' ? -1 : 1;
      if (n.startsWith('-')) { sign = -sign; n = n.slice(1); }
      if (!/^\d+$/.test(n) || (d !== '' && !/^\d+$/.test(d))) return NaN;
      const nn = +n, dd = d === '' ? 1 : +d;
      if (dd === 0) return NaN;
      return [sign * nn, dd, gcd(nn, dd) === 1];   // 3 つ目：約分してあるか
    }
    function expectedOf(question, name) {
      const at = antiTerms(termsOf(parsePoly(integrandOf(question.q))));
      if (name === 'fb') return evalAt(at, +question.upper);
      if (name === 'fa') return evalAt(at, +question.lower);
      return valueOf(question);
    }

    function checkInputAnswer() {
      if (isAnswered) return;
      const question = currentQuestions[currentQuestionIndex];
      const boxes = Array.from(document.querySelectorAll('#input-container .nb'));
      const feedback = document.getElementById('feedback');
      feedback.style.display = 'block';

      const values = boxes.map(readBox);
      if (values.some(v => v === null)) {
        feedback.className = 'feedback hint';
        feedback.textContent = 'まだ入っていない欄があります';
        return;
      }
      let allOk = true, onlyReduce = true;
      boxes.forEach((nb, i) => {
        const v = values[i];
        const exp = expectedOf(question, nb.dataset.name);
        const inputs = nb.querySelectorAll('.input-box');
        inputs.forEach(e => e.classList.remove('correct', 'incorrect', 'reduce'));
        if (Number.isNaN(v) || v[0] * exp[1] !== exp[0] * v[1]) {
          allOk = false; onlyReduce = false;
          inputs.forEach(e => e.classList.add('incorrect'));
        } else if (!v[2]) {
          allOk = false;
          inputs.forEach(e => e.classList.add('reduce'));
        } else {
          inputs.forEach(e => e.classList.add('correct'));
        }
      });

      if (allOk) {
        isAnswered = true;
        correctCount++;
        if (!missedThis) firstTryCount++;
        document.querySelectorAll('#input-container input, #input-container button').forEach(e => { e.disabled = true; });
        feedback.className = 'feedback correct';
        feedback.textContent = '🎉 正解！';
        document.getElementById('explanation').innerHTML = `<h3>解説</h3><p>${formatFractionInExplanation(question.exp)}</p>`;
        document.getElementById('explanation').style.display = 'block';
        showNextButton();
      } else if (onlyReduce) {
        feedback.className = 'feedback hint';
        feedback.textContent = 'おしい！ 値は合っています。黄色の分数を約分しよう';
      } else {
        incorrectCount++;
        missedThis = true;
        feedback.className = 'feedback incorrect';
        feedback.innerHTML = '✗ 赤い欄がちがいます<div class="rule-hint">💡 F(上端) − F(下端)。マイナスの数を引くときは、かっこをつけて計算しよう。</div>';
      }
    }

    function showNextButton() {
      const actionButtons = document.getElementById('action-buttons');
      if (currentQuestionIndex < currentQuestions.length - 1) {
        actionButtons.innerHTML = `<button class="action-btn" onclick="nextQuestion()">次の問題へ</button>`;
      } else {
        actionButtons.innerHTML = '';
        const myRun = runId;
        setTimeout(() => { if (myRun === runId) finishQuiz(); }, 1500);
      }
    }

    function showAnswerInInput() {
      if (isAnswered) return;
      missedThis = true;
      isAnswered = true;
      const question = currentQuestions[currentQuestionIndex];
      document.querySelectorAll('#input-container .nb').forEach(nb => {
        const v = expectedOf(question, nb.dataset.name);
        const s = nb.querySelector('.nb-sign');
        s.dataset.v = v[0] < 0 ? '-' : '+';
        s.textContent = v[0] < 0 ? '−' : '+';
        nb.querySelector('.nb-num').value = Math.abs(v[0]);
        nb.querySelector('.nb-den').value = v[1] === 1 ? '' : v[1];
        nb.querySelectorAll('.input-box').forEach(e => { e.classList.remove('incorrect', 'reduce'); e.classList.add('correct'); });
      });
      document.querySelectorAll('#input-container input, #input-container button').forEach(e => { e.disabled = true; });
      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback shown';
      feedback.innerHTML = `正解：${formatAnswer(question.a)}`;
      feedback.style.display = 'block';
      document.getElementById('explanation').innerHTML = `<h3>解説</h3><p>${formatFractionInExplanation(question.exp)}</p>`;
      document.getElementById('explanation').style.display = 'block';
      showNextButton();
    }


    function parseAnswer(s) { const [n, d] = String(s).split('/').map(Number); return fr(n, d || 1); }
    const keyOf = v => `${v[0]}/${v[1]}`;
    const strOf = v => v[1] === 1 ? String(v[0]) : `${v[0]}/${v[1]}`;

    function typicalErrors(q) {
      const it = termsOf(parsePoly(integrandOf(q.q)));
      const at = antiTerms(it);
      const a = +q.lower, b = q.sum ? +q.sum.upper : +q.upper;
      const Fb = evalAt(at, b), Fa = evalAt(at, a);
      const G = it.map(({ k, p }) => ({ n: k, d: 1, p: p + 1 }));   // (n+1) でわり忘れ
      const list = [addF(Fb, Fa), subF(Fa, Fb), subF(evalAt(G, b), evalAt(G, a))];
      if (Fa[0] !== 0) list.push(Fb);                                    // F(下端) の引き忘れ
      if (q.sum) list.push(subF(evalAt(at, +q.upper), Fa));               // 1 つ目の区間だけ
      return list;
    }

    function generateOptions(correctAnswer) {
      const q = currentQuestions[currentQuestionIndex];
      const C = parseAnswer(correctAnswer);
      const shuffle = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
      const [n, d] = C;
      const nudge = d === 1
        ? [n + 1, n - 1, n * 2, n + 2, n - 2, n + 3].map(v => [v, 1])
        : [[n + 1, d], [n - 1, d], [n, d + 1], [n, Math.max(1, d - 1)], [n * 2, d], [n + d, d], [n + 2, d], [n, d + 2]];
      let typical = [];
      try { typical = typicalErrors(q); } catch (e) { typical = []; }
      const options = [C];
      const seen = new Set([keyOf(C)]);
      // よくあるまちがいから 2 つまで、残りは少しずらした値から
      for (const v0 of shuffle(typical)) {
        if (options.length >= 3) break;
        const v = fr(v0[0], v0[1]);
        if (seen.has(keyOf(v))) continue;
        seen.add(keyOf(v)); options.push(v);
      }
      for (const v0 of shuffle(nudge)) {
        if (options.length >= 4) break;
        const v = fr(v0[0], v0[1]);
        // 正解が正の数のときは、少しずらした値でマイナスにはしない
        if (C[0] > 0 && v[0] < 0) continue;
        if (seen.has(keyOf(v))) continue;
        seen.add(keyOf(v)); options.push(v);
      }
      for (let k = 1; options.length < 4; k++) {   // それでも足りないとき
        const v = fr(n + k * d * 3, d);
        if (!seen.has(keyOf(v))) { seen.add(keyOf(v)); options.push(v); }
      }
      return shuffle(options.map(strOf));
    }


    function formatAnswer(answer) {
      const s = String(answer);
      const neg = s.startsWith('-');
      const body = neg ? s.slice(1) : s;
      if (body.includes('/')) {
        const [num, den] = body.split('/');
        return `${neg ? '<span class="minus">−</span>' : ''}<div class="fraction"><span class="fraction-numerator">${num}</span><span class="fraction-denominator">${den}</span></div>`;
      }
      return (neg ? '−' : '') + body;
    }


    function normalizeAnswer(answer) {
      if (answer.includes('/')) {
        const [num, den] = answer.split('/').map(Number);
        const gcd = (a, b) => b === 0 ? Math.abs(a) : gcd(b, a % b);
        const divisor = gcd(num, den);
        return `${num / divisor}/${den / divisor}`;
      }
      return parseFloat(answer).toString();
    }

    function checkAnswer(selected, correct, explanation, clicked) {
      if (isAnswered) return;
      isAnswered = true;

      const buttons = document.querySelectorAll('.option-btn');
      const isCorrect = normalizeAnswer(selected) === normalizeAnswer(correct);

      buttons.forEach(btn => {
        if (btn === clicked) btn.classList.add(isCorrect ? 'correct' : 'incorrect');   // 【ブラッシュアップ】
        btn.style.pointerEvents = 'none';
      });

      const feedback = document.getElementById('feedback');
      feedback.style.display = 'block';

      if (isCorrect) {
        correctCount++;
        if (!missedThis) firstTryCount++;   // 【ブラッシュアップ】
        feedback.className = 'feedback correct';
        feedback.textContent = '🎉 正解！完璧です！よくできました！';

        document.getElementById('explanation').innerHTML = `<h3>解説</h3><p>${formatFractionInExplanation(explanation)}</p>`;
        document.getElementById('explanation').style.display = 'block';

        const actionButtons = document.getElementById('action-buttons');
        if (currentQuestionIndex < currentQuestions.length - 1) {
          actionButtons.innerHTML = `
            <button class="action-btn" onclick="nextQuestion()">次の問題へ</button>
          `;
        } else {
          // 最終問題なので結果を自動表示
          setTimeout(() => {
            finishQuiz();
          }, 1500);
        }
      } else {
        incorrectCount++;
        missedThis = true;   // 【ブラッシュアップ】
        feedback.className = 'feedback incorrect';
        feedback.innerHTML = '✗ 不正解' + (currentMode === 3 ? '' : '<div class="rule-hint">💡 まず原始関数 F(x) を求めて、F(上端) − F(下端) を計算しよう。</div>');

        if (currentMode === 3) {
          // 【ブラッシュアップ】正しい答えと解説を見せる。メニューに戻っていたら結果を出さない
          buttons.forEach(b => { if (normalizeAnswer(b.dataset.value) === normalizeAnswer(correct)) b.classList.add('correct'); });
          document.getElementById('explanation').innerHTML = `<h3>解説</h3><p>${formatFractionInExplanation(explanation)}</p>`;
          document.getElementById('explanation').style.display = 'block';
          const myRun = runId;
          setTimeout(() => {
            if (myRun === runId) gameOver();
          }, 3500);
        } else {
          const actionButtons = document.getElementById('action-buttons');
          actionButtons.innerHTML = `
            <button class="action-btn secondary" onclick="retryQuestion()">もう一度挑戦</button>
          `;
        }
      }
    }

    function retryQuestion() {
      isAnswered = false;
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => {
        btn.classList.remove('correct', 'incorrect');
        btn.style.pointerEvents = 'auto';
      });
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('action-buttons').innerHTML = '';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      showQuestion();
    }

    function timeText() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      return `${Math.floor(elapsed / 60)}分${elapsed % 60}秒`;
    }

    function gameOver() {
      clearInterval(timerInterval);
      document.getElementById('result-title').textContent = '😢 ここで終了';
      document.getElementById('result-message').innerHTML = `
        <div class="res-big">連続正解 ${correctCount} 問</div>
        <div>問題 ${currentQuestionIndex + 1} でまちがえました ／ ⏱️ ${timeText()}</div>
        <p class="res-comment">まちがえた問題の解説（[F(x)] の計算）を読んでから、もう一度挑戦しよう！</p>`;
      document.getElementById('result-overlay').style.display = 'flex';
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      const n = currentQuestions.length;
      const rate = firstTryCount / n;
      let title, comment;
      if (currentMode === 3) {
        title = '🏆 超鬼連チャン 完全制覇！';
        comment = 'ノーミスで 10 問。定積分の計算がしっかり身についています。';
      } else if (firstTryCount === n) {
        title = '🎉 全問一発正解！';
        comment = '定積分の計算がしっかりできています。';
      } else if (rate >= 0.6) {
        title = '👍 よくできました';
        comment = 'まちがえた問題は、解説の F(上端) − F(下端) の計算をたしかめよう。';
      } else {
        title = '💪 おつかれさま！';
        comment = 'まず原始関数 F(x) を求め、F(上端) − F(下端) を計算する流れを、解説を見ながらもう一度練習しよう。';
      }
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-message').innerHTML = `
        <div class="res-big">一発正解 ${firstTryCount} / ${n} 問</div>
        <div>❌ まちがえた回数 ${incorrectCount} 回 ／ ⏱️ ${timeText()}</div>
        <p class="res-comment">${comment}</p>`;
      document.getElementById('result-overlay').style.display = 'flex';
    }

        const MATH_RUN = /[A-Za-zαβ0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉₋'′()=+\-−·×÷/.,<>[\]{}|∫≦≧ ]*[A-Za-zαβ0-9∫][A-Za-zαβ0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉₋'′()=+\-−·×÷/.,<>[\]{}|∫≦≧ ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .no-math, .level-badge, script, style, svg, button.tap, .sign-btn, .nb-sign, .op-btn')) continue;
                if (/[A-Za-zαβ0-9∫]/.test(n.nodeValue)) nodes.push(n);
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    const span = document.createElement('span');
                    span.className = 'm';
                    text.split(/([A-Za-zαβ]+)/).forEach((part, k) => {
                        if (!part) return;
                        if (k % 2) {
                            // dx の d は立体、x は斜体
                            const dx = part.match(/^d([a-z])$/);
                            if (dx) span.appendChild(document.createTextNode('d'));
                            const i = document.createElement('i');
                            i.textContent = dx ? dx[1] : part;
                            span.appendChild(i);
                        } else {
                            span.appendChild(document.createTextNode(part.replace(/-/g, '−')));   // マイナスは数式の「−」に
                        }
                    });
                    frag.appendChild(span);
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        // 画面が書きかわるたびに、指定した場所の式を整える
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }
        watchMath(['#question', '#options-container', '#input-container', '#feedback', '#explanation']);   // 【ブラッシュアップ】式の書き方
    function backToMenu() {
      runId++;   // 【ブラッシュアップ】
      window.scrollTo(0, 0);
      clearInterval(timerInterval);
      document.getElementById('quiz-container').style.display = 'none';
      document.getElementById('mode-selection').style.display = 'grid';
      document.getElementById('result-overlay').style.display = 'none';
    }
  </script>
