<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>定積分の練習</title>
<link rel="stylesheet" href="../../assets/fill-steps.css?v=20261107">
<link rel="stylesheet" href="../../assets/sekibun.css?v=20261107">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap">
</head><body>
<a class="port-back" href="../index.html">← 教材の一覧へ</a>
<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅱ　微分・積分</small><h1>定積分の練習</h1></header>
  <div id="menu"></div><div id="app"></div>
</main>
<script src="../../assets/fill-steps.js?v=20261107"></script>
<script src="../../assets/sekibun.js?v=20261107"></script>
<script>
const md = s => FillSteps.md(s), { num, parse, polyS, sub, add, neg, R, lim, evalRows, cleanCards, nearValues, times } = Sek;
// 1. 定積分の計算
const CALC = [{ f: '2x', a: 0, b: 1 }, { f: 'x²', a: 0, b: 3 }, { f: '3', a: 1, b: 4 }, { f: 'x+1', a: 0, b: 2 }, { f: '2x+3', a: 1, b: 2 }, { f: 'x²+1', a: 1, b: 2 }, { f: '3x²+2x', a: 0, b: 2 }, { f: 'x-2', a: 0, b: 1 }, { f: 'x²', a: -1, b: 1 }, { f: '2x²+1', a: -1, b: 1 }];
const POOL = ["x;0;1","2x;0;1","1;0;2","x;0;2","3x²;0;1","4x³;0;1","x+1;0;1","2;0;2","x²;0;1","2x+1;0;1","x;1;2","1;1;3","2x;1;2","3;1;2","x;1;3","x+1;1;2","x²;1;2","2x+3;1;2","x²+1;1;2","x+2;1;3","x²;-1;1","1;-1;1","x;-1;1","x³;-1;1","x²;-2;2","x²+1;-1;1","2x²;-1;1","x²+2;-1;1","3x²;-1;1","x⁴;-1;1","4;-1;2","x²;-1;2","x²+3;-1;1","2x²+1;-1;1","5x⁴;-1;1","x³+x²;0;1","x²+2x+1;0;2","2x³+3x²;0;1","x²+1;1;3","3x²+2x;0;2","x⁴+x²;0;1","x²+x+1;1;2","x³+2x;0;2","x²+4;0;2","x³+x;-1;1","x⁴+1;-1;1","3x²+4x+1;0;1","x³+3x²+2x;0;1","2x-3;0;1","x-2;0;1","x²-4x+3;1;3","x-1;0;1","x²-2x;0;2","2x;1;3"]
  .map(s => { const [f, a, b] = s.split(';'); return { f, a: +a, b: +b }; });
const level = q => { const n = parse(q.f).length; return q.a < 0 || n >= 3 ? 4 : n === 2 ? 3 : q.a === 0 ? 1 : 2; };
// 2. 展開して定積分
const sgn = a => (a < 0 ? '− ' + -a : '+ ' + a);
const lin = (k, a) => [{ r: [k, 1], p: 1 }, { r: [a, 1], p: 0 }];
const prod = (k, a, l, b, lo, hi) => {
  const one = (c, v) => '(' + (c === 1 ? '' : c) + 'x ' + sgn(v) + ')';
  return { show: k === l && a === b ? one(k, a) + '²' : one(k, a) + one(l, b), ts: times(lin(k, a), lin(l, b)), a: lo, b: hi };
};
const xmul = (a, lo, hi) => ({ show: 'x(x ' + sgn(a) + ')', ts: times([{ r: [1, 1], p: 1 }], lin(1, a)), a: lo, b: hi });
const EXPAND = [prod(1, 1, 1, 1, 0, 1), xmul(2, 0, 3), prod(1, 1, 1, -2, 0, 2), prod(2, 1, 2, 1, 0, 1), prod(1, -1, 1, 3, 1, 2)];
const EXPOOL = [xmul(1, 0, 1), xmul(2, 0, 3), xmul(-1, 0, 3), xmul(-2, 1, 3), prod(1, 1, 1, 1, 0, 1), prod(1, 2, 1, 2, 0, 1), prod(1, -1, 1, -1, 0, 3), prod(1, 1, 1, 2, 0, 1), prod(1, 1, 1, -2, 0, 2), prod(1, 2, 1, -2, 0, 2), prod(1, -1, 1, 3, 1, 2), prod(1, 3, 1, -1, -1, 1), prod(2, 1, 1, 1, 0, 1), prod(2, 1, 2, 1, 0, 1), prod(2, -1, 1, 2, 0, 2), prod(3, 1, 1, -1, 0, 1)];
// 3. レベルアップ：定積分の性質と 1/6 公式
function sameEnds() {
  return { big: '∫{2|2} (x² + 1) dx', q: '定積分を求めよ。', ans: '0', value: [0, 1],
    rows: ['#上端と下端が同じ定積分は 0', { t: '∫{2|2} (x² + 1) dx = [0]', h: '∫{a|a} f(x) dx = 0 です。' }],
    cards: ['0', ['2', '上端と下端が同じです。'], ['5', '上端と下端が同じです。']], wrong: ['5', '2', '{14|3}'] };
}
function joinRange(f, a, c, b) {
  const ts = parse(f), e = evalRows(ts, a, b, '= '), I = (x, y) => '∫' + lim(y, x) + ' ' + Sek.paren(ts) + ' dx';
  return { big: I(a, c) + ' + ' + I(c, b), q: '定積分を求めよ。', ans: num(e.ans), value: e.ans,
    rows: ['#積分する区間をつなぐ', { t: I(a, c) + ' + ' + I(c, b) + ' = ∫{[' + num([b, 1]) + ']|[' + num([a, 1]) + ']} ' + Sek.paren(ts) + ' dx', h: num([a, 1]) + ' から ' + num([c, 1]) + ' と ' + num([c, 1]) + ' から ' + num([b, 1]) + ' をつなごう。' }, ...e.rows],
    cards: cleanCards([num([b, 1]), num([a, 1]), [num([c, 1]), '区間をつなぐと、はしの2つが残ります。'], ...e.cards]), wrong: nearValues(e.ans, [add(e.ans, [1, 1]), e.Fb, sub(e.ans, [2, 1])]) };
}
function sumSame(op, f, g, a, b) {
  const F = parse(f), G = parse(g), ts = op === '+' ? Sek.plus(F, G) : Sek.minus(F, G), e = evalRows(ts, a, b, '= ');
  const A = '∫' + lim(b, a) + ' ' + Sek.paren(F) + ' dx', B = '∫' + lim(b, a) + ' ' + Sek.paren(G) + ' dx', w = ts.length > 1 ? '(' + Sek.join(ts.map(t => ({ s: '[' + Sek.mono(t.r, t.p) + ']', neg: t.r[0] < 0 }))) + ')' : (ts[0].r[0] < 0 ? '−' : '') + '[' + Sek.mono(ts[0].r, ts[0].p) + ']';
  const dm = ts.map(t => [[Sek.mono(Sek.mul(t.r, [2, 1]), t.p), '同類項をもう一度まとめよう。'], [Sek.mono(t.r, t.p ? t.p + 1 : 1), '指数は変わりません。']]);
  return { big: A + ' ' + (op === '+' ? '+' : '−') + ' ' + B, q: '定積分を求めよ。', ans: num(e.ans), value: e.ans,
    rows: ['#区間が同じなので、1 つの定積分にまとめる', { t: A + ' ' + (op === '+' ? '+' : '−') + ' ' + B + ' = ∫' + lim(b, a) + ' ' + w + ' dx', h: 'かっこをはずして、同類項をまとめよう。', pb: dm.map(d => d.map(x => x[0])) }, ...e.rows],
    cards: cleanCards([...ts.map(t => Sek.mono(t.r, t.p)), ...dm.flat(), ...e.cards]), wrong: nearValues(e.ans, [add(e.ans, [1, 1]), neg(e.ans)]) };
}
function reversed(f, a, b) { return Sek.definite({ f, a, b }); }
function sixth(show, al, be) {
  const n3 = Math.pow(be - al, 3), ans = R(-n3, 6), A = num([al, 1], true), B = num([be, 1], true);
  return { big: '∫' + lim(be, al) + ' ' + show + ' dx', q: '定積分を求めよ。', ans: num(ans), value: ans,
    rows: [{ t: '!∫{β|α} (x − α)(x − β) dx = −{1|6}(β − α)³' }, { t: 'α = [' + num([al, 1]) + ']、β = [' + num([be, 1]) + ']', h: '(x − α)(x − β) = 0 の解が α、β です。下端が α、上端が β です。' },
      { t: '与式 = −{1|6}([' + B + '] − [' + A + '])³', h: 'β − α を公式に入れよう。' },
      { t: '= −{1|6} × [' + n3 + ']', h: '(β − α)³ を計算しよう。', sk: 1 }, { t: '= [' + num(ans) + ']', h: 'かけ算をして、約分しよう。' }],
    cards: cleanCards([num([al, 1]), num([be, 1]), B, A, String(n3), num(ans), [num(neg(ans)), '公式の先頭の − を忘れずに。'], [String(n3 * 2), '(β − α)³ をもう一度計算しよう。'], [num(R(-n3, 3)), '分母は 6 です。']]),
    wrong: nearValues(ans, [neg(ans), R(-n3, 3), R(n3, 3)]) };
}
const fac = v => (v === 0 ? 'x' : '(x ' + (v > 0 ? '− ' + v : '+ ' + -v) + ')');
const facs = (p, q) => (p === 0 ? 'x' + fac(q) : fac(p) + fac(q));
const UP = () => [reversed('x', 3, 1), sameEnds(), joinRange('2x', 0, 1, 3), sumSame('+', 'x²+x', 'x²-x', 0, 1), sumSame('−', 'x²+x', 'x²-x', 0, 1), sixth('x(x − 3)', 0, 3), sixth('(x + 1)(x − 2)', -1, 2), sixth('(x − 1)(x − 3)', 1, 3)];
function randUp() {
  const r = Sek.rint, al = r(-2, 1), be = al + r(1, 4), a = r(0, 1), c = a + r(1, 2), b = c + r(1, 2), k = r(1, 3);
  return Sek.pick([() => sixth(facs(al, be), al, be), () => sixth(facs(al, be), al, be), () => joinRange(`${2 * k}x`, a, c, b), () => joinRange(`${3 * k}x²`, a, c, b), () => reversed(`${2 * k}x`, b, a), () => sumSame('+', `x²+${k}x`, `x²-${k}x`, a, b)])();
}
const r = Sek.rint, s = () => Sek.pick(['+', '-']);
const randCalc = () => { const a = r(-2, 1), b = a + r(1, 3), k = r(1, 4), m = r(1, 5); return Sek.pick([{ f: `${3 * k}x²${s()}${2 * m}x`, a, b }, { f: `${2 * k}x${s()}${m}`, a, b }, { f: `${3 * k}x²${s()}${m}`, a, b }, { f: `${4 * k}x³${s()}${2 * m}x`, a, b }, { f: `x²${s()}${r(1, 4)}x`, a, b }]); };
const randExpand = () => Sek.pick(EXPOOL);
const asQ = q => { const p = q.rows ? q : Sek.definite(q); return { big: p.big, q: p.q, ans: p.ans, wrong: p.wrong, p }; };
const levelOrder = quota => quota.flatMap((n, i) => Sek.shuffle(POOL.filter(q => level(q) === i + 1)).slice(0, n)).map(asQ);
const allCalc = () => [1, 2, 3, 4].flatMap(l => Sek.shuffle(POOL.filter(q => level(q) === l))).map(asQ);
const hardness = q => (/[23]x/.test(q.show) ? 2 : q.show[0] === 'x' ? 0 : 1);
const allExpand = () => Sek.shuffle(EXPOOL).sort((a, b) => hardness(a) - hardness(b)).map(asQ);

const app = () => document.getElementById('app'), menuEl = () => document.getElementById('menu');
const FORMULA = () => '<div class="sk-formula">' + md('∫{b|a} f(x) dx = ⟦F(x)⟧{b|a} = F(b) − F(a)') + '<small>' + md('F′(x) = f(x)、定積分では C はいらない') + '</small></div>';
function fillMode(make, home) { menuEl().innerHTML = ''; Sek.fill(app(), make(), { top: FORMULA, home }); }
function quizMode(make, o, home) { menuEl().innerHTML = ''; const go = () => Sek.quiz(app(), make(), Object.assign({ home, again: go }, o)); go(); }
const tile = t => '<span>' + md(t) + '</span>';
function practice(name, o) {
  const home = () => { app().innerHTML = ''; practice(name, o); };
  const c = [{ name: '途中式で解く', sub: 'カードで答えへ（' + o.steps().length + '問）', icon: tile(o.icon), go: () => fillMode(o.steps, home) }];
  if (o.detail) c.push({ name: 'くわしく解く', sub: '上端・下端の代入も書く', icon: tile('⟦F(x)⟧{b|a}'), go: () => fillMode(o.detail, home) });
  c.push({ name: 'ランダム練習', sub: '1問ずつ答えを確かめる10問', icon: '?', go: () => fillMode(() => Array.from({ length: 10 }, o.rand), home) });
  if (o.ta) c.push({ name: 'タイムアタック', sub: '4択で10問、最後に確認', icon: '10', go: () => quizMode(o.ta, { name: 'タイムアタック', timed: true }, home) });
  if (o.all) {
    c.push({ name: '全問タイムアタック', sub: '全' + o.count + '問、だんだんむずかしく', icon: String(o.count), go: () => quizMode(o.all, { name: '全問タイムアタック', timed: true }, home) });
    c.push({ name: '超鬼連チャン', sub: '1回まちがえたら終わり', icon: '×', go: () => quizMode(o.all, { name: '超鬼連チャン', timed: true, oni: true }, home) });
  }
  if (o.note) c.push({ name: 'ノートで解く', sub: '自分で計算して4択（5問）', icon: '✎', go: () => quizMode(o.note, { name: 'ノートで解く' }, home) });
  menuEl().innerHTML = '';
  Sek.menu(menuEl(), c, name, showMenu);
}
function showMenu() {
  app().innerHTML = '';
  const def = (list, detail) => () => list.map(q => Sek.definite(q, detail));
  Sek.menu(menuEl(), [
    { name: '定積分の計算', sub: '上端 − 下端を計算する', icon: tile('∫{2|0} x dx'), go: () => practice('定積分の計算', { steps: def(CALC), detail: def(CALC, true), icon: '∫{2|0} x dx', rand: () => Sek.definite(randCalc()), ta: () => levelOrder([2, 3, 3, 2]), all: allCalc, count: POOL.length }) },
    { name: '展開して定積分', sub: 'かっこをはずしてから計算する', icon: tile('∫{1|0} (x + 1)² dx'), go: () => practice('展開して定積分', { steps: def(EXPAND), detail: def(EXPAND, true), icon: '∫{1|0} (x + 1)² dx', rand: () => Sek.definite(randExpand()), ta: () => Sek.shuffle(EXPOOL).slice(0, 10).sort((a, b) => hardness(a) - hardness(b)).map(asQ), all: allExpand, count: EXPOOL.length }) },
    { name: 'レベルアップ', sub: '定積分の性質と {1|6} 公式', icon: tile('−{1|6}(β − α)³'), go: () => practice('レベルアップ（定積分の性質と 1/6 公式）', { steps: UP, icon: '−{1|6}(β − α)³', rand: randUp, note: () => Array.from({ length: 5 }, () => asQ(randUp())) }) }
  ].map(c => (c.sub = md(c.sub), c)), '練習する内容を選ぼう。');
}
showMenu();
</script>
</body></html>
