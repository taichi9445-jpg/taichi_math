<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>定積分の練習</title>
<link rel="stylesheet" href="../../assets/fill-steps.css?v=20261106">
<link rel="stylesheet" href="../../assets/sekibun.css?v=20261106">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap">
</head><body>
<a class="port-back" href="../index.html">← 教材の一覧へ</a>
<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅱ　微分・積分</small><h1>定積分の練習</h1></header>
  <div id="menu"></div><div id="app"></div>
</main>
<script src="../../assets/fill-steps.js?v=20261106"></script>
<script src="../../assets/sekibun.js?v=20261106"></script>
<script>
const md = s => FillSteps.md(s), { num, parse, polyS, anti, at, sub, add, neg, R, lim, paren, evalRows, cleanCards, nearValues } = Sek;
const M = '−', GROUP = ['基本', '下端が負の数', '定積分の性質', '{1|6} 公式'];

// 定積分の性質の問題
function sameEnds() {
  return { big: '∫{2|2} (x² + 1) dx', q: '定積分を求めよ。', ans: '0', value: [0, 1], group: 2,
    rows: ['#上端と下端が同じ定積分は 0', { t: '∫{2|2} (x² + 1) dx = [0]', h: '∫{a|a} f(x) dx = 0 です。' }],
    cards: ['0', ['2', '上端と下端が同じです。'], ['5', '上端と下端が同じです。']], wrong: ['5', '2', '{14|3}'] };
}
function joinRange() {
  const ts = parse('2x'), e = evalRows(ts, 0, 3, '= ');
  return { big: '∫{1|0} 2x dx + ∫{3|1} 2x dx', q: '定積分を求めよ。', ans: num(e.ans), value: e.ans, group: 2,
    rows: ['#積分する区間をつなぐ', { t: '∫{1|0} 2x dx + ∫{3|1} 2x dx = ∫{[3]|[0]} 2x dx', h: '0 から 1 と 1 から 3 をつなぐと、0 から 3 になります。' }, ...e.rows],
    cards: cleanCards(['3', '0', ['1', '区間をつなぐと 0 から 3 です。'], ...e.cards]), wrong: nearValues(e.ans, [[8, 1], [10, 1], [1, 1]]) };
}
function sumSame(op) {
  const f = 'x²+x', g = op === '+' ? 'x²-x' : 'x²-x', ts = op === '+' ? parse('2x²') : parse('2x'), e = evalRows(ts, 0, 1, '= ');
  const A = '∫{1|0} (x² + x) dx', B = '∫{1|0} (x² − x) dx', w = polyS(ts);
  return { big: A + (op === '+' ? ' + ' : ' − ') + B, q: '定積分を求めよ。', ans: num(e.ans), value: e.ans, group: 2,
    rows: ['#区間が同じなので、1 つの定積分にまとめる', { t: A + (op === '+' ? ' + ' : ' − ') + B + ' = ∫{1|0} [' + w + '] dx', h: 'かっこをはずして、同類項をまとめよう。' }, ...e.rows],
    cards: cleanCards([w, [op === '+' ? '2x' : '2x²', '符号に気をつけて、まとめよう。'], ['2x² + 2x', '符号に気をつけて、まとめよう。'], ...e.cards]), wrong: nearValues(e.ans, [add(e.ans, [1, 1]), neg(e.ans)]) };
}
// (x − α)(x − β) の 1/6 公式
function sixth(show, al, be) {
  const n3 = Math.pow(be - al, 3), ans = R(-n3, 6), A = num([al, 1], true), B = num([be, 1], true);
  return { big: '∫' + lim(be, al) + ' ' + show + ' dx', q: '定積分を求めよ。', ans: num(ans), value: ans, group: 3,
    rows: [{ t: '!∫{β|α} (x − α)(x − β) dx = −{1|6}(β − α)³' }, { t: 'α = [' + num([al, 1]) + ']、β = [' + num([be, 1]) + ']', h: '(x − α)(x − β) = 0 の解が α、β です。下端が α、上端が β です。' },
      { t: '与式 = −{1|6}([' + B + '] − [' + A + '])³', h: 'β − α を公式に入れよう。' },
      { t: '= −{1|6} × [' + n3 + ']', h: '(β − α)³ を計算しよう。', sk: 1 }, { t: '= [' + num(ans) + ']', h: 'かけ算をして、約分しよう。' }],
    cards: cleanCards([num([al, 1]), num([be, 1]), B, A, String(n3), num(ans), [num(neg(ans)), '公式の先頭の − を忘れずに。'], [String(n3 * 2), '(β − α)³ をもう一度計算しよう。'], [num(R(-n3, 3)), '分母は 6 です。']]),
    wrong: nearValues(ans, [neg(ans), R(-n3, 3), R(n3, 3)]) };
}
const STEPS = () => [
  { f: '2x', a: 0, b: 1, group: 0 }, { f: 'x²', a: 0, b: 3, group: 0 }, { f: '3', a: 1, b: 4, group: 0 }, { f: 'x+1', a: 0, b: 2, group: 0 }, { f: '2x+3', a: 1, b: 2, group: 0 }, { f: 'x²+1', a: 1, b: 2, group: 0 }, { f: '3x²+2x', a: 0, b: 2, group: 0 }, { f: 'x-2', a: 0, b: 1, group: 0 },
  { show: '(x + 1)²', f: 'x²+2x+1', a: 0, b: 1, group: 0 },
  { f: 'x²', a: -1, b: 1, group: 1 }, { f: 'x²', a: -2, b: 2, group: 1 }, { f: '4', a: -1, b: 2, group: 1 }, { f: '2x²+1', a: -1, b: 1, group: 1 }, { f: 'x³+x', a: -1, b: 1, group: 1 },
].map(Sek.definite).concat([Object.assign(Sek.definite({ f: 'x', a: 3, b: 1 }), { group: 2 }), sameEnds(), joinRange(), sumSame('+'), sumSame('−'),
  sixth('x(x − 3)', 0, 3), sixth('(x + 1)(x − 2)', -1, 2), sixth('(x − 1)(x − 3)', 1, 3)]);

// タイムアタック（計算だけでできる問題）
const POOL = ["x;0;1","2x;0;1","1;0;2","x;0;2","3x²;0;1","4x³;0;1","x+1;0;1","2;0;2","x²;0;1","2x+1;0;1","x;1;2","1;1;3","2x;1;2","3;1;2","x;1;3","x+1;1;2","x²;1;2","2x+3;1;2","x²+1;1;2","x+2;1;3","x²;-1;1","1;-1;1","x;-1;1","x³;-1;1","x²;-2;2","x²+1;-1;1","2x²;-1;1","x²+2;-1;1","3x²;-1;1","x⁴;-1;1","4;-1;2","x²;-1;2","x²+3;-1;1","2x²+1;-1;1","5x⁴;-1;1","x³+x²;0;1","x²+2x+1;0;2","2x³+3x²;0;1","x²+1;1;3","3x²+2x;0;2","x⁴+x²;0;1","x²+x+1;1;2","x³+2x;0;2","x²+4;0;2","x³+x;-1;1","x⁴+1;-1;1","3x²+4x+1;0;1","x³+3x²+2x;0;1","2x-3;0;1","x-2;0;1","x²-4x+3;1;3","x-1;0;1","x²-2x;0;2","2x;1;3"]
  .map(s => { const [f, a, b] = s.split(';'); return { f, a: +a, b: +b }; });
const level = q => { const n = parse(q.f).length; return q.a < 0 || n >= 3 ? 4 : n === 2 ? 3 : q.a === 0 ? 1 : 2; };
const asQ = q => { const p = q.rows ? q : Sek.definite(q); return { big: p.big, q: p.q, ans: p.ans, wrong: p.wrong, p }; };
const byLevel = quota => quota.flatMap((n, i) => Sek.shuffle(POOL.filter(q => level(q) === i + 1)).slice(0, n)).map(asQ);
const allByLevel = () => [1, 2, 3, 4].flatMap(l => Sek.shuffle(POOL.filter(q => level(q) === l))).map(asQ);
function randomQ() {
  const r = Sek.rint, a = r(-2, 1), b = a + r(1, 3), k = r(1, 4), m = r(1, 5), s = () => Sek.pick(['+', '-']);
  return Sek.pick([() => ({ f: `${3 * k}x²${s()}${2 * m}x`, a, b }), () => ({ f: `${2 * k}x${s()}${m}`, a, b }), () => ({ f: `${3 * k}x²${s()}${m}`, a, b }), () => ({ f: `${4 * k}x³${s()}${2 * m}x`, a, b }), () => ({ f: `x²${s()}${r(1, 4)}x`, a, b })])();
}
const home = () => { document.getElementById('app').innerHTML = ''; showMenu(); };
const FORMULA = () => '<div class="sk-formula">' + md('∫{b|a} f(x) dx = ⟦F(x)⟧{b|a} = F(b) − F(a)') + '<small>' + md('F′(x) = f(x)、定積分では C はいらない') + '</small></div>';
function fillMode(P, tab) {
  document.getElementById('menu').innerHTML = '';
  Sek.fill('#app', P, { top: FORMULA, home, tabGroup: tab ? p => ({ id: p.group, label: GROUP[p.group].replace(/[{}|]/g, '') }) : null });
}
function quizMode(make, o) {
  document.getElementById('menu').innerHTML = '';
  const go = () => Sek.quiz(document.getElementById('app'), make(), Object.assign({ home, again: go }, o));
  go();
}
const tile = t => '<span>' + md(t) + '</span>';
function showMenu() {
  Sek.menu(document.getElementById('menu'), [
    { name: '途中式で解く', sub: 'カードで式を作る（' + STEPS().length + '問）', icon: tile('∫{2|0} x dx'), go: () => fillMode(STEPS(), true) },
    { name: 'ランダム練習', sub: '数値が毎回かわる10問', icon: tile('⟦F(x)⟧{b|a}'), go: () => fillMode(Array.from({ length: 10 }, () => Sek.definite(randomQ())), false) },
    { name: 'ノートで解く', sub: '自分で計算して4択（10問）', icon: '✎', go: () => quizMode(() => [...Array.from({ length: 7 }, () => asQ(randomQ())), ...Sek.shuffle(STEPS().filter(p => p.group >= 2)).slice(0, 3).map(asQ)], { name: 'ノートで解く' }) },
    { name: 'タイムアタック', sub: '4択で10問', icon: '10', go: () => quizMode(() => byLevel([2, 3, 3, 2]), { name: 'タイムアタック', timed: true }) },
    { name: '全問タイムアタック', sub: '全' + POOL.length + '問に挑戦', icon: String(POOL.length), go: () => quizMode(allByLevel, { name: '全問タイムアタック', timed: true }) },
    { name: '超鬼連チャン', sub: '1回まちがえたら終わり', icon: '×', go: () => quizMode(allByLevel, { name: '超鬼連チャン', timed: true, oni: true }) }
  ], 'モードを選んで始めよう。');
}
showMenu();
</script>
</body></html>
