<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <!--
    数学Ⅱ 05. 微分の練習 応用（微分クイズチャレンジ）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../../assets/port.css">
  <script src="../../assets/port.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微分クイズチャレンジ</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            color: #333;
        }

        html, body {
            height: 100%;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .mode-selection {
            padding: 40px;
            text-align: center;
        }

        .mode-btn {
            display: inline-block;
            margin: 15px;
            padding: 20px 40px;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .mode-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .quiz-container {
            padding: 40px;
            display: none;
        }

        .timer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #ffecd2, #fcb69f);
            border-radius: 15px;
        }

        .timer {
            font-size: 2em;
            font-weight: bold;
            color: #e74c3c;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .progress {
            font-size: 1.2em;
            color: #2c3e50;
            font-weight: bold;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .question {
            font-size: 1.5em;
            margin-bottom: 25px;
            text-align: center;
            color: #2c3e50;
        }

        .fraction {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            margin: 0 3px;
        }

        .fraction .numerator {
            display: block;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
        }

        .fraction .denominator {
            display: block;
            padding-top: 2px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option {
            padding: 20px;
            background: white;
            border: 3px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
        }

        .option:hover {
            border-color: #4ecdc4;
            background: #f0fdfc;
            transform: translateY(-2px);
        }

        .option.selected {
            border-color: #2ecc71;
            background: #d5f4e6;
        }

        .option.correct {
            border-color: #27ae60;
            background: #d5f4e6;
            animation: correctPulse 0.6s ease;
        }

        .option.incorrect {
            border-color: #e74c3c;
            background: #fadbd8;
            animation: incorrectShake 0.6s ease;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .next-btn {
            display: none;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .results {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .score {
            font-size: 3em;
            color: #27ae60;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .time-display {
            font-size: 1.5em;
            color: #e74c3c;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }

        .hell-mode {
            background: linear-gradient(45deg, #ff416c, #ff4b2b) !important;
            animation: hellPulse 2s infinite;
        }

        @keyframes hellPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 65, 108, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 65, 108, 0.8); }
        }

        .back-to-menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-to-menu-btn:hover {
            background: rgba(0,0,0,0.9);
            transform: translateY(-2px);
        }

        .input-section {
            text-align: center;
            margin-top: 20px;
        }

        #answerInput {
            width: 80%;
            max-width: 400px;
            padding: 15px;
            font-size: 1.2em;
            border: 3px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            ime-mode: disabled;
        }

        #answerInput:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        .submit-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .input-feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 20px;
        }

        .input-feedback.correct {
            background: #d5f4e6;
            color: #27ae60;
            border: 2px solid #27ae60;
        }

        .input-feedback.incorrect {
            background: #fadbd8;
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }
    </style>
  <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->

  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    html, body { height: auto; }
    body { padding: 12px; }
    .container { overflow: visible; padding: 20px 16px; }
    .header { background: none; color: var(--u-ink); padding: 4px 4px 0; }
    .header h1 { font-size: min(2.2rem, 6vw); white-space: nowrap; text-shadow: none; margin: 0 0 6px; }
    .header p { color: var(--u-sub); font-weight: 700; }
    .mode-selection { padding: 12px 4px; }
    .mode-selection h2 { color: var(--u-title-dark); font-size: 1.2rem; }
    .mode-btn { display: block; width: 100%; max-width: 440px; margin: 12px auto; padding: 16px 20px; font-size: 1.15em; box-sizing: border-box; }
    .mode-btn small { color: var(--u-sub); font-weight: 700; }
    .mode-btn.hell-mode { background: var(--u-ng-soft) !important; border-color: var(--u-ng-line) !important; color: var(--u-ng) !important; animation: none; }
    .quiz-container { padding: 12px 4px; }
    .mode-indicator, .back-to-menu-btn { position: static; display: inline-block; margin: 0 6px 10px 0; }
    .mode-indicator { background: var(--u-soft-yellow); color: var(--u-soft-yellow-text); }
    .mode-indicator.hell-mode { background: var(--u-ng-soft) !important; color: var(--u-ng); animation: none; }
    .timer-section { background: var(--u-soft-yellow); border: 3px dashed #fde68a; padding: 10px 16px; margin-bottom: 16px; }
    .timer { color: var(--u-accent-text); text-shadow: none; font-size: 1.4em; }
    .progress { color: var(--u-ink); }
    .question-card { background: #f8fafc; border: 3px solid var(--u-line); box-shadow: none; border-radius: 24px; margin-bottom: 12px; }
    .question { color: var(--u-ink); font-weight: 800; font-size: 1.3em; }
    .option { font-size: 1.25em; font-weight: 700; width: 100%; font-family: 'Times New Roman', 'M PLUS Rounded 1c', serif; }
    .option:disabled { cursor: default; }
    .option.incorrect { animation: none; }
    .fraction { font-size: 0.85em; line-height: 1.15; }
    .fraction .numerator { border-bottom-color: currentColor; }
    .answer-line { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .answer-label { font-family: 'Times New Roman', serif; font-size: 1.3em; font-weight: 700; color: var(--u-ink); white-space: nowrap; }
    #answerInput { margin-bottom: 0; }
    .input-feedback { border-radius: 14px; margin: 10px 0; }
    .input-feedback:empty { display: none; }
    .input-feedback.correct { background: var(--u-ok-soft); color: var(--u-ok); border: 3px solid var(--u-ok-line); }
    .input-feedback.incorrect { background: var(--u-ng-soft); color: var(--u-ng); border: 3px solid var(--u-ng-line); }
    .input-feedback.shown { background: #fff; color: var(--u-ink); border: 3px dashed var(--u-line); }
    .input-help { margin: 12px 0 0; font-size: 0.9em; color: var(--u-sub); line-height: 1.6; text-align: left; }
    .input-help summary { cursor: pointer; font-weight: 700; }
    .rule-hint { margin-top: 8px; color: var(--u-title); font-size: 0.95rem; font-weight: 700; }
    .hint-box { margin-top: 12px; background: var(--u-soft-blue); border: 2px solid var(--u-soft-blue-line); color: var(--u-title); border-radius: 16px; padding: 10px 14px; font-weight: 700; line-height: 1.9; text-align: left; }
    .hint-tag { display: inline-block; background: #fff; border-radius: 999px; padding: 0 10px; margin-right: 6px; font-size: 0.85em; }
    .hint-row { text-align: center; margin-top: 14px; }
    .hint-button { background: #fff; border: 2px solid var(--u-line); border-radius: 999px; padding: 8px 18px; font-weight: 700; color: var(--u-sub); cursor: pointer; font-family: inherit; font-size: 0.95rem; }
    .explain-box { margin-top: 14px; background: #fff; border: 3px dashed var(--u-line); color: var(--u-ink); border-radius: 16px; padding: 12px 14px; font-weight: 700; line-height: 1.9; text-align: left; }
    .explain-box.ok { background: var(--u-ok-soft); border: 3px solid var(--u-ok-line); }
    .explain-title { font-size: 1.15em; margin-bottom: 4px; }
    .next-btn { margin-top: 16px; }
    .results h2 { color: var(--u-accent-text); white-space: nowrap; font-size: min(2rem, 7.5vw); }
    .score { color: var(--u-title); text-shadow: none; font-size: 2.2em; font-weight: 800; }
    .time-display { color: var(--u-sub); font-weight: 700; }
    #encouragementText { color: var(--u-ink); font-weight: 700; line-height: 1.8; }
    .result-nav { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 18px auto 0; }
    .result-nav button { margin: 0; padding: 12px; }
    .result-nav a { color: var(--u-sub); font-weight: 700; }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 14px 10px; }
      .question-card { padding: 16px 10px; }
      .question { font-size: 1.1em; margin-bottom: 14px; }
      .options { gap: 8px; }
      .option { padding: 12px 6px; font-size: 1.1em; }
      .timer { font-size: 1.2em; }
      .timer-section { padding: 8px 14px; margin-bottom: 10px; }
      #answerInput { width: 100%; box-sizing: border-box; }
      .submit-btn { margin: 6px 4px !important; }
    }
  
  </style>
</head>
<body class="u-theme">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container">
        <div class="header">
            <h1>🧮 微分クイズチャレンジ 🚀</h1>
            <p>単項式・多項式の微分をマスターしよう！</p>
        </div>

        <div class="mode-selection" id="modeSelection">
            <h2>チャレンジモードを選択してください</h2>
            <button class="mode-btn" onclick="startQuiz('normal')">
                📚 通常モード<br>
                <small>10問ランダム出題（やさしい問題から順に）</small>
            </button>
            <button class="mode-btn" onclick="startQuiz('hundred')">
                💯 全問連続モード<br>
                <small>全<span class="pool-count">80</span>問に連続チャレンジ</small>
            </button>
            <button class="mode-btn hell-mode" onclick="startQuiz('hell')">
                👹 超鬼連チャンモード<br>
                <small>全<span class="pool-count">80</span>問・1問でも間違えたら終了</small>
            </button>
            <button class="mode-btn" onclick="startQuiz('input')" style="background: linear-gradient(45deg, #a8e6cf, #88d8a3);">
                ✏️ 入力モード<br>
                <small>10問・答えを直接入力<br>※整数係数の問題のみ</small>
            </button>
        </div>

        <div class="quiz-container" id="quizContainer">
            <div class="mode-indicator" id="modeIndicator"></div>
            <button class="back-to-menu-btn" onclick="showModeSelection()">← メニューに戻る</button>
            <div class="timer-section">
                <div class="timer" id="timer">00:00</div>
                <div class="progress" id="progress">問題 1/10</div>
            </div>

            <div class="question-card">
                <div class="question" id="question"></div>
                <div class="options" id="options"></div>
                <!-- 【ブラッシュアップ】答えのまちがい・ヒントが、入力欄のすぐ下に出るように並べかえた（元は説明の下で、スマホでは画面の外だった） -->
                <div class="input-section" id="inputSection" style="display: none;">
                    <div class="answer-line"><span class="answer-label" id="answerLabel">f'(x) =</span>
                    <input type="text" id="answerInput" placeholder="例：-x^2 + 2x" autocomplete="off" autocapitalize="off" spellcheck="false" /></div>
                    <div class="input-feedback" id="inputFeedback"></div>
                    <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">回答する</button>
                    <button class="submit-btn" id="showAnswerBtn" onclick="showAnswer()" style="background: linear-gradient(45deg, #f39c12, #e67e22); margin-left: 10px;">答えを見る</button>
                    <details class="input-help">
                        <summary>📱 入力のしかた</summary>
                        • 指数：x^2 または x**2（ハット記号は英数字キーボードの6の上）<br>
                        • マイナス：- （ひらがなキーボードの「ー」でもOK）<br>
                        • 例：2x + 1, -3x^2 + 5x, 0（「f'(x) =」は書いても書かなくてもOK）
                    </details>
                </div>
                <div id="hintArea"></div>
                <div id="explainArea"></div>
                <div class="hint-row" id="hintRow"><button class="hint-button" id="hintBtn" onclick="showNextHint()">💡 ヒント（方針）を見る</button></div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
            </div>
        </div>

        <div class="results" id="results">
            <h2>🎉 お疲れさまでした！</h2>
            <div class="score" id="finalScore"></div>
            <div class="time-display" id="finalTime"></div>
            <div id="encouragementText"></div>
            <!-- 【ブラッシュアップ】ほかの教材も選べるようにした -->
            <div class="result-nav">
                <button class="restart-btn again" onclick="restartSameMode()">同じモードで再挑戦</button>
                <button class="restart-btn plain" onclick="showModeSelection()">モードをえらび直す</button>
                <a href="../remake.html">ほかの教材をえらぶ</a>
            </div>
        </div>
    </div>

    <script>
        // 問題プール（【ブラッシュアップ】元の 80 問に、展開・f'(a)・係数を決める問題を足した）
        const problemPool = [
            // 単項式（基本）
            {q: "f(x) = x", options: ["1", "x", "0", "2x"], correct: 0},
            {q: "f(x) = 2x", options: ["2", "x", "2x", "0"], correct: 0},
            {q: "f(x) = 3x", options: ["3", "3x", "1", "0"], correct: 0},
            {q: "f(x) = 5x", options: ["5", "x", "5x", "1"], correct: 0},
            {q: "f(x) = x²", options: ["2x", "x", "x²", "2"], correct: 0},
            {q: "f(x) = x³", options: ["3x²", "x²", "3x", "x³"], correct: 0},
            {q: "f(x) = x⁴", options: ["4x³", "x³", "4x", "x⁴"], correct: 0},
            {q: "f(x) = x⁵", options: ["5x⁴", "x⁴", "5x", "x⁵"], correct: 0},
            {q: "f(x) = 2x²", options: ["4x", "2x", "x²", "2"], correct: 0},
            {q: "f(x) = 3x²", options: ["6x", "3x", "x²", "3"], correct: 0},

            // 単項式（係数あり）
            {q: "f(x) = 4x³", options: ["12x²", "4x²", "3x²", "12x"], correct: 0},
            {q: "f(x) = 6x²", options: ["12x", "6x", "2x", "12"], correct: 0},
            {q: "f(x) = -x", options: ["-1", "1", "-x", "x"], correct: 0},
            {q: "f(x) = -2x", options: ["-2", "2", "-2x", "2x"], correct: 0},
            {q: "f(x) = -x²", options: ["-2x", "2x", "-x", "x"], correct: 0},
            {q: "f(x) = -3x²", options: ["-6x", "6x", "-3x", "3x"], correct: 0},
            {q: "f(x) = 7x", options: ["7", "1", "7x", "x"], correct: 0},
            {q: "f(x) = 8x³", options: ["24x²", "8x²", "3x²", "24x"], correct: 0},
            {q: "f(x) = 9x⁴", options: ["36x³", "9x³", "4x³", "36x"], correct: 0},
            {q: "f(x) = 10x", options: ["10", "1", "10x", "x"], correct: 0},

            // 分数係数
            {q: "f(x) = <span class='fraction'><span class='numerator'>1</span><span class='denominator'>2</span></span>x", options: ["<span class='fraction'><span class='numerator'>1</span><span class='denominator'>2</span></span>", "1", "x", "2"], correct: 0},
            {q: "f(x) = <span class='fraction'><span class='numerator'>1</span><span class='denominator'>3</span></span>x²", options: ["<span class='fraction'><span class='numerator'>2</span><span class='denominator'>3</span></span>x", "<span class='fraction'><span class='numerator'>1</span><span class='denominator'>3</span></span>x", "2x", "x"], correct: 0},

            {q: "f(x) = <span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span>x²", options: ["<span class='fraction'><span class='numerator'>3</span><span class='denominator'>2</span></span>x", "<span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span>x", "2x", "<span class='fraction'><span class='numerator'>3</span><span class='denominator'>8</span></span>x"], correct: 0},
            {q: "f(x) = <span class='fraction'><span class='numerator'>1</span><span class='denominator'>4</span></span>x³", options: ["<span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span>x²", "<span class='fraction'><span class='numerator'>1</span><span class='denominator'>4</span></span>x²", "3x²", "x²"], correct: 0},

            // 多項式（2項）

        // ---- 【ブラッシュアップ】式を読み取って、正解・途中式を計算する道具 ----
        //   問題文（分数は <span class='fraction'> で書かれている）を [係数, 次数] の並びにする。係数は [分子, 分母]
        const gcd = (a, b) => (b === 0 ? Math.abs(a) : gcd(b, a % b));
        const R = (v) => { let [p, q] = Array.isArray(v) ? v : [v, 1]; if (q < 0) { p = -p; q = -q; } const g = gcd(p, q) || 1; return [p / g, q / g]; };
        const rmul = (a, b) => R([a[0] * b[0], a[1] * b[1]]);
        const radd = (a, b) => R([a[0] * b[1] + b[0] * a[1], a[1] * b[1]]);
        const MINUS = '−';
        const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
        const sup = (n) => String(n).split('').map(d => SUPS[d]).join('');
        const frac = (p, q) => `<span class='fraction'><span class='numerator'>${p}</span><span class='denominator'>${q}</span></span>`;
        const absR = (r) => (r[1] === 1 ? String(Math.abs(r[0])) : frac(Math.abs(r[0]), r[1]));
        const numTxt = (r) => (r[0] < 0 ? MINUS : '') + absR(r);
        const xpow = (n) => (n === 0 ? '' : n === 1 ? 'x' : 'x' + sup(n));
        function readPoly(s) {
            let t = String(s).replace(/^f\(x\)\s*=\s*/, '')
                .replace(/<span class='fraction'><span class='numerator'>(\d+)<\/span><span class='denominator'>(\d+)<\/span><\/span>/g, '[$1/$2]')
                .replace(/\s+/g, '').replace(/[−ー－]/g, '-')
                .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^' + [...m].map(c => SUPS.indexOf(c)).join(''));
            if (/[^0-9x^+\-\[\]\/]/.test(t)) return null;
            const re = /([+-]?)(\[\d+\/\d+\]|\d*)(x(?:\^(\d+))?)?/y;
            const out = [];
            let pos = 0;
            while (pos < t.length) {
                re.lastIndex = pos;
                const m = re.exec(t);
                if (!m || (!m[2] && !m[3])) return null;
                let c = m[2] ? (m[2][0] === '[' ? m[2].slice(1, -1).split('/').map(Number) : [Number(m[2]), 1]) : [1, 1];
                if (m[1] === '-') c = [-c[0], c[1]];
                out.push([R(c), m[3] ? (m[4] ? Number(m[4]) : 1) : 0]);
                pos += m[0].length;
            }
            return out;
        }
        function norm(terms) {
            const m = {};
            terms.forEach(([c, n]) => { m[n] = radd(m[n] || [0, 1], R(c)); });
            return Object.keys(m).map(Number).filter(n => m[n][0] !== 0).sort((a, b) => b - a).map(n => [m[n], n]);
        }
        function termTxt(c, n, first) {
            const sign = c[0] < 0 ? (first ? MINUS : ` ${MINUS} `) : (first ? '' : ' + ');
            const b = (n > 0 && Math.abs(c[0]) === 1 && c[1] === 1) ? xpow(n) : absR(c) + xpow(n);
            return sign + b;
        }
        const polyTxt = (terms) => { const t = norm(terms); return t.length ? t.map(([c, n], i) => termTxt(c, n, i === 0)).join('') : '0'; };
        const deriv = (terms) => norm(terms).filter(([, n]) => n > 0).map(([c, n]) => [rmul(c, [n, 1]), n - 1]);
        const valueAt = (terms, a) => norm(terms).reduce((s, [c, n]) => radd(s, rmul(c, [Math.pow(a, n), 1])), [0, 1]);
        function termDeriv(c, n) {   // (kxⁿ)' = k·n xⁿ⁻¹
            if (n === 0) return '0';
            if (n === 1) return numTxt(c);
            const k = (Math.abs(c[0]) === 1 && c[1] === 1) ? (c[0] < 0 ? MINUS : '') : numTxt(c) + '·';
            return `${k}${n}${xpow(n - 1)}`;
        }
        // 元の問題文のマイナス（-）を、数式らしいマイナス（−）にして見せる
        const pretty = (s) => String(s).replace(/(^|[\s(>])-(?=[\dx<(])/g, '$1' + MINUS);

        // 問題ごとの 方針・途中式・正解の式
        function info(q) {
            if (q._info) return q._info;
            if (q.custom) return (q._info = { plan: q.plan, mid: q.mid, lead: q.lead, ans: q.options[q.correct] });
            const f = q.f || readPoly(q.q);
            const t = norm(f), d = deriv(f);
            let mid = q.f ? `展開すると f(x) = ${polyTxt(f)}。` : '';
            if (t.length === 1) mid += `f'(x) = (${termTxt(t[0][0], t[0][1], true)})' = ${termDeriv(t[0][0], t[0][1])}`;
            else {
                mid += "f'(x) = " + t.map(([c, n], i) => (i === 0 ? (c[0] < 0 ? MINUS : '') : (c[0] < 0 ? ` ${MINUS} ` : ' + ')) + `(${termTxt([Math.abs(c[0]), c[1]], n, true)})'`).join('') +
                    ' = ' + (t.filter(([, n]) => n > 0).map(([c, n], i) => (i === 0 ? '' : (c[0] < 0 ? ` ${MINUS} ` : ' + ')) + termDeriv([i === 0 ? c[0] : Math.abs(c[0]), c[1]], n)).join('') || '0');
            }
            let plan, lead, value = null;
            if (q.at !== undefined) {
                const a = q.at, A = a < 0 ? `(${MINUS}${-a})` : String(a);
                if (!mid.endsWith(polyTxt(d))) mid += ` = ${polyTxt(d)}`;
                mid += ` なので、f'(${numTxt([a, 1])}) = ` + d.map(([c, n], i) => {
                    const sign = c[0] < 0 ? (i === 0 ? MINUS : ` ${MINUS} `) : (i === 0 ? '' : ' + ');
                    return sign + (n === 0 ? absR(c) : `${absR(c)}·${A}${n > 1 ? sup(n) : ''}`);
                }).join('');
                value = valueAt(d, a);
                plan = "まず f'(x) を求めてから、x の値を代入しよう。f(a) ではなく f'(a) だよ。";
                lead = `${pretty(q.q)} のとき、f'(${numTxt([a, 1])}) の値を求めなさい。`;
            } else {
                plan = q.f ? 'かっこのままでは微分できない。まず展開して、1 つの項ずつ微分しよう。'
                    : "1 つの項ずつ (kxⁿ)' = k·n xⁿ⁻¹。係数が分数でも同じで、かけたあと約分しよう。定数の項は微分すると 0。";
                lead = `次の関数を微分して、f'(x) を求めなさい。<br><br>${pretty(q.q)}`;
            }
            return (q._info = { plan, mid, lead, d, value, ans: value ? numTxt(value) : polyTxt(d) });
        }
        // 難しさの目安（通常・入力モードでは、やさしい順に並べて出す）
        function level(q) {
            if (q.custom) return 9;
            if (q.at !== undefined) return 8;
            if (q.f) return 7;
            const t = readPoly(q.q) || [];
            const frac = /fraction/.test(q.q) ? 3 : 0;
            const neg = t.some(([c]) => c[0] < 0) ? 1 : 0;
            const deg = Math.max(0, ...t.map(([, n]) => n));
            return frac + t.length + neg + (deg >= 4 ? 1 : 0);
        }

        }

        // 【ブラッシュアップ】
        //   ・元は「f(x) = 10」を探す書き方だったため、f(x) = 10x や f(x) = 100x - 50 まで「定数の問題」にまざっていた
        //   ・10 問を、やさしい順に並べて出す（元は完全にランダムで、1 問目から難しい問題が出ることがあった）
        //   ・入力モードは、分数の係数と「係数を決める問題」をのぞく
        const isConstant = (p) => /^f\(x\) = -?\d+$/.test(p.q);
        function getRandomQuestions(count) {
            let pool = problemPool;
            if (currentMode === 'input') {
                pool = problemPool.filter(p => !p.custom && !/fraction|\//.test(p.q) && !/fraction|\//.test(p.options[p.correct]));
            }
            const constants = pool.filter(isConstant);
            const others = shuffleArray([...pool.filter(p => !isConstant(p))]);
            const picked = [constants[Math.floor(Math.random() * constants.length)], ...others.slice(0, count - 1)];
            return picked.map((p, i) => [level(p) + Math.random() * 0.5, p]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                document.getElementById('timer').textContent =
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function showQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            const I = info(question);
            document.getElementById('question').innerHTML = I.lead;
            document.getElementById('progress').textContent = `問題 ${currentQuestionIndex + 1}/${totalQuestions}`;
            stage = 0;
            done = false;
            document.getElementById('hintArea').innerHTML = '';
            document.getElementById('explainArea').innerHTML = '';
            document.getElementById('hintRow').style.display = '';
            document.getElementById('hintBtn').textContent = '💡 ヒント（方針）を見る';
            document.getElementById('nextBtn').style.display = 'none';

            const optionsContainer = document.getElementById('options');
            const inputSection = document.getElementById('inputSection');
            if (currentMode === 'input') {
                optionsContainer.style.display = 'none';
                inputSection.style.display = 'block';
                const answerInput = document.getElementById('answerInput');
                answerInput.value = '';
                answerInput.disabled = false;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('showAnswerBtn').disabled = false;
                const fb = document.getElementById('inputFeedback');
                fb.innerHTML = '';
                fb.className = 'input-feedback';
                document.getElementById('answerLabel').textContent = question.at !== undefined ? `f'(${question.at < 0 ? MINUS + (-question.at) : question.at}) =` : "f'(x) =";
                answerInput.focus();
            } else {
                optionsContainer.style.display = 'grid';
                inputSection.style.display = 'none';
                optionsContainer.innerHTML = '';
                order = shuffleArray(question.options.map((_, i) => i));
                order.forEach((o, index) => {
                    const optionDiv = document.createElement('button');
                    optionDiv.className = 'option';
                    optionDiv.innerHTML = pretty(question.options[o]);
                    optionDiv.onclick = () => selectAnswer(index, optionDiv);
                    optionsContainer.appendChild(optionDiv);
                });
            }
        }

        // 【ブラッシュアップ】ヒントは 方針 → 途中式 → 答え の順。まちがえるたびに 1 段すすむ
        function renderHints() {
            const I = info(currentQuestions[currentQuestionIndex]);
            let html = '';
            if (stage >= 1) html += `<div class="hint-box"><span class="hint-tag">💡 方針</span>${I.plan}</div>`;
            if (stage >= 2) html += `<div class="hint-box"><span class="hint-tag">✏️ 途中式</span>${I.mid}</div>`;
            document.getElementById('hintArea').innerHTML = html;
            document.getElementById('hintBtn').textContent = stage === 0 ? '💡 ヒント（方針）を見る' : stage === 1 ? '✏️ 途中式を見る' : '👀 答えを見る';
        }
        function showNextHint() {
            if (done) return;
            stage++;
            if (stage >= 3) { finishQuestion(false); return; }
            renderHints();
        }

        // 正解したとき・答えを見たとき：答えと解説を出して、次へ
        function finishQuestion(correct) {
            done = true;
            const question = currentQuestions[currentQuestionIndex];
            const I = info(question);
            if (correct && stage === 0) score++;
            document.querySelectorAll('#options .option').forEach((b, i) => {
                b.disabled = true;
                if (order[i] === question.correct) b.classList.add('correct');
            });
            if (currentMode === 'input') {
                document.getElementById('answerInput').disabled = true;
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('showAnswerBtn').disabled = true;
                const fb = document.getElementById('inputFeedback');
                fb.innerHTML = correct ? '⭕ 正解です！' : '👀 答えを見ました';
                fb.className = 'input-feedback ' + (correct ? 'correct' : 'shown');
            }
            document.getElementById('hintArea').innerHTML = '';
            document.getElementById('hintRow').style.display = 'none';
            const label = question.custom ? 'a = ' : question.at !== undefined ? `f'(${numTxt([question.at, 1])}) = ` : "f'(x) = ";
            const tail = question.custom ? ` より a = ${I.ans}` : (I.mid.endsWith(I.ans) ? '' : ` = ${I.ans}`);
            document.getElementById('explainArea').innerHTML =
                `<div class="explain-box ${correct ? 'ok' : ''}"><div class="explain-title">${correct ? '⭕ 正解！' : '👀 答え'}　${label}${pretty(I.ans)}</div>${I.mid}${tail}</div>`;
            document.getElementById('nextBtn').style.display = 'block';
        }

        function selectAnswer(answerIndex, optionElement) {
            if (done) return;
            const question = currentQuestions[currentQuestionIndex];
            if (order[answerIndex] === question.correct) {
                optionElement.classList.add('correct');
                finishQuestion(true);
                return;
            }
            optionElement.classList.add('incorrect');
            optionElement.disabled = true;

            // 超鬼連チャンモードでは、正しい答えを見せてから終了
            if (currentMode === 'hell') {
                hellFailed = true;
                done = true;
                document.querySelectorAll('#options .option').forEach((b, i) => { b.disabled = true; if (order[i] === question.correct) b.classList.add('correct'); });
                const myRun = runId;
                setTimeout(() => { if (myRun === runId) endQuiz(); }, 2000);
                return;
            }
            stage++;
            if (stage >= 3) { finishQuestion(false); return; }
            renderHints();
        }

        function nextQuestion() {
            if (!done) return;
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuestions.length) endQuiz();
            else { showQuestion(); window.scrollTo(0, 0); }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            const totalTime = Date.now() - startTime;
            const minutes = Math.floor(totalTime / 60000);
            const seconds = Math.floor((totalTime % 60000) / 1000);

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            const answered = hellFailed ? currentQuestionIndex + 1 : currentQuestionIndex;
            document.getElementById('finalScore').textContent = `${score}/${answered}問 一発正解`;
            document.getElementById('finalTime').textContent = `所要時間: ${minutes}分${seconds}秒`;

            let message = '';
            const percentage = answered ? (score / answered) * 100 : 0;
            if (hellFailed) message = `😈 超鬼連チャンモード終了！<br>${answered}問目で力尽きました...<br>再挑戦して完全制覇を目指そう！`;
            else if (percentage === 100) message = '🏆 完璧です！微分マスターですね！';
            else if (percentage >= 80) message = '🌟 素晴らしい成績です！';
            else if (percentage >= 60) message = '👍 良い調子です！もう少し練習すれば完璧！';
            else message = '📚 「微分の練習 基礎」で、レベルごとに復習してみよう！';
            document.getElementById('encouragementText').innerHTML = message;
            window.scrollTo(0, 0);
        }

        // 【ブラッシュアップ】入力した式を { 次数: 係数 } に分ける（整数の係数だけ）。読めないときは null
        //   先頭の「f'(x) =」「y' =」「f'(2) =」はあってもなくてもよい
        function parsePoly(s) {
            let t = String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, '').toLowerCase()
                .replace(/[’′‘]/g, "'").replace(/＝/g, '=').replace(/（/g, '(').replace(/）/g, ')')
                .replace(/\*\*/g, '^').replace(/[ー－−―]/g, '-').replace(/＋/g, '+').replace(/＾/g, '^').replace(/ｘ/g, 'x')
                .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => '^' + [...m].map(c => SUPS.indexOf(c)).join(''))
                .replace(/\*/g, '');
            t = t.replace(/^(f'\([^)]*\)|y')=/, '');
            if (!t || /[^0-9x^+\-]/.test(t)) return null;
            const re = /([+-]?)(\d*)(x(?:\^(\d+))?)?/y;
            const poly = {};
            let pos = 0;
            while (pos < t.length) {
                re.lastIndex = pos;
                const m = re.exec(t);
                if (!m || (!m[2] && !m[3]) || (pos > 0 && !m[1])) return null;
                const deg = m[3] ? (m[4] ? parseInt(m[4], 10) : 1) : 0;
                poly[deg] = (poly[deg] || 0) + (m[1] === '-' ? -1 : 1) * (m[2] ? parseInt(m[2], 10) : 1);
                pos += m[0].length;
            }
            return poly;
        }
        function samePoly(a, b) {
            const p = parsePoly(a), q = parsePoly(b);
            if (!p || !q) return false;
            const keys = new Set([...Object.keys(p), ...Object.keys(q)]);
            for (const k of keys) if ((p[k] || 0) !== (q[k] || 0)) return false;
            return true;
        }

        function submitAnswer() {
            if (done) return;
            const answerInput = document.getElementById('answerInput');
            const fb = document.getElementById('inputFeedback');
            const userAnswer = answerInput.value.trim();
            if (!userAnswer) {
                fb.textContent = '答えを入力してください';
                fb.className = 'input-feedback incorrect';
                return;
            }
            const question = currentQuestions[currentQuestionIndex];
            if (samePoly(userAnswer, question.options[question.correct])) { finishQuestion(true); return; }
            // 【ブラッシュアップ】式として読めないときは書き方を、読めたときは 方針 → 途中式 → 答え の順にヒントを出す。
            //   元はヒントが 1.5 秒で消え、スマホでは画面の外に出ていた。次に答えるまで、入力欄のすぐ下に残す
            if (!parsePoly(userAnswer)) {
                fb.innerHTML = '式として読み取れませんでした。<div class="rule-hint">例：3x^2 - 4x + 1　（x² は x^2 と入力）</div>';
                fb.className = 'input-feedback incorrect';
                return;
            }
            stage++;
            if (stage >= 3) { finishQuestion(false); return; }
            fb.innerHTML = `❌ ちがうよ。下の${stage === 1 ? '方針' : '途中式'}を見て、もう一度入力しよう。`;
            fb.className = 'input-feedback incorrect';
            renderHints();
            answerInput.focus();
        }

        function showAnswer() {
            if (done) return;
            stage = 3;
            finishQuestion(false);
            const question = currentQuestions[currentQuestionIndex];
            document.getElementById('answerInput').value = question.options[question.correct].replace(/<[^>]*>/g, '');
        }

        // Enterキーで回答送信・次の問題へ
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && currentMode === 'input') {
                    const answerInput = document.getElementById('answerInput');
                    const submitBtn = document.getElementById('submitBtn');
                    const nextBtn = document.getElementById('nextBtn');

                    if (document.activeElement === answerInput && !submitBtn.disabled) {
                        // 回答入力中の場合
                        submitAnswer();
                    } else if (nextBtn.style.display === 'block') {
                        // 次の問題ボタンが表示されている場合
                        nextQuestion();
                    }
                }
            });

            // 入力フィールドのリアルタイム全角→半角変換
            document.addEventListener('input', function(e) {
                if (e.target.id === 'answerInput') {
                    const input = e.target;
                    const cursorPosition = input.selectionStart;
                    const originalValue = input.value;

                    // 全角文字を半角に変換
                    let convertedValue = originalValue
                        // 全角数字を半角に変換
                        .replace(/０/g, '0').replace(/１/g, '1').replace(/２/g, '2')
                        .replace(/３/g, '3').replace(/４/g, '4').replace(/５/g, '5')
                        .replace(/６/g, '6').replace(/７/g, '7').replace(/８/g, '8')
                        .replace(/９/g, '9')
                        // 全角英字を半角に変換
                        .replace(/ａ/g, 'a').replace(/ｂ/g, 'b').replace(/ｃ/g, 'c')
                        .replace(/ｄ/g, 'd').replace(/ｅ/g, 'e').replace(/ｆ/g, 'f')
                        .replace(/ｇ/g, 'g').replace(/ｈ/g, 'h').replace(/ｉ/g, 'i')
                        .replace(/ｊ/g, 'j').replace(/ｋ/g, 'k').replace(/ｌ/g, 'l')
                        .replace(/ｍ/g, 'm').replace(/ｎ/g, 'n').replace(/ｏ/g, 'o')
                        .replace(/ｐ/g, 'p').replace(/ｑ/g, 'q').replace(/ｒ/g, 'r')
                        .replace(/ｓ/g, 's').replace(/ｔ/g, 't').replace(/ｕ/g, 'u')
                        .replace(/ｖ/g, 'v').replace(/ｗ/g, 'w').replace(/ｘ/g, 'x')
                        .replace(/ｙ/g, 'y').replace(/ｚ/g, 'z')
                        // 全角記号を半角に変換
                        .replace(/＋/g, '+').replace(/－/g, '-').replace(/ー/g, '-')
                        .replace(/＊/g, '*').replace(/／/g, '/').replace(/＾/g, '^')
                        .replace(/（/g, '(').replace(/）/g, ')').replace(/　/g, ' ');

                    if (convertedValue !== originalValue) {
                        input.value = convertedValue;
                        // カーソル位置を維持
                        input.setSelectionRange(cursorPosition, cursorPosition);
                    }
                }
            });
        });

        function restartSameMode() {
            startQuiz(currentMode);
        }

        // 初期表示
        document.querySelectorAll('.pool-count').forEach(e => e.textContent = problemPool.length);   // 【ブラッシュアップ】
        showModeSelection();
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".header h1": "u-title",
    ".mode-btn": "u-choice",
    ".back-to-menu-btn": "u-btn u-btn-plain",
    ".option": "u-choice",
    ".option.correct": "u-ok",
    ".option.incorrect": "u-ng",
    ".next-btn": "u-btn u-btn-blue",
    "#answerInput": "u-input",
    "#submitBtn": "u-btn",
    "#showAnswerBtn": "u-btn u-btn-plain",
    ".result-nav .again": "u-btn",
    ".result-nav .plain": "u-btn u-btn-plain"
  });
</script>
</body>
