<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>微分の練習 応用</title>
    <link
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 10px;
        background: #f5f7fa;
        color: #1f2328;
        font:
          17px/1.7 "BIZ UDPGothic",
          sans-serif;
      }
      .port-back {
        display: block;
        max-width: 1120px;
        margin: 0 auto 8px;
        color: #5b6470;
        font-size: 14px;
        text-decoration: none;
      }
      .wrap {
        max-width: 760px;
        margin: auto;
        background: white;
        border: 1px solid #d0d7de;
        border-top: 4px solid #1f4e8c;
        border-radius: 8px;
        padding: 14px;
      }
      .head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .head small {
        font-size: 12px;
        color: #5b6470;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      h2 {
        font-size: 19px;
      }
      h3 {
        font-size: 17px;
      }
      #menu > p {
        font-size: 14px;
      }
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .menu-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        text-align: left;
        min-height: 135px;
        padding: 12px !important;
      }
      .menu-card svg {
        width: 70px;
        height: 42px;
      }
      .menu-card small {
        font-size: 12px;
        color: #5b6470;
        line-height: 1.7;
      }
      .menu-card b {
        word-break: keep-all;
        font-size: 16px;
      }
      .toolbar button {
        font-size: 12px;
        padding: 6px 8px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 6px 0 12px;
        font-size: 13px;
        color: #5b6470;
      }
      button {
        font:
          15px "BIZ UDPGothic",
          sans-serif;
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid #c5d3e4;
        border-bottom: 3px solid #b6bfc9;
        border-radius: 6px;
        background: white;
        color: #1f4e8c;
        cursor: pointer;
        transition: transform 0.08s;
      }
      button:not(:disabled):active {
        transform: translateY(2px);
        border-bottom-width: 1px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      .primary {
        background: #1f4e8c;
        color: white;
        border-color: #1f4e8c;
        border-bottom-color: #163a69;
      }
      .question-no {
        background: #1f4e8c;
        color: white;
        padding: 2px 8px;
      }
      .problem {
        font-size: 23px;
        margin: 16px 0 8px;
      }
      .ask {
        font-size: 17px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0;
      }
      .choice {
        position: relative;
        min-height: 76px;
        font-size: 22px;
        padding: 22px 8px 12px;
        color: #1f2328;
      }
      .choice::before {
        content: attr(data-label);
        position: absolute;
        top: 4px;
        left: 8px;
        font: 12px "BIZ UDPGothic";
        color: #5b6470;
      }
      .choice.correct {
        background: #ebfbee;
        border-color: #2b8a3e;
      }
      .choice.incorrect {
        background: #fff5f5;
        border-color: #c92a2a;
      }
      .feedback,
      .hint-box,
      .explain-box {
        padding: 12px;
        border-left: 4px solid #1f4e8c;
        background: #f1f6fc;
        margin-top: 12px;
        font-size: 16px;
      }
      .feedback.correct,
      .explain-box.ok {
        background: #ebfbee;
        border-color: #2b8a3e;
      }
      .feedback.incorrect {
        background: #fff5f5;
        border-color: #c92a2a;
      }
      .hint-tag {
        display: block;
        font-size: 13px;
        color: #1f4e8c;
        margin-bottom: 4px;
      }
      .formula {
        background: #f5f0ff;
        border-left: 3px solid #9366d5;
        padding: 8px;
        margin: 8px 0;
      }
      .formula b {
        font: 12px "BIZ UDPGothic";
        color: #6e40c9;
        margin-right: 10px;
      }
      .controls,
      .result-nav {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .result-nav a {
        font-size: 14px;
        color: #1f4e8c;
        padding: 10px;
      }
      .result-score {
        font-size: 24px;
        color: #1f4e8c;
      }
      .m {
        font-family: "STIX Two Text", serif;
        font-weight: 400;
        white-space: nowrap;
      }
      .m i {
        font-style: italic;
      }
      sup {
        font-size: 0.72em;
        line-height: 0;
        vertical-align: 0.55em;
      }
      .fraction {
        display: inline-flex;
        flex-direction: column;
        vertical-align: middle;
        text-align: center;
        line-height: 1.15;
        margin: 0 0.1em;
        font-family: "STIX Two Text";
        font-weight: 400;
      }
      .numerator {
        border-bottom: 1px solid;
        padding: 0 0.15em 0.1em;
      }
      .denominator {
        padding: 0.12em 0.15em 0;
      }
      .equation {
        font-size: 19px;
        margin: 8px 0;
        line-height: 1.9;
      }
      .eqpart {
        display: inline-block;
        white-space: nowrap;
      }
      .explain-title {
        margin-bottom: 8px;
        font-size: 17px;
      }
      .input-section {
        margin: 16px 0;
      }
      input {
        font: 21px "STIX Two Text";
        width: 100%;
        min-height: 48px;
        border: 1px solid #9db6d6;
        border-radius: 6px;
        padding: 8px;
      }
      .input-tools {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .input-tools button {
        min-width: 42px;
        padding: 6px;
      }
      .input-feedback {
        font-size: 15px;
        margin-top: 8px;
        color: #a61e1e;
      }
      .input-help {
        font-size: 14px;
        margin-top: 12px;
      }
      .review-item {
        border-top: 1px solid #d0d7de;
        padding: 14px 0;
      }
      .review-item svg {
        display: block;
        width: 300px;
        max-width: 100%;
        margin: 12px auto;
      }
      .review-item summary {
        cursor: pointer;
        color: #1f4e8c;
      }
      .formula .m {
        font-size: 18px;
      }
      [hidden] {
        display: none !important;
      }
      .progress-track {
        height: 3px;
        background: #e6edf5;
        margin: 10px 0;
      }
      .progress-track span {
        display: block;
        height: 3px;
        background: #1f4e8c;
      }
      .level-label {
        font-size: 14px;
        color: #8056a1;
      }
      .keyboard-note {
        font-size: 12px;
        color: #5b6470;
      }
      .math-fit {
        max-width: 100%;
      }
      @media (min-width: 900px) and (orientation: landscape) {
        .wrap {
          max-width: 1120px;
          padding: 20px;
        }
        .quiz-grid {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 370px;
          gap: 24px;
          align-items: start;
        }
        .answer-panel {
          position: sticky;
          top: 12px;
        }
        .choices {
          margin-top: 0;
        }
        .menu-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .menu-grid.modes {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .equal {
        display: inline-block;
        margin: 0 0.28em;
      }
      .menu-math {
        display: flex;
        align-items: center;
        height: 52px;
        font-size: 18px;
      }
      .menu-card svg {
        width: 80px;
        height: 52px;
      }

      .pr {
        display: inline-block;
        margin-left: 0.12em;
      }
      .wrap {
        max-width: 760px;
      }
      .question-box {
        border: 1px solid #aebed2;
        border-left: 4px solid #1f4e8c;
        background: #f8faff;
        border-radius: 6px;
        padding: 14px 12px;
        text-align: center;
      }
      .question-box .problem {
        font-size: 26px;
        margin: 4px 0 12px;
      }
      .question-box .ask-line {
        font-size: 17px;
        line-height: 1.8;
      }
      .question-box .m {
        white-space: nowrap;
      }
      .input-tools button {
        font-family: "STIX Two Text", serif;
      }
      .input-preview {
        min-height: 42px;
        font-size: 23px;
        padding: 6px;
        border-bottom: 1px solid #d0d7de;
        overflow-wrap: anywhere;
      }
      .time-value {
        font: 26px "BIZ UDPGothic";
        font-variant-numeric: tabular-nums;
        color: #1f4e8c;
      }
      .toolbar {
        align-items: center;
      }
      .result-time {
        font-size: 26px;
      }
      .answer-panel.flash-correct {
        background: #ebfbee;
      }
      .answer-panel.flash-wrong {
        background: #fff5f5;
      }
      .answer-panel {
        border-radius: 6px;
      }
      .input-section {
        margin-top: 8px;
      }
      .input-help {
        font-size: 12px;
      }
      .input-tools {
        margin: 6px 0;
      }
      .input-tools button {
        min-height: 40px;
      }
      .review-item .question-box {
        margin: 10px 0;
      }
      .review-item summary {
        line-height: 1.8;
      }
      #reviewList[hidden] {
        display: none !important;
      }
      @media (min-width: 900px) and (orientation: landscape) {
        .wrap {
          max-width: 980px;
        }
        .quiz-grid {
          grid-template-columns: minmax(0, 1fr) 340px;
          gap: 26px;
        }
        .question-box .problem {
          font-size: 32px;
        }
        .question-box {
          padding: 18px 14px;
        }
      }
      @media (max-width: 899px) {
        .input-running .question-box {
          padding: 8px;
        }
        .input-running .question-box .problem {
          margin: 0 0 4px;
        }
        .input-running .toolbar {
          margin: 3px 0 6px;
        }
        .input-running .head {
          margin-bottom: 6px;
        }
        .input-running .input-section {
          margin-top: 8px;
        }
        .input-running .input-help {
          margin-top: 4px;
        }
      }

      .fn-gap {
        display: inline-block;
        width: 0.07em;
      }
      #questionTabs {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 12px 0;
      }
      #questionTabs button {
        min-width: 34px;
        min-height: 34px;
        padding: 4px 8px;
        border: 1px solid #b7c8dc;
        border-radius: 7px;
        background: #f4f7fb;
        color: #263a54;
      }
      #questionTabs button[aria-current="step"] {
        outline: 2px solid #e67e22;
        outline-offset: 1px;
      }
      #questionTabs .answered {
        background: #d9eee3;
      }
      #questionTabs .needs-review {
        background: #ffe2dc;
      }
      #questionTabs button:disabled {
        opacity: 0.4;
      }
      .mi {
        font-family: "STIX Two Text", serif;
        font-style: italic;
        font-weight: 400;
      }
      .mi-sup {
        font-family: "STIX Two Text", serif;
        font-weight: 400;
        font-size: 0.65em;
      }
      .input-icon .caret {
        margin-left: 4px;
        font-weight: 300;
      }
      /* PC：メニューが1画面に入る大きさに */
      @media (min-width: 700px) {
        .menu-grid.modes {
          max-width: 560px !important;
        }
        #menuGrid:not(.modes) {
          grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
          max-width: 780px !important;
        }
        #menuGrid:not(.modes) .menu-card {
          grid-column: span 2 !important;
          width: 100% !important;
        }
        #menuGrid:not(.modes) .menu-card:nth-child(4) {
          grid-column: 2 / span 2 !important;
        }
      }
      #menuGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 760px;
        margin: auto;
        gap: 16px;
      }
      .menu-card {
        min-width: 0;
        width: 100%;
        aspect-ratio: 4/3;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 12px;
        gap: 10px;
        background: #eaf2fd;
      }
      .menu-card:nth-child(2) {
        background: #eaf6ee;
      }
      .menu-card:nth-child(3) {
        background: #fff1df;
      }
      .menu-card:nth-child(4) {
        background: #f1eafa;
      }
      .menu-card:nth-child(5) {
        grid-column: 1/-1;
        width: calc(50% - 8px);
        justify-self: center;
        background: #edf4f8;
      }
      .menu-card b {
        font-size: clamp(16px, 2vw, 22px);
      }
      .menu-card small {
        font-size: 12px;
      }
      .lesson-icon {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(18px, 3vw, 28px);
        color: #254f82;
        line-height: 1.1;
      }
      .lesson-icon em {
        color: #c65a2b;
        font-style: normal;
      }
      .input-icon {
        border: 2px solid;
        padding: 4px 12px;
        border-radius: 5px;
      }
      .clock-icon {
        border: 3px solid;
        border-radius: 50%;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .clock-icon:before {
        content: "";
        position: absolute;
        top: -8px;
        width: 14px;
        border-top: 4px solid;
      }
      @media (max-width: 480px) {
        #menuGrid {
          gap: 10px;
        }
        .menu-card {
          padding: 10px 7px !important;
          gap: 6px;
        }
        .menu-card:nth-child(5) {
          width: calc(50% - 5px);
        }
        .menu-card b {
          font-size: 16px;
        }
        .lesson-icon {
          font-size: 17px;
          height: 54px;
        }
      }
    </style>
  </head>
  <body>
    <a class="port-back" href="../index.html">← 教材の一覧へ</a>
    <main class="wrap">
      <header class="head">
        <small>数学Ⅱ　微分・積分</small>
        <h1>微分の練習 応用</h1>
      </header>
      <section id="menu">
        <p>モードを選んで始めよう。</p>
        <div id="menuGrid" class="menu-grid modes"></div>
      </section>
      <section id="quiz" hidden>
        <div class="toolbar">
          <span class="question-no" id="status"></span
          ><span id="timer" class="time-value" aria-label="経過時間"></span
          ><button onclick="menu()">選び直す</button
          ><button onclick="start(ADVANCED ? mode : lev)">
            もう一度やり直す
          </button>
        </div>
        <div class="progress-track"><span id="bar"></span></div>
        <div class="quiz-grid">
          <div>
            <div id="question" class="ask"></div>
            <div id="hints"></div>
            <div id="feedback" aria-live="polite" hidden></div>
          </div>
          <div class="answer-panel">
            <div id="choices" class="choices"></div>
            <div id="inputSection" class="input-section" hidden>
              <label for="answerInput">答えの式</label
              ><input
                id="answerInput"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
              <div
                id="inputPreview"
                class="input-preview"
                aria-label="入力した式の表示"
                aria-live="polite"
              ></div>
              <div class="input-tools">
                <button onclick="insertText('x')">
                  <span class="m"><i>x</i></span></button
                ><button onclick="insertText('²')">²</button
                ><button onclick="insertText('³')">³</button
                ><button onclick="insertText('−')">−</button
                ><button onclick="insertText('+')">+</button>
              </div>
              <button id="submit" class="primary" onclick="submit()">
                答え合わせ
              </button>
              <div
                id="inputFeedback"
                class="input-feedback"
                aria-live="polite"
              ></div>
              <details class="input-help">
                <summary>入力のしかた</summary>
                2x² は 2x^2 でも入力できます。空白は入っていてもかまいません。
              </details>
            </div>
            <div id="help" class="controls">
              <button onclick="hints()">ヒント</button
              ><button onclick="reveal()">答えを見る</button>
            </div>
            <button id="next" class="primary" onclick="advance()" hidden>
              次の問題へ
            </button>
          </div>
        </div>
      </section>
      <section id="result" hidden></section>
    </main>
    <script>
      const ADVANCED = true;
      const problemPool = [
        // 単項式（基本）
        { q: "f(x) = x", options: ["1", "x", "0", "2x"], correct: 0 },
        { q: "f(x) = 2x", options: ["2", "x", "2x", "0"], correct: 0 },
        { q: "f(x) = 3x", options: ["3", "3x", "1", "0"], correct: 0 },
        { q: "f(x) = 5x", options: ["5", "x", "5x", "1"], correct: 0 },
        { q: "f(x) = x²", options: ["2x", "x", "x²", "2"], correct: 0 },
        { q: "f(x) = x³", options: ["3x²", "x²", "3x", "x³"], correct: 0 },
        { q: "f(x) = x⁴", options: ["4x³", "x³", "4x", "x⁴"], correct: 0 },
        { q: "f(x) = x⁵", options: ["5x⁴", "x⁴", "5x", "x⁵"], correct: 0 },
        { q: "f(x) = 2x²", options: ["4x", "2x", "x²", "2"], correct: 0 },
        { q: "f(x) = 3x²", options: ["6x", "3x", "x²", "3"], correct: 0 },

        // 単項式（係数あり）
        { q: "f(x) = 4x³", options: ["12x²", "4x²", "3x²", "12x"], correct: 0 },
        { q: "f(x) = 6x²", options: ["12x", "6x", "2x", "12"], correct: 0 },
        { q: "f(x) = -x", options: ["-1", "1", "-x", "x"], correct: 0 },
        { q: "f(x) = -2x", options: ["-2", "2", "-2x", "2x"], correct: 0 },
        { q: "f(x) = -x²", options: ["-2x", "2x", "-x", "x"], correct: 0 },
        { q: "f(x) = -3x²", options: ["-6x", "6x", "-3x", "3x"], correct: 0 },
        { q: "f(x) = 7x", options: ["7", "1", "7x", "x"], correct: 0 },
        { q: "f(x) = 8x³", options: ["24x²", "8x²", "3x²", "24x"], correct: 0 },
        { q: "f(x) = 9x⁴", options: ["36x³", "9x³", "4x³", "36x"], correct: 0 },
        { q: "f(x) = 10x", options: ["10", "1", "10x", "x"], correct: 0 },

        // 分数係数
        {
          q: "f(x) = <span class='fraction'><span class='numerator'>1</span><span class='denominator'>2</span></span>x",
          options: [
            "<span class='fraction'><span class='numerator'>1</span><span class='denominator'>2</span></span>",
            "1",
            "x",
            "2",
          ],
          correct: 0,
        },
        {
          q: "f(x) = <span class='fraction'><span class='numerator'>1</span><span class='denominator'>3</span></span>x²",
          options: [
            "<span class='fraction'><span class='numerator'>2</span><span class='denominator'>3</span></span>x",
            "<span class='fraction'><span class='numerator'>1</span><span class='denominator'>3</span></span>x",
            "2x",
            "x",
          ],
          correct: 0,
        },

        {
          q: "f(x) = <span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span>x²",
          options: [
            "<span class='fraction'><span class='numerator'>3</span><span class='denominator'>2</span></span>x",
            "<span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span>x",
            "2x",
            "<span class='fraction'><span class='numerator'>3</span><span class='denominator'>8</span></span>x",
          ],
          correct: 0,
        },
        {
          q: "f(x) = <span class='fraction'><span class='numerator'>1</span><span class='denominator'>4</span></span>x³",
          options: [
            "<span class='fraction'><span class='numerator'>3</span><span class='denominator'>4</span></span>x²",
            "<span class='fraction'><span class='numerator'>1</span><span class='denominator'>4</span></span>x²",
            "3x²",
            "x²",
          ],
          correct: 0,
        },

        // 多項式（2項）
        {
          q: "f(x) = x² + x",
          options: ["2x + 1", "x + 1", "2x", "x²"],
          correct: 0,
        },
        {
          q: "f(x) = x² - x",
          options: ["2x - 1", "x - 1", "2x", "x²"],
          correct: 0,
        },

          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function parsePoly(s) {
        let t = String(s)
          .replace(/<[^>]*>/g, "")
          .replace(/\s+/g, "")
          .toLowerCase()
          .replace(/[’′‘]/g, "'")
          .replace(/＝/g, "=")
          .replace(/（/g, "(")
          .replace(/）/g, ")")
          .replace(/\*\*/g, "^")
          .replace(/[ー－−―]/g, "-")
          .replace(/＋/g, "+")
          .replace(/＾/g, "^")
          .replace(/ｘ/g, "x")
          .replace(/[０-９]/g, (c) =>
            String.fromCharCode(c.charCodeAt(0) - 0xfee0),
          )
          .replace(
            /[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,
            (m) => "^" + [...m].map((c) => SUPS.indexOf(c)).join(""),
          )
          .replace(/\*/g, "");
        t = t.replace(/^(f'\([^)]*\)|y')=/, "");
        if (!t || /[^0-9x^+\-]/.test(t)) return null;
        const re = /([+-]?)(\d*)(x(?:\^(\d+))?)?/y;
        const poly = {};
        let pos = 0;
        while (pos < t.length) {
          re.lastIndex = pos;
          const m = re.exec(t);
          if (!m || (!m[2] && !m[3]) || (pos > 0 && !m[1])) return null;
          const deg = m[3] ? (m[4] ? parseInt(m[4], 10) : 1) : 0;
          poly[deg] =
            (poly[deg] || 0) +
            (m[1] === "-" ? -1 : 1) * (m[2] ? parseInt(m[2], 10) : 1);
          pos += m[0].length;
        }
        return poly;
      }
      function samePoly(a, b) {
        const p = parsePoly(a),
          q = parsePoly(b);
        if (!p || !q) return false;
        const keys = new Set([...Object.keys(p), ...Object.keys(q)]);
        for (const k of keys) if ((p[k] || 0) !== (q[k] || 0)) return false;
        return true;
      }

      let currentMode = "normal";
      // 数式のHTMLは、文字だけ斜体・数字は立体。式の行と日本語の説明を分ける。
      function mathHTML(html) {
        return String(html)
          .split(/(<[^>]+>)/g)
          .map((part, i) =>
            i % 2
              ? part
              : part.replace(
                  /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()+−=×÷·.,^\- ]+/g,
                  (run) => {
                    if (!/[A-Za-z0-9ⁿ]/.test(run)) return run;
                    let text = run
                      .replace(/'/g, "′")
                      .replace(/-/g, "−")
                      .replace(/\^(\d+)/g, (_, n) => "<sup>" + n + "</sup>");
                    text = text.replace(
                      /[ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,
                      (x) =>
                        "<sup>" +
                        [...x]
                          .map((c) =>
                            c === "ⁿ"
                              ? "n"
                              : c === "⁻"
                                ? "−"
                                : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c),
                          )
                          .join("") +
                        "</sup>",
                    );
                    text = text
                      .split(/(<[^>]+>)/g)
                      .map((x, j) =>
                        j % 2
                          ? x
                          : x.replace(/[A-Za-z]+/g, (letters) =>
                              ["sin", "cos", "tan", "log"].includes(letters)
                                ? letters
                                : "<i>" + letters + "</i>",
                            ),
                      )
                      .join("");
                    text = text.replace(
                      /(<i>[fyF]<\/i>)′/g,
                      '$1<span class="pr">′</span>',
                    );
                    text = text.replace(
                      /(<i>f<\/i>|<span class="pr">′<\/span>)(?=\()/g,
                      '$1<span class="fn-gap"></span>',
                    );
                    return '<span class="m">' + text + "</span>";
                  },
                ),
          )
          .join("");
      }

          '<rect x="7" y="12" width="67" height="30"/><path d="M58 17V36"/><text x="14" y="32">2x²</text>',
          '<circle cx="39" cy="29" r="18"/><path d="M39 11V5M32 5H46M39 29V17M39 29L49 34"/>',

      function lessonMath(html) {

      window.addEventListener("resize", fitMath);

      function graph(q) {
        let f = q.f || readPoly(q.q);
        if (q.custom)
          f = q.q.includes("ax²")
            ? [
                [2, 2],
                [3, 1],
              ]
            : [
                [1, 2],
                [3, 1],
              ];
        const a = q.at ?? (q.custom ? (q.q.includes("ax²") ? 2 : 1) : 0);
        const val = (x) =>
          f.reduce(
            (s, [c, n]) => s + (Array.isArray(c) ? c[0] / c[1] : c) * x ** n,
            0,
          );
        const slope = f.reduce(
          (s, [c, n]) =>
            s +
            (n ? (Array.isArray(c) ? c[0] / c[1] : c) * n * a ** (n - 1) : 0),
          0,
        );
        const xs = Array.from({ length: 101 }, (_, i) => a - 2 + i / 25),
          ys = xs.map(val),
          ts = xs.map((x) => val(a) + slope * (x - a));
        const lo = Math.min(0, ...ys, ...ts) - 1,
          hi = Math.max(0, ...ys, ...ts) + 1;
        const X = (x) => 25 + (x - a + 2) * 62.5,
          Y = (y) => 170 - ((y - lo) / (hi - lo)) * 150;
        const path = (v) =>
          v
            .map(
              (y, i) =>
                (i ? "L" : "M") + X(xs[i]).toFixed(2) + " " + Y(y).toFixed(2),
            )
            .join(" ");
        return (
          '<svg viewBox="0 0 300 200" role="img" aria-label="関数と接線のグラフ"><path d="M25 ' +
          Y(0) +
          "H275" +
          (a - 2 <= 0 && a + 2 >= 0 ? "M" + X(0) + " 20V170" : "") +
          '" stroke="#aaa" fill="none"/><path d="' +
          path(ys) +
          '" stroke="#1f4e8c" stroke-width="2" fill="none"/><path d="' +
          path(ts) +
          '" stroke="#d9480f" stroke-width="2" fill="none"/><circle cx="' +
          X(a) +
          '" cy="' +
          Y(val(a)) +
          '" r="3" fill="#d9480f"/><text x="25" y="190" font-size="12" font-family="STIX Two Text,serif">' +
          String(a - 2).replace(/-/g, "−") +
          '</text><text x="265" y="190" font-size="12" font-family="STIX Two Text,serif">' +
          String(a + 2).replace(/-/g, "−") +
          "</text></svg><small>紺：関数のグラフ　橙：" +
          mathHTML("x = " + a) +
          " の接線（接点 " +
          mathHTML("(" + a + ", " + numTxt(valueAt(f, a)) + ")") +
          "）</small>"
        );
      }
      function insertText(s) {
        const e = $("answerInput");
        e.setRangeText(s, e.selectionStart, e.selectionEnd, "end");
        previewInput();
        e.focus();
      }
      $("answerInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing && !composing) {
          e.preventDefault();
          if (!done) submit();
        }
      });
      $("answerInput").addEventListener("input", previewInput);
      $("answerInput").addEventListener(
        "compositionstart",
        () => (composing = true),
      );
      $("answerInput").addEventListener("compositionend", () => {
        composing = false;
        previewInput();
      });
      const menuTitles = ADVANCED
        ? [
            "4択で10問",
            "式を入力して10問",
            "全" + problemPool.length + "問タイムアタック",
            "超鬼連チャン",
          ]
        : [
            '<i class="mi">x</i><sup class="mi-sup">n</sup> の導関数',
            "定数倍の導関数",
            "係数が分数の関数",
            "多項式の導関数",
            '展開して微分・<wbr>微分係数',
          ];
      const menuSymbols = ADVANCED
        ? [
            "▢ ▣<br>▢ ▢",
            '<span class="input-icon"><i class="mi">x</i><sup class="mi-sup">2</sup><span class="caret">│</span></span>',
            '<span class="clock-icon">' + problemPool.length + '</span>',
            "×",
          ]
        : [
            "x³ → 3x²",
            "5x³ → 15x²",
            "{1|2}x² → x",
            "x³ <em>+</em> 2x² <em>−</em> 3x",
            "f′(a)",
          ];
      $("menuGrid").innerHTML = menuTitles
        .map(
          (title, i) =>
            '<button class="menu-card" onclick="start(' +
            (ADVANCED ? "'" + Object.keys(modeNames)[i] + "'" : i + 1) +
            ')"><span class="lesson-icon" aria-hidden="true">' +
            (ADVANCED
              ? menuSymbols[i]
              : mathHTML(menuSymbols[i].replace("{1|2}", frac("1", "2")))) +
            "</span><b>" +
            title +
            "</b><small>" +
            (ADVANCED
              ? [
                  "選んで解く・時間を計測",
                  "キーボードで答える",
                  "全部の問題に挑戦",
                  "1回まちがえたら終わり",
                ][i]
              : LEVELS[i].problems.length + "問") +
            "</small></button>",
        )
        .join("");
      menu();
    </script>
  </body>
</html>
