<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <!--
    数学Ⅱ 09. 不定積分練習（不定積分練習クイズ）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->
  <link rel="stylesheet" href="../../assets/port.css">
  <script src="../../assets/port.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不定積分練習クイズ</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            color: #333;
        }

        html {
            height: 100%;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #718096;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            border: none;
            font-size: 1rem;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .mode-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        .mode-card p {
            margin: 0;
            opacity: 0.9;
        }

        .quiz-container {
            display: none;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .progress {
            font-weight: bold;
            color: #4a5568;
        }

        .score {
            font-weight: bold;
            color: #38a169;
        }

        .question-card {
            background: #f7fafc;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .question {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: #2d3748;
            text-align: center;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1rem;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .option.wrong {
            border-color: #e53e3e;
            background: #fed7d7;
            color: #c53030;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        .btn-retry {
            background: #ed8936;
            color: white;
        }

        .btn-retry:hover {
            background: #dd6b20;
        }

        .result-message {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
        }

        .result-wrong {
            background: #fed7d7;
            color: #c53030;
        }

        .result-correct {
            background: #c6f6d5;
            color: #2f855a;
        }

        .final-result {
            text-align: center;
            padding: 40px;
            background: #f7fafc;
            border-radius: 15px;
            margin: 30px 0;
        }

        .final-score {
            font-size: 2rem;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 2px;
        }

        .fraction span:first-child {
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
        }

        .fraction span:last-child {
            padding-top: 2px;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e53e3e;
            background: #fed7d7;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }

        .enter-hint {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 10px;
            text-align: center;
        }

        .input-form {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            font-size: 1.2rem;
        }

        .input-field {
            width: 60px;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
        }

        .input-field.coefficient {
            width: 120px;
            font-size: 2rem;
        }

        .input-field.power {
            width: 50px;
        }

        .superscript {
            vertical-align: super;
            font-size: 0.8em;
        }

        .math-symbol {
            font-size: 2.4rem;
            font-weight: bold;
            color: #2d3748;
        }

        .x-symbol {
            font-size: 2.4rem;
            font-weight: bold;
            color: #2d3748;
            font-style: italic;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }

        .input-field.correct {
            border-color: #38a169;
            background: #c6f6d5;
        }

        .input-field.wrong {
            border-color: #e53e3e;
            background: #fed7d7;
        }

        .fraction-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fraction-part {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .fraction-line {
            width: 60px;
            height: 2px;
            background: #333;
        }

        .input-label {
            font-weight: bold;
            color: #4a5568;
        }
    </style>
  <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    body { padding: 12px; }
    .container { padding: 24px 20px; }
    .title { font-size: min(2.3rem, 7vw); white-space: nowrap; margin: 0 0 6px; }
    .subtitle { color: var(--u-sub); font-weight: 700; }
    .mode-selection { gap: 12px; }
    .mode-card { text-align: left; }
    .mode-card h3 { color: var(--u-title); }
    .mode-card p { color: var(--u-sub); font-weight: 700; opacity: 1; }
    .quiz-header { background: var(--u-soft-yellow); border: 3px dashed #fde68a; border-radius: 16px; padding: 12px 14px; gap: 8px; flex-wrap: wrap; }
    .progress { color: var(--u-ink); }
    .score { color: var(--u-accent-text); }
    .timer { background: #fff; color: var(--u-accent-text); padding: 6px 14px; }
    .question-card { background: #f8fafc; border: 3px solid var(--u-line); border-radius: 24px; }
    .question { color: var(--u-ink); font-size: 1.6rem; }
    .q-sub { font-size: 0.75em; color: var(--u-sub); }
    .c-note { margin: 0 0 12px; text-align: center; color: var(--u-sub); font-weight: 700; font-size: 0.95rem; }
    .option { font-size: 1.25rem; font-weight: 700; }
    .option .fraction, .explain .fraction, .rule-hint .fraction { font-size: 0.85em; }
    .result-message { border-radius: 16px; }
    .result-correct { background: var(--u-ok-soft); color: var(--u-ok); border: 3px solid var(--u-ok-line); }
    .result-wrong { background: var(--u-ng-soft); color: var(--u-ng); border: 3px solid var(--u-ng-line); }
    .result-reduce { background: var(--u-soft-yellow); color: var(--u-soft-yellow-text); border: 3px solid #fde047; }
    .result-shown { background: var(--u-soft-blue); color: var(--u-title); border: 3px solid var(--u-soft-blue-line); }
    .rule-hint { margin-top: 6px; font-size: 0.95rem; color: var(--u-title); line-height: 2; }
    .explain { margin: 10px auto 0; padding: 10px 12px; max-width: 520px; background: #fff; border: 2px dashed var(--u-line); border-radius: 12px;
               color: var(--u-ink); font-weight: 700; line-height: 2.2; text-align: left; font-size: 1.05rem; }
    .explain-note { margin-top: 4px; color: var(--u-sub); font-size: 0.9rem; }
    .controls { flex-wrap: wrap; gap: 8px; }
    .x-symbol, .math-symbol { color: var(--u-ink); }
    .input-field { border-color: var(--u-line-dark); border-radius: 10px; color: var(--u-ink); font-size: 16px; }
    .input-field.correct { background: var(--u-ok-soft); border-color: var(--u-ok-line); }
    .input-field.wrong { background: var(--u-ng-soft); border-color: var(--u-ng-line); }
    .input-field.reduce { background: var(--u-soft-yellow); border-color: #fde047; }
    .fraction-line { background: var(--u-ink); }
    /* 【ブラッシュアップ】入力練習モードの新しい形 */
    .term-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 6px; width: 100%; }
    .term { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .frac-in { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
    .frac-in .fraction-line { width: 56px; height: 3px; }
    .input-field.in-num, .input-field.in-den, .input-field.in-c { width: 56px; padding: 6px 2px; }
    .input-field.in-pow { width: 44px; padding: 4px 2px; align-self: flex-start; margin-top: 4px; font-size: 14px; }
    .term .x-symbol { font-size: 2rem; }
    .term .math-symbol { font-size: 1.8rem; }
    .lhs { font-size: 1.5rem !important; margin-right: 4px; }
    .sign-btn { min-width: 42px; min-height: 46px; padding: 0 6px; font-size: 1.5rem; font-weight: 800; background: #fff; color: var(--u-ink);
                border: 3px solid var(--u-line-dark); border-bottom-width: 5px; border-radius: 12px; cursor: pointer; }
    .sign-btn.correct { background: var(--u-ok-soft); border-color: var(--u-ok-line); }
    .sign-btn.wrong { background: var(--u-ng-soft); border-color: var(--u-ng-line); }
    .in-help { width: 100%; margin: 6px 0 0; text-align: center; color: var(--u-sub); font-weight: 700; font-size: 0.88rem; line-height: 1.6; }
    .option.answer-shown { background: var(--u-ok-soft) !important; border-color: var(--u-ok-line) !important; color: var(--u-ok) !important; }
    @media (pointer: coarse) { .enter-hint { display: none !important; } }
    .final-result { background: #fff; border: 4px dashed var(--u-line); border-radius: 24px; }
    .final-score { color: var(--u-title); white-space: nowrap; font-size: min(2rem, 7.5vw); }
    #finalMessage { color: var(--u-ink); font-weight: 700; line-height: 1.8; }
    .result-nav { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 16px auto 0; }
    .result-nav button, .result-nav a.next { padding: 12px; margin: 0; }
    .result-nav a { color: var(--u-sub); font-weight: 700; }
    .result-nav a.next { display: block; color: #fff; text-decoration: none; }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 14px 10px; }
      .question-card { padding: 16px 10px; }
      .question { font-size: 1.35rem; }
      .options { grid-template-columns: 1fr; gap: 8px; }
      .option { padding: 12px 6px; font-size: 1.1rem; }
      .input-form { gap: 4px; }
      .input-field.in-num, .input-field.in-den, .input-field.in-c { width: 46px; }
      .frac-in .fraction-line { width: 46px; }
      .input-field.in-pow { width: 38px; }
      .term .x-symbol { font-size: 1.6rem; }
      .term .math-symbol { font-size: 1.5rem; }
      .sign-btn { min-width: 38px; font-size: 1.3rem; }
      .explain { font-size: 1rem; }
      .controls .btn { padding: 10px 14px; }
    }
  
  </style>
</head>
<body class="u-theme">
    <a class="port-back" href="../remake.html">← 教材の一覧へ</a>
    <div class="container">
        <div class="header">
            <h1 class="title">📚 不定積分練習クイズ</h1>
            <p class="subtitle">3つのモードで不定積分をマスターしよう！</p>
        </div>

        <div id="modeSelection" class="mode-selection">
            <button class="mode-card" onclick="startQuiz('random10')">
                <h3>🎯 ランダム10選モード</h3>
                <p>やさしい問題から順に10問（展開してから積分する問題も）</p>
            </button>
            <button class="mode-card" onclick="startQuiz('random100')">
                <h3>📖 全問ランダムモード</h3>
                <p>全<span class="pool-count">100</span>問をランダム順で（とちゅうで結果を見てもOK）</p>
            </button>
            <button class="mode-card" onclick="startQuiz('challenge')">
                <h3>🔥 鬼連チャンモード</h3>
                <p>間違えたら即終了！何問連続正解できる？</p>
            </button>
            <button class="mode-card" onclick="startQuiz('input')">
                <h3>✏️ 入力練習モード</h3>
                <p>係数・次数・積分定数 C を自分で入力して練習</p>
            </button>
        </div>

        <div id="quizContainer" class="quiz-container">
            <div class="quiz-header">
                <div class="progress" id="progress">問題 1/10</div>
                <div class="timer" id="timer">00:00</div>
                <div class="score" id="score">正解: 0問</div>
            </div>

            <div class="question-card">
                <div class="question" id="question">∫ x dx = ?</div>
                <p class="c-note" id="cNote">（C は積分定数とする）</p>
                <div class="options" id="options"></div>
                <div id="inputContainer" class="input-form hidden"></div>
            </div>

            <div id="resultMessage" class="result-message hidden"></div>
            <div id="enterHint" class="enter-hint hidden">Enterキーで次の問題へ</div>

            <div class="controls">
                <button id="checkBtn" class="btn btn-primary hidden" onclick="checkAnswer()">答えをチェック</button>
                <button id="nextBtn" class="btn btn-secondary hidden" onclick="nextQuestion()">次の問題</button>
                <button id="retryBtn" class="btn btn-retry hidden" onclick="retryQuestion()">もう一度挑戦</button>
                <button id="showAnswerBtn" class="btn btn-secondary" onclick="showAnswer()">答えを見る</button>
                <button id="finishBtn" class="btn btn-secondary hidden" onclick="showFinalResult()">ここで終わって結果を見る</button>
                <button id="backBtn" class="btn btn-secondary" onclick="backToMenu()">メニューに戻る</button>
            </div>
        </div>

        <div id="finalResult" class="final-result hidden">
            <div class="final-score" id="finalScore">お疲れ様でした！</div>
            <div id="finalMessage" style="white-space: pre-line;"></div>
            <!-- 【ブラッシュアップ】同じモード・次の教材・ほかの教材も選べるようにした -->
            <div class="result-nav">
                <button class="again" onclick="startQuiz(currentMode)">同じモードでもう一度</button>
                <button class="plain" onclick="backToMenu()">モードをえらび直す</button>
                <a class="next" href="teisekibun.html">つぎは「定積分」へ ▶</a>
                <a href="../remake.html">ほかの教材をえらぶ</a>
            </div>
        </div>
    </div>

    <script>
        // 難易度別問題プール
        const easyQuestions = [
            {q: "∫ x dx", options: ["x + C", "<div class='fraction'><span>x²</span><span>2</span></div> + C", "x² + C", "2x + C"], correct: 1},
            {q: "∫ x² dx", options: ["2x + C", "<div class='fraction'><span>x³</span><span>3</span></div> + C", "x³ + C", "3x² + C"], correct: 1},
            {q: "∫ 1 dx", options: ["1 + C", "x + C", "0", "C"], correct: 1},
            {q: "∫ 2x dx", options: ["2 + C", "x² + C", "<div class='fraction'><span>x²</span><span>2</span></div> + C", "2x² + C"], correct: 1},
            {q: "∫ 3x² dx", options: ["6x + C", "x³ + C", "3x³ + C", "9x + C"], correct: 1},
            {q: "∫ 5 dx", options: ["5 + C", "x + C", "5x + C", "0"], correct: 2},
            {q: "∫ 6x dx", options: ["6 + C", "6x² + C", "3x² + C", "x² + C"], correct: 2},
            {q: "∫ 4x³ dx", options: ["12x² + C", "4x⁴ + C", "16x² + C", "x⁴ + C"], correct: 3}
        ];

        const mediumQuestions = [
            {q: "∫ (x + 1) dx", options: ["x² + 1 + C", "2x + 1 + C", "<div class='fraction'><span>x²</span><span>2</span></div> + x + C", "x + C"], correct: 2},
            {q: "∫ (2x + 3) dx", options: ["2x² + 3x + C", "x² + 3x + C", "4x + 3 + C", "2 + C"], correct: 1},
            {q: "∫ (x² + x) dx", options: ["2x + 1 + C", "x³ + x² + C", "<div class='fraction'><span>x³</span><span>3</span></div> + <div class='fraction'><span>x²</span><span>2</span></div> + C", "3x² + x + C"], correct: 2},
            {q: "∫ (3x + 2) dx", options: ["3x² + 2x + C", "6x + 2 + C", "3 + C", "<div class='fraction'><span>3x²</span><span>2</span></div> + 2x + C"], correct: 3},
            {q: "∫ (x² - x) dx", options: ["2x - 1 + C", "<div class='fraction'><span>x³</span><span>3</span></div> - <div class='fraction'><span>x²</span><span>2</span></div> + C", "x³ - x² + C", "3x² - x + C"], correct: 1},
            {q: "∫ (4x - 1) dx", options: ["4x² - x + C", "8x - 1 + C", "2x² - x + C", "4 + C"], correct: 2},
            {q: "∫ (5x + 3) dx", options: ["5x² + 3x + C", "10x + 3 + C", "5 + C", "<div class='fraction'><span>5x²</span><span>2</span></div> + 3x + C"], correct: 3},
            {q: "∫ (x³ + x) dx", options: ["3x² + 1 + C", "x⁴ + x² + C", "4x³ + x + C", "<div class='fraction'><span>x⁴</span><span>4</span></div> + <div class='fraction'><span>x²</span><span>2</span></div> + C"], correct: 3}
        ];

        const hardQuestions = [
            {q: "∫ (x² + 2x + 1) dx", options: ["2x + 2 + C", "x³ + 2x² + x + C", "<div class='fraction'><span>x³</span><span>3</span></div> + x² + x + C", "3x² + 4x + 1 + C"], correct: 2},
            {q: "∫ (2x³ + x²) dx", options: ["6x² + 2x + C", "2x⁴ + x³ + C", "8x² + 3x + C", "<div class='fraction'><span>x⁴</span><span>2</span></div> + <div class='fraction'><span>x³</span><span>3</span></div> + C"], correct: 3},
            {q: "∫ (x⁴ + x²) dx", options: ["4x³ + 2x + C", "<div class='fraction'><span>x⁵</span><span>5</span></div> + <div class='fraction'><span>x³</span><span>3</span></div> + C", "x⁵ + x³ + C", "5x⁴ + 3x² + C"], correct: 1},
            {q: "∫ (3x² + 2x - 1) dx", options: ["6x + 2 + C", "3x³ + 2x² - x + C", "x³ + x² - x + C", "9x² + 2x - 1 + C"], correct: 2},

            {q: "∫ (7x³ - 4x²) dx", options: ["<div class='fraction'><span>7x⁴</span><span>4</span></div> - <div class='fraction'><span>4x³</span><span>3</span></div> + C", "21x² - 8x + C", "7x⁴ - 4x³ + C", "28x² - 12x + C"], correct: 0},
            {q: "∫ 66x dx", options: ["33x² + C", "66 + C", "66x² + C", "132x + C"], correct: 0},
            {q: "∫ 72x² dx", options: ["24x³ + C", "144x + C", "72x³ + C", "216x + C"], correct: 0},
            {q: "∫ (19x + 10) dx", options: ["<div class='fraction'><span>19x²</span><span>2</span></div> + 10x + C", "19x² + 10x + C", "38x + 10 + C", "19 + C"], correct: 0},
            {q: "∫ (20x - 9) dx", options: ["10x² - 9x + C", "20x² - 9x + C", "40x - 9 + C", "20 + C"], correct: 0},
            {q: "∫ (x⁸ + x⁵) dx", options: ["<div class='fraction'><span>x⁹</span><span>9</span></div> + <div class='fraction'><span>x⁶</span><span>6</span></div> + C", "8x⁷ + 5x⁴ + C", "x⁹ + x⁶ + C", "9x⁸ + 6x⁵ + C"], correct: 0},
            {q: "∫ (x⁸ - x⁵) dx", options: ["<div class='fraction'><span>x⁹</span><span>9</span></div> - <div class='fraction'><span>x⁶</span><span>6</span></div> + C", "8x⁷ - 5x⁴ + C", "x⁹ - x⁶ + C", "9x⁸ - 6x⁵ + C"], correct: 0},
            {q: "∫ (15x² + 8x) dx", options: ["5x³ + 4x² + C", "30x + 8 + C", "15x³ + 8x² + C", "45x² + 8x + C"], correct: 0},
            {q: "∫ (16x² - 8x) dx", options: ["<div class='fraction'><span>16x³</span><span>3</span></div> - 4x² + C", "32x - 8 + C", "16x³ - 8x² + C", "48x² - 8x + C"], correct: 0},
            {q: "∫ (x² + 7x + 6) dx", options: ["<div class='fraction'><span>x³</span><span>3</span></div> + <div class='fraction'><span>7x²</span><span>2</span></div> + 6x + C", "2x + 7 + C", "x³ + 7x² + 6x + C", "3x² + 14x + 6 + C"], correct: 0},
            {q: "∫ (x² - 7x + 6) dx", options: ["<div class='fraction'><span>x³</span><span>3</span></div> - <div class='fraction'><span>7x²</span><span>2</span></div> + 6x + C", "2x - 7 + C", "x³ - 7x² + 6x + C", "3x² - 14x + 6 + C"], correct: 0}
        ];

        let currentMode = '';
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = -1;
        let hasAnswered = false;
        let startTime = 0;
        let timerInterval = null;
        // 【ブラッシュアップ】この問題でまちがえた・答えを見たか／遊びの回（古いタイマーの取り消し用）
        let missedThis = false;
        let runId = 0;

        const isTouch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
        // 全角の数字・記号を半角に、いろいろな「ー」をマイナスにそろえる
        function nz(v) {
            return String(v).normalize('NFKC').replace(/[ー－−―‐]/g, '-').replace(/\s/g, '');
        }
        function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
        function frac(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
        const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
        function supOf(p) { return String(p).split('').map(ch => SUP[+ch]).join(''); }
        function pretty(s) { return String(s).replace(/-/g, '−'); }

        // 式の文字列（例 "(x+1)(x-2)"、"3x² - 4x + 5"）を読んで、係数の配列 [定数, x, x², …] にする
        function parsePoly(str) {
            const s = str.replace(/\s/g, '').replace(/[−]/g, '-');
            let i = 0;
            const add = (a, b) => { const r = []; for (let k = 0; k < Math.max(a.length, b.length); k++) r[k] = (a[k] || 0) + (b[k] || 0); return r; };
            const mul = (a, b) => { const r = new Array(a.length + b.length - 1).fill(0); a.forEach((x, p) => b.forEach((y, q) => { r[p + q] += x * y; })); return r; };
            const pow = (a, n) => { let r = [1]; for (let k = 0; k < n; k++) r = mul(r, a); return r; };
            function readSup() { let t = ''; while (i < s.length && SUP.includes(s[i])) t += SUP.indexOf(s[i++]); return t === '' ? 1 : +t; }
            function base() {
                if (s[i] === '(') { i++; const e = expr(); if (s[i] !== ')') throw new Error('かっこが閉じていない: ' + str); i++; return e; }
                if (s[i] === 'x') { i++; return [0, 1]; }
                let t = '';
                while (i < s.length && /\d/.test(s[i])) t += s[i++];
                if (t === '') throw new Error('読めない式: ' + str);
                return [+t];
            }
            function factor() { const b = base(); return pow(b, readSup()); }
            function term() {
                let sign = 1;
                while (s[i] === '+' || s[i] === '-') { if (s[i] === '-') sign = -sign; i++; }
                let r = factor();
                while (i < s.length && (s[i] === '(' || s[i] === 'x' || /\d/.test(s[i]))) r = mul(r, factor());
                return r.map(c => c * sign);
            }
            function expr() {
                let r = term();
                while (i < s.length && (s[i] === '+' || s[i] === '-')) r = add(r, term());
                return r;
            }
            const r = expr();
            if (i !== s.length) throw new Error('読めない式: ' + str);
            return r;
        }
        function integrandOf(q) { return q.replace(/^∫\s*/, '').replace(/\s*dx\s*$/, ''); }
        // 係数の配列 → 項の並び [{k, p}]（次数の高い順）
        function termsOf(c) { const t = []; for (let p = c.length - 1; p >= 0; p--) if (c[p]) t.push({ k: c[p], p }); return t; }
        // 不定積分の項：k xᵖ → (k/(p+1)) xᵖ⁺¹
        function antiTerms(it) { return it.map(({ k, p }) => { const [n, d] = frac(k, p + 1); return { n, d, p: p + 1 }; }); }

        function fracHTML(n, d) { return `<span class="fraction"><span>${n}</span><span>${d}</span></span>`; }
        // 1 つの項（符号なし）：係数 n/d、次数 p
        function monoHTML(n, d, p) {
            n = Math.abs(n);
            const xs = p === 0 ? '' : p === 1 ? 'x' : 'x' + supOf(p);
            const c = d === 1 ? ((n === 1 && p > 0) ? '' : String(n)) : fracHTML(n, d);
            return c + xs;
        }
        // 項の並び [{n, d, p}] → 式の HTML（withC なら最後に「+ C」）
        function polyHTML(terms, withC) {
            let h = '';
            terms.filter(t => t.n !== 0).forEach((t, j) => {
                const neg = t.n < 0;
                h += j === 0 ? (neg ? '−' : '') : (neg ? ' − ' : ' + ');
                h += monoHTML(t.n, t.d, t.p);
            });
            if (h === '') h = '0';
            if (withC) h += ' + C';
            return h;
        }

        // 選択肢を作る（定数だけの問題は null を返し、先生の選択肢を使う）
        function makeOptions(q) {
            const it = termsOf(parsePoly(integrandOf(q)));
            if (it.every(t => t.p === 0)) return null;
            const T = (n, d, p) => { const f = frac(n, d); return { n: f[0], d: f[1], p }; };
            const correct = polyHTML(antiTerms(it), true);
            const cands = [
                polyHTML(it.map(({ k, p }) => p === 0 ? T(k, 1, 1) : T(k, p, p + 1)), true),   // n でわった（n+1 でなく）
                polyHTML(it.map(({ k, p }) => T(k, p + 1, p)), true),                            // 次数を上げずにわった
                polyHTML(it.filter(t => t.p > 0).map(({ k, p }) => T(k * p, 1, p - 1)), true),  // 微分してしまった
                polyHTML(it.map(({ k, p }) => T(k, 1, p + 1)), true),                            // (n+1) でわり忘れ
                polyHTML(antiTerms(it), false)                                                   // C の書き忘れ
            ];
            const seen = new Set([correct]);
            const pool = [];
            shuffleArray(cands).forEach(h => { if (!seen.has(h)) { seen.add(h); pool.push(h); } });
            const pick = pool.slice(0, 3);
            const hasFrac = h => h.includes('fraction');
            // 分数の選択肢が正解だけにならないようにする
            if (hasFrac(correct) && !pick.some(hasFrac)) {
                const f = pool.slice(3).find(hasFrac);
                if (f) pick[pick.length - 1] = f;
            }
            if (pick.length < 3) return null;
            return { options: [correct, ...pick], correct: 0 };
        }

        // 解説（途中式つき）
        function explainHTML(question) {
            if (question.cond) return condExplainHTML(question);
            const src = integrandOf(question.q);
            const it = termsOf(parsePoly(src));
            const expanded = polyHTML(it.map(({ k, p }) => ({ n: k, d: 1, p })), false);
            let h = '';
            if (/\)[\s]*[(x\d²³]|x\(|\)[²³]/.test(src)) h += `まず展開する：${pretty(src)} = ${expanded}<br>`;
            const steps = it.map(({ k, p }, j) => {
                const sign = j === 0 ? (k < 0 ? '−' : '') : (k < 0 ? ' − ' : ' + ');
                const a = Math.abs(k);
                if (p === 0) return sign + (a === 1 ? 'x' : a + 'x');
                return sign + (a === 1 ? '' : a + '·') + fracHTML(1, p + 1) + 'x' + supOf(p + 1);
            }).join('');
            const ans = polyHTML(antiTerms(it), true);
            h += `∫${it.length > 1 ? '(' + expanded + ')' : expanded} dx = ${steps} + C`;
            if (steps + ' + C' !== ans) h += `<br>　　　　 = ${ans}`;
            return `<div class="explain">${h}<div class="explain-note">xⁿ の不定積分は ${fracHTML(1, 'n+1')}xⁿ⁺¹ + C（C は積分定数）</div></div>`;
        }
        // 条件から C を決める問題の解説
        function condInfo(question) {
            const at = antiTerms(termsOf(parsePoly(question.deriv)));
            // F(a) の C 以外の部分（分数で計算）
            let n = 0, d = 1;
            at.forEach(t => { const v = frac(t.n * Math.pow(question.at, t.p), t.d); [n, d] = frac(n * v[1] + v[0] * d, d * v[1]); });
            const [cn, cd] = frac(question.val * d - n, d);
            return { at, f0: [n, d], c: [cn, cd] };
        }
        function numHTML([n, d]) { const s = n < 0 ? '−' : ''; return d === 1 ? s + Math.abs(n) : s + fracHTML(Math.abs(n), d); }
        function condExplainHTML(question) {
            const info = condInfo(question);
            const F = polyHTML(info.at, false);
            const cval = numHTML(info.c);
            return `<div class="explain">F(x) = ∫(${pretty(question.deriv)})dx = ${F} + C<br>` +
                `F(${question.at}) = ${numHTML(info.f0)} + C = ${question.val} より C = ${cval}<br>` +
                `よって F(x) = ${F}${info.c[0] < 0 ? ' − ' + numHTML([-info.c[0], info.c[1]]) : ' + ' + cval}</div>`;
        }

        // 問題を出す前の準備：選択肢を作り直す
        function prepareQuestion(q) {
            const o = Object.assign({}, q);
            if (currentMode !== 'input' && !o.cond) {
                const g = makeOptions(o.q);
                if (g) { o.options = g.options; o.correct = g.correct; }
            }
            return o;
        }

        // 展開してから積分する問題を、全問モード・連チャンモードにも入れる
        questionPool.push(...expandQuestions);

        function startQuiz(mode) {
            currentMode = mode;
            currentQuestionIndex = 0;
            score = 0;
            runId++;
            window.scrollTo(0, 0);
            selectedOption = -1;
            hasAnswered = false;
            startTime = Date.now();

            // 問題を準備
            if (mode === 'random10') {
                currentQuestions = getProgressiveQuestions();
            } else if (mode === 'random100' || mode === 'challenge') {
                currentQuestions = shuffleArray([...questionPool]);
            } else if (mode === 'input') {
                // ふつうの問題 7 問 → 展開する問題 2 問 → 条件から C を決める問題 1 問
                currentQuestions = [
                    ...shuffleArray(inputQuestions.filter(q => !q.level)).slice(0, 7),
                    ...shuffleArray(inputQuestions.filter(q => q.level === 'expand')).slice(0, 2),
                    ...shuffleArray(inputQuestions.filter(q => q.level === 'cond')).slice(0, 1)
                ];
            }
            currentQuestions = currentQuestions.map(prepareQuestion);

            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('finalResult').classList.add('hidden');
            document.getElementById('finishBtn').classList.toggle('hidden', mode !== 'random100');

            startTimer();
            showQuestion();
        }

        function getProgressiveQuestions() {
            // やさしい 3 問 → ふつう 3 問 → むずかしい 2 問 → 展開する 2 問
            return [
                ...shuffleArray([...easyQuestions]).slice(0, 3),
                ...shuffleArray([...mediumQuestions]).slice(0, 3),
                ...shuffleArray([...hardQuestions]).slice(0, 2),
                ...shuffleArray([...expandQuestions]).slice(0, 2)
            ];
        }


        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent =
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function getRandomQuestions(count) {
            const shuffled = shuffleArray([...questionPool]);
            return shuffled.slice(0, count);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function showQuestion() {
            const question = currentQuestions[currentQuestionIndex];

            // プログレス更新
            const totalQuestions = currentMode === 'challenge' ? '∞' : currentQuestions.length;
            document.getElementById('progress').textContent = `問題 ${currentQuestionIndex + 1}/${totalQuestions}`;
            document.getElementById('score').textContent = currentMode === 'challenge' ? `連続正解: ${score}問` : `一発正解: ${score}問`;

            // 問題表示（- は − で表示する）
            document.getElementById('question').innerHTML = question.cond
                ? `F′(x) = ${pretty(question.deriv)}、F(${question.at}) = ${question.val}<br><span class="q-sub">を満たす関数 F(x) を求めよう</span>`
                : pretty(question.q) + ' = ?';
            document.getElementById('cNote').style.display = question.cond ? 'none' : '';

            if (currentMode === 'input') {
                document.getElementById('options').classList.add('hidden');
                document.getElementById('inputContainer').classList.remove('hidden');
                showInputForm(question);
            } else {
                document.getElementById('options').classList.remove('hidden');
                document.getElementById('inputContainer').classList.add('hidden');
                document.getElementById('inputContainer').innerHTML = '';

                // 選択肢をシャッフル
                const indices = shuffleArray([0, 1, 2, 3]);
                const optionsContainer = document.getElementById('options');
                optionsContainer.innerHTML = '';
                indices.forEach((originalIndex, newIndex) => {
                    if (originalIndex === question.correct) question.shuffledCorrect = newIndex;
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    optionDiv.innerHTML = question.options[originalIndex];
                    optionDiv.onclick = () => selectOption(newIndex);
                    optionsContainer.appendChild(optionDiv);
                });
            }

            // ボタン状態リセット
            selectedOption = -1;
            hasAnswered = false;
            missedThis = false;
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('retryBtn').classList.add('hidden');
            document.getElementById('resultMessage').classList.add('hidden');
            document.getElementById('enterHint').classList.add('hidden');
            document.getElementById('showAnswerBtn').classList.remove('hidden');
            document.getElementById('checkBtn').classList.toggle('hidden', currentMode !== 'input');
        }


        function showInputForm(question) {
            const container = document.getElementById('inputContainer');
            const ans = antiTerms(termsOf(parsePoly(question.cond ? question.deriv : integrandOf(question.q))));
            question._ans = ans;
            if (question.cond) question._c = condInfo(question).c;

            let h = '<div class="term-row">' + (question.cond ? '<span class="math-symbol lhs">F(x) =</span>' : '');
            ans.forEach((t, j) => {
                h += '<span class="term">';
                if (j > 0 || t.n < 0) h += `<button type="button" class="sign-btn" data-j="${j}" data-v="" aria-label="符号（タップで ＋ と − が入れかわる）">±</button>`;
                h += `<span class="frac-in"><input class="input-field in-num" data-j="${j}" inputmode="numeric" autocomplete="off" placeholder="分子" aria-label="係数の分子">` +
                     `<span class="fraction-line"></span>` +
                     `<input class="input-field in-den" data-j="${j}" inputmode="numeric" autocomplete="off" placeholder="分母" aria-label="係数の分母"></span>` +
                     `<span class="x-symbol">x</span><input class="input-field in-pow" data-j="${j}" inputmode="numeric" autocomplete="off" placeholder="次数" aria-label="次数">`;
                h += '</span>';
            });
            h += `<span class="term"><span class="math-symbol">+</span><input class="input-field in-c" autocomplete="off" autocapitalize="characters" ${question.cond ? 'inputmode="numeric" placeholder="数" aria-label="C の値"' : 'placeholder="？" aria-label="積分定数"'}></span></div>`;
            h += `<p class="in-help">係数は分数で入れよう（整数なら分母は空らん、係数 1 は空らんでもOK）。<br>${question.cond ? '最後の欄には、条件から求めた C の値を入れよう。' : '最後の欄には、積分定数を表す文字を入れよう。'}</p>`;
            container.innerHTML = h;

            container.querySelectorAll('.sign-btn').forEach(b => b.addEventListener('click', () => {
                if (hasAnswered) return;
                b.dataset.v = b.dataset.v === '+' ? '-' : '+';
                b.textContent = b.dataset.v === '+' ? '+' : '−';
                b.classList.remove('correct', 'wrong');
            }));

            // 入力の動き（一度だけ登録する）
            if (!container.dataset.bound) {
                container.dataset.bound = '1';
                container.addEventListener('input', e => { if (e.target.classList) e.target.classList.remove('wrong', 'reduce'); });
                // Enter キーで判定（同じ Enter で次の問題に進まないようにする）
                container.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT') {
                        e.preventDefault();
                        e.stopPropagation();
                        checkInputAnswer();
                    }
                });
            }

            // スマホではキーボードをいきなり出さない
            setTimeout(() => {
                const firstInput = container.querySelector('.input-field');
                if (firstInput && !isTouch) firstInput.focus();
            }, 100);
        }

        function setMark(el, state) {
            el.classList.remove('correct', 'wrong', 'reduce');
            if (state) el.classList.add(state);
        }
        // 分子・分母の欄を読む（空らんは 1）。数でなければ NaN
        function readFrac(inNum, inDen) {
            const a = nz(inNum.value), b = nz(inDen.value);
            const n = a === '' ? 1 : (/^\d+$/.test(a) ? +a : NaN);
            const d = b === '' ? 1 : (/^\d+$/.test(b) ? +b : NaN);
            return [n, d];
        }

        function checkInputAnswer() {
            if (hasAnswered) return;
            const question = currentQuestions[currentQuestionIndex];
            const box = document.getElementById('inputContainer');
            let allOk = true, onlyReduce = true, cProblem = '';
            // まだ何も入れていない項があるときは、判定しない（まちがいにも数えない）
            const emptyTerm = question._ans.some((t, j) => ['.in-num', '.in-den', '.in-pow'].every(sel => nz(box.querySelector(`${sel}[data-j="${j}"]`).value) === ''));
            if (emptyTerm) {
                const m = document.getElementById('resultMessage');
                m.className = 'result-message result-reduce';
                m.innerHTML = 'まだ入っていない項があります。係数と次数を入れよう。';
                return;
            }

            question._ans.forEach((t, j) => {
                const nIn = box.querySelector(`.in-num[data-j="${j}"]`);
                const dIn = box.querySelector(`.in-den[data-j="${j}"]`);
                const pIn = box.querySelector(`.in-pow[data-j="${j}"]`);
                const sBtn = box.querySelector(`.sign-btn[data-j="${j}"]`);
                const [n, d] = readFrac(nIn, dIn);
                const sameValue = n * t.d === Math.abs(t.n) * d;
                const reduced = gcd(n, d) === 1;
                const fracState = sameValue ? (reduced ? 'correct' : 'reduce') : 'wrong';
                setMark(nIn, fracState); setMark(dIn, fracState);
                const pv = nz(pIn.value);
                const powOk = pv === String(t.p) || (t.p === 1 && pv === '');
                setMark(pIn, powOk ? 'correct' : 'wrong');
                let signOk = true;
                if (sBtn) { signOk = sBtn.dataset.v === (t.n < 0 ? '-' : '+'); setMark(sBtn, signOk ? 'correct' : 'wrong'); }
                if (fracState !== 'correct' || !powOk || !signOk) allOk = false;
                if (fracState === 'wrong' || !powOk || !signOk) onlyReduce = false;
            });
            const cIn = box.querySelector('.in-c');
            const cv = nz(cIn.value).toUpperCase();
            let cOk;
            if (question.cond) {
                const [cn, cd] = question._c;
                cOk = cd === 1 ? cv === String(cn) : cv === `${cn}/${cd}`;
            } else {
                cOk = cv === 'C';
                if (!cOk) cProblem = cv === '' ? '積分定数 C を忘れずに書こう！' : '積分定数は C で表そう。';
            }
            setMark(cIn, cOk ? 'correct' : 'wrong');
            if (!cOk) { allOk = false; onlyReduce = false; }

            const resultMessage = document.getElementById('resultMessage');
            resultMessage.classList.remove('hidden');
            if (allOk) {
                hasAnswered = true;
                if (!missedThis) score++;
                resultMessage.className = 'result-message result-correct';
                resultMessage.innerHTML = '正解です！' + explainHTML(question);
                box.querySelectorAll('input, button').forEach(el => { el.disabled = true; });
                document.getElementById('checkBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
                document.getElementById('enterHint').classList.remove('hidden');
                document.getElementById('showAnswerBtn').classList.add('hidden');
                document.getElementById('score').textContent = `一発正解: ${score}問`;
                document.addEventListener('keydown', handleEnterKey);
            } else if (onlyReduce) {
                resultMessage.className = 'result-message result-reduce';
                resultMessage.innerHTML = 'おしい！ 値は合っています。黄色の係数を約分しよう。';
            } else {
                missedThis = true;
                resultMessage.className = 'result-message result-wrong';
                resultMessage.innerHTML = '赤い欄がちがいます。' + (cProblem ? `<div class="rule-hint">💡 ${cProblem}</div>` : '') + RULE_HINT;
            }
        }


        function selectOption(index) {
            if (hasAnswered) return;

            // 前の選択をクリア
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // 新しい選択をマーク
            document.querySelectorAll('.option')[index].classList.add('selected');
            selectedOption = index;

            // 自動で正誤判定（即座に）
            checkAnswer();
        }

        const RULE_HINT = '<div class="rule-hint">💡 ∫xⁿ dx = <span class="fraction"><span>1</span><span>n+1</span></span>xⁿ⁺¹ + C（次数を 1 ふやして、その数でわる。C は積分定数）。微分してもとの式にもどるか、たしかめよう。</div>';

        function checkAnswer() {
            if (currentMode === 'input') {
                checkInputAnswer();
                return;
            }
            if (selectedOption === -1 || hasAnswered) return;

            hasAnswered = true;
            const question = currentQuestions[currentQuestionIndex];
            const isCorrect = selectedOption === question.shuffledCorrect;
            const resultMessage = document.getElementById('resultMessage');
            const options = document.querySelectorAll('.option');

            if (isCorrect) {
                if (!missedThis) score++;
                resultMessage.innerHTML = '正解です！' + explainHTML(question);
                resultMessage.className = 'result-message result-correct';
                resultMessage.classList.remove('hidden');
                document.getElementById('score').textContent = currentMode === 'challenge' ? `連続正解: ${score}問` : `一発正解: ${score}問`;
                document.getElementById('nextBtn').classList.remove('hidden');
                document.getElementById('enterHint').classList.remove('hidden');
                document.getElementById('showAnswerBtn').classList.add('hidden');
                document.getElementById('retryBtn').classList.add('hidden');
                document.addEventListener('keydown', handleEnterKey);
            } else {
                options[selectedOption].classList.add('wrong');
                missedThis = true;
                resultMessage.className = 'result-message result-wrong';
                resultMessage.classList.remove('hidden');

                if (currentMode === 'challenge') {
                    // 鬼連チャンモードでは即終了。正しい答えと解説を見せる。メニューに戻っていたら結果を出さない
                    const right = options[question.shuffledCorrect];
                    if (right) right.classList.add('selected');
                    resultMessage.innerHTML = '不正解です。' + explainHTML(question);
                    const myRun = runId;
                    setTimeout(() => {
                        if (myRun === runId) showFinalResult();
                    }, 3000);
                } else {
                    // まちがえたままでは次へ進めない（もう一度挑戦 か 答えを見る）
                    resultMessage.innerHTML = '不正解です。' + RULE_HINT;
                    document.getElementById('retryBtn').classList.remove('hidden');
                }
            }
        }


        function handleEnterKey(event) {
            if (event.key === 'Enter' && hasAnswered) {
                document.removeEventListener('keydown', handleEnterKey);
                nextQuestion();
            }
        }

        function retryQuestion() {
            if (currentMode === 'input') {
                // 入力フィールドをリセット
                document.querySelectorAll('.input-field').forEach(field => {
                    field.value = '';
                    field.className = 'input-field';
                });

                // 最初の入力フィールドにフォーカス
                const firstInput = document.querySelector('.input-field');
                if (firstInput) firstInput.focus();
            } else {
                // 選択状態をリセット
                document.querySelectorAll('.option').forEach(opt => {
                    opt.classList.remove('selected', 'wrong');
                });
            }

            selectedOption = -1;
            hasAnswered = false;

            document.getElementById('retryBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('resultMessage').classList.add('hidden');
            document.getElementById('enterHint').classList.add('hidden');
            document.getElementById('showAnswerBtn').classList.remove('hidden');

            if (currentMode === 'input') {
                document.getElementById('checkBtn').classList.remove('hidden');
            }

            // エンターキーイベントリスナーを削除
            document.removeEventListener('keydown', handleEnterKey);
        }

        function nextQuestion() {
            // エンターキーイベントリスナーを削除
            document.removeEventListener('keydown', handleEnterKey);

            currentQuestionIndex++;

            // 終了条件チェック
            if ((currentMode === 'random10' || currentMode === 'input') && currentQuestionIndex >= 10) {
                showFinalResult();
            } else if (currentMode === 'random100' && currentQuestionIndex >= currentQuestions.length) {   // 【ブラッシュアップ】
                showFinalResult();
            } else if (currentMode === 'challenge' && currentQuestionIndex >= currentQuestions.length) {
                // 全問題を使い切った場合、新しい問題セットを生成
                currentQuestions = shuffleArray([...questionPool]).map(prepareQuestion);   // 【ブラッシュアップ】
                currentQuestionIndex = 0;
                showQuestion();
            } else {
                showQuestion();
            }
        }

        function showFinalResult() {
            stopTimer();

            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('finalResult').classList.remove('hidden');

            const finalScore = document.getElementById('finalScore');
            const finalMessage = document.getElementById('finalMessage');

            const totalTime = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;
            const timeText = `${minutes}分${seconds}秒`;

            if (currentMode === 'random10' || currentMode === 'input') {
                finalScore.textContent = `${score}/10問 一発正解！`;
                if (score === 10) {
                    finalMessage.textContent = `完璧です！素晴らしい！🎉\n所要時間: ${timeText}`;
                } else if (score >= 8) {
                    finalMessage.textContent = `とても良くできました！👏\n所要時間: ${timeText}`;
                } else if (score >= 6) {
                    finalMessage.textContent = `まずまずの成績です！📚\n所要時間: ${timeText}`;
                } else {
                    finalMessage.textContent = `もう少し練習してみましょう！💪\n所要時間: ${timeText}`;
                }
            } else if (currentMode === 'random100') {
                // 【ブラッシュアップ】とちゅうで終わったときは、そこまでに答えた問題の数で
                const doneCount = Math.min(currentQuestions.length, currentQuestionIndex + (hasAnswered ? 1 : 0));
                finalScore.textContent = `${score}/${doneCount}問 一発正解！`;
                const percentage = doneCount ? Math.round((score / doneCount) * 100) : 0;
                finalMessage.textContent = `正解率: ${percentage}%\n所要時間: ${timeText}`;
            } else if (currentMode === 'challenge') {
                finalScore.textContent = `${score}問連続正解！`;
                if (score >= 50) {
                    finalMessage.textContent = `驚異的な記録です！🏆\n所要時間: ${timeText}`;
                } else if (score >= 30) {
                    finalMessage.textContent = `素晴らしい集中力でした！🔥\n所要時間: ${timeText}`;
                } else if (score >= 15) {
                    finalMessage.textContent = `よく頑張りました！👍\n所要時間: ${timeText}`;
                } else {
                    finalMessage.textContent = `次回はもっと頑張りましょう！💪\n所要時間: ${timeText}`;
                }
            }
        }

        function showAnswer() {
            const question = currentQuestions[currentQuestionIndex];
            missedThis = true;
            hasAnswered = true;

            if (currentMode === 'input') {
                const box = document.getElementById('inputContainer');
                question._ans.forEach((t, j) => {
                    const set = (sel, v) => { const el = box.querySelector(`${sel}[data-j="${j}"]`); if (el) { el.value = v; setMark(el, 'correct'); } };
                    set('.in-num', Math.abs(t.n));
                    set('.in-den', t.d === 1 ? '' : t.d);
                    set('.in-pow', t.p);
                    const b = box.querySelector(`.sign-btn[data-j="${j}"]`);
                    if (b) { b.dataset.v = t.n < 0 ? '-' : '+'; b.textContent = t.n < 0 ? '−' : '+'; setMark(b, 'correct'); }
                });
                const cIn = box.querySelector('.in-c');
                cIn.value = question.cond ? (question._c[1] === 1 ? question._c[0] : question._c.join('/')) : 'C';
                setMark(cIn, 'correct');
                box.querySelectorAll('input, button').forEach(el => { el.disabled = true; });
                document.getElementById('checkBtn').classList.add('hidden');
            } else {
                // 選択肢モードでは正解の選択肢をハイライト
                document.getElementById('retryBtn').classList.add('hidden');
                const opt = document.querySelectorAll('.option')[question.shuffledCorrect];
                if (opt) opt.classList.add('selected', 'answer-shown');
            }

            document.getElementById('nextBtn').classList.remove('hidden');
            document.getElementById('enterHint').classList.remove('hidden');
            document.getElementById('showAnswerBtn').classList.add('hidden');

            const resultMessage = document.getElementById('resultMessage');
            resultMessage.innerHTML = '答えを表示しました' + explainHTML(question);
            resultMessage.className = 'result-message result-shown';
            resultMessage.classList.remove('hidden');

            // エンターキーで次の問題へ
            document.addEventListener('keydown', handleEnterKey);
        }


        function backToMenu() {
            runId++;   // 【ブラッシュアップ】
            window.scrollTo(0, 0);
            stopTimer();
            document.removeEventListener('keydown', handleEnterKey);
            document.getElementById('modeSelection').style.display = 'grid';
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('finalResult').classList.add('hidden');
        }

        document.querySelectorAll('.pool-count').forEach(e => e.textContent = questionPool.length);   // 【ブラッシュアップ】
    </script>
<script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
    ".title": "u-title",
    ".mode-card": "u-choice",
    ".option": "u-choice",
    ".option.selected:not(.wrong)": "u-ok",
    ".option.wrong": "u-ng",
    "#checkBtn": "u-btn",
    "#nextBtn": "u-btn u-btn-blue",
    "#retryBtn": "u-btn",
    "#showAnswerBtn": "u-btn u-btn-plain",
    "#finishBtn": "u-btn u-btn-plain",
    "#backBtn": "u-btn u-btn-plain",
    ".result-nav .again": "u-btn",
    ".result-nav .next": "u-btn u-btn-blue",
    ".result-nav .plain": "u-btn u-btn-plain"
  });
</script>
