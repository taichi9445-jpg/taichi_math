    <script src="../../assets/fill-steps.js"></script>
    <script>
      // 数式のHTMLは、文字だけ斜体・数字は立体。式の行と日本語の説明を分ける。
      function mathHTML(html) {
        return String(html)
          .split(/(<[^>]+>)/g)
          .map((part, i) =>
            i % 2
              ? part
              : part.replace(
                  /[A-Za-z0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻'′()+−=×÷·.,^\- ]+/g,
                  (run) => {
                    if (!/[A-Za-z0-9ⁿ]/.test(run)) return run;
                    let text = run
                      .replace(/'/g, "′")
                      .replace(/-/g, "−")
                      .replace(/\^(\d+)/g, (_, n) => "<sup>" + n + "</sup>");
                    text = text.replace(
                      /[ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,
                      (x) =>
                        "<sup>" +
                        [...x]
                          .map((c) =>
                            c === "ⁿ"
                              ? "n"
                              : c === "⁻"
                                ? "−"
                                : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c),
                          )
                          .join("") +
                        "</sup>",
                    );
                    text = text
                      .split(/(<[^>]+>)/g)
                      .map((x, j) =>
                        j % 2
                          ? x
                          : x.replace(/[A-Za-z]+/g, (letters) =>
                              ["sin", "cos", "tan", "log"].includes(letters)
                                ? letters
                                : "<i>" + letters + "</i>",
                            ),
                      )
                      .join("");
                    return '<span class="m">' + text + "</span>";
                  },
                ),
          )
          .join("");
      }
      // 等号を独立した要素にし、折り返しの前後でも左右の間隔を保つ。
      function lessonMath(html) {
        return mathHTML(html)
          .split(/(<[^>]+>)/g)
          .map((s, i) =>
            i % 2 ? s : s.replace(/\s*=\s*/g, '<span class="equal">=</span>'),
          )
          .join("");
      }
      function lessonSteps(mid) {
        return String(mid)
          .replace(/<br\s*\/?\s*>/g, "。")
          .split(/(?:。|、つまり |、(?=y =)| なので、?| なので | より )/)
          .filter(Boolean)
          .map(
            (line) =>
              '<div class="equation">' +
              line
                .split(" = ")
                .map(
                  (s, i) =>
                    '<span class="eqpart">' +
                    (i ? '<span class="equal">=</span>' : "") +
                    lessonMath(s) +
                    "</span>",
                )
                .join("<wbr>") +
              "</div>",
          )
          .join("");
      }
      function graphSVG(fn, points = [], lines = [], range) {
        const xs = points.map((p) => p[0]);
        let xmin = range ? range[0] : Math.min(-3, ...xs) - 1,
          xmax = range ? range[1] : Math.max(3, ...xs) + 1;
        const samples = Array.from(
          { length: 121 },
          (_, i) => xmin + ((xmax - xmin) * i) / 120,
        );
        const ys = [
          0,
          ...points.map((p) => p[1]),
          ...samples.map((x) => (fn ? fn(x) : 0)),
          ...lines.flatMap((l) =>
            l.x !== undefined ? [] : samples.map((x) => l.m * x + l.n),
          ),
        ];
        let ymin = Math.min(...ys),
          ymax = Math.max(...ys),
          pad = Math.max(1, (ymax - ymin) * 0.12);
        ymin -= pad;
        ymax += pad;
        const X = (x) => 30 + ((x - xmin) / (xmax - xmin)) * 260,
          Y = (y) => 185 - ((y - ymin) / (ymax - ymin)) * 160;
        const path = (f) =>
          samples
            .map(
              (x, i) =>
                (i ? "L" : "M") + X(x).toFixed(2) + " " + Y(f(x)).toFixed(2),
            )
            .join(" ");
        const text = (x, y, t, anchor = "middle") =>
          '<text x="' +
          x +
          '" y="' +
          y +
          '" text-anchor="' +
          anchor +
          '" font-family="STIX Two Text,serif" font-size="13">' +
          String(t).replace(/-/g, "−") +
          "</text>";
        return (
          '<svg viewBox="0 0 320 215" role="img" aria-label="座標とグラフ"><path d="M30 ' +
          Y(0) +
          "H290" +
          (xmin <= 0 && xmax >= 0 ? "M" + X(0) + " 20V190" : "") +
          '" stroke="#aeb8c5" fill="none"/>' +
          text(301, Y(0) + 4, "x") +
          (xmin <= 0 && xmax >= 0 ? text(X(0) + 9, 15, "y") : "") +
          text(30, 207, xmin) +
          text(290, 207, xmax) +
          text(25, Y(Math.floor(ymax)) + 4, Math.floor(ymax), "end") +
          text(25, Y(Math.ceil(ymin)) + 4, Math.ceil(ymin), "end") +
          (fn
            ? '<path d="' +
              path(fn) +
              '" fill="none" stroke="#1f4e8c" stroke-width="2"/>'
            : "") +
          lines
            .map(
              (l) =>
                '<path d="' +
                (l.x !== undefined
                  ? "M" + X(l.x) + " 25V185"
                  : path((x) => l.m * x + l.n)) +
                '" stroke="#d9480f" stroke-width="2" fill="none"/>',
            )
            .join("") +
          points
            .map(
              (p, i) =>
                '<circle cx="' +
                X(p[0]) +
                '" cy="' +
                Y(p[1]) +
                '" r="3" fill="#d9480f"/>' +
                text(

                    因数分解すると、f'(x) = <input type='text' class='formula-input' id='pa2_f1' maxlength='1' data-answer='3'>(x² - <input type='text' class='formula-input' id='pa2_f2' maxlength='1' data-answer='4'>x + <input type='text' class='formula-input' id='pa2_f3' maxlength='1' data-answer='3'>)<br>
                    <span style="margin-left: 9.9em">= <input type='text' class='formula-input' id='pa2_f4' maxlength='1' data-answer='3'>(x - <input type='text' class='formula-input' id='pa2_f5' maxlength='1' data-answer='1'>)(x - <input type='text' class='formula-input' id='pa2_f6' maxlength='1' data-answer='3'>)</span><br>
                    f'(x) = 0の解は、x = <input type='text' class='formula-input' id='pa2_s1' maxlength='1' data-answer='1'>, <input type='text' class='formula-input' id='pa2_s2' maxlength='1' data-answer='3'> である
                </div>`,
          maxMin: {
            maxX: "1",
            maxValue: "5",
            maxX2: "4",
            minX: "0",
            minValue: "1",
            minX2: "3",
          },
        },
        {
          function: "f(x) = -x³ + 3x² + 2",
          domain: "定義域: -1 ≤ x ≤ 1",
          derivative:
            "微分すると、f'(x) = -<input type='text' class='formula-input' id='pa3_d1' maxlength='1' data-answer='3'>x² + <input type='text' class='formula-input' id='pa3_d2' maxlength='1' data-answer='6'>x",
          table: {
            x: ["x", "-1", "...", "", "...", "1"],
            fprime: ["f'(x)", "", "", "", "", ""],
            f: ["f(x)", "", "", "", "", ""],
          },
          answers: {
            1: "0",
            2: "/",
            3: "-",
            4: "0",
            5: "+",
            6: "/",
            7: "6",
            8: "↘",
            9: "2",
            10: "↗",
            11: "4",
          },
          hint: `<div class="formula-steps">
                    因数分解すると、f'(x) = -<input type='text' class='formula-input' id='pa3_f1' maxlength='1' data-answer='3'>x(x - <input type='text' class='formula-input' id='pa3_f2' maxlength='1' data-answer='2'>)<br>
                    f'(x) = 0の解は、x = <input type='text' class='formula-input' id='pa3_s1' maxlength='1' data-answer='0'>, <input type='text' class='formula-input' id='pa3_s2' maxlength='1' data-answer='2'> である<br>
                    x = 2 は定義域の外なので、表には入れない
                </div>`,
          maxMin: {
            maxX: "-1",
            maxValue: "6",
            minX: "0",
            minValue: "2",
          },
        },
      ];

      let currentMode = "basic";
      let problems = [];
      let currentProblem = 0;
      let completedProblems = new Set();
      let shownSet = new Set(); // 【ブラッシュアップ】「答えを見る」を使った問題
      let missCount = {}; // 【ブラッシュアップ】問題ごとの、まちがえた回数
      const isTouch =
        window.matchMedia && matchMedia("(pointer: coarse)").matches;

      function startMode(mode) {
        document.getElementById("problemToast")?.remove();
        currentMode = mode;
        currentProblem = 0;
        completedProblems.clear();

        // モードに応じて問題セットを選択
        if (mode === "basic") {
          problems = [...basicProblems];
        } else if (mode === "random") {
          // ランダムに3問選択
          const shuffled = [...randomProblems].sort(() => 0.5 - Math.random());
          problems = shuffled.slice(0, 3);
        } else if (mode === "advanced") {
          problems = [...advancedProblems];
        }

        // UI切り替え
        document.getElementById("modeSelection").style.display = "none";
        document.getElementById("quizContainer").style.display = "block";
        // 【ブラッシュアップ】
        document.getElementById("completion").style.display = "none";
        document.getElementById("problemContainer").style.display = "";
        document.querySelector(".controls").style.display = "";
        shownSet = new Set();
        missCount = {};
        window.scrollTo(0, 0);

        // モード表示を更新
        const modeNames = {
          basic: " 基本モード",
          random: " ランダムモード",
          advanced: " 発展問題モード",
        };
        document.getElementById("modeIndicator").textContent = modeNames[mode];

        displayProblem(0);
        updateButtons();
      }

      function backToModeSelection() {
        document.getElementById("modeSelection").style.display = "block";
        document.getElementById("quizContainer").style.display = "none";
        document.getElementById("completion").style.display = "none";
      }

      // 全角の数字・記号を半角に、いろいろな「ー」をマイナスにそろえる
      function nz(v) {
        return String(v)
          .normalize("NFKC")
          .replace(/[ー－−―‐]/g, "-")
          .replace(/\s/g, "");
      }

      // タップでえらぶ欄の選択肢（値, ボタンの文字）
      const PICK = {
        sign: [
          ["+", "+"],
          ["0", "0"],
          ["-", "−"],
        ],
        arrow: [
          ["↗", "↗ 増加"],
          ["↘", "↘ 減少"],
        ],
        ext: [
          ["極大", "極大"],
          ["極小", "極小"],
          ["なし", "なし"],
        ],
      };
      const PICK_TITLE = {
        sign: "f′(x) の符号をえらぼう",
        arrow: "f(x) の増減をえらぼう",
        ext: "この x で f(x) は？",
      };
      function labelOf(kind, v) {
        if (kind === "sign") return v === "-" ? "−" : v;
        return v;
      }

      // x の値が入る列で、f′(x) の符号の変わり方から 極大・極小・なし を決める
      function extremumAt(problem, index, col) {
        const l =
          problem.answers[getAnswerKey(index, `t${index}_fprime_${col - 1}`)];
        const r =
          problem.answers[getAnswerKey(index, `t${index}_fprime_${col + 1}`)];
        if (l === "+" && r === "-") return "極大";
        if (l === "-" && r === "+") return "極小";
        return "なし";
      }

      // 画面の文字を教科書の書き方にそろえる（- → −、' → ′、≤ → ≦）。入力欄の中身は変えない
      function prettyText(root) {
        const walker = document.createTreeWalker(
          root,
          NodeFilter.SHOW_TEXT,
          null,
        );
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach((n) => {
          n.nodeValue = n.nodeValue
            .replace(/'/g, "′")
            .replace(/-/g, "−")
            .replace(/≤/g, "≦")
            .replace(/定義域:\s*/, "定義域：");
        });
      }

      function displayProblem(index) {
        const problem = problems[index];
        const container = document.getElementById("problemContainer");
        const cols = problem.table.x.length;
        const key = (row, col) =>
          getAnswerKey(index, `t${index}_${row}_${col}`);
        const num = (id, ans, label, extra = "") =>
          `<input type="text" class="num ans" id="${id}" data-ans="${ans}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="${label}" ${extra}>`;
        const tap = (id, ans, kind, label, cls = "") =>
          `<button type="button" class="tap ans ${cls}" id="${id}" data-ans="${ans}" data-kind="${kind}" aria-label="${label}">${kind === "ext" ? "極？" : "？"}</button>`;

        let h = `
                <div class="problem-header">
                    <div class="function">${problem.function}</div>
                    ${problem.domain ? `<div class="domain-info">${problem.domain}</div>` : ""}
                    <div id="formulaApp"></div><button id="stepsToggle" hidden onclick="toggleSteps()" aria-expanded="false">途中式を確認</button>
                </div>
                <section id="tableStage" hidden><div class="table-grid"><div><div class="table-container"><table class="zt">`;

        // x の行
        h += "<tr><th>x</th>";
        for (let i = 1; i < cols; i++) {
          const c = problem.table.x[i];
          if (c === "...") h += '<td class="zt-dots">…</td>';
          else if (c !== "") h += `<td class="zt-end">${c}</td>`;
          else
            h += `<td class="input-cell">${num(`t${index}_x_${i}`, problem.answers[key("x", i)], "x の値")}</td>`;
        }
        // f′(x) の行（定義域の端は「/」を書いておく）
        h += "</tr><tr><th>f'(x)</th>";
        for (let i = 1; i < cols; i++) {
          const a = problem.answers[key("fprime", i)];
          if (a === "/") h += '<td class="zt-slash">/</td>';
          else
            h += `<td class="input-cell">${tap(`t${index}_fprime_${i}`, a, "sign", "f′(x) の符号")}</td>`;
        }
        // f(x) の行（x の値が入る列には、極大・極小をえらぶ欄も付ける）
        h += "</tr><tr><th>f(x)</th>";
        for (let i = 1; i < cols; i++) {
          const a = problem.answers[key("f", i)];
          if (a === "↗" || a === "↘") {
            h += `<td class="input-cell">${tap(`t${index}_f_${i}`, a, "arrow", "増加・減少", "arrow")}</td>`;
          } else {
            const ext =
              problem.table.x[i] === ""
                ? tap(
                    `e${index}_${i}`,
                    extremumAt(problem, index, i),
                    "ext",
                    "極大・極小",
                    "ext",
                  )
                : "";
            h += `<td class="input-cell">${ext}${num(`t${index}_f_${i}`, a, "f(x) の値")}</td>`;
          }
        }
        h += "</tr></table></div>";
        h +=
          '<button onclick="tableHint()">表のヒント</button><p id="tableHint" class="table-note" hidden>' +
          (problem.domain
            ? "※ 増減表では定義域の端の符号は省略するので「/」にしてある（空欄にする教科書もある）<br>"
            : "") +
          "※ f′(x) の符号・増減・極大／極小は、欄をタップしてえらぼう" +
          (isTouch ? "" : "（パソコンは + − 0 のキーでも入れられる）") +
          "</p>";

        // 発展問題モード：最大値・最小値
        if (currentMode === "advanced" && problem.maxMin) {
          const m = problem.maxMin;
          const maxAlt = [m.maxX, m.maxX2].filter(Boolean).join("|");
          const minAlt = [m.minX, m.minX2].filter(Boolean).join("|");
          h += `
                    <div class="max-min-question">
                        <h4> 最大値・最小値を求めよう</h4>
                        <div class="max-min-inputs">
                            <div class="max-min-sentence">x = ${num(`maxX_${index}`, maxAlt, "最大となる x", m.maxX2 ? 'data-pair="max"' : "")}${m.maxX2 ? ", " + num(`maxX2_${index}`, maxAlt, "最大となる x（2つ目）", 'data-pair="max"') : ""} のとき、最大値 ${num(`maxValue_${index}`, m.maxValue, "最大値")}</div>
                            <div class="max-min-sentence">x = ${num(`minX_${index}`, minAlt, "最小となる x", m.minX2 ? 'data-pair="min"' : "")}${m.minX2 ? ", " + num(`minX2_${index}`, minAlt, "最小となる x（2つ目）", 'data-pair="min"') : ""} のとき、最小値 ${num(`minValue_${index}`, m.minValue, "最小値")}</div>
                        </div>
                    </div>`;
        }

        h +=
          '</div><aside id="pickPanel" class="pick-panel" aria-label="表に入れる値"></aside></div></section>';
        container.innerHTML = lessonMath(h);
        container
          .querySelectorAll("input.num")
          .forEach((inp) =>
            inp.addEventListener("focus", () => openPicker(inp)),
          );

        // 式の穴うめ欄も、同じ判定のしかたにそろえる
        container.querySelectorAll(".formula-input").forEach((inp) => {
          inp.classList.add("ans", "num");
          inp.dataset.ans = inp.dataset.answer;
          inp.setAttribute("autocomplete", "off");
          inp.setAttribute("enterkeyhint", "next");
          inp.removeAttribute("maxlength"); // 全角で入れたときに切られないように
        });
        container.querySelectorAll("input.num").forEach((inp) => {
          inp.addEventListener("input", () => onNumInput(inp));
          inp.addEventListener("change", () => onNumCommit(inp));
          inp.addEventListener("keydown", (e) => {
            if (e.key !== "Enter" || e.isComposing) return;
            e.preventDefault();
            onNumCommit(inp);
            focusNext(inp);
          });
        });
        container.querySelectorAll("button.tap").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (!btn.disabled) openPicker(btn);
          });
          btn.addEventListener("keydown", (e) => {
            if (btn.disabled || btn.dataset.kind !== "sign") return;
            const k = nz(e.key);
            if (k === "+" || k === "-" || k === "0") {
              e.preventDefault();
              choose(btn, k);
            }
          });
        });
        prettyText(container);
        mountFormula(problem, index);

        // もう完成している問題にもどってきたときは、答えを入れた状態で見せる
        if (completedProblems.has(index)) {
          fillAnswers();
          showSummary(index);
        }

        updateStatus();
        updateProgress();

        // スマホでは、いきなりキーボードが出ないようにする
        const firstInput = container.querySelector(
          ".formula-input:not(:disabled)",
        );
        if (firstInput && !isTouch) firstInput.focus();
      }

      function getInputId(problemIndex, row, col) {
        return `t${problemIndex}_${row}_${col}`;
      }

      // 答えのデータ（answers）の何番目かを、表の場所から求める（先生の版のまま）
      function getAnswerKey(problemIndex, inputId) {
        const parts = inputId.split("_");
        const row = parts[1];
        const col = parseInt(parts[2]);
        const problem = problems[problemIndex];

        let keyIndex = 1;

        if (row === "x") {
          let inputCount = 0;
          for (let i = 1; i < col; i++) {
            if (problem.table.x[i] === "") inputCount++;
          }
          keyIndex = inputCount + 1;
        } else if (row === "fprime") {
          const xInputCount = problem.table.x.filter(
            (cell) => cell === "",
          ).length;
          keyIndex = xInputCount + (col - 1) + 1;
        } else if (row === "f") {
          const xInputCount = problem.table.x.filter(
            (cell) => cell === "",
          ).length;
          const fprimeInputCount = problem.table.fprime.filter(
            (cell) => cell === "",
          ).length;
          keyIndex = xInputCount + fprimeInputCount + (col - 1) + 1;
        }

        return keyIndex;
      }

      // 次の、まだ答えていない欄へ
      function focusNext(el) {
        const all = Array.from(
          document.querySelectorAll("#problemContainer .ans"),
        );
        const next = all.slice(all.indexOf(el) + 1).find((e) => !e.disabled);
        if (next) next.focus();
      }

      // 数の欄：答えと同じになったら、すぐに正解にする
      function answerMatches(inp, v) {
        if (!inp.dataset.ans.split("|").includes(v)) return false;
        if (inp.dataset.pair) {
          // x を 2 つ答える欄に、同じ値を 2 回入れていたらまちがい
          const others = document.querySelectorAll(
            `#problemContainer [data-pair="${inp.dataset.pair}"]`,
          );
          if (
            Array.from(others).some(
              (o) =>
                o !== inp &&
                o.classList.contains("correct") &&
                nz(o.value) === v,
            )
          )
            return false;
        }
        return true;
      }
      function onNumInput(inp) {
        inp.classList.remove("incorrect");
        const v = nz(inp.value);
        if (v !== "" && answerMatches(inp, v)) {
          inp.value = v.replace(/-/g, "−");
          markCorrect(inp);
          focusNext(inp);
        }
      }
      // Enter・欄をはなれたとき：まだ正解でなければ、まちがいを知らせる
      function onNumCommit(inp) {
        if (inp.disabled) return;
        const v = nz(inp.value);
        if (v === "") return;
        if (answerMatches(inp, v)) {
          markCorrect(inp);
          return;
        }
        if (!inp.classList.contains("incorrect")) markWrong(inp);
      }

      function markCorrect(el) {
        el.classList.remove("incorrect");
        el.classList.add("correct");
        el.disabled = true;
        checkProblemCompletion(currentProblem);
      }
      function markWrong(el) {
        missCount[currentProblem] = (missCount[currentProblem] || 0) + 1;
        el.classList.remove("incorrect");
        void el.offsetWidth; // もう一度ゆらすため
        el.classList.add("incorrect");
      }

      // タップでえらぶ画面
      function choose(btn, v) {
        if (btn.disabled) return;
        btn.textContent = labelOf(btn.dataset.kind, v);
        if (v === btn.dataset.ans) {
          markCorrect(btn);
        } else {
          markWrong(btn);
          setTimeout(() => {
            if (btn.disabled) return;
            btn.classList.remove("incorrect");
            btn.textContent = btn.dataset.kind === "ext" ? "極？" : "？";
          }, 800);
        }
      }

      function checkProblemCompletion(problemIndex) {
        const all = Array.from(
          document.querySelectorAll("#problemContainer .ans"),
        );
        if (!formulaReady) return;
        if (!all.length || all.some((e) => !e.classList.contains("correct")))
          return;
        if (completedProblems.has(problemIndex)) return;
        completedProblems.add(problemIndex);
        updateProgress();
        updateButtons();
        showSummary(problemIndex);
        showProblemCompletionMessage(problemIndex);
      }

      // 完成したときの「まとめ」：極値（と、最大・最小）を文にする
      function showSummary(index) {
        const container = document.getElementById("problemContainer");
        if (container.querySelector(".summary")) return;
        const problem = problems[index];
        const cols = problem.table.x.length;
        const parts = [];
        for (let i = 1; i < cols; i++) {
          if (problem.table.x[i] !== "") continue;
          const e = extremumAt(problem, index, i);
          if (e === "なし") continue;
          const x = problem.answers[getAnswerKey(index, `t${index}_x_${i}`)];
          const y = problem.answers[getAnswerKey(index, `t${index}_f_${i}`)];
          parts.push(`x = ${x} で${e}値 ${y}`);
        }
        let s;
        if (parts.length) {
          s = parts.join("、");
        } else {
          const arrows = Object.values(problem.answers).filter(
            (a) => a === "↗" || a === "↘",
          );
          const up = arrows.every((a) => a === "↗"),
            down = arrows.every((a) => a === "↘");
          s =
            "極値はない" +
            (up ? "（つねに増加する）" : down ? "（つねに減少する）" : "");
        }
        if (problem.maxMin) {
          const m = problem.maxMin;
          s += `<br>x = ${[m.maxX, m.maxX2].filter(Boolean).join(", ")} のとき最大値 ${m.maxValue}、x = ${[m.minX, m.minX2].filter(Boolean).join(", ")} のとき最小値 ${m.minValue}`;
        }
        const div = document.createElement("div");
        div.className = "summary";
        div.innerHTML =
          lessonMath("まとめ：" + s) + summaryGraph(problem, index);
        container.appendChild(div);
        prettyText(div);
      }

      function showProblemCompletionMessage(problemIndex) {
        const existingMessage = document.getElementById("problemToast");
        if (existingMessage) existingMessage.remove();

        const message = document.createElement("div");
        message.id = "problemToast";
        message.className = "problem-toast";
        message.innerHTML = ` 問題${problemIndex + 1} 完成！`;
        document.body.appendChild(message);
        setTimeout(() => {
          if (message.parentNode) message.remove();
        }, 1600);
      }

      function updateStatus() {
        const status = document.getElementById("status");
        status.textContent = `問題 ${currentProblem + 1}/${problems.length}`;
      }

      function updateProgress() {
        const progressBar = document.getElementById("progressBar");
        const progress = (completedProblems.size / problems.length) * 100;
        progressBar.style.width = `${progress}%`;
      }

      function updateButtons() {
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        prevBtn.disabled = currentProblem === 0;

        // 次の問題ボタンは現在の問題が完了している場合のみ有効
        const isCurrentProblemCompleted = completedProblems.has(currentProblem);
        nextBtn.disabled = !isCurrentProblemCompleted;

        // 最後の問題で全問題完了時はボタンテキストを変更
        if (
          currentProblem === problems.length - 1 &&
          completedProblems.size === problems.length
        ) {
          nextBtn.textContent = "結果を見る";
        } else {
          nextBtn.textContent = "次の問題";
        }
      }

      function previousProblem() {
        if (currentProblem > 0) {
          currentProblem--;
          displayProblem(currentProblem);
          updateButtons();
        }
      }

      function nextProblem() {
        if (currentProblem < problems.length - 1) {
          currentProblem++;
          displayProblem(currentProblem);
          updateButtons();
        } else if (completedProblems.size === problems.length) {
          // 全問題完了時は完了画面を表示
          showCompletion();
        }
      }

      // 答えをすべて入れる（「答えを見る」と、完成ずみの問題にもどったとき）
      function fillAnswers() {
        document.querySelectorAll("#problemContainer .ans").forEach((el) => {
          if (el.classList.contains("correct")) return;
          const alts = el.dataset.ans.split("|");
          if (el.tagName === "BUTTON") {
            el.textContent = labelOf(el.dataset.kind, alts[0]);
          } else {
            let v = alts[0];
            if (el.dataset.pair) {
              const used = Array.from(
                document.querySelectorAll(
                  `#problemContainer [data-pair="${el.dataset.pair}"].correct`,
                ),
              ).map((o) => nz(o.value));
              v = alts.find((a) => !used.includes(a)) || alts[0];
            }
            el.value = v.replace(/-/g, "−");
          }
          el.classList.remove("incorrect");
          el.classList.add("correct");
          el.disabled = true;
        });
      }

      function showAnswers() {
        closePicker();
        if (!completedProblems.has(currentProblem))
          shownSet.add(currentProblem);
        document.querySelector('#formulaApp [data-act="show"]')?.click();
        formulaReady = true;
        document.getElementById("tableStage").hidden = false;
        fillAnswers();
        completedProblems.add(currentProblem);
        showSummary(currentProblem);
        updateProgress();
        updateButtons();
      }

      function resetProblem() {
        closePicker();
        completedProblems.delete(currentProblem);
        displayProblem(currentProblem);
        updateProgress();
        updateButtons();
      }

      function showCompletion() {
        const completionMessage = document.getElementById("completionMessage");
        const n = problems.length;
        const self = n - shownSet.size;
        let clean = 0;
        for (let i = 0; i < n; i++)
          if (!shownSet.has(i) && !missCount[i]) clean++;

        let msg;
        if (clean === n)
          msg = "全問ミスなし！増減表の作り方がしっかり身についています。";
        else if (self === n)
          msg =
            "ぜんぶ自力で完成！まちがえたところ（符号・値・極大／極小）をもう一度たしかめておこう。";
        else
          msg =
            "「答えを見る」を使った問題は、リセットしてもう一度自分で解いてみよう。";
        document.querySelector("#completion h2").textContent =
          clean === n ? " 全問ミスなし！" : " おつかれさま！";
        completionMessage.innerHTML =
          `<div class="final-score">自力で完成 ${self} / ${n} 問</div>` +
          `<div class="sub-score">そのうちミスなし ${clean} 問</div>` +
          msg;

        const nextMode = { basic: "random", random: "advanced" }[currentMode];
        const names = {
          basic: "基本モード",
          random: "ランダムモード",
          advanced: "発展問題モード",
        };
        document.getElementById("completionNav").innerHTML =
          (nextMode
            ? `<button class="next" onclick="startMode('${nextMode}')">次は「${names[nextMode]}」へ ▶</button>`
            : "") +
          `<button class="again" onclick="startMode('${currentMode}')">同じモードでもう一度</button>` +
          '<button class="plain" onclick="backToModeSelection()">モードをえらび直す</button>' +
          '<a href="../index.html">ほかの教材をえらぶ</a>';
        window.scrollTo(0, 0);
        document.getElementById("completion").style.display = "block";
        document.getElementById("problemContainer").style.display = "none";
        document.querySelector(".controls").style.display = "none";
      }

      function handleButtonKey(event, callback) {
        if (event.key === "Enter") {
          event.preventDefault();
          callback();
        }
      }

      let formulaAPI = null,
        formulaReady = false;
      function mountFormula(problem, index) {
        const source = problem.derivative + "<br>" + problem.hint;
        const box = document.createElement("div");
        box.innerHTML = source;
        box
          .querySelectorAll("span[style]")
          .forEach((e) => e.removeAttribute("style"));
        let rows = box.innerHTML
          .replace(
            /<input\b[^>]*data-answer=['"]([^'"]+)['"][^>]*>/g,
            (_, v) => "[" + v.replace(/-/g, "−") + "]",
          )
          .replace(/<br\s*\/?\s*>/g, "\n")
          .replace(/<[^>]+>/g, "")
          .replace(/'/g, "′")
          .replace(/-/g, "−")
          .split("\n")
          .map((s) => s.trim())
          .filter(Boolean);
        rows = rows.map((s, ri) => {
          let n = 0;
          const blanks = (s.match(/\[/g) || []).length,
            keep = Math.min(index + 1, blanks);
          return {
            t: s.replace(/\[([^\]]+)\]/g, (all, v) =>
              ++n > blanks - keep ? all : v,
            ),
            h:
              ri === 0
                ? "1項ずつ微分しよう。定数の微分は0。"
                : s.includes("解は")
                  ? "因数のどちらかが0になる x を求めよう。"
                  : "共通因数をくくり、かけて元の式になるか確かめよう。",
          };
        });
        const used = [
          ...new Set(
            rows.flatMap((r) =>
              [...r.t.matchAll(/\[([^\]]+)\]/g)].map((m) => m[1]),
            ),
          ),
        ];
        const ds = ["8", "11", "−5", "7"]
          .filter((v) => !used.includes(v))
          .slice(0, 2)
          .map((v) => [v, "微分した係数や、因数分解の符号を確かめよう。"]);
        const cards =
          index === 0
            ? [...used, ...ds]
            : [...used.slice(0, 1), ds[0], ...used.slice(1), ds[1]];
        rows.unshift({
          t: "! (xⁿ)′ = n xⁿ⁻¹　定数の微分は 0",
          h: "n は正の整数です。",
        });
        formulaReady = false;
        formulaAPI = FillSteps.mount({
          el: "#formulaApp",
          problems: [
            {
              q: "微分して、増減表に必要な値を求めよう。",
              rows,
              cards,
              ans: "途中式が完成。続いて増減表をうめよう。",
            },
          ],
          after: (root, p, state) => {
            formulaReady = state.done || state.shown;
            root.classList.toggle("formula-complete", formulaReady);
            document.getElementById("stepsToggle").hidden = !formulaReady;
            document.getElementById("showAnswersBtn").hidden = !formulaReady;
            if (state.shown && !completedProblems.has(index))
              shownSet.add(index);
            if (state.miss)
              missCount[currentProblem] = Math.max(
                missCount[currentProblem] || 0,
                state.miss,
              );
            const table = document.getElementById("tableStage");
            if (table) table.hidden = !formulaReady;
            if (formulaReady) checkProblemCompletion(currentProblem);
          },
        });
        if (completedProblems.has(index)) {
          document.querySelector('#formulaApp [data-act="show"]')?.click();
          formulaReady = true;
        }
      }
      function toggleSteps() {
        const open = document
          .getElementById("formulaApp")
          .classList.toggle("show-completed");
        const b = document.getElementById("stepsToggle");
        b.textContent = open ? "途中式を閉じる" : "途中式を確認";
        b.setAttribute("aria-expanded", String(open));
      }
      function tableHint() {
        const el = document.getElementById("tableHint");
        el.hidden = !el.hidden;
      }
      function closePicker() {
        document.getElementById("pickPanel")?.replaceChildren();
        document
          .querySelectorAll(".picking")
          .forEach((b) => b.classList.remove("picking"));
      }
      function openPicker(btn) {
        if (btn.disabled) return;
        closePicker();
        btn.classList.add("picking");
        const numeric = btn.tagName === "INPUT",
          kind = btn.dataset.kind;
        let options = numeric
          ? [
              [btn.dataset.ans.split("|")[0], btn.dataset.ans.split("|")[0]],
              [
                String(Number(btn.dataset.ans.split("|")[0]) + 1),
                String(Number(btn.dataset.ans.split("|")[0]) + 1),
              ],
              [
                String(Number(btn.dataset.ans.split("|")[0]) - 1),
                String(Number(btn.dataset.ans.split("|")[0]) - 1),
              ],
            ]
          : PICK[kind];
        if (kind === "arrow") options = [...options, ["→", "→ 一定"]];
        options = options
          .map((v, i) => [v, (i + currentProblem + 1) % options.length])
          .sort((a, b) => a[1] - b[1])
          .map((x) => x[0]);
        const panel = document.getElementById("pickPanel");
        panel.innerHTML =
          '<p class="pick-title">' +
          (numeric ? "値を選ぶ・入力する" : PICK_TITLE[kind]) +
          '</p><div class="pick-options">' +
          options
            .map(
              ([v, label]) =>
                '<button class="pick-btn" data-value="' +
                v +
                '">' +
                lessonMath(label) +
                "</button>",
            )
            .join("") +
          '</div><p id="pickMessage" role="status"></p>';
        function answer(v) {
          if (numeric) {
            btn.value = v;
            onNumCommit(btn);
          } else choose(btn, v);
          if (!btn.disabled)
            document.getElementById("pickMessage").textContent =
              "符号・増減・代入した値をもう一度確認しよう。";
          else closePicker();
        }
        panel.querySelectorAll(".pick-btn").forEach((card) => {
          let start = null,
            moved = false;
          card.addEventListener("pointerdown", (e) => {
            start = [e.clientX, e.clientY];
            moved = false;
            card.setPointerCapture(e.pointerId);
          });
          card.addEventListener("pointermove", (e) => {
            if (
              start &&
              Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 8
            )
              moved = true;
          });
          card.addEventListener("pointerup", (e) => {
            if (
              moved &&
              document
                .elementFromPoint(e.clientX, e.clientY)
                ?.closest(".ans") === btn
            )
              answer(card.dataset.value);
            start = null;
          });
          card.addEventListener("click", () => {
            if (!moved) answer(card.dataset.value);
          });
          card.addEventListener("pointercancel", () => {
            start = null;
            moved = false;
          });
        });
      }
      function functionTerms(problem) {
        const s = problem.function
          .replace(/^f\(x\)\s*=\s*/, "")
          .replace(/\s/g, "")
          .replace(/−/g, "-")
          .replace(/²/g, "^2")
          .replace(/³/g, "^3");
        return (s.match(/[+-]?[^+-]+/g) || []).map((t) => {
          const m = t.match(/^([+-]?)(\d*)(x(?:\^(\d+))?)?$/);
          return [
            (m[1] === "-" ? -1 : 1) * Number(m[2] || 1),
            m[3] ? Number(m[4] || 1) : 0,
          ];
        });
      }
      function summaryGraph(problem, index) {
        const terms = functionTerms(problem);
        const f = (x) => terms.reduce((s, [c, n]) => s + c * x ** n, 0);
        const points = [];
        problem.table.x.forEach((v, i) => {
          if (i && v !== "...") {
            const x = Number(
              v === ""
                ? problem.answers[getAnswerKey(index, `t${index}_x_${i}`)]
                : v,
            );
            points.push([x, f(x)]);
          }
        });
        const range = problem.domain
          ? [Number(problem.table.x[1]), Number(problem.table.x.at(-1))]
          : undefined;
        return graphSVG(f, points, [], range);
      }
    </script>
