                    inp.classList.add('arrow-input');
                    inp.placeholder = '↗↘';
                    inp.addEventListener('click', () => { if (!inp.disabled) showArrowSelection(inp, index, inp.id); });
                }
            });
            if (problem.domain) {
                container.querySelector('.table-container').insertAdjacentHTML('afterend', '<p class="slash-note">※ 定義域の端の f′(x) の欄には「/」を入れよう</p>');
            }

            updateStatus();
            updateProgress();

            // 最初の入力欄にフォーカス
            // 【ブラッシュアップ】スマホでは、いきなりキーボードが出ないようにする
            const firstInput = document.querySelector('#problemContainer .formula-input');
            if (firstInput && !isTouch) {
                firstInput.focus();
            }
        }

        function getInputId(problemIndex, row, col) {
            return `t${problemIndex}_${row}_${col}`;   // 【ブラッシュアップ】
        }

        function getAnswerKey(problemIndex, inputId) {
            const parts = inputId.split('_');
            const row = parts[1];
            const col = parseInt(parts[2]);
            const problem = problems[problemIndex];

            let keyIndex = 1;

            if (row === 'x') {
                // x行の入力欄のインデックス（...を除く）
                let inputCount = 0;
                for (let i = 1; i < col; i++) {
                    if (problem.table.x[i] === "") inputCount++;
                }
                keyIndex = inputCount + 1;
            } else if (row === 'fprime') {
                // f'(x)行の入力欄のインデックス
                const xInputCount = problem.table.x.filter(cell => cell === "").length;
                keyIndex = xInputCount + (col - 1) + 1;
            } else if (row === 'f') {
                // f(x)行の入力欄のインデックス
                const xInputCount = problem.table.x.filter(cell => cell === "").length;
                const fprimeInputCount = problem.table.fprime.filter(cell => cell === "").length;
                keyIndex = xInputCount + fprimeInputCount + (col - 1) + 1;
            }

            return keyIndex;
        }

        function handleEnterKey(event, problemIndex) {
            const currentInput = event.target;

            // タブキーの場合は何もしない（通常のタブ移動を許可）
            if (event.key === 'Tab') {
                return;
            }

            // 矢印入力が必要な欄かチェック
            const answerKey = getAnswerKey(problemIndex, currentInput.id);
            const correctAnswer = problems[problemIndex].answers[answerKey];

            // 矢印が正解の場合（基本モードまたは発展モード）
            if (correctAnswer === '↗' || correctAnswer === '↘') {
                event.preventDefault();

                // エンターキーの場合もダイアログを表示
                if (event.key === 'Enter') {
                    const inputId = currentInput.id;
                    showArrowSelection(currentInput, problemIndex, inputId);
                    return;
                }

                // その他のキーの場合もダイアログを表示
                const inputId = currentInput.id;
                showArrowSelection(currentInput, problemIndex, inputId);
                return;
            }



            // 通常の場合は次の入力欄に移動（Enterキーのみ）
            if (event.key === 'Enter') {
                event.preventDefault();
                const allInputs = Array.from(document.querySelectorAll('#problemContainer input'));   // 【ブラッシュアップ】
                const currentIndex = allInputs.indexOf(currentInput);

                if (currentIndex < allInputs.length - 1) {
                    const nextInput = allInputs[currentIndex + 1];
                    if (!nextInput.disabled) {
                        nextInput.focus();
                    }
                }
            }
        }

        function checkAnswer(problemIndex, inputId, value) {
            const problem = problems[problemIndex];
            const answerKey = getAnswerKey(problemIndex, inputId);
            const correctAnswer = problem.answers[answerKey];
            const input = document.getElementById(inputId);

            // スラッシュの場合は/を正解とする
            if ((value === '/' && correctAnswer === '/') || value === correctAnswer) {
                input.classList.remove('incorrect');
                input.classList.add('correct');
                input.disabled = true;

                // 全ての入力が完了したかチェック
                checkProblemCompletion(problemIndex);
            } else if (value !== '' && !(String(correctAnswer).startsWith(value) && value.length < String(correctAnswer).length)) {   // 【ブラッシュアップ】
                input.classList.remove('correct');
                input.classList.add('incorrect');

                // 矢印の場合は0.5秒後にクリアして待機状態にする
                if (correctAnswer === '↗' || correctAnswer === '↘') {
                    setTimeout(() => {
                        input.classList.remove('incorrect');
                        input.value = '';
                        input.focus();
                        // 矢印入力待機状態をマーク
                        input.dataset.awaitingArrow = 'true';
                    }, 500);
                } else {
                    // 0.5秒後に再入力可能にする（2桁以上の数値や負数の場合は値を保持）
                    const typed = value;   // 【ブラッシュアップ】入れ直していたら消さない
                    setTimeout(() => {
                        if (input.disabled || input.value !== typed) return;
                        input.classList.remove('incorrect');
                        input.value = '';
                        if (!isTouch) input.focus();
                    }, 600);
                }
            }
        }

        function showArrowSelection(input, problemIndex, inputId) {
            // 既存のモーダルがあれば削除
            const existingModal = document.getElementById('arrowModal');
            if (existingModal) {
                existingModal.remove();
            }

            const modal = document.createElement('div');
            modal.id = 'arrowModal';
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                display: flex;
                justify-content: center;
                align-items: flex-start;
                padding-top: 150px;
                z-index: 1000;
            `;

            const dialog = document.createElement('div');
            dialog.style.cssText = `
                background: white;
                padding: 30px;
                border-radius: 15px;
                text-align: center;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            `;

            const increaseBtn = document.createElement('button');
            increaseBtn.innerHTML = '↗ 増加';
            increaseBtn.id = 'increaseBtn';
            increaseBtn.style.cssText = `
                background: linear-gradient(135deg, #48bb78, #38a169);
                color: white;
                border: none;
                padding: 15px 30px;
                margin: 10px;
                border-radius: 10px;
                font-size: 1.2em;
                cursor: pointer;
            `;
            increaseBtn.onclick = () => selectArrow('↗', inputId, problemIndex);

            const decreaseBtn = document.createElement('button');
            decreaseBtn.innerHTML = '↘ 減少';
            decreaseBtn.id = 'decreaseBtn';
            decreaseBtn.style.cssText = `
                background: linear-gradient(135deg, #e53e3e, #c53030);
                color: white;
                border: none;
                padding: 15px 30px;
                margin: 10px;
                border-radius: 10px;
                font-size: 1.2em;
                cursor: pointer;
            `;
            decreaseBtn.onclick = () => selectArrow('↘', inputId, problemIndex);

            const title = document.createElement('h3');
            title.innerHTML = '関数の増減を選択してください<br><small>（←→キーでも選択できます）</small>';
            title.style.cssText = 'margin-bottom: 20px; color: #4a5568;';

            // キーボードイベントリスナーを追加
            const keyHandler = (event) => {
                if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    increaseBtn.focus();
                    increaseBtn.style.boxShadow = '0 0 10px rgba(72, 187, 120, 0.5)';
                } else if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    decreaseBtn.focus();
                    decreaseBtn.style.boxShadow = '0 0 10px rgba(229, 62, 62, 0.5)';
                } else if (event.key === 'Enter') {
                    event.preventDefault();
                    if (document.activeElement === increaseBtn) {
                        selectArrow('↗', inputId, problemIndex);
                    } else if (document.activeElement === decreaseBtn) {
                        selectArrow('↘', inputId, problemIndex);
                    }
                }
            };

            document.addEventListener('keydown', keyHandler);
            modal.dataset.keyHandler = 'true';
            modal._keyHandler = keyHandler;   // 【ブラッシュアップ】
            modal.addEventListener('click', e => {
                if (e.target === modal) { document.removeEventListener('keydown', keyHandler); modal.remove(); }
            });

            dialog.appendChild(title);
            dialog.appendChild(increaseBtn);
            dialog.appendChild(decreaseBtn);
            modal.appendChild(dialog);
            document.body.appendChild(modal);

            // 最初のボタンにフォーカス
            increaseBtn.focus();
        }

        function selectArrow(arrow, inputId, problemIndex) {
            const input = document.getElementById(inputId);
            input.value = arrow;
            input.classList.remove('incorrect');

            // 矢印入力待機状態をクリア
            delete input.dataset.awaitingArrow;

            // キーボードイベントリスナーを削除
            const modal = document.getElementById('arrowModal');
            if (modal && modal.dataset.keyHandler) {
                document.removeEventListener('keydown', modal._keyHandler);   // 【ブラッシュアップ】
            }

            // モーダルを削除
            if (modal) {
                modal.remove();
            }

            // 答えをチェック
            checkAnswer(problemIndex, inputId, arrow);
        }

        function checkMaxMin(problemIndex, type, value) {
            const problem = problems[problemIndex];
            if (!problem.maxMin) return;

            const input = document.getElementById(`${type}_${problemIndex}`);
            let correctAnswer = problem.maxMin[type];
            let isCorrect = false;

            // 複数の正解がある場合の処理
            if (type === 'maxX' || type === 'maxX2') {
                const maxX = problem.maxMin.maxX;
                const maxX2 = problem.maxMin.maxX2;
                if (maxX2) {
                    // 順不同で正解を判定
                    isCorrect = (value === maxX || value === maxX2);
                } else {
                    isCorrect = (value === maxX);
                }
            } else if (type === 'minX' || type === 'minX2') {
                const minX = problem.maxMin.minX;
                const minX2 = problem.maxMin.minX2;
                if (minX2) {
                    // 順不同で正解を判定
                    isCorrect = (value === minX || value === minX2);
                } else {
                    isCorrect = (value === minX);
                }
            } else {
                // maxValue, minValueの場合
                isCorrect = (value === correctAnswer);
            }

            // 【ブラッシュアップ】x を 2 つ答える欄に、同じ値を 2 回入れていたらまちがい
            if (isCorrect && /X2?$/.test(type)) {
                const base = type.replace('2', '');
                const other = document.getElementById((type.endsWith('2') ? base : base + '2') + '_' + problemIndex);
                if (other && other.classList.contains('correct') && other.value === value) isCorrect = false;
            }
            const candidates = /^max/.test(type) && /X/.test(type) ? [problem.maxMin.maxX, problem.maxMin.maxX2]
                : /^min/.test(type) && /X/.test(type) ? [problem.maxMin.minX, problem.maxMin.minX2] : [correctAnswer];
            const partial = !isCorrect && candidates.some(c => c && c.startsWith(value) && value.length < c.length);

            if (isCorrect) {
                input.classList.remove('incorrect');
                input.classList.add('correct');
                input.disabled = true;

                // 全ての最大値・最小値が完了したかチェック
                checkProblemCompletion(problemIndex);
            } else if (value !== '' && !partial) {   // 【ブラッシュアップ】
                input.classList.remove('correct');
                input.classList.add('incorrect');

                const typed = value;
                setTimeout(() => {
                    if (input.disabled || input.value !== typed) return;
                    input.classList.remove('incorrect');
                    input.value = '';
                    if (!isTouch) input.focus();
                }, 600);
            }
        }

        function checkProblemCompletion(problemIndex) {
            const problem = problems[problemIndex];

            // 表の入力欄の完了チェック
            const totalAnswers = Object.keys(problem.answers).length;
            const correctInputs = document.querySelectorAll(`input[id^="t${problemIndex}_"].correct`).length;   // 【ブラッシュアップ】

            // 現在の問題の穴埋め入力の完了チェック（問題固有のIDで絞り込み）
            const currentProblemFormulaInputs = document.querySelectorAll('#problemContainer .formula-input');   // 【ブラッシュアップ】
            const correctFormulaInputs = Array.from(currentProblemFormulaInputs).filter(input => input.classList.contains('correct')).length;
            const totalFormulaInputs = currentProblemFormulaInputs.length;

            let requiredAnswers = totalAnswers + totalFormulaInputs;
            let correctAnswers = correctInputs + correctFormulaInputs;

            // 発展問題モードの場合、最大値・最小値も含める
            if (currentMode === 'advanced' && problem.maxMin) {
                let maxMinInputCount;
                if (problem.maxMin.maxX2 && problem.maxMin.minX2) {
                    maxMinInputCount = 6; // 両方に複数のx値がある場合
                } else if (problem.maxMin.maxX2 || problem.maxMin.minX2) {
                    maxMinInputCount = 5; // どちらか一方に複数のx値がある場合
                } else {
                    maxMinInputCount = 4; // 単一のx値の場合
                }
                requiredAnswers += maxMinInputCount;
                const maxMinCorrect = document.querySelectorAll('.max-min-inputs input.correct').length;   // 【ブラッシュアップ】
                correctAnswers += maxMinCorrect;
            }

            // デバッグ用（本番では削除可能）


            if (correctAnswers === requiredAnswers) {
                completedProblems.add(problemIndex);
                updateButtons();

                // 問題完了時の褒めメッセージ
                showProblemCompletionMessage(problemIndex);

                // 全問題完了時は自動移動しない（次の問題ボタンで移動）
            }
        }

        function showProblemCompletionMessage(problemIndex) {
            // 既存のメッセージがあれば削除
            const existingMessage = document.getElementById('problemToast');   // 【ブラッシュアップ】
            if (existingMessage) {
                existingMessage.remove();
            }

            const message = document.createElement('div');
            message.id = 'problemToast';
            message.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, #48bb78, #38a169);
                color: white;
                padding: 30px 40px;
                border-radius: 20px;
                text-align: center;
                font-size: 1.5em;
                font-weight: bold;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                z-index: 1000;
                animation: fadeInOut 2s ease-in-out;
            `;

            message.innerHTML = `🎉 問題${problemIndex + 1}完了！<br>素晴らしいです！`;

            // アニメーションのCSSを追加
            if (!document.getElementById('completionAnimation')) {
                const style = document.createElement('style');
                style.id = 'completionAnimation';
                style.textContent = `
                    @keyframes fadeInOut {
                        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
                        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                        100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
                    }
                `;
                document.head.appendChild(style);
            }

            document.body.appendChild(message);

            // 2秒後にメッセージを削除
            setTimeout(() => {
                if (message && message.parentNode) {
                    message.remove();
                }
            }, 2000);
        }

        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `問題 ${currentProblem + 1}/${problems.length}`;
        }

        function updateProgress() {
            const progressBar = document.getElementById('progressBar');
            const progress = (completedProblems.size / problems.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = currentProblem === 0;

            // 次の問題ボタンは現在の問題が完了している場合のみ有効
            const isCurrentProblemCompleted = completedProblems.has(currentProblem);
            nextBtn.disabled = !isCurrentProblemCompleted;

            // 最後の問題で全問題完了時はボタンテキストを変更
            if (currentProblem === problems.length - 1 && completedProblems.size === problems.length) {
                nextBtn.textContent = '結果を見る';
            } else {
                nextBtn.textContent = '次の問題';
            }
        }

        function previousProblem() {
            if (currentProblem > 0) {
                currentProblem--;
                displayProblem(currentProblem);
                updateButtons();
            }
        }

        function nextProblem() {
            if (currentProblem < problems.length - 1) {
                currentProblem++;
                displayProblem(currentProblem);
                updateButtons();
            } else if (completedProblems.size === problems.length) {
                // 全問題完了時は完了画面を表示
                showCompletion();
            }
        }

        function showAnswers() {
            const problem = problems[currentProblem];

            // 穴埋め入力の答えを表示（最初に処理）
            const formulaInputs = document.querySelectorAll('.formula-input');
            formulaInputs.forEach(input => {
                if (!input.classList.contains('correct')) {
                    const correctAnswer = input.dataset.answer;
                    input.value = correctAnswer;
                    input.classList.add('correct');
                    input.disabled = true;
                }
            });

            // 表の入力欄の答えを表示
            const inputs = document.querySelectorAll(`input[id^="t${currentProblem}_"]`);   // 【ブラッシュアップ】
            inputs.forEach(input => {
                if (!input.classList.contains('correct')) {
                    const answerKey = getAnswerKey(currentProblem, input.id);
                    const correctAnswer = problem.answers[answerKey];
                    input.value = correctAnswer;
                    input.classList.add('correct');
                    input.disabled = true;
                }
            });

            // 発展問題モードの場合、最大値・最小値の答えも表示
            if (currentMode === 'advanced' && problem.maxMin) {
                const maxMinInputs = document.querySelectorAll('.max-min-inputs input');   // 【ブラッシュアップ】
                maxMinInputs.forEach(input => {
                    if (!input.classList.contains('correct')) {
                        const type = input.id.split('_')[0];
                        let correctAnswer = problem.maxMin[type];

                        // 複数の値がある場合は最初の値を表示
                        if (!correctAnswer && (type === 'maxX2' || type === 'minX2')) {
                            if (type === 'maxX2') {
                                correctAnswer = problem.maxMin.maxX2;
                            } else if (type === 'minX2') {
                                correctAnswer = problem.maxMin.minX2;
                            }
                        }

                        if (correctAnswer) {
                            input.value = correctAnswer;
                            input.classList.add('correct');
                            input.disabled = true;
                        }
                    }
                });
            }

            if (!completedProblems.has(currentProblem)) shownSet.add(currentProblem);   // 【ブラッシュアップ】
            completedProblems.add(currentProblem);
            updateProgress();
            updateButtons();

            // 自動で完了画面に移動しない
        }

        function resetProblem() {
            const inputs = document.querySelectorAll(`input[id^="t${currentProblem}_"]`);   // 【ブラッシュアップ】
            inputs.forEach(input => {
                input.value = '';
                input.disabled = false;
                input.classList.remove('correct', 'incorrect');
            });

            // 発展問題モードの場合、最大値・最小値の入力もリセット
            if (currentMode === 'advanced') {
                const maxMinInputs = document.querySelectorAll('.max-min-inputs input');   // 【ブラッシュアップ】
                maxMinInputs.forEach(input => {
                    input.value = '';
                    input.disabled = false;
                    input.classList.remove('correct', 'incorrect');
                });
            }

            // 穴埋め入力もリセット
            const formulaInputs = document.querySelectorAll('.formula-input');
            formulaInputs.forEach(input => {
                input.value = '';
                input.disabled = false;
                input.classList.remove('correct', 'incorrect');
            });

            completedProblems.delete(currentProblem);
            updateProgress();
            updateButtons();

            // 最初の入力欄にフォーカス
            const firstFormulaInput = document.querySelector('.formula-input');
            if (firstFormulaInput) {
                firstFormulaInput.focus();
            } else if (inputs.length > 0) {
                inputs[0].focus();
            }
        }

        function showCompletion() {
            const completionMessage = document.getElementById('completionMessage');

            // モードに応じて完了メッセージを変更
            if (currentMode === 'basic') {
                completionMessage.innerHTML = `全5問を完璧に解きました！<br>あなたは微分と増減表の真のマスターです！<br><br>🌟 素晴らしい集中力と数学的思考力を発揮されました！ 🌟<br>この調子で数学の学習を続けてください！`;
            } else if (currentMode === 'random') {
                completionMessage.innerHTML = `ランダム3問を完璧に解きました！<br>様々な問題に対応できる実力を証明しました！<br><br>🎲 どんな問題が出ても大丈夫ですね！ 🎲<br>さらなる挑戦を続けてください！`;
            } else if (currentMode === 'advanced') {
                completionMessage.innerHTML = `発展問題4問を全て完璧に解きました！<br>定義域がある複雑な問題もマスターしました！<br><br>🚀 最大値・最小値まで完璧です！ 🚀<br>あなたは真の数学エキスパートです！`;
            }

            // 【ブラッシュアップ】
            const self = problems.length - shownSet.size;
            document.querySelector('#completion h2').textContent = shownSet.size ? '👍 おつかれさま！' : '🎊 本当におめでとうございます！ 🎊';
            completionMessage.innerHTML = `<div class="final-score">自力で完成 ${self} / ${problems.length} 問</div>` +
                (shownSet.size ? '「答えを見る」を使った問題も、リセットしてもう一度自分で解いてみよう！' : completionMessage.innerHTML);
            const nextMode = { basic: 'random', random: 'advanced' }[currentMode];
            const names = { basic: '基本モード', random: 'ランダムモード', advanced: '発展問題モード' };
            document.getElementById('completionNav').innerHTML =
                (nextMode ? `<button class="next" onclick="startMode('${nextMode}')">次は「${names[nextMode]}」へ ▶</button>` : '') +
                `<button class="again" onclick="startMode('${currentMode}')">同じモードでもう一度</button>` +
                '<button class="plain" onclick="backToModeSelection()">モードをえらび直す</button>' +
                '<a href="../remake.html">ほかの教材をえらぶ</a>';
            window.scrollTo(0, 0);
            document.getElementById('completion').style.display = 'block';
            document.getElementById('problemContainer').style.display = 'none';
            document.querySelector('.controls').style.display = 'none';
        }

        function handleButtonKey(event, callback) {
            if (event.key === 'Enter') {
                event.preventDefault();
                callback();
            }
        }

        // 穴埋め入力の判定機能
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('formula-input')) {
                const input = e.target;
                const correctAnswer = input.dataset.answer;
                const userAnswer = input.value.trim();

                if (userAnswer === correctAnswer) {
                    input.classList.remove('incorrect');
                    input.classList.add('correct');
                    input.disabled = true;
                    checkProblemCompletion(currentProblem);   // 【ブラッシュアップ】
                } else if (userAnswer !== '' && !(correctAnswer.startsWith(userAnswer) && userAnswer.length < correctAnswer.length)) {   // 【ブラッシュアップ】
                    input.classList.remove('correct');
                    input.classList.add('incorrect');

                    const typed = input.value;
                    setTimeout(() => {
                        if (input.disabled || input.value !== typed) return;
                        input.classList.remove('incorrect');
                        input.value = '';
                        if (!isTouch) input.focus();
                    }, 600);
                }
            }
        });

    </script>
 <script>
  // 【デザイン統一】元の部品に、共通デザインのクラスを付ける
  PortTheme.map({
    ".container": "u-card",
