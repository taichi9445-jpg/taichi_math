<script>
const md = s => FillSteps.md(s), { num, parse, polyS, minus, plus, add, sub, neg, mul, lim, paren, val, evalRows, cleanCards, nearValues, fig, mono, join, times, shuffle, uniq } = Sek;
const M = '−';

// 式の空欄（単項式のカード）。ts が 2 項以上なら ( ) をつける
function grp(ts) {

const limPB = (a, b) => [[num([b + 1, 1]), num([b - 1, 1])], [num([a - 1, 1]), num([a + 1, 1])]];

// ---- 図 ----

    xs: [a, b].map((x, i) => ({ x, label: lab(x, i), y: val(U, x), below: Math.min(val(L, a), val(L, b)) >= -0.01, dx: x === 0 ? 9 : 0 })).filter(m => o.hide || m.x !== 0), noLabel: o.noLabel });
}
const shiftX = (ts, h) => { let o = []; ts.forEach(t => { let term = [{ r: t.r, p: 0 }]; for (let i = 0; i < t.p; i++) term = times(term, [{ r: [1, 1], p: 1 }, { r: [-h, 1], p: 0 }]); o = plus(o, term); }); return o; };

const up1 = (ts, k) => plus(ts, [{ r: [k, 1], p: 0 }]);
// 問題文に合う図と、まちがいの図
function figChoices(s) {
  const list = s.ts
    ? [{ ts: flip(s.ts), a: s.a, b: s.b }, { ts: mirror(s.ts), a: -s.b, b: -s.a }, { ts: shiftX(s.ts, 1), a: s.a + 1, b: s.b + 1 }, { ts: s.ts, a: s.a, b: s.b + 1 }, { ts: up1(s.ts, 2), a: s.a, b: s.b }]

  const key = x => JSON.stringify([x.ts || [x.U, x.L], x.a, x.b]), seen = new Set([key(s)]);

  const all = [s, ...wrong], cs = all.flatMap(x => (x.ts ? [x.ts] : [x.U, x.L])), g = range(cs, all.flatMap(x => [x.a, x.b]));

// ---- 面積の問題 ----
function area(q) {

    }

    wrongVals = [neg(e.ans), e.Fb, add(e.ans, [1, 1])];

    cards.push(num([c, 1]), [num([c + 1, 1]), polyS(ts) + ' = 0 を解こう。'], [num([c - 1, 1]), polyS(ts) + ' = 0 を解こう。'], ...e1.cards, ...e2.cards, num(value), [num(sub(e1.ans, e2.ans)), '面積はどちらも正の値でたします。']);
    wrongVals = [sub(e1.ans, e2.ans), sub(e2.ans, e1.ans), e1.ans, e2.ans];

  } else {

      const eq = d[0].r[0] < 0 ? flip(d) : d, k = eq[0].r[0];

        { t: 'x = [' + num([a, 1]) + '], [' + num([b, 1]) + ']', h: 'かけて 0 になるのは、どちらかが 0 のときです。' });

    rows.push('#（上のグラフの式）−（下のグラフの式）を積分する',
      { t: 'S = ∫' + LIMB(a, b) + ' (' + gu.s + ' − ' + gl.s + ') dx', pb: [...limPB(a, b), ...gu.pb, ...gl.pb], h: '図で、斜線の部分の上にあるグラフの式から、下にあるグラフの式をひきます。' },
      { t: '= ∫' + lim(b, a) + ' ' + gd.s + ' dx', pb: gd.pb, h: 'かっこをはずして、まとめよう。' });

const LEVELS = [
  { name: 'x 軸より上', sub: '1次関数から放物線へ', list: [{ type: 'above', f: 'x', a: 0, b: 2 }, { type: 'above', f: 'x+1', a: 0, b: 2 }, { type: 'above', f: 'x²', a: 0, b: 2 }, { type: 'above', f: 'x²+1', a: 1, b: 2 }, { type: 'axis', f: '-x²+4x' }, { type: 'axis', f: '-x²+2x+3' }, { type: 'above', f: 'x³', a: 0, b: 2 }] },
  { name: 'x 軸より下', sub: '− をつけて積分する', list: [{ type: 'below', f: 'x-3', a: 0, b: 2 }, { type: 'below', f: '-x-1', a: 0, b: 2 }, { type: 'below', f: 'x²-4', a: -1, b: 1 }, { type: 'axis', f: 'x²-2x' }, { type: 'axis', f: 'x²-3x' }, { type: 'axis', f: 'x²-1' }, { type: 'below', f: 'x³-1', a: -1, b: 1 }] },
  { name: 'x 軸をまたぐ', sub: '2 つに分けて積分する', list: [{ type: 'cross', f: 'x-1', a: 0, c: 1, b: 3 }, { type: 'cross', f: 'x-2', a: 0, c: 2, b: 4 }, { type: 'cross', f: 'x²-1', a: 0, c: 1, b: 2 }, { type: 'cross', f: 'x²-4', a: 0, c: 2, b: 3 }, { type: 'cross', f: 'x³-x', a: 0, c: 1, b: 2 }] },
  { name: '2 つのグラフ', sub: '上の式 − 下の式', list: [{ type: 'between', up: 'x+2', low: 'x²', a: 0, b: 1 }, { type: 'meet', up: 'x', low: 'x²' }, { type: 'meet', up: 'x+2', low: 'x²' }, { type: 'meet', up: '4', low: 'x²' }, { type: 'meet', up: '8-x²', low: 'x²' }, { type: 'between', up: 'x', low: 'x³', a: 0, b: 1 }] }

const ALL = LEVELS.flatMap(l => l.list);
const degree = q => Math.max(...[q.f, q.up, q.low].filter(Boolean).map(s => parse(s)[0].p));
// 1次 → 2次 → 3次の順。3次は最後の数問だけ
const byDegree = (n1, n2, n3) => [[1, n1], [2, n2], [3, n3]].flatMap(([d, n]) => shuffle(ALL.filter(q => degree(q) === d)).slice(0, n));
function randomQ() {

  return Sek.pick([() => ({ type: 'axis', f: `x²${s ? tx(-s) + 'x' : ''}${tx(m)}` }), () => ({ type: 'axis', f: `-x²${s ? tx(s) + 'x' : ''}${tx(-m)}` }),

const safeRandom = () => { for (let i = 0; i < 50; i++) { try { const p = area(randomQ()); if (p.value[0] > 0 && p.value[1] < 40) return p; } catch (e) {} } return area(ALL[0]); };

const app = () => document.getElementById('app'), menuEl = () => document.getElementById('menu');
const FORMULA = () => '<div class="sk-formula">' + md('S = ∫{b|a} (上の式 − 下の式) dx') + '<small>' + md('上の式・下の式はグラフの上下。x 軸は y = 0') + '</small></div>';

function quizMode(make, o) { menuEl().innerHTML = ''; const go = () => Sek.quiz(app(), make(), Object.assign({ home: showMenu, again: go }, o)); go(); }
const exprQ = q => { const p = area(q); return { big: '', q: '斜線の部分の面積 S を表す式はどれか。', ans: p.expr, wrong: p.exprWrong, p, fig: figOf(p.spec) }; };

const icon = d => `<svg viewBox="0 0 70 50" width="66" height="47" aria-hidden="true">${d}</svg>`;
const AX = '<path d="M8 44H64M14 48V4" stroke="#5b6470" fill="none"/>';

  fig: icon('<rect x="4" y="6" width="28" height="18" rx="3" fill="#fff" stroke="#b4540a"/><rect x="38" y="6" width="28" height="18" rx="3" fill="#ffe0c2" stroke="#b4540a" stroke-width="2"/><rect x="4" y="28" width="28" height="18" rx="3" fill="#fff" stroke="#b4540a"/><rect x="38" y="28" width="28" height="18" rx="3" fill="#fff" stroke="#b4540a"/>'),

function stepsMenu() {

function showMenu() {
