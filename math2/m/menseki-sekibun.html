  <script>
        const defaultConfig = {
            quiz_title: "定積分と面積の関連クイズ",
            success_message: "素晴らしい！",
            completion_message: "めっちゃめっちゃ素晴らしい！あなたは定積分と面積の関係を完璧に理解しています！本当にお疲れ様でした！🌟"
        };

        const choiceQuestions = [
            {
                text: "【基本】y = x と x軸、x = 0, x = 2 で囲まれた面積を求める定積分はどれですか？",
                graphType: "linear_simple",
                xMin: -1, xMax: 3, yMin: -1, yMax: 3,
                integralMin: 0, integralMax: 2,
                choices: [
                    "∫₀² 2 dx",
                    "∫₀² x dx",
                    "∫₀² x² dx",
                    "∫₀² 1 dx"
                ],
                correct: 1,
                explanation: "y = x と x軸で囲まれた面積は、関数 y = x を積分範囲 [0, 2] で積分します。したがって ∫₀² x dx が正解です。"

            const level4 = inputQuestions.filter(q => q.level === 4);

            const selected = [
                ...level1.sort(() => Math.random() - 0.5).slice(0, 1),
                ...level2.sort(() => Math.random() - 0.5).slice(0, 1),
                ...level3.sort(() => Math.random() - 0.5).slice(0, 2),
                ...level4.sort(() => Math.random() - 0.5).slice(0, 1)
            ];

            currentQuestions = selected;
            currentQuestion = 0;
            missedSet = new Set();   // 【ブラッシュアップ】
            document.getElementById('completion').classList.add('hidden');
            window.scrollTo(0, 0);
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            displayQuestion();
        }

        function startFreeInputMode() {
            currentMode = 'free-input';
            currentQuestions = [];
            const usedProblems = new Set();

            function generateUniqueProblem(level) {
                const templates = freeInputTemplates[`level${level}`];
                let attempts = 0;
                let problem;
                let problemKey;

                do {
                    const template = templates[Math.floor(Math.random() * templates.length)];
                    problemKey = `${level}-${template.func}-${template.lower}-${template.upper}`;

                    if (!usedProblems.has(problemKey)) {
                        problem = generateFreeInputProblem(level);
                        usedProblems.add(problemKey);
                        return problem;
                    }
                    attempts++;
                } while (attempts < 20);

                return problem || generateFreeInputProblem(level);
            }

            currentQuestions.push(generateUniqueProblem(1));
            currentQuestions.push(generateUniqueProblem(2));
            currentQuestions.push(generateUniqueProblem(3));
            currentQuestions.push(generateUniqueProblem(4));
            currentQuestions.push(generateUniqueProblem(5));

            currentQuestion = 0;
            missedSet = new Set();   // 【ブラッシュアップ】
            document.getElementById('completion').classList.add('hidden');
            window.scrollTo(0, 0);
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            displayQuestion();
        }

        function backToModeSelection() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('completion').classList.add('hidden');
            document.getElementById('mode-selection').classList.remove('hidden');
            currentMode = null;
            currentQuestions = [];
            currentQuestion = 0;
        }

        function shuffleChoices(question) {
            const correctAnswer = question.choices[question.correct];
            const shuffled = [...question.choices];

            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const newCorrectIndex = shuffled.indexOf(correctAnswer);

            return {
                choices: shuffled,
                correct: newCorrectIndex
            };
        }

        function formatIntegral(text) {
            return text.replace(/∫₀²/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">0</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">2</sup></span>')
                      .replace(/∫₀¹/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">0</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">1</sup></span>')
                      .replace(/∫₁²/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">1</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">2</sup></span>')
                      .replace(/∫₀³/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">0</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">3</sup></span>')
                      .replace(/∫₁³/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">1</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">3</sup></span>')
                      .replace(/∫₋₁²/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">-1</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">2</sup></span>')
                      .replace(/∫₋₂²/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">-2</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">2</sup></span>')
                      .replace(/∫₀⁴/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">0</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">4</sup></span>')
                      .replace(/∫₂⁴/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">2</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">4</sup></span>')
                      .replace(/∫₂³/g, '<span style="position: relative; display: inline-block;">∫<sub style="position: absolute; left: 100%; bottom: 0.3em; font-size: 0.7em;">2</sub><sup style="position: absolute; left: 100%; top: -0.1em; font-size: 0.7em;">3</sup></span>')
                      .replace(/(\d+x)\s+dx/g, '<span style="margin-left: 0.8em;">$1</span> dx')
                      .replace(/(\d+)\s+dx/g, '<span style="margin-left: 0.8em;">$1 dx</span>')
                      .replace(/(x²)\s+dx/g, '<span style="margin-left: 0.8em;">$1</span> dx')
                      .replace(/(\(.*?\))\s+dx/g, '<span style="margin-left: 0.8em;">$1</span> dx')
                      .replace(/(x)\s+dx/g, '<span style="margin-left: 0.8em;">$1</span> dx');
        }

        function createGraph(question) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("class", "graph-svg");
            svg.setAttribute("viewBox", "0 0 400 280");

            const margin = 40;
            const width = 400 - 2 * margin;
            const height = 280 - 2 * margin;

            const xScale = width / (question.xMax - question.xMin);
            const yScale = height / (question.yMax - question.yMin);

            function toSVGX(x) {
                return margin + (x - question.xMin) * xScale;
            }

            function toSVGY(y) {
                return margin + height - (y - question.yMin) * yScale;
            }

            const xAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
            xAxis.setAttribute("x1", margin);
            xAxis.setAttribute("y1", toSVGY(0));
            xAxis.setAttribute("x2", margin + width);
            xAxis.setAttribute("y2", toSVGY(0));
            xAxis.setAttribute("class", "axis");
            svg.appendChild(xAxis);

            const yAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
            yAxis.setAttribute("x1", toSVGX(0));
            yAxis.setAttribute("y1", margin);
            yAxis.setAttribute("x2", toSVGX(0));
            yAxis.setAttribute("y2", margin + height);
            yAxis.setAttribute("class", "axis");
            svg.appendChild(yAxis);

            const xLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            xLabel.setAttribute("x", margin + width - 10);
            xLabel.setAttribute("y", toSVGY(0) - 10);
            xLabel.setAttribute("class", "axis-label");
            xLabel.textContent = "x";
            svg.appendChild(xLabel);

            const yLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            yLabel.setAttribute("x", toSVGX(0) + 10);
            yLabel.setAttribute("y", margin + 15);
            yLabel.setAttribute("class", "axis-label");
            yLabel.textContent = "y";
            svg.appendChild(yLabel);

            const leftBoundary = document.createElementNS("http://www.w3.org/2000/svg", "line");
            leftBoundary.setAttribute("x1", toSVGX(question.integralMin));
            leftBoundary.setAttribute("y1", margin);
            leftBoundary.setAttribute("x2", toSVGX(question.integralMin));
            leftBoundary.setAttribute("y2", margin + height);
            leftBoundary.setAttribute("class", "boundary-line");
            svg.appendChild(leftBoundary);

            const rightBoundary = document.createElementNS("http://www.w3.org/2000/svg", "line");
            rightBoundary.setAttribute("x1", toSVGX(question.integralMax));
            rightBoundary.setAttribute("y1", margin);
            rightBoundary.setAttribute("x2", toSVGX(question.integralMax));
            rightBoundary.setAttribute("y2", margin + height);
            rightBoundary.setAttribute("class", "boundary-line");
            svg.appendChild(rightBoundary);

            if (question.graphType === "parabola2" || question.graphType === "linear_mixed1") {
                const middleBoundary = document.createElementNS("http://www.w3.org/2000/svg", "line");
                middleBoundary.setAttribute("x1", toSVGX(1));
                middleBoundary.setAttribute("y1", margin);
                middleBoundary.setAttribute("x2", toSVGX(1));
                middleBoundary.setAttribute("y2", margin + height);
                middleBoundary.setAttribute("class", "boundary-line");
                svg.appendChild(middleBoundary);
            } else if (question.graphType === "linear_mixed2" || question.graphType === "linear_mixed3" || question.graphType === "parabola_mixed1") {
                const middleBoundary = document.createElementNS("http://www.w3.org/2000/svg", "line");
                middleBoundary.setAttribute("x1", toSVGX(2));
                middleBoundary.setAttribute("y1", margin);
                middleBoundary.setAttribute("x2", toSVGX(2));
                middleBoundary.setAttribute("y2", margin + height);
                middleBoundary.setAttribute("class", "boundary-line");
                svg.appendChild(middleBoundary);
            }

            function getYValue(x, funcType, isSecond = false) {
                // 【ブラッシュアップ】問題の式があれば、その式でかく
                if (question.fn1 && funcType.startsWith('between')) return Function('x', 'return ' + (isSecond ? question.fn2 : question.fn1))(x);
                if (question.fn && !funcType.startsWith('between')) return Function('x', 'return ' + question.fn)(x);
                switch (funcType) {
                    case "linear_simple":
                        return isSecond ? 2 * x : x;
                    case "parabola":
                        return x * x;
                    case "linear1":
                        return x + 1;
                    case "linear_mixed1":
                        return x - 1;
                    case "linear_mixed2":
                        return x - 2;
                    case "linear_mixed3":
                        return 2 * x - 4;
                    case "parabola2":
                        return x * x - 1;
                    case "parabola_mixed1":
                        return x * x - 4;
                    case "between_curves1":
                        return isSecond ? x * x : x;
                    case "between_curves2":
                        return isSecond ? x * x : 8 - x * x;
                    case "between_curves_new":
                        return isSecond ? x * x : x + 2;
                    case "between_curves_4":
                        return isSecond ? x * x : 4;
                    default:
                        return 0;
                }
            }

            if (question.graphType === "parabola2" || question.graphType === "linear_mixed1") {
                const splitPoint = 1;

                let negAreaData = `M ${toSVGX(question.integralMin)} ${toSVGY(0)}`;
                for (let i = 0; i <= 50; i++) {
                    const x = question.integralMin + (splitPoint - question.integralMin) * i / 50;
                    const y = getYValue(x, question.graphType);
                    negAreaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }
                negAreaData += ` L ${toSVGX(splitPoint)} ${toSVGY(0)} Z`;

                const negArea = document.createElementNS("http://www.w3.org/2000/svg", "path");
                negArea.setAttribute("d", negAreaData);
                negArea.setAttribute("class", "area-fill");
                svg.appendChild(negArea);

                let posAreaData = `M ${toSVGX(splitPoint)} ${toSVGY(0)}`;
                for (let i = 0; i <= 50; i++) {
                    const x = splitPoint + (question.integralMax - splitPoint) * i / 50;
                    const y = getYValue(x, question.graphType);
                    posAreaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }
                posAreaData += ` L ${toSVGX(question.integralMax)} ${toSVGY(0)} Z`;

                const posArea = document.createElementNS("http://www.w3.org/2000/svg", "path");
                posArea.setAttribute("d", posAreaData);
                posArea.setAttribute("class", "area-fill");
                svg.appendChild(posArea);

            } else if (question.graphType === "linear_mixed2" || question.graphType === "linear_mixed3" || question.graphType === "parabola_mixed1") {
                const splitPoint = 2;

                let negAreaData = `M ${toSVGX(question.integralMin)} ${toSVGY(0)}`;
                for (let i = 0; i <= 100; i++) {
                    const x = question.integralMin + (splitPoint - question.integralMin) * i / 100;
                    const y = getYValue(x, question.graphType);
                    negAreaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }
                negAreaData += ` L ${toSVGX(splitPoint)} ${toSVGY(0)} Z`;

                const negArea = document.createElementNS("http://www.w3.org/2000/svg", "path");
                negArea.setAttribute("d", negAreaData);
                negArea.setAttribute("class", "area-fill");
                svg.appendChild(negArea);

                let posAreaData = `M ${toSVGX(splitPoint)} ${toSVGY(0)}`;
                for (let i = 0; i <= 100; i++) {
                    const x = splitPoint + (question.integralMax - splitPoint) * i / 100;
                    const y = getYValue(x, question.graphType);
                    posAreaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }
                posAreaData += ` L ${toSVGX(question.integralMax)} ${toSVGY(0)} Z`;

                const posArea = document.createElementNS("http://www.w3.org/2000/svg", "path");
                posArea.setAttribute("d", posAreaData);
                posArea.setAttribute("class", "area-fill");
                svg.appendChild(posArea);

            } else if (question.graphType.startsWith("between_curves")) {
                let areaData = `M ${toSVGX(question.integralMin)}`;
                const startY = getYValue(question.integralMin, question.graphType, true);
                areaData += ` ${toSVGY(startY)}`;

                for (let i = 0; i <= 100; i++) {
                    const x = question.integralMin + (question.integralMax - question.integralMin) * i / 100;
                    const y = getYValue(x, question.graphType, true);
                    areaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }

                for (let i = 100; i >= 0; i--) {
                    const x = question.integralMin + (question.integralMax - question.integralMin) * i / 100;
                    const y = getYValue(x, question.graphType, false);
                    areaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }
                areaData += " Z";

                const area = document.createElementNS("http://www.w3.org/2000/svg", "path");
                area.setAttribute("d", areaData);
                area.setAttribute("class", "area-fill");
                svg.appendChild(area);

            } else {
                let areaData = `M ${toSVGX(question.integralMin)} ${toSVGY(0)}`;
                for (let i = 0; i <= 100; i++) {
                    const x = question.integralMin + (question.integralMax - question.integralMin) * i / 100;
                    const y = getYValue(x, question.graphType);
                    areaData += ` L ${toSVGX(x)} ${toSVGY(y)}`;
                }
                areaData += ` L ${toSVGX(question.integralMax)} ${toSVGY(0)} Z`;

                const area = document.createElementNS("http://www.w3.org/2000/svg", "path");
                area.setAttribute("d", areaData);
                area.setAttribute("class", "area-fill");
                svg.appendChild(area);
            }

            const steps = 200;
            const dx = (question.xMax - question.xMin) / steps;
            let pathData = "";
            for (let i = 0; i <= steps; i++) {
                const x = question.xMin + i * dx;
                const y = getYValue(x, question.graphType, false);
                const svgX = toSVGX(x);
                const svgY = toSVGY(y);
                pathData += (i === 0 ? `M ${svgX} ${svgY}` : ` L ${svgX} ${svgY}`);
            }

            const curve = document.createElementNS("http://www.w3.org/2000/svg", "path");
            curve.setAttribute("d", pathData);
            curve.setAttribute("class", "function-curve");
            svg.appendChild(curve);

            if (question.graphType.startsWith("between_curves")) {
                let pathData2 = "";
                for (let i = 0; i <= steps; i++) {
                    const x = question.xMin + i * dx;
                    const y = getYValue(x, question.graphType, true);
                    const svgX = toSVGX(x);
                    const svgY = toSVGY(y);
                    pathData2 += (i === 0 ? `M ${svgX} ${svgY}` : ` L ${svgX} ${svgY}`);
                }

                const curve2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
                curve2.setAttribute("d", pathData2);
                curve2.setAttribute("class", "function-curve");
                curve2.setAttribute("style", "stroke: #e53e3e;");
                svg.appendChild(curve2);
            }

            return svg;
        }

        function checkInputsAutomatic() {
            if (currentMode !== 'input') return;

            document.getElementById('question-text').classList.remove('correct-answer', 'incorrect-answer');

            const question = currentQuestions[currentQuestion];

            if (!question.answer.secondIntegral) {
                const lowerBound1 = document.getElementById('lower-bound-1').value.trim();
                const upperBound1 = document.getElementById('upper-bound-1').value.trim();

                if (lowerBound1 && upperBound1 && selectedOperator1) {
                    checkInputAnswer();
                }
            } else {
                const lowerBound1 = document.getElementById('lower-bound-1').value.trim();
                const upperBound1 = document.getElementById('upper-bound-1').value.trim();
                const lowerBound2 = document.getElementById('lower-bound-2').value.trim();
                const upperBound2 = document.getElementById('upper-bound-2').value.trim();

                if (lowerBound1 && upperBound1 && lowerBound2 && upperBound2 && selectedOperator1 && selectedOperator2) {
                    checkInputAnswer();
                }
            }
        }

        function checkIntegralMatch(userInput, correctAnswer) {
            // 【ブラッシュアップ】全角の数字・マイナスを半角にそろえる
            const nz = v => String(v).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[ー－−―‐]/g, '-').replace(/\s/g, '');
            userInput = Object.fromEntries(Object.entries(userInput).map(([k, v]) => [k, nz(v)]));
            if (!correctAnswer.secondIntegral) {
                return (
                    userInput.lowerBound1 === correctAnswer.lowerBound &&
                    userInput.upperBound1 === correctAnswer.upperBound &&
                    userInput.operator1 === correctAnswer.operator
                );
            }

            const order1Match = (
                userInput.lowerBound1 === correctAnswer.lowerBound &&
                userInput.upperBound1 === correctAnswer.upperBound &&
                userInput.operator1 === correctAnswer.operator &&
                userInput.lowerBound2 === correctAnswer.secondIntegral.lowerBound &&
                userInput.upperBound2 === correctAnswer.secondIntegral.upperBound &&
                userInput.operator2 === correctAnswer.secondIntegral.operator
            );

            const order2Match = (
                userInput.lowerBound1 === correctAnswer.secondIntegral.lowerBound &&
                userInput.upperBound1 === correctAnswer.secondIntegral.upperBound &&
                userInput.operator1 === correctAnswer.secondIntegral.operator &&
                userInput.lowerBound2 === correctAnswer.lowerBound &&
                userInput.upperBound2 === correctAnswer.upperBound &&
                userInput.operator2 === correctAnswer.operator
            );

            return order1Match || order2Match;
        }

        function buildIntegralInputs(question) {
            const container = document.getElementById('integral-builder-container');
            container.innerHTML = '';

            selectedOperator1 = null;
            selectedOperator2 = null;

            const firstIntegralHTML = `
                <div style="display: flex; flex-direction: column; align-items: center;">
                    <input type="text" id="operator-input-1" class="operator-direct-input" maxlength="1" placeholder="?" oninput="handleOperatorInput(1)">
                    <span class="operator-hint">+か-を入れるよ</span>
                </div>
                <div class="integral-wrapper">
                    <span class="integral-symbol">∫</span>
                    <input type="text" id="lower-bound-1" class="bound-input bound-lower" placeholder="下限" oninput="checkInputsAutomatic()">
                    <input type="text" id="upper-bound-1" class="bound-input bound-upper" placeholder="上限" oninput="checkInputsAutomatic()">
                </div>
                <span class="dx-label" id="function-display-1" style="margin-left: 20px;">${formatFunctionDisplay(question.answer.function)}</span>
                <span class="dx-label">dx</span>
            `;

            container.innerHTML = firstIntegralHTML;

            if (question.answer.secondIntegral) {
                const secondIntegralHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; margin-left: 15px;">
                        <input type="text" id="operator-input-2" class="operator-direct-input" maxlength="1" placeholder="?" oninput="handleOperatorInput(2)">
                        <span class="operator-hint">+か-を入れるよ</span>
                    </div>
                    <div class="integral-wrapper">
                        <span class="integral-symbol">∫</span>
                        <input type="text" id="lower-bound-2" class="bound-input bound-lower" placeholder="下限" oninput="checkInputsAutomatic()">
                        <input type="text" id="upper-bound-2" class="bound-input bound-upper" placeholder="上限" oninput="checkInputsAutomatic()">
                    </div>
                    <span class="dx-label" id="function-display-2" style="margin-left: 20px;">${formatFunctionDisplay(question.answer.secondIntegral.function)}</span>
                    <span class="dx-label">dx</span>
                `;

                container.innerHTML += secondIntegralHTML;
            }
            // 【ブラッシュアップ】

                group.className = 'int-group';

        function displayQuestion() {
            const question = currentQuestions[currentQuestion];

            let questionText = question.text;
            if (currentMode === 'input' && question.level) {
                const levelClass = `level-${question.level > 3 ? 3 : question.level}`;
                const levelText = question.level === 1 ? '基本' : question.level === 2 ? '応用' : question.level === 3 ? '発展' : '最高難度';
                questionText = question.text + ` <span class="level-badge ${levelClass}">レベル${question.level}・${levelText}</span>`;
            }

            document.getElementById('question-number').textContent = `問題 ${currentQuestion + 1}`;
            window.scrollTo(0, 0);   // 【ブラッシュアップ】
            document.getElementById('question-text').innerHTML = questionText;
            document.getElementById('question-text').classList.remove('correct-answer', 'incorrect-answer');
            document.getElementById('progress-text').textContent = `問題 ${currentQuestion + 1} / ${currentQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${(currentQuestion / currentQuestions.length) * 100}%`;

            const graphArea = document.getElementById('graph-area');
            graphArea.innerHTML = '';
            graphArea.appendChild(createGraph(question));

            graphArea.classList.add('hidden');
            document.getElementById('hint-btn').style.display = 'inline-block';
            document.getElementById('hint-btn').textContent = '💡 ヒント（図を表示）';

            if (currentMode === 'choice') {
                document.getElementById('choice-container').classList.remove('hidden');
                document.getElementById('input-container').classList.add('hidden');
                document.getElementById('free-input-container').classList.add('hidden');

                const shuffled = shuffleChoices(question);
                const choicesContainer = document.getElementById('choices');
                choicesContainer.innerHTML = '';

                shuffled.choices.forEach((choice, index) => {
                    const choiceElement = document.createElement('div');
                    choiceElement.className = 'choice';
                    choiceElement.innerHTML = formatIntegral(choice);
                    choiceElement.onclick = () => selectChoice(index);
                    choicesContainer.appendChild(choiceElement);
                });

                currentQuestions[currentQuestion].shuffledCorrect = shuffled.correct;

            } else if (currentMode === 'input') {
                document.getElementById('choice-container').classList.add('hidden');
                document.getElementById('free-input-container').classList.add('hidden');
                document.getElementById('input-container').classList.remove('hidden');

                buildIntegralInputs(question);

                setTimeout(() => {
                    const firstOperatorInput = document.getElementById('operator-input-1');
                    if (firstOperatorInput && !isTouch) {   // 【ブラッシュアップ】
                        firstOperatorInput.focus();
                    }
                }, 100);

            } else if (currentMode === 'free-input') {
                document.getElementById('choice-container').classList.add('hidden');
                document.getElementById('input-container').classList.add('hidden');
                document.getElementById('free-input-container').classList.remove('hidden');

                const answerDisplayArea = document.getElementById('answer-display-area');
                const question = currentQuestions[currentQuestion];

                if (question.answer.denominator === 1) {
                    answerDisplayArea.innerHTML = '<input type="text" id="area-answer-integer" class="fraction-part-input" placeholder="答え" oninput="checkFreeInputAutomatic()" style="width: 140px;">';
                } else {
                    answerDisplayArea.innerHTML = `
                        <div class="fraction-input-container">
                            <input type="text" id="area-answer-numerator" class="fraction-part-input" placeholder="分子" oninput="checkFreeInputAutomatic()">
                            <div class="fraction-divider"></div>
                            <input type="text" id="area-answer-denominator" class="fraction-part-input" placeholder="分母" oninput="checkFreeInputAutomatic()">
                        </div>
                    `;
                }

                document.getElementById('show-answer-btn').style.display = 'inline-block';

                setTimeout(() => {
                    const firstInput = question.answer.denominator === 1
                        ? document.getElementById('area-answer-integer')
                        : document.getElementById('area-answer-numerator');
                    if (firstInput && !isTouch) {   // 【ブラッシュアップ】
                        firstInput.focus();
                    }
                }, 150);
            }

            selectedChoice = -1;
            answered = false;
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('explanation').classList.add('hidden');
            document.getElementById('next-btn').style.display = 'none';
        }

        function showHint() {
            const graphArea = document.getElementById('graph-area');
            const hintBtn = document.getElementById('hint-btn');

            if (graphArea.classList.contains('hidden')) {
                graphArea.classList.remove('hidden');
                hintBtn.textContent = '👁️ 図を隠す';
            } else {
                graphArea.classList.add('hidden');
                hintBtn.textContent = '💡 ヒント（図を表示）';
            }
        }

        function selectChoice(index) {
            if (answered) return;

            selectedChoice = index;
            const choices = document.querySelectorAll('.choice');
            choices.forEach(choice => choice.classList.remove('selected'));
            choices[index].classList.add('selected');

            checkAnswer();
        }

        function checkInputAnswer() {
            if (answered) return;

            const question = currentQuestions[currentQuestion];
            const lowerBound1 = document.getElementById('lower-bound-1').value.trim();
            const upperBound1 = document.getElementById('upper-bound-1').value.trim();

            if (!lowerBound1 || !upperBound1 || !selectedOperator1) {
                return;
            }

            const config = window.elementSdk?.config || defaultConfig;
            const feedbackElement = document.getElementById('feedback');
            const explanationElement = document.getElementById('explanation');
            const questionText = document.getElementById('question-text');

            let isCorrect = false;
            let userInput = {
                lowerBound1: lowerBound1,
                upperBound1: upperBound1,
                operator1: selectedOperator1
            };

            if (question.answer.secondIntegral) {
                const lowerBound2 = document.getElementById('lower-bound-2').value.trim();
                const upperBound2 = document.getElementById('upper-bound-2').value.trim();

                if (!lowerBound2 || !upperBound2 || !selectedOperator2) {
                    return;
                }

                userInput.lowerBound2 = lowerBound2;
                userInput.upperBound2 = upperBound2;
                userInput.operator2 = selectedOperator2;
            }

            isCorrect = checkIntegralMatch(userInput, question.answer);

            if (isCorrect) {
                answered = true;

                questionText.classList.add('correct-answer');
                questionText.classList.remove('incorrect-answer');

                const operatorInput1 = document.getElementById('operator-input-1');
                operatorInput1.classList.add('correct');
                operatorInput1.disabled = true;

                document.getElementById('lower-bound-1').classList.add('correct');
                document.getElementById('upper-bound-1').classList.add('correct');

                if (question.answer.secondIntegral) {
                    const operatorInput2 = document.getElementById('operator-input-2');
                    operatorInput2.classList.add('correct');
                    operatorInput2.disabled = true;

                    document.getElementById('lower-bound-2').classList.add('correct');
                    document.getElementById('upper-bound-2').classList.add('correct');
                }

                feedbackElement.textContent = `🎉 ${config.success_message || defaultConfig.success_message} 正解です！`;
                feedbackElement.className = 'feedback correct';
                feedbackElement.classList.remove('hidden');

                explanationElement.innerHTML = `<h4>解説</h4><p>${question.explanation}</p>`;
                explanationElement.classList.remove('hidden');

                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                questionText.classList.add('incorrect-answer');
                questionText.classList.remove('correct-answer');

                // 【ブラッシュアップ】
                missedSet.add(currentQuestion);
                feedbackElement.innerHTML = '✗ まだちがうところがあります。<div class="rule-hint">💡 x軸より下の部分は「−」、上の部分は「+」。範囲は x軸との交点で分けよう。ヒントの図も見てみよう。</div>';
                feedbackElement.className = 'feedback incorrect';
                explanationElement.classList.add('hidden');
            }
        }

        function checkAnswer() {
            if (selectedChoice === -1 || answered) return;

            const choices = document.querySelectorAll('.choice');
            const feedbackElement = document.getElementById('feedback');
            const explanationElement = document.getElementById('explanation');
            const config = window.elementSdk?.config || defaultConfig;
            const questionText = document.getElementById('question-text');

            if (selectedChoice === currentQuestions[currentQuestion].shuffledCorrect) {
                answered = true;

                questionText.classList.add('correct-answer');
                questionText.classList.remove('incorrect-answer');

                choices[selectedChoice].classList.add('correct');
                feedbackElement.textContent = `🎉 ${config.success_message || defaultConfig.success_message} 正解です！`;
                feedbackElement.className = 'feedback correct';
                feedbackElement.classList.remove('hidden');

                explanationElement.innerHTML = `<h4>解説</h4><p>${currentQuestions[currentQuestion].explanation}</p>`;
                explanationElement.classList.remove('hidden');

                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                questionText.classList.add('incorrect-answer');
                questionText.classList.remove('correct-answer');

                // 【ブラッシュアップ】えらんだ選択肢を少しのあいだ赤くし、考え方のヒントを出す
                const wrongEl = choices[selectedChoice];
                wrongEl.classList.add('wrong');
                setTimeout(() => wrongEl.classList.remove('wrong'), 700);
                missedSet.add(currentQuestion);
                choices.forEach(choice => choice.classList.remove('selected'));
                selectedChoice = -1;

                feedbackElement.innerHTML = '✗ ちがいます。<div class="rule-hint">💡 x軸より下にある部分は「−」をつけて面積にするよ。2つのグラフで囲まれた部分は（上の式）−（下の式）。</div>';
                feedbackElement.className = 'feedback incorrect';
                explanationElement.classList.add('hidden');
            }
        }

        function checkFreeInputAutomatic() {
            if (answered) return;

            const question = currentQuestions[currentQuestion];
            const config = window.elementSdk?.config || defaultConfig;
            const feedbackElement = document.getElementById('feedback');
            const explanationElement = document.getElementById('explanation');
            const questionText = document.getElementById('question-text');

            let isCorrect = false;

            if (question.answer.denominator === 1) {
                const integerInput = document.getElementById('area-answer-integer');
                if (!integerInput) return;

                const userValue = parseInt(integerInput.value.trim());
                if (isNaN(userValue)) {
                    questionText.classList.remove('correct-answer', 'incorrect-answer');
                    feedbackElement.classList.add('hidden');
                    explanationElement.classList.add('hidden');
                    return;
                }

                isCorrect = userValue === question.answer.numerator;

                if (isCorrect) {
                    integerInput.classList.add('correct');
                }
            } else {
                const numeratorInput = document.getElementById('area-answer-numerator');
                const denominatorInput = document.getElementById('area-answer-denominator');

                if (!numeratorInput || !denominatorInput) return;

                const numeratorValue = numeratorInput.value.trim();
                const denominatorValue = denominatorInput.value.trim();

                if (!numeratorValue || !denominatorValue) {
                    questionText.classList.remove('correct-answer', 'incorrect-answer');
                    feedbackElement.classList.add('hidden');
                    explanationElement.classList.add('hidden');
                    return;
                }

                const userNumerator = parseInt(numeratorValue);
                const userDenominator = parseInt(denominatorValue);

                if (isNaN(userNumerator) || isNaN(userDenominator) || userDenominator === 0) {
                    questionText.classList.remove('correct-answer', 'incorrect-answer');
                    feedbackElement.classList.add('hidden');
                    explanationElement.classList.add('hidden');
                    return;
                }

                const userValue = userNumerator / userDenominator;
                const correctValue = question.answer.numerator / question.answer.denominator;

                isCorrect = Math.abs(userValue - correctValue) < 0.001;

                if (isCorrect) {
                    numeratorInput.classList.add('correct');
                    denominatorInput.classList.add('correct');
                }
            }

            if (isCorrect) {
                answered = true;

                questionText.classList.add('correct-answer');
                questionText.classList.remove('incorrect-answer');

                feedbackElement.textContent = `🎉 ${config.success_message || defaultConfig.success_message} 完璧です！`;
                feedbackElement.className = 'feedback correct';
                feedbackElement.classList.remove('hidden');

                explanationElement.innerHTML = `<h4>解説</h4><p>${question.explanation}</p>`;
                explanationElement.classList.remove('hidden');

                document.getElementById('show-answer-btn').style.display = 'none';
                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                questionText.classList.add('incorrect-answer');
                questionText.classList.remove('correct-answer');

                feedbackElement.classList.add('hidden');
                explanationElement.classList.add('hidden');
            }
        }

        function showAnswer() {
            if (answered) return;
            missedSet.add(currentQuestion);   // 【ブラッシュアップ】

            const question = currentQuestions[currentQuestion];
            const feedbackElement = document.getElementById('feedback');
            const explanationElement = document.getElementById('explanation');

            answered = true;

            if (question.answer.denominator === 1) {
                const integerInput = document.getElementById('area-answer-integer');
                if (integerInput) {
                    integerInput.value = question.answer.numerator;
                    integerInput.classList.add('correct');
                    integerInput.disabled = true;
                }
            } else {
                const numeratorInput = document.getElementById('area-answer-numerator');
                const denominatorInput = document.getElementById('area-answer-denominator');
                if (numeratorInput && denominatorInput) {
                    numeratorInput.value = question.answer.numerator;
                    denominatorInput.value = question.answer.denominator;
                    numeratorInput.classList.add('correct');
                    denominatorInput.classList.add('correct');
                    numeratorInput.disabled = true;
                    denominatorInput.disabled = true;
                }
            }

            const questionText = document.getElementById('question-text');
            questionText.classList.add('correct-answer');
            questionText.classList.remove('incorrect-answer');

            feedbackElement.textContent = '📖 答えを表示しました';
            feedbackElement.className = 'feedback';
            feedbackElement.style.background = '#fef3c7';
            feedbackElement.style.color = '#78350f';
            feedbackElement.style.border = '2px solid #fbbf24';
            feedbackElement.classList.remove('hidden');

            explanationElement.innerHTML = `<h4>解説</h4><p>${question.explanation}</p>`;
            explanationElement.classList.remove('hidden');

            document.getElementById('show-answer-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= currentQuestions.length) {
                showCompletion();
            } else {
                displayQuestion();
            }
        }

        function showCompletion() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('completion').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';

            const config = window.elementSdk?.config || defaultConfig;
            // 【ブラッシュアップ】
            lastMode = currentMode;
            const n = currentQuestions.length;
            const self = n - missedSet.size;
            document.getElementById('completion-title').textContent = self === n ? '全問正解おめでとう！' : 'おつかれさま！';
            document.getElementById('completion-message').innerHTML = `<div class="final-score">一発正解 ${self} / ${n} 問</div>` +
                (self === n ? (config.completion_message || defaultConfig.completion_message) : 'まちがえた問題は、ヒントの図をもう一度見て考えてみよう！');
            window.scrollTo(0, 0);
        }

        async function onConfigChange(config) {
            document.getElementById('quiz-title').textContent = config.quiz_title || defaultConfig.quiz_title;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
                ["success_message", config.success_message || defaultConfig.success_message],
                ["completion_message", config.completion_message || defaultConfig.completion_message]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }
        document.querySelectorAll('.choice-count').forEach(e => e.textContent = choiceQuestions.length);   // 【ブラッシュアップ】
    </script>
 <script>

</script>
