<main class="fs-wrap">
  <header class="fs-head"><small>数学Ⅱ　微分・積分</small><h1>面積を求めよう</h1></header>

</main>
<script src="../../assets/fill-steps.js?v=20261106"></script>
<script src="../../assets/sekibun.js?v=20261106"></script>
<script>
const md = s => FillSteps.md(s), { num, parse, polyS, minus, add, neg, R, lim, paren, val, evalRows, cleanCards, nearValues, fig, mono, join } = Sek;
const M = '−', GROUP = ['x 軸より上', 'x 軸より下', 'x 軸をまたぐ', '2つのグラフ'];
const flip = ts => ts.map(t => ({ r: neg(t.r), p: t.p }));
const yname = ts => 'y = ' + polyS(ts);
const ints = (a, b) => [num([b, 1]), num([a, 1])];
const LIMB = (a, b) => '{[' + num([b, 1]) + ']|[' + num([a, 1]) + ']}';
// (x − p)(x − q) の形
const fac = v => v === 0 ? 'x' : '(x ' + (v > 0 ? M + ' ' + v : '+ ' + -v) + ')';
const facts = (p, q) => (p === 0 ? 'x' + fac(q) : q === 0 ? 'x' + fac(p) : fac(p) + fac(q));
// 2次式の整数の解（x² の係数 ±1 など）
function roots(ts) {
  const out = [];
  for (let x = -12; x <= 12; x++) if (Math.abs(val(ts, x)) < 1e-9) out.push(x);
  return out;
}
// 図の範囲
function range(curves, marks, regions) {
  const mn = Math.min(0, ...marks), mx = Math.max(0, ...marks), span = mx - mn, m = Math.max(.45, span * .28);
  const lo = mn - m, hi = mx + m;
  const ys = [0];
  curves.forEach(c => { for (let i = 0; i <= 40; i++) { const x = Math.min(...marks) - span * .12 + (Math.max(...marks) - Math.min(...marks) + span * .24) * i / 40; ys.push(val(c, x)); } });
  const top = Math.max(...ys), bot = Math.min(...ys), pad = Math.max(.6, (top - bot) * .14);
  return { xr: [lo, hi], yr: [bot - pad, top + pad] };
}
const wrapB = ts => (ts.length > 1 ? '([' + polyS(ts) + '])' : '[' + polyS(ts) + ']');
const exprCards = (ts, extra) => [polyS(ts), [polyS(flip(ts)), '符号を確かめよう。'], ...(extra || [])];
const limCards = (a, b) => [num([a, 1]), num([b, 1]), [num([a - 1, 1]), 'グラフの図で、斜線の左右の端を見よう。'], [num([b + 1, 1]), 'グラフの図で、斜線の左右の端を見よう。']];

// 面積の問題を作る
function area(q) {
  const rows = [], cards = [], hide = q.type === 'axis' || q.type === 'meet';
  let a = q.a, b = q.b, ask, Fig, expr, exprWrong, value, wrongVals = [];
  const lab = (x, i) => hide ? (i ? 'β' : 'α') : x;
  if (q.type === 'axis' || q.type === 'above' || q.type === 'below') {
    const ts = parse(q.f);
    if (q.type === 'axis') { [a, b] = roots(ts); if (b === undefined) throw Error('解がない'); }
    const up = val(ts, (a + b) / 2) > 0;
    ask = q.type === 'axis' ? `放物線 ${yname(ts)} と x 軸で囲まれた部分の面積 S を求めよ。` : `${yname(ts)}、x 軸、x = ${num([a, 1])}、x = ${num([b, 1])} で囲まれた部分の面積 S を求めよ。`;
    if (q.type === 'axis') {
      const lead = ts[0].r[0] < 0;
      rows.push('#x 軸との交点の x 座標を求める',
        polyS(ts) + ' = 0', ...(lead ? [polyS(flip(ts)) + ' = 0'] : []),
        facts(a, b) + ' = 0', { t: 'x = [' + num([a, 1]) + '], [' + num([b, 1]) + ']', h: 'かけて 0 になるのは、どちらかが 0 のときです。' });
      cards.push(...limCards(a, b));
    }
    const main = up ? ts : flip(ts);
    if (up) {
      rows.push('#x 軸より上にあるので、そのまま積分する', { t: 'S = ∫' + LIMB(a, b) + ' ' + wrapB(ts) + ' dx', h: '斜線の左の端が下端、右の端が上端です。' });
    } else {
      rows.push('#x 軸より下にあるので、− をつけて積分する', { t: 'S = −∫' + LIMB(a, b) + ' ' + wrapB(ts) + ' dx', h: 'x 軸より下の部分の定積分は負になるので、− をつけて正の値にします。' },
        { t: '= ∫' + lim(b, a) + ' ' + wrapB(main) + ' dx', h: '− をかっこの中に入れます。すべての項の符号が変わります。' });
      cards.push(polyS(main));
    }
    cards.push(...limCards(a, b), ...exprCards(ts));
    const e = evalRows(main, a, b, '= ');
    rows.push(...e.rows); cards.push(...e.cards); value = e.ans;
    wrongVals = [neg(e.ans), e.Fb, add(e.ans, [1, 1])];
    Fig = () => {
      const g = range([ts], [a, b]);
      return fig({ ...g, curves: [{ ts, label: yname(ts) }], regions: [up ? { a, b, up: ts, low: [] } : { a, b, up: [], low: ts }],
        xs: [a, b].map((x, i) => ({ x, label: lab(x, i), y: val(ts, x), below: up, dx: x === 0 ? 9 : 0 })).filter(m => hide || m.x !== 0) });
    };
    const I = '∫' + lim(b, a) + ' ' + paren(ts) + ' dx';
    expr = up ? 'S = ' + I : 'S = −' + I;
    exprWrong = [up ? 'S = −' + I : 'S = ' + I, 'S = ∫' + lim(a, b) + ' ' + paren(ts) + ' dx', 'S = ∫' + lim(b + 1, a) + ' ' + paren(ts) + ' dx', 'S = ∫' + lim(b, a) + ' ' + paren(Sek.plus(ts, [{ r: [1, 1], p: 0 }])) + ' dx'];
  } else if (q.type === 'cross') {
    const ts = parse(q.f), c = q.c;
    a = q.a; b = q.b;
    ask = `${yname(ts)}、x 軸、x = ${num([a, 1])}、x = ${num([b, 1])} で囲まれた部分の面積 S を求めよ。`;
    const leftUp = val(ts, (a + c) / 2) > 0, L = leftUp ? ts : flip(ts), Rt = leftUp ? flip(ts) : ts;
    rows.push('#x 軸と交わる点で、2 つに分ける', { t: 'x 軸との交点は x = [' + num([c, 1]) + ']', h: polyS(ts) + ' = 0 を解こう。' });
    rows.push('#左の部分の面積 S₁');
    const e1 = evalRows(L, a, c, 'S₁ = ∫' + lim(c, a) + ' ' + paren(L) + ' dx = ');
    const e2 = evalRows(Rt, c, b, 'S₂ = ∫' + lim(b, c) + ' ' + paren(Rt) + ' dx = ');
    rows.push(...e1.rows, '#右の部分の面積 S₂', ...e2.rows);
    value = add(e1.ans, e2.ans);
    rows.push('#2 つをたす', { t: 'S = S₁ + S₂ = [' + num(e1.ans) + '] + [' + num(e2.ans) + ']', h: 'どちらも正の値です。たし算をします。', sk: 1 }, { t: '= [' + num(value) + ']', h: 'たし算をしよう。約分できるときは約分します。' });
    cards.push(num([c, 1]), [num([c + 1, 1]), polyS(ts) + ' = 0 を解こう。'], ...e1.cards, ...e2.cards, num(value), [num(Sek.sub(e1.ans, e2.ans)), '面積はどちらも正の値でたします。']);
    wrongVals = [Sek.sub(e1.ans, e2.ans), Sek.sub(e2.ans, e1.ans), e1.ans, e2.ans];
    Fig = () => {
      const g = range([ts], [a, b, c]);
      return fig({ ...g, curves: [{ ts, label: yname(ts) }], regions: [leftUp ? { a, b: c, up: ts, low: [] } : { a, b: c, up: [], low: ts }, leftUp ? { a: c, b, up: [], low: ts } : { a: c, b, up: ts, low: [] }],
        xs: [{ x: a, label: a, y: val(ts, a), below: !leftUp ? false : true }, { x: b, label: b, y: val(ts, b), below: leftUp }, { x: c, label: 'c', below: !leftUp }].filter(m => m.x !== 0) });
    };
    const Ia = '∫' + lim(c, a) + ' ' + paren(ts) + ' dx', Ib = '∫' + lim(b, c) + ' ' + paren(ts) + ' dx';
    expr = leftUp ? 'S = ' + Ia + ' − ' + Ib : 'S = −' + Ia + ' + ' + Ib;
    exprWrong = [leftUp ? 'S = ' + Ia + ' + ' + Ib : 'S = ' + Ia + ' + ' + Ib, leftUp ? 'S = −' + Ia + ' + ' + Ib : 'S = ' + Ia + ' − ' + Ib, 'S = ∫' + lim(b, a) + ' ' + paren(ts) + ' dx'];
  } else {
    const U = parse(q.up), Lw = parse(q.low), d = minus(U, Lw);
    if (q.type === 'meet') {
      [a, b] = roots(d); if (b === undefined) throw Error('解がない');
      ask = `${yname(U)} と ${yname(Lw)} で囲まれた部分の面積 S を求めよ。`;
      const lead = d[0].r[0] < 0, eq = lead ? flip(d) : d, k = eq[0].r[0];
      rows.push('#交点の x 座標を求める', polyS(U) + ' = ' + polyS(Lw), polyS(eq) + ' = 0', (k > 1 ? k : '') + facts(a, b) + ' = 0',
        { t: 'x = [' + num([a, 1]) + '], [' + num([b, 1]) + ']', h: 'かけて 0 になるのは、どちらかが 0 のときです。' });
      cards.push(...limCards(a, b));
    } else { a = q.a; b = q.b; ask = `${yname(U)}、${yname(Lw)}、x = ${num([a, 1])}、x = ${num([b, 1])} で囲まれた部分の面積 S を求めよ。`; }
    rows.push('#（上のグラフの式）−（下のグラフの式）を積分する',
      { t: 'S = ∫' + LIMB(a, b) + ' (' + wrapB(U) + ' − ' + wrapB(Lw) + ') dx', h: '図で、斜線の部分の上にあるグラフの式から、下にあるグラフの式をひきます。' },
      { t: '= ∫' + lim(b, a) + ' ' + wrapB(d) + ' dx', h: 'かっこをはずして、まとめよう。' });
    cards.push(...limCards(a, b), polyS(U), polyS(Lw), polyS(d), [polyS(flip(d)), '上のグラフ − 下のグラフ の順にひきます。'], [polyS(Sek.plus(U, Lw)), 'ひき算です。']);
    const e = evalRows(d, a, b, '= ');
    rows.push(...e.rows); cards.push(...e.cards); value = e.ans;
    wrongVals = [neg(e.ans), e.Fb, add(e.ans, [1, 2])];
    Fig = () => {
      const g = range([U, Lw], [a, b]);
      return fig({ ...g, curves: [{ ts: U, label: yname(U) }, { ts: Lw, label: yname(Lw) }], regions: [{ a, b, up: U, low: Lw }],
        xs: [a, b].map((x, i) => ({ x, label: lab(x, i), y: val(U, x), below: Math.min(val(Lw, a), val(Lw, b)) >= -0.01, dx: x === 0 ? 9 : 0 })).filter(m => hide || m.x !== 0) });
    };
    const dd = (A, B) => 'S = ∫' + lim(b, a) + ' (' + paren(A) + ' − ' + paren(B) + ') dx';
    expr = dd(U, Lw);
    exprWrong = [dd(Lw, U), 'S = ∫' + lim(b, a) + ' (' + polyS(Sek.plus(U, Lw)) + ') dx', 'S = ∫' + lim(a, b) + ' (' + paren(U) + ' − ' + paren(Lw) + ') dx'];
  }
  const p = { big: '', q: ask, rows, cards: cleanCards(cards), ans: 'S = ' + num(value), value, group: q.group, fig: Fig(), wrong: nearValues(value, wrongVals).map(v => 'S = ' + v), expr, exprWrong: Sek.uniq(exprWrong).filter(v => v !== expr).slice(0, 3) };
  return p;
}
const LIST = [
  { type: 'above', f: 'x', a: 0, b: 2, group: 0 }, { type: 'above', f: 'x²', a: 0, b: 2, group: 0 }, { type: 'above', f: 'x+1', a: 0, b: 2, group: 0 }, { type: 'above', f: 'x²+1', a: 1, b: 2, group: 0 }, { type: 'axis', f: '-x²+4x', group: 0 }, { type: 'axis', f: '-x²+2x+3', group: 0 },
  { type: 'below', f: 'x-3', a: 0, b: 2, group: 1 }, { type: 'below', f: 'x²-4', a: -1, b: 1, group: 1 }, { type: 'axis', f: 'x²-2x', group: 1 }, { type: 'axis', f: 'x²-3x', group: 1 }, { type: 'axis', f: 'x²-1', group: 1 },
  { type: 'cross', f: 'x-1', a: 0, c: 1, b: 3, group: 2 }, { type: 'cross', f: 'x²-1', a: 0, c: 1, b: 2, group: 2 }, { type: 'cross', f: 'x-2', a: 0, c: 2, b: 4, group: 2 },
  { type: 'between', up: 'x+2', low: 'x²', a: 0, b: 1, group: 3 }, { type: 'meet', up: 'x', low: 'x²', group: 3 }, { type: 'meet', up: 'x+2', low: 'x²', group: 3 }, { type: 'meet', up: '4', low: 'x²', group: 3 }, { type: 'meet', up: '8-x²', low: 'x²', group: 3 }
];
function randomQ() {
  const r = Sek.rint, p = r(-2, 1), q = p + r(2, 4), s = p + q, m = p * q, tx = (k) => (k === 0 ? '' : (k > 0 ? '+' : '-') + Math.abs(k));
  return Sek.pick([
    () => ({ type: 'axis', f: `x²${s ? tx(-s) + 'x' : ''}${tx(m)}` }),
    () => ({ type: 'axis', f: `-x²${s ? tx(s) + 'x' : ''}${tx(-m)}` }),
    () => ({ type: 'meet', up: (s ? s + 'x' : '') + (s ? tx(-m) : String(-m)), low: 'x²' }),
    () => ({ type: 'above', f: `x²${tx(r(1, 3))}`, a: 0, b: r(1, 3) }),
    () => ({ type: 'cross', f: `x${tx(-2)}`, a: 0, c: 2, b: r(3, 5) })
  ])();
}
const safeRandom = () => { for (;;) { const q = randomQ(); try { const p = area(q); if (p.value[0] > 0 && p.value[1] < 40) return p; } catch (e) {} } };
const home = () => { document.getElementById('app').innerHTML = ''; showMenu(); };
const FORMULA = () => '<div class="sk-formula">' + md('S = ∫{b|a} (上の式 − 下の式) dx') + '<small>' + md('上の式・下の式はグラフの上下。x 軸は y = 0') + '</small></div>';
function fillMode(P, tab) {
  document.getElementById('menu').innerHTML = '';
  Sek.fill('#app', P, { top: FORMULA, home, tabGroup: tab ? p => ({ id: p.group, label: GROUP[p.group] }) : null });
}
function quizMode(make, o) {
  document.getElementById('menu').innerHTML = '';
  const go = () => Sek.quiz(document.getElementById('app'), make(), Object.assign({ home, again: go }, o));
  go();
}
const noteQ = p => ({ big: p.big, q: p.q, ans: p.ans, wrong: p.wrong, p, fig: p.fig });
const exprQ = p => ({ big: '', q: '斜線の部分の面積 S を表す式はどれか。', ans: p.expr, wrong: p.exprWrong, p, fig: p.fig });
const icon = d => `<svg viewBox="0 0 70 50" width="66" height="47" aria-hidden="true">${d}</svg>`;
const ICON = {
  a: icon('<path d="M8 44H64M14 48V4" stroke="#5b6470" fill="none"/><path d="M14 44Q34 44 52 8V44Z" fill="#c7daf0"/><path d="M12 44Q34 44 54 4" fill="none" stroke="#1f4e8c" stroke-width="2.4"/>'),
  b: icon('<path d="M8 44H64M14 48V4" stroke="#5b6470" fill="none"/><path d="M20 44Q38 -6 56 44Z" fill="#ffe0c2"/><path d="M16 50Q38 -24 60 50" fill="none" stroke="#b4540a" stroke-width="2.4"/><text x="33" y="34" font-family="STIX Two Text,serif" font-style="italic" font-size="15" fill="#b4540a">∫</text>'),
  c: icon('<path d="M8 44H64M14 48V4" stroke="#5b6470" fill="none"/><path d="M18 40Q38 6 58 12" fill="none" stroke="#207345" stroke-width="2.4"/><path d="M50 26l6 6 10-14" fill="none" stroke="#207345" stroke-width="3"/>'),
  d: '✎'
};
function showMenu() {
  Sek.menu(document.getElementById('menu'), [
    { name: '途中式で解く', sub: 'カードで式を作る（' + LIST.length + '問）', icon: ICON.a, go: () => fillMode(LIST.map(area), true) },
    { name: '面積を表す式', sub: '図を見て式を選ぶ（10問）', icon: ICON.b, go: () => quizMode(() => Sek.shuffle(LIST).slice(0, 10).sort((x, y) => x.group - y.group).map(area).map(exprQ), { name: '面積を表す式' }) },
    { name: 'ランダム練習', sub: '数値が毎回かわる5問', icon: ICON.c, go: () => fillMode(Array.from({ length: 5 }, safeRandom), false) },
    { name: 'ノートで解く', sub: '自分で計算して4択（8問）', icon: ICON.d, go: () => quizMode(() => Sek.shuffle(LIST).slice(0, 8).sort((x, y) => x.group - y.group).map(area).map(noteQ), { name: 'ノートで解く' }) }
  ], 'モードを選んで始めよう。');
}
showMenu();
</script>
