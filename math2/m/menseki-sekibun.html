<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <!--
    数学Ⅱ 11. 面積を求めよう（定積分と面積の関連クイズ）
    山﨑先生のキャンバ版をもとにブラッシュアップしたもの。
    問題・画面の流れ・仕掛けは先生の版のまま。見た目は全教材共通のデザインにそろえた（【デザイン統一】）。直した箇所には【ブラッシュアップ】と書いてある。
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定積分と面積の関連クイズ</title>
  
  <style>
        body {
            box-sizing: border-box;
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100%;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .mode-selection {
            text-align: center;
            padding: 40px 20px;
        }

        .mode-selection h2 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 30px;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .mode-btn {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            padding: 30px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .mode-btn:hover {
            border-color: #4299e1;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(66, 153, 225, 0.2);
        }

        .mode-btn-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .mode-btn-title {
            font-size: 20px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .mode-btn-desc {
            font-size: 14px;
            color: #718096;
            line-height: 1.5;
        }

        .progress {
            background: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #48bb78, #38a169);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #4299e1;
        }

        .question-number {
            font-size: 16px;
            color: #718096;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            line-height: 1.6;
            padding: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .question-text.correct-answer {
            background: #f0fff4;
            border: 2px solid #48bb78;
        }

        .question-text.incorrect-answer {
            background: #fed7d7;
            border: 2px solid #f56565;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .level-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-left: 10px;
        }

        .level-1 {
            background: #c6f6d5;
            color: #22543d;
        }

        .level-2 {
            background: #feebc8;
            color: #7c2d12;
        }

        .level-3 {
            background: #fed7d7;
            color: #742a2a;
        }

        .graph-area {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint-container {
            text-align: center;
            margin: 20px 0;
        }

        .hint-btn {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(25, 84, 123, 0.3);
        }

        .hint-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 84, 123, 0.4);
        }

        .hint-btn:active {
            transform: translateY(0);
        }

        .graph-svg {
            width: 100%;
            max-width: 400px;
            height: 280px;
        }

        .axis {
            stroke: #2d3748;
            stroke-width: 2;
        }

        .axis-label {
            font-size: 14px;
            fill: #2d3748;
            font-weight: 600;
        }

        .function-curve {
            fill: none;
            stroke: #4299e1;
            stroke-width: 3;
        }

        .area-fill {
            fill: rgba(72, 187, 120, 0.3);
            stroke: #48bb78;
            stroke-width: 2;
        }

        .boundary-line {
            stroke: #e53e3e;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .choice {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
        }

        .choice:hover {
            border-color: #4299e1;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(66, 153, 225, 0.15);
        }

        .choice.selected {
            border-color: #4299e1;
            background: #ebf8ff;
        }

        .choice.correct {
            border-color: #48bb78;
            background: #f0fff4;
            color: #22543d;
        }

        .choice.incorrect {
            border-color: #f56565;
            background: #fed7d7;
            color: #742a2a;
        }

        .input-mode-container {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin: 25px 0;
        }

        .input-label {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
            display: block;
        }

        .integral-builder {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 10px;
            min-height: 80px;
            justify-content: center;
        }

        .operator-direct-input {
            width: 50px;
            height: 50px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            color: #2d3748;
        }

        .operator-direct-input:focus {
            outline: none;
            border-color: #4299e1;
            background: #ebf8ff;
        }

        .operator-direct-input.correct {
            border-color: #48bb78;
            background: #f0fff4;
            color: #22543d;
        }

        .operator-hint {
            font-size: 11px;
            color: #718096;
            margin-top: 5px;
            white-space: nowrap;
        }

        .integral-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 80px 0 0;
        }

        .integral-symbol {
            font-size: 40px;
            font-weight: bold;
            color: #2d3748;
            display: inline-block;
        }

        .bound-input {
            width: 60px;
            padding: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .bound-input:focus {
            outline: none;
            border-color: #4299e1;
        }

        .bound-input.correct {
            border-color: #48bb78;
            background: #f0fff4;
            color: #22543d;
        }

        .bound-upper {
            position: absolute;
            top: -10px;
            right: -75px;
        }

        .bound-lower {
            position: absolute;
            bottom: -10px;
            right: -75px;
        }

        .dx-label {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-left: 5px;
        }

        .second-integral-section {
            display: inline-flex;
            align-items: center;
        }

        .input-hint {
            font-size: 14px;
            color: #718096;
            margin-top: 15px;
            padding: 12px;
            background: #edf2f7;
            border-radius: 8px;
            line-height: 1.6;
        }

        .fraction-input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fraction-divider {
            width: 140px;
            height: 3px;
            background: #2d3748;
        }

        .fraction-part-input {
            width: 140px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .fraction-part-input:focus {
            outline: none;
            border-color: #4299e1;
        }

        .fraction-part-input.correct {
            border-color: #48bb78;
            background: #f0fff4;
            color: #22543d;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4299e1;
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
        }

        .feedback.correct {
            background: #f0fff4;
            color: #22543d;
            border: 2px solid #48bb78;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #f56565;
        }

        .explanation {
            background: #e6fffa;
            border: 2px solid #38b2ac;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            color: #234e52;
        }

        .explanation h4 {
            margin-top: 0;
            color: #2c7a7b;
        }

        .completion {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 20px;
            margin-top: 30px;
        }

        .completion h2 {
            font-size: 32px;
            color: #744210;
            margin-bottom: 20px;
        }

        .completion p {
            font-size: 18px;
            color: #975a16;
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }

        .celebration {
            font-size: 48px;
            margin: 20px 0;
        }

        .check-answer-btn {
            background: #48bb78;
            color: white;
        }

        .check-answer-btn:hover {
            background: #38a169;
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  
  <!-- 【ブラッシュアップ】元は Tailwind の開発用CDN（cdn.tailwindcss.com）をその場で動かしていた。
       本番用ではなく、重いうえに読み込めないと見た目が全部崩れるため、
       同じクラスから作った固定の CSS に置きかえた。見た目は同じ。 -->
  <link rel="stylesheet" href="../../assets/gas.css">
   <!-- 【デザイン統一】全教材共通のデザイン（01. 文字式のルール がもと） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    /* 【デザイン統一】この教材の部品を、共通デザインの色・形に塗り直す */

    body { padding: 12px; }
    /* 【ブラッシュアップ】式：文字は斜体、数・記号は立体、数式用の書体 */
    .m { font-family: var(--u-math-font); font-size: 1.08em; }
    .m i { font-style: italic; padding-right: 0.04em; }
    .container { padding: 24px 20px; }
    .title { font-size: min(2rem, 6.2vw); white-space: nowrap; margin: 0 0 12px; }
    .mode-selection h2 { color: var(--u-title-dark); font-size: 1.3rem; }
    .mode-btn { width: 100%; font: inherit; }
    .mode-btn-title { color: var(--u-title); }
    .mode-btn-desc { color: var(--u-sub); font-weight: 700; }
    #progress-text { color: var(--u-sub); font-weight: 700; }
    .question-card { background: #f8fafc; border: 3px solid var(--u-line); border-radius: 24px; padding: 18px 14px; }
    .question-number { display: inline-block; background: var(--u-soft-yellow); color: var(--u-soft-yellow-text); padding: 4px 16px; border-radius: 999px; font-weight: 800; }
    .question-text { color: var(--u-ink); font-weight: 800; background: #fff; border: 2px solid var(--u-line); line-height: 1.7; }
    .question-text.correct-answer { background: var(--u-ok-soft); border-color: var(--u-ok-line); }
    .question-text.incorrect-answer { background: var(--u-ng-soft); border-color: var(--u-ng-line); }
    .hint-container { margin: 10px 0; }
    .hint-btn { padding: 8px 18px !important; font-size: 0.95rem !important; }
    /* 【ブラッシュアップ】図 */
    .graph-area { border: 3px solid var(--u-line); border-radius: 16px; min-height: 0; padding: 8px; margin: 10px 0; background: #fff; }
    .graph-holder { width: 100%; max-width: 440px; margin: 0 auto; }
    .graph-svg { width: 100%; height: auto; display: block; }
    .graph-svg text { font-family: var(--u-math-font); }
    .graph-svg .it { font-style: italic; }
    .graph-svg .grid { stroke: #eef2f7; stroke-width: 1; }
    .graph-svg .tick { stroke: #4b2c20; stroke-width: 1.2; }
    .graph-svg .tick-label { font-size: 14px; fill: #64748b; font-family: var(--u-math-font); }
    .graph-svg .o-label { font-style: italic; fill: #4b2c20; font-size: 13px; }
    .graph-svg .axis { stroke: #4b2c20; stroke-width: 1.6; }
    .graph-svg .axis-label { font-size: 15px; fill: #4b2c20; font-style: italic; font-family: var(--u-math-font); }
    .graph-svg .function-curve { fill: none; stroke-width: 2.6; }
    .graph-svg path.curve-1 { stroke: #2563eb; fill: none; }
    .graph-svg path.curve-2 { stroke: #ea580c; fill: none; }
    .graph-svg text.curve-1 { fill: #2563eb; }
    .graph-svg text.curve-2 { fill: #ea580c; }
    .graph-svg text.curve-label { stroke: #fff; stroke-width: 4px; paint-order: stroke; font-size: 16px; font-weight: 800; }
    .graph-svg .area-fill { fill: rgba(34, 197, 94, 0.28); stroke: none; }
    .graph-svg .area-fill.below { fill: rgba(239, 68, 68, 0.28); }
    .graph-svg .area-fill.between { fill: rgba(250, 204, 21, 0.4); }
    .graph-svg .boundary-line { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .graph-svg .tick-label.bound-num { fill: #4b2c20; font-weight: 800; }
    .graph-svg .pt { fill: #4b2c20; }
    .graph-svg .pt-label { font-size: 14px; font-weight: 800; fill: #4b2c20; stroke: #fff; stroke-width: 3px; paint-order: stroke; }
    .choice { font-size: 1.15rem; font-weight: 700; width: 100%; font-family: inherit; }
    .choice:disabled.wrong { opacity: 0.8; }
    .int { font-size: 1.3em; font-weight: 400; vertical-align: middle; font-family: var(--u-math-font); }
    .lim { display: inline-flex; flex-direction: column; justify-content: space-between; vertical-align: middle; font-size: 0.62em; line-height: 1.2; margin: 0 3px 0 1px; text-align: left; }
    .bk { font-size: 1.5em; font-weight: 400; vertical-align: middle; }
    .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.82em; line-height: 1.15; margin: 0 2px; }
    .fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 2px; }
    .fr > span:last-child { padding: 0 2px; }
    .input-mode-container { border: 3px solid var(--u-line); border-radius: 16px; }
    .input-label { color: var(--u-ink); font-weight: 700; }
    .integral-builder { background: var(--u-soft-yellow); border-radius: 14px; flex-wrap: wrap; row-gap: 30px; }
    .int-group { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .dx-label { white-space: nowrap; }
    .bound-input { font-size: 16px; }
    .bound-input.wrong, .op-btn.wrong, .func-btn.wrong { background: var(--u-ng-soft) !important; border-color: var(--u-ng-line) !important; }
    .bound-input.correct, .op-btn.correct, .func-btn.correct { background: var(--u-ok-soft) !important; border-color: var(--u-ok-line) !important; }
    .op-btn, .func-btn { background: #fff; color: var(--u-ink); border: 3px solid var(--u-line-dark); border-bottom-width: 5px; border-radius: 12px; cursor: pointer; font-weight: 800; font-family: inherit; }
    .op-btn { min-width: 44px; min-height: 48px; font-size: 1.5rem; }
    .func-btn { min-height: 44px; padding: 4px 8px; font-size: 1rem; }
    .in-help { margin: 10px 0 0; color: var(--u-sub); font-weight: 700; font-size: 0.9rem; text-align: center; }
    .area-answer { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.6rem; font-weight: 800; color: var(--u-ink); margin: 6px 0; }
    .area-frac { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
    .area-frac .fraction-part-input { width: 110px; font-size: 20px; padding: 8px; }
    .area-frac .fraction-divider { width: 110px; }
    .fraction-part-input.wrong { background: var(--u-ng-soft); border-color: var(--u-ng-line); }
    .fraction-part-input.reduce { background: var(--u-soft-yellow); border-color: #fde047; }
    .feedback { border-radius: 16px; }
    .feedback.correct { background: var(--u-ok-soft); color: var(--u-ok); border: 3px solid var(--u-ok-line); }
    .feedback.incorrect { background: var(--u-ng-soft); color: var(--u-ng); border: 3px solid var(--u-ng-line); }
    .feedback.hint { background: var(--u-soft-yellow); color: var(--u-soft-yellow-text); border: 3px solid #fde047; }
    .feedback.shown { background: var(--u-soft-blue); color: var(--u-title); border: 3px solid var(--u-soft-blue-line); }
    .rule-hint { margin-top: 6px; font-size: 0.95rem; color: var(--u-title); font-weight: 700; }
    .explanation { background: #fff; border: 3px dashed var(--u-line); border-radius: 16px; color: var(--u-ink); line-height: 2.2; }
    .explanation .calc { margin-top: 6px; font-weight: 700; }
    .buttons { flex-wrap: wrap; }
    .completion { background: #fff; border: 4px dashed var(--u-line); border-radius: 24px; }
    .completion h2 { color: var(--u-accent-text); white-space: nowrap; font-size: min(2rem, 7.5vw); }
    #completion-message { color: var(--u-ink); font-weight: 700; line-height: 1.8; }
    .final-score { font-size: 1.4em; font-weight: 800; color: var(--u-title); margin-bottom: 6px; }
    .result-nav { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 16px auto 0; }
    .result-nav button, .result-nav a.next { padding: 12px; margin: 0; }
    .result-nav a { color: var(--u-sub); font-weight: 700; }
    @media (max-width: 640px) {
      body { padding: 8px; }
      .container { padding: 14px 10px; }
      .question-card { padding: 14px 8px; }
      .question-text { font-size: 1.05rem; padding: 10px; }
      .choices { grid-template-columns: 1fr; gap: 8px; }
      .choice { padding: 14px 8px; font-size: 1.1rem; }
      .graph-area { padding: 4px; }
      .input-mode-container { padding: 14px 8px; }
      .integral-builder { justify-content: center; row-gap: 30px; padding: 24px 6px; }
      .integral-wrapper { margin-right: 58px; }
      .bound-input { width: 46px; padding: 6px 2px; }
      .bound-upper, .bound-lower { right: -54px; }
      .explanation { font-size: 0.95rem; padding: 14px 10px; }
    }
  
  </style>
</head>

  <main class="container">

    <h1 class="title" id="quiz-title">定積分と面積の関連クイズ</h1>

   <div id="mode-selection" class="mode-selection">
    <h2>モードを選択してください</h2>

        // 全角の数字・記号を半角に、いろいろな「ー」をマイナスにそろえる
        function nz(v) {

        function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }

        const addF = (x, y) => fr(x[0] * y[1] + y[0] * x[1], x[1] * y[1]);
        const subF = (x, y) => addF(x, [-y[0], y[1]]);
        const negF = x => [-x[0], x[1]];
        const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
        function supOf(p) { return String(p).split('').map(ch => SUP[+ch]).join(''); }
        function pretty(s) { return String(s).replace(/-/g, '−'); }

        // 式を読んで係数の配列 [定数, x, x², …] にする（"2*x-4"、"x**2-1"、"x+2-x²" など）
        function parsePoly(str) {
            const s = String(str).replace(/\*\*(\d)/g, (m, d) => SUP[+d]).replace(/\*/g, '').replace(/\s/g, '').replace(/[−]/g, '-');
            let i = 0;
            const add = (a, b) => { const r = []; for (let k = 0; k < Math.max(a.length, b.length); k++) r[k] = (a[k] || 0) + (b[k] || 0); return r; };
            const mul = (a, b) => { const r = new Array(a.length + b.length - 1).fill(0); a.forEach((x, p) => b.forEach((y, q) => { r[p + q] += x * y; })); return r; };
            const pow = (a, n) => { let r = [1]; for (let k = 0; k < n; k++) r = mul(r, a); return r; };
            function readSup() { let t = ''; while (i < s.length && SUP.includes(s[i])) t += SUP.indexOf(s[i++]); return t === '' ? 1 : +t; }
            function base() {
                if (s[i] === '(') { i++; const e = expr(); i++; return e; }
                if (s[i] === 'x') { i++; return [0, 1]; }
                let t = '';
                while (i < s.length && /\d/.test(s[i])) t += s[i++];
                if (t === '') throw new Error('読めない式: ' + str);
                return [+t];
            }
            function factor() { const b = base(); return pow(b, readSup()); }
            function term() {
                let sign = 1;
                while (s[i] === '+' || s[i] === '-') { if (s[i] === '-') sign = -sign; i++; }
                let r = factor();
                while (i < s.length && (s[i] === '(' || s[i] === 'x' || /\d/.test(s[i]))) r = mul(r, factor());
                return r.map(c => c * sign);
            }
            function expr() { let r = term(); while (i < s.length && (s[i] === '+' || s[i] === '-')) r = add(r, term()); return r; }
            const r = expr();
            if (i !== s.length) throw new Error('読めない式: ' + str);
            return r;
        }
        const polyVal = (c, x) => c.reduce((s, k, p) => s + k * Math.pow(x, p), 0);

        const FAt = (anti, x) => anti.reduce((s, t) => addF(s, fr(t.f[0] * Math.pow(x, t.p), t.f[1])), [0, 1]);

        function fracHTML(n, d) { return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
        function numHTML([n, d]) { const s = n < 0 ? '−' : ''; return s + (d === 1 ? Math.abs(n) : fracHTML(Math.abs(n), d)); }
        const paren = v => v[0] < 0 ? `(${numHTML(v)})` : numHTML(v);
        function termsHTML(list) {   // list: [{f:[n,d], p}]
            let h = '';

                const neg = t.f[0] < 0, n = Math.abs(t.f[0]), d = t.f[1];

        }
        const coefHTML = c => termsHTML(c.map((k, p) => ({ f: [k, 1], p })).reverse());
        const lim = (a, b) => `<span class="lim"><span>${pretty(b)}</span><span>${pretty(a)}</span></span>`;

        // 2次式なら「放物線」、1次式・定数なら「直線」

        // グラフの種類 → 関数（先生のデータはグラフの種類で関数を決めていた。2 曲線のときは [上, 下]）
        const GRAPH_FN = {

            linear_mixed1: ['x-1'], linear_mixed2: ['x-2'], linear_mixed3: ['2*x-4'],

            missedSet = new Set();   // 【ブラッシュアップ】
            document.getElementById('completion').classList.add('hidden');
            window.scrollTo(0, 0);
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            displayQuestion();
        }

        function backToModeSelection() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('completion').classList.add('hidden');
            document.getElementById('mode-selection').classList.remove('hidden');
            currentMode = null;
            currentQuestions = [];
            currentQuestion = 0;
        }

        function shuffleChoices(question) {
            const correctAnswer = question.choices[question.correct];
            const shuffled = [...question.choices];

            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const newCorrectIndex = shuffled.indexOf(correctAnswer);

            return {
                choices: shuffled,
                correct: newCorrectIndex
            };
        }

        // 「∫₀²」のような書き方を、∫ の右に上端・下端を書いた形にする（どの数でも表示できる）
        const SUB = '₀₁₂₃₄₅₆₇₈₉';
        function formatIntegral(text) {
            return pretty(text).replace(/∫(₋?)([₀-₉])([⁰¹²³⁴-⁹])/g, (m, neg, lo, up) =>
                `<span class="int">∫</span>${lim((neg ? '-' : '') + SUB.indexOf(lo), SUP.indexOf(up))}`);
        }

        // 図の中の式：文字は斜体、数・記号はそのまま
        function svgMath(s) { return String(s).replace(/[A-Za-z]+/g, w => `<tspan class="it">${w}</tspan>`); }

        function createGraph(question) {
            const NS = 'http://www.w3.org/2000/svg';
            const W = 400, H = 300, L = 30, R = 16, T = 16, B = 24;
            const fns = curvesOf(question).map(js => { const c = parsePoly(js); return x => polyVal(c, x); });
            const a = question.integralMin, b = question.integralMax;
            const xMin = question.xMin, xMax = question.xMax;
            // y の範囲：囲まれた部分と x軸が入るように
            let yLo = 0, yHi = 0;
            for (let k = 0; k <= 60; k++) {
                const x = a + (b - a) * k / 60;
                fns.forEach(f => { yLo = Math.min(yLo, f(x)); yHi = Math.max(yHi, f(x)); });
            }
            const pad = Math.max(0.6, (yHi - yLo) * 0.18);
            yLo -= pad; yHi += pad;
            const sx = x => L + (x - xMin) / (xMax - xMin) * (W - L - R);
            const sy = y => T + (yHi - y) / (yHi - yLo) * (H - T - B);
            const fmt = v => (Math.round(v * 10) / 10).toFixed(1);
            const svg = [];
            svg.push(`<svg xmlns="${NS}" class="graph-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="グラフ">`);
            svg.push(`<defs><clipPath id="plotClip"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath>` +
                `<marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b2c20"/></marker></defs>`);
            // 目盛り（うすい線と数字）
            const step = span => span > 16 ? 5 : span > 8 ? 2 : 1;
            const stX = step(xMax - xMin), stY = step(yHi - yLo);
            for (let gx = Math.ceil(xMin / stX) * stX; gx <= xMax; gx += stX) {
                if (gx === 0) continue;
                svg.push(`<line x1="${fmt(sx(gx))}" y1="${T}" x2="${fmt(sx(gx))}" y2="${H - B}" class="grid"/>`);
                svg.push(`<line x1="${fmt(sx(gx))}" y1="${fmt(sy(0) - 4)}" x2="${fmt(sx(gx))}" y2="${fmt(sy(0) + 4)}" class="tick"/>`);
                svg.push(`<text x="${fmt(sx(gx))}" y="${fmt(sy(0) + 17)}" class="tick-label${gx === question.integralMin || gx === question.integralMax ? ' bound-num' : ''}" text-anchor="middle">${pretty(gx)}</text>`);
            }
            for (let gy = Math.ceil(yLo / stY) * stY; gy <= yHi; gy += stY) {
                if (gy === 0) continue;
                svg.push(`<line x1="${L}" y1="${fmt(sy(gy))}" x2="${W - R}" y2="${fmt(sy(gy))}" class="grid"/>`);
                svg.push(`<line x1="${fmt(sx(0) - 4)}" y1="${fmt(sy(gy))}" x2="${fmt(sx(0) + 4)}" y2="${fmt(sy(gy))}" class="tick"/>`);
                svg.push(`<text x="${fmt(sx(0) - 7)}" y="${fmt(sy(gy) + 4)}" class="tick-label" text-anchor="end">${pretty(gy)}</text>`);
            }
            // ぬる部分
            const N = 120, xs = [];
            for (let k = 0; k <= N; k++) xs.push(a + (b - a) * k / N);
            const pt = (x, y) => `${fmt(sx(x))},${fmt(sy(y))}`;
            if (fns.length > 1) {
                const top = xs.map(x => pt(x, fns[0](x))), bot = xs.slice().reverse().map(x => pt(x, fns[1](x)));
                svg.push(`<polygon points="${top.concat(bot).join(' ')}" class="area-fill between" clip-path="url(#plotClip)"/>`);
            } else {
                const f = fns[0];
                const pos = [pt(a, 0), ...xs.map(x => pt(x, Math.max(0, f(x)))), pt(b, 0)];
                const neg = [pt(a, 0), ...xs.map(x => pt(x, Math.min(0, f(x)))), pt(b, 0)];
                svg.push(`<polygon points="${pos.join(' ')}" class="area-fill" clip-path="url(#plotClip)"/>`);
                svg.push(`<polygon points="${neg.join(' ')}" class="area-fill below" clip-path="url(#plotClip)"/>`);
                // 直線 x = a, x = b（y軸と重なるとき・x軸との交点が範囲の端のときはかかない）
                if (!axisOnly(question)) [a, b].forEach(v => {
                    if (v === 0) return;
                    svg.push(`<line x1="${fmt(sx(v))}" y1="${T}" x2="${fmt(sx(v))}" y2="${H - B}" class="boundary-line"/>`);
                    // （範囲の数は、x軸の目盛りの数字を太字にして示す）
                });
            }
            // 座標軸（矢印つき）と x, y, O
            svg.push(`<line x1="${L}" y1="${fmt(sy(0))}" x2="${W - R + 10}" y2="${fmt(sy(0))}" class="axis" marker-end="url(#arrowHead)"/>`);
            svg.push(`<line x1="${fmt(sx(0))}" y1="${H - B + 8}" x2="${fmt(sx(0))}" y2="${T - 10}" class="axis" marker-end="url(#arrowHead)"/>`);
            svg.push(`<text x="${W - 12}" y="${fmt(sy(0) - 8)}" class="axis-label">x</text>`);
            svg.push(`<text x="${fmt(sx(0) + 8)}" y="${T - 2}" class="axis-label">y</text>`);
            svg.push(`<text x="${fmt(sx(0) - 7)}" y="${fmt(sy(0) + 17)}" class="tick-label o-label" text-anchor="end">O</text>`);
            // 曲線
            const colors = ['curve-1', 'curve-2'];
            fns.forEach((f, i) => {
                const d = [];
                for (let k = 0; k <= 200; k++) { const x = xMin + (xMax - xMin) * k / 200; d.push((k ? 'L' : 'M') + pt(x, f(x))); }
                svg.push(`<path d="${d.join(' ')}" class="function-curve ${colors[i]}" clip-path="url(#plotClip)"/>`);
            });
            // 曲線の名前：枠の中に入っている右のほうの場所に書く
            // 交点（2 曲線）・x軸との交点に点と座標
            const dots = [];
            if (fns.length > 1) { dots.push([a, fns[0](a)], [b, fns[0](b)]); }
            else if (axisOnly(question)) { dots.push([a, 0], [b, 0]); }
            else { const m = crossOf(question); if (m !== null) dots.push([m, 0]); }
            const labels = curvesOf(question).map(labelOf);
            const used = [];
            fns.forEach((f, i) => {
                for (let k = 0; k <= 40; k++) {
                    const x = xMax - (xMax - xMin) * (0.06 + k * 0.02);
                    const y = f(x), Y = sy(y);
                    if (Y < T + 14 || Y > H - B - 6) continue;
                    if (used.some(u => Math.abs(u - Y) < 18)) continue;
                    // 交点の座標の文字と重ならないように
                    if (dots.some(([dx, dy]) => Math.abs(sx(dx) - sx(x)) < 70 && Math.abs(sy(dy) - Y) < 26)) continue;
                    used.push(Y);
                    const anchor = sx(x) > W - 90 ? 'end' : 'start';
                    svg.push(`<text x="${fmt(sx(x) + (anchor === 'end' ? -4 : 6))}" y="${fmt(Y - 6)}" class="curve-label ${colors[i]}" text-anchor="${anchor}">${svgMath(pretty(labels[i]))}</text>`);
                    break;
                }
            });
            dots.forEach(([x, y]) => {
                svg.push(`<circle cx="${fmt(sx(x))}" cy="${fmt(sy(y))}" r="4" class="pt"/>`);
                const txt = fns.length > 1 ? `(${pretty(x)}, ${pretty(Math.round(y * 100) / 100)})` : '';
                if (txt) svg.push(`<text x="${fmt(sx(x) + (x === a ? -6 : 6))}" y="${fmt(sy(y) - 8)}" class="pt-label" text-anchor="${x === a ? 'end' : 'start'}">${txt}</text>`);
            });
            svg.push('</svg>');
            const holder = document.createElement('div');
            holder.className = 'graph-holder';
            holder.innerHTML = svg.join('');
            return holder;
        }


        const MIXED = ['linear_mixed1', 'linear_mixed2', 'linear_mixed3', 'parabola2', 'parabola_mixed1'];
        function kindOf(q) { return curvesOf(q).length > 1 ? 'between' : (crossOf(q) !== null ? 'cross' : isBelow(q) ? 'below' : axisOnly(q) ? 'axis' : 'simple'); }
        function hintOf(q) {
            const k = kindOf(q);
            if (k === 'below') return '💡 グラフが x軸より下にあるときは、定積分の値が負になる。− をつけて面積（正の値）にしよう。' + (axisOnly(q) ? '範囲は x軸との交点。' : '');
            if (k === 'axis') return '💡 範囲は x軸との交点。y = 0 とおいて x を求めよう。';
            if (k === 'between') return '💡 （上にあるグラフの式）−（下にあるグラフの式）を、交点から交点まで積分しよう。交点は 2つの式を = でむすんで求める。';
            if (k === 'cross') return '💡 x軸より下の部分には「−」をつける。範囲は x軸との交点で分けよう。';
            if (currentMode === 'free-input') return `💡 x = ${pretty(q.integralMin)} から x = ${pretty(q.integralMax)} まで積分する。原始関数 F(x) を求めて F(${pretty(q.integralMax)}) − F(${pretty(q.integralMin)}) を計算しよう。`;
            return `💡 範囲は x = ${pretty(q.integralMin)} から x = ${pretty(q.integralMax)}。下端が下、上端が上の欄に入るよ。`;
        }
        // 先生の解説の文を表示用に（「+∫…」の + は取る、∫₀² を上端・下端の形に）
        function explainText(s) {
            return formatIntegral(String(s).replace(/上側の面積には「\+」を選びます。/g, '').replace(/(^|[\s、])\+∫/g, '$1∫'));
        }
        function showExplanation(q, withTeacher) {
            const el = document.getElementById('explanation');
            el.innerHTML = '<h4>解説</h4>' + (withTeacher && q.explanation ? `<p>${explainText(q.explanation)}</p>` : '') +
                `<div class="calc">${withTeacher ? '<b>面積を計算すると</b><br>' : ''}${calcHTML(q)}</div>`;
            el.classList.remove('hidden');
        }
        function setFeedback(cls, html) {
            const f = document.getElementById('feedback');
            f.className = 'feedback ' + cls;
            f.removeAttribute('style');
            f.innerHTML = html;
        }
        function finishQuestion() {
            answered = true;
            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('show-answer-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        // ---------- 入力式 ----------
        function checkInputsAutomatic() { tryInput(false); }
        function readInput(q) {
            const box = document.getElementById('integral-builder-container');
            const get = id => { const el = box.querySelector('#' + id); return el ? nz(el.value) : ''; };
            const r = { lowerBound1: get('lower-bound-1'), upperBound1: get('upper-bound-1'), operator1: selectedOperator1, func1: selectedFunc1 };
            if (q.answer.secondIntegral) Object.assign(r, { lowerBound2: get('lower-bound-2'), upperBound2: get('upper-bound-2'), operator2: selectedOperator2 });
            return r;
        }
        const isNum = v => /^-?\d+$/.test(v);
        function inputComplete(u, q) {
            if (!isNum(u.lowerBound1) || !isNum(u.upperBound1) || !u.operator1 || !u.func1) return false;
            if (q.answer.secondIntegral && (!isNum(u.lowerBound2) || !isNum(u.upperBound2) || !u.operator2)) return false;
            return true;
        }
        function checkIntegralMatch(u, c) {
            const one = (lo, up, op, cc) => String(+lo) === cc.lowerBound && String(+up) === cc.upperBound && op === cc.operator;
            if (u.func1 !== c.function) return false;
            if (!c.secondIntegral) return one(u.lowerBound1, u.upperBound1, u.operator1, c);
            return (one(u.lowerBound1, u.upperBound1, u.operator1, c) && one(u.lowerBound2, u.upperBound2, u.operator2, c.secondIntegral)) ||
                (one(u.lowerBound1, u.upperBound1, u.operator1, c.secondIntegral) && one(u.lowerBound2, u.upperBound2, u.operator2, c));
        }
        // どの欄がちがうかを色で示す（2 つの積分の順番は、合っている欄が多いほうでくらべる）
        function markInput(u, c) {
            const box = document.getElementById('integral-builder-container');
            const mark = (sel, ok) => { const el = box.querySelector(sel); if (el) { el.classList.remove('correct', 'wrong'); el.classList.add(ok ? 'correct' : 'wrong'); } };
            const sets = [[c, c.secondIntegral]];
            if (c.secondIntegral) sets.push([c.secondIntegral, c]);
            let best = null, bestScore = -1;
            sets.forEach(([p, s]) => {
                const r = [String(+u.lowerBound1) === p.lowerBound, String(+u.upperBound1) === p.upperBound, u.operator1 === p.operator];
                if (s) r.push(String(+u.lowerBound2) === s.lowerBound, String(+u.upperBound2) === s.upperBound, u.operator2 === s.operator);
                const sc = r.filter(Boolean).length;
                if (sc > bestScore) { bestScore = sc; best = r; }
            });
            mark('#lower-bound-1', best[0]); mark('#upper-bound-1', best[1]); mark('#op-btn-1', best[2]);
            if (c.secondIntegral) { mark('#lower-bound-2', best[3]); mark('#upper-bound-2', best[4]); mark('#op-btn-2', best[5]); }
            mark('#func-btn-1', u.func1 === c.function);
        }
        function tryInput(explicit) {
            if (currentMode !== 'input' || answered) return;
            const q = currentQuestions[currentQuestion];
            const u = readInput(q);
            document.getElementById('question-text').classList.remove('correct-answer', 'incorrect-answer');
            if (!inputComplete(u, q)) {
                if (explicit) setFeedback('hint', 'まだ入っていない欄があります（範囲は数で、符号や式はタップしてえらぶ）');
                return;
            }
            if (checkIntegralMatch(u, q.answer)) {
                const box = document.getElementById('integral-builder-container');
                box.querySelectorAll('input, button').forEach(el => { el.classList.remove('wrong'); el.classList.add('correct'); el.disabled = true; });
                document.getElementById('question-text').classList.add('correct-answer');
                setFeedback('correct', '🎉 素晴らしい！ 正解です！');
                showExplanation(q, true);
                finishQuestion();
            } else if (explicit) {
                missedSet.add(currentQuestion);
                markInput(u, q.answer);
                document.getElementById('question-text').classList.add('incorrect-answer');
                setFeedback('incorrect', `✗ 赤いところがちがいます。<div class="rule-hint">${hintOf(q)}</div>`);
            }
        }
        function funcLabel(s) { return pretty(formatFunctionDisplay(s)); }
        function buildIntegralInputs(question) {
            const container = document.getElementById('integral-builder-container');
            const a = question.answer;
            selectedOperator1 = a.secondIntegral ? null : '+';
            selectedOperator2 = null;
            selectedFunc1 = a.altFunction ? null : a.function;
            const one = (k, fn) => {
                const op = a.secondIntegral ? `<button type="button" class="op-btn" id="op-btn-${k}" data-k="${k}" aria-label="符号（タップで ＋ と − が入れかわる）">±</button>` : '';
                const func = (k === 1 && a.altFunction)
                    ? `<button type="button" class="func-btn" id="func-btn-1" aria-label="積分する式（タップで入れかわる）">（上の式）−（下の式）</button>`
                    : `<span class="dx-label">${funcLabel(fn)}</span>`;
                return `<div class="int-group">${op}
                    <div class="integral-wrapper">
                        <span class="integral-symbol">∫</span>
                        <input type="text" id="lower-bound-${k}" class="bound-input bound-lower" inputmode="numeric" autocomplete="off" placeholder="下端" aria-label="下端">
                        <input type="text" id="upper-bound-${k}" class="bound-input bound-upper" inputmode="numeric" autocomplete="off" placeholder="上端" aria-label="上端">
                    </div>
                    ${func}<span class="dx-label">dx</span></div>`;
            };
            container.innerHTML = one(1, a.function) + (a.secondIntegral ? one(2, a.secondIntegral.function) : '');
            container.querySelectorAll('.op-btn').forEach(btn => btn.addEventListener('click', () => {
                if (answered) return;
                const v = btn.dataset.v === '+' ? '-' : '+';
                btn.dataset.v = v; btn.textContent = v === '+' ? '+' : '−';
                btn.classList.remove('wrong', 'correct');
                if (btn.dataset.k === '1') selectedOperator1 = v; else selectedOperator2 = v;
                tryInput(false);
            }));
            const fb = container.querySelector('.func-btn');
            if (fb) {
                const opts = [a.function, a.altFunction];
                fb.addEventListener('click', () => {
                    if (answered) return;
                    selectedFunc1 = selectedFunc1 === opts[0] ? opts[1] : opts[0];
                    fb.innerHTML = funcLabel(selectedFunc1);
                    fb.classList.remove('wrong', 'correct');
                    tryInput(false);
                });
            }
            container.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => { inp.classList.remove('wrong'); tryInput(false); });
                inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); tryInput(true); } });
            });
            document.getElementById('input-help').innerHTML =
                (a.secondIntegral ? '符号（±）はタップで ＋ と − が入れかわる。' : '') +
                (a.altFunction ? '積分する式もタップしてえらぼう。' : '') + '上端・下端には数を入れよう。';
        }

        // ---------- 問題の表示 ----------
        function displayQuestion() {
            const question = currentQuestions[currentQuestion];
            let questionText = question.text;
            if (MIXED.includes(question.graphType) && currentMode !== 'free-input') {
                questionText = questionText.replace('で囲まれた面積', 'で囲まれた2つの部分の面積の和');
            }
            if (currentMode === 'input' && question.level) {
                const levelClass = `level-${question.level > 3 ? 3 : question.level}`;
                const levelText = { 1: '基本', 2: '基本', 3: 'x軸の下', 4: '2つのグラフ' }[question.level];
                questionText += ` <span class="level-badge ${levelClass}">レベル${question.level}・${levelText}</span>`;
            }
            document.getElementById('question-number').textContent = `問題 ${currentQuestion + 1}`;
            window.scrollTo(0, 0);
            const qt = document.getElementById('question-text');
            qt.innerHTML = questionText;
            // 文の中の - を − に（タグの中は変えない）
            const tw = document.createTreeWalker(qt, NodeFilter.SHOW_TEXT, null);
            while (tw.nextNode()) tw.currentNode.nodeValue = pretty(tw.currentNode.nodeValue);
            qt.classList.remove('correct-answer', 'incorrect-answer');
            document.getElementById('progress-text').textContent = `問題 ${currentQuestion + 1} / ${currentQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${(currentQuestion / currentQuestions.length) * 100}%`;

            // 図は最初から見せる
            const graphArea = document.getElementById('graph-area');
            graphArea.innerHTML = '';
            graphArea.appendChild(createGraph(question));
            graphArea.classList.remove('hidden');
            document.getElementById('hint-btn').textContent = '👁️ 図をかくす';

            ['choice-container', 'input-container', 'free-input-container'].forEach(id => document.getElementById(id).classList.add('hidden'));
            if (currentMode === 'choice') {
                document.getElementById('choice-container').classList.remove('hidden');
                const shuffled = shuffleChoices(question);
                const choicesContainer = document.getElementById('choices');
                choicesContainer.innerHTML = '';
                shuffled.choices.forEach((choice, index) => {
                    const el = document.createElement('button');
                    el.type = 'button';
                    el.className = 'choice';
                    el.innerHTML = formatIntegral(choice);
                    el.onclick = () => selectChoice(index);
                    choicesContainer.appendChild(el);
                });
                currentQuestions[currentQuestion].shuffledCorrect = shuffled.correct;
            } else if (currentMode === 'input') {
                document.getElementById('input-container').classList.remove('hidden');
                buildIntegralInputs(question);
            } else {
                document.getElementById('free-input-container').classList.remove('hidden');
                ['area-num', 'area-den'].forEach(id => { const el = document.getElementById(id); el.value = ''; el.disabled = false; el.classList.remove('correct', 'wrong', 'reduce'); });
                if (!isTouch) setTimeout(() => document.getElementById('area-num').focus(), 100);
            }

            selectedChoice = -1;
            answered = false;
            const fb = document.getElementById('feedback');
            fb.className = 'feedback hidden';
            fb.removeAttribute('style');
            document.getElementById('explanation').classList.add('hidden');
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('check-btn').style.display = currentMode === 'choice' ? 'none' : 'inline-block';
            document.getElementById('show-answer-btn').style.display = 'inline-block';
        }

        function showHint() {
            const graphArea = document.getElementById('graph-area');
            const hidden = graphArea.classList.toggle('hidden');
            document.getElementById('hint-btn').textContent = hidden ? '💡 図を見る' : '👁️ 図をかくす';
        }

        // ---------- 選択式 ----------
        function selectChoice(index) {
            if (answered) return;
            selectedChoice = index;
            checkAnswer();
        }
        function checkAnswer() {
            if (selectedChoice === -1 || answered) return;
            const q = currentQuestions[currentQuestion];
            const choices = document.querySelectorAll('.choice');
            const qt = document.getElementById('question-text');
            if (selectedChoice === q.shuffledCorrect) {
                qt.classList.add('correct-answer'); qt.classList.remove('incorrect-answer');
                choices[selectedChoice].classList.add('correct');
                choices.forEach(c => { c.disabled = true; });
                setFeedback('correct', '🎉 素晴らしい！ 正解です！');
                showExplanation(q, true);
                finishQuestion();
            } else {
                qt.classList.add('incorrect-answer'); qt.classList.remove('correct-answer');
                const wrongEl = choices[selectedChoice];
                wrongEl.classList.add('wrong');
                wrongEl.disabled = true;   // 同じものを何度も押さないように
                missedSet.add(currentQuestion);
                selectedChoice = -1;
                setFeedback('incorrect', `✗ ちがいます。<div class="rule-hint">${hintOf(q)}</div>`);
                document.getElementById('explanation').classList.add('hidden');
            }
        }

        // ---------- 答え入力 ----------
        function readArea() {
            let n = nz(document.getElementById('area-num').value), d = nz(document.getElementById('area-den').value);
            if (n === '') return null;
            if (!/^-?\d+$/.test(n) || (d !== '' && !/^\d+$/.test(d)) || d === '0') return NaN;
            return [+n, d === '' ? 1 : +d];
        }
        function checkFreeInputAutomatic() { tryFree(false); }
        function checkFreeInput() { tryFree(true); }
        function tryFree(explicit) {
            if (currentMode !== 'free-input' || answered) return;
            const q = currentQuestions[currentQuestion];
            const inputs = [document.getElementById('area-num'), document.getElementById('area-den')];
            inputs.forEach(el => el.classList.remove('wrong', 'reduce'));
            const v = readArea();
            const A = [q.answer.numerator, q.answer.denominator];
            if (v === null || Number.isNaN(v)) {
                if (explicit) setFeedback('hint', v === null ? '面積の値を入れよう（整数なら分母は空らん）' : '数を入れよう');
                return;
            }
            const same = v[0] * A[1] === A[0] * v[1];
            if (same && gcd(v[0], v[1]) === 1) {
                inputs.forEach(el => { el.classList.add('correct'); el.disabled = true; });
                document.getElementById('question-text').classList.add('correct-answer');
                setFeedback('correct', '🎉 素晴らしい！ 正解です！');
                showExplanation(q, false);
                finishQuestion();
            } else if (!explicit) {
                return;
            } else if (same) {
                inputs.forEach(el => el.classList.add('reduce'));
                setFeedback('hint', 'おしい！ 値は合っています。約分しよう');
            } else {
                missedSet.add(currentQuestion);
                inputs.forEach(el => el.classList.add('wrong'));
                document.getElementById('question-text').classList.add('incorrect-answer');
                setFeedback('incorrect', '✗ ちがいます。' + (v[0] < 0 ? '<div class="rule-hint">💡 面積は正の値。x軸より下の部分には − をつけて正にしよう。</div>' : `<div class="rule-hint">${hintOf(q)}</div>`));
            }
        }

        // ---------- 答えを見る（3 つのモード共通） ----------
        function showAnswer() {
            if (answered) return;
            missedSet.add(currentQuestion);
            const q = currentQuestions[currentQuestion];
            if (currentMode === 'choice') {
                const choices = document.querySelectorAll('.choice');
                choices.forEach(c => { c.disabled = true; });
                if (choices[q.shuffledCorrect]) choices[q.shuffledCorrect].classList.add('correct');
            } else if (currentMode === 'input') {
                const a = q.answer, box = document.getElementById('integral-builder-container');
                const set = (id, v) => { const el = box.querySelector('#' + id); if (el) el.value = pretty(v); };
                set('lower-bound-1', a.lowerBound); set('upper-bound-1', a.upperBound);
                const ob1 = box.querySelector('#op-btn-1'); if (ob1) ob1.textContent = a.operator === '-' ? '−' : '+';
                if (a.secondIntegral) {
                    set('lower-bound-2', a.secondIntegral.lowerBound); set('upper-bound-2', a.secondIntegral.upperBound);
                    const ob2 = box.querySelector('#op-btn-2'); if (ob2) ob2.textContent = a.secondIntegral.operator === '-' ? '−' : '+';
                }
                const fb = box.querySelector('#func-btn-1'); if (fb) fb.innerHTML = funcLabel(a.function);
                box.querySelectorAll('input, button').forEach(el => { el.classList.remove('wrong'); el.classList.add('correct'); el.disabled = true; });
            } else {
                const n = document.getElementById('area-num'), d = document.getElementById('area-den');
                n.value = q.answer.numerator; d.value = q.answer.denominator === 1 ? '' : q.answer.denominator;
                [n, d].forEach(el => { el.classList.remove('wrong', 'reduce'); el.classList.add('correct'); el.disabled = true; });
            }
            document.getElementById('question-text').classList.remove('incorrect-answer');
            setFeedback('shown', '📖 答えを表示しました');
            showExplanation(q, currentMode !== 'free-input');
            finishQuestion();
        }

        const MATH_RUN = /[A-Za-zαβ0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉₋'′()=+\-−·×÷/.,<>[\]{}|∫≦≧ ]*[A-Za-zαβ0-9∫][A-Za-zαβ0-9ⁿ⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉₋'′()=+\-−·×÷/.,<>[\]{}|∫≦≧ ]*/g;
        function mathify(root) {
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode, p = n.parentElement;
                if (!p || p.closest('.m, .no-math, .level-badge, script, style, svg, button.tap, .sign-btn, .nb-sign, .op-btn')) continue;
                if (/[A-Za-zαβ0-9∫]/.test(n.nodeValue)) nodes.push(n);
            }
            nodes.forEach(n => {
                const s = n.nodeValue, frag = document.createDocumentFragment();
                let last = 0;
                s.replace(MATH_RUN, (run, at) => {
                    const lead = run.match(/^\s*/)[0].length, text = run.trim();
                    frag.appendChild(document.createTextNode(s.slice(last, at + lead)));
                    const span = document.createElement('span');
                    span.className = 'm';
                    text.split(/([A-Za-zαβ]+)/).forEach((part, k) => {
                        if (!part) return;
                        if (k % 2) {
                            // dx の d は立体、x は斜体
                            const dx = part.match(/^d([a-z])$/);
                            if (dx) span.appendChild(document.createTextNode('d'));
                            const i = document.createElement('i');
                            i.textContent = dx ? dx[1] : part;
                            span.appendChild(i);
                        } else {
                            span.appendChild(document.createTextNode(part.replace(/-/g, '−')));   // マイナスは数式の「−」に
                        }
                    });
                    frag.appendChild(span);
                    last = at + lead + text.length;
                    return run;
                });
                frag.appendChild(document.createTextNode(s.slice(last)));
                n.parentNode.replaceChild(frag, n);
            });
        }
        // 画面が書きかわるたびに、指定した場所の式を整える
        function watchMath(selectors) {
            let queued = false;
            const run = () => { queued = false; selectors.forEach(sel => document.querySelectorAll(sel).forEach(mathify)); };
            run();
            new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } })
                .observe(document.body, { childList: true, subtree: true, characterData: true });
        }
        watchMath(['#question-text', '#choices', '#integral-builder-container', '#input-help', '.input-label', '.area-answer', '#feedback', '#explanation']);   // 【ブラッシュアップ】式の書き方
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= currentQuestions.length) {
                showCompletion();
            } else {
                displayQuestion();
            }
        }

        function showCompletion() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('completion').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';

            const config = window.elementSdk?.config || defaultConfig;
            // 【ブラッシュアップ】
            lastMode = currentMode;
            const n = currentQuestions.length;
            const self = n - missedSet.size;
            document.getElementById('completion-title').textContent = self === n ? '全問正解おめでとう！' : 'おつかれさま！';
            document.getElementById('completion-message').innerHTML = `<div class="final-score">一発正解 ${self} / ${n} 問</div>` +
                (self === n ? '面積を定積分で表す流れ（図 → 上下と交点 → 式 → 計算）がしっかりできています。' : 'まちがえた問題は、図で「どちらが上か」「どこで分けるか」をたしかめてから、もう一度やってみよう！');
            window.scrollTo(0, 0);
        }

        async function onConfigChange(config) {
            document.getElementById('quiz-title').textContent = config.quiz_title || defaultConfig.quiz_title;
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
                ["success_message", config.success_message || defaultConfig.success_message],
                ["completion_message", config.completion_message || defaultConfig.completion_message]
            ]);
        }

        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }
        document.querySelectorAll('.choice-count').forEach(e => e.textContent = choiceQuestions.length);   // 【ブラッシュアップ】
    </script>
 <script>
