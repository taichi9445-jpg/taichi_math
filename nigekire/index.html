<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>にげきれ！ドロボウ</title>
<meta name="theme-color" content="#7fd0ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
  :root { --ink:#2b2d42; --sub:#6b7190; --card:#ffffff; --pink:#ff6b9d; --yellow:#ffc93c; --green:#3ecf8e; --blue:#4d96ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body { background:linear-gradient(180deg,#7fd0ff 0%,#bfeaff 45%,#e9f8ff 100%) fixed; color:var(--ink); font:16px/1.5 'M PLUS Rounded 1c',-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; font-weight:500; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font:inherit; color:inherit; border:0; cursor:pointer; touch-action:manipulation; }
  .wrap { max-width:520px; margin:0 auto; padding:10px 12px 110px; }
  h1 { margin:6px 0 2px; font-size:34px; font-weight:800; text-align:center; color:#fff; text-shadow:0 3px 0 #2f7fd1, 0 6px 12px rgba(0,0,0,.15); letter-spacing:.04em; }
  .sub { text-align:center; color:#2f6aa8; font-weight:800; margin:0 0 6px; }
  .hero { font-size:58px; text-align:center; margin-top:14px; line-height:1; }
  .card { margin:12px 0; padding:14px; border-radius:22px; background:var(--card); box-shadow:0 6px 0 rgba(47,106,168,.18), 0 10px 24px rgba(47,106,168,.12); }
  .btn { display:block; width:100%; min-height:56px; margin:10px 0; padding:10px 14px; border-radius:18px; background:#eef3ff; color:#2f5fb0; font-size:19px; font-weight:800; box-shadow:0 5px 0 #c9d6f5; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #c9d6f5; }
  .btn.y { background:var(--yellow); color:#5a3d00; box-shadow:0 5px 0 #d99c00; }
  .btn.g { background:var(--green); color:#fff; box-shadow:0 5px 0 #23a26b; }
  .btn.b { background:var(--blue); color:#fff; box-shadow:0 5px 0 #2c6fd6; }
  .btn.ghost { background:#fff; color:var(--sub); box-shadow:0 4px 0 #dfe6f3; font-weight:500; font-size:16px; min-height:46px; }
  .btn:disabled { opacity:.45; }
  input.code { width:100%; height:64px; border-radius:18px; border:3px solid #cfe0ff; background:#f6f9ff; color:var(--ink); font:800 34px 'M PLUS Rounded 1c',sans-serif; text-align:center; letter-spacing:.35em; }
  .muted { color:var(--sub); font-size:14px; }
  .center { text-align:center; }
  .top { display:flex; align-items:center; gap:8px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:30px; background:#fff; font-weight:800; font-size:14px; box-shadow:0 3px 0 rgba(47,106,168,.18); }
  .dot { width:10px; height:10px; border-radius:50%; background:#ff5c5c; } .dot.on { background:var(--green); }
  .role-thief { background:var(--yellow); color:#5a3d00; } .role-police { background:var(--blue); color:#fff; }
  .qbtn { margin-left:auto; width:40px; height:40px; border-radius:50%; background:#fff; font-weight:800; color:#2f6aa8; box-shadow:0 3px 0 rgba(47,106,168,.18); }
  .turn { margin:10px 0 0; padding:12px 14px; border-radius:22px; text-align:center; font-weight:800; font-size:20px; color:#fff; }
  .turn.me { background:linear-gradient(180deg,#ff7aa8,#ff5c8f); box-shadow:0 5px 0 #d4417a; animation:pop .35s ease-out; }
  .turn.wait { background:#fff; color:var(--sub); font-size:17px; box-shadow:0 5px 0 rgba(47,106,168,.15); }
  .turn small { display:block; font-size:13px; font-weight:500; opacity:.9; }
  @keyframes pop { 0% { transform:scale(.92); } 70% { transform:scale(1.04); } 100% { transform:scale(1); } }
  .rounds { display:flex; align-items:center; gap:4px; margin:14px 2px 0; }
  .rounds b { font-size:14px; color:#2f6aa8; margin-right:4px; white-space:nowrap; }
  .rd { flex:1; height:12px; border-radius:6px; background:rgba(255,255,255,.75); }
  .rd.done { background:#9ec5ff; } .rd.now { background:var(--yellow); box-shadow:0 0 0 2px #fff, 0 0 10px var(--yellow); }
  .rd.six { position:relative; } .rd.six::after { content:"6"; position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:800; color:#ff5c8f; }
  svg.board { display:block; width:100%; height:auto; margin:12px 0 0; border-radius:26px; box-shadow:0 8px 0 #4f9f4a, 0 14px 30px rgba(0,0,0,.18); user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .em { font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:5; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); box-shadow:0 -6px 20px rgba(47,106,168,.15); border-radius:22px 22px 0 0; }
  .bar .in { max-width:520px; margin:0 auto; }
  .bar p { margin:0 0 8px; text-align:center; font-weight:800; color:#2f5fb0; }
  .bar .btn { margin:0; }
  .helis { display:flex; gap:8px; }
  .hb { flex:1; min-height:48px; border-radius:16px; font-weight:800; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.18); border:3px solid transparent; }
  .hb.sel { border-color:#2b2d42; transform:translateY(-2px); }
  .hb.used { opacity:.35; box-shadow:none; }
  .log { margin:12px 0 0; padding:10px 14px; list-style:none; border-radius:18px; background:rgba(255,255,255,.75); font-size:14px; color:var(--sub); }
  .log li { padding:3px 0; } .log li b { color:var(--ink); font-weight:500; }
  .big { font-size:52px; font-weight:800; letter-spacing:.25em; text-align:center; margin:2px 0 6px; color:#2f6aa8; }
  .result { display:block; font-size:28px; font-weight:800; }
  .modal { position:fixed; inset:0; z-index:9; background:rgba(20,40,80,.45); display:flex; align-items:flex-end; justify-content:center; }
  .modal .sheet { width:100%; max-width:520px; max-height:88vh; overflow:auto; padding:18px 18px 26px; border-radius:26px 26px 0 0; background:#fff; }
  .modal h2 { margin:10px 0 6px; font-size:19px; color:#2f6aa8; }
  .modal ol { padding-left:22px; margin:6px 0; } .modal li { margin:6px 0; }
  .toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); z-index:8; transform:translateX(-50%); padding:12px 22px; border-radius:40px; background:#fff; color:var(--ink); font-weight:800; font-size:18px; white-space:nowrap; box-shadow:0 6px 0 rgba(47,106,168,.2), 0 10px 26px rgba(0,0,0,.18); }
  @keyframes glow { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  .glow { animation:glow 1s ease-in-out infinite; }
  .dots::after { content:"…"; animation:glow 1s infinite; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="act"></div>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ===========================================================================
   にげきれ！ドロボウ — ドロボウ（1人）と警察ヘリ3機（1人）の、かくれて追いかけるゲーム。
   2台のスマホで同じ部屋番号に入って遊ぶ。通信は公開の MQTT 中継（2か所に同時につなぎ、早く届いた方を使う）。
   速さのくふう：
   - ドロボウの通り道（tr）も両方のスマホに送る（警察の画面には出さない）。調べた結果は警察のスマホがその場で決める
   - さわったらすぐ動く（決定ボタンなし）。いどう・かくれるは「もどす」でやり直せる
   - 画面にもどったら、すぐつなぎ直して最新を受けとる
   ?net=bc を付けると、同じパソコンの中だけで通信する（動作確認用）。?id=xx で自分の番号を決める（同上）
   ========================================================================= */
const N = 5, Q = 4, ROUNDS = 11, TOPIC = 'nigekire-tm2/';
const HELI = [['あお', '#4d96ff', '#2c6fd6'], ['オレンジ', '#ff8c42', '#d9661c'], ['むらさき', '#9b6bff', '#7446d6']];
const COLS = 'ABCDE';
const SPOT = ['🏠', '🏪', '🏫', '🍰', '🏥', '🏦', '🌳', '🏨', '☕', '🏬', '🎡', '🍜', '⛲', '🏢', '🍦', '🏤', '🎪', '🏡', '🍔', '🌻', '🏛️', '🍕', '🏟️', '🎮', '🍩'];
const TILE = ['#ffe3ec', '#fff1c9', '#dff7e8', '#e3efff', '#f1e6ff', '#ffe9dc'];
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const qs = new URLSearchParams(location.search);
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const me = qs.get('id') || ls.get('nk.id') || (() => { const v = 'p' + Math.random().toString(36).slice(2, 10); ls.set('nk.id', v); return v; })();

// ---- 盤：ビル 5×5（A1〜E5）、交差点 4×4 ----
const bName = b => COLS[b % N] + (Math.floor(b / N) + 1);
const bNbr = b => { const x = b % N, y = Math.floor(b / N), o = []; if (x > 0) o.push(b - 1); if (x < N - 1) o.push(b + 1); if (y > 0) o.push(b - N); if (y < N - 1) o.push(b + N); return o; };
const xBld = k => { const i = k % Q + 1, j = Math.floor(k / Q) + 1; return [(j - 1) * N + i - 1, (j - 1) * N + i, j * N + i - 1, j * N + i]; };
const xNbr = k => { const i = k % Q, j = Math.floor(k / Q), o = []; if (i > 0) o.push(k - 1); if (i < Q - 1) o.push(k + 1); if (j > 0) o.push(k - Q); if (j < Q - 1) o.push(k + Q); return o; };
const xPos = k => [(k % Q + 1) * 100, (Math.floor(k / Q) + 1) * 100];
const bc = b => [(b % N) * 100 + 50, Math.floor(b / N) * 100 + 50];

// ---- 通信 ----
const Net = {
  room: null, cl: [], seen: new Set(), up: false,
  open(room, onMsg, onStatus) {
    this.room = room; const base = TOPIC + room;
    const deliver = d => { if (!d || !d.id || this.seen.has(d.id)) return; this.seen.add(d.id); onMsg(d); }; this.deliver = deliver;
    if (qs.get('net') === 'bc') {
      const ch = new BroadcastChannel(base); ch.onmessage = e => deliver(e.data); this.cl = [{ bc: ch }];
      this.up = true; onStatus(true); setTimeout(() => this.onConnect && this.onConnect(), 30); return;
    }
    const upd = () => { const u = this.cl.some(x => x.m && x.m.connected); if (u !== this.up) { this.up = u; onStatus(u); } };
    if (!window.mqtt) { onStatus(false); return; }
    BROKERS.forEach(url => {
      let c; try { c = mqtt.connect(url, { clientId: 'nk' + Math.random().toString(36).slice(2, 12), clean: true, connectTimeout: 8000, reconnectPeriod: 1000, keepalive: 20 }); } catch (e) { return; }
      c.on('connect', () => { c.subscribe(base + '/#', { qos: 0 }, () => { upd(); this.onConnect && this.onConnect(); }); });
      ['close', 'offline', 'end'].forEach(ev => c.on(ev, upd)); c.on('error', () => {});
      c.on('message', (t, p) => { try { deliver(JSON.parse(p.toString())); } catch (e) {} });
      this.cl.push({ m: c });
    });
  },
  // 画面にもどったら、待たずにすぐつなぎ直す
  wake() { this.cl.forEach(x => { if (x.m && !x.m.connected) { try { x.m.reconnect(); } catch (e) {} } }); },
  send(kind, obj) {
    const d = Object.assign({ id: me + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), from: me, t: kind }, obj);
    this.seen.add(d.id);
    const topic = TOPIC + this.room + '/' + (kind === 'state' ? 'state' : 'msg'), body = JSON.stringify(d);
    if (P2P.dc && P2P.dc.readyState === 'open' && kind !== 'sig') { try { P2P.dc.send(body); } catch (e) {} }
    this.cl.forEach(x => { if (x.bc) x.bc.postMessage(d); else if (x.m.connected) x.m.publish(topic, body, { qos: 0, retain: kind === 'state' }); });
  }
};
// ---- 2台を直接つなぐ（WebRTC）。つながれば中継を通らないので速い。だめなら中継だけで続ける ----
const P2P = {
  pc: null, dc: null, peer: null, busy: false, tries: 0, timer: null,
  ice: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }, { urls: 'stun:stun.cloudflare.com:3478' }],
  ok() { return this.dc && this.dc.readyState === 'open'; },
  ensure(peer, deliver) {
    this.deliver = deliver;
    if (!window.RTCPeerConnection || qs.get('net') === 'bc' || !peer) return;
    if (this.ok() && this.peer === peer) return;
    this.peer = peer;
    if (me < peer && !this.busy && this.tries < 6) this.offer();   // 番号の小さい方から呼びかける
  },
  reset() { try { this.dc && this.dc.close(); } catch (e) {} try { this.pc && this.pc.close(); } catch (e) {} this.pc = null; this.dc = null; },
  make() {
    this.reset();
    const pc = new RTCPeerConnection({ iceServers: this.ice }); this.pc = pc;
    pc.ondatachannel = e => this.bind(e.channel);
    pc.onconnectionstatechange = () => { if (['failed', 'closed', 'disconnected'].indexOf(pc.connectionState) >= 0 && pc === this.pc) { this.dc = null; render(); } };
    return pc;
  },
  bind(dc) {
    this.dc = dc;
    dc.onopen = () => { this.busy = false; this.tries = 0; render(); if (S) Net.send('state', { s: S }); };
    dc.onclose = () => { if (this.dc === dc) { this.dc = null; render(); } };
    dc.onmessage = e => { try { this.deliver(JSON.parse(e.data)); } catch (x) {} };
  },
  gathered(pc) { return new Promise(res => { if (pc.iceGatheringState === 'complete') return res(); const t = setTimeout(res, 1500); pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } }); }); },
  async offer() {
    this.busy = true; this.tries++;
    try {
      const pc = this.make(); this.bind(pc.createDataChannel('g', { ordered: true }));
      await pc.setLocalDescription(await pc.createOffer()); await this.gathered(pc);
      Net.send('sig', { to: this.peer, kind: 'offer', sdp: pc.localDescription.sdp });
    } catch (e) {}
    clearTimeout(this.timer); this.timer = setTimeout(() => { this.busy = false; if (!this.ok() && this.peer) this.ensure(this.peer, this.deliver); }, 8000);
  },
  async onSig(d) {
    if (d.to !== me) return;
    try {
      if (d.kind === 'offer') {
        const pc = this.make(); this.peer = d.from;
        await pc.setRemoteDescription({ type: 'offer', sdp: d.sdp });
        await pc.setLocalDescription(await pc.createAnswer()); await this.gathered(pc);
        Net.send('sig', { to: d.from, kind: 'answer', sdp: pc.localDescription.sdp });
      } else if (d.kind === 'answer' && this.pc && this.pc.signalingState === 'have-local-offer') await this.pc.setRemoteDescription({ type: 'answer', sdp: d.sdp });
    } catch (e) {}
  }
};

// ---- ゲームの状態（両方のスマホに同じもの。tr＝ドロボウの通り道。警察の画面には出さない） ----
let S = null, room = null, creating = false, joinTimer = null, notFound = false;
let place = [], selH = null, toastT = null, lastTurn = false, showLog = false, undo = null;
function fresh(players, gid) {
  return { v: 2, seq: 0, by: '', gid: gid || 1, phase: 'lobby', players: players, roles: null, round: 0, helis: [null, null, null], acted: [false, false, false], tr: [], found: [], empty: [], log: [], winner: null, reason: '', last: null };
}
const myRole = () => !S || !S.roles ? null : S.roles.thief === me ? 'thief' : S.roles.police === me ? 'police' : null;
const inRoom = () => S && S.players.indexOf(me) >= 0;
const log = (s, t) => { s.log.push({ r: s.round, t: t }); if (s.log.length > 80) s.log.shift(); };

function adopt(s) {
  if (!s || s.v !== 2) return;
  if (S && (s.seq < S.seq || (s.seq === S.seq && s.by <= S.by))) return;
  const before = S; S = s; ls.set('nk.state.' + room, S); window.__adopt = Date.now();
  if (before && before.phase !== S.phase) selH = null;
  if (undo && undo.seq !== S.seq) undo = null;
  if (S.last && S.last.seq === S.seq && (!before || before.seq !== S.seq)) showResult(S.last);
  render(); react(); linkUp();
}
function commit(fn, canUndo) {
  const prev = S, s = JSON.parse(JSON.stringify(S)); fn(s); s.seq = S.seq + 1; s.by = me;
  if (s.last && s.last.fresh) { s.last.seq = s.seq; delete s.last.fresh; }
  S = s; ls.set('nk.state.' + room, S); window.__commit = Date.now();
  Net.send('state', { s: S });
  undo = canUndo ? { seq: S.seq, prev: prev } : null;
  if (S.last && S.last.seq === S.seq) showResult(S.last);
  render(); react();
}
function doUndo() {
  if (!undo || undo.seq !== S.seq) return;
  const p = undo.prev; undo = null;
  commit(s => { Object.keys(p).forEach(k => { if (k !== 'seq' && k !== 'by') s[k] = JSON.parse(JSON.stringify(p[k])); }); log(s, 'ひとつもどした'); });
}
function onMsg(d) {
  if (d.t === 'state') adopt(d.s);
  else if (d.t === 'hello' && S && d.from !== me) Net.send('state', { s: S });
  else if (d.t === 'sig') P2P.onSig(d);
}
function linkUp() { if (S && S.players.length === 2 && inRoom()) P2P.ensure(S.players.find(p => p !== me), Net.deliver); }
function react() {
  if (S && S.phase === 'lobby' && !inRoom() && S.players.length < 2) commit(s => { s.players.push(me); log(s, '2人そろった！'); });
}
// ドロボウが今かくれられるビル（たて・よこのとなり。自分の通ったビルは×）
function legalOf(s) {
  const t = s.tr;
  if (!t.length) return Array.from({ length: N * N }, (_, i) => i);
  return bNbr(t[t.length - 1]).filter(b => t.indexOf(b) < 0);
}
function endIfDone(s) {
  if (s.phase === 'over' || !s.acted.every(Boolean)) return;
  if (s.round >= ROUNDS) { s.phase = 'over'; s.winner = 'thief'; s.reason = ROUNDS + 'ラウンド、にげきった！'; log(s, 'ドロボウがにげきった！'); return; }
  s.round++; s.phase = 'thief'; s.acted = [false, false, false];
  if (!legalOf(s).length) { s.phase = 'over'; s.winner = 'police'; s.reason = 'ドロボウがかこまれて、にげられるビルがなくなった'; log(s, 'ドロボウはもう動けない！'); }
}

// ---- 部屋 ----
function openRoom(r, isNew) {
  room = r; creating = !!isNew; notFound = false;
  const saved = ls.get('nk.state.' + room); if (saved && saved.v === 2 && !isNew) S = saved;
  Net.onConnect = () => {
    Net.send('hello', {}); linkUp();
    if (creating) setTimeout(() => { if (!creating) return; creating = false; const s = fresh([me], (S ? S.gid : 0) + 1); s.seq = (S ? S.seq : 0) + 1; s.by = me; S = null; adopt(s); Net.send('state', { s: S }); history.replaceState(null, '', location.pathname + location.search + '#r=' + room); }, 900);
    else { if (S) react(); clearTimeout(joinTimer); joinTimer = setTimeout(() => { if (!S) { notFound = true; render(); } }, 7000); }
  };
  Net.open(room, onMsg, () => render());
  render();
}
function leave() { location.hash = ''; location.reload(); }

// ---- 画面 ----
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(t) { if (!t) return; clearTimeout(toastT); document.querySelectorAll('.toast').forEach(e => e.remove()); $('modal').insertAdjacentHTML('beforeend', '<div class="toast">' + esc(t) + '</div>'); toastT = setTimeout(() => document.querySelectorAll('.toast').forEach(e => e.remove()), 1800); }
function showResult(l) {
  if (l.res === 'none') toast('🙅 ' + bName(l.b) + ' にはいなかった');
  else if (l.res === 'trace') toast('👣 ' + bName(l.b) + ' に' + (l.kind === 'start' ? 'スタートの足あと！' : l.kind === 'mid' ? '6ラウンド目の足あと！' : '足あと発見！'));
  else if (l.res === 'car') toast('🚨 つかまえた！');
}
function head() {
  const role = myRole();
  return '<div class="top"><span class="chip"><span class="dot' + (Net.up || P2P.ok() ? ' on' : '') + '"></span>部屋 ' + room + (P2P.ok() ? ' ⚡' : '') + '</span>' + (role ? '<span class="chip role-' + role + '">' + (role === 'thief' ? '🦹 ドロボウ' : '👮 けいさつ') + '</span>' : '') + '<button class="qbtn" id="rules">？</button></div>';
}

function render() {
  const app = $('app'), act = $('act');
  if (!room) {
    app.innerHTML = '<div class="hero em">🦹🏙️🚁</div><h1>にげきれ！ドロボウ</h1><p class="sub">ドロボウ vs ヘリ3機の けいさつ</p>' +
      '<div class="card"><button class="btn y" id="mk">部屋をつくる</button><p class="muted center" style="margin:0">4けたの番号が出るので、あいてに伝えよう</p></div>' +
      '<div class="card"><input class="code" id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"><button class="btn g" id="join">番号で部屋に入る</button></div>' +
      '<button class="btn ghost" id="rules">あそびかた</button>';
    act.innerHTML = '';
    $('mk').onclick = () => { const r = String(Math.floor(1000 + Math.random() * 9000)); location.hash = 'r=' + r + '&new'; openRoom(r, true); };
    $('join').onclick = () => { const v = $('code').value.replace(/\D/g, ''); if (v.length !== 4) { toast('4けたの番号を入れてね'); return; } location.hash = 'r=' + v; openRoom(v, false); };
    $('code').onkeydown = e => { if (e.key === 'Enter') $('join').click(); };
    $('rules').onclick = rules;
    return;
  }
  if (!S || !inRoom() && S.players.length >= 2 && S.phase === 'lobby') {
    app.innerHTML = head() + '<div class="card center">' + (!S ? (notFound ? '<p class="em" style="font-size:40px;margin:6px 0">🔍</p><p>部屋 ' + room + ' が見つからないよ</p><p class="muted">番号を確かめるか、あいてに部屋をつくってもらってね</p><button class="btn b" id="retry">もう一度さがす</button>' : '<p class="em" style="font-size:40px;margin:6px 0">📡</p><p class="dots">' + (creating ? '部屋をつくっています' : '部屋をさがしています') + '</p>') : '<p>この部屋は、もう2人そろっています</p>') + '<button class="btn ghost" id="home">はじめの画面へ</button></div>';
    act.innerHTML = '';
    if ($('retry')) $('retry').onclick = () => { notFound = false; Net.wake(); Net.send('hello', {}); render(); clearTimeout(joinTimer); joinTimer = setTimeout(() => { if (!S) { notFound = true; render(); } }, 7000); };
    $('home').onclick = leave; $('rules').onclick = rules; return;
  }
  if (S.phase === 'lobby') {
    const two = S.players.length >= 2;
    app.innerHTML = head() + '<div class="card center"><p class="muted" style="margin:0">部屋の番号</p><p class="big">' + room + '</p>' +
      (two ? '<p style="font-weight:800;margin:0">🎉 2人そろった！ 役を決めよう</p>' : '<p class="dots" style="margin:0 0 6px">あいてを待っています（1 / 2人）</p><button class="btn b" id="share">あいてに番号を送る</button>') + '</div>' +
      (two ? '<div class="card"><button class="btn y" data-role="thief">🦹 わたしがドロボウ</button><button class="btn b" data-role="police">👮 わたしがけいさつ</button><button class="btn ghost" data-role="rand">🎲 くじ引きで決める</button></div>' : '') +
      '<button class="btn ghost" id="home">部屋を出る</button>';
    act.innerHTML = '';
    if ($('share')) $('share').onclick = share;
    app.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
      const other = S.players.find(p => p !== me), want = b.dataset.role === 'rand' ? (Math.random() < .5 ? 'thief' : 'police') : b.dataset.role;
      commit(s => { s.roles = want === 'thief' ? { thief: me, police: other } : { thief: other, police: me }; s.phase = 'setup'; log(s, '役が決まった！'); });
    });
    $('home').onclick = leave; $('rules').onclick = rules; return;
  }
  // ---- ゲーム中 ----
  const role = myRole(), r = S.round, myTurn = isMyTurn();
  if (S.phase === 'police' && role === 'police' && (selH === null || S.acted[selH])) { const f = S.acted.indexOf(false); selH = f >= 0 ? f : null; }
  if (myTurn && !lastTurn) { try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} }
  lastTurn = myTurn;
  document.title = (myTurn ? '🔔 あなたの番 - ' : '') + 'にげきれ！ドロボウ';
  let turn;
  if (S.phase === 'over') turn = '<div class="turn me" style="' + (S.winner === 'police' ? 'background:linear-gradient(180deg,#5aa6ff,#3b82f6);box-shadow:0 5px 0 #2c6fd6' : 'background:linear-gradient(180deg,#ffd45c,#ffb800);box-shadow:0 5px 0 #d99c00;color:#5a3d00') + '"><span class="result">' + (S.winner === 'police' ? '👮 けいさつの勝ち！' : '🦹 ドロボウの勝ち！') + '</span><small>' + esc(S.reason) + '</small></div>';
  else if (myTurn) turn = '<div class="turn me">' + (S.phase === 'setup' ? '🚁 ヘリを3機おこう' : S.phase === 'thief' ? (r === 1 ? '🦹 かくれるビルをタップ！' : '🦹 となりのビルへにげよう！') : '🚁 ヘリを動かすか、ビルを調べよう！') + '<small>' + (S.phase === 'setup' ? '交差点（道の交わるところ）をタップ' : S.phase === 'thief' ? 'キラキラしているビルをタップ' : '光っているビルで「調べる」、光っている交差点で「いどう」') + '</small></div>';
  else turn = '<div class="turn wait"><span class="dots">' + (S.phase === 'setup' ? 'けいさつがヘリを置いています' : S.phase === 'thief' ? 'ドロボウがにげています' : 'けいさつがさがしています') + '</span></div>';
  const rounds = S.phase === 'setup' ? '' : '<div class="rounds"><b>ラウンド ' + Math.min(r, ROUNDS) + ' / ' + ROUNDS + '</b>' + Array.from({ length: ROUNDS }, (_, i) => '<span class="rd' + (i + 1 < r || (S.phase === 'over' && i + 1 <= r) ? ' done' : i + 1 === r ? ' now' : '') + (i === 5 ? ' six' : '') + '"></span>').join('') + '</div>';
  const logs = S.log.slice().reverse().slice(0, showLog ? 60 : 3).map(l => '<li>' + (l.r ? 'R' + l.r + '　' : '') + '<b>' + esc(l.t) + '</b></li>').join('');
  app.innerHTML = head() + turn + rounds + board() + '<ul class="log">' + logs + (S.log.length > 3 ? '<li><button class="btn ghost" style="min-height:36px;margin:6px 0 0" id="more">' + (showLog ? '記録をとじる' : '記録をぜんぶ見る') + '</button></li>' : '') + '</ul>' +
    (S.phase === 'over' ? '<button class="btn y" id="again">🔁 もう一回（役を交代）</button><button class="btn ghost" id="home">部屋を出る</button>' : '');
  $('rules').onclick = rules;
  if ($('more')) $('more').onclick = () => { showLog = !showLog; render(); };
  if ($('again')) $('again').onclick = () => commit(s => { const n = fresh(s.players, s.gid + 1); n.roles = { thief: s.roles.police, police: s.roles.thief }; n.phase = 'setup'; n.log = [{ r: 0, t: '新しいゲーム（役を交代）' }]; Object.keys(n).forEach(k => { if (k !== 'seq' && k !== 'by') s[k] = n[k]; }); });
  if ($('home')) $('home').onclick = leave;
  const svg = app.querySelector('svg.board'); if (svg) svg.addEventListener('click', tap);
  act.innerHTML = actionBar();
  bindAct();
}
function isMyTurn() {
  const role = myRole();
  return S && ((S.phase === 'setup' && role === 'police') || (S.phase === 'thief' && role === 'thief') || (S.phase === 'police' && role === 'police'));
}
function share() {
  const url = location.origin + location.pathname + '#r=' + room, text = 'にげきれ！ドロボウ　部屋の番号 ' + room;
  if (navigator.share) navigator.share({ title: 'にげきれ！ドロボウ', text: text, url: url }).catch(() => {});
  else { try { navigator.clipboard.writeText(text + '\n' + url); toast('コピーしたよ'); } catch (e) { toast(url); } }
}

// ---- 盤の絵（町の地図） ----
function emo(x, y, ch, size) { return '<text class="em" x="' + x + '" y="' + y + '" font-size="' + size + '" text-anchor="middle" dominant-baseline="central">' + ch + '</text>'; }
function board() {
  const role = myRole(), over = S.phase === 'over', showTr = role === 'thief' || over;
  const t = showTr ? S.tr : [], L = role === 'thief' && S.phase === 'thief' ? legalOf(S) : [];
  let s = '<svg class="board" viewBox="-14 -14 528 528" role="img" aria-label="町の地図">';
  s += '<rect x="-14" y="-14" width="528" height="528" rx="30" fill="#8bd17c"/><rect x="-2" y="-2" width="504" height="504" rx="22" fill="#c9ced8"/>';
  for (let i = 1; i < N; i++) s += '<path d="M' + i * 100 + ' 4V496M4 ' + i * 100 + 'H496" stroke="#fff" stroke-width="3" stroke-dasharray="12 12" stroke-linecap="round"/>';
  // ビル（お店や家）
  for (let b = 0; b < N * N; b++) {
    const x = (b % N) * 100 + 11, y = Math.floor(b / N) * 100 + 11, w = 78, ok = L.indexOf(b) >= 0;
    s += '<g data-b="' + b + '"><rect x="' + x + '" y="' + (y + 5) + '" width="' + w + '" height="' + w + '" rx="18" fill="rgba(0,0,0,.12)"/>' +
      '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + w + '" rx="18" fill="' + TILE[(b * 5 + 2) % TILE.length] + '" stroke="#fff" stroke-width="4"/>' +
      emo(x + w / 2, y + w / 2 - 4, SPOT[b], 38) +
      '<rect x="' + (x + w - 30) + '" y="' + (y + w - 22) + '" width="26" height="18" rx="9" fill="#fff" opacity=".9"/><text x="' + (x + w - 17) + '" y="' + (y + w - 8.5) + '" font-size="12" font-weight="800" text-anchor="middle" fill="#6b7190">' + bName(b) + '</text>';
    if (ok) s += '<rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="' + (w + 8) + '" height="' + (w + 8) + '" rx="21" fill="none" stroke="#ffc93c" stroke-width="7" class="glow"/>';
    s += '</g>';
  }
  // 調べてなにもなかったビル（このラウンドと前のラウンド）
  S.empty.filter(e => e.r >= S.round - 1).forEach(e => { const [x, y] = bc(e.b); s += '<g pointer-events="none" opacity="' + (e.r === S.round ? 1 : .55) + '"><circle cx="' + (x - 24) + '" cy="' + (y - 24) + '" r="15" fill="#fff"/>' + emo(x - 24, y - 23, '❌', 16) + '</g>'; });
  // 見つかった足あと
  S.found.forEach(f => { const [x, y] = bc(f.b), col = f.kind === 'start' ? '#ffc93c' : f.kind === 'mid' ? '#ff5c8f' : '#4d96ff'; s += '<g pointer-events="none"><circle cx="' + (x - 22) + '" cy="' + (y - 22) + '" r="19" fill="' + col + '" stroke="#fff" stroke-width="3"/>' + emo(x - 22, y - 21, '👣', 20) + (f.kind !== 'trace' ? '<circle cx="' + (x - 4) + '" cy="' + (y - 38) + '" r="10" fill="#fff"/><text x="' + (x - 4) + '" y="' + (y - 34) + '" font-size="12" font-weight="800" text-anchor="middle" fill="' + col + '">' + (f.kind === 'start' ? 'S' : '6') + '</text>' : '') + '</g>'; });
  // ドロボウの通り道（ドロボウの画面だけ・おわったら両方）
  if (t.length) {
    s += '<path d="' + t.map((b, i) => { const [x, y] = bc(b); return (i ? 'L' : 'M') + x + ' ' + y; }).join('') + '" fill="none" stroke="#ff5c8f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 14" pointer-events="none"/>';
    t.forEach((b, i) => { if (i === t.length - 1) return; const [x, y] = bc(b); s += '<g pointer-events="none"><circle cx="' + (x + 26) + '" cy="' + (y - 26) + '" r="12" fill="#ff5c8f" stroke="#fff" stroke-width="2.5"/><text x="' + (x + 26) + '" y="' + (y - 21.5) + '" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">' + (i + 1) + '</text></g>'; });
    const [tx, ty] = bc(t[t.length - 1]); s += '<g pointer-events="none"><circle cx="' + tx + '" cy="' + ty + '" r="30" fill="#ffc93c" stroke="#fff" stroke-width="4"/>' + emo(tx, ty + 1, '🦹', 36) + '</g>';
  }
  // 警察：調べられるビル・動ける交差点
  if (role === 'police' && S.phase === 'police' && selH !== null && !S.acted[selH]) {
    const hk = S.helis[selH], col = HELI[selH][1];
    xBld(hk).forEach(b => { const x = (b % N) * 100 + 11, y = Math.floor(b / N) * 100 + 11; s += '<g pointer-events="none"><rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="86" height="86" rx="21" fill="none" stroke="' + col + '" stroke-width="6" class="glow"/><circle cx="' + (x + 66) + '" cy="' + (y + 12) + '" r="13" fill="' + col + '"/>' + emo(x + 66, y + 13, '🔍', 15) + '</g>'; });
    xNbr(hk).filter(k => S.helis.indexOf(k) < 0).forEach(k => { const [x, y] = xPos(k); s += '<circle cx="' + x + '" cy="' + y + '" r="16" fill="' + col + '" stroke="#fff" stroke-width="4" class="glow" pointer-events="none"/>'; });
  }
  // 交差点（さわれる場所は大きめ）
  for (let k = 0; k < Q * Q; k++) { const [x, y] = xPos(k); s += '<circle cx="' + x + '" cy="' + y + '" r="6" fill="#fff" opacity=".9" pointer-events="none"/><circle data-k="' + k + '" cx="' + x + '" cy="' + y + '" r="24" fill="transparent"/>'; }
  // ヘリ
  const hs = S.phase === 'setup' && role === 'police' ? place : S.helis;
  hs.forEach((k, h) => {
    if (k === null || k === undefined) return;
    const [x, y] = xPos(k), used = S.phase === 'police' && S.acted[h], sel = role === 'police' && S.phase === 'police' && selH === h;
    s += '<g data-h="' + h + '" opacity="' + (used ? .55 : 1) + '">' + (sel ? '<circle cx="' + x + '" cy="' + y + '" r="31" fill="#fff" opacity=".85"/>' : '') +
      '<circle cx="' + x + '" cy="' + y + '" r="25" fill="' + HELI[h][1] + '" stroke="#fff" stroke-width="4"/>' + emo(x, y + 1, '🚁', 28) +
      '<circle cx="' + (x + 19) + '" cy="' + (y + 18) + '" r="10" fill="#fff"/><text x="' + (x + 19) + '" y="' + (y + 22.5) + '" font-size="13" font-weight="800" text-anchor="middle" fill="' + HELI[h][2] + '">' + (h + 1) + '</text></g>';
  });
  return s + '</svg>';
}

// ---- さわったら、すぐ動く ----
function tap(e) {
  const g = e.target.closest('[data-b],[data-k],[data-h]'); if (!g || !S) return;
  const role = myRole();
  const b = g.dataset.b !== undefined ? +g.dataset.b : null, k = g.dataset.k !== undefined ? +g.dataset.k : null, h = g.dataset.h !== undefined ? +g.dataset.h : null;
  if (S.phase === 'setup' && role === 'police') {
    const kk = k !== null ? k : h !== null ? place[h] : null; if (kk === null) return;
    const at = place.indexOf(kk);
    if (at >= 0) place.splice(at, 1); else if (place.length < 3) place.push(kk); else toast('ヘリは3機まで。置いたヘリをタップでとり消し');
    render(); return;
  }
  if (S.phase === 'thief' && role === 'thief' && b !== null) {
    if (legalOf(S).indexOf(b) < 0) { toast('キラキラしているビルだけ！'); return; }
    commit(s => { s.tr.push(b); s.phase = 'police'; s.acted = [false, false, false]; log(s, s.round === 1 ? 'ドロボウがかくれた' : 'ドロボウがにげた'); }, true);
    return;
  }
  if (S.phase === 'police' && role === 'police') {
    if (h !== null) { if (S.acted[h]) { toast('ヘリ' + (h + 1) + 'はもう動いたよ'); return; } selH = h; render(); return; }
    if (selH === null) return;
    const hh = selH, hk = S.helis[hh], nm = 'ヘリ' + (hh + 1);
    if (k !== null) {
      if (xNbr(hk).indexOf(k) < 0 || S.helis.indexOf(k) >= 0) { toast('となりの、あいている交差点へ動けるよ'); return; }
      commit(s => { s.helis[hh] = k; s.acted[hh] = true; log(s, nm + '：いどう'); endIfDone(s); }, true);
      return;
    }
    if (b !== null) {
      if (xBld(hk).indexOf(b) < 0) { toast(nm + 'のまわりの4つのビルを調べられるよ'); return; }
      commit(s => {
        s.acted[hh] = true;
        const t = s.tr, cur = t[t.length - 1], idx = t.indexOf(b);
        if (b === cur) { s.phase = 'over'; s.winner = 'police'; s.reason = nm + 'が ' + bName(b) + ' でドロボウを見つけた！'; s.last = { fresh: 1, b: b, res: 'car' }; log(s, nm + '：' + bName(b) + ' → ドロボウ発見！'); return; }
        if (idx >= 0) {
          const kind = idx === 0 ? 'start' : idx === 5 ? 'mid' : 'trace';
          if (!s.found.some(f => f.b === b)) s.found.push({ b: b, kind: kind });
          s.last = { fresh: 1, b: b, res: 'trace', kind: kind };
          log(s, nm + '：' + bName(b) + ' → ' + (kind === 'start' ? 'スタートの足あと！' : kind === 'mid' ? '6ラウンド目の足あと！' : '足あと！'));
        } else { s.empty.push({ b: b, r: s.round }); s.last = { fresh: 1, b: b, res: 'none' }; log(s, nm + '：' + bName(b) + ' → いない'); }
        endIfDone(s);
      });
    }
  }
}
function actionBar() {
  if (!S) return '';
  const role = myRole(), wrap = x => '<div class="bar"><div class="in">' + x + '</div></div>';
  const canUndo = undo && undo.seq === S.seq && S.phase !== 'over';
  const undoBtn = canUndo ? '<button class="btn ghost" id="undo" style="margin-top:8px">↩ もどす（いまの動きをやり直す）</button>' : '';
  if (S.phase === 'setup' && role === 'police') return wrap('<p>ヘリを置こう（' + place.length + ' / 3）</p><button class="btn g" id="go"' + (place.length < 3 ? ' disabled' : '') + '>🚁 この場所でスタート！</button>');
  if (S.phase === 'police' && role === 'police' && selH !== null) {
    return wrap('<div class="helis">' + HELI.map((c, h) => '<button class="hb' + (h === selH ? ' sel' : '') + (S.acted[h] ? ' used' : '') + '" data-ch="' + h + '" style="background:' + c[1] + '"' + (S.acted[h] ? ' disabled' : '') + '>🚁 ' + (h + 1) + (S.acted[h] ? ' ✓' : '') + '</button>').join('') + '</div>' + undoBtn);
  }
  if (canUndo) return wrap(undoBtn);
  return '';
}
function bindAct() {
  const go = $('go'), un = $('undo');
  if (un) un.onclick = doUndo;
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { selH = +b.dataset.ch; render(); });
  if (go) go.onclick = () => { if (S.phase === 'setup' && myRole() === 'police' && place.length === 3) { const p = place.slice(); place = []; commit(s => { s.helis = p; s.phase = 'thief'; s.round = 1; log(s, 'ヘリを置いてスタート！'); }); } };
}
function rules() {
  $('modal').innerHTML = '<div class="modal" id="mm"><div class="sheet"><h2 style="margin-top:0">🦹 あそびかた 🚁</h2>' +
    '<p>ドロボウ1人とけいさつ1人の対戦。それぞれ自分のスマホで遊びます。ドロボウのいる場所は、けいさつの画面には出ません。</p>' +
    '<h2>はじめかた</h2><ol><li>1人が「部屋をつくる」→ 4けたの番号をあいてに伝える</li><li>あいては番号を入れて部屋に入る</li><li>役を決めたら、けいさつがヘリ3機を交差点に置く</li></ol>' +
    '<h2>1ラウンドの流れ（ぜんぶで ' + ROUNDS + ' ラウンド）</h2><ol><li><b>ドロボウの番</b>：1ラウンド目は好きなビルにかくれる。2ラウンド目からは、たて・よこにとなりのビルへ必ず1つ動く（ななめは×）。一度かくれたビルには足あとが残るので、もう入れない。</li>' +
    '<li><b>けいさつの番</b>：ヘリ3機が1回ずつ動く（どのヘリからでもOK）。<br>・<b>いどう</b>：となりの交差点へ（ほかのヘリがいる所は×）<br>・<b>しらべる</b>：ヘリのまわりの4つのビルから1つ</li></ol>' +
    '<h2>しらべると…</h2><ol><li>🚨 ドロボウがいた → けいさつの勝ち！</li><li>👣 足あとがあった → 地図に出る（<b>S</b>＝スタート地点、<b>6</b>＝6ラウンド目にいたビル）</li><li>❌ いなかった → ×がつく</li></ol>' +
    '<h2>勝ち負け</h2><ol><li>けいさつ：' + ROUNDS + 'ラウンドが終わるまでにドロボウを見つける。ドロボウが動けなくなっても勝ち。</li><li>ドロボウ：' + ROUNDS + 'ラウンドにげきる。</li></ol>' +
    '<p class="muted">タップするとすぐ動きます。まちがえたら「もどす」でやり直せます（調べたあとは もどせません）。通信が切れても、同じ部屋の番号で開けば続きから遊べます。</p>' +
    '<button class="btn b" id="mc">とじる</button></div></div>';
  $('mc').onclick = () => { $('modal').innerHTML = ''; };
  $('mm').onclick = e => { if (e.target.id === 'mm') $('modal').innerHTML = ''; };
}

// ---- はじめ ----
(function () {
  const m = location.hash.match(/r=(\d{4})/);
  if (m) openRoom(m[1], /&new/.test(location.hash)); else render();
  const back = () => { if (!document.hidden && room) { Net.wake(); setTimeout(() => Net.send('hello', {}), 300); } };
  document.addEventListener('visibilitychange', back); window.addEventListener('pageshow', back); window.addEventListener('focus', back);
})();
</script>
</body>
